# Certification catalog, in the priority order from docs/09_CERTIFICATION_OBJECTIVES.md.
# Objective codes follow the vendors' published exam outlines (Security+ SY0-701,
# CySA+ CS0-003; SC-900 and SC-200 skills-measured areas). Re-check them when an
# exam version changes.

- id: secplus
  name: CompTIA Security+
  exam_code: SY0-701
  priority: 1
  objectives:
    - {code: "1.1", title: "Compare and contrast various types of security controls"}
    - {code: "1.2", title: "Summarize fundamental security concepts"}
    - {code: "1.3", title: "Explain the importance of change management processes and the impact to security"}
    - {code: "1.4", title: "Explain the importance of using appropriate cryptographic solutions"}
    - {code: "2.1", title: "Compare and contrast common threat actors and motivations"}
    - {code: "2.2", title: "Explain common threat vectors and attack surfaces"}
    - {code: "2.3", title: "Explain various types of vulnerabilities"}
    - {code: "2.4", title: "Given a scenario, analyze indicators of malicious activity"}
    - {code: "2.5", title: "Explain the purpose of mitigation techniques used to secure the enterprise"}
    - {code: "3.1", title: "Compare and contrast security implications of different architecture models"}
    - {code: "3.2", title: "Given a scenario, apply security principles to secure enterprise infrastructure"}
    - {code: "3.3", title: "Compare and contrast concepts and strategies to protect data"}
    - {code: "3.4", title: "Explain the importance of resilience and recovery in security architecture"}
    - {code: "4.1", title: "Given a scenario, apply common security techniques to computing resources"}
    - {code: "4.2", title: "Explain the security implications of proper hardware, software, and data asset management"}
    - {code: "4.3", title: "Explain various activities associated with vulnerability management"}
    - {code: "4.4", title: "Explain security alerting and monitoring concepts and tools"}
    - {code: "4.5", title: "Given a scenario, modify enterprise capabilities to enhance security"}
    - {code: "4.6", title: "Given a scenario, implement and maintain identity and access management"}
    - {code: "4.7", title: "Explain the importance of automation and orchestration related to secure operations"}
    - {code: "4.8", title: "Explain appropriate incident response activities"}
    - {code: "4.9", title: "Given a scenario, use data sources to support an investigation"}
    - {code: "5.1", title: "Summarize elements of effective security governance"}
    - {code: "5.2", title: "Explain elements of the risk management process"}
    - {code: "5.3", title: "Explain the processes associated with third-party risk assessment and management"}
    - {code: "5.4", title: "Summarize elements of effective security compliance"}
    - {code: "5.5", title: "Explain types and purposes of audits and assessments"}
    - {code: "5.6", title: "Given a scenario, implement security awareness practices"}

- id: sc900
  name: "Microsoft Security, Compliance, and Identity Fundamentals"
  exam_code: SC-900
  priority: 2
  objectives:
    - {code: "1", title: "Describe the concepts of security, compliance, and identity"}
    - {code: "2", title: "Describe the capabilities of Microsoft Entra"}
    - {code: "3", title: "Describe the capabilities of Microsoft security solutions"}
    - {code: "4", title: "Describe the capabilities of Microsoft compliance solutions"}

- id: sc200
  name: Microsoft Security Operations Analyst
  exam_code: SC-200
  priority: 3
  objectives:
    - {code: "1", title: "Manage a security operations environment"}
    - {code: "2", title: "Configure protections and detections"}
    - {code: "3", title: "Manage incident response"}
    - {code: "4", title: "Manage security threats (threat hunting)"}

- id: cysa
  name: CompTIA CySA+
  exam_code: CS0-003
  priority: 4
  objectives:
    - {code: "1.1", title: "Explain the importance of system and network architecture concepts in security operations"}
    - {code: "1.2", title: "Given a scenario, analyze indicators of potentially malicious activity"}
    - {code: "1.3", title: "Given a scenario, use appropriate tools or techniques to determine malicious activity"}
    - {code: "1.4", title: "Compare and contrast threat-intelligence and threat-hunting concepts"}
    - {code: "1.5", title: "Explain the importance of efficiency and process improvement in security operations"}
    - {code: "2.1", title: "Given a scenario, implement vulnerability scanning methods and concepts"}
    - {code: "2.2", title: "Given a scenario, analyze output from vulnerability assessment tools"}
    - {code: "2.3", title: "Given a scenario, analyze data to prioritize vulnerabilities"}
    - {code: "2.4", title: "Given a scenario, recommend controls to mitigate attacks and software vulnerabilities"}
    - {code: "2.5", title: "Explain concepts related to vulnerability response, handling, and management"}
    - {code: "3.1", title: "Explain concepts related to attack methodology frameworks"}
    - {code: "3.2", title: "Given a scenario, perform incident response activities"}
    - {code: "3.3", title: "Explain the preparation and post-incident activity phases of the incident management life cycle"}
    - {code: "4.1", title: "Explain the importance of vulnerability management reporting and communication"}
    - {code: "4.2", title: "Explain the importance of incident response reporting and communication"}
