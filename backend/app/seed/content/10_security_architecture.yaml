slug: security-architecture
title: Security Architecture
domain: Security Architecture
order: 10
description: >
  Design networks and systems to resist attack and keep running: segmentation,
  secure access, data protection, identity and resilience.
lessons:
  - slug: arch-network-design
    title: Secure Network Architecture and Segmentation
    order: 1
    difficulty: intermediate
    summary: Design a segmented network with a screened subnet and least-privilege firewall rules, and verify it.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:3.1", "secplus:3.2", "secplus:4.5"]
    learning_objectives:
      - Compare architecture models and explain their security implications
      - Design network segmentation with a screened subnet and VLANs
      - Write and verify least-privilege firewall rules between zones
    theory: |
      Where systems run changes their risk. **On-premises** gives full control and
      responsibility. **Cloud** shifts some to the provider under the shared responsibility
      model. **Hybrid** and **multi-cloud** add integration complexity. **Serverless**,
      **microservices**, **containers**, **IoT**, **ICS/SCADA** and **embedded** systems each
      have their own exposure; ICS and embedded devices often cannot be patched, so they are
      isolated instead.

      **Segmentation** limits how far an attacker can move. A **screened subnet** (historically
      a DMZ) holds internet-facing services between two firewalls, so a compromised web server
      cannot reach the internal network directly. **VLANs** separate traffic logically;
      **microsegmentation** isolates individual workloads. Management interfaces sit on a
      separate network reached through a **jump server** or bastion host. **Air-gapped**
      networks have no connection at all.

      Controls that enforce the design: **firewalls** (packet-filtering, stateful,
      next-generation), **web application firewalls**, **IPS/IDS**, **network access control
      (NAC)**, **proxies**, and secure protocols. The guiding ideas are **least privilege**
      (allow only what is needed), **defence in depth** (layered controls) and **deny by
      default** (block everything, then permit specific flows). A rule set should end with an
      explicit deny and be documented so anyone can see why each flow is allowed.
    examples:
      - title: A deny-by-default rule set
        body: |
          # Zones: INTERNET, DMZ (web), INTERNAL (db), MGMT
          allow INTERNET -> DMZ:443         # public HTTPS
          allow DMZ      -> INTERNAL:5432   # web app to database only
          allow MGMT     -> any:22          # admins via jump host
          deny  any      -> any             # explicit default deny, logged
      - title: Why a screened subnet helps
        body: |
          Attacker compromises the web server in the DMZ.
          With segmentation, the only path onward is DMZ -> INTERNAL:5432.
          The attacker cannot reach file shares, domain controllers or workstations.
    exercise:
      title: Build and test a segmented network in your lab
      environment: VirtualBox/VMware with three VMs and two internal networks (or pfSense as the firewall)
      tools: [pfSense or Linux with nftables/iptables, nmap, a diagram tool]
      steps:
        - Draw the target design: INTERNET, a DMZ holding one web VM, and an INTERNAL network holding one database VM, separated by a firewall VM.
        - Create two host-only/internal networks and attach the web VM to the DMZ and the database VM to INTERNAL; give the firewall VM an interface on each.
        - On the firewall, write deny-by-default rules that allow only INTERNET->DMZ:443 and DMZ->INTERNAL on the database port.
        - From the web VM, confirm you can reach the database port but not other internal ports (`nmap` the internal host).
        - From the DMZ, attempt to reach an internal service that should be blocked and confirm the firewall denies and logs it.
        - Add a management rule allowing SSH only from a jump host, and confirm direct admin access from the DMZ is blocked.
        - Export the firewall log entries that show allowed and denied flows and annotate your diagram with the final rules.
      deliverable: The network diagram, the firewall rule set, and nmap/log evidence that allowed flows work and blocked flows are denied.
    expected_outcome: >
      You can design a least-privilege, deny-by-default segmented network and prove with
      scans and logs that lateral movement is contained.
    quiz:
      - prompt: A screened subnet (DMZ) exists mainly to
        options:
          - Speed up internet access
          - Separate internet-facing services from the internal network
          - Store backups
          - Replace a firewall
        answer: 1
        explanation: It isolates public-facing servers so a compromise there cannot directly reach internal systems.
      - prompt: 'A "deny by default" firewall rule set means it'
        options:
          - Allows everything, then blocks a few things
          - Blocks everything, then allows only specific required flows
          - Has no final rule
          - Logs nothing
        answer: 1
        explanation: Starting from a full block and permitting only needed flows enforces least privilege.
      - prompt: Why are ICS/SCADA and embedded devices often isolated rather than patched?
        options:
          - They are not valuable
          - They frequently cannot be updated without breaking operations
          - They have no vulnerabilities
          - They are always offline
        answer: 1
        explanation: Many cannot tolerate patching or downtime, so isolation is the practical control.
      - prompt: A jump server (bastion host) is used to
        options:
          - Host public websites
          - Provide a single controlled path to management interfaces
          - Store encryption keys
          - Run backups
        answer: 1
        explanation: Admins connect through it, so management access is funnelled and monitored.
      - prompt: Layering multiple independent controls is called
        options: [Least privilege, Defence in depth, Air gapping, Tokenization]
        answer: 1
        explanation: Defence in depth means no single control failure exposes the asset.

  - slug: arch-data-resilience
    title: Protecting Data and Designing for Resilience
    order: 2
    difficulty: intermediate
    summary: Classify and protect data by state and build a tested backup and recovery plan.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:3.3", "secplus:3.4", "secplus:4.1"]
    learning_objectives:
      - Classify data and protect it at rest, in transit and in use
      - Explain resilience concepts: redundancy, RTO/RPO, backups and site types
      - Build and test a backup following the 3-2-1 rule
    theory: |
      **Data classification** (public, private, sensitive, confidential, restricted, regulated)
      drives how strongly data is protected and who may see it. Data exists in three **states**,
      each needing different controls. **At rest**: full-disk or database encryption. **In
      transit**: TLS, VPNs. **In use**: harder, addressed by access control, memory protection
      and, increasingly, confidential computing. **Data Loss Prevention (DLP)** watches for
      sensitive data leaving the organisation. Other protections: **tokenization** (replace
      data with a non-sensitive token), **masking** (hide part of a value), **hashing**, and
      **geographic/sovereignty** rules about where data may be stored.

      **Resilience** keeps services running through failure. **Redundancy** removes single
      points of failure: RAID for disks, load balancers and clustering for servers, multiple
      power supplies and ISPs, **UPS** and generators for power. Measure recovery with **RTO**
      (how quickly you must be back) and **RPO** (how much data you can afford to lose).
      **Backups** follow the **3-2-1** rule: three copies, two media types, one offsite;
      **immutable** or offline backups resist ransomware. Recovery **sites** range from a
      **hot site** (ready now), through **warm**, to a **cold site** (space only). Plans are
      only real once **tested**: tabletop exercises, failover tests and restore drills.
    examples:
      - title: Controls by data state
        body: |
          Customer records (classification: regulated)
          At rest:     AES-256 database encryption + restricted DB role
          In transit:  TLS 1.3 between app and database
          In use:      row-level access control; masking of card numbers in the UI
          Leaving:     DLP rule blocks export of >100 records to personal email
      - title: RTO and RPO on a timeline
        body: |
          Last backup 02:00 ──(data created)── 09:15 FAILURE ──(recover)── 10:00 back up
          RPO = 09:15 - 02:00 = up to 7h15m of data lost  (so back up more often)
          RTO = 10:00 - 09:15 = 45m to restore service    (meets a 1h target)
    exercise:
      title: Build a tested 3-2-1 backup and classify its data
      environment: A Linux VM (or WSL) with some sample data files
      tools: [tar, sha256sum, gpg or openssl, a second USB/drive or a second folder as "offsite"]
      steps:
        - Create a folder of sample files and assign each a data classification (public, private, confidential).
        - Encrypt the confidential files at rest with `openssl enc -aes-256-cbc -pbkdf2` and record the command.
        - Make backup copy 1 as a tarball, and record a SHA-256 of it for integrity.
        - Make copy 2 on a different medium (a USB drive, a second virtual disk, or a clearly separate location) to satisfy "two media".
        - Make copy 3 in an "offsite" location (another machine, or a separate cloud/sync folder) to satisfy "one offsite".
        - Delete the originals to simulate a failure, restore from a backup, and verify the restored files match by comparing hashes.
        - Write an RTO and RPO for this data and state how often you would back up to meet the RPO.
      deliverable: Evidence of the three copies, the restore test with matching hashes, and your stated RTO/RPO with backup frequency.
    expected_outcome: >
      You can protect data in every state and produce a backup you have actually restored,
      with recovery targets you can defend.
    quiz:
      - prompt: Encrypting a laptop's drive protects data
        options: [In transit, At rest, In use, In motion]
        answer: 1
        explanation: Full-disk encryption protects stored data if the device is lost or stolen.
      - prompt: The 3-2-1 backup rule means
        options:
          - 3 backups daily, 2 weekly, 1 monthly
          - 3 copies, on 2 media types, with 1 offsite
          - 3 servers, 2 sites, 1 admin
          - 3 passwords, 2 factors, 1 key
        answer: 1
        explanation: Three copies on two kinds of media with one offsite survives most failures.
      - prompt: RPO measures
        options:
          - How quickly service must be restored
          - How much data loss is acceptable
          - How many backups exist
          - The cost of downtime
        answer: 1
        explanation: Recovery Point Objective is the maximum acceptable data loss, set by backup frequency.
      - prompt: A hot site differs from a cold site because it
        options:
          - Is in a warmer climate
          - Is fully equipped and ready to take over almost immediately
          - Has no power
          - Stores only backups
        answer: 1
        explanation: A hot site is operational and current; a cold site is just space and utilities.
      - prompt: Immutable or offline backups specifically protect against
        options: [Power loss, Ransomware encrypting the backups too, Slow networks, User error only]
        answer: 1
        explanation: Backups that cannot be altered or reached online survive ransomware that encrypts live data.
  - slug: arch-zero-trust
    title: Zero Trust and Identity-Centric Access
    order: 3
    difficulty: intermediate
    summary: Move from a perimeter mindset to zero trust, where every request is verified on identity, device and context, and design least-privilege access with microsegmentation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:3.2", "secplus:4.6"]
    learning_objectives:
      - Explain the zero-trust principles and why the perimeter model fails
      - Describe the control and data planes and per-request verification
      - Design least-privilege, identity-centric access with microsegmentation
    theory: |
      The old model trusted anything inside the network perimeter, so one foothold let
      an attacker move freely. **Zero trust** replaces that with **never trust, always
      verify**: there is no trusted inside, and every request is authenticated and
      authorised on its own merits. Three principles drive it: **verify explicitly**
      (check identity, device health and context every time), **least privilege** (grant
      only the access needed, for only as long as needed), and **assume breach** (design
      as if an attacker is already present, so you contain blast radius).

      Architecturally, zero trust splits into a **control plane** and a **data plane**.
      A **policy decision point** evaluates each request against policy, considering the
      **subject** (user or service identity), the **device** (managed, patched, healthy),
      and **context** (location, time, sensitivity of the resource). A **policy
      enforcement point** then allows, blocks or step-ups the request, for example by
      requiring MFA. Access is **per-session and per-request**, not a one-time gate at
      login, so a change in risk mid-session can revoke access. Strong **identity** is
      the new perimeter, which is why phishing-resistant MFA and conditional access sit
      at the centre.

      On the network, zero trust favours **microsegmentation**: fine-grained zones so a
      compromise in one workload cannot reach another, enforced by identity rather than
      IP alone. Remote access shifts from a flat **VPN** that drops users onto the LAN to
      brokered, per-application access, often delivered as **SASE/ZTNA**. None of this is
      a single product; it is a design applied in stages, usually starting with the most
      sensitive applications and the strongest identity controls, then widening coverage.
    examples:
      - title: Perimeter trust versus per-request verification
        body: |
          Perimeter:  on the VPN -> reach everything on the subnet
          Zero trust: each request checks identity + device health + context,
                      then grants only that one app, for that one session
      - title: A decision the policy engine makes
        body: |
          Request: user alice, unmanaged laptop, from new country, to finance app
          Decision: block (or require managed device + MFA step-up) ->
                    least privilege + verify explicitly + assume breach
    exercise:
      title: Design identity-centric access for a sensitive application
      environment: A written description of an app and its users (invent one, or use your workplace scenario) and a document or diagram tool
      tools: [A diagram or document tool, your notes on the earlier network-design lesson]
      steps:
        - Pick one sensitive application and list its user groups and the data it holds.
        - Write the zero-trust principles as rules for this app (verify explicitly, least privilege, assume breach) in your own words.
        - Define the signals a policy decision point should check for each request (identity, device health, location, resource sensitivity).
        - Specify at least three access policies, including one that requires an MFA step-up and one that blocks, with the condition for each.
        - Draw or describe the microsegmentation around the app so a compromise elsewhere cannot reach it.
        - Replace any flat VPN access in the scenario with brokered per-application access and explain the difference.
        - State how you would roll this out in stages and what you would monitor to confirm least privilege is working.
      deliverable: The app and user inventory, the zero-trust rules, the per-request signals, at least three access policies, and a microsegmentation design with a staged rollout.
    expected_outcome: >
      You can explain why the perimeter model fails and apply zero-trust principles to a
      real application, designing per-request verification, least-privilege access and
      microsegmentation with identity, not network location, as the control point.
    quiz:
      - prompt: The core idea of zero trust is
        options:
          - Trust everything inside the corporate network
          - Never trust, always verify every request on its own merits
          - Replace all passwords with longer passwords
          - Put every system on one flat network
        answer: 1
        explanation: Zero trust removes implicit inside-the-perimeter trust and authenticates and authorises each request individually.
      - prompt: In a zero-trust architecture, the policy decision point evaluates
        options:
          - Only the user's password
          - Identity, device health and context for each request
          - Only the source IP address
          - The time of day alone
        answer: 1
        explanation: Decisions combine subject identity, device posture and contextual signals, which is what verify explicitly means in practice.
      - prompt: Microsegmentation primarily limits
        options:
          - How fast the network runs
          - The blast radius, so a compromise in one workload cannot reach others
          - The number of users
          - Password length
        answer: 1
        explanation: Fine-grained segmentation contains a breach, supporting the assume-breach principle.
      - prompt: Compared with a flat VPN, zero-trust network access (ZTNA) provides
        options: [Access to the whole subnet after login, Brokered per-application access verified per request, A faster perimeter firewall, Shared admin accounts]
        answer: 1
        explanation: ZTNA brokers access to specific applications with per-request verification instead of dropping the user onto the internal network.

  - slug: arch-secure-applications-apis
    title: Designing Secure Applications and APIs
    order: 4
    difficulty: intermediate
    summary: Build security into an application and its APIs instead of bolting it on.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:2.3", "secplus:4.1"]
    learning_objectives:
      - Apply secure-design principles such as least privilege and defence in depth at the app layer
      - Explain how input validation, authentication and authorisation defend an API
      - Place protective controls like a WAF and a gateway in an application's architecture
    theory: |
      Most application weaknesses are design choices made early, so security belongs in the
      architecture, not in a patch later. A few principles do most of the work. **Defence in
      depth** means no single control is the only thing standing between an attacker and the data.
      **Least privilege** means each component and token can do only what it needs. **Fail
      securely** means an error denies access rather than granting it. **Validate input** on the
      server, because anything from the client can be forged.

      APIs deserve particular care because they expose the application's logic directly.
      **Authentication** proves who is calling, usually a token the gateway checks, and
      **authorisation** decides what that caller may do on each object, which is where broken
      access control creeps in. Validate and constrain every parameter, apply **rate limiting** to
      blunt abuse and brute force, and never trust an identifier just because it arrived in a
      request; check that the caller owns the object it names.

      Protective controls sit at the edges. An **API gateway** centralises authentication, rate
      limiting and logging. A **web application firewall (WAF)** filters common injection and
      scripting payloads before they reach the app. **Secrets** such as keys and database
      passwords live in a secrets manager, never in source code. None of these replace secure
      code, but together they give an attacker far fewer ways in and the defender a place to see
      and stop abuse.
    examples:
      - title: Authentication is not authorisation
        body: |
          GET /api/orders/1005   token valid for user 42
          User 42 is authenticated, but order 1005 belongs to user 88.
          Without an ownership check the API leaks another user's data.
      - title: A secret that should not be in code
        body: |
          db_password = "S3cr3t!" hard-coded in app.py
          Anyone with the source, including the git history, now has the database password.
          It belongs in a secrets manager and should be rotated.
    exercise:
      title: Threat-model a small API by design
      environment: A diagram or notes file; no running system required
      tools: [A sample API with two or three endpoints, a diagram or notes tool]
      steps:
        - Sketch a small API with a client, a gateway and a couple of endpoints, one of which returns a record by id.
        - For the record-by-id endpoint, write the authentication step and then the separate authorisation check that the caller owns the record.
        - List each input parameter and the server-side validation you would apply to it.
        - Mark where a WAF, rate limiting and request logging sit in the diagram.
        - Find every place a secret is used and state where it is stored instead of in code.
        - Walk one broken-access-control attack through your design and show which control stops it.
      deliverable: An annotated API diagram with the authentication and authorisation steps, input validation, placed controls, and secret storage called out.
    expected_outcome: >
      You can take a small application or API and show where authentication, authorisation,
      input validation and edge controls belong so that common attacks are designed out.
    quiz:
      - prompt: A request carries a valid token for user 42 but asks for an object owned by user 88. What stops the leak?
        options:
          - Authentication alone
          - An authorisation check that the caller owns the object
          - A faster database
          - A larger token
        answer: 1
        explanation: Authentication proves who is calling; only an ownership authorisation check stops them reaching another user's object.
      - prompt: Where should a database password live?
        options: [In the source code, In a secrets manager, In a code comment, In the client app]
        answer: 1
        explanation: Secrets belong in a secrets manager, never in source or the client, where anyone with the code can read them.
      - prompt: Input validation should be enforced
        options: [Only in the browser, On the server since client input can be forged, Never, Only in logs]
        answer: 1
        explanation: Client-side checks help usability but can be bypassed, so the server must validate every input.
      - prompt: What is the main job of an API gateway?
        options:
          - To style the user interface
          - "To centralise authentication, rate limiting and logging"
          - To store the database
          - To write the code
        answer: 1
        explanation: A gateway is a single edge point for authenticating callers, limiting request rates and logging access.

  - slug: arch-logging-monitoring
    title: Designing Logging and Monitoring Architecture
    order: 5
    difficulty: intermediate
    summary: Build the telemetry, integrity and coverage a SOC needs into the architecture.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "secplus:3.1", "cysa:1.1"]
    learning_objectives:
      - Decide what to log and where to centralise it for detection and investigation
      - Explain why log integrity, time synchronisation and coverage matter
      - Produce a monitoring coverage map and spot its blind spots
    theory: |
      Detection and investigation only work if the right telemetry reaches the right place
      reliably, and that is an architecture decision made early, not a scramble during an incident.
      The first choice is **what to log**: authentication, process and command execution, network
      connections, and administrative actions on every critical system. The second is **where it
      goes**, usually a central SIEM or log lake, so one query spans the estate instead of hunting
      box by box.

      Three properties decide whether that data can be trusted. **Log integrity** means logs are
      forwarded off the host and stored append-only, so an attacker who owns a machine cannot
      quietly erase their tracks. **Time synchronisation** through NTP, with everything stored in
      UTC, lets events from different systems line up on one timeline. **Coverage** means every
      asset that matters actually ships logs and you are alerted when a source goes silent, because
      a blind spot is where incidents hide. Retention has to meet both investigation needs and any
      compliance minimum, balancing hot, searchable storage against cheaper cold archive.

      The architecture also places the **sensors**, network taps or flow exporters, endpoint
      agents, cloud audit logging, and keeps secrets out of the logs themselves. The point is to
      design detective controls in from the start and to keep a living **coverage map** of what is
      and is not monitored, so the gaps are known rather than discovered the hard way.
    examples:
      - title: Why logs must leave the host
        body: |
          On-host only   attacker with root clears /var/log and the evidence is gone
          Forwarded      the same events already sit append-only in the central store
          Off-host, append-only storage is what makes logs trustworthy after a compromise.
      - title: A coverage-map blind spot
        body: |
          Shipping logs   domain controllers, firewalls, EDR
          Silent          the new payroll server (no agent, not onboarded)
          An asset that matters but ships nothing is exactly where an intrusion goes unseen.
    exercise:
      title: Design a monitoring coverage map for a small estate
      environment: A diagram or notes file describing a small set of systems; no running system needed
      tools: [A system inventory, a diagram or notes tool]
      steps:
        - List the critical systems in the sample estate and what each one does.
        - For each, decide which log types it should send (authentication, process, network, admin actions).
        - Choose where logs are centralised and how they are forwarded off the host.
        - State how you would guarantee log integrity and consistent timestamps across the systems.
        - Mark which systems currently ship logs and which are silent, and flag the blind spots.
        - Set a retention split between hot searchable storage and cold archive, with a compliance minimum in mind.
        - Add one alert that fires when an expected log source goes quiet.
      deliverable: A coverage map listing each system, its log types, where they go, the blind spots, and a silent-source alert.
    expected_outcome: >
      You can design what to log, where it goes and how it stays trustworthy, and keep a
      coverage map that makes monitoring blind spots visible before an incident finds them.
    quiz:
      - prompt: Why forward logs off the host to a central append-only store?
        options:
          - To save local disk only
          - So an attacker who compromises the host cannot erase the evidence
          - To slow down searches
          - To avoid time synchronisation
        answer: 1
        explanation: Off-host, append-only storage preserves the evidence even when the source machine is fully compromised.
      - prompt: Why store all log timestamps in UTC with synchronised clocks?
        options: [To use less storage, So events from different systems line up on one timeline, To hide the logs, To disable retention]
        answer: 1
        explanation: Consistent, synchronised UTC timestamps let events from many sources be correlated in the right order.
      - prompt: A critical asset that ships no logs is best described as
        options: [Well protected, A monitoring blind spot where incidents can hide, Fully compliant, A backup source]
        answer: 1
        explanation: Coverage gaps are exactly where an intrusion goes unseen, which is why silent sources must be flagged.
      - prompt: Detective controls such as logging and monitoring are best
        options:
          - Added after the first incident
          - Designed into the architecture from the start
          - Left to each user
          - Never documented
        answer: 1
        explanation: Building logging and monitoring in from the start means the telemetry exists before you need it.

  - slug: arch-key-management-secrets
    title: Designing Key Management and Secrets Architecture
    order: 6
    difficulty: intermediate
    summary: Decide where cryptographic keys and application secrets live, how they rotate, and who can reach them.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.4", "secplus:3.1", "secplus:4.1"]
    learning_objectives:
      - Explain why keys and secrets need a managed home rather than living in code or config
      - Describe the lifecycle of a key from generation through rotation to revocation
      - Choose where secrets live and who can reach them, following least privilege
    theory: |
      Cryptography only protects data if the **keys** are protected, and applications also hold
      **secrets**, database passwords, API tokens, certificates, that grant access. The most common
      architectural failure is keeping these in the wrong place: hard-coded in source, committed to
      a repository, or sitting in a plaintext config file. Once a secret is in version control it is
      effectively public to everyone with history access, so the first design decision is that keys
      and secrets live in a **managed store**, not in the code that uses them.

      A key has a **lifecycle**, and the architecture has to serve all of it. A key is **generated**
      with enough randomness, **stored** somewhere resistant to extraction (a secrets manager, or a
      hardware security module for the highest-value keys), **used** without the application ever
      seeing the raw key where possible, **rotated** on a schedule so a leaked key has a short useful
      life, and **revoked and destroyed** when it is compromised or retired. A design that can issue
      a key but has no story for rotating or revoking it is incomplete.

      The last piece is **access**: who, and what, can retrieve each secret. Least privilege applies
      to secrets as much as to users, so each service reads only the secrets it needs, access is
      authenticated and logged, and a human reading a production secret is an audited event, not a
      routine one. Short-lived, automatically issued credentials are safer than long-lived ones a
      person copies around. This builds on the earlier cryptography lesson, which covered how the
      algorithms work; here the subject is the architecture around the keys, where they live, how
      they move, and who can reach them.
    examples:
      - title: A secret in the wrong place
        body: |
          config.yml committed to git:  db_password: S3cr3t!
          A secret in version control is exposed to everyone with repo history; it belongs in a secrets store.
      - title: A short-lived issued credential
        body: |
          service requests a database credential at startup -> valid 1 hour -> auto-renewed
          A rotating, auto-issued credential limits the damage a leak can do far better than a static password.
    exercise:
      title: Design a key and secrets architecture on paper
      environment: A notes or diagram file for a small application with a database and an external API
      tools: [A notes or diagram tool, the application scenario]
      steps:
        - List every key and secret the application needs and where each one is used.
        - For each, state where it should live and why that store rather than code or config.
        - Describe the lifecycle for one key, generation, storage, use, rotation and revocation.
        - Define which service or person may read each secret, following least privilege, and how access is logged.
        - Decide which credentials should be short-lived and auto-issued rather than static.
        - Note one thing that would go wrong if a secret leaked, and how the design limits the damage.
      deliverable: A one-page secrets architecture listing each secret, its store, its lifecycle, and the access rules around it.
    expected_outcome: >
      You can design where keys and secrets live, define their lifecycle including rotation and
      revocation, and apply least privilege to who can reach them.
    quiz:
      - prompt: Why should secrets not be kept in source code or committed config?
        options:
          - It makes the code run slower
          - Once in version control they are exposed to everyone with history access, effectively public
          - Code cannot store text
          - It is against copyright law
        answer: 1
        explanation: A secret in version control history is readable by anyone with access to the repo, so it is no longer secret.
      - prompt: Rotating keys on a schedule matters because it
        options:
          - Makes keys longer
          - Limits how long a leaked key stays useful to an attacker
          - Changes the algorithm
          - Removes the need for access control
        answer: 1
        explanation: Regular rotation shortens the window in which a compromised key is valid.
      - prompt: Applying least privilege to secrets means
        options:
          - Every service can read every secret
          - Each service reads only the secrets it needs, with access authenticated and logged
          - Secrets are printed to the console
          - Only the newest secret is protected
        answer: 1
        explanation: Least privilege restricts each consumer to the secrets it actually requires, and logs the access.
      - prompt: How does this lesson differ from the earlier cryptography lesson?
        options: [It is the same, It is about the architecture around keys (where they live, rotate and who reaches them) rather than how the algorithms work, It only covers passwords, It ignores rotation]
        answer: 1
        explanation: The crypto lesson covered the algorithms; this one covers the key-management architecture around them.
  - slug: arch-identity-access-design
    title: Identity and Access Architecture
    order: 7
    difficulty: intermediate
    summary: Design the identity fabric a modern organisation runs on, covering single sign-on, federation, conditional access and privileged access, so identity becomes a controllable security boundary.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.6", "cysa:1.1"]
    learning_objectives:
      - Explain SSO and federation and the security trade-offs of centralised identity
      - Design conditional access that adapts to risk without blocking legitimate users
      - Architect privileged access so powerful accounts are controlled and auditable
    theory: |
      In a cloud-first organisation, identity is the control plane: once perimeters dissolve, *who* is
      asking and *under what conditions* decides access. **Single sign-on** lets a user authenticate
      once to an identity provider and reach many applications, which improves both usability and
      security because authentication, MFA and policy are enforced in one place instead of each app
      inventing its own. **Federation** (via SAML or OpenID Connect) extends this trust across
      organisations, letting a partner's users access a service with their own identity. The trade-off
      is concentration: the identity provider becomes a single high-value target, so it must be the most
      hardened system you run.

      Because access now hinges on identity, the policy has to be **adaptive**. **Conditional access**
      evaluates signals, user, device health, location, and a risk score, at sign-in and steps up or
      blocks accordingly: a sign-in from a managed device in the office passes quietly, while the same
      account from an unmanaged device in a new country is challenged for MFA or denied. Designed well,
      this raises security and reduces friction at the same time; designed badly, it locks people out or
      waves risk through.

      The most dangerous identities are **privileged** ones. Architecting for them means least privilege
      by default, **just-in-time** elevation instead of standing admin rights, separate admin accounts,
      and a **privileged access management** system that brokers, approves and records elevated sessions.
      The whole design is underpinned by the **identity lifecycle**, joiners, movers and leavers,
      because an account that keeps access after a role change or departure is exactly the gap attackers
      exploit. Good identity architecture turns "who can do what" from an unknowable sprawl into a policy
      you can state, enforce and audit.
    examples:
      - title: Conditional access adapting to risk
        body: |
          Managed device + office IP + low risk   -> allow, no extra prompt
          Unmanaged device + new country + risky   -> require MFA or block
          One policy, different outcomes by signal.
      - title: Standing admin versus just-in-time
        body: |
          Standing:  20 permanent global admins -> huge, always-on attack surface
          JIT:       elevate to admin for 2h with approval, auto-expire, fully logged
          Fewer standing privileges means fewer accounts worth stealing.
    exercise:
      title: Design an identity and access architecture for a sample org
      environment: A described sample organisation (apps, user groups, partners, admins) and a diagramming or document tool
      tools: [A diagram or document tool, a sample org description, identity-provider documentation for reference]
      steps:
        - Map the sample org's applications and user groups and show how SSO through one identity provider would connect them.
        - Identify one partner or external access need and describe how federation would meet it and what trust it establishes.
        - Design three conditional-access rules using signals (device, location, risk) and state the outcome (allow, step-up MFA, block) for each.
        - Define how privileged access would work, separate admin accounts, just-in-time elevation and approval, and session recording.
        - Describe the joiner-mover-leaver process for one role change and how it prevents lingering access.
        - Identify the biggest risk your centralised design introduces (the identity provider as a single target) and one way you would harden it.
      deliverable: An identity-architecture outline with the SSO and federation design, three conditional-access rules, the privileged-access approach, a lifecycle process, and the top risk with its mitigation.
    expected_outcome: >
      You can design an identity fabric with SSO, federation, conditional access and privileged-access
      controls, make identity an adaptive and auditable security boundary, and account for the
      concentration risk that centralised identity creates.
    quiz:
      - prompt: A security benefit of single sign-on is that
        options:
          - Users never need passwords
          - Authentication, MFA and policy are enforced in one place instead of each app doing its own
          - It removes the identity provider
          - It disables logging
        answer: 1
        explanation: Centralising authentication lets strong, consistent controls be enforced once rather than reinvented per app.
      - prompt: Conditional access improves security by
        options:
          - Blocking everyone
          - Evaluating signals like device, location and risk at sign-in and stepping up or blocking accordingly
          - Removing MFA
          - Storing more logs
        answer: 1
        explanation: Adaptive policy applies the right challenge for the risk, raising security while keeping low-risk sign-ins smooth.
      - prompt: Just-in-time privileged access reduces risk because
        options:
          - It gives everyone admin
          - Elevated rights are granted temporarily and expire, shrinking standing admin attack surface
          - It never logs
          - It removes approvals
        answer: 1
        explanation: Time-bound, approved elevation means far fewer always-on privileged accounts for an attacker to steal.
      - prompt: Centralising identity in one provider introduces which risk?
        options:
          - Nothing changes
          - The identity provider becomes a single high-value target that must be heavily hardened
          - Slower networks
          - More passwords
        answer: 1
        explanation: Concentrated identity is powerful but makes the IdP a prime target, so it must be the most hardened system.
  - slug: arch-email-security
    title: Email Security Architecture
    order: 8
    difficulty: intermediate
    summary: Design the layered defences that protect email, the top attack vector, using sender authentication (SPF, DKIM, DMARC), a secure gateway and user-facing controls.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.5", "cysa:1.1"]
    learning_objectives:
      - Explain how SPF, DKIM and DMARC authenticate email and curb spoofing
      - Describe the role of a secure email gateway and its filtering layers
      - Design layered email defences that reduce phishing and business email compromise
    theory: |
      Email is the most common way attackers get in, so its architecture is a layered defence rather than a
      single filter. The foundation is **sender authentication**, three records that together make domain
      spoofing hard. **SPF** lists which servers may send mail for a domain; **DKIM** signs messages so a
      receiver can verify they were not altered and came from the domain; and **DMARC** ties the two
      together, telling receivers what to do when a message fails (quarantine or reject) and sending
      **reports** back so the domain owner sees who is sending as them. Without DMARC enforcement, anyone can
      forge your domain in the From line.

      In front of mailboxes sits the **secure email gateway**, which inspects inbound mail in layers:
      reputation and connection checks, anti-malware on attachments (often detonating them in a sandbox),
      URL rewriting and time-of-click checking so a link that turns malicious after delivery is still caught,
      and content analysis for phishing and impersonation patterns. Outbound, it enforces DLP so sensitive
      data does not leave by email. The gateway is also where **impersonation protection** lives, flagging a
      display name that mimics an executive or a look-alike domain, the hallmark of **business email
      compromise**.

      No technical layer is perfect, so architecture includes the human and response layers: banners that
      mark external or suspicious mail, an easy **report-phish** button that feeds the SOC, and
      authenticated internal workflows so a payment change is never actioned on an email alone. Designing
      email security means stacking these, authentication to stop spoofing, the gateway to filter threats,
      and user and process controls to catch what slips through, because any single layer, on its own, lets
      too much through.
    examples:
      - title: SPF, DKIM and DMARC together
        body: |
          SPF    sending server authorised for the domain?
          DKIM   signature valid and message unaltered?
          DMARC  if either fails -> quarantine/reject + report to the domain owner
          Enforced DMARC is what actually stops From-address spoofing.
      - title: Catching business email compromise
        body: |
          From: "CEO" <ceo@look-alike-domaln.com>  (look-alike domain, display-name match)
          Gateway: impersonation flag + external banner
          Process: payment-change requires out-of-band verification, not email alone
    exercise:
      title: Design layered email defences for a domain
      environment: A domain you control or a sample scenario, plus tools to check SPF/DKIM/DMARC records (or their documentation)
      tools: [DNS record lookups or samples, a diagram or document, a notes file]
      steps:
        - Check (or design) the SPF, DKIM and DMARC records for a domain and state what each one asserts.
        - Set or recommend a DMARC policy (none, quarantine, reject) and explain how reporting helps you move toward enforcement safely.
        - List the inbound filtering layers a secure email gateway should apply and what threat each addresses.
        - Describe how URL rewriting and attachment sandboxing catch threats that static filtering misses.
        - Design one impersonation-protection rule and the external/suspicious banner a user would see.
        - Add the human and process layer, report-phish and out-of-band verification for payment changes, and explain why the technical layers alone are insufficient.
      deliverable: An email-security design covering the SPF/DKIM/DMARC records and DMARC policy, the gateway filtering layers, an impersonation rule, and the user and process controls, each tied to the threat it addresses.
    expected_outcome: >
      You can design layered email security, using SPF, DKIM and DMARC to curb spoofing, a secure gateway
      to filter threats, and user and process controls to catch phishing and business email compromise that
      slip past the technical layers.
    quiz:
      - prompt: What does enforced DMARC achieve that SPF and DKIM alone do not?
        options:
          - It encrypts the mailbox
          - It tells receivers to quarantine or reject failing mail and reports who is sending as your domain
          - It blocks all email
          - It replaces the gateway
        answer: 1
        explanation: DMARC sets the policy on failures and provides reporting, which is what actually stops From-address spoofing.
      - prompt: Time-of-click URL checking in a gateway catches
        options:
          - Slow email
          - A link that becomes malicious after the message was delivered
          - Spelling mistakes
          - Large attachments only
        answer: 1
        explanation: Rewriting and checking URLs at click time catches links weaponised after delivery.
      - prompt: Business email compromise is best countered by
        options:
          - More storage
          - Impersonation detection plus out-of-band verification for sensitive actions
          - Disabling SPF
          - Longer passwords only
        answer: 1
        explanation: BEC relies on impersonation and trust, so detection plus process verification defeats it.
      - prompt: Why stack multiple email-security layers rather than rely on one?
        options:
          - To use more servers
          - Because no single layer is perfect, so authentication, filtering and user/process controls each catch what others miss
          - To slow delivery
          - Because DMARC is optional
        answer: 1
        explanation: Layered defence catches threats that any single control would let through.
  - slug: arch-secure-sdlc
    title: Secure Software Development Lifecycle
    order: 9
    difficulty: intermediate
    summary: Build security into how software is made, from threat modelling and secure coding through SAST, dependency scanning and a security gate, so flaws are caught before release.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.3", "secplus:3.1", "cysa:1.1"]
    learning_objectives:
      - Explain why security must be built into the development lifecycle
      - Describe the security activities at each phase of the SDLC
      - Design a pipeline security gate that catches flaws before release
    theory: |
      Security bolted on after software ships is expensive and leaky; a **secure software development
      lifecycle** (SSDLC) builds it into each phase instead, on the simple economics that a flaw caught in
      design costs a fraction of one found in production. The shift is cultural as much as technical, often
      called "shift left", moving security activity earlier so developers find and fix issues as they build
      rather than having security thrown over the wall at the end.

      Each phase has its activity. In **design**, **threat modelling** asks what could go wrong, what an
      attacker would target, what trust boundaries the data crosses, so the architecture addresses it from
      the start. In **development**, **secure coding** standards and input validation prevent the common
      flaws, and **SAST** (static analysis) scans the source for dangerous patterns as it is written. In
      **build**, **software composition analysis** scans third-party dependencies for known-vulnerable
      versions, which matters enormously because most code in a modern app is someone else's. In **test**,
      DAST exercises the running application, and before **release** a security review or gate decides
      whether the risk is acceptable. In **operation**, monitoring and patching continue the cycle.

      The architectural piece that ties this together is the **pipeline security gate**: automated checks in
      CI/CD that run SAST, dependency scanning and secret detection on every change, and fail the build when
      something serious appears. Designed well, the gate catches the bulk of issues automatically and cheaply,
      reserving human review for the judgement calls, with a clear, documented path for risk-accepting an
      exception rather than silently bypassing. The goal is not perfect code but a process where security is
      continuous and early, so that reaching production without an obvious, catchable flaw is the default,
      not the exception.
    examples:
      - title: Security activity by phase
        body: |
          Design   threat modelling (what could go wrong?)
          Develop  secure coding + SAST on the source
          Build    dependency scanning (someone else's code)
          Test     DAST on the running app
          Release  security gate; Operate: monitor + patch
      - title: A pipeline gate that fails the build
        body: |
          commit -> CI runs SAST + dependency scan + secret detection
          critical finding -> build FAILS, developer fixes before merge
          exception needed -> documented risk-acceptance, not a silent bypass
    exercise:
      title: Design SSDLC activities and a pipeline gate for a project
      environment: A described software project or your own, plus a diagram or document and (optionally) a CI pipeline to inspect
      tools: [A document or diagram, a sample project or pipeline, a notes file]
      steps:
        - For a sample application, do a lightweight threat model, name the assets, the attackers and one trust boundary to defend.
        - List the security activity you would add at each SDLC phase (design, develop, build, test, release, operate).
        - Design a CI/CD security gate specifying which automated checks run on every change and what fails the build.
        - Explain why dependency (composition) scanning is so important for a modern application.
        - Decide which checks should block automatically and which need human judgement, and why.
        - Define the documented exception path for risk-accepting a finding rather than silently bypassing the gate.
      deliverable: An SSDLC design with a lightweight threat model, per-phase activities, a pipeline security gate (blocking versus human-review checks), and a documented exception path.
    expected_outcome: >
      You can explain why security belongs throughout the development lifecycle, place the right activity in
      each phase, and design a pipeline security gate that catches the bulk of flaws automatically before
      release with a clear exception path.
    quiz:
      - prompt: Why build security into the development lifecycle ("shift left")?
        options:
          - It looks good
          - A flaw caught in design costs far less than one found in production
          - It slows developers for no reason
          - It replaces testing
        answer: 1
        explanation: Finding issues earlier is dramatically cheaper and more effective than fixing them after release.
      - prompt: Software composition analysis scans
        options:
          - The network
          - Third-party dependencies for known-vulnerable versions
          - User passwords
          - Firewall rules
        answer: 1
        explanation: Most of a modern app is third-party code, so scanning dependencies for known flaws is essential.
      - prompt: Threat modelling in the design phase asks
        options:
          - How fast the app runs
          - What could go wrong, what an attacker would target and which trust boundaries data crosses
          - What colour the UI is
          - How many servers are needed
        answer: 1
        explanation: Threat modelling identifies risks early so the architecture addresses them from the start.
      - prompt: A well-designed pipeline security gate should
        options:
          - Never fail a build
          - Run automated checks on every change and fail the build on serious findings, with a documented exception path
          - Replace all human review
          - Only run yearly
        answer: 1
        explanation: Automated per-change checks catch most issues cheaply, with human review and documented exceptions for the rest.
  - slug: arch-defense-in-depth-zones
    title: Defense in Depth and Security Zones
    order: 10
    difficulty: beginner
    summary: Design layered security with multiple independent controls and network zones of differing trust, so that no single failure exposes everything and an attacker must defeat control after control.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:2.1", "cysa:1.1"]
    learning_objectives:
      - Explain defense in depth and why layered, independent controls matter
      - Design security zones of differing trust with controlled boundaries
      - Recognise how zoning limits the blast radius of a compromise
    theory: |
      No single security control is perfect, so sound architecture never relies on one. **Defense in depth** is
      the principle of layering multiple, independent controls so that if one fails or is bypassed, others still
      stand between the attacker and the asset. The layers are deliberately different in kind, prevention,
      detection, and response; technical, physical, and administrative, so that a weakness in one type does not
      collapse the whole. The goal is not to make any single wall impenetrable but to make the attacker defeat a
      series of them, raising cost and the chance of detection at every step.

      A central expression of this in networks is **security zones**: dividing the environment into regions of
      differing trust with controlled boundaries between them. A classic design places public-facing services in
      a **DMZ** (demilitarised zone) that is isolated from the internal network, so a compromised web server
      cannot reach internal systems directly; internal user networks, server networks, and highly sensitive
      zones (cardholder data, control systems) each sit in their own segment with firewalls or gateways
      governing what may cross. Traffic between zones is allowed only where there is a need, and the more
      sensitive the zone, the stricter the boundary. This is the architectural form of least privilege applied to
      the network itself.

      The payoff is a limited **blast radius**. When zones are well designed, a compromise in a low-trust area,
      a public web server, a user's workstation, does not translate into access to the crown jewels, because the
      attacker still has to cross guarded boundaries to get there, and those crossings are exactly where
      monitoring and controls concentrate. This is why flat networks are dangerous: one foothold reaches
      everything. Defense in depth and zoning together mean that breaches, which will happen, stay contained and
      visible rather than catastrophic. For the analyst, zone boundaries are also prime monitoring points,
      unexpected traffic crossing from a low-trust to a high-trust zone is a strong signal worth investigating.
    examples:
      - title: Layers that each must be defeated
        body: |
          email filter -> endpoint protection -> least privilege -> network segmentation -> monitoring
          one layer fails -> the next still stands
          The attacker must beat a series, not a single wall.
      - title: Zones and blast radius
        body: |
          DMZ (web) | internal users | servers | sensitive (card data)
          compromised web server -> stuck in DMZ, cannot reach sensitive zone directly
          Flat network: one foothold reaches everything.
    exercise:
      title: Design layered controls and security zones for a network
      environment: A described organisation and its services, plus a diagramming tool or document
      tools: [A diagram or document, a reference architecture, a notes file]
      steps:
        - Explain defense in depth and why the layered controls should be independent and of different kinds.
        - For a sample environment, list a chain of layered controls an attacker would have to defeat to reach a sensitive asset.
        - Design security zones of differing trust (for example DMZ, user, server, sensitive) with the boundaries between them.
        - Specify what traffic may cross one boundary and why, applying least privilege to the network.
        - Explain how this zoning limits the blast radius of a compromise in a low-trust zone.
        - Identify a zone boundary that would be a high-value monitoring point and the crossing that would be suspicious.
      deliverable: A layered-defence and zoning design showing the control chain, the zones and their boundaries with a least-privilege crossing rule, the blast-radius benefit, and one boundary monitoring point.
    expected_outcome: >
      You can explain defense in depth, design security zones of differing trust with controlled boundaries,
      and show how layered controls and zoning limit the blast radius of a compromise while creating prime
      monitoring points.
    quiz:
      - prompt: Defense in depth means
        options:
          - Relying on one strong control
          - Layering multiple independent controls so that if one fails, others still protect the asset
          - Removing all controls
          - Using only firewalls
        answer: 1
        explanation: Layered, independent controls ensure no single failure exposes everything.
      - prompt: Placing public-facing services in a DMZ
        options:
          - Speeds up the website
          - Isolates them so a compromised public server cannot directly reach the internal network
          - Removes the need for firewalls
          - Encrypts all data
        answer: 1
        explanation: A DMZ separates exposed services from internal systems, containing a web-server compromise.
      - prompt: Why is a flat network dangerous?
        options:
          - It is slow
          - A single foothold can reach everything because there are no guarded boundaries
          - It uses too many zones
          - It cannot be monitored
        answer: 1
        explanation: Without zones, one compromise has unrestricted reach across the whole environment.
      - prompt: Zone boundaries are valuable monitoring points because
        options:
          - Nothing crosses them
          - Unexpected traffic crossing from low-trust to high-trust zones is a strong signal to investigate
          - They slow the network
          - They store logs
        answer: 1
        explanation: Controlled crossings concentrate both enforcement and the telemetry that reveals lateral movement.
  - slug: arch-endpoint-security
    title: Endpoint Security Architecture
    order: 11
    difficulty: intermediate
    summary: Design layered endpoint protection, hardening, EDR, application control and least privilege, so that endpoints, the most numerous and most targeted assets, resist and reveal compromise.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "secplus:2.5", "cysa:1.3"]
    learning_objectives:
      - Explain why endpoints are a primary target and need layered protection
      - Describe the layers of an endpoint security architecture
      - Balance protection, detection and manageability across many endpoints
    theory: |
      Endpoints, laptops, desktops, servers, are where users work, where email is opened, and where most
      intrusions begin, so they are both the most numerous assets and the most targeted. A single endpoint
      security product is not enough; sound architecture layers several complementary controls so that one
      endpoint's compromise is hard to achieve, limited in impact, and quickly visible. The design balances
      three goals that can tension against each other: **protection** (stopping bad things), **detection**
      (seeing what gets through), and **manageability** (deploying and maintaining it across thousands of
      machines without breaking users' work).

      The layers build on each other. **Hardening** reduces the attack surface, removing unneeded software and
      services, disk encryption, secure configuration from a baseline, so there is less to attack.
      **Preventive protection** (modern anti-malware) blocks known and many unknown threats. **Application
      control** (allow-listing what may run) is powerful because it stops unauthorised executables outright,
      though it needs effort to maintain. **Endpoint detection and response** (EDR) is the detection and
      investigation layer: it records rich telemetry, detects suspicious behaviour, and lets responders
      investigate and contain a host remotely, crucial because prevention is never complete. **Least
      privilege**, users not running as local administrators, limits what a compromise can do. Together these
      mean an attacker must defeat hardening, evade prevention, get past application control, avoid EDR
      detection, and escape a non-privileged context.

      The architectural judgement is in **balancing** these for the environment. Aggressive application control
      is excellent for fixed-function servers but hard on developers' machines; EDR everywhere is essential but
      generates telemetry that must flow to the SOC to be useful; least privilege is high-impact but needs a
      way for users to get legitimate elevation. The layers also feed the SOC: EDR telemetry is often the
      richest endpoint detection source, so endpoint architecture and detection engineering are tightly linked.
      For the analyst, the lesson is that endpoints are defended in depth like everything else, no single agent
      is a silver bullet, and the strongest posture comes from layered controls that each raise the cost of
      compromise while feeding visibility back to the SOC.
    examples:
      - title: Layers an attacker must defeat
        body: |
          hardening (less to attack) -> anti-malware (block known/unknown)
          -> application control (only allowed runs) -> EDR (detect + contain)
          -> least privilege (limit impact)
          No single agent is a silver bullet; the stack is.
      - title: Balancing by machine type
        body: |
          fixed-function server -> aggressive application allow-listing (easy)
          developer workstation -> allow-listing harder; lean on EDR + least privilege
          EDR everywhere, but telemetry must reach the SOC to be useful.
    exercise:
      title: Design an endpoint security architecture
      environment: A described organisation with different endpoint types (or your own context), plus a diagram or document
      tools: [A diagram or document, a reference on endpoint controls, a notes file]
      steps:
        - Explain why endpoints are a primary target and why a single product is insufficient.
        - Lay out the endpoint security layers (hardening, anti-malware, application control, EDR, least privilege) and what each contributes.
        - Describe how the layers combine so an attacker must defeat several to succeed.
        - For two different endpoint types (such as a server and a developer workstation), balance the controls appropriately and justify the differences.
        - Explain how EDR telemetry feeds the SOC and links endpoint architecture to detection engineering.
        - Identify one tension (for example application control versus developer flexibility) and how you would resolve it.
      deliverable: An endpoint security architecture describing the layered controls, how they combine, a per-endpoint-type balance, the EDR-to-SOC link, and one resolved tension.
    expected_outcome: >
      You can design a layered endpoint security architecture of hardening, prevention, application control,
      EDR and least privilege, balance those controls across different endpoint types, and connect endpoint
      telemetry to SOC detection.
    quiz:
      - prompt: Why do endpoints need layered protection rather than a single product?
        options:
          - Endpoints are rarely attacked
          - They are the most numerous and targeted assets, and no single control stops everything
          - One product is always enough
          - Layering slows them down for no reason
        answer: 1
        explanation: Endpoints are where most intrusions begin, so layered controls raise the cost and catch what each misses.
      - prompt: Application control (allow-listing) is powerful because it
        options:
          - Speeds up the machine
          - Stops unauthorised executables from running outright
          - Replaces EDR
          - Needs no maintenance
        answer: 1
        explanation: Allow-listing blocks anything not explicitly permitted, though it requires maintenance effort.
      - prompt: EDR's primary role in the stack is
        options:
          - Prevention only
          - Detection, rich telemetry and remote investigation/containment, since prevention is never complete
          - Encrypting disks
          - Managing passwords
        answer: 1
        explanation: EDR provides the detection, visibility and response layer that complements imperfect prevention.
      - prompt: A key architectural judgement for endpoints is
        options:
          - Using one agent everywhere identically
          - Balancing protection, detection and manageability, and tailoring controls to endpoint type
          - Ignoring developer machines
          - Disabling least privilege
        answer: 1
        explanation: The architecture must balance the three goals and adapt controls to different endpoint types.
  - slug: arch-dlp
    title: Data Loss Prevention Architecture
    order: 12
    difficulty: intermediate
    summary: Design data loss prevention that detects and stops sensitive data leaving the organisation, across endpoints, network and cloud, by knowing what data matters, where it flows, and how to enforce without crippling work.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.3", "secplus:4.5", "cysa:1.1"]
    learning_objectives:
      - Explain what data loss prevention protects and the channels it covers
      - Describe how DLP identifies sensitive data and enforces policy
      - Balance DLP enforcement against false positives and business friction
    theory: |
      Much of what an organisation must protect is **data**, customer records, intellectual property, regulated
      information, and **data loss prevention** (DLP) is the architecture aimed squarely at stopping that data
      from leaving inappropriately, whether through malice, compromise, or simple mistake. DLP matters because a
      great deal of data loss is not dramatic exfiltration but everyday leakage: an employee emailing a
      spreadsheet of customer data to a personal account, uploading a document to a personal cloud drive, or
      copying files to a USB stick. DLP addresses the data itself, wherever it tries to go.

      A DLP architecture spans the channels data uses. **Endpoint DLP** controls data on and leaving devices,
      copying to USB, printing, uploading. **Network DLP** inspects data in motion, email, web uploads, other
      egress, often at the same gateways that do web filtering. **Cloud DLP** covers data in and moving through
      cloud services and storage. Across these, DLP must first **identify** sensitive data, by pattern matching
      (credit-card and ID number formats), keywords and classifiers, by **data classification** labels applied
      to documents, or by fingerprinting known sensitive files. The quality of this identification is the heart
      of DLP: too loose and it misses real leaks or floods on false matches, too narrow and sensitive data
      slips by unlabelled.

      Enforcement is where DLP meets reality. Policies can **monitor** (log and alert), **warn** the user, or
      **block** an action outright, and the architectural judgement is matching enforcement to confidence and
      impact: block a clear mass export of customer records, but perhaps only warn on an ambiguous case, because
      aggressive blocking that interrupts legitimate work breeds resentment and workarounds. DLP is also prone
      to **false positives**, so it is tuned and usually rolled out in monitor mode first to learn normal data
      flows before enforcing. For the analyst, DLP is both a control and a detection source: its alerts, "a user
      just tried to email 10,000 customer records externally", are high-value leads for both insider risk and
      compromised-account exfiltration, confirmed against the user's legitimate role before acting. Designed
      well, DLP protects data across its channels without grinding legitimate work to a halt.
    examples:
      - title: Everyday leakage DLP addresses
        body: |
          customer spreadsheet emailed to a personal account
          document uploaded to a personal cloud drive; files copied to USB
          not just dramatic exfil -> DLP guards the data wherever it goes.
      - title: Matching enforcement to confidence
        body: |
          clear mass export of customer records -> BLOCK
          ambiguous single-file case            -> WARN / log
          monitor mode first to learn normal flows; aggressive blocking breeds workarounds.
    exercise:
      title: Design a DLP architecture for an organisation
      environment: A described organisation with sensitive data types and data flows, plus a diagram or document
      tools: [A description of data types and flows, a diagram or document, a notes file]
      steps:
        - Identify the sensitive data types the organisation must protect and the everyday ways they could leak.
        - Design DLP coverage across endpoint, network and cloud channels and what each addresses.
        - Describe how DLP would identify the sensitive data (patterns, classification labels, fingerprinting) and the trade-off of loose versus narrow identification.
        - Define enforcement levels (monitor, warn, block) and match them to the confidence and impact of different scenarios.
        - Explain why you would roll DLP out in monitor mode first and how you would tune false positives.
        - Describe how a DLP alert would serve as a detection lead and how you would confirm it against the user's role before acting.
      deliverable: A DLP architecture covering the data to protect, endpoint/network/cloud coverage, the identification method and its trade-off, enforcement levels matched to scenarios, a monitor-first rollout, and DLP alerts as detection leads.
    expected_outcome: >
      You can design data loss prevention across endpoint, network and cloud channels, explain how it
      identifies sensitive data and enforces policy, and balance enforcement against false positives and
      business friction while using DLP alerts as detection leads.
    quiz:
      - prompt: Data loss prevention primarily protects against
        options:
          - Slow networks
          - Sensitive data leaving the organisation inappropriately, through malice, compromise or mistake
          - Weak passwords only
          - Disk failure
        answer: 1
        explanation: DLP focuses on stopping sensitive data from leaving, including everyday accidental leakage.
      - prompt: A DLP architecture covers channels including
        options:
          - Only email
          - Endpoint, network and cloud (USB/print, email/web egress, cloud services)
          - Only USB drives
          - Only printers
        answer: 1
        explanation: DLP spans endpoint, network and cloud to cover the channels data uses to leave.
      - prompt: The heart of DLP effectiveness is
        options:
          - The colour of alerts
          - How well it identifies sensitive data (patterns, classification labels, fingerprinting)
          - The number of servers
          - The time of day
        answer: 1
        explanation: Accurate identification determines whether DLP catches real leaks without flooding on false matches.
      - prompt: Why is DLP usually rolled out in monitor mode first?
        options:
          - To block everything immediately
          - To learn normal data flows and tune false positives before enforcing, avoiding disruption
          - To disable logging
          - Because it never blocks
        answer: 1
        explanation: Monitoring first reveals legitimate flows so enforcement does not interrupt normal work or breed workarounds.
  - slug: arch-secure-cloud
    title: Secure Cloud Architecture
    order: 13
    difficulty: intermediate
    summary: Design cloud environments securely, covering account and network structure, identity as the perimeter, guardrails and landing zones, and the shared-responsibility model.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "sc900:4", "cysa:1.1"]
    learning_objectives:
      - Explain how cloud changes the architectural perimeter to identity
      - Design account, network and guardrail structure for a cloud environment
      - Apply landing zones and preventive guardrails to enforce security at scale
    theory: |
      Securing a cloud environment is less about firewalls at an edge and more about **structure and identity**.
      In the cloud the traditional network perimeter dissolves: resources are reachable over the provider's APIs,
      and **identity becomes the primary perimeter**, so who can do what, enforced by least-privilege IAM, matters
      more than where a packet comes from. Good cloud architecture starts by organising resources into separate
      **accounts or subscriptions** (for example production, development, and shared services) so that a
      compromise or mistake in one is contained and so that billing, logging and policy can be applied cleanly at
      boundaries. This account structure is the cloud equivalent of segmentation and is one of the most
      consequential early decisions.

      On top of that structure sit **guardrails**. Rather than relying on every team to configure security
      correctly, mature cloud architecture uses preventive policy (service control policies, Azure Policy,
      organisation policies) to make insecure configurations impossible: blocking public storage buckets,
      requiring encryption, restricting which regions can be used, and denying the disabling of logging. A
      **landing zone** is a pre-built, secured foundation, accounts, networking, identity, logging and guardrails
      configured to a baseline, so new workloads start secure by default instead of each reinventing it. This
      shifts security left into the platform, where it scales, instead of depending on per-workload vigilance.

      All of this is designed around the **shared-responsibility model**: the provider secures the cloud
      (physical, hypervisor, managed-service internals) and the customer secures what they put in it
      (configuration, identity, data, access). Cloud-native architecture therefore emphasises the customer's side:
      centralised logging (CloudTrail, Azure Activity, audit logs) aggregated to a dedicated secured account,
      encryption with well-managed keys, network controls (security groups, private endpoints) that keep data
      paths private, and continuous posture management to catch drift. For the architect, the mindset shift is
      from building and guarding a perimeter to defining a secure structure and letting automated guardrails and
      identity enforce it everywhere, because in an environment that changes by API call every minute, only
      automated, preventive design keeps pace.
    examples:
      - title: Identity as the perimeter
        body: |
          on-prem: guard the network edge
          cloud: resources reachable via API -> IDENTITY is the perimeter
          least-privilege IAM (who can do what) > where the packet came from.
      - title: Structure + guardrails + landing zone
        body: |
          separate accounts (prod/dev/shared) -> blast-radius containment
          preventive guardrails (SCPs/Azure Policy): no public buckets, must encrypt, cannot disable logging
          landing zone: pre-secured foundation -> new workloads start secure by default.
    exercise:
      title: Design a secure cloud foundation
      environment: A described organisation moving workloads to a cloud provider (or a scenario)
      tools: [A scenario, a cloud architecture diagram or notes file, a document]
      steps:
        - Explain why identity rather than network location is the primary perimeter in the cloud.
        - Propose an account or subscription structure and justify how it contains blast radius.
        - Name at least three preventive guardrails you would enforce and the risk each removes.
        - Explain what a landing zone is and how it makes new workloads secure by default.
        - Map two example responsibilities to the provider versus the customer under shared responsibility.
        - Describe how centralised logging and posture management fit into the design.
      deliverable: A secure cloud foundation design with an account structure, a guardrail set, a landing-zone rationale, a shared-responsibility mapping, and a logging and posture approach.
    expected_outcome: >
      You can design a secure cloud foundation around identity, account structure, preventive guardrails and
      landing zones, and align it to the shared-responsibility model with centralised logging and posture
      management.
    quiz:
      - prompt: In cloud architecture the primary security perimeter shifts to
        options:
          - The physical data centre door
          - Identity and least-privilege access, since resources are reachable over provider APIs
          - The office firewall
          - The employee badge
        answer: 1
        explanation: With API-reachable resources, who can do what (identity) becomes the main perimeter.
      - prompt: Separating workloads into different cloud accounts or subscriptions mainly provides
        options:
          - Faster networking
          - Blast-radius containment plus clean boundaries for logging, billing and policy
          - Cheaper storage only
          - A single point of failure
        answer: 1
        explanation: Account separation contains compromise and gives natural policy and logging boundaries.
      - prompt: A preventive guardrail (for example a service control policy) works by
        options:
          - Alerting after a breach
          - Making insecure configurations impossible, such as blocking public buckets or forbidding disabling logging
          - Encrypting employee laptops
          - Replacing identity
        answer: 1
        explanation: Guardrails prevent insecure actions up front rather than detecting them afterwards.
      - prompt: Under the shared-responsibility model, the customer is responsible for
        options:
          - The physical hardware and hypervisor
          - Configuration, identity, data and access of what they deploy
          - The provider's data-centre security
          - Nothing
        answer: 1
        explanation: The provider secures the cloud; the customer secures their configuration, identity and data in it.
  - slug: arch-hardware-root-of-trust
    title: Hardware Root of Trust with TPM, HSM and Secure Boot
    order: 14
    difficulty: intermediate
    summary: Understand how hardware anchors security, covering the TPM, hardware security modules, secure boot and measured boot, and why trust that starts in hardware is harder to subvert than software alone.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.3", "secplus:1.4", "sc900:3"]
    learning_objectives:
      - Explain what a root of trust is and why hardware provides a stronger one
      - Describe the roles of the TPM, HSM, secure boot and measured boot
      - Apply hardware-anchored trust to protect keys and boot integrity
    theory: |
      Security ultimately has to **start somewhere trusted**, and if every layer trusts the layer below it, the
      question is what the very bottom layer trusts. A **root of trust** is that anchor, and anchoring it in
      **hardware** makes it far harder to subvert than software, because malware that can rewrite files and
      processes cannot as easily rewrite a dedicated chip. Hardware roots of trust underpin modern platform
      security: they store keys where software cannot read them, verify that the system booted the software it was
      supposed to, and provide a tamper-resistant place to perform sensitive operations.

      Several components provide this. A **Trusted Platform Module (TPM)** is a chip on most modern machines that
      securely stores keys and measurements and can perform cryptographic operations without exposing the keys to
      the operating system; it underpins disk encryption (releasing the key only if the platform is in a known
      good state) and device identity. A **hardware security module (HSM)** is a hardened, often network-attached
      device for generating, storing and using cryptographic keys at scale, used where key compromise would be
      catastrophic (certificate authorities, payment systems); keys generated in an HSM never leave it in the
      clear. **Secure boot** uses signatures to ensure that only trusted, signed code runs at each stage of start-
      up, so a tampered bootloader or early driver is rejected, while **measured boot** records a cryptographic
      measurement of each boot component into the TPM so the platform's integrity can later be **attested**,
      proved to a remote party, rather than merely assumed.

      The architectural value is a **chain of trust** rooted in hardware: the hardware verifies the firmware, which
      verifies the bootloader, which verifies the operating system, each link checked before control passes on, so
      that by the time the system is running there is cryptographic assurance it was not tampered with below the
      level defenders can see. This matters because some of the most dangerous attacks live beneath the operating
      system (bootkits, firmware implants) where ordinary security tools are blind. For the architect, the
      practical applications are concrete: bind disk-encryption keys to the TPM so a stolen disk is useless,
      require secure boot on managed devices, use remote attestation to admit only healthy devices to sensitive
      resources, and keep high-value keys in an HSM. The theme is that trust is strongest when it is anchored in
      hardware and verified upward, not assumed from software that an attacker may already control.
    examples:
      - title: The components
        body: |
          TPM -> on-board chip: stores keys/measurements, crypto without exposing keys (disk encryption, device identity)
          HSM -> hardened key device at scale: keys never leave in clear (CAs, payments)
          secure boot -> only signed, trusted code runs at each boot stage
          measured boot -> record each component's measurement into TPM -> attest integrity.
      - title: Chain of trust rooted in hardware
        body: |
          hardware -> verifies firmware -> verifies bootloader -> verifies OS (each link checked)
          catches attacks BELOW the OS (bootkits, firmware implants) where normal tools are blind
          apply: bind disk key to TPM, require secure boot, attest device health, HSM for high-value keys.
    exercise:
      title: Apply hardware-anchored trust to a platform
      environment: A described device fleet or system with sensitive keys (or a scenario)
      tools: [A scenario, an architecture notes file, a document]
      steps:
        - Explain what a root of trust is and why anchoring it in hardware is stronger than software alone.
        - Describe the role of the TPM and one concrete protection it enables.
        - Describe the role of an HSM and when you would require one.
        - Explain the difference between secure boot and measured boot.
        - Describe how a hardware-rooted chain of trust catches attacks below the operating system.
        - Recommend three concrete hardware-anchored controls for the described platform.
      deliverable: A hardware-trust design explaining the root of trust, the roles of TPM, HSM, secure and measured boot, and three concrete controls for the platform.
    expected_outcome: >
      You can explain a hardware root of trust and the roles of the TPM, HSM, secure boot and measured boot, and
      apply hardware-anchored controls to protect keys and prove boot integrity against below-the-OS attacks.
    quiz:
      - prompt: Anchoring a root of trust in hardware is stronger than software because
        options:
          - Hardware is cheaper
          - Malware that rewrites files and processes cannot as easily rewrite a dedicated tamper-resistant chip
          - Software is always secure
          - It needs no keys
        answer: 1
        explanation: A hardware anchor resists the file and process tampering that compromises software trust.
      - prompt: A TPM is commonly used to
        options:
          - Replace the CPU
          - Securely store keys and release a disk-encryption key only if the platform is in a known good state
          - Encrypt the network
          - Run applications faster
        answer: 1
        explanation: The TPM protects keys and ties disk-encryption key release to platform integrity.
      - prompt: Secure boot and measured boot differ in that secure boot
        options:
          - Records measurements for later attestation
          - Enforces that only trusted, signed code runs at each boot stage, rejecting tampered components
          - Encrypts the disk
          - Is only for servers
        answer: 1
        explanation: Secure boot blocks untrusted code at boot; measured boot records measurements for attestation.
      - prompt: An HSM is chosen where
        options:
          - Keys are unimportant
          - Key compromise would be catastrophic, because keys generated in it never leave in the clear
          - Speed is the only concern
          - No cryptography is used
        answer: 1
        explanation: HSMs protect high-value keys by keeping them inside the hardened device at all times.
