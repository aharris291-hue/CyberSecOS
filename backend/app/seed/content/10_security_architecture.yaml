slug: security-architecture
title: Security Architecture
domain: Security Architecture
order: 10
description: >
  Design networks and systems to resist attack and keep running: segmentation,
  secure access, data protection, identity and resilience.
lessons:
  - slug: arch-network-design
    title: Secure Network Architecture and Segmentation
    order: 1
    difficulty: intermediate
    summary: Design a segmented network with a screened subnet and least-privilege firewall rules, and verify it.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:3.1", "secplus:3.2", "secplus:4.5"]
    learning_objectives:
      - Compare architecture models and explain their security implications
      - Design network segmentation with a screened subnet and VLANs
      - Write and verify least-privilege firewall rules between zones
    theory: |
      Where systems run changes their risk. **On-premises** gives full control and
      responsibility. **Cloud** shifts some to the provider under the shared responsibility
      model. **Hybrid** and **multi-cloud** add integration complexity. **Serverless**,
      **microservices**, **containers**, **IoT**, **ICS/SCADA** and **embedded** systems each
      have their own exposure; ICS and embedded devices often cannot be patched, so they are
      isolated instead.

      **Segmentation** limits how far an attacker can move. A **screened subnet** (historically
      a DMZ) holds internet-facing services between two firewalls, so a compromised web server
      cannot reach the internal network directly. **VLANs** separate traffic logically;
      **microsegmentation** isolates individual workloads. Management interfaces sit on a
      separate network reached through a **jump server** or bastion host. **Air-gapped**
      networks have no connection at all.

      Controls that enforce the design: **firewalls** (packet-filtering, stateful,
      next-generation), **web application firewalls**, **IPS/IDS**, **network access control
      (NAC)**, **proxies**, and secure protocols. The guiding ideas are **least privilege**
      (allow only what is needed), **defence in depth** (layered controls) and **deny by
      default** (block everything, then permit specific flows). A rule set should end with an
      explicit deny and be documented so anyone can see why each flow is allowed.
    examples:
      - title: A deny-by-default rule set
        body: |
          # Zones: INTERNET, DMZ (web), INTERNAL (db), MGMT
          allow INTERNET -> DMZ:443         # public HTTPS
          allow DMZ      -> INTERNAL:5432   # web app to database only
          allow MGMT     -> any:22          # admins via jump host
          deny  any      -> any             # explicit default deny, logged
      - title: Why a screened subnet helps
        body: |
          Attacker compromises the web server in the DMZ.
          With segmentation, the only path onward is DMZ -> INTERNAL:5432.
          The attacker cannot reach file shares, domain controllers or workstations.
    exercise:
      title: Build and test a segmented network in your lab
      environment: VirtualBox/VMware with three VMs and two internal networks (or pfSense as the firewall)
      tools: [pfSense or Linux with nftables/iptables, nmap, a diagram tool]
      steps:
        - Draw the target design: INTERNET, a DMZ holding one web VM, and an INTERNAL network holding one database VM, separated by a firewall VM.
        - Create two host-only/internal networks and attach the web VM to the DMZ and the database VM to INTERNAL; give the firewall VM an interface on each.
        - On the firewall, write deny-by-default rules that allow only INTERNET->DMZ:443 and DMZ->INTERNAL on the database port.
        - From the web VM, confirm you can reach the database port but not other internal ports (`nmap` the internal host).
        - From the DMZ, attempt to reach an internal service that should be blocked and confirm the firewall denies and logs it.
        - Add a management rule allowing SSH only from a jump host, and confirm direct admin access from the DMZ is blocked.
        - Export the firewall log entries that show allowed and denied flows and annotate your diagram with the final rules.
      deliverable: The network diagram, the firewall rule set, and nmap/log evidence that allowed flows work and blocked flows are denied.
    expected_outcome: >
      You can design a least-privilege, deny-by-default segmented network and prove with
      scans and logs that lateral movement is contained.
    quiz:
      - prompt: A screened subnet (DMZ) exists mainly to
        options:
          - Speed up internet access
          - Separate internet-facing services from the internal network
          - Store backups
          - Replace a firewall
        answer: 1
        explanation: It isolates public-facing servers so a compromise there cannot directly reach internal systems.
      - prompt: 'A "deny by default" firewall rule set means it'
        options:
          - Allows everything, then blocks a few things
          - Blocks everything, then allows only specific required flows
          - Has no final rule
          - Logs nothing
        answer: 1
        explanation: Starting from a full block and permitting only needed flows enforces least privilege.
      - prompt: Why are ICS/SCADA and embedded devices often isolated rather than patched?
        options:
          - They are not valuable
          - They frequently cannot be updated without breaking operations
          - They have no vulnerabilities
          - They are always offline
        answer: 1
        explanation: Many cannot tolerate patching or downtime, so isolation is the practical control.
      - prompt: A jump server (bastion host) is used to
        options:
          - Host public websites
          - Provide a single controlled path to management interfaces
          - Store encryption keys
          - Run backups
        answer: 1
        explanation: Admins connect through it, so management access is funnelled and monitored.
      - prompt: Layering multiple independent controls is called
        options: [Least privilege, Defence in depth, Air gapping, Tokenization]
        answer: 1
        explanation: Defence in depth means no single control failure exposes the asset.

  - slug: arch-data-resilience
    title: Protecting Data and Designing for Resilience
    order: 2
    difficulty: intermediate
    summary: Classify and protect data by state and build a tested backup and recovery plan.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:3.3", "secplus:3.4", "secplus:4.1"]
    learning_objectives:
      - Classify data and protect it at rest, in transit and in use
      - Explain resilience concepts: redundancy, RTO/RPO, backups and site types
      - Build and test a backup following the 3-2-1 rule
    theory: |
      **Data classification** (public, private, sensitive, confidential, restricted, regulated)
      drives how strongly data is protected and who may see it. Data exists in three **states**,
      each needing different controls. **At rest**: full-disk or database encryption. **In
      transit**: TLS, VPNs. **In use**: harder, addressed by access control, memory protection
      and, increasingly, confidential computing. **Data Loss Prevention (DLP)** watches for
      sensitive data leaving the organisation. Other protections: **tokenization** (replace
      data with a non-sensitive token), **masking** (hide part of a value), **hashing**, and
      **geographic/sovereignty** rules about where data may be stored.

      **Resilience** keeps services running through failure. **Redundancy** removes single
      points of failure: RAID for disks, load balancers and clustering for servers, multiple
      power supplies and ISPs, **UPS** and generators for power. Measure recovery with **RTO**
      (how quickly you must be back) and **RPO** (how much data you can afford to lose).
      **Backups** follow the **3-2-1** rule: three copies, two media types, one offsite;
      **immutable** or offline backups resist ransomware. Recovery **sites** range from a
      **hot site** (ready now), through **warm**, to a **cold site** (space only). Plans are
      only real once **tested**: tabletop exercises, failover tests and restore drills.
    examples:
      - title: Controls by data state
        body: |
          Customer records (classification: regulated)
          At rest:     AES-256 database encryption + restricted DB role
          In transit:  TLS 1.3 between app and database
          In use:      row-level access control; masking of card numbers in the UI
          Leaving:     DLP rule blocks export of >100 records to personal email
      - title: RTO and RPO on a timeline
        body: |
          Last backup 02:00 ──(data created)── 09:15 FAILURE ──(recover)── 10:00 back up
          RPO = 09:15 - 02:00 = up to 7h15m of data lost  (so back up more often)
          RTO = 10:00 - 09:15 = 45m to restore service    (meets a 1h target)
    exercise:
      title: Build a tested 3-2-1 backup and classify its data
      environment: A Linux VM (or WSL) with some sample data files
      tools: [tar, sha256sum, gpg or openssl, a second USB/drive or a second folder as "offsite"]
      steps:
        - Create a folder of sample files and assign each a data classification (public, private, confidential).
        - Encrypt the confidential files at rest with `openssl enc -aes-256-cbc -pbkdf2` and record the command.
        - Make backup copy 1 as a tarball, and record a SHA-256 of it for integrity.
        - Make copy 2 on a different medium (a USB drive, a second virtual disk, or a clearly separate location) to satisfy "two media".
        - Make copy 3 in an "offsite" location (another machine, or a separate cloud/sync folder) to satisfy "one offsite".
        - Delete the originals to simulate a failure, restore from a backup, and verify the restored files match by comparing hashes.
        - Write an RTO and RPO for this data and state how often you would back up to meet the RPO.
      deliverable: Evidence of the three copies, the restore test with matching hashes, and your stated RTO/RPO with backup frequency.
    expected_outcome: >
      You can protect data in every state and produce a backup you have actually restored,
      with recovery targets you can defend.
    quiz:
      - prompt: Encrypting a laptop's drive protects data
        options: [In transit, At rest, In use, In motion]
        answer: 1
        explanation: Full-disk encryption protects stored data if the device is lost or stolen.
      - prompt: The 3-2-1 backup rule means
        options:
          - 3 backups daily, 2 weekly, 1 monthly
          - 3 copies, on 2 media types, with 1 offsite
          - 3 servers, 2 sites, 1 admin
          - 3 passwords, 2 factors, 1 key
        answer: 1
        explanation: Three copies on two kinds of media with one offsite survives most failures.
      - prompt: RPO measures
        options:
          - How quickly service must be restored
          - How much data loss is acceptable
          - How many backups exist
          - The cost of downtime
        answer: 1
        explanation: Recovery Point Objective is the maximum acceptable data loss, set by backup frequency.
      - prompt: A hot site differs from a cold site because it
        options:
          - Is in a warmer climate
          - Is fully equipped and ready to take over almost immediately
          - Has no power
          - Stores only backups
        answer: 1
        explanation: A hot site is operational and current; a cold site is just space and utilities.
      - prompt: Immutable or offline backups specifically protect against
        options: [Power loss, Ransomware encrypting the backups too, Slow networks, User error only]
        answer: 1
        explanation: Backups that cannot be altered or reached online survive ransomware that encrypts live data.
  - slug: arch-zero-trust
    title: Zero Trust and Identity-Centric Access
    order: 3
    difficulty: intermediate
    summary: Move from a perimeter mindset to zero trust, where every request is verified on identity, device and context, and design least-privilege access with microsegmentation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:3.2", "secplus:4.6"]
    learning_objectives:
      - Explain the zero-trust principles and why the perimeter model fails
      - Describe the control and data planes and per-request verification
      - Design least-privilege, identity-centric access with microsegmentation
    theory: |
      The old model trusted anything inside the network perimeter, so one foothold let
      an attacker move freely. **Zero trust** replaces that with **never trust, always
      verify**: there is no trusted inside, and every request is authenticated and
      authorised on its own merits. Three principles drive it: **verify explicitly**
      (check identity, device health and context every time), **least privilege** (grant
      only the access needed, for only as long as needed), and **assume breach** (design
      as if an attacker is already present, so you contain blast radius).

      Architecturally, zero trust splits into a **control plane** and a **data plane**.
      A **policy decision point** evaluates each request against policy, considering the
      **subject** (user or service identity), the **device** (managed, patched, healthy),
      and **context** (location, time, sensitivity of the resource). A **policy
      enforcement point** then allows, blocks or step-ups the request, for example by
      requiring MFA. Access is **per-session and per-request**, not a one-time gate at
      login, so a change in risk mid-session can revoke access. Strong **identity** is
      the new perimeter, which is why phishing-resistant MFA and conditional access sit
      at the centre.

      On the network, zero trust favours **microsegmentation**: fine-grained zones so a
      compromise in one workload cannot reach another, enforced by identity rather than
      IP alone. Remote access shifts from a flat **VPN** that drops users onto the LAN to
      brokered, per-application access, often delivered as **SASE/ZTNA**. None of this is
      a single product; it is a design applied in stages, usually starting with the most
      sensitive applications and the strongest identity controls, then widening coverage.
    examples:
      - title: Perimeter trust versus per-request verification
        body: |
          Perimeter:  on the VPN -> reach everything on the subnet
          Zero trust: each request checks identity + device health + context,
                      then grants only that one app, for that one session
      - title: A decision the policy engine makes
        body: |
          Request: user alice, unmanaged laptop, from new country, to finance app
          Decision: block (or require managed device + MFA step-up) ->
                    least privilege + verify explicitly + assume breach
    exercise:
      title: Design identity-centric access for a sensitive application
      environment: A written description of an app and its users (invent one, or use your workplace scenario) and a document or diagram tool
      tools: [A diagram or document tool, your notes on the earlier network-design lesson]
      steps:
        - Pick one sensitive application and list its user groups and the data it holds.
        - Write the zero-trust principles as rules for this app (verify explicitly, least privilege, assume breach) in your own words.
        - Define the signals a policy decision point should check for each request (identity, device health, location, resource sensitivity).
        - Specify at least three access policies, including one that requires an MFA step-up and one that blocks, with the condition for each.
        - Draw or describe the microsegmentation around the app so a compromise elsewhere cannot reach it.
        - Replace any flat VPN access in the scenario with brokered per-application access and explain the difference.
        - State how you would roll this out in stages and what you would monitor to confirm least privilege is working.
      deliverable: The app and user inventory, the zero-trust rules, the per-request signals, at least three access policies, and a microsegmentation design with a staged rollout.
    expected_outcome: >
      You can explain why the perimeter model fails and apply zero-trust principles to a
      real application, designing per-request verification, least-privilege access and
      microsegmentation with identity, not network location, as the control point.
    quiz:
      - prompt: The core idea of zero trust is
        options:
          - Trust everything inside the corporate network
          - Never trust, always verify every request on its own merits
          - Replace all passwords with longer passwords
          - Put every system on one flat network
        answer: 1
        explanation: Zero trust removes implicit inside-the-perimeter trust and authenticates and authorises each request individually.
      - prompt: In a zero-trust architecture, the policy decision point evaluates
        options:
          - Only the user's password
          - Identity, device health and context for each request
          - Only the source IP address
          - The time of day alone
        answer: 1
        explanation: Decisions combine subject identity, device posture and contextual signals, which is what verify explicitly means in practice.
      - prompt: Microsegmentation primarily limits
        options:
          - How fast the network runs
          - The blast radius, so a compromise in one workload cannot reach others
          - The number of users
          - Password length
        answer: 1
        explanation: Fine-grained segmentation contains a breach, supporting the assume-breach principle.
      - prompt: Compared with a flat VPN, zero-trust network access (ZTNA) provides
        options: [Access to the whole subnet after login, Brokered per-application access verified per request, A faster perimeter firewall, Shared admin accounts]
        answer: 1
        explanation: ZTNA brokers access to specific applications with per-request verification instead of dropping the user onto the internal network.

  - slug: arch-secure-applications-apis
    title: Designing Secure Applications and APIs
    order: 4
    difficulty: intermediate
    summary: Build security into an application and its APIs instead of bolting it on.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:2.3", "secplus:4.1"]
    learning_objectives:
      - Apply secure-design principles such as least privilege and defence in depth at the app layer
      - Explain how input validation, authentication and authorisation defend an API
      - Place protective controls like a WAF and a gateway in an application's architecture
    theory: |
      Most application weaknesses are design choices made early, so security belongs in the
      architecture, not in a patch later. A few principles do most of the work. **Defence in
      depth** means no single control is the only thing standing between an attacker and the data.
      **Least privilege** means each component and token can do only what it needs. **Fail
      securely** means an error denies access rather than granting it. **Validate input** on the
      server, because anything from the client can be forged.

      APIs deserve particular care because they expose the application's logic directly.
      **Authentication** proves who is calling, usually a token the gateway checks, and
      **authorisation** decides what that caller may do on each object, which is where broken
      access control creeps in. Validate and constrain every parameter, apply **rate limiting** to
      blunt abuse and brute force, and never trust an identifier just because it arrived in a
      request; check that the caller owns the object it names.

      Protective controls sit at the edges. An **API gateway** centralises authentication, rate
      limiting and logging. A **web application firewall (WAF)** filters common injection and
      scripting payloads before they reach the app. **Secrets** such as keys and database
      passwords live in a secrets manager, never in source code. None of these replace secure
      code, but together they give an attacker far fewer ways in and the defender a place to see
      and stop abuse.
    examples:
      - title: Authentication is not authorisation
        body: |
          GET /api/orders/1005   token valid for user 42
          User 42 is authenticated, but order 1005 belongs to user 88.
          Without an ownership check the API leaks another user's data.
      - title: A secret that should not be in code
        body: |
          db_password = "S3cr3t!" hard-coded in app.py
          Anyone with the source, including the git history, now has the database password.
          It belongs in a secrets manager and should be rotated.
    exercise:
      title: Threat-model a small API by design
      environment: A diagram or notes file; no running system required
      tools: [A sample API with two or three endpoints, a diagram or notes tool]
      steps:
        - Sketch a small API with a client, a gateway and a couple of endpoints, one of which returns a record by id.
        - For the record-by-id endpoint, write the authentication step and then the separate authorisation check that the caller owns the record.
        - List each input parameter and the server-side validation you would apply to it.
        - Mark where a WAF, rate limiting and request logging sit in the diagram.
        - Find every place a secret is used and state where it is stored instead of in code.
        - Walk one broken-access-control attack through your design and show which control stops it.
      deliverable: An annotated API diagram with the authentication and authorisation steps, input validation, placed controls, and secret storage called out.
    expected_outcome: >
      You can take a small application or API and show where authentication, authorisation,
      input validation and edge controls belong so that common attacks are designed out.
    quiz:
      - prompt: A request carries a valid token for user 42 but asks for an object owned by user 88. What stops the leak?
        options:
          - Authentication alone
          - An authorisation check that the caller owns the object
          - A faster database
          - A larger token
        answer: 1
        explanation: Authentication proves who is calling; only an ownership authorisation check stops them reaching another user's object.
      - prompt: Where should a database password live?
        options: [In the source code, In a secrets manager, In a code comment, In the client app]
        answer: 1
        explanation: Secrets belong in a secrets manager, never in source or the client, where anyone with the code can read them.
      - prompt: Input validation should be enforced
        options: [Only in the browser, On the server since client input can be forged, Never, Only in logs]
        answer: 1
        explanation: Client-side checks help usability but can be bypassed, so the server must validate every input.
      - prompt: What is the main job of an API gateway?
        options:
          - To style the user interface
          - "To centralise authentication, rate limiting and logging"
          - To store the database
          - To write the code
        answer: 1
        explanation: A gateway is a single edge point for authenticating callers, limiting request rates and logging access.

  - slug: arch-logging-monitoring
    title: Designing Logging and Monitoring Architecture
    order: 5
    difficulty: intermediate
    summary: Build the telemetry, integrity and coverage a SOC needs into the architecture.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "secplus:3.1", "cysa:1.1"]
    learning_objectives:
      - Decide what to log and where to centralise it for detection and investigation
      - Explain why log integrity, time synchronisation and coverage matter
      - Produce a monitoring coverage map and spot its blind spots
    theory: |
      Detection and investigation only work if the right telemetry reaches the right place
      reliably, and that is an architecture decision made early, not a scramble during an incident.
      The first choice is **what to log**: authentication, process and command execution, network
      connections, and administrative actions on every critical system. The second is **where it
      goes**, usually a central SIEM or log lake, so one query spans the estate instead of hunting
      box by box.

      Three properties decide whether that data can be trusted. **Log integrity** means logs are
      forwarded off the host and stored append-only, so an attacker who owns a machine cannot
      quietly erase their tracks. **Time synchronisation** through NTP, with everything stored in
      UTC, lets events from different systems line up on one timeline. **Coverage** means every
      asset that matters actually ships logs and you are alerted when a source goes silent, because
      a blind spot is where incidents hide. Retention has to meet both investigation needs and any
      compliance minimum, balancing hot, searchable storage against cheaper cold archive.

      The architecture also places the **sensors**, network taps or flow exporters, endpoint
      agents, cloud audit logging, and keeps secrets out of the logs themselves. The point is to
      design detective controls in from the start and to keep a living **coverage map** of what is
      and is not monitored, so the gaps are known rather than discovered the hard way.
    examples:
      - title: Why logs must leave the host
        body: |
          On-host only   attacker with root clears /var/log and the evidence is gone
          Forwarded      the same events already sit append-only in the central store
          Off-host, append-only storage is what makes logs trustworthy after a compromise.
      - title: A coverage-map blind spot
        body: |
          Shipping logs   domain controllers, firewalls, EDR
          Silent          the new payroll server (no agent, not onboarded)
          An asset that matters but ships nothing is exactly where an intrusion goes unseen.
    exercise:
      title: Design a monitoring coverage map for a small estate
      environment: A diagram or notes file describing a small set of systems; no running system needed
      tools: [A system inventory, a diagram or notes tool]
      steps:
        - List the critical systems in the sample estate and what each one does.
        - For each, decide which log types it should send (authentication, process, network, admin actions).
        - Choose where logs are centralised and how they are forwarded off the host.
        - State how you would guarantee log integrity and consistent timestamps across the systems.
        - Mark which systems currently ship logs and which are silent, and flag the blind spots.
        - Set a retention split between hot searchable storage and cold archive, with a compliance minimum in mind.
        - Add one alert that fires when an expected log source goes quiet.
      deliverable: A coverage map listing each system, its log types, where they go, the blind spots, and a silent-source alert.
    expected_outcome: >
      You can design what to log, where it goes and how it stays trustworthy, and keep a
      coverage map that makes monitoring blind spots visible before an incident finds them.
    quiz:
      - prompt: Why forward logs off the host to a central append-only store?
        options:
          - To save local disk only
          - So an attacker who compromises the host cannot erase the evidence
          - To slow down searches
          - To avoid time synchronisation
        answer: 1
        explanation: Off-host, append-only storage preserves the evidence even when the source machine is fully compromised.
      - prompt: Why store all log timestamps in UTC with synchronised clocks?
        options: [To use less storage, So events from different systems line up on one timeline, To hide the logs, To disable retention]
        answer: 1
        explanation: Consistent, synchronised UTC timestamps let events from many sources be correlated in the right order.
      - prompt: A critical asset that ships no logs is best described as
        options: [Well protected, A monitoring blind spot where incidents can hide, Fully compliant, A backup source]
        answer: 1
        explanation: Coverage gaps are exactly where an intrusion goes unseen, which is why silent sources must be flagged.
      - prompt: Detective controls such as logging and monitoring are best
        options:
          - Added after the first incident
          - Designed into the architecture from the start
          - Left to each user
          - Never documented
        answer: 1
        explanation: Building logging and monitoring in from the start means the telemetry exists before you need it.

  - slug: arch-key-management-secrets
    title: Designing Key Management and Secrets Architecture
    order: 6
    difficulty: intermediate
    summary: Decide where cryptographic keys and application secrets live, how they rotate, and who can reach them.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.4", "secplus:3.1", "secplus:4.1"]
    learning_objectives:
      - Explain why keys and secrets need a managed home rather than living in code or config
      - Describe the lifecycle of a key from generation through rotation to revocation
      - Choose where secrets live and who can reach them, following least privilege
    theory: |
      Cryptography only protects data if the **keys** are protected, and applications also hold
      **secrets**, database passwords, API tokens, certificates, that grant access. The most common
      architectural failure is keeping these in the wrong place: hard-coded in source, committed to
      a repository, or sitting in a plaintext config file. Once a secret is in version control it is
      effectively public to everyone with history access, so the first design decision is that keys
      and secrets live in a **managed store**, not in the code that uses them.

      A key has a **lifecycle**, and the architecture has to serve all of it. A key is **generated**
      with enough randomness, **stored** somewhere resistant to extraction (a secrets manager, or a
      hardware security module for the highest-value keys), **used** without the application ever
      seeing the raw key where possible, **rotated** on a schedule so a leaked key has a short useful
      life, and **revoked and destroyed** when it is compromised or retired. A design that can issue
      a key but has no story for rotating or revoking it is incomplete.

      The last piece is **access**: who, and what, can retrieve each secret. Least privilege applies
      to secrets as much as to users, so each service reads only the secrets it needs, access is
      authenticated and logged, and a human reading a production secret is an audited event, not a
      routine one. Short-lived, automatically issued credentials are safer than long-lived ones a
      person copies around. This builds on the earlier cryptography lesson, which covered how the
      algorithms work; here the subject is the architecture around the keys, where they live, how
      they move, and who can reach them.
    examples:
      - title: A secret in the wrong place
        body: |
          config.yml committed to git:  db_password: S3cr3t!
          A secret in version control is exposed to everyone with repo history; it belongs in a secrets store.
      - title: A short-lived issued credential
        body: |
          service requests a database credential at startup -> valid 1 hour -> auto-renewed
          A rotating, auto-issued credential limits the damage a leak can do far better than a static password.
    exercise:
      title: Design a key and secrets architecture on paper
      environment: A notes or diagram file for a small application with a database and an external API
      tools: [A notes or diagram tool, the application scenario]
      steps:
        - List every key and secret the application needs and where each one is used.
        - For each, state where it should live and why that store rather than code or config.
        - Describe the lifecycle for one key, generation, storage, use, rotation and revocation.
        - Define which service or person may read each secret, following least privilege, and how access is logged.
        - Decide which credentials should be short-lived and auto-issued rather than static.
        - Note one thing that would go wrong if a secret leaked, and how the design limits the damage.
      deliverable: A one-page secrets architecture listing each secret, its store, its lifecycle, and the access rules around it.
    expected_outcome: >
      You can design where keys and secrets live, define their lifecycle including rotation and
      revocation, and apply least privilege to who can reach them.
    quiz:
      - prompt: Why should secrets not be kept in source code or committed config?
        options:
          - It makes the code run slower
          - Once in version control they are exposed to everyone with history access, effectively public
          - Code cannot store text
          - It is against copyright law
        answer: 1
        explanation: A secret in version control history is readable by anyone with access to the repo, so it is no longer secret.
      - prompt: Rotating keys on a schedule matters because it
        options:
          - Makes keys longer
          - Limits how long a leaked key stays useful to an attacker
          - Changes the algorithm
          - Removes the need for access control
        answer: 1
        explanation: Regular rotation shortens the window in which a compromised key is valid.
      - prompt: Applying least privilege to secrets means
        options:
          - Every service can read every secret
          - Each service reads only the secrets it needs, with access authenticated and logged
          - Secrets are printed to the console
          - Only the newest secret is protected
        answer: 1
        explanation: Least privilege restricts each consumer to the secrets it actually requires, and logs the access.
      - prompt: How does this lesson differ from the earlier cryptography lesson?
        options: [It is the same, It is about the architecture around keys (where they live, rotate and who reaches them) rather than how the algorithms work, It only covers passwords, It ignores rotation]
        answer: 1
        explanation: The crypto lesson covered the algorithms; this one covers the key-management architecture around them.
  - slug: arch-identity-access-design
    title: Identity and Access Architecture
    order: 7
    difficulty: intermediate
    summary: Design the identity fabric a modern organisation runs on, covering single sign-on, federation, conditional access and privileged access, so identity becomes a controllable security boundary.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.6", "cysa:1.1"]
    learning_objectives:
      - Explain SSO and federation and the security trade-offs of centralised identity
      - Design conditional access that adapts to risk without blocking legitimate users
      - Architect privileged access so powerful accounts are controlled and auditable
    theory: |
      In a cloud-first organisation, identity is the control plane: once perimeters dissolve, *who* is
      asking and *under what conditions* decides access. **Single sign-on** lets a user authenticate
      once to an identity provider and reach many applications, which improves both usability and
      security because authentication, MFA and policy are enforced in one place instead of each app
      inventing its own. **Federation** (via SAML or OpenID Connect) extends this trust across
      organisations, letting a partner's users access a service with their own identity. The trade-off
      is concentration: the identity provider becomes a single high-value target, so it must be the most
      hardened system you run.

      Because access now hinges on identity, the policy has to be **adaptive**. **Conditional access**
      evaluates signals, user, device health, location, and a risk score, at sign-in and steps up or
      blocks accordingly: a sign-in from a managed device in the office passes quietly, while the same
      account from an unmanaged device in a new country is challenged for MFA or denied. Designed well,
      this raises security and reduces friction at the same time; designed badly, it locks people out or
      waves risk through.

      The most dangerous identities are **privileged** ones. Architecting for them means least privilege
      by default, **just-in-time** elevation instead of standing admin rights, separate admin accounts,
      and a **privileged access management** system that brokers, approves and records elevated sessions.
      The whole design is underpinned by the **identity lifecycle**, joiners, movers and leavers,
      because an account that keeps access after a role change or departure is exactly the gap attackers
      exploit. Good identity architecture turns "who can do what" from an unknowable sprawl into a policy
      you can state, enforce and audit.
    examples:
      - title: Conditional access adapting to risk
        body: |
          Managed device + office IP + low risk   -> allow, no extra prompt
          Unmanaged device + new country + risky   -> require MFA or block
          One policy, different outcomes by signal.
      - title: Standing admin versus just-in-time
        body: |
          Standing:  20 permanent global admins -> huge, always-on attack surface
          JIT:       elevate to admin for 2h with approval, auto-expire, fully logged
          Fewer standing privileges means fewer accounts worth stealing.
    exercise:
      title: Design an identity and access architecture for a sample org
      environment: A described sample organisation (apps, user groups, partners, admins) and a diagramming or document tool
      tools: [A diagram or document tool, a sample org description, identity-provider documentation for reference]
      steps:
        - Map the sample org's applications and user groups and show how SSO through one identity provider would connect them.
        - Identify one partner or external access need and describe how federation would meet it and what trust it establishes.
        - Design three conditional-access rules using signals (device, location, risk) and state the outcome (allow, step-up MFA, block) for each.
        - Define how privileged access would work, separate admin accounts, just-in-time elevation and approval, and session recording.
        - Describe the joiner-mover-leaver process for one role change and how it prevents lingering access.
        - Identify the biggest risk your centralised design introduces (the identity provider as a single target) and one way you would harden it.
      deliverable: An identity-architecture outline with the SSO and federation design, three conditional-access rules, the privileged-access approach, a lifecycle process, and the top risk with its mitigation.
    expected_outcome: >
      You can design an identity fabric with SSO, federation, conditional access and privileged-access
      controls, make identity an adaptive and auditable security boundary, and account for the
      concentration risk that centralised identity creates.
    quiz:
      - prompt: A security benefit of single sign-on is that
        options:
          - Users never need passwords
          - Authentication, MFA and policy are enforced in one place instead of each app doing its own
          - It removes the identity provider
          - It disables logging
        answer: 1
        explanation: Centralising authentication lets strong, consistent controls be enforced once rather than reinvented per app.
      - prompt: Conditional access improves security by
        options:
          - Blocking everyone
          - Evaluating signals like device, location and risk at sign-in and stepping up or blocking accordingly
          - Removing MFA
          - Storing more logs
        answer: 1
        explanation: Adaptive policy applies the right challenge for the risk, raising security while keeping low-risk sign-ins smooth.
      - prompt: Just-in-time privileged access reduces risk because
        options:
          - It gives everyone admin
          - Elevated rights are granted temporarily and expire, shrinking standing admin attack surface
          - It never logs
          - It removes approvals
        answer: 1
        explanation: Time-bound, approved elevation means far fewer always-on privileged accounts for an attacker to steal.
      - prompt: Centralising identity in one provider introduces which risk?
        options:
          - Nothing changes
          - The identity provider becomes a single high-value target that must be heavily hardened
          - Slower networks
          - More passwords
        answer: 1
        explanation: Concentrated identity is powerful but makes the IdP a prime target, so it must be the most hardened system.
