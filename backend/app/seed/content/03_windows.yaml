slug: windows-security
title: Windows Security Monitoring
domain: Windows Security
order: 3
description: >
  Windows endpoints are where most enterprise attacks land. Learn the event logs
  and telemetry that reveal logons, privilege use and malicious processes.
lessons:
  - slug: win-event-logs
    title: Windows Security Event Logs
    order: 1
    difficulty: beginner
    summary: Read and filter the Security log for logons, failures, new accounts and privilege use.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:4.9", "cysa:1.3", "sc200:1"]
    learning_objectives:
      - Name the key Security event IDs a SOC analyst uses daily
      - Interpret logon types in event 4624
      - Query events with Event Viewer and PowerShell Get-WinEvent
    theory: |
      Windows records security-relevant activity in the **Security** event log. A handful of
      event IDs cover most investigations:

      - **4624** successful logon, **4625** failed logon, **4634/4647** logoff
      - **4672** special privileges assigned (an administrator-equivalent logon)
      - **4688** process creation (enable command-line auditing to see arguments)
      - **4720** user account created, **4728/4732** user added to a privileged group
      - **1102** the audit log was cleared, which is almost always suspicious

      Event 4624 includes a **Logon Type**: 2 interactive (at the keyboard), 3 network (SMB,
      for example), 4 batch, 5 service, 7 unlock, 10 RemoteInteractive (RDP). Many type 3 or 10
      logons from an unexpected source, especially right after a run of 4625 failures, point
      to brute force or lateral movement.

      Event Viewer is fine for browsing, but **Get-WinEvent** with a filter hashtable is how you
      search quickly and repeatably, and it is the same thinking you will later apply in a SIEM.
    examples:
      - title: Failed logons in the last 24 hours
        body: |
          Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625; StartTime=(Get-Date).AddDays(-1)} |
            Select-Object TimeCreated, @{n='User';e={$_.Properties[5].Value}}, @{n='Source';e={$_.Properties[19].Value}}
      - title: Reading a 4624 event
        body: |
          Logon Type:          10
          Account Name:        jsmith
          Source Network Address: 203.0.113.45
          An RDP logon from an external address deserves immediate review.
    exercise:
      title: Generate and hunt your own security events
      environment: A Windows 10/11 or Windows Server evaluation VM where you are administrator
      tools: [Event Viewer, PowerShell, auditpol]
      steps:
        - Run `auditpol /get /category:*` and enable success and failure auditing for Logon and Process Creation if they are off.
        - Lock the VM and sign in with a wrong password three times, then sign in correctly.
        - Create a local user with `net user labuser P@ssw0rd-Lab1 /add` and add it to Administrators with `net localgroup administrators labuser /add`.
        - Open Event Viewer > Windows Logs > Security and find the 4625, 4624, 4720 and 4732 events you caused.
        - Write a Get-WinEvent command that lists only your failed logons with time and account name.
        - Write a second command that lists 4688 events for the last hour and find the `net.exe` executions.
        - Remove the lab user with `net user labuser /delete` and confirm event 4726 was logged.
      deliverable: The two PowerShell queries and a table mapping each action you took to its event ID.
    expected_outcome: >
      You can reproduce attacker-like actions, find the exact events they generate, and query
      them from PowerShell without browsing manually.
    quiz:
      - prompt: Which event ID records a failed logon?
        options: ["4624", "4625", "4672", "4720"]
        answer: 1
        explanation: 4625 is "An account failed to log on".
      - prompt: Logon type 10 in event 4624 means
        options: [Interactive console logon, Network logon, RemoteInteractive (RDP), Service logon]
        answer: 2
        explanation: Type 10 is RemoteInteractive, used by Remote Desktop.
      - prompt: Why is event 1102 almost always investigated?
        options:
          - It means a user changed their password
          - It records the security audit log being cleared, a common anti-forensics step
          - It is generated at every reboot
          - It shows a new printer was installed
        answer: 1
        explanation: Clearing the Security log destroys evidence, so attackers often do it.
      - prompt: Which event shows a user being added to a security-enabled local group such as Administrators?
        options: ["4688", "4732", "4634", "4647"]
        answer: 1
        explanation: 4732 is "A member was added to a security-enabled local group".

  - slug: win-sysmon-powershell
    title: Process Telemetry with Sysmon and Suspicious PowerShell
    order: 2
    difficulty: intermediate
    summary: Deploy Sysmon and detect encoded PowerShell and suspicious parent-child processes.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.4", "secplus:2.4", "cysa:1.2", "sc200:2"]
    learning_objectives:
      - Explain what Sysmon adds beyond the built-in Security log
      - Recognise suspicious parent-child process relationships
      - Decode and assess an encoded PowerShell command
    theory: |
      **Sysmon** (System Monitor, from Microsoft Sysinternals) is a free driver and service that
      writes rich telemetry to *Microsoft-Windows-Sysmon/Operational*. Key events: **1** process
      creation with full command line and hashes, **3** network connection, **11** file created,
      **13** registry value set, **22** DNS query. A community configuration such as
      SwiftOnSecurity's filters out noise.

      Attackers love **living off the land**: using built-in tools like PowerShell, certutil,
      mshta and rundll32 so that nothing new needs to be installed. Context is what separates
      malicious from normal. **Parent-child relationships** are a strong signal: Word or Excel
      spawning PowerShell, or PowerShell spawned by a service binary, is rarely legitimate.

      PowerShell's `-EncodedCommand` (often shortened to `-enc` or `-e`) accepts a Base64
      UTF-16LE script. Administrators rarely use it interactively; malware uses it to hide
      download cradles such as `IEX (New-Object Net.WebClient).DownloadString(...)`. Decoding
      the string is the first step of triage.
    examples:
      - title: Suspicious Sysmon event 1
        body: |
          ParentImage: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
          Image:       C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
          CommandLine: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBi...
      - title: Decoding an encoded command
        body: |
          $b64 = 'SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkA'
          [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($b64))
          # IEX (New-Object Net.WebClient)
    exercise:
      title: Install Sysmon and catch an encoded command
      environment: Windows evaluation VM, isolated from your home network
      tools: [Sysmon, PowerShell, Event Viewer]
      steps:
        - Download Sysmon from Microsoft Sysinternals and the SwiftOnSecurity sysmon-config XML.
        - Install with `sysmon64.exe -accepteula -i sysmonconfig-export.xml` and confirm the Sysmon/Operational log exists.
        - Encode a harmless command, for example `$c = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('Get-Date; whoami'))`.
        - Run `powershell.exe -NoProfile -EncodedCommand $c` to simulate an attacker technique.
        - Find the Sysmon event 1 for that execution and record ParentImage, CommandLine and Hashes.
        - Decode the Base64 from the event back to plain text with PowerShell.
        - Write a Get-WinEvent query that returns Sysmon event 1 entries whose CommandLine contains `-enc` or `-EncodedCommand`.
      deliverable: Screenshot of the event, the decoded command, and your detection query.
    expected_outcome: >
      You have working endpoint telemetry, can explain why a given process chain is
      suspicious, and can decode and search for encoded PowerShell.
    quiz:
      - prompt: Which Sysmon event ID records process creation?
        options: ["1", "3", "11", "22"]
        answer: 0
        explanation: Sysmon event 1 is ProcessCreate, including command line and hashes.
      - prompt: Which parent-child pair is most suspicious?
        options:
          - explorer.exe starting chrome.exe
          - services.exe starting svchost.exe
          - winword.exe starting powershell.exe
          - explorer.exe starting notepad.exe
        answer: 2
        explanation: Office applications spawning a shell is a common sign of a malicious macro.
      - prompt: What encoding does PowerShell -EncodedCommand expect?
        options: [Hex, Base64 of UTF-16LE text, ROT13, Base64 of ASCII text]
        answer: 1
        explanation: The script is UTF-16LE (Unicode) text encoded as Base64.
      - prompt: '"Living off the land" means attackers'
        options:
          - Only attack agricultural companies
          - Use tools already present on the system to avoid detection
          - Physically break into buildings
          - Use only zero-day exploits
        answer: 1
        explanation: Built-in binaries such as PowerShell or certutil blend in with normal administration.

  - slug: win-ad-authentication
    title: Active Directory and Authentication Monitoring
    order: 3
    difficulty: intermediate
    summary: Read Windows logon and Kerberos events to spot account enumeration, suspicious logon types and lateral movement.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "secplus:2.4", "cysa:1.2", "sc200:4"]
    learning_objectives:
      - Explain how Active Directory authentication appears in the event logs
      - Read logon types and Kerberos events to judge whether a logon is normal
      - Spot indicators of account enumeration and lateral movement
    theory: |
      Most enterprise logons flow through **Active Directory**, so the domain
      controllers and endpoints together tell the story of who authenticated where.
      Two protocols matter. **Kerberos** is normal in a domain: a client gets a
      **ticket-granting ticket** (event 4768) and then service tickets (4769) to reach
      resources. **NTLM** is older and, when it appears for something that should use
      Kerberos, can be a clue worth checking. On each machine, logons appear as **4624**
      (success) and **4625** (failure), and the **logon type** says how: type 2 is
      interactive at the console, type 3 is over the network, type 10 is Remote Desktop.
      A service account suddenly doing a type-10 interactive logon, or a workstation
      account authenticating to many hosts, stands out against its own baseline.

      Attackers probe AD before moving. **Account and group enumeration** shows up as a
      burst of directory queries or many 4769 requests from one source. **Password
      spraying** is one or two failed logons (4625) against many different accounts from
      a single host, the mirror image of brute force against one account. **Lateral
      movement** often looks like one credential authenticating to a series of machines
      over the network (type 3) in a short window, sometimes with tools that trigger
      service creation (7045) on the targets.

      You judge these by **baseline and context**, not single events. Admin logons at
      3am, a service account used interactively, Kerberos tickets requested for services
      an account never touches, and the same account appearing on ten hosts in five
      minutes are all worth an investigation. Defensively, the same telemetry drives
      hardening: tiered admin accounts, limiting where privileged accounts can log on,
      and alerting on the specific event patterns above.
    examples:
      - title: Logon types tell you how someone got in
        body: |
          4624 logon success, account svc_backup
          LogonType 10 (RemoteInteractive / RDP)  from WKSTN-07
          Expected: svc_backup runs as a service (type 5), never RDP.
          Verdict: investigate - a service account being used interactively is abnormal.
      - title: Password spraying vs brute force
        body: |
          Brute force: 200x 4625 for one account from one host  (one door, many keys)
          Spraying:    1-2x 4625 each for 200 accounts from one host (many doors, one key)
          Spraying stays under per-account lockout thresholds, so count by source, not account.
    exercise:
      title: Investigate domain authentication in a lab
      environment: A Windows lab with a domain controller and one client (an evaluation AD lab or two VMs), or a provided sample of exported security events
      tools: [Event Viewer or a SIEM, the sample/live Security logs, a spreadsheet]
      steps:
        - Generate normal domain activity (a couple of user logons and a network share access) and locate the 4624 events, recording the logon type for each.
        - Produce several failed logons for different accounts from one host to simulate spraying, then write a query or filter that counts 4625 by source host rather than by account.
        - Identify a logon that does not fit its account's baseline (for example a service account with an interactive or RDP logon) and explain why it is suspicious.
        - Find the Kerberos ticket events (4768/4769) for one account and note which services it requested tickets for.
        - Describe one realistic lateral-movement pattern you could detect from type-3 logons across multiple hosts in a short window.
        - Write two detection ideas (the event IDs and the condition) you would hand to a SIEM, each mapped to a MITRE ATT&CK technique.
        - Recommend one hardening change (for example restricting where a privileged account may log on) justified by what you observed.
      deliverable: A short investigation note listing the logon types you saw, the spraying count-by-source query, one abnormal logon with reasoning, and two ATT&CK-mapped detection ideas.
    expected_outcome: >
      You can read Windows logon and Kerberos events, tell a normal logon from a
      suspicious one using type and baseline, and describe how enumeration and lateral
      movement appear in the logs.
    quiz:
      - prompt: A Windows logon event (4624) with logon type 10 means the logon was
        options: [A service starting, Interactive at the console, Over the network, Remote Desktop]
        answer: 3
        explanation: Type 10 is RemoteInteractive, i.e. a Remote Desktop session.
      - prompt: Many accounts each seeing one or two failed logons from a single host most likely indicates
        options: [Brute force, Password spraying, A normal morning, A software update]
        answer: 1
        explanation: Spraying tries a few passwords across many accounts to stay under lockout thresholds.
      - prompt: Why is a service account with an interactive (type 2) or RDP (type 10) logon suspicious?
        options:
          - Service accounts cannot log on
          - Service accounts normally authenticate as a service (type 5), not interactively
          - Interactive logons are always malicious
          - It uses more memory
        answer: 1
        explanation: A service account used interactively deviates from its expected logon type and warrants investigation.
      - prompt: To detect password spraying you should count failed logons primarily by
        options: [Account name, Source host, Time of day, Domain controller]
        answer: 1
        explanation: Spraying spreads across accounts, so grouping by source host surfaces it; per-account counts stay low.
      - prompt: Kerberos service ticket requests appear as which event, useful for spotting access to unusual services?
        options: ["4625", "4769", "7045", "4688"]
        answer: 1
        explanation: Event 4769 is a Kerberos service ticket request; unusual target services can indicate reconnaissance or movement.

  - slug: win-persistence-autoruns
    title: Hunting Windows Persistence in Registry, Tasks and Services
    order: 4
    difficulty: intermediate
    summary: Find how malware survives a reboot using autoruns, scheduled tasks and services.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.9", "secplus:2.4", "cysa:1.2", "sc200:2"]
    learning_objectives:
      - List the main Windows persistence locations an attacker uses to survive a reboot
      - Enumerate autoruns, scheduled tasks and services and tell normal from suspicious
      - Map a persistence finding back to the event that created it
    theory: |
      **Persistence** is how an attacker keeps access after a reboot or logoff. Windows offers
      dozens of auto-start locations, and defenders need to know the common ones. The **Run and
      RunOnce registry keys** under both `HKCU` and `HKLM` launch a program at logon. **Scheduled
      tasks** run code on a trigger, at logon, on a timer, or on an event, and are a favourite
      because they look administrative. **Windows services** start code at boot, often as SYSTEM.

      Legitimate software uses all of these, so the skill is telling normal from malicious. Signs
      worth a closer look include an auto-start entry pointing at a user profile or temp folder, a
      command line that calls `powershell`, `rundll32` or `mshta` with encoded arguments, an
      unsigned binary, or a service with a random name. **Sysinternals Autoruns** lists every
      auto-start location in one place and can hide Microsoft-signed entries so the unusual ones
      stand out.

      Each persistence mechanism leaves a trace when it is created. A new service writes event
      **7045** to the System log, and a new or changed scheduled task writes **4698** and **4702**
      to the Security log. Finding the auto-start entry tells you what survives a reboot; finding
      the creating event tells you when it arrived and often which account did it.
    examples:
      - title: A Run key pointing at a temp folder
        body: |
          HKCU\Software\Microsoft\Windows\CurrentVersion\Run
          Updater = C:\Users\sam\AppData\Local\Temp\svc.exe
          A logon auto-start from a temp folder with a generic name is a classic red flag.
      - title: A service-creation event
        body: |
          Event ID 7045 (System log)
          Service Name = WinHelpSvc
          Image Path  = C:\Windows\Temp\a.exe
          Record the time and the host, then pivot to who was logged on.
    exercise:
      title: Enumerate and triage persistence on a lab VM
      environment: A disposable Windows lab VM; do not run unknown binaries on a production host
      tools: [Sysinternals Autoruns, Task Scheduler, Event Viewer, PowerShell]
      steps:
        - On a lab VM, run Autoruns and turn on Options then Hide Microsoft Entries to cut the noise.
        - Review the Logon, Scheduled Tasks and Services tabs and note any entry in a user or temp folder.
        - In PowerShell, list services with `Get-CimInstance Win32_Service | Select Name,PathName,StartMode` and look for odd image paths.
        - List scheduled tasks with `Get-ScheduledTask` and inspect the actions of any you do not recognise.
        - In Event Viewer, filter the System log for event 7045 and the Security log for 4698 to find when suspicious entries were created.
        - For one suspicious entry, write a line explaining what it runs, where it starts from and when it was created.
      deliverable: A list of auto-start entries you would investigate, each with its location, command line and creating event ID and time.
    expected_outcome: >
      You can enumerate the common Windows persistence locations, separate normal
      software from suspicious entries, and tie a finding back to the event that created it.
    quiz:
      - prompt: Which registry keys launch a program at user logon?
        options: [SAM and SECURITY, Run and RunOnce, The SYSTEM and SOFTWARE hives only, The boot configuration data store]
        answer: 1
        explanation: The Run and RunOnce keys under HKCU and HKLM start programs at logon and are common persistence spots.
      - prompt: A newly created Windows service is recorded by which event ID?
        options: ["4624", "7045", "4104", "5140"]
        answer: 1
        explanation: Event 7045 in the System log records service installation, a frequent persistence technique.
      - prompt: Why turn on Hide Microsoft Entries in Autoruns?
        options:
          - It deletes Microsoft software
          - It removes signed, expected entries so unusual auto-starts stand out
          - It speeds up the boot
          - It disables persistence
        answer: 1
        explanation: Filtering out signed Microsoft entries shrinks the list to the third-party and unexpected items worth reviewing.
      - prompt: Which scheduled-task detail most warrants investigation?
        options: [A task signed by Microsoft running Windows Update, A task that runs encoded PowerShell from a temp folder, A daily disk-cleanup task, A task that runs at a fixed time each day]
        answer: 1
        explanation: Encoded PowerShell launched from a temp folder on a trigger is a common persistence and execution pattern.
