slug: windows-security
title: Windows Security Monitoring
domain: Windows Security
order: 3
description: >
  Windows endpoints are where most enterprise attacks land. Learn the event logs
  and telemetry that reveal logons, privilege use and malicious processes.
lessons:
  - slug: win-event-logs
    title: Windows Security Event Logs
    order: 1
    difficulty: beginner
    summary: Read and filter the Security log for logons, failures, new accounts and privilege use.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:4.9", "cysa:1.3", "sc200:1"]
    learning_objectives:
      - Name the key Security event IDs a SOC analyst uses daily
      - Interpret logon types in event 4624
      - Query events with Event Viewer and PowerShell Get-WinEvent
    theory: |
      Windows records security-relevant activity in the **Security** event log. A handful of
      event IDs cover most investigations:

      - **4624** successful logon, **4625** failed logon, **4634/4647** logoff
      - **4672** special privileges assigned (an administrator-equivalent logon)
      - **4688** process creation (enable command-line auditing to see arguments)
      - **4720** user account created, **4728/4732** user added to a privileged group
      - **1102** the audit log was cleared, which is almost always suspicious

      Event 4624 includes a **Logon Type**: 2 interactive (at the keyboard), 3 network (SMB,
      for example), 4 batch, 5 service, 7 unlock, 10 RemoteInteractive (RDP). Many type 3 or 10
      logons from an unexpected source, especially right after a run of 4625 failures, point
      to brute force or lateral movement.

      Event Viewer is fine for browsing, but **Get-WinEvent** with a filter hashtable is how you
      search quickly and repeatably, and it is the same thinking you will later apply in a SIEM.
    examples:
      - title: Failed logons in the last 24 hours
        body: |
          Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625; StartTime=(Get-Date).AddDays(-1)} |
            Select-Object TimeCreated, @{n='User';e={$_.Properties[5].Value}}, @{n='Source';e={$_.Properties[19].Value}}
      - title: Reading a 4624 event
        body: |
          Logon Type:          10
          Account Name:        jsmith
          Source Network Address: 203.0.113.45
          An RDP logon from an external address deserves immediate review.
    exercise:
      title: Generate and hunt your own security events
      environment: A Windows 10/11 or Windows Server evaluation VM where you are administrator
      tools: [Event Viewer, PowerShell, auditpol]
      steps:
        - Run `auditpol /get /category:*` and enable success and failure auditing for Logon and Process Creation if they are off.
        - Lock the VM and sign in with a wrong password three times, then sign in correctly.
        - Create a local user with `net user labuser P@ssw0rd-Lab1 /add` and add it to Administrators with `net localgroup administrators labuser /add`.
        - Open Event Viewer > Windows Logs > Security and find the 4625, 4624, 4720 and 4732 events you caused.
        - Write a Get-WinEvent command that lists only your failed logons with time and account name.
        - Write a second command that lists 4688 events for the last hour and find the `net.exe` executions.
        - Remove the lab user with `net user labuser /delete` and confirm event 4726 was logged.
      deliverable: The two PowerShell queries and a table mapping each action you took to its event ID.
    expected_outcome: >
      You can reproduce attacker-like actions, find the exact events they generate, and query
      them from PowerShell without browsing manually.
    quiz:
      - prompt: Which event ID records a failed logon?
        options: ["4624", "4625", "4672", "4720"]
        answer: 1
        explanation: 4625 is "An account failed to log on".
      - prompt: Logon type 10 in event 4624 means
        options: [Interactive console logon, Network logon, RemoteInteractive (RDP), Service logon]
        answer: 2
        explanation: Type 10 is RemoteInteractive, used by Remote Desktop.
      - prompt: Why is event 1102 almost always investigated?
        options:
          - It means a user changed their password
          - It records the security audit log being cleared, a common anti-forensics step
          - It is generated at every reboot
          - It shows a new printer was installed
        answer: 1
        explanation: Clearing the Security log destroys evidence, so attackers often do it.
      - prompt: Which event shows a user being added to a security-enabled local group such as Administrators?
        options: ["4688", "4732", "4634", "4647"]
        answer: 1
        explanation: 4732 is "A member was added to a security-enabled local group".

  - slug: win-sysmon-powershell
    title: Process Telemetry with Sysmon and Suspicious PowerShell
    order: 2
    difficulty: intermediate
    summary: Deploy Sysmon and detect encoded PowerShell and suspicious parent-child processes.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.4", "secplus:2.4", "cysa:1.2", "sc200:2"]
    learning_objectives:
      - Explain what Sysmon adds beyond the built-in Security log
      - Recognise suspicious parent-child process relationships
      - Decode and assess an encoded PowerShell command
    theory: |
      **Sysmon** (System Monitor, from Microsoft Sysinternals) is a free driver and service that
      writes rich telemetry to *Microsoft-Windows-Sysmon/Operational*. Key events: **1** process
      creation with full command line and hashes, **3** network connection, **11** file created,
      **13** registry value set, **22** DNS query. A community configuration such as
      SwiftOnSecurity's filters out noise.

      Attackers love **living off the land**: using built-in tools like PowerShell, certutil,
      mshta and rundll32 so that nothing new needs to be installed. Context is what separates
      malicious from normal. **Parent-child relationships** are a strong signal: Word or Excel
      spawning PowerShell, or PowerShell spawned by a service binary, is rarely legitimate.

      PowerShell's `-EncodedCommand` (often shortened to `-enc` or `-e`) accepts a Base64
      UTF-16LE script. Administrators rarely use it interactively; malware uses it to hide
      download cradles such as `IEX (New-Object Net.WebClient).DownloadString(...)`. Decoding
      the string is the first step of triage.
    examples:
      - title: Suspicious Sysmon event 1
        body: |
          ParentImage: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
          Image:       C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
          CommandLine: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBi...
      - title: Decoding an encoded command
        body: |
          $b64 = 'SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkA'
          [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($b64))
          # IEX (New-Object Net.WebClient)
    exercise:
      title: Install Sysmon and catch an encoded command
      environment: Windows evaluation VM, isolated from your home network
      tools: [Sysmon, PowerShell, Event Viewer]
      steps:
        - Download Sysmon from Microsoft Sysinternals and the SwiftOnSecurity sysmon-config XML.
        - Install with `sysmon64.exe -accepteula -i sysmonconfig-export.xml` and confirm the Sysmon/Operational log exists.
        - Encode a harmless command, for example `$c = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('Get-Date; whoami'))`.
        - Run `powershell.exe -NoProfile -EncodedCommand $c` to simulate an attacker technique.
        - Find the Sysmon event 1 for that execution and record ParentImage, CommandLine and Hashes.
        - Decode the Base64 from the event back to plain text with PowerShell.
        - Write a Get-WinEvent query that returns Sysmon event 1 entries whose CommandLine contains `-enc` or `-EncodedCommand`.
      deliverable: Screenshot of the event, the decoded command, and your detection query.
    expected_outcome: >
      You have working endpoint telemetry, can explain why a given process chain is
      suspicious, and can decode and search for encoded PowerShell.
    quiz:
      - prompt: Which Sysmon event ID records process creation?
        options: ["1", "3", "11", "22"]
        answer: 0
        explanation: Sysmon event 1 is ProcessCreate, including command line and hashes.
      - prompt: Which parent-child pair is most suspicious?
        options:
          - explorer.exe starting chrome.exe
          - services.exe starting svchost.exe
          - winword.exe starting powershell.exe
          - explorer.exe starting notepad.exe
        answer: 2
        explanation: Office applications spawning a shell is a common sign of a malicious macro.
      - prompt: What encoding does PowerShell -EncodedCommand expect?
        options: [Hex, Base64 of UTF-16LE text, ROT13, Base64 of ASCII text]
        answer: 1
        explanation: The script is UTF-16LE (Unicode) text encoded as Base64.
      - prompt: '"Living off the land" means attackers'
        options:
          - Only attack agricultural companies
          - Use tools already present on the system to avoid detection
          - Physically break into buildings
          - Use only zero-day exploits
        answer: 1
        explanation: Built-in binaries such as PowerShell or certutil blend in with normal administration.

  - slug: win-ad-authentication
    title: Active Directory and Authentication Monitoring
    order: 3
    difficulty: intermediate
    summary: Read Windows logon and Kerberos events to spot account enumeration, suspicious logon types and lateral movement.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "secplus:2.4", "cysa:1.2", "sc200:4"]
    learning_objectives:
      - Explain how Active Directory authentication appears in the event logs
      - Read logon types and Kerberos events to judge whether a logon is normal
      - Spot indicators of account enumeration and lateral movement
    theory: |
      Most enterprise logons flow through **Active Directory**, so the domain
      controllers and endpoints together tell the story of who authenticated where.
      Two protocols matter. **Kerberos** is normal in a domain: a client gets a
      **ticket-granting ticket** (event 4768) and then service tickets (4769) to reach
      resources. **NTLM** is older and, when it appears for something that should use
      Kerberos, can be a clue worth checking. On each machine, logons appear as **4624**
      (success) and **4625** (failure), and the **logon type** says how: type 2 is
      interactive at the console, type 3 is over the network, type 10 is Remote Desktop.
      A service account suddenly doing a type-10 interactive logon, or a workstation
      account authenticating to many hosts, stands out against its own baseline.

      Attackers probe AD before moving. **Account and group enumeration** shows up as a
      burst of directory queries or many 4769 requests from one source. **Password
      spraying** is one or two failed logons (4625) against many different accounts from
      a single host, the mirror image of brute force against one account. **Lateral
      movement** often looks like one credential authenticating to a series of machines
      over the network (type 3) in a short window, sometimes with tools that trigger
      service creation (7045) on the targets.

      You judge these by **baseline and context**, not single events. Admin logons at
      3am, a service account used interactively, Kerberos tickets requested for services
      an account never touches, and the same account appearing on ten hosts in five
      minutes are all worth an investigation. Defensively, the same telemetry drives
      hardening: tiered admin accounts, limiting where privileged accounts can log on,
      and alerting on the specific event patterns above.
    examples:
      - title: Logon types tell you how someone got in
        body: |
          4624 logon success, account svc_backup
          LogonType 10 (RemoteInteractive / RDP)  from WKSTN-07
          Expected: svc_backup runs as a service (type 5), never RDP.
          Verdict: investigate - a service account being used interactively is abnormal.
      - title: Password spraying vs brute force
        body: |
          Brute force: 200x 4625 for one account from one host  (one door, many keys)
          Spraying:    1-2x 4625 each for 200 accounts from one host (many doors, one key)
          Spraying stays under per-account lockout thresholds, so count by source, not account.
    exercise:
      title: Investigate domain authentication in a lab
      environment: A Windows lab with a domain controller and one client (an evaluation AD lab or two VMs), or a provided sample of exported security events
      tools: [Event Viewer or a SIEM, the sample/live Security logs, a spreadsheet]
      steps:
        - Generate normal domain activity (a couple of user logons and a network share access) and locate the 4624 events, recording the logon type for each.
        - Produce several failed logons for different accounts from one host to simulate spraying, then write a query or filter that counts 4625 by source host rather than by account.
        - Identify a logon that does not fit its account's baseline (for example a service account with an interactive or RDP logon) and explain why it is suspicious.
        - Find the Kerberos ticket events (4768/4769) for one account and note which services it requested tickets for.
        - Describe one realistic lateral-movement pattern you could detect from type-3 logons across multiple hosts in a short window.
        - Write two detection ideas (the event IDs and the condition) you would hand to a SIEM, each mapped to a MITRE ATT&CK technique.
        - Recommend one hardening change (for example restricting where a privileged account may log on) justified by what you observed.
      deliverable: A short investigation note listing the logon types you saw, the spraying count-by-source query, one abnormal logon with reasoning, and two ATT&CK-mapped detection ideas.
    expected_outcome: >
      You can read Windows logon and Kerberos events, tell a normal logon from a
      suspicious one using type and baseline, and describe how enumeration and lateral
      movement appear in the logs.
    quiz:
      - prompt: A Windows logon event (4624) with logon type 10 means the logon was
        options: [A service starting, Interactive at the console, Over the network, Remote Desktop]
        answer: 3
        explanation: Type 10 is RemoteInteractive, i.e. a Remote Desktop session.
      - prompt: Many accounts each seeing one or two failed logons from a single host most likely indicates
        options: [Brute force, Password spraying, A normal morning, A software update]
        answer: 1
        explanation: Spraying tries a few passwords across many accounts to stay under lockout thresholds.
      - prompt: Why is a service account with an interactive (type 2) or RDP (type 10) logon suspicious?
        options:
          - Service accounts cannot log on
          - Service accounts normally authenticate as a service (type 5), not interactively
          - Interactive logons are always malicious
          - It uses more memory
        answer: 1
        explanation: A service account used interactively deviates from its expected logon type and warrants investigation.
      - prompt: To detect password spraying you should count failed logons primarily by
        options: [Account name, Source host, Time of day, Domain controller]
        answer: 1
        explanation: Spraying spreads across accounts, so grouping by source host surfaces it; per-account counts stay low.
      - prompt: Kerberos service ticket requests appear as which event, useful for spotting access to unusual services?
        options: ["4625", "4769", "7045", "4688"]
        answer: 1
        explanation: Event 4769 is a Kerberos service ticket request; unusual target services can indicate reconnaissance or movement.

  - slug: win-persistence-autoruns
    title: Hunting Windows Persistence in Registry, Tasks and Services
    order: 4
    difficulty: intermediate
    summary: Find how malware survives a reboot using autoruns, scheduled tasks and services.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.9", "secplus:2.4", "cysa:1.2", "sc200:2"]
    learning_objectives:
      - List the main Windows persistence locations an attacker uses to survive a reboot
      - Enumerate autoruns, scheduled tasks and services and tell normal from suspicious
      - Map a persistence finding back to the event that created it
    theory: |
      **Persistence** is how an attacker keeps access after a reboot or logoff. Windows offers
      dozens of auto-start locations, and defenders need to know the common ones. The **Run and
      RunOnce registry keys** under both `HKCU` and `HKLM` launch a program at logon. **Scheduled
      tasks** run code on a trigger, at logon, on a timer, or on an event, and are a favourite
      because they look administrative. **Windows services** start code at boot, often as SYSTEM.

      Legitimate software uses all of these, so the skill is telling normal from malicious. Signs
      worth a closer look include an auto-start entry pointing at a user profile or temp folder, a
      command line that calls `powershell`, `rundll32` or `mshta` with encoded arguments, an
      unsigned binary, or a service with a random name. **Sysinternals Autoruns** lists every
      auto-start location in one place and can hide Microsoft-signed entries so the unusual ones
      stand out.

      Each persistence mechanism leaves a trace when it is created. A new service writes event
      **7045** to the System log, and a new or changed scheduled task writes **4698** and **4702**
      to the Security log. Finding the auto-start entry tells you what survives a reboot; finding
      the creating event tells you when it arrived and often which account did it.
    examples:
      - title: A Run key pointing at a temp folder
        body: |
          HKCU\Software\Microsoft\Windows\CurrentVersion\Run
          Updater = C:\Users\sam\AppData\Local\Temp\svc.exe
          A logon auto-start from a temp folder with a generic name is a classic red flag.
      - title: A service-creation event
        body: |
          Event ID 7045 (System log)
          Service Name = WinHelpSvc
          Image Path  = C:\Windows\Temp\a.exe
          Record the time and the host, then pivot to who was logged on.
    exercise:
      title: Enumerate and triage persistence on a lab VM
      environment: A disposable Windows lab VM; do not run unknown binaries on a production host
      tools: [Sysinternals Autoruns, Task Scheduler, Event Viewer, PowerShell]
      steps:
        - On a lab VM, run Autoruns and turn on Options then Hide Microsoft Entries to cut the noise.
        - Review the Logon, Scheduled Tasks and Services tabs and note any entry in a user or temp folder.
        - In PowerShell, list services with `Get-CimInstance Win32_Service | Select Name,PathName,StartMode` and look for odd image paths.
        - List scheduled tasks with `Get-ScheduledTask` and inspect the actions of any you do not recognise.
        - In Event Viewer, filter the System log for event 7045 and the Security log for 4698 to find when suspicious entries were created.
        - For one suspicious entry, write a line explaining what it runs, where it starts from and when it was created.
      deliverable: A list of auto-start entries you would investigate, each with its location, command line and creating event ID and time.
    expected_outcome: >
      You can enumerate the common Windows persistence locations, separate normal
      software from suspicious entries, and tie a finding back to the event that created it.
    quiz:
      - prompt: Which registry keys launch a program at user logon?
        options: [SAM and SECURITY, Run and RunOnce, The SYSTEM and SOFTWARE hives only, The boot configuration data store]
        answer: 1
        explanation: The Run and RunOnce keys under HKCU and HKLM start programs at logon and are common persistence spots.
      - prompt: A newly created Windows service is recorded by which event ID?
        options: ["4624", "7045", "4104", "5140"]
        answer: 1
        explanation: Event 7045 in the System log records service installation, a frequent persistence technique.
      - prompt: Why turn on Hide Microsoft Entries in Autoruns?
        options:
          - It deletes Microsoft software
          - It removes signed, expected entries so unusual auto-starts stand out
          - It speeds up the boot
          - It disables persistence
        answer: 1
        explanation: Filtering out signed Microsoft entries shrinks the list to the third-party and unexpected items worth reviewing.
      - prompt: Which scheduled-task detail most warrants investigation?
        options: [A task signed by Microsoft running Windows Update, A task that runs encoded PowerShell from a temp folder, A daily disk-cleanup task, A task that runs at a fixed time each day]
        answer: 1
        explanation: Encoded PowerShell launched from a temp folder on a trigger is a common persistence and execution pattern.

  - slug: win-credential-theft
    title: Detecting Credential Theft and LSASS Access
    order: 5
    difficulty: advanced
    summary: Detect credential dumping from LSASS, the SAM hive and Active Directory replication.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "secplus:2.4", "cysa:1.2", "sc200:2"]
    learning_objectives:
      - Explain where Windows keeps credentials and how attackers try to steal them
      - Recognise the telemetry that LSASS access and credential dumping leave behind
      - Name the defences that make credential theft harder to pull off
    theory: |
      Once an attacker lands on a Windows host they want credentials to move further, and the
      richest target is **LSASS**, the process that caches secrets for signed-in users. Reading its
      memory is the classic credential-dumping step. A SOC does not need to know the offensive tool;
      it needs the trace. **Sysmon event 10 (ProcessAccess)** to `lsass.exe` from an unexpected
      process, especially with access masks like `0x1010` or `0x1410`, is the signal, as is a
      process opening a handle to LSASS that is not your antivirus or EDR.

      Attackers have other routes worth watching. Copying the **SAM and SYSTEM registry hives**
      yields local password hashes offline. **DCSync** abuses Active Directory replication to ask a
      domain controller for password data; from a machine that is not a domain controller it shows
      as event **4662** referencing the directory-replication permission. Each of these has a small,
      recognisable footprint once you know to look for it.

      Detection rests on a **baseline**: a short list of processes that legitimately touch LSASS or
      request replication, so everything else stands out. The defences are layered. **Credential
      Guard** isolates secrets in virtualisation-based security, **LSA protection (RunAsPPL)** stops
      ordinary processes reading LSASS, and least privilege limits who can run the dump at all.
      Alerting on LSASS access turns a silent theft into an investigation.
    examples:
      - title: Suspicious LSASS access in Sysmon
        body: |
          Sysmon EID 10  SourceImage=C:\Users\sam\AppData\Local\Temp\x.exe
                         TargetImage=C:\Windows\System32\lsass.exe  GrantedAccess=0x1410
          A temp-folder process reading LSASS memory is a credential-dumping signal.
      - title: DCSync from a non-DC
        body: |
          EID 4662  account=svc-app  properties=DS-Replication-Get-Changes-All
          A replication request from an account that is not a domain controller is abnormal.
    exercise:
      title: Build credential-theft detections from sample telemetry
      environment: A SIEM or notebook with sample Sysmon and Security-log events
      tools: [Sample Sysmon and Windows Security logs, a SIEM or notebook, a notes file]
      steps:
        - List the processes in the sample data that access lsass.exe and baseline which are legitimate (AV or EDR).
        - Write a detection idea for LSASS ProcessAccess from any process outside that baseline.
        - Search for access to the SAM and SYSTEM registry hives and note what a copy of them would expose.
        - Look for event 4662 referencing directory replication from an account that is not a domain controller.
        - For each hit, decide whether it is a real credential-theft attempt or expected activity, and say why.
        - Recommend one hardening step (Credential Guard, LSA protection or least privilege) for the environment.
      deliverable: A set of credential-theft detection ideas with the baseline they rely on and one recommended hardening step.
    expected_outcome: >
      You can recognise LSASS access, hive theft and DCSync in the telemetry, tell it
      from expected activity with a baseline, and name the defences that blunt it.
    quiz:
      - prompt: Which process is the classic target for credential dumping on Windows?
        options: [explorer.exe, lsass.exe, notepad.exe, spoolsv.exe]
        answer: 1
        explanation: LSASS caches the secrets of signed-in users, so reading its memory is the classic credential-dumping step.
      - prompt: A temp-folder process opening LSASS with access mask 0x1410 is best treated as
        options:
          - Normal system behaviour
          - A likely credential-dumping attempt to investigate
          - A DNS query
          - A software update
        answer: 1
        explanation: Unexpected processes reading LSASS memory, especially from a temp folder, are a strong credential-theft signal.
      - prompt: DCSync abuse shows up as
        options:
          - A replication request (event 4662) from an account that is not a domain controller
          - A failed login
          - A new scheduled task
          - A normal DNS lookup
        answer: 0
        explanation: DCSync asks a domain controller for password data via replication, so a replication request from a non-DC account is abnormal.
      - prompt: Which defence isolates secrets so ordinary processes cannot read LSASS?
        options: [A faster CPU, Credential Guard, A larger page file, Disabling logging]
        answer: 1
        explanation: Credential Guard uses virtualisation-based security to keep LSASS secrets out of reach of normal processes.

  - slug: win-lateral-movement
    title: Detecting Lateral Movement in Windows Logs
    order: 6
    difficulty: advanced
    summary: Spot remote-service, WMI and RDP lateral movement from Windows authentication and service events.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.4", "sc200:4"]
    learning_objectives:
      - Describe the common Windows lateral-movement techniques and the logs that record them
      - Read logon types to tell interactive, network and remote-desktop access apart
      - Reconstruct a movement path across hosts from authentication and service-creation events
    theory: |
      Once an attacker has one set of credentials, the next step is **lateral movement**, using those
      credentials to reach other Windows hosts. The common techniques all leave traces: remote
      service creation (the classic PsExec pattern), **WMI** and WinRM remote execution, scheduled
      tasks created on a remote host, and **RDP**. Each writes to Windows logs, so the movement is
      visible if you know where to look.

      **Logon types** are the key. Event 4624 records a successful logon with a type code: type 2 is
      interactive at the console, type 3 is a network logon (file shares, PsExec, WMI), and type 10
      is RemoteInteractive, which is RDP. A burst of type 3 logons from one account across many
      servers, or a type 10 logon to a host the user never uses, is a movement signal. On the
      destination host, a PsExec-style attack also creates a service, so event **7045** (a new
      service installed) with a random-looking name right after a network logon ties the two
      together.

      The analyst's job is to **reconstruct the path**. Movement is a chain: a logon on host A, then
      a network logon from A to host B, then a service or task created on B, then a logon from B to
      host C. Correlating 4624 by account, source host and time across machines rebuilds that chain
      and shows how far the attacker reached. This is distinct from the earlier authentication-
      monitoring lesson, which watched a single host's logons; here you are following one identity
      as it hops from host to host across the domain.
    examples:
      - title: A network logon followed by a service creation
        body: |
          host SRV-02  4624 logon type 3  account svc-admin  source WKS-19
          host SRV-02  7045 new service "a7f3" image \\\\WKS-19\\share\\p.exe
          A network logon immediately followed by a random-named service is the PsExec pattern.
      - title: RDP to an unusual host
        body: |
          host SRV-07  4624 logon type 10 (RemoteInteractive)  account jdoe  source SRV-02
          A type 10 logon to a server the user never administers, sourced from another server, is movement.
    exercise:
      title: Reconstruct a lateral-movement path from sample events
      environment: A sample set of Windows security and system events (4624, 4625, 7045, task creation) across several hosts
      tools: [Sample multi-host Windows event logs, a notes file or spreadsheet]
      steps:
        - List the logon types you see and say what each (type 2, 3, 10) means for how the host was accessed.
        - Find the account that logs on across the most hosts and note the source host for each logon.
        - Identify any 7045 service-creation or remote task event that follows a network logon on the same host.
        - Draw the movement chain host by host, from the first logon to the furthest host reached.
        - State which single compromised account drove the movement and what evidence shows it.
        - List the hosts that need isolating and the order you would work them.
      deliverable: A lateral-movement timeline naming the account, the host-to-host path, and the service or task events that confirm each hop.
    expected_outcome: >
      You can read Windows logon types, recognise remote-execution patterns, and reconstruct a
      lateral-movement path across several hosts from authentication and service events.
    quiz:
      - prompt: Which Windows logon type in event 4624 indicates an RDP (RemoteInteractive) session?
        options: [Type 2, Type 3, Type 10, Type 5]
        answer: 2
        explanation: Type 10 is RemoteInteractive (RDP); type 2 is interactive at the console, type 3 is a network logon.
      - prompt: A network logon (type 3) immediately followed by event 7045 installing a random-named service suggests
        options:
          - A Windows update
          - Remote service-based execution, the classic PsExec lateral-movement pattern
          - A normal user login
          - A printer being added
        answer: 1
        explanation: PsExec-style tools authenticate over the network and create a service to run, so the two events pair up.
      - prompt: To reconstruct a lateral-movement path you mainly correlate
        options:
          - Only CPU usage
          - Logon events by account, source host and time across multiple machines
          - Font cache files
          - A single host's screenshots
        answer: 1
        explanation: Movement is a chain of logons hop to hop, so correlating 4624 by account, source and time across hosts rebuilds it.
      - prompt: How does this differ from monitoring one host's authentication?
        options: [It is identical, It follows one identity hopping from host to host across the domain, It ignores logons, It only reads RDP]
        answer: 1
        explanation: Single-host monitoring watches one machine; lateral-movement detection tracks an identity moving across many.
  - slug: win-hardening-asr
    title: Windows Endpoint Hardening and Attack Surface Reduction
    order: 7
    difficulty: intermediate
    summary: Shrink what an attacker can do on a Windows endpoint with attack surface reduction rules, application control and hardened defaults, and verify the hardening actually holds.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc200:2", "cysa:1.4"]
    learning_objectives:
      - Explain attack surface reduction and why prevention complements detection
      - Apply application control and ASR-style rules to block common attack techniques
      - Verify hardening with a baseline and confirm it does not break legitimate work
    theory: |
      Detection catches what gets through; **hardening** removes the opportunity in the first place.
      On Windows the goal of **attack surface reduction** is to shut the doors attackers routinely
      walk through, Office spawning scripts, macros reaching the internet, credential theft from LSASS,
      executables running from user temp folders, without waiting for a detection to fire. Microsoft
      Defender ships **ASR rules** that block exactly these behaviours, and each one maps to a technique
      seen in real intrusions.

      **Application control** is the stronger lever. Instead of blocking known-bad, **AppLocker** and
      **Windows Defender Application Control** allow only approved code to run, so an attacker's dropped
      binary or script simply does not execute. The trade-off is operational: an allow-list must be
      built from what the business actually runs, which is why these are usually deployed in **audit
      mode** first to learn the environment, then enforced. Hardened defaults round it out, disabling
      legacy protocols like SMBv1, constraining PowerShell with Constrained Language Mode, and enforcing
      a security **baseline** such as the Microsoft or CIS benchmarks.

      Hardening is only real if it is **verified and maintained**. You confirm a setting is applied (not
      just configured) by checking the endpoint against the baseline, and you check that enforcement did
      not break legitimate work, an over-tight AppLocker policy that blocks a line-of-business app causes
      an outage and gets rolled back in a panic, which is worse than no policy. So hardening is staged:
      measure, apply in audit, review what would have been blocked, then enforce, and keep the baseline
      current as the environment changes. Prevention and detection work together; a blocked technique that
      also logs tells the SOC an attempt happened.
    examples:
      - title: An ASR rule blocking a real technique
        body: |
          Technique: Office app spawns a child process (macro -> powershell)
          ASR rule:  "Block Office apps from creating child processes"
          Result:    the macro payload cannot launch; the block is also logged for the SOC
      - title: Application control staged safely
        body: |
          Audit mode:  log what WOULD be blocked for 2 weeks -> build the allow list
          Enforce:     only approved, signed code runs; dropped malware.exe fails to start
          Guardrail:   review audit logs first so a business app is not blocked on day one
    exercise:
      title: Harden a Windows test VM and verify it
      environment: A disposable Windows VM (or a provided hardening checklist and sample baseline report) you can change and revert
      tools: [A Windows VM or lab, Defender/ASR and AppLocker settings or their documentation, a security baseline (CIS or Microsoft), a notes file]
      steps:
        - Capture the VM's current state against a baseline (CIS or Microsoft) and list three settings that are weaker than the baseline recommends.
        - Enable two ASR-style rules (for example blocking Office child processes and credential theft from LSASS) and note the technique each one stops.
        - Configure application control in audit mode and record what it would block, then explain how you would turn audit into enforcement safely.
        - Disable one legacy feature (such as SMBv1) and confirm it is actually off, not just configured.
        - Re-check the VM against the baseline and confirm the three weak settings are now compliant.
        - Test one piece of legitimate activity and confirm your hardening did not break it, noting what you would do if it had.
      deliverable: A before/after baseline comparison, the ASR and application-control changes with the techniques they block, and a note confirming legitimate work still functions.
    expected_outcome: >
      You can harden a Windows endpoint with ASR rules, application control and baseline settings,
      verify the hardening is actually applied, and confirm it reduces attack surface without breaking
      legitimate work.
    quiz:
      - prompt: Attack surface reduction aims to
        options:
          - Replace all detection
          - Remove the opportunities attackers use, so techniques are blocked before a detection is needed
          - Delete event logs
          - Speed up the endpoint
        answer: 1
        explanation: Hardening prevents common techniques outright, complementing detection rather than replacing it.
      - prompt: Why is application control usually deployed in audit mode first?
        options:
          - To make it run faster
          - To learn what the business actually runs before enforcing an allow list, avoiding outages
          - Because audit mode blocks more
          - It is required by law
        answer: 1
        explanation: Audit mode reveals what would be blocked so the allow list is built safely before enforcement.
      - prompt: Allow-listing (application control) is stronger than blocking known-bad because
        options:
          - It uses less memory
          - Only approved code runs, so an attacker's dropped binary or script simply will not execute
          - It never needs maintenance
          - It disables logging
        answer: 1
        explanation: Allow-listing denies everything not explicitly approved, so novel malware fails to run.
      - prompt: Hardening is only real once you
        options:
          - Configure a setting
          - Verify it is actually applied and confirm it did not break legitimate work
          - Write a policy document
          - Reboot once
        answer: 1
        explanation: A configured-but-unverified setting may not be in effect, and unchecked enforcement can cause outages.
  - slug: win-data-protection-credential-guard
    title: Windows Data Protection and Credential Guard
    order: 8
    difficulty: intermediate
    summary: Protect data and secrets on Windows with BitLocker, Credential Guard and the data protection APIs, and understand what each does and does not stop.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "secplus:4.6", "cysa:1.3"]
    learning_objectives:
      - Explain how BitLocker protects data at rest and its threat model
      - Describe how Credential Guard isolates secrets from theft
      - Identify what these controls stop and the gaps that remain
    theory: |
      Windows ships strong data-protection features, but using them well means knowing exactly what each
      defends against. **BitLocker** encrypts the volume so a lost or stolen laptop does not leak data,
      using the **TPM** to release the key only to a known-good boot state, optionally with a PIN or key
      for stronger assurance. Its threat model is **offline** attack: it protects data at rest, but once
      the system is booted and unlocked, BitLocker is doing its job and no longer stands between a logged-in
      attacker and the files. That is why it pairs with access control, not replaces it.

      Credential theft is the engine of lateral movement, so Windows isolates secrets. **Credential Guard**
      uses virtualisation-based security to hold derived credentials (such as NTLM hashes and Kerberos
      tickets) in an isolated process the normal OS, and thus malware with admin rights, cannot read. This
      blunts pass-the-hash and pass-the-ticket by removing the material those attacks steal from LSASS. It
      is not total: it does not stop a keylogger capturing a password as it is typed, nor protect
      credentials on systems where it is not enabled, so it is one strong layer among several.

      Around these sit the **data protection APIs** (DPAPI) that applications use to encrypt secrets tied to
      a user or machine, and policies like requiring encryption on removable media. The analyst's job is to
      know the boundaries: BitLocker beats a stolen disk but not a live session; Credential Guard beats
      hash theft from memory but not a typed-password capture. Hardening is choosing the right control for
      the actual threat and verifying it is enabled, because a feature configured but not in effect protects
      nothing.
    examples:
      - title: What BitLocker does and does not stop
        body: |
          Stops:  stolen laptop / pulled drive -> data unreadable without the key
          Not:    a logged-in attacker on the running, unlocked system
          Pair with access control and screen lock for the live-session gap.
      - title: Credential Guard against hash theft
        body: |
          Without: malware with admin reads NTLM hashes from LSASS -> pass-the-hash
          With:    secrets live in VBS-isolated memory the OS cannot read
          Gap:     a keylogger still captures a password typed at the keyboard.
    exercise:
      title: Verify Windows data and credential protections on a VM
      environment: A Windows VM or a provided configuration/report, with BitLocker and Credential Guard settings (or their documentation)
      tools: [A Windows VM or config report, BitLocker and Credential Guard status tools or docs, a notes file]
      steps:
        - Check whether BitLocker is enabled on the system volume and how the key is protected (TPM only, TPM plus PIN, or recovery key).
        - State one attack BitLocker stops and one it does not, based on its at-rest threat model.
        - Check whether Credential Guard (virtualisation-based security) is enabled and confirm it is actually running, not just configured.
        - Describe one credential-theft technique Credential Guard blunts and one it does not.
        - Identify one piece of data on the system that is not covered by these controls and how you would protect it.
        - Recommend one improvement (for example adding a PIN, enabling Credential Guard, or encrypting removable media) with the threat it addresses.
      deliverable: A verification note covering BitLocker's state and threat model, Credential Guard's state and what it blunts, one uncovered data gap, and one prioritised improvement.
    expected_outcome: >
      You can explain and verify BitLocker and Credential Guard on Windows, state precisely what each
      control stops and what remains exposed, and choose the right protection for the actual threat.
    quiz:
      - prompt: BitLocker's threat model primarily protects data
        options:
          - On a running, unlocked system
          - At rest against a lost or stolen disk
          - From network attacks
          - From phishing
        answer: 1
        explanation: BitLocker defends offline data; once booted and unlocked it no longer stands between a logged-in attacker and files.
      - prompt: Credential Guard reduces the impact of
        options:
          - Phishing emails
          - Credential theft from memory such as pass-the-hash
          - Slow disks
          - Weak Wi-Fi
        answer: 1
        explanation: It isolates derived credentials in VBS memory so malware cannot steal the hashes and tickets those attacks reuse.
      - prompt: A gap Credential Guard does NOT close is
        options:
          - Pass-the-hash
          - A keylogger capturing a password as it is typed
          - Pass-the-ticket
          - Reading LSASS memory
        answer: 1
        explanation: Credential Guard protects stored secrets, not a password captured at the moment of entry.
      - prompt: A security feature that is configured but not actually running
        options: [Still fully protects, Protects nothing until verified as in effect, Is safer that way, Needs no checking]
        answer: 1
        explanation: Verification matters because a feature not actually enabled provides no protection.
  - slug: win-group-policy-baselines
    title: Group Policy and Security Baselines
    order: 9
    difficulty: intermediate
    summary: Use Group Policy and security baselines to configure Windows securely at scale, and monitor for the GPO changes an attacker uses to weaken defences or persist.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "secplus:2.5", "cysa:1.3"]
    learning_objectives:
      - Explain how Group Policy configures Windows at scale
      - Describe security baselines and why they standardise hardening
      - Monitor Group Policy for changes that weaken security or persist
    theory: |
      Configuring one Windows machine securely is easy; configuring thousands consistently is the real
      problem, and **Group Policy** is how Active Directory solves it. A Group Policy Object (GPO) is a set of
      settings, password rules, audit logging, service configuration, software restrictions, that is linked to
      part of the directory and applied automatically to every computer or user it covers. This is how an
      organisation enforces a standard everywhere at once: turn on a setting in a GPO and it reaches every
      machine in scope, rather than relying on each being configured by hand. For defenders it is the
      backbone of hardening at scale.

      Rather than invent every setting, teams start from a **security baseline**, a published, vetted set of
      recommended settings (Microsoft's own baselines and the CIS benchmarks are the common ones) that
      represents a sensible hardened starting point. A baseline standardises the hundreds of individual
      choices, enabling audit logging that detections depend on, disabling weak protocols, enforcing account
      policies, so that compliance becomes measurable: you can compare a machine against the baseline and see
      exactly where it drifts. Baselines are tailored, not applied blindly, because an over-aggressive setting
      can break a business application, but they turn "configure securely" into a concrete, reviewable target.

      Because Group Policy is so powerful, it is also an attacker's lever, and monitoring it is essential. An
      attacker with the right privilege can modify a GPO to disable logging, weaken password policy, add
      themselves to local administrators across every machine, or deploy a malicious scheduled task
      domain-wide, powerful persistence and evasion in a single change. So changes to GPOs, especially to
      audit policy, privileged group membership delivered by policy, or startup scripts, are high-value
      detections. The analyst watches for GPO modification events and compares live configuration against the
      baseline, because a quiet change that turns off the logging your detections rely on is exactly the kind
      of move that precedes a larger attack.
    examples:
      - title: One GPO, applied everywhere
        body: |
          GPO "Audit Policy" -> linked to the Workstations OU
          -> every workstation logs process creation and logons automatically
          Change it once; it reaches every machine in scope.
      - title: A GPO change worth alerting on
        body: |
          GPO modified: audit logging for logons turned OFF
          Expected? almost never -> an attacker blinding the detections
          GPO change events + baseline comparison catch this.
    exercise:
      title: Apply a baseline via Group Policy and monitor for drift
      environment: A Windows/AD lab (or a provided baseline, GPO export and sample change events)
      tools: [A Windows/AD lab or sample GPO data, a published security baseline (Microsoft or CIS), a notes file]
      steps:
        - Explain how a single GPO enforces a setting across many machines and why that matters for hardening at scale.
        - Take a published security baseline and identify three settings it standardises that a detection or audit would rely on.
        - Describe how you would compare a live machine against the baseline to find configuration drift.
        - Explain why a baseline is tailored rather than applied blindly, with one example of a setting that could break an application.
        - Review sample GPO change events and identify one modification that would weaken security or aid persistence.
        - State how you would confirm that change was unauthorised and the detection you would build for GPO modifications.
      deliverable: A note covering how GPO enforces settings at scale, three baseline settings that matter for detection, a drift-comparison method, one risky GPO change found, and a GPO-modification detection.
    expected_outcome: >
      You can explain how Group Policy configures Windows at scale, use a security baseline to standardise and
      measure hardening, and monitor Group Policy for the changes an attacker uses to disable logging, escalate
      privilege or persist.
    quiz:
      - prompt: Group Policy's main value for security is that it
        options:
          - Speeds up logons
          - Enforces a consistent configuration across many machines automatically
          - Encrypts disks
          - Replaces antivirus
        answer: 1
        explanation: A GPO applies its settings to every machine in scope, enabling hardening at scale.
      - prompt: A security baseline is
        options:
          - A network diagram
          - A published, vetted set of recommended settings that standardises hardening
          - A single password
          - A backup schedule
        answer: 1
        explanation: Baselines (Microsoft, CIS) give a concrete, measurable hardened starting point.
      - prompt: Why monitor Group Policy for changes?
        options:
          - GPOs never change
          - An attacker can modify a GPO to disable logging, weaken policy or persist across every machine at once
          - To speed up the network
          - Changes are always safe
        answer: 1
        explanation: A single malicious GPO change is powerful persistence and evasion, so GPO changes are high-value detections.
      - prompt: Comparing a live machine against the baseline reveals
        options: [Its IP address, Configuration drift, where settings no longer match the hardened standard, Its uptime, Its disk size]
        answer: 1
        explanation: Baseline comparison surfaces where a machine has drifted from the intended secure configuration.
  - slug: win-firewall-network-hardening
    title: Windows Firewall and Network Hardening
    order: 10
    difficulty: intermediate
    summary: Use Windows Defender Firewall and network hardening to limit what a Windows host accepts and initiates, and to contain lateral movement between workstations.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "secplus:4.1", "cysa:1.3"]
    learning_objectives:
      - Configure Windows Defender Firewall with inbound and outbound rules and profiles
      - Explain how host firewalling contains lateral movement
      - Harden Windows networking by disabling weak protocols and services
    theory: |
      Windows ships a capable host firewall, **Windows Defender Firewall with Advanced Security**, and using it
      well is a core hardening task that the network firewall cannot replace, because it protects each host even
      from threats already inside the network. It filters by **profile** (Domain, Private, Public), so a laptop
      can be stricter on untrusted networks than on the corporate domain, and it supports both inbound and
      outbound rules keyed on program, port, protocol and even the authenticated identity of the remote
      machine. The default stance should be the familiar one: allow only what the host genuinely needs, inbound
      and outbound, and deny the rest.

      The most valuable thing a Windows host firewall does in an enterprise is **contain lateral movement**.
      Most workstations have no legitimate reason to connect directly to each other, yet by default they often
      can, which is exactly the path an attacker uses to spread from one compromised desktop to the next over
      SMB or RPC. Blocking workstation-to-workstation traffic, so that desktops talk to servers but not to one
      another, dramatically limits how far a single compromise can reach, turning the host firewall into a
      segmentation control deployed at scale (usually via Group Policy). This is one of the highest-impact,
      lowest-cost hardening steps available.

      Network hardening on Windows goes beyond the firewall. Legacy and weak protocols are a recurring
      liability, SMBv1, LLMNR and NetBIOS name resolution, and older authentication protocols are abused for
      relay and poisoning attacks, so disabling what is not needed closes real attack paths. Unneeded network
      services and open ports are reduced, and remote-management surfaces (RDP, WinRM) are restricted to known
      sources. The analyst's view is that each of these is both a control and a source of signal: the firewall
      logs blocked connections, and a workstation suddenly attempting SMB connections to many peers, now blocked
      and logged, is a strong lateral-movement indicator to confirm against what that host normally does.
    examples:
      - title: Containing lateral movement
        body: |
          Default: workstation can reach workstation over SMB -> attacker's spread path
          Hardened: desktops talk to servers, NOT to each other
          One compromise can no longer hop desktop to desktop.
      - title: Weak protocols to disable
        body: |
          SMBv1, LLMNR, NetBIOS -> abused for relay and name-poisoning attacks
          Disable what is not needed -> closes real attack paths
          Restrict RDP/WinRM to known management sources.
    exercise:
      title: Harden a Windows host's firewall and network configuration
      environment: A Windows VM (or a provided firewall-rule export and network configuration)
      tools: [A Windows VM or config export, the firewall tooling or its policy, a notes file]
      steps:
        - Review the host's firewall profiles and inbound/outbound rules and state what is allowed and what should be denied by default.
        - Design a rule that blocks workstation-to-workstation traffic and explain how it contains lateral movement.
        - Identify which legacy or weak protocols (SMBv1, LLMNR, NetBIOS) are present and which you would disable, with the attack each enables.
        - Restrict a remote-management surface (RDP or WinRM) to known sources and explain the risk you are reducing.
        - Describe how these rules would be deployed consistently across many machines (for example via Group Policy).
        - Identify one firewall-log signal (a host attempting SMB to many peers) that would indicate lateral movement and how you would confirm it.
      deliverable: A Windows network-hardening note covering the firewall default stance, a workstation-isolation rule, weak protocols to disable, a restricted management surface, scaled deployment, and one lateral-movement log signal.
    expected_outcome: >
      You can configure Windows Defender Firewall with profiles and rules, use host firewalling to contain
      lateral movement between workstations, and harden Windows networking by disabling weak protocols and
      restricting management surfaces.
    quiz:
      - prompt: Why does a host firewall complement the network firewall?
        options:
          - It is faster
          - It protects each host even from threats already inside the network
          - It replaces antivirus
          - It only works offline
        answer: 1
        explanation: Host firewalling defends a machine from internal threats the perimeter firewall never sees.
      - prompt: Blocking workstation-to-workstation traffic on Windows hosts primarily
        options:
          - Speeds up logons
          - Contains lateral movement by removing the desktop-to-desktop path attackers use to spread
          - Disables the domain
          - Encrypts disks
        answer: 1
        explanation: Most desktops need not talk to each other, so isolating them limits how far a compromise spreads.
      - prompt: Disabling SMBv1, LLMNR and NetBIOS is worthwhile because they
        options:
          - Speed up the network
          - Are weak legacy protocols abused for relay and name-poisoning attacks
          - Are required for RDP
          - Encrypt traffic
        answer: 1
        explanation: These legacy protocols enable real relay and poisoning attacks, so disabling unneeded ones closes attack paths.
      - prompt: A Windows host suddenly attempting SMB connections to many peers (now blocked and logged) is
        options: [Routine, A strong lateral-movement indicator to confirm against the host's normal behaviour, A backup, A patch]
        answer: 1
        explanation: Fan-out SMB attempts from one host suggest an attacker spreading, worth confirming in context.
  - slug: win-event-forwarding
    title: Windows Event Forwarding and Centralised Logging
    order: 11
    difficulty: intermediate
    summary: Get the right Windows events off the endpoints and into a central place reliably, because logs that stay on a machine an attacker controls are logs you cannot trust or search.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:1", "cysa:1.3"]
    learning_objectives:
      - Explain why Windows logs must be centralised, not left on endpoints
      - Describe Windows Event Forwarding and what to collect
      - Decide which events matter so the central store is useful, not just large
    theory: |
      Windows records a great deal locally, but logs that live only on the endpoint have two fatal problems:
      an attacker who compromises the machine can **delete or tamper** with them, and an analyst cannot search
      across thousands of machines one at a time. **Centralised logging** solves both by shipping events off
      each host to a collector (and usually onward to the SIEM) as they happen, so the record is preserved
      beyond the attacker's reach and searchable in one place. Getting logs off the box is therefore a
      foundational monitoring step, not an optional refinement.

      Windows provides this natively through **Windows Event Forwarding** (WEF): endpoints are configured
      (typically by Group Policy) to forward selected events to a collector, with no third-party agent
      required, which makes it attractive at scale. WEF uses **subscriptions** that define which events to
      forward, and the practical skill is choosing those well. The crown jewels are the security-relevant
      events: logons and logon failures, process creation (ideally with command lines, and enriched by
      **Sysmon** for richer process, network and image-load telemetry), account and group changes, service and
      scheduled-task creation, PowerShell script-block logging, and audit-policy changes. Many of these are
      off by default, so an audit policy that actually turns them on is a prerequisite.

      The discipline is **collect what matters, not everything**. Forwarding every event overwhelms storage and
      the SIEM and buries the signal; a focused subscription of security-relevant events gives detections what
      they need at a manageable volume. There is also a monitoring angle in the pipeline itself: a host that
      suddenly **stops forwarding** events, or a spike in log-clearing events, can indicate an attacker
      covering their tracks, so the absence of expected logs is itself a signal. For the analyst, the takeaway
      is that detection depends on a reliable, centralised, well-scoped log pipeline, because a detection is
      only as good as its data, and data that stays on a compromised endpoint is data you cannot trust.
    examples:
      - title: Why centralise
        body: |
          logs on the endpoint: attacker can delete/tamper + you can't search at scale
          forwarded to a collector: preserved beyond reach + searchable in one place
          Getting logs off the box is foundational, not optional.
      - title: Collect what matters
        body: |
          forward: logons, process creation (+Sysmon), account/group changes,
                   service/task creation, PowerShell script-block, audit-policy changes
          not: every event (buries the signal, floods storage)
    exercise:
      title: Design a Windows log-forwarding and collection plan
      environment: A Windows/AD lab with Event Forwarding (or a provided audit policy, subscription config and sample forwarded events)
      tools: [A Windows/AD lab or sample config, a reference on security-relevant Windows events, a notes file]
      steps:
        - Explain the two problems with leaving logs on the endpoint and how centralisation solves each.
        - Describe how Windows Event Forwarding moves events to a collector and why Group Policy makes it scale.
        - Choose the security-relevant events to forward and note which require the audit policy to be enabled first.
        - Explain why forwarding everything is counterproductive and how a focused subscription helps detections.
        - Identify a pipeline-health signal (a host that stops forwarding, a spike in log-clearing) and why it matters.
        - State how you would confirm such a signal against normal behaviour before acting.
      deliverable: A logging plan covering why to centralise, a WEF subscription of security-relevant events with the audit-policy prerequisites, the collect-what-matters rationale, and a pipeline-health signal with its confirmation step.
    expected_outcome: >
      You can explain why Windows logs must be centralised, design a Windows Event Forwarding plan that
      collects the security-relevant events detections need, and treat gaps in the log pipeline as a signal in
      their own right.
    quiz:
      - prompt: Why centralise Windows logs instead of leaving them on endpoints?
        options:
          - To save money
          - Because an attacker can tamper with local logs and you cannot search thousands of machines individually
          - Logs are not useful
          - Endpoints have no storage
        answer: 1
        explanation: Centralising preserves logs beyond an attacker's reach and makes them searchable at scale.
      - prompt: Windows Event Forwarding is attractive at scale because it
        options:
          - Requires a third-party agent on every host
          - Is native and can be configured by Group Policy with no extra agent
          - Only works on one machine
          - Deletes events
        answer: 1
        explanation: WEF is built in and deployable via Group Policy, forwarding selected events without an added agent.
      - prompt: Forwarding every possible event is counterproductive because it
        options:
          - Improves detection
          - Overwhelms storage and the SIEM and buries the signal
          - Is required by WEF
          - Speeds up searches
        answer: 1
        explanation: A focused subscription of security-relevant events keeps volume manageable and the signal visible.
      - prompt: A host that suddenly stops forwarding events, or a spike in log-clearing, may indicate
        options: [A faster network, An attacker covering their tracks, worth investigating, A backup, A patch install]
        answer: 1
        explanation: Missing expected logs or log-clearing can be an evasion signal, so the absence of logs is itself telling.
  - slug: win-powershell-security
    title: PowerShell Security and Logging
    order: 12
    difficulty: intermediate
    summary: Secure and monitor PowerShell, the administrator's most powerful tool and the attacker's favourite, with script-block logging, AMSI, Constrained Language Mode and execution policy, so its abuse is visible and limited.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain why PowerShell is both essential and heavily abused
      - Configure PowerShell logging so its use is fully visible
      - Describe AMSI, Constrained Language Mode and execution policy as controls
    theory: |
      PowerShell is the administrator's most capable tool and, for exactly that reason, the attacker's favourite:
      it is built in, trusted, powerful, and can run code entirely in memory. Attackers use it for nearly every
      stage, downloading payloads, executing fileless malware, moving laterally, so the goal is not to remove
      PowerShell (administration needs it) but to make its use **fully visible** and to **limit** what untrusted
      code can do with it. This is a clear case of defending a legitimate, essential tool against its own abuse.

      Visibility comes from PowerShell's rich **logging**, which is off or limited by default and must be
      enabled. **Script-block logging** records the actual code that runs, even when it is obfuscated or built
      at runtime, because PowerShell logs it after de-obfuscation, which is enormously valuable since attackers
      rely on obfuscation to hide. **Module logging** records pipeline execution details, and **transcription**
      captures full session input and output to a file. Enabling these (via Group Policy) and forwarding them
      centrally turns PowerShell from a blind spot into one of the richest endpoint detection sources, exposing
      the encoded commands and download cradles that are hallmark attacker behaviour.

      Limiting abuse uses several complementary controls. The **Antimalware Scan Interface** (AMSI) lets
      antivirus inspect script content at runtime, including de-obfuscated PowerShell, so known-malicious scripts
      are caught even when loaded from memory. **Constrained Language Mode** restricts PowerShell to a safe
      subset of functionality, blocking the API and type access that many attack scripts need while leaving
      normal administration working. **Execution policy** governs which scripts may run but is a safety feature,
      not a security boundary (it is trivially bypassed), so it should never be relied on alone. Together,
      logging for visibility and AMSI plus Constrained Language Mode for limitation, make PowerShell abuse both
      harder and far more detectable. For the analyst, enabled PowerShell logging is often where an intrusion's
      clearest evidence lives, so knowing these controls, and that execution policy is not one of the strong
      ones, is core Windows defence.
    examples:
      - title: Script-block logging defeats obfuscation
        body: |
          attacker runs: powershell -enc <base64 obfuscated>
          script-block logging records the DE-OBFUSCATED code that actually ran
          -> the hidden command is now visible to the SOC.
      - title: Controls that limit abuse
        body: |
          AMSI                  -> AV inspects script content at runtime (even in-memory)
          Constrained Language  -> blocks the API/type access many attack scripts need
          Execution policy      -> a safety feature, trivially bypassed, NOT a security boundary
    exercise:
      title: Secure and monitor PowerShell on a Windows system
      environment: A Windows VM (or provided PowerShell policy settings and sample script-block logs)
      tools: [A Windows VM or sample config and logs, a reference on PowerShell logging, a notes file]
      steps:
        - Explain why PowerShell is both essential for administration and heavily abused by attackers.
        - Enable (or review) script-block logging, module logging and transcription, and explain what each captures.
        - Explain how script-block logging reveals obfuscated commands and why that matters for detection.
        - Describe how AMSI and Constrained Language Mode each limit what malicious scripts can do.
        - Explain why execution policy is not a security boundary and should not be relied on alone.
        - Review sample script-block logs and identify one command that indicates malicious use.
      deliverable: A PowerShell hardening-and-monitoring note covering the logging to enable and what each captures, how AMSI and Constrained Language Mode limit abuse, the execution-policy caveat, and one malicious command found in the logs.
    expected_outcome: >
      You can explain why PowerShell is both essential and abused, enable the logging that makes its use fully
      visible (including de-obfuscated commands), and apply AMSI and Constrained Language Mode to limit abuse
      while recognising that execution policy is not a security boundary.
    quiz:
      - prompt: Why not simply remove or block PowerShell?
        options:
          - It cannot be removed
          - Administration genuinely needs it, so the goal is to make its use visible and limit abuse instead
          - It is never abused
          - It has no logging
        answer: 1
        explanation: PowerShell is essential for admin work, so defence focuses on visibility and limitation, not removal.
      - prompt: Script-block logging is especially valuable because it
        options:
          - Speeds up scripts
          - Records the de-obfuscated code that actually ran, exposing obfuscated attacker commands
          - Disables PowerShell
          - Encrypts the disk
        answer: 1
        explanation: It logs the real code after de-obfuscation, defeating the obfuscation attackers rely on.
      - prompt: AMSI helps by
        options:
          - Blocking the network
          - Letting antivirus inspect script content at runtime, including in-memory PowerShell
          - Deleting logs
          - Replacing the firewall
        answer: 1
        explanation: AMSI exposes script content to AV at runtime so malicious scripts are caught even when loaded from memory.
      - prompt: PowerShell execution policy is
        options:
          - A strong security boundary
          - A safety feature that is trivially bypassed and should not be relied on alone
          - A logging mechanism
          - A type of malware
        answer: 1
        explanation: Execution policy prevents accidental script runs but is easily bypassed, so it is not a security control.
  - slug: win-kerberos-attacks
    title: Kerberos Attacks and Their Detection
    order: 13
    difficulty: advanced
    summary: Understand how Kerberos authentication works in Active Directory and the common attacks against it (Kerberoasting, AS-REP roasting, golden and silver tickets) and how to detect them.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "sc200:2", "cysa:1.2"]
    learning_objectives:
      - Explain how Kerberos authentication issues and uses tickets in Active Directory
      - Describe Kerberoasting, AS-REP roasting and forged-ticket attacks
      - Identify log evidence and defences for each attack
    theory: |
      **Kerberos** is the authentication protocol at the heart of Active Directory, and understanding its ticket
      flow is the key to spotting attacks on it. When a user logs on, they get a **ticket-granting ticket (TGT)**
      from the domain controller's Key Distribution Center. To reach a service, they present the TGT and receive
      a **service ticket (TGS)** encrypted with the service account's password hash. This design means a service
      ticket's encryption is only as strong as the service account's password, which is the crack through which
      several attacks reach.

      The main attacks follow from that. **Kerberoasting** requests service tickets for accounts with a Service
      Principal Name and then cracks them offline: because the ticket is encrypted with the service account's
      password hash, a weak or non-rotated service-account password falls quickly, with no further contact with
      the domain controller to alert defenders. **AS-REP roasting** targets accounts that do not require
      pre-authentication, letting an attacker request material that can likewise be cracked offline. The most
      severe are forged tickets: a **golden ticket** is a forged TGT made with the stolen KRBTGT account hash,
      granting arbitrary access across the domain, and a **silver ticket** is a forged service ticket for a
      single service made with that service's hash. These require the attacker to have already compromised key
      hashes, so they are deep-persistence and privilege-escalation techniques, not initial access.

      Detection combines **logs and hygiene**. Event ID 4769 (a service ticket was requested) is the primary
      signal for Kerberoasting, especially a burst of requests using weak encryption types (RC4) from one
      account. Anomalous ticket lifetimes, tickets for accounts that should not exist, and mismatches between a
      ticket and normal logon behaviour hint at forgery. The strongest defences are preventive: long, randomly
      generated and regularly rotated service-account passwords (or group-managed service accounts), disabling
      RC4, protecting and rotating the KRBTGT hash, and limiting which accounts have SPNs. For the analyst, the
      lesson is that Kerberos attacks are quiet by design, so baselining normal ticket activity and watching 4769
      patterns is what turns them visible.
    examples:
      - title: Kerberos ticket flow
        body: |
          logon -> TGT from KDC (domain controller)
          need service -> present TGT -> TGS service ticket, encrypted with SERVICE ACCOUNT hash
          weak point: ticket strength = service account password strength.
      - title: The attacks and their signals
        body: |
          Kerberoasting   -> request TGS for SPN accounts, crack offline  (Event 4769, RC4 burst)
          AS-REP roasting -> accounts w/o pre-auth, crack offline
          golden ticket   -> forged TGT with stolen KRBTGT hash (domain-wide)
          silver ticket   -> forged TGS with one service's hash (single service)
    exercise:
      title: Analyse Kerberos attacks and plan detection
      environment: A described AD environment with sample security logs (or a scenario)
      tools: [A scenario or sample 4769/4768 events, a document, a notes file]
      steps:
        - Explain the Kerberos ticket flow (TGT then service ticket) and why a service ticket's strength depends on the service account password.
        - Describe how Kerberoasting works and why it can run without alerting the domain controller further.
        - Review sample events and identify a pattern consistent with Kerberoasting (burst of 4769, RC4 encryption).
        - Explain the difference between a golden ticket and a silver ticket and what each requires the attacker to already hold.
        - Recommend at least three preventive defences (service-account password hygiene, disabling RC4, KRBTGT rotation).
        - State one forged-ticket indicator an analyst could watch for in logs.
      deliverable: A Kerberos-attack analysis identifying a Kerberoasting pattern in sample logs, a golden-versus-silver comparison, and a prioritised list of preventive defences plus one forgery indicator.
    expected_outcome: >
      You can explain Kerberos ticketing, describe Kerberoasting, AS-REP roasting and forged-ticket attacks,
      recognise their log evidence, and recommend the service-account and KRBTGT defences that counter them.
    quiz:
      - prompt: Kerberoasting succeeds against service accounts because
        options:
          - Kerberos has no encryption
          - A service ticket is encrypted with the service account's password hash, so a weak password cracks offline
          - Domain controllers ignore service tickets
          - It needs no credentials at all
        answer: 1
        explanation: The ticket is encrypted with the service-account hash, so weak passwords fall to offline cracking.
      - prompt: A golden ticket is forged using
        options:
          - Any user's password
          - The stolen KRBTGT account hash, granting domain-wide access
          - A public certificate
          - A firewall rule
        answer: 1
        explanation: A golden ticket is a forged TGT made with the KRBTGT hash, giving broad domain access.
      - prompt: The primary log event for spotting Kerberoasting is
        options:
          - A failed logon (4625)
          - A service-ticket request (4769), especially a burst using RC4
          - A file deletion
          - A reboot event
        answer: 1
        explanation: Event 4769 records service-ticket requests; a burst with weak RC4 encryption suggests roasting.
      - prompt: A strong preventive defence against Kerberoasting is
        options:
          - Disabling all logging
          - Long, randomly generated, regularly rotated service-account passwords (or gMSAs) and disabling RC4
          - Giving every account an SPN
          - Shortening ticket lifetimes only
        answer: 1
        explanation: Strong, rotated service-account passwords and disabling RC4 make offline cracking infeasible.
  - slug: win-ntlm-relay
    title: NTLM and Relay Attacks
    order: 14
    difficulty: advanced
    summary: Understand NTLM authentication, why it is weaker than Kerberos, and how relay and pass-the-hash attacks abuse it, plus the defences that reduce NTLM exposure.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "sc200:2", "cysa:1.2"]
    learning_objectives:
      - Explain how NTLM authentication works and how it differs from Kerberos
      - Describe NTLM relay and pass-the-hash attacks
      - Recommend defences that reduce NTLM abuse
    theory: |
      **NTLM** is the older Windows authentication protocol, still present for backward compatibility, and its
      design weaknesses make it a favourite attacker target. NTLM is a challenge-response scheme: the server sends
      a challenge, the client proves it knows the password hash by responding, and crucially the **password hash
      itself functions as the credential**. Unlike Kerberos, NTLM does not use a trusted third party to issue
      time-limited tickets, has no mutual authentication by default, and the client's response can be captured and
      misused. Understanding that NTLM authenticates with the hash, not a fresh secret, is the key to seeing why
      its attacks work.

      Two attacks dominate. **Pass-the-hash** uses a stolen NTLM hash directly: because the hash is the
      credential, an attacker who dumps hashes from one machine can authenticate to others as that user without
      ever knowing the plaintext password, which is why hashes must be protected as carefully as passwords.
      **NTLM relay** is more subtle and does not even require cracking: the attacker positions between a client and
      a server (often by coercing a victim to authenticate, for example via a malicious link or by poisoning
      name-resolution protocols like LLMNR/NBT-NS), then **relays** the victim's authentication to a different
      server, authenticating as the victim there. If the relayed account is privileged and the target lacks
      signing, the attacker gains access with the victim's rights. These attacks underpin much of the lateral
      movement seen in Windows intrusions.

      The defences aim to **reduce and protect NTLM**. The strongest is to disable NTLM where possible and prefer
      Kerberos, and to turn off legacy name-resolution protocols (LLMNR, NBT-NS) that attackers abuse to coerce
      authentication. Where NTLM must remain, enforcing **SMB signing** and **LDAP channel binding/signing**
      prevents relayed authentication from being accepted, and the Protected Users group, credential isolation
      (Credential Guard) and least privilege limit hash theft and reuse. For the analyst, signals include
      authentication from unexpected hosts, NTLM use where Kerberos is expected, and LLMNR/NBT-NS traffic, so
      monitoring authentication patterns and the presence of legacy protocols is how these quiet attacks become
      visible. The recurring theme is that a captured credential, whether a hash or a relayed response, is as good
      as a password unless signing and protocol hardening break the chain.
    examples:
      - title: Why NTLM is abusable
        body: |
          challenge-response; the password HASH is the credential (no fresh secret, no TTL tickets)
          no mutual auth by default; responses can be captured
          contrast Kerberos: trusted KDC issues time-limited tickets.
      - title: The two attacks
        body: |
          pass-the-hash -> use a stolen hash directly to authenticate elsewhere (no plaintext needed)
          NTLM relay    -> coerce victim auth (LLMNR/NBT-NS, malicious link) -> relay it to another server as the victim
          defence: disable NTLM/LLMNR, enforce SMB signing + LDAP channel binding.
    exercise:
      title: Analyse NTLM abuse and plan defences
      environment: A described Windows environment with sample authentication evidence (or a scenario)
      tools: [A scenario or sample auth logs, a document, a notes file]
      steps:
        - Explain how NTLM authenticates and why the hash functioning as the credential is a weakness.
        - Contrast NTLM with Kerberos on third-party trust, ticket lifetime and mutual authentication.
        - Describe pass-the-hash and why stolen hashes must be protected like passwords.
        - Describe an NTLM relay attack, including how the victim is coerced to authenticate.
        - Recommend at least three defences (disable NTLM/LLMNR, SMB signing, LDAP channel binding, Credential Guard).
        - State one log signal that would suggest NTLM relay or pass-the-hash activity.
      deliverable: An NTLM-abuse analysis with a pass-the-hash and a relay explanation, a prioritised defence list, and one detection signal.
    expected_outcome: >
      You can explain NTLM authentication and its weaknesses versus Kerberos, describe pass-the-hash and NTLM
      relay attacks, and recommend the signing and protocol-hardening defences that break them.
    quiz:
      - prompt: Pass-the-hash works because in NTLM
        options:
          - The password is sent in clear text
          - The password hash itself functions as the credential, so a stolen hash authenticates without the plaintext
          - A trusted third party issues tickets
          - Authentication is mutual by default
        answer: 1
        explanation: NTLM authenticates with the hash, so a captured hash can be reused directly.
      - prompt: An NTLM relay attack succeeds by
        options:
          - Cracking AES encryption
          - Relaying a coerced victim's authentication to a different server to act as that victim
          - Guessing the password 1000 times
          - Disabling the network card
        answer: 1
        explanation: The attacker forwards the victim's authentication to another server, authenticating as them.
      - prompt: A strong structural defence against NTLM relay is
        options:
          - Longer passwords only
          - Enforcing SMB signing and LDAP channel binding so relayed authentication is rejected
          - Turning off logging
          - Giving all accounts admin rights
        answer: 1
        explanation: Signing and channel binding cause relayed authentication to be refused by the target.
      - prompt: Attackers often coerce NTLM authentication by abusing
        options:
          - HTTPS certificates
          - Legacy name-resolution protocols such as LLMNR and NBT-NS
          - Disk encryption
          - The Windows firewall logs
        answer: 1
        explanation: Poisoning LLMNR/NBT-NS tricks victims into authenticating to the attacker, enabling relay.
  - slug: win-application-control
    title: Application Control with AppLocker and WDAC
    order: 15
    difficulty: advanced
    summary: Understand how Windows application control stops unauthorised code from running, the difference between AppLocker and Windows Defender Application Control, and how allow-listing defeats many attacks.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.5", "secplus:4.1", "cysa:1.3"]
    learning_objectives:
      - Explain how application control and allow-listing work on Windows
      - Compare AppLocker and Windows Defender Application Control
      - Describe how application control defeats common attack techniques
    theory: |
      Most endpoint defences try to spot bad software; **application control** takes the opposite, stronger
      approach of only allowing **known-good** software to run and blocking everything else. This allow-listing
      (as opposed to block-listing) flips the default from permit to deny, so a brand-new piece of malware, an
      unsigned script, or a tool dropped by an attacker simply will not execute because it is not on the approved
      list. On Windows the two main technologies are **AppLocker**, the older and more flexible rule-based system,
      and **Windows Defender Application Control (WDAC)**, the newer, stronger, kernel-enforced approach. Both let
      an organisation define what is allowed to run by publisher (code-signing certificate), path, or file hash,
      with publisher rules being the most robust because they survive updates and are hard to forge.

      Application control is powerful against a wide range of attacks precisely because it attacks the attacker's
      need to **run code**. Malware delivered by phishing cannot execute if it is not approved; **living-off-the-
      land** abuse of otherwise-legitimate tools can be constrained by blocking or restricting the risky
      interpreters and binaries; and attacker-dropped utilities are stopped at the door. It complements rather
      than replaces detection: where detection notices bad things that ran, application control prevents many of
      them from running at all, which is why it appears near the top of hardening guidance such as the Essential
      Eight. The trade-off is operational: building and maintaining the allow-list is real work, because every
      legitimate application and update must be accounted for, and a too-strict policy breaks business while a
      too-loose one (for example broad path rules in user-writable locations) can be bypassed.

      Deploying it well is therefore a careful process. Organisations typically start in **audit mode**, where
      the policy logs what *would* have been blocked without actually blocking, to discover the real software in
      use and tune rules before enforcing. Rules favour publisher over path over hash where possible, writable
      locations are not blindly trusted, and the policy is maintained as software changes. For the analyst,
      application control is both a strong preventive control to recommend and a rich log source: its audit and
      enforcement events show exactly what tried to run and was allowed or blocked, which is valuable for
      detection and investigation. The underlying principle, allow only what is explicitly trusted, is the same
      default-deny thinking that makes firewalls and zero trust effective, applied to code execution.
    examples:
      - title: Allow-list, not block-list
        body: |
          block-list: try to spot bad -> misses novel malware
          allow-list (application control): only known-good runs, everything else BLOCKED
          -> new malware, unsigned scripts, dropped tools simply do not execute.
      - title: AppLocker vs WDAC and rule types
        body: |
          AppLocker: older, flexible, rule-based    WDAC: newer, stronger, kernel-enforced
          rules by publisher (best, survives updates) > path > hash
          start in AUDIT mode (log would-be blocks) -> tune -> then enforce.
    exercise:
      title: Design an application control policy
      environment: A described Windows fleet and its software needs (or a scenario)
      tools: [A scenario, a policy notes file, a document]
      steps:
        - Explain the difference between allow-listing and block-listing and why allow-listing is stronger.
        - Compare AppLocker and WDAC at a high level.
        - Explain why publisher rules are generally preferred over path and hash rules.
        - Describe two attack techniques application control defeats and how.
        - Explain the role of audit mode before enforcement.
        - Identify one weak rule design (for example trusting a user-writable path) and correct it.
      deliverable: An application control plan covering the allow-list principle, an AppLocker-versus-WDAC choice, rule-type preference, the attacks it defeats, an audit-mode rollout, and a corrected weak rule.
    expected_outcome: >
      You can explain Windows application control and allow-listing, compare AppLocker and WDAC, and design a
      policy that defeats common attacks while rolling out safely through audit mode.
    quiz:
      - prompt: Application control is stronger than traditional anti-malware because it
        options:
          - Scans faster
          - Allows only known-good software to run and blocks everything else, stopping even novel malware
          - Encrypts the disk
          - Needs no maintenance
        answer: 1
        explanation: Default-deny allow-listing stops unapproved code regardless of whether it is known-bad.
      - prompt: The most robust type of application control rule is generally
        options:
          - A path rule in a user-writable folder
          - A publisher rule based on the code-signing certificate, which survives updates and is hard to forge
          - A rule that allows everything
          - A rule based on file size
        answer: 1
        explanation: Publisher rules are durable across updates and difficult to bypass, unlike broad path rules.
      - prompt: Audit mode is used before enforcing application control to
        options:
          - Encrypt the logs
          - Log what would have been blocked so real software is discovered and rules are tuned first
          - Block everything immediately
          - Disable logging
        answer: 1
        explanation: Audit mode reveals the real software in use so enforcement does not break business.
      - prompt: Application control is especially effective against
        options:
          - Physical theft of a laptop
          - Phishing-delivered malware and dropped tools, because unapproved code cannot execute
          - Network cabling faults
          - Power outages
        answer: 1
        explanation: By preventing unapproved code from running, it stops much malware and attacker tooling at execution.
  - slug: win-bitlocker-encryption
    title: BitLocker and Windows Disk Encryption
    order: 16
    difficulty: intermediate
    summary: Understand how BitLocker protects data at rest on Windows, how it uses the TPM and recovery keys, the threats it does and does not address, and how to manage it across a fleet.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.4", "secplus:4.1", "sc900:3"]
    learning_objectives:
      - Explain how BitLocker encrypts a Windows volume and uses the TPM
      - Describe recovery keys and how BitLocker is managed at scale
      - Identify the threats BitLocker does and does not mitigate
    theory: |
      **BitLocker** is Windows' full-volume encryption, and its core purpose is narrow but important: protecting
      **data at rest** so that a lost or stolen device, or a disk pulled from a machine, does not hand over its
      contents. It encrypts the whole volume, and the central design question is where the decryption key lives.
      BitLocker typically seals the key to the **TPM**, the hardware security chip, so the key is released only
      when the machine boots the expected, unmodified software; this makes decryption automatic for the legitimate
      user on the genuine device while useless to someone who removes the disk or tampers with the boot process.
      For stronger protection, BitLocker can require an additional factor at boot, a PIN or a USB key, so that
      possession of the powered-off device alone is not enough.

      Because keys sealed to hardware can become inaccessible (a TPM change, a forgotten PIN, a firmware update),
      BitLocker has a **recovery key**, a long numeric key that unlocks the volume when the normal path fails.
      Managing these recovery keys is the heart of operating BitLocker at scale: they must be **escrowed**
      somewhere safe and retrievable (Active Directory or a cloud management service such as Intune/Entra), because
      a recovery key that is lost means the data is unrecoverable, while a recovery key that is poorly protected
      undermines the encryption. Fleet management also covers enforcing BitLocker by policy, confirming devices
      are actually encrypted (reporting compliance), and choosing settings like requiring a PIN for high-risk
      roles. The operational discipline around recovery-key escrow and compliance reporting is what separates real
      protection from a feature that is on paper but silently not enabled on half the fleet.

      It is equally important to understand what BitLocker does **not** do. It protects data at rest, so it is
      excellent against device theft and disposal, but it provides **no protection while the system is running and
      unlocked**: once the user has logged in and the volume is decrypted in use, malware or an attacker operating
      on the live system sees data normally, so BitLocker is not a defence against remote compromise, malware, or
      an attacker with access to the running machine. It also does not protect data that leaves the device. For
      the analyst and architect, the lesson is to deploy BitLocker everywhere as baseline protection against the
      very common risk of lost and stolen devices, manage recovery keys rigorously, and recognise that disk
      encryption is one specific control, strong for its purpose and silent for everything else, to be layered with
      the controls that address running-system threats.
    examples:
      - title: Where the key lives
        body: |
          whole-volume encryption; key sealed to the TPM -> released only on expected, unmodified boot
          automatic for legitimate user on genuine device; useless if disk removed or boot tampered
          add a PIN/USB key -> powered-off device alone is not enough.
      - title: Recovery keys and the limit
        body: |
          recovery key unlocks when the normal path fails -> MUST be escrowed (AD / Intune) and protected
          lost recovery key = unrecoverable data; poorly protected key = broken encryption
          LIMIT: protects data at REST only; running + unlocked system sees data normally.
    exercise:
      title: Plan BitLocker deployment and recovery
      environment: A described Windows fleet with mixed-risk roles (or a scenario)
      tools: [A scenario, a policy notes file, a document]
      steps:
        - Explain how BitLocker encrypts a volume and how sealing the key to the TPM works.
        - Explain when you would require an additional PIN or USB key at boot.
        - Describe the role of the recovery key and why escrowing it safely is critical.
        - Describe how you would confirm the whole fleet is actually encrypted.
        - State clearly what threat BitLocker addresses and one threat it does not.
        - Recommend a BitLocker policy for a high-risk role and justify it.
      deliverable: A BitLocker plan covering TPM-sealed encryption, when to add a PIN, recovery-key escrow, fleet compliance reporting, the threats it does and does not cover, and a high-risk-role policy.
    expected_outcome: >
      You can explain how BitLocker encrypts data at rest using the TPM, manage recovery keys and fleet
      compliance, and articulate the threats it mitigates (theft, disposal) versus those it does not (running-system compromise).
    quiz:
      - prompt: BitLocker's primary purpose is to protect
        options:
          - Data in use on a running, unlocked system
          - Data at rest, so a lost or stolen device or removed disk does not reveal its contents
          - Network traffic
          - Email in transit
        answer: 1
        explanation: BitLocker encrypts the volume at rest, defending against device theft, loss and disposal.
      - prompt: Sealing the BitLocker key to the TPM means the key is released only when
        options:
          - Any disk is inserted
          - The machine boots the expected, unmodified software on the genuine device
          - The user types their email
          - The network is connected
        answer: 1
        explanation: TPM sealing ties key release to a known-good boot state on the real device.
      - prompt: Managing BitLocker at scale centres on
        options:
          - Deleting recovery keys
          - Escrowing recovery keys safely and reporting which devices are actually encrypted
          - Disabling the TPM
          - Sharing one key for all devices
        answer: 1
        explanation: Safe recovery-key escrow and encryption-compliance reporting are the core of fleet management.
      - prompt: A threat BitLocker does NOT mitigate is
        options:
          - A stolen powered-off laptop
          - Malware or an attacker operating on the running, unlocked system where data is already decrypted
          - A disk removed and read elsewhere
          - A discarded drive
        answer: 1
        explanation: Once the system is running and unlocked, data is decrypted in use and BitLocker does not protect it.
  - slug: win-wmi-com-abuse
    title: WMI and COM Abuse on Windows
    order: 17
    difficulty: advanced
    summary: Understand how attackers abuse Windows Management Instrumentation and COM for fileless execution, lateral movement and persistence, and how to detect this living-off-the-land activity.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "sc200:2", "cysa:1.2"]
    learning_objectives:
      - Explain what WMI and COM are and why attackers abuse them
      - Describe WMI-based execution, lateral movement and persistence
      - Identify the telemetry and detections for WMI/COM abuse
    theory: |
      **Windows Management Instrumentation (WMI)** and **COM** (the Component Object Model) are powerful,
      legitimate parts of Windows used for management and inter-process communication, and that legitimacy is
      exactly why attackers love them. WMI provides a standard way to query and control almost everything on a
      Windows system and to do so **remotely**, while COM lets components invoke each other. Because these are
      built-in, trusted and used by administrators and software constantly, abusing them is a form of **living off
      the land**: the attacker uses native Windows machinery rather than dropping obvious malware, which helps
      them blend in and often run **filelessly**, with little or nothing written to disk.

      The abuse spans several attack stages. For **execution**, WMI can launch processes locally or remotely, so an
      attacker can run commands on a target without a traditional remote-access tool. For **lateral movement**,
      WMI's remote capability lets an attacker with valid credentials execute on other machines across the
      network, a common and stealthy technique. For **persistence**, WMI offers a particularly sneaky mechanism:
      **WMI event subscriptions** can be configured so that a chosen action runs automatically when a defined
      event occurs (at a certain time, at boot, when a condition is met), giving durable, fileless persistence
      that lives in the WMI repository rather than in obvious autorun locations, which is why it evades casual
      inspection. COM and related mechanisms similarly offer hijacking opportunities where an attacker substitutes
      a malicious component for one the system expects to load.

      Detecting this requires the right **telemetry and focus**, because the tools themselves are legitimate. Key
      sources include process-creation logs showing WMI's provider host (`WmiPrvSE.exe`) spawning unexpected
      children such as script interpreters, command lines invoking WMI for remote execution, and crucially the
      dedicated **WMI activity and event-subscription logging** that records when permanent subscriptions are
      created, which is one of the strongest signals because legitimate permanent WMI subscriptions are relatively
      rare. As with all living-off-the-land detection, context matters: WMI remote execution from an unusual
      source, a subscription created outside normal administration, or `WmiPrvSE.exe` spawning a shell are
      suspicious patterns rather than any single event being inherently bad. Defences include monitoring and
      restricting WMI remote access, baselining normal WMI subscriptions so new ones stand out, and applying
      least privilege so fewer accounts can wield WMI across the network. For the analyst, the lesson is that
      native management tooling is a major attack surface, and catching its abuse depends on knowing what normal
      WMI and COM activity looks like and watching the specific, rarely-legitimate signals like new permanent
      event subscriptions.
    examples:
      - title: Why WMI/COM are abused
        body: |
          built-in, trusted, powerful, remote-capable management + component machinery
          living off the land: use native Windows, little/no malware on disk (fileless) -> blend in.
      - title: Abuse by stage + the key signal
        body: |
          execution: WMI launches processes (local/remote)
          lateral movement: WMI remote execution with valid creds
          persistence: WMI EVENT SUBSCRIPTION runs an action on an event (durable, fileless, in the WMI repo)
          detect: WmiPrvSE.exe spawning a shell; permanent-subscription creation (rarely legitimate) in WMI activity logs.
    exercise:
      title: Detect WMI and COM abuse
      environment: A described Windows environment with process and WMI activity logs (or a scenario)
      tools: [A scenario or sample events, a document, a notes file]
      steps:
        - Explain what WMI and COM are and why their legitimacy makes them attractive to attackers.
        - Describe how WMI is used for remote execution and lateral movement.
        - Explain WMI event-subscription persistence and why it evades casual inspection.
        - Identify the telemetry that reveals WMI abuse (WmiPrvSE.exe children, subscription creation).
        - Explain why a newly created permanent WMI subscription is a strong signal.
        - Recommend two defences (restrict remote WMI, baseline subscriptions, least privilege).
      deliverable: A detection plan for WMI/COM abuse covering execution, lateral movement and subscription persistence, the key telemetry and the strongest signal, plus two defences.
    expected_outcome: >
      You can explain why WMI and COM are abused, describe WMI-based execution, lateral movement and
      event-subscription persistence, and identify the telemetry and defences that catch this living-off-the-land activity.
    quiz:
      - prompt: Attackers abuse WMI and COM mainly because they are
        options:
          - Rarely present on Windows
          - Built-in, trusted and powerful, enabling fileless living-off-the-land execution that blends in
          - Only available to malware
          - Unable to run code
        answer: 1
        explanation: Native, trusted management tooling lets attackers operate without obvious malware.
      - prompt: WMI event subscriptions are a favoured persistence mechanism because they
        options:
          - Write large files to disk
          - Run an action automatically on an event, durably and filelessly, living in the WMI repository
          - Require a reboot to work
          - Appear in every antivirus scan
        answer: 1
        explanation: Permanent subscriptions give fileless persistence outside obvious autorun locations.
      - prompt: A strong detection signal for WMI abuse is
        options:
          - Any use of Windows
          - WmiPrvSE.exe spawning a script interpreter, or creation of a permanent WMI subscription
          - A normal user login
          - A scheduled backup
        answer: 1
        explanation: The WMI host spawning a shell, or a new permanent subscription, are rarely-legitimate signals.
      - prompt: Because WMI is a legitimate tool, detecting its abuse depends on
        options:
          - Blocking WMI entirely for everyone
          - Context and baselining normal activity so unusual remote execution or new subscriptions stand out
          - Ignoring it
          - Deleting the logs
        answer: 1
        explanation: Knowing normal WMI behaviour lets the abnormal remote use or new subscriptions be flagged.
  - slug: win-registry-forensics
    title: Windows Registry Forensics
    order: 18
    difficulty: advanced
    summary: Learn how the Windows registry records a wealth of forensic evidence about system configuration, user activity, program execution and persistence, and how to locate and interpret the key artifacts.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain what the registry is and why it is a forensic goldmine
      - Locate key registry artifacts for execution, persistence and user activity
      - Interpret registry evidence in an investigation
    theory: |
      The Windows **registry** is a hierarchical database holding much of the system's and users' configuration,
      and because Windows and applications constantly record state there, it is one of the richest sources of
      forensic evidence on a Windows host. For an investigator, the registry answers questions across many
      categories: what software is installed and configured, what runs automatically (a prime place for
      persistence), what programs a user has executed, what devices (including USB storage) have been attached,
      what networks the machine has joined, and traces of user activity. Knowing that the registry records all
      this, and where, turns it from an opaque configuration store into an investigative map.

      The evidence lives in known **hives and keys**. System-wide hives (such as SYSTEM and SOFTWARE) and
      per-user hives (NTUSER.DAT for each profile) hold different artifacts. For **persistence and autostart**,
      the Run and RunOnce keys, services, and other autostart locations show what launches automatically, a top
      priority when hunting attacker persistence. For **program execution**, artifacts like UserAssist,
      ShimCache/AppCompatCache and AmCache record evidence that programs were run, sometimes with timestamps, even
      for programs since deleted, which is invaluable for proving an attacker tool executed. For **user and device
      activity**, keys record recently opened files, typed paths, mounted USB devices and their first/last
      connection times, and wireless networks joined. Each of these keys is a specific, well-documented artifact
      that forensic tools parse, and an analyst's skill is knowing which key answers which question.

      Interpreting registry evidence requires **care and corroboration**. Registry keys carry last-write
      timestamps that help build a timeline, but as with all forensic artifacts these can be misread or
      manipulated, so key findings are corroborated across artifacts and with other sources (event logs,
      filesystem). The registry is also a target for attackers themselves, both as a persistence location and as
      something they may try to clean, so the absence or modification of expected keys is itself informative.
      Practically, investigators extract the hive files (live or from an image), parse them with forensic tooling,
      and focus on the artifacts relevant to the question, persistence keys when hunting footholds, execution
      artifacts to prove what ran, USB and recent-files keys when data theft is suspected. For the analyst, the
      lesson is that the registry is a forensic goldmine hiding in plain sight on every Windows system, and that
      competence means knowing the handful of key artifact locations for execution, persistence and user activity,
      interpreting their timestamps carefully, and corroborating what they show against the rest of the evidence.
    examples:
      - title: What the registry reveals
        body: |
          installed/configured software; AUTOSTART (persistence); program EXECUTION evidence;
          attached USB devices; networks joined; recent files + user activity.
      - title: Key artifacts by question
        body: |
          persistence: Run/RunOnce keys, services, autostart locations
          execution: UserAssist, ShimCache/AppCompatCache, AmCache (even for deleted programs, sometimes timestamped)
          activity/devices: recent files, typed paths, USB first/last connect, wireless networks
          -> use last-write timestamps for timeline, but corroborate (attackers manipulate too).
    exercise:
      title: Mine the registry in an investigation
      environment: A described Windows host or registry extract and an investigative question (or a scenario)
      tools: [A scenario or sample registry artifacts, a document, a notes file]
      steps:
        - Explain what the registry is and why it is a rich forensic source.
        - Identify which keys you would check to find attacker persistence.
        - Identify which artifacts prove a program was executed, even if it was later deleted.
        - Identify which artifacts help when USB data theft is suspected.
        - Use a key's last-write timestamp in a timeline and note why you would corroborate it.
        - Explain how the modification or absence of an expected key can itself be evidence.
      deliverable: A registry-forensics plan mapping investigative questions (persistence, execution, device/data theft) to specific artifacts, with timestamp interpretation and corroboration.
    expected_outcome: >
      You can explain why the registry is a forensic goldmine, locate the key artifacts for persistence, execution
      and user or device activity, and interpret them carefully with corroboration in an investigation.
    quiz:
      - prompt: The Windows registry is valuable in forensics because it
        options:
          - Contains only wallpaper settings
          - Records configuration, autostart/persistence, program execution, device and user activity
          - Cannot be read after a reboot
          - Stores nothing useful
        answer: 1
        explanation: The registry continually records state across many categories relevant to investigations.
      - prompt: Artifacts like ShimCache/AppCompatCache and AmCache are valuable because they
        options:
          - Encrypt the disk
          - Record evidence that programs were executed, sometimes even for programs since deleted
          - Store user passwords in clear text
          - Disable persistence
        answer: 1
        explanation: These execution artifacts can prove a (possibly deleted) program ran on the system.
      - prompt: To hunt attacker persistence in the registry you would examine
        options:
          - The wallpaper key
          - Run/RunOnce keys, services and other autostart locations
          - Only the recent-files list
          - The screensaver timeout
        answer: 1
        explanation: Autostart keys are a prime location for persistence mechanisms.
      - prompt: Registry last-write timestamps should be
        options:
          - Trusted absolutely with no checking
          - Used for timelines but corroborated, since artifacts can be misread or manipulated
          - Ignored entirely
          - Deleted before analysis
        answer: 1
        explanation: Timestamps aid timelines but, like all artifacts, need corroboration against other evidence.
  - slug: win-privilege-escalation
    title: Windows Privilege Escalation and Its Detection
    order: 19
    difficulty: advanced
    summary: Learn how attackers escalate from a normal user to administrator or SYSTEM on Windows, the common techniques they use, and how to detect and prevent privilege escalation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain why privilege escalation is a key stage of a Windows attack
      - Describe common Windows privilege-escalation techniques
      - Detect and prevent privilege escalation on Windows
    theory: |
      When an attacker first gains access to a Windows host, they usually land with the rights of a normal user,
      which is often not enough to achieve their goals, so **privilege escalation**, moving from limited rights to
      administrator or the all-powerful SYSTEM account, is a pivotal stage of most Windows intrusions. Escalation
      unlocks the ability to disable defences, access credentials in memory, install persistence, and move
      laterally, so detecting or preventing it breaks the attack at a crucial point. Escalation comes in two
      flavours: vertical (a low-privileged user gaining higher privileges) and, loosely, abusing already-held
      rights; the focus here is the vertical jump from user to admin or SYSTEM.

      The **techniques** exploit misconfigurations and weaknesses rather than always needing an exploit.
      **Misconfigured services** are a classic: a service running as SYSTEM whose executable or configuration a
      normal user can modify lets the user run their own code as SYSTEM; related issues include unquoted service
      paths and weak service permissions. **UAC bypasses** abuse the way User Account Control elevates certain
      processes to run attacker code with full admin rights without a prompt. **Token manipulation and
      impersonation** abuse Windows access tokens to assume the privileges of another process or account.
      **Exploiting vulnerabilities** in the kernel or privileged software escalates directly. Other avenues include
      stored credentials, scheduled tasks a user can alter, DLL hijacking of privileged processes, and abusing
      powerful privileges a user has been granted. The common theme is that small misconfigurations, a writable
      service binary, an over-privileged account, an unpatched driver, open the door to full control.

      **Detecting** privilege escalation relies on spotting the behaviours and the state changes it produces.
      Watch for a process unexpectedly running as SYSTEM or with elevated privileges when its parent or context
      does not justify it, for modifications to service configurations and binaries, for suspicious token
      manipulation and unusual parent-child process relationships (a user process spawning a SYSTEM process), and
      for the exploitation of known-vulnerable drivers (bring-your-own-vulnerable-driver). Good endpoint telemetry
      (Sysmon, EDR) makes these visible. **Prevention** is about denying the misconfigurations: run services with
      least privilege, fix weak service and file permissions and unquoted paths, patch promptly (kernel and
      drivers), enforce UAC at its strongest, limit local admin rights, and apply application control so attacker
      tools cannot run. For the analyst, the lessons are that privilege escalation is the hinge between a foothold
      and full compromise, that it most often exploits misconfigurations rather than exotic exploits, and that
      detecting the tell-tale state changes and process relationships, and closing the misconfigurations that
      enable it, protects one of the most important choke points in a Windows attack.
    examples:
      - title: Why escalation matters
        body: |
          attacker lands as a normal user -> needs admin/SYSTEM to disable defences, grab credentials, persist, move laterally
          escalation = the hinge between a foothold and full compromise -> a crucial place to detect/prevent.
      - title: Common techniques and detection
        body: |
          misconfigured services (writable binary/unquoted path/weak perms) run YOUR code as SYSTEM; UAC bypass; token manipulation; vulnerable driver/kernel exploit
          detect: a process running as SYSTEM without justification, service config/binary changes, odd user->SYSTEM parent-child, BYOVD
          prevent: least-privilege services, fix perms/paths, patch, strong UAC, limit local admin, application control.
    exercise:
      title: Investigate and prevent Windows privilege escalation
      environment: A described Windows host with sample process and service telemetry (or a scenario)
      tools: [A scenario or sample telemetry, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain why privilege escalation is a pivotal stage of a Windows intrusion.
        - Describe how a misconfigured service can let a normal user run code as SYSTEM.
        - Describe one other escalation technique (UAC bypass, token manipulation or vulnerable driver).
        - Identify a privilege-escalation signal in the sample telemetry (for example a user process spawning SYSTEM).
        - List the telemetry you would collect to detect escalation.
        - Recommend preventive measures that close the enabling misconfigurations.
      deliverable: A privilege-escalation write-up covering why it matters, two techniques, a detection signal from the telemetry, the telemetry to collect, and preventive measures.
    expected_outcome: >
      You can explain Windows privilege escalation and its role in an intrusion, describe common techniques, and
      detect and prevent escalation by spotting its behaviours and closing the misconfigurations that enable it.
    quiz:
      - prompt: Privilege escalation is a pivotal stage because it
        options:
          - Ends the attack harmlessly
          - Takes an attacker from limited rights to admin or SYSTEM, unlocking defence evasion, credential theft and persistence
          - Only affects printers
          - Cannot be detected or prevented
        answer: 1
        explanation: Escalation unlocks the capabilities an attacker needs for full compromise, so it is a key choke point.
      - prompt: A misconfigured service enables escalation when
        options:
          - It uses a strong password
          - A normal user can modify the service's executable or configuration that runs as SYSTEM
          - It is fully patched
          - It has least privilege
        answer: 1
        explanation: A writable SYSTEM-service binary or weak service permissions let a user run code as SYSTEM.
      - prompt: A useful detection signal for privilege escalation is
        options:
          - A normal user logging in once
          - A user process spawning a SYSTEM process, or a process running elevated without justification
          - A scheduled reboot
          - A DNS lookup
        answer: 1
        explanation: Unexpected elevation and anomalous parent-child relationships indicate escalation.
      - prompt: Most Windows privilege escalation exploits
        options:
          - Only zero-day kernel bugs
          - Misconfigurations like weak service permissions, unquoted paths and excess local admin rights
          - Physical access only
          - Nothing at all
        answer: 1
        explanation: Misconfigurations, not exotic exploits, are the most common escalation path, so fixing them prevents it.
  - slug: win-etw-telemetry
    title: Advanced Windows Telemetry with ETW
    order: 20
    difficulty: advanced
    summary: Understand Event Tracing for Windows (ETW), the low-level telemetry framework that feeds Windows security tools, what visibility it provides beyond standard event logs, and how defenders and attackers interact with it.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:3", "cysa:1.1"]
    learning_objectives:
      - Explain what ETW is and how it relates to Windows security telemetry
      - Describe the deep visibility ETW provides beyond event logs
      - Recognise how EDR uses ETW and how attackers try to evade it
    theory: |
      Beneath the familiar Windows Security event logs lies **Event Tracing for Windows (ETW)**, a high-performance,
      low-level tracing framework built into Windows that many components and the operating system itself use to
      emit detailed events, and it is the foundation on which much advanced Windows security telemetry is built.
      Where the Security event log records a curated set of audit events, ETW exposes a far richer and more granular
      stream from thousands of **providers**, covering process and thread activity, network connections, DNS
      queries, PowerShell and .NET activity, registry and file operations, and much more. Security tools subscribe
      to the ETW providers relevant to threat detection to get visibility that standard logs do not offer, which is
      why understanding ETW explains where modern Windows detection telemetry actually comes from.

      The **visibility** ETW provides is what makes behaviour-based detection on Windows possible. Specific
      providers expose deep detail: PowerShell providers surface script block content (even when obfuscated, after
      de-obfuscation), .NET and CLR providers reveal in-memory and reflective loading used by fileless malware,
      threat-intelligence and kernel providers surface sensitive API calls and process injection, and DNS and
      network providers show connections at the source. Tools like Sysmon (met earlier) and commercial EDR consume
      ETW (among other sources) to build their detections, so the Sysmon process and network events already used
      ultimately trace back to this kind of low-level instrumentation. For an analyst, the practical point is that
      the richest Windows detections, catching encoded PowerShell, fileless and in-memory techniques, injection,
      depend on ETW-sourced telemetry, and that configuring and collecting the right providers (directly or via
      tools) is what gives a SOC that depth.

      Because ETW is so central to detection, it is also a target for **evasion**, which defenders must understand.
      Sophisticated attackers attempt **ETW tampering**, patching or disabling ETW in their own process (for
      example neutralising the providers that would reveal their .NET or AMSI activity) so their malicious actions
      are not traced, a recognised defense-evasion technique. This makes the **integrity of the telemetry itself** a
      concern: just as with log deletion, an attempt to blind ETW is both an attack step and a threat to
      visibility, so detecting ETW tampering (and collecting telemetry centrally, off the endpoint, so it cannot be
      retroactively erased) matters. The considerations are the volume ETW can produce (so providers are chosen and
      filtered) and that consuming ETW well is usually done through tools rather than by hand. For the analyst, the
      lessons are that ETW is the low-level engine behind advanced Windows telemetry, that it provides the deep
      process, memory, script and network visibility that catches sophisticated techniques standard logs miss, that
      EDR and Sysmon are largely ETW consumers, and that because ETW is so valuable, attackers try to tamper with
      it, so protecting and monitoring the integrity of the telemetry is part of defending Windows.
    examples:
      - title: Below the event log
        body: |
          ETW = low-level tracing framework built into Windows; thousands of PROVIDERS emit granular events
          Security event log = a curated audit subset; ETW = process/thread, network, DNS, PowerShell, .NET/CLR, registry, file, injection
          -> the foundation modern Windows detection telemetry is built on.
      - title: Deep visibility and evasion
        body: |
          PowerShell providers (script block even after de-obfuscation), .NET/CLR (reflective/in-memory loading = fileless), kernel/TI providers (injection, sensitive APIs)
          Sysmon + EDR are largely ETW CONSUMERS -> that's where their rich events come from
          attackers patch/disable ETW in their process (defense evasion) -> detect ETW tampering + collect telemetry off-host.
    exercise:
      title: Plan ETW-based Windows visibility
      environment: A described Windows environment needing deep detection telemetry (or a scenario)
      tools: [A scenario, a document, a notes file]
      steps:
        - Explain what ETW is and how it relates to the standard Windows Security event log.
        - Describe the kinds of deep visibility specific ETW providers give that standard logs do not.
        - Explain how ETW visibility catches fileless, in-memory and encoded-PowerShell techniques.
        - Explain how Sysmon and EDR relate to ETW.
        - Describe ETW tampering as an attacker evasion technique and why it threatens visibility.
        - Recommend how to protect telemetry integrity (detect tampering, collect off-host).
      deliverable: An ETW visibility plan covering what ETW is, the advanced visibility it provides, EDR/Sysmon's reliance on it, and protecting telemetry integrity against tampering.
    expected_outcome: >
      You can explain ETW and its role in Windows telemetry, describe the deep visibility it provides beyond event
      logs, and recognise how EDR consumes ETW and how attackers try to tamper with it.
    quiz:
      - prompt: Event Tracing for Windows (ETW) differs from the Security event log in that it
        options:
          - Records fewer events than the Security log
          - Exposes a far richer, more granular low-level stream from thousands of providers
          - Only logs logons
          - Cannot be consumed by security tools
        answer: 1
        explanation: ETW is the deep, high-volume telemetry framework beneath the curated Security event log.
      - prompt: ETW is valuable for catching fileless and in-memory techniques because
        options:
          - It only sees disk files
          - Providers reveal .NET/CLR reflective loading, injection and de-obfuscated script activity standard logs miss
          - It disables PowerShell
          - It records nothing about memory
        answer: 1
        explanation: ETW providers surface the in-memory and script behaviours fileless malware relies on.
      - prompt: Sysmon and commercial EDR relate to ETW by
        options:
          - Replacing it entirely
          - Consuming ETW (among other sources) to build their detections
          - Blocking ETW
          - Being unrelated to it
        answer: 1
        explanation: Much EDR and Sysmon telemetry ultimately comes from ETW providers.
      - prompt: Attackers tamper with ETW because
        options:
          - It makes their malware slower
          - Disabling ETW in their process blinds the telemetry that would reveal their activity, a defense-evasion step
          - It has no detection value
          - It only affects wallpaper
        answer: 1
        explanation: Because ETW feeds detection, neutralising it hides the attacker, so tampering must itself be detected.
  - slug: win-ad-attack-paths
    title: Active Directory Attack Paths and Tiering
    order: 21
    difficulty: advanced
    summary: Understand how attackers chain small misconfigurations in Active Directory into paths to domain dominance, how tools map these paths, and how tiered administration and hardening break them.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain how Active Directory attack paths lead to domain dominance
      - Describe how attackers and defenders map these paths
      - Apply tiering and hardening to break attack paths
    theory: |
      **Active Directory (AD)** is the identity backbone of most enterprises, and its interconnected nature creates
      something distinctive: **attack paths**, chains of individually minor misconfigurations and permissions that,
      linked together, let an attacker move from an ordinary foothold all the way to domain dominance. No single
      step may look alarming, a user who is a local admin here, a group that can reset a password there, a service
      account with a risky delegation, an access-control entry granting a seemingly innocuous right, but AD's web
      of relationships means these connect into a route an attacker can walk. This is why defending AD requires
      thinking not just about individual vulnerabilities but about the **graph of relationships** and the paths
      through it, because attackers explicitly hunt for the shortest chain from where they are to Domain Admin.

      Attackers (and defenders) **map these paths** systematically. Tools famously model AD as a graph, nodes are
      users, computers, groups, and edges are the rights and relationships between them (member of, admin to, can
      reset password, has session on, can be delegated), and then compute the shortest paths from a compromised
      account to high-value targets like Domain Admins. This turns a sprawling, hard-to-reason-about environment
      into concrete attack routes. The building blocks of these paths include the specific attacks met earlier
      (Kerberos abuses, NTLM relay, credential theft) plus privilege-granting misconfigurations: excessive group
      memberships, dangerous access-control entries (ACL abuse), unconstrained or misconfigured delegation,
      credentials cached on many machines, and local-admin sprawl that lets an attacker harvest credentials and
      pivot. Understanding that an attacker reasons in paths, not isolated flaws, reframes the defensive problem:
      the goal is to cut the edges that let paths form.

      Breaking attack paths relies above all on **tiered administration** plus targeted hardening. The **tier
      model** separates administration into levels, tier 0 (the identity plane, domain controllers, AD, and the
      accounts and systems that control it) is the crown jewels and must be administered only from clean, protected
      systems and never exposed to lower tiers; tier 1 (servers) and tier 2 (workstations) are kept separate, so a
      compromised workstation cannot harvest a domain-admin credential because such credentials never touch it.
      Tiering directly severs the most dangerous paths, those that let workstation compromise reach the domain core.
      Alongside it: reduce local-admin and privileged-group membership (least privilege), fix dangerous
      delegations and risky ACLs, protect and limit where privileged credentials are used (connecting to PAM and
      Credential Guard met earlier), and continuously map your own AD to find and remediate paths before attackers
      do, using the same graphing tools defensively. Monitoring for the techniques along these paths (the detection
      lessons on Kerberos, credential access and lateral movement) provides the alerting layer. For the analyst and
      administrator, the lessons are that AD compromise is usually the result of chained attack paths rather than
      one flaw, that modelling AD as a graph reveals the concrete routes to domain dominance, and that tiered
      administration together with least privilege, fixing dangerous rights and delegations, and proactively
      mapping your own environment is what cuts those paths, protecting the identity backbone that, once fully
      compromised, gives an attacker the entire domain.
    examples:
      - title: Chained paths to domain dominance
        body: |
          AD's web of relationships: local admin here + password-reset right there + risky delegation + an innocuous ACL = a walkable route to Domain Admin
          no single step looks alarming -> defend the GRAPH of relationships, not just isolated flaws.
      - title: Mapping and breaking paths
        body: |
          graph AD (users/computers/groups as nodes; member-of, admin-to, can-reset, has-session, delegation as edges) -> shortest path to Domain Admins
          break with TIERING: tier 0 (DCs/AD/identity) administered only from clean systems, never exposed to workstations -> DA creds never touch a workstation
          plus least privilege, fix delegations/ACLs, protect privileged creds (PAM/Cred Guard), map your own AD proactively.
    exercise:
      title: Find and break Active Directory attack paths
      environment: A described Active Directory environment (or a scenario with sample relationships)
      tools: [A scenario or sample AD relationships, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain how minor misconfigurations chain into an attack path to domain dominance.
        - Describe how modelling AD as a graph reveals concrete routes to high-value targets.
        - Give examples of the path building blocks (ACL abuse, delegation, local-admin sprawl, credential caching).
        - Explain the tier model and how it severs the most dangerous paths.
        - Describe additional hardening (least privilege, fixing delegations, protecting credentials).
        - Explain how proactively mapping your own AD and monitoring the path techniques helps.
      deliverable: An AD attack-path plan covering how paths form, graph-based mapping, the tier model, hardening to cut paths, and proactive mapping with detection.
    expected_outcome: >
      You can explain how Active Directory attack paths lead to domain dominance, describe how they are mapped as a
      graph, and apply tiered administration and hardening to break the paths that protect the identity backbone.
    quiz:
      - prompt: An Active Directory attack path is
        options:
          - A single critical vulnerability
          - A chain of individually minor misconfigurations and rights that together lead from a foothold to domain dominance
          - A physical cable route
          - A backup schedule
        answer: 1
        explanation: AD compromise usually comes from chaining small, linked misconfigurations into a route to Domain Admin.
      - prompt: Modelling AD as a graph helps because it
        options:
          - Hides the relationships
          - Reveals concrete shortest paths from a compromised account to high-value targets like Domain Admins
          - Encrypts the domain
          - Removes all accounts
        answer: 1
        explanation: Graphing nodes and the rights between them exposes the actual routes attackers can walk.
      - prompt: The tier model breaks attack paths by
        options:
          - Giving every workstation domain-admin rights
          - Keeping tier 0 (identity/DCs) administered only from clean systems so privileged credentials never touch lower tiers
          - Removing authentication
          - Sharing all credentials
        answer: 1
        explanation: Tiering ensures a compromised workstation cannot harvest a credential that reaches the domain core.
      - prompt: Defenders should map their own AD with the same graphing tools in order to
        options:
          - Help attackers
          - Find and remediate dangerous attack paths before attackers exploit them
          - Delete the domain
          - Avoid any hardening
        answer: 1
        explanation: Proactive mapping finds the paths so they can be cut before an attacker uses them.
  - slug: win-amsi-script-defense
    title: AMSI and Script-Based Attack Defense
    order: 22
    difficulty: advanced
    summary: Understand how attackers use scripts and in-memory techniques to evade file-based detection, how the Antimalware Scan Interface (AMSI) gives defenders visibility into that activity, and how to defend against script-based attacks.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain why script-based and in-memory attacks evade file detection
      - Describe how AMSI gives visibility into script content
      - Defend against script-based attacks and AMSI evasion
    theory: |
      A great deal of modern Windows attack activity happens through **scripts** (PowerShell, JScript, VBScript,
      Office macros) and **in-memory execution** rather than dropping traditional executable files, precisely
      because file-based antivirus struggles to catch what never touches disk as a recognisable file. An attacker
      can run a malicious PowerShell command that downloads and executes code entirely in memory, or heavily
      obfuscate a script so its true content is hidden until runtime, defeating simple signature scanning. This
      living-off-the-land and fileless style (met in hunting and detection) is a core evasion technique, so
      defenders need a way to see what scripts actually do when they run, not just what the file on disk looks like.

      The **Antimalware Scan Interface (AMSI)** is Microsoft's answer to this. AMSI is a Windows interface that lets
      scripting engines and applications submit content to the installed antimalware product for scanning **at the
      point of execution**, after it has been de-obfuscated into what will actually run. So when a PowerShell script
      is about to execute, its real, de-obfuscated content is passed through AMSI to be scanned, which means that
      even a script obfuscated to defeat on-disk scanning is inspected in its true form at runtime. AMSI gives
      defenders and antimalware visibility into script content, macro behaviour and other dynamic execution that
      would otherwise be hidden, and it is an important source feeding script-based detection (connecting to the
      PowerShell logging and ETW telemetry met earlier). In effect, AMSI moves the inspection point from the file
      to the moment of execution, where obfuscation has already been undone.

      Because AMSI is so useful to defenders, attackers try to **evade or disable it**, and understanding this is
      part of the defense. Sophisticated malware attempts **AMSI bypass**, tampering with AMSI in its own process
      so that its script content is never scanned (patching the AMSI function, or other techniques), which is a
      recognised defense-evasion move, and, like ETW tampering, an attempt to disable AMSI is itself a detectable
      and suspicious event. So defending against script-based attacks combines several layers: keep AMSI and
      antimalware enabled and monitor for AMSI tampering, enable rich **script logging** (PowerShell script-block
      logging, met earlier) so script content and execution are recorded regardless, apply **execution controls**
      (constrained language mode, application control, macro restrictions, disabling or restricting scripting where
      not needed), and feed all of this into detection so obfuscated and in-memory script activity is caught. The
      considerations are that AMSI is one layer, not a complete solution (bypasses exist), so it is combined with
      logging and execution controls rather than relied on alone. For the analyst, the lessons are that scripts and
      in-memory techniques evade file-based detection, that AMSI restores visibility by scanning content at the
      moment of execution after de-obfuscation, that attackers in turn try to disable AMSI (itself a detectable
      signal), and that defending against script-based attacks means combining AMSI, thorough script logging and
      execution controls so that the fileless, obfuscated techniques attackers rely on are seen and stopped.
    examples:
      - title: Why scripts evade file detection
        body: |
          scripts (PowerShell/JScript/VBScript/macros) + in-memory execution -> nothing recognisable touches disk; obfuscation hides content until runtime
          file-based AV struggles -> living-off-the-land/fileless is a core evasion -> defenders must see what scripts DO at runtime.
      - title: AMSI and its evasion
        body: |
          AMSI: scripting engines submit content to antimalware AT EXECUTION, after DE-OBFUSCATION -> the real content is scanned even if the file was obfuscated
          attackers attempt AMSI BYPASS (patch AMSI in their process) = defense evasion, itself detectable
          defend in layers: keep AMSI on + watch for tampering, script-block logging, execution controls (constrained language, app control, macro limits).
    exercise:
      title: Defend against script-based attacks
      environment: A described Windows environment facing script-based threats (or a scenario)
      tools: [A scenario or sample script telemetry, a document, a notes file]
      steps:
        - Explain why script-based and in-memory techniques evade file-based detection.
        - Explain how AMSI scans script content at the moment of execution after de-obfuscation.
        - Explain why AMSI catches obfuscated scripts that on-disk scanning misses.
        - Describe AMSI bypass as an evasion technique and why an attempt to disable AMSI is itself a signal.
        - List the layered defences (AMSI, script logging, execution controls) and why no single one suffices.
        - Describe how this telemetry feeds script-based detection.
      deliverable: A script-defense plan covering why scripts evade file detection, how AMSI restores visibility, AMSI evasion as a detectable signal, and the layered defences (AMSI, logging, execution controls).
    expected_outcome: >
      You can explain why script and in-memory attacks evade file detection, describe how AMSI scans content at
      execution, and defend against script-based attacks with AMSI, script logging and execution controls.
    quiz:
      - prompt: Script-based and in-memory attacks evade file-based detection because
        options:
          - They always drop a recognisable executable to disk
          - Little or nothing recognisable touches disk, and obfuscation hides the content until runtime
          - They cannot run on Windows
          - They are always signed
        answer: 1
        explanation: Fileless, obfuscated execution defeats on-disk signature scanning.
      - prompt: AMSI restores visibility by scanning script content
        options:
          - Only as it sits obfuscated on disk
          - At the point of execution, after de-obfuscation, so the real content is inspected
          - Never
          - Only after the attack completes
        answer: 1
        explanation: AMSI inspects the de-obfuscated content at runtime, catching scripts that evade disk scanning.
      - prompt: An attempt to bypass or disable AMSI should be treated as
        options:
          - Normal, harmless activity
          - A defense-evasion technique and itself a detectable, suspicious signal
          - A performance optimisation
          - Proof the system is secure
        answer: 1
        explanation: Like ETW tampering, disabling AMSI hides the attacker and is a strong signal to detect.
      - prompt: Defending against script-based attacks should
        options:
          - Rely on AMSI alone
          - Combine AMSI with script-block logging and execution controls, since AMSI can be bypassed
          - Disable all logging
          - Trust obfuscated scripts
        answer: 1
        explanation: AMSI is one layer; logging and execution controls provide defense in depth against bypasses.
  - slug: win-defender-edr
    title: Microsoft Defender for Endpoint and EDR on Windows
    order: 23
    difficulty: intermediate
    summary: Understand what endpoint detection and response (EDR) brings to Windows beyond traditional antivirus, how a platform like Microsoft Defender for Endpoint works, and how analysts use it to detect, investigate and respond.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.5", "sc200:3", "cysa:1.1"]
    learning_objectives:
      - Explain how EDR differs from traditional antivirus
      - Describe the capabilities of a Windows EDR platform
      - Use EDR to detect, investigate and respond on endpoints
    theory: |
      Traditional antivirus mostly asks a single question, does this file match known-bad signatures, and blocks
      it if so, which misses the fileless, in-memory, living-off-the-land and novel techniques covered throughout
      this module. **Endpoint Detection and Response (EDR)** is the modern answer: rather than only scanning files,
      EDR continuously records endpoint **behaviour**, process execution, file and registry activity, network
      connections, script and in-memory activity (drawing on the ETW and AMSI telemetry met earlier), and uses that
      rich behavioural data to detect suspicious activity, give analysts deep visibility, and enable response. On
      Windows, Microsoft Defender for Endpoint is a prominent example, and understanding EDR matters because it is
      the primary detection-and-response tool on modern endpoints and a central source feeding the SOC.

      An EDR platform's **capabilities** span detection, visibility and response. For **detection**, it combines
      behavioural analytics, machine learning, threat intelligence and rules to flag suspicious behaviour, catching
      the techniques signature antivirus misses, and it still includes traditional prevention (next-generation
      antivirus) as a layer. For **visibility and investigation**, it records detailed endpoint telemetry and
      retains it, so an analyst can see exactly what happened on a host, a process tree showing how a threat
      executed, what it touched, what it connected to, and can search across all endpoints for indicators and
      behaviours (threat hunting, met earlier), which is invaluable for scoping an incident across the fleet. For
      **response**, EDR provides actions an analyst can take remotely and quickly, isolate a compromised host from
      the network (while keeping the EDR connection for investigation), kill a malicious process, quarantine a
      file, collect an investigation package, and sometimes automate these responses, which is exactly the fast,
      remote containment that incident response needs.

      Using EDR well fits it into the broader SOC. Its alerts feed the SIEM and the alert-to-response workflow (met
      in the SOC lesson), its rich telemetry powers both detection and investigation, and its response actions are
      a core containment capability for incident response. EDR is also a target and a dependency to protect:
      attackers try to disable or evade it (tampering with the agent, the ETW/AMSI evasion met earlier), so
      tamper protection and monitoring the EDR's own health matter, and an endpoint that stops reporting to EDR is,
      like a silent log source, a potential blind spot and attack signal. The considerations are tuning (EDR can
      generate many alerts, so it needs the detection-engineering discipline met earlier), coverage (every endpoint
      needs the agent), and that EDR is one layer in defense in depth, not a complete solution. Increasingly EDR
      extends into XDR, correlating endpoint data with identity, email and cloud signals for a broader picture. For
      the analyst, the lessons are that EDR moves endpoint security from signature file-scanning to continuous
      behavioural detection, deep forensic visibility and fast remote response, that a platform like Microsoft
      Defender for Endpoint is the primary detection-and-response tool on modern Windows endpoints and a key SOC
      source, and that using it means leveraging its telemetry for detection, investigation and hunting, its
      actions for containment, and protecting the EDR itself as the critical sensor and control point it has become.
    examples:
      - title: EDR vs traditional antivirus
        body: |
          AV: does this FILE match known-bad signatures? -> misses fileless/in-memory/living-off-the-land/novel
          EDR: continuously records BEHAVIOUR (process/file/registry/network/script/in-memory, via ETW/AMSI) -> behavioural detection + deep visibility + response
          Microsoft Defender for Endpoint = a prominent Windows example; primary endpoint detection-and-response tool.
      - title: Capabilities
        body: |
          detect: behavioural analytics + ML + threat intel + rules (+ NGAV prevention layer)
          investigate: detailed retained telemetry -> process tree of what happened; search all endpoints for indicators (hunting), scope across the fleet
          respond: isolate host (keep EDR link), kill process, quarantine file, collect package, often automated -> fast remote containment
          protect the EDR itself (tamper protection); a host that stops reporting = potential blind spot/attack signal.
    exercise:
      title: Use EDR to detect, investigate and respond
      environment: A described Windows fleet with an EDR platform (or a scenario with sample EDR data)
      tools: [A scenario or sample EDR telemetry, a document, a notes file]
      steps:
        - Explain how EDR differs from traditional signature-based antivirus and what it catches that AV misses.
        - Describe how EDR detects suspicious behaviour.
        - Explain how EDR's retained telemetry supports investigation and fleet-wide hunting.
        - Describe the response actions EDR provides and why host isolation keeps the EDR link.
        - Explain how EDR fits the SOC alert-to-response workflow and incident response.
        - Explain why the EDR itself must be protected and monitored for tampering.
      deliverable: An EDR usage plan covering behavioural detection, forensic visibility and hunting, remote response actions, integration with the SOC workflow, and protecting the EDR as a critical sensor.
    expected_outcome: >
      You can explain how EDR differs from antivirus, describe a Windows EDR platform's detection, visibility and
      response capabilities, and use EDR to detect, investigate, hunt and respond while protecting the EDR itself.
    quiz:
      - prompt: EDR differs from traditional antivirus mainly because it
        options:
          - Only scans files for known-bad signatures
          - Continuously records endpoint behaviour and uses it to detect suspicious activity, catching fileless and novel techniques AV misses
          - Does not run on endpoints
          - Cannot respond to threats
        answer: 1
        explanation: EDR adds behavioural detection and response beyond signature file-scanning.
      - prompt: A key EDR response capability is to
        options:
          - Only send an email
          - Isolate a compromised host from the network (while keeping the EDR link), kill processes and quarantine files, often remotely
          - Delete all endpoints
          - Do nothing automatically
        answer: 1
        explanation: EDR enables fast remote containment such as host isolation and process termination.
      - prompt: EDR's retained telemetry is valuable for investigation because it
        options:
          - Shows nothing about what happened
          - Lets an analyst reconstruct exactly what a threat did (process tree, files, connections) and search all endpoints for it
          - Only records CPU temperature
          - Cannot be searched
        answer: 1
        explanation: Rich, retained behavioural data reconstructs incidents and enables fleet-wide hunting.
      - prompt: An endpoint that stops reporting to EDR should be treated as
        options:
          - Always perfectly secure
          - A potential blind spot and attack signal, since attackers try to disable or evade EDR
          - A performance improvement
          - Irrelevant
        answer: 1
        explanation: A silent EDR agent may mean tampering, so it is a potential blind spot and signal, like a silent log source.
