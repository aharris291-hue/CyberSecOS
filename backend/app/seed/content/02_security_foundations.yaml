slug: security-foundations
title: Security Foundations
domain: Security Foundations
order: 2
description: >
  The core concepts every Security+ question builds on: security controls, the
  CIA triad, cryptography, and who attacks organisations and why.
lessons:
  - slug: sec-controls-cia
    title: Security Controls, the CIA Triad and Zero Trust
    order: 1
    difficulty: beginner
    summary: Classify security controls and audit a real system against the CIA triad and AAA.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:1.1", "secplus:1.2", "sc900:1"]
    learning_objectives:
      - Classify controls by category (technical, managerial, operational, physical) and type (preventive, detective, corrective and others)
      - Explain confidentiality, integrity, availability, non-repudiation and AAA
      - Describe Zero Trust, deception technologies and physical security controls
    theory: |
      Security+ groups controls two ways. **Category** says what the control is: **technical**
      (firewalls, MFA, encryption), **managerial** (policies, risk assessments), **operational**
      (security guards, awareness training, procedures run by people) and **physical** (locks,
      fences, badges). **Type** says what it does: **preventive** stops an incident, **deterrent**
      discourages it, **detective** finds it, **corrective** fixes it, **compensating** substitutes
      for a control you cannot implement, and **directive** tells people what to do.

      The **CIA triad** is the goal of all of them. **Confidentiality** keeps data from the wrong
      people (encryption, access control). **Integrity** keeps it unaltered (hashing, digital
      signatures). **Availability** keeps it usable (redundancy, backups). **Non-repudiation** means
      someone cannot deny an action they took, which digital signatures and logs provide.
      **AAA** is Authentication (prove who you are), Authorization (what you may do) and
      Accounting (a record of what you did).

      **Zero Trust** removes implicit trust based on network location. A **policy decision
      point** evaluates each request using identity, device health and context, and a **policy
      enforcement point** allows or blocks it. **Deception technology** such as honeypots,
      honeynets, honeyfiles and honeytokens has no legitimate use, so any interaction with it is
      a high-confidence alert. **Gap analysis** compares the controls you have with the controls
      a framework says you need.
    examples:
      - title: One risk, several controls
        body: |
          Risk: stolen laptop exposes customer data
          Preventive / technical:   full-disk encryption (BitLocker)
          Deterrent / physical:     cable lock and asset tag
          Detective / technical:    MDM alert when the device checks in from a new country
          Corrective / operational: remote wipe procedure run by the service desk
          Directive / managerial:   acceptable-use policy requiring encryption
      - title: A honeytoken
        body: |
          A fake cloud access key placed in an internal wiki page.
          No system uses it, so any API call made with it means someone read and
          stole credentials from the wiki.
    exercise:
      title: Run a control inventory and gap analysis on your own lab
      environment: Your Windows VM from the Windows Security course and a spreadsheet
      tools: [PowerShell, Spreadsheet, auditpol, manage-bde]
      steps:
        - Create a spreadsheet with columns Control, Category, Type, CIA goal, Evidence, Status.
        - Check disk encryption with `manage-bde -status` (or Settings > Privacy & security > Device encryption) and record it.
        - Check Windows Defender Firewall profiles with `Get-NetFirewallProfile | Select Name, Enabled` and record them.
        - Check audit logging with `auditpol /get /category:*` and record which categories detect logons and process creation.
        - Check password and lockout policy with `net accounts` and record whether a lockout threshold exists.
        - Classify each control by category and type, and map it to confidentiality, integrity or availability.
        - Add three controls you do not have (for example backups, MFA, a honeyfile), mark them as gaps, and write one sentence on the risk each gap leaves open.
        - Create a honeyfile named `passwords-2026.xlsx` and enable auditing on it (Properties > Security > Advanced > Auditing) so reads generate event 4663.
      deliverable: The completed control inventory with at least eight rows, including three gaps and your honeyfile.
    expected_outcome: >
      You can look at any control and say which category and type it is, which CIA goal it
      serves, and what is missing compared with a baseline.
    quiz:
      - prompt: A security guard checking badges at the entrance is which control category?
        options: [Technical, Managerial, Operational, Compensating]
        answer: 2
        explanation: Guards are people carrying out a procedure, which Security+ calls operational.
      - prompt: Which control type is a security camera that is reviewed after an incident?
        options: [Preventive, Detective, Corrective, Directive]
        answer: 1
        explanation: Reviewing footage finds and records what happened, which is detective.
      - prompt: Digital signatures primarily provide integrity and
        options: [Availability, Non-repudiation, Obfuscation, Load balancing]
        answer: 1
        explanation: A signature proves who signed, so the signer cannot deny it.
      - prompt: Any access to a honeyfile is treated as malicious because
        options:
          - Honeyfiles are encrypted
          - The file has no legitimate business use
          - Honeyfiles contain malware
          - Only administrators can open it
        answer: 1
        explanation: Deception assets have no real purpose, so interaction signals an intruder.
      - prompt: In Zero Trust, which component decides whether a request is allowed?
        options: [Policy enforcement point, Policy decision point, Jump server, Screened subnet]
        answer: 1
        explanation: The policy decision point evaluates the request; the enforcement point applies the decision.

  - slug: sec-crypto-pki
    title: Cryptography, Hashing and PKI in Practice
    order: 2
    difficulty: beginner
    summary: Hash, encrypt, sign and inspect certificates with OpenSSL.
    theory_minutes: 12
    lab_minutes: 50
    objectives: ["secplus:1.4"]
    learning_objectives:
      - Distinguish symmetric encryption, asymmetric encryption and hashing and say when each is used
      - Explain digital signatures, certificates and the chain of trust
      - Use OpenSSL to hash files, encrypt data and inspect a website's certificate
    theory: |
      **Symmetric** encryption (AES) uses one shared key: fast, used for bulk data, but the key
      must be shared safely. **Asymmetric** encryption (RSA, elliptic curve) uses a key pair:
      what the public key encrypts only the private key can decrypt. It is slow, so it is used
      to exchange symmetric keys and to sign. **Hashing** (SHA-256) is one-way: the same input
      always gives the same fixed-length digest, and any change gives a completely different one.
      Passwords should be stored with a **salted**, deliberately slow hash (bcrypt, PBKDF2,
      Argon2), which makes precomputed rainbow tables useless.

      A **digital signature** is a hash of the message signed with the sender's private key;
      anyone can verify it with the public key. A **certificate** binds a public key to an
      identity and is signed by a **Certificate Authority (CA)**. Your browser trusts a site
      because the chain leads from the site's certificate through intermediates to a **root CA**
      in its trust store. Certificates are revoked through **CRLs** or **OCSP**; **OCSP
      stapling** lets the server deliver the status itself.

      Other terms to know: **key escrow** (a third party holds keys for recovery), **HSM** and
      **TPM** (hardware that protects keys), **secure enclave**, **key stretching**,
      **obfuscation** techniques such as steganography, tokenization and data masking, and
      **blockchain** as an append-only ledger. **Wildcard** certificates cover all subdomains,
      and **self-signed** certificates are not trusted by default.
    examples:
      - title: Hashes reveal any change
        body: |
          $ echo "pay 100" | sha256sum
          5c1e...  -
          $ echo "pay 900" | sha256sum
          a8f4...  -
          One character changed, the digest is completely different.
      - title: Inspecting a certificate chain
        body: |
          $ openssl s_client -connect example.com:443 -showcerts </dev/null
          depth=2 ... CN = DigiCert Global Root G2
          depth=1 ... CN = DigiCert Global G2 TLS RSA SHA256 2020 CA1
          depth=0 ... CN = www.example.org
    exercise:
      title: Hash, encrypt, sign and verify
      environment: Linux VM or WSL with OpenSSL (installed by default on Ubuntu)
      tools: [openssl, sha256sum]
      steps:
        - Create a file, record its SHA-256 with `sha256sum`, change one character, hash it again and compare.
        - Encrypt the file with `openssl enc -aes-256-cbc -pbkdf2 -salt -in notes.txt -out notes.enc`, then decrypt it and confirm the hash matches the original.
        - Generate an RSA key pair with `openssl genpkey -algorithm RSA -out key.pem` and extract the public key with `openssl pkey -in key.pem -pubout -out pub.pem`.
        - Sign the file with `openssl dgst -sha256 -sign key.pem -out notes.sig notes.txt` and verify it with `openssl dgst -sha256 -verify pub.pem -signature notes.sig notes.txt`.
        - Change the file and run the verification again; record the result.
        - Inspect a real certificate with `openssl s_client -connect example.com:443 -showcerts` and record the issuer, validity dates and chain depth.
        - Create a self-signed certificate with `openssl req -x509 -newkey rsa:2048 -nodes -keyout lab.key -out lab.crt -days 30 -subj "/CN=lab.local"` and explain why a browser would not trust it.
      deliverable: A short report with your hashes, the verification results before and after the change, and the certificate chain you inspected.
    expected_outcome: >
      You can choose the right cryptographic tool for confidentiality, integrity or
      non-repudiation and verify certificates and signatures yourself.
    quiz:
      - prompt: Which provides integrity but not confidentiality?
        options: [AES encryption, SHA-256 hashing, RSA encryption, A VPN tunnel]
        answer: 1
        explanation: A hash proves data has not changed but does not hide it.
      - prompt: To create a digital signature, the sender uses
        options: [The recipient's public key, The sender's private key, A shared symmetric key, The CA's public key]
        answer: 1
        explanation: Signing uses the sender's private key; anyone verifies with the sender's public key.
      - prompt: Why is AES used for bulk data instead of RSA?
        options:
          - AES is asymmetric
          - Symmetric encryption is much faster
          - RSA cannot encrypt files
          - AES does not need a key
        answer: 1
        explanation: Asymmetric algorithms are slow, so they protect a symmetric key that encrypts the data.
      - prompt: Adding a random salt to password hashes defeats
        options: [Brute force entirely, Precomputed rainbow tables, Phishing, Keyloggers]
        answer: 1
        explanation: Salts make each hash unique, so precomputed tables do not match.
      - prompt: Which lets a web server provide certificate revocation status during the TLS handshake?
        options: [CRL, OCSP stapling, Key escrow, Certificate pinning]
        answer: 1
        explanation: With OCSP stapling the server attaches a signed, recent OCSP response.

  - slug: sec-threat-actors-vulns
    title: Threat Actors and Vulnerability Research
    order: 3
    difficulty: beginner
    summary: Profile threat actors and research, score and remediate real published vulnerabilities.
    theory_minutes: 12
    lab_minutes: 50
    objectives: ["secplus:2.1", "secplus:2.3", "cysa:2.4"]
    learning_objectives:
      - Compare threat actors by sophistication, resources and motivation
      - Name the common vulnerability classes and the control that mitigates each
      - Research a CVE in public databases and turn it into a remediation recommendation
    theory: |
      **Threat actors** differ in resources, sophistication and motive. **Nation-state** groups
      are well funded and patient, seeking espionage or disruption. **Organised crime** wants
      money, most often through ransomware and fraud. **Hacktivists** want attention for a cause.
      **Insider threats** already have access, whether malicious or careless. **Unskilled
      attackers** use tools others wrote. **Shadow IT**, systems staff deploy without approval, is
      treated as a threat source because nobody secures it. Motivations to know include data
      exfiltration, financial gain, espionage, disruption, revenge and ideology.

      **Vulnerability classes** describe *why* a system is weak. **Injection** flaws happen
      when input is treated as code, and are prevented by parameterised queries and input
      validation. **Cross-site scripting** lets input run in another user's browser, prevented
      by output encoding. **Memory** flaws such as buffer overflows are mitigated by safe
      languages, ASLR and DEP. **Race conditions** (time-of-check to time-of-use) need atomic
      operations. **Misconfiguration**, default credentials and missing patches are the most
      common real-world cause. **Zero-days** have no patch yet, so you rely on compensating
      controls. **Supply chain** weaknesses come from vendors and dependencies.

      Every published vulnerability gets a **CVE** identifier. **NVD** adds a **CVSS** score
      (0-10) describing severity, and **CISA's Known Exploited Vulnerabilities (KEV)** catalog
      lists the ones attackers actually use, which should be patched first.
    examples:
      - title: Matching a weakness to its fix
        body: |
          Finding: login form builds SQL with string concatenation
          Class:   Injection (CWE-89)
          Fix:     parameterised queries; least-privilege database account; WAF as compensating control
      - title: Reading a CVSS vector
        body: |
          CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H  -> 9.8 Critical
          Network reachable, low complexity, no privileges, no user interaction:
          anyone on the internet can exploit it. Patch immediately.
    exercise:
      title: Profile an actor and triage three real CVEs
      environment: A web browser and a spreadsheet; no lab VM needed
      tools: [MITRE ATT&CK Groups, NVD, CISA KEV catalog, FIRST CVSS calculator]
      steps:
        - On attack.mitre.org open Groups, choose one financially motivated group and one state-sponsored group, and record each one's motive, typical targets and three techniques.
        - Classify both groups using the Security+ actor types and write one sentence on the controls that would most disrupt each.
        - Open CISA's KEV catalog and pick three entries for products you know (for example a VPN appliance, a browser and a mail server).
        - Look up each CVE on nvd.nist.gov and record the CVSS score, the vector string and the CWE weakness class.
        - Paste each vector into the FIRST CVSS calculator and explain in your own words what each metric means for that CVE.
        - Map each weakness to its vulnerability class from the theory and to a primary fix and a compensating control.
        - Rank the three CVEs for patching and justify the order using KEV status, CVSS and exposure.
      deliverable: An actor profile table and a three-row vulnerability triage table with class, score, fix, compensating control and patch priority.
    expected_outcome: >
      You can explain who is likely to attack an organisation and why, and turn a CVE into a
      prioritised, justified remediation recommendation.
    quiz:
      - prompt: Which threat actor is most associated with ransomware for profit?
        options: [Hacktivist, Organised crime, Nation-state, Shadow IT]
        answer: 1
        explanation: Organised criminal groups are financially motivated, and ransomware is their main business model.
      - prompt: Which control prevents SQL injection at its source?
        options: [Antivirus, Parameterised queries, Full-disk encryption, Longer passwords]
        answer: 1
        explanation: Parameterised queries keep user input as data so it is never executed as SQL.
      - prompt: A vulnerability with no available patch is called a
        options: [Zero-day, Race condition, Misconfiguration, Legacy system]
        answer: 0
        explanation: Defenders have had zero days to fix it, so compensating controls are needed.
      - prompt: Why patch entries in CISA's KEV catalog first?
        options:
          - They always have a CVSS of 10
          - They are confirmed to be exploited in the wild
          - They only affect government systems
          - They cannot be detected
        answer: 1
        explanation: KEV lists vulnerabilities attackers are actively using, which makes them the most urgent.
      - prompt: An employee runs an unapproved cloud file-sharing service for the team. This is
        options: [An insider attack, Shadow IT, A zero-day, Hacktivism]
        answer: 1
        explanation: Systems deployed without IT approval are shadow IT and go unmanaged and unsecured.

  - slug: sec-phishing-social-engineering
    title: Analysing Phishing and Social Engineering
    order: 4
    difficulty: beginner
    summary: Pull apart a phishing email from its headers, links and pretext.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.2", "secplus:5.6", "cysa:1.2"]
    learning_objectives:
      - Describe the common social-engineering techniques and why they work
      - Read an email's headers and authentication results to judge if it is spoofed
      - Safely inspect links and attachments and extract indicators from a phish
    theory: |
      **Social engineering** attacks the person, not the software. The most common form a SOC sees
      is **phishing**, an email that pushes the reader to click a link, open an attachment or hand
      over credentials. It works by borrowing **authority** (a message that looks like it is from
      IT or a bank), creating **urgency** (an account will be closed), and offering a plausible
      **pretext**. Variants include **spear phishing** aimed at one person, **smishing** over SMS
      and **vishing** over the phone.

      The header tells you a lot. The **Received** chain shows the servers the mail passed through,
      and the authentication results record whether **SPF**, **DKIM** and **DMARC** passed. SPF
      checks the sending server is allowed for the domain, DKIM checks a signature over the
      message, and DMARC ties the visible From address to those results. A friendly display name
      hiding a mismatched address, or a Reply-To on a different domain, are classic tells.

      Links and attachments are where the payload lives. Hover to see the real destination, watch
      for lookalike domains and URL shorteners, and treat an unexpected document that asks you to
      enable macros as hostile. Your output from triaging a phish is a set of **indicators**, the
      sender, the URLs and any attachment hashes, that feed blocking and a search for anyone else
      who received it.
    examples:
      - title: A spoofed sender giveaway
        body: |
          From      IT Support <helpdesk@it-support-portal.co>
          Reply-To  harvest@mail.ru
          DMARC     fail
          A display name of IT Support over an unrelated domain, a foreign Reply-To, and a failed DMARC.
      - title: A lookalike link under a safe-looking label
        body: |
          Visible text   https://login.microsoft.com
          Real href      https://login.microsoft.com.secure-check.ru/auth
          The real domain is secure-check.ru, not microsoft.com.
    exercise:
      title: Triage a phishing sample
      environment: An isolated analysis VM; never click live links or open attachments on a work machine
      tools: [A raw email (.eml) sample, a text editor, a URL defang tool, VirusTotal (hash and URL search only)]
      steps:
        - Open a phishing .eml sample in a text editor in your analysis VM.
        - Read the Received chain and note the originating server and the From, Reply-To and Return-Path.
        - Find the authentication results and record whether SPF, DKIM and DMARC passed or failed.
        - List every URL in the body, defang them, and compare the visible text against the real destination.
        - Identify any attachment, record its name and hash, and search the hash on VirusTotal without uploading the file.
        - Decide whether the message is phishing and write the one or two tells that convinced you.
        - Produce an indicator list (sender, URLs, attachment hash) you would hand to blocking and a mailbox search.
      deliverable: A short triage note with the verdict, the deciding tells, and an indicator list for blocking.
    expected_outcome: >
      Given an unfamiliar email you can judge whether it is phishing from its headers
      and links and hand off a usable indicator list, without exposing yourself to the payload.
    quiz:
      - prompt: Which trio of checks helps show whether an email's sender is spoofed?
        options:
          - "TCP, UDP and ICMP"
          - "SPF, DKIM and DMARC"
          - "RAID 0, 1 and 5"
          - "GET, POST and PUT"
        answer: 1
        explanation: SPF, DKIM and DMARC together verify the sending server, a message signature and the From alignment.
      - prompt: A message's display name reads IT Support but the address is on an unrelated domain. This is
        options: [Proof the mail is safe, A common spoofing tell worth investigating, A DKIM signature, A normal mailing list]
        answer: 1
        explanation: A trusted-looking display name over a mismatched address is a classic phishing giveaway.
      - prompt: Why search an attachment's hash on VirusTotal rather than uploading the file?
        options:
          - Hashes are easier to type
          - Uploading may share a targeted sample publicly and tip off the attacker
          - VirusTotal rejects files
          - Hashes identify the victim
        answer: 1
        explanation: A hash lookup reveals nothing new, while an upload can expose a sensitive or targeted sample.
      - prompt: The safest way to check where a link really goes is to
        options: [Click it and see, Hover or inspect the href without clicking, Forward it to a colleague, Reply and ask]
        answer: 1
        explanation: Inspecting the href shows the true destination without executing anything.

  - slug: sec-identity-access-management
    title: Identity and Access Management Fundamentals
    order: 5
    difficulty: beginner
    summary: Understand authentication, authorisation, MFA, SSO and the account lifecycle.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:2", "secplus:1.2"]
    learning_objectives:
      - Distinguish authentication, authorisation and accounting
      - Explain how MFA, SSO and least privilege strengthen access control
      - Describe the account lifecycle and the identity attacks a SOC watches for
    theory: |
      Identity and access management decides who you are and what you may do, and in a modern
      estate it is the real perimeter. Three ideas sit underneath it, together called **AAA**:
      **authentication** proves identity, **authorisation** grants the permissions that identity
      should have, and **accounting** records what was done. Keeping the three straight matters,
      because most access failures are really authorisation failures, not authentication ones.

      Stronger access rests on a few mechanisms. **Multi-factor authentication (MFA)** combines
      factors from different categories, something you know, something you have and something you
      are, so a stolen password alone is not enough. **Single sign-on (SSO)** lets one login reach
      many applications through a trusted identity provider using protocols like SAML and OIDC,
      which is convenient but makes that provider a high-value target. **Least privilege** and
      **role-based access control** keep each account's permissions to the minimum its job needs.

      The **account lifecycle** is where gaps appear. Accounts are provisioned on joining, changed
      when roles change, and must be **deprovisioned promptly** when someone leaves, or you get
      orphaned accounts and privilege creep. Privileged accounts need extra care through
      just-in-time elevation and privileged access management. For a SOC the IAM signals are
      specific: MFA fatigue or push-bombing, impossible-travel logins, MFA suddenly disabled, and
      new grants of privileged access.
    examples:
      - title: Authentication versus authorisation
        body: |
          Authentication   the user proves they are jsmith with a password and MFA
          Authorisation    jsmith is allowed to read the finance folder but not the admin console
          A valid login still should not reach actions the role does not need.
      - title: An IAM signal worth an alert
        body: |
          event   MFA method removed from an admin account, then a login from a new country
          Disabling MFA just before an unusual login is a classic account-takeover pattern.
    exercise:
      title: Review an identity setup against IAM principles
      environment: A sample directory or IAM export with users, roles and sign-in logs
      tools: [A sample user and role list, sample sign-in logs, a notes file]
      steps:
        - From the sample, list the accounts and the roles or permissions each one holds.
        - Flag any account whose permissions look broader than its job would need.
        - Check which accounts have MFA enabled and note any privileged account without it.
        - Look for accounts that should have been deprovisioned, such as ones with no recent activity.
        - In the sign-in logs, search for impossible travel, repeated MFA prompts or MFA being disabled.
        - Recommend one least-privilege change and one monitoring rule for privileged-access grants.
      deliverable: A short IAM review noting over-privileged and stale accounts, MFA gaps and one alerting rule for privileged changes.
    expected_outcome: >
      You can tell authentication from authorisation, explain how MFA, SSO and least
      privilege work, and spot the account-lifecycle gaps and identity attacks a SOC cares about.
    quiz:
      - prompt: Multi-factor authentication is strong because it combines
        options:
          - Two passwords
          - Factors from different categories such as something you know and something you have
          - Two usernames
          - A password typed twice
        answer: 1
        explanation: MFA requires factors of different kinds, so a stolen password alone is not enough to log in.
      - prompt: Authorisation (as opposed to authentication) decides
        options: [Who you are, What an identity is allowed to do, The network speed, The password length]
        answer: 1
        explanation: Authentication proves identity; authorisation grants what that identity may do.
      - prompt: Which account-lifecycle failure most often leaves a security gap?
        options:
          - Creating an account on day one
          - Failing to deprovision an account promptly when someone leaves
          - Enabling MFA
          - Assigning least privilege
        answer: 1
        explanation: Accounts that are not removed on departure become orphaned access an attacker can use.
      - prompt: An admin account's MFA being removed just before a login from a new country is
        options: [Routine maintenance, A classic account-takeover signal, A password reset, A normal SSO event]
        answer: 1
        explanation: Disabling MFA ahead of an unusual login is a common takeover pattern worth alerting on.

  - slug: sec-malware-types-behaviour
    title: Malware Types and How They Behave
    order: 6
    difficulty: beginner
    summary: Tell the main malware families apart by what they do, so you can read an alert and expect the right behaviour.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.1", "secplus:2.4", "cysa:1.2"]
    learning_objectives:
      - Name the main malware families and describe what each one does
      - Match observed behaviour (files, processes, network) to a likely malware type
      - Explain why fileless and living-off-the-land malware is harder to spot
    theory: |
      Malware is a broad word for software written to act against the owner's interest, and the
      families behave differently enough that naming the type tells you what to look for. A **virus**
      attaches to a file and spreads when that file runs; a **worm** spreads on its own across a
      network with no user action. A **trojan** pretends to be something useful to get itself run.
      **Ransomware** encrypts files and demands payment. **Spyware** and a **keylogger** quietly
      collect information, and a **rootkit** hides other malware from the system. A **bot** turns the
      host into one node an attacker controls remotely.

      For an analyst the value is matching **behaviour to type**. Rapid encryption of many files with
      a ransom note is ransomware; a process beaconing to the same external host on a timer looks
      like a bot or remote-access trojan calling home; a new program that spreads to peers over the
      network without anyone opening it behaves like a worm. You rarely name the exact strain from
      one alert, but the shape of the activity, what touched the disk, what ran, what talked to the
      network, points at a family and tells you what to check next.

      The hardest cases carry **no file to find**. **Fileless** malware runs in memory, and
      **living-off-the-land** attacks abuse tools already on the system, such as PowerShell or
      scripting engines, so there is no malicious binary on disk to scan. These defeat simple file-
      based antivirus and are caught by behaviour instead: a trusted tool doing something it never
      normally does. This is foundational knowledge the later hands-on lessons build on; here the aim
      is to recognise the families and their behaviour, not yet to write detections for them.
    examples:
      - title: Behaviour pointing at ransomware
        body: |
          thousands of files rewritten in minutes, new extension, a README demanding payment
          Fast mass-encryption plus a ransom note is ransomware, whatever the exact strain.
      - title: Living-off-the-land activity
        body: |
          powershell.exe launched by a Word document, downloading and running code in memory
          A trusted tool abused to run code with nothing written to disk is living-off-the-land.
    exercise:
      title: Classify malware behaviour from sample descriptions
      environment: A set of short written incident descriptions; no live malware
      tools: [A set of sample behaviour descriptions, a notes file]
      steps:
        - Write a one-line description of each main malware family in your own words.
        - For each sample description, name the most likely malware family and the evidence behind your choice.
        - Identify which sample is a worm and explain what separates it from a virus.
        - Identify any sample that is fileless or living-off-the-land and say why file scanning would miss it.
        - For one sample, list what you would check next (files, processes, network) to confirm the type.
        - Summarise which single behaviour was the strongest clue in each case.
      deliverable: A classification table mapping each sample to a malware family, the evidence, and the next check you would make.
    expected_outcome: >
      You can name the main malware families, match observed behaviour to a likely type, and explain
      why fileless and living-off-the-land malware evades simple file-based scanning.
    quiz:
      - prompt: What distinguishes a worm from a virus?
        options:
          - A worm spreads on its own across a network, while a virus needs an infected file to be run
          - A worm is always harmless
          - A virus only affects printers
          - There is no difference
        answer: 0
        explanation: A worm self-propagates with no user action; a virus spreads when someone runs the infected file.
      - prompt: Rapid encryption of many files followed by a ransom note is characteristic of
        options: [Spyware, Ransomware, A rootkit, A keylogger]
        answer: 1
        explanation: Mass file encryption plus a payment demand is the defining behaviour of ransomware.
      - prompt: Why is fileless or living-off-the-land malware hard to detect?
        options:
          - It is too large to run
          - It runs in memory or abuses trusted built-in tools, so there is no malicious file on disk to scan
          - It only runs on paper
          - It disables the network card
        answer: 1
        explanation: With no binary on disk, file-based antivirus has nothing to match; it must be caught by behaviour.
      - prompt: For an analyst, the main value of naming a malware family is that it
        options: [Changes the hostname, Tells you what behaviour to expect and what to check next, Deletes the alert, Encrypts the logs]
        answer: 1
        explanation: The family predicts the activity's shape, which guides what disk, process and network evidence to look for.
  - slug: sec-data-classification-protection
    title: Data Classification and Protection
    order: 7
    difficulty: beginner
    summary: Classify data by sensitivity and protect it across its states and lifecycle, so controls like encryption and loss prevention are applied where they actually matter.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.2", "secplus:4.6", "sc900:2", "secplus:4.2"]
    learning_objectives:
      - Classify data by sensitivity and explain why classification drives controls
      - Describe protecting data at rest, in transit and in use
      - Explain how data loss prevention and lifecycle handling reduce exposure
    theory: |
      You cannot protect everything equally, so protection starts with knowing what you hold.
      **Data classification** sorts information by sensitivity, for example public, internal,
      confidential and restricted, and that label decides the controls. A restricted customer
      database earns encryption, strict access and monitoring; a public brochure needs none of it.
      Classification also depends on **data types** with legal weight, such as personal data (PII),
      health records (PHI) and cardholder data, each carrying its own handling rules.

      Data has to be protected in three **states**. **At rest** it is protected by storage or disk
      encryption and access control. **In transit** it is protected by TLS so it cannot be read or
      altered on the wire. **In use**, while an application is processing it, is the hardest, and is
      where techniques like tokenisation and careful memory handling apply. The right control for a
      piece of data depends on its classification and which state it is in, which is why the label
      has to travel with the data.

      Two practices keep classified data from leaking. **Data loss prevention** (DLP) inspects email,
      uploads and endpoints for sensitive content leaving where it should not, blocking or alerting
      on a confidential file sent to a personal address. And **lifecycle handling** governs data from
      creation through retention to secure disposal, because data kept past its purpose is pure risk
      and sanitised media cannot leak. Over-classifying everything is its own failure, since if all
      data is restricted, people route around the controls, so classification has to be realistic to
      be followed.
    examples:
      - title: Classification drives the control
        body: |
          Public      marketing PDF        -> no encryption needed
          Internal    org chart            -> access control, no public share
          Restricted  customer PII export  -> encryption + DLP + access logging
      - title: One record, three states
        body: |
          At rest     customer row in an encrypted database
          In transit  same row returned over TLS to the app
          In use      app holds it in memory -> tokenise/mask before display or logs
    exercise:
      title: Classify a sample data set and map its protections
      environment: A sample set of files or records of mixed sensitivity (provided or invented) and a spreadsheet or document
      tools: [A sample data set, a spreadsheet or document, a reference classification scheme]
      steps:
        - Define a simple classification scheme (for example public, internal, confidential, restricted) with one sentence on what belongs in each.
        - Classify each sample file or record and note any that contain regulated data types such as PII or payment data.
        - For each classification, list the control you would apply at rest, in transit and in use.
        - Identify one piece of data that is over-classified or under-classified and correct it, explaining the impact of getting it wrong.
        - Write one DLP rule in plain language that would stop a restricted item leaving by email, and say what it should do on a match.
        - Define a retention and disposal rule for one data type and explain why keeping it longer increases risk.
      deliverable: A classification table for the sample data with per-state controls, one DLP rule, and a retention and disposal rule with its rationale.
    expected_outcome: >
      You can classify data by sensitivity, apply the right protection for its state, and use DLP and
      lifecycle handling to keep sensitive data from leaking, without over-classifying everything into
      unusability.
    quiz:
      - prompt: Why classify data before choosing controls?
        options:
          - To make storage cheaper
          - Because the sensitivity label decides which controls (encryption, access, monitoring) are warranted
          - To delete all data
          - Because every file needs the same protection
        answer: 1
        explanation: Classification matches the strength of controls to the sensitivity of the data instead of treating everything alike.
      - prompt: Which are the three states data must be protected in?
        options:
          - Hot, warm and cold
          - At rest, in transit and in use
          - Open, closed and archived
          - Local, remote and backup
        answer: 1
        explanation: Data at rest, in transit and in use each need different protections such as storage encryption, TLS and tokenisation.
      - prompt: Data loss prevention (DLP) primarily
        options:
          - Encrypts disks
          - Detects or blocks sensitive data leaving where it should not
          - Backs up data
          - Classifies CPUs
        answer: 1
        explanation: DLP inspects content in email, uploads and endpoints to stop sensitive data exfiltration.
      - prompt: Keeping data long past its purpose is a problem because
        options: [It speeds up queries, It is pure risk since data that no longer needs to exist can still leak, It improves classification, It is required by all laws]
        answer: 1
        explanation: Retained-but-unneeded data is exposure with no benefit, which is why lifecycle disposal matters.
  - slug: sec-physical-environmental
    title: Physical and Environmental Security
    order: 8
    difficulty: beginner
    summary: Cover the physical and environmental controls that protect systems and data, because an attacker with physical access or a failed facility can bypass every digital defence.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.2", "secplus:2.1", "sc900:1"]
    learning_objectives:
      - Explain why physical access can defeat digital controls
      - Describe layered physical controls and environmental protections
      - Identify physical and social routes an attacker uses to reach systems
    theory: |
      Security that stops at the network ignores the oldest attack of all: walking in. **Physical
      access** often defeats digital controls outright, an attacker at the keyboard can boot from USB,
      steal a drive, plug in a rogue device, or read a password on a sticky note. So physical security
      is a foundation the digital controls sit on, not an afterthought, and it follows the same
      **defence-in-depth** idea: layers that each slow an intruder and raise the chance of detection.

      Those layers run from the perimeter inward. **Deterrents** (fencing, lighting, signage) discourage
      casual intrusion; **access controls** (badges, locks, mantraps, biometric readers) decide who gets
      in; **surveillance** (cameras, guards, alarms) detects and records; and **zoning** keeps the most
      sensitive areas, a data centre or wiring closet, behind the strongest controls. A recurring weakness
      is **tailgating**, following an authorised person through a door, which badge systems alone do not
      stop, which is why mantraps and awareness matter.

      **Environmental** controls keep the facility itself from failing the systems. Data centres manage
      **power** (UPS and generators against outages), **cooling** (heat is the enemy of hardware),
      **fire suppression** suited to electronics, and **humidity**. The same thinking covers the
      disposal end: **media sanitisation** and secure destruction so a discarded disk does not leak data.
      Physical and social routes overlap, an attacker may impersonate a delivery driver or contractor to
      get inside, so physical security and security awareness reinforce each other. The lesson is that a
      strong firewall means little if someone can carry the server out of the building.
    examples:
      - title: Layered physical controls
        body: |
          Perimeter   fence + lighting            (deter)
          Entry       badge + mantrap             (prevent tailgating)
          Interior    camera + alarmed data hall  (detect + record)
          Each layer slows the intruder and adds a chance to catch them.
      - title: Physical access beating digital controls
        body: |
          Attacker at the device -> boot from USB / pull the drive / plant a keylogger
          Full-disk encryption + locked BIOS + port control raise that bar
          No network control stops someone already at the keyboard.
    exercise:
      title: Assess the physical and environmental security of a space
      environment: An office, home office or described facility, plus a notes template
      tools: [A space to assess (or a floor plan/description), a notes file, a reference control list]
      steps:
        - Walk (or map) the space from the perimeter inward and list the physical controls at each layer (deter, prevent, detect).
        - Identify the most sensitive area (where systems or data live) and judge whether its controls match its sensitivity.
        - Find one tailgating or social route an attacker could use to get past the entry controls.
        - Note the environmental protections present (power backup, cooling, fire, humidity) and one that is missing or weak.
        - Check how media and old equipment are disposed of and whether data could leak that way.
        - Recommend two improvements, one access-control and one environmental, with the risk each addresses.
      deliverable: A layered physical-security assessment of the space with one tailgating route, the environmental gaps, and two prioritised improvements with their risks.
    expected_outcome: >
      You can explain why physical access undermines digital security, assess layered physical and
      environmental controls, and spot the physical and social routes an attacker would use to reach
      systems and data.
    quiz:
      - prompt: Why is physical security foundational to digital security?
        options:
          - It is cheaper
          - An attacker with physical access can often bypass digital controls entirely
          - It replaces encryption
          - It only matters for data centres
        answer: 1
        explanation: Someone at the hardware can boot from USB, steal drives or plant devices, defeating network controls.
      - prompt: Tailgating is
        options:
          - A network attack
          - Following an authorised person through a controlled door
          - A type of firewall
          - A backup method
        answer: 1
        explanation: Tailgating slips past badge controls by following someone in, which mantraps and awareness address.
      - prompt: Which is an environmental control for a data centre?
        options: [A firewall rule, Uninterruptible power and cooling, A password policy, An antivirus scan]
        answer: 1
        explanation: Power backup, cooling, fire suppression and humidity control keep the facility from failing the hardware.
      - prompt: Secure media sanitisation matters because
        options:
          - It speeds up disks
          - A discarded or reused drive can leak data if not properly destroyed or wiped
          - It encrypts the network
          - It is only for paper
        answer: 1
        explanation: Data persists on media, so secure disposal prevents leakage from retired equipment.
  - slug: sec-authentication-passwordless
    title: Authentication Factors and Passwordless
    order: 9
    difficulty: beginner
    summary: Understand authentication factors, why passwords fail, and how MFA and passwordless methods such as FIDO2 raise the bar against the most common attacks.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:3", "secplus:2.4"]
    learning_objectives:
      - Distinguish the authentication factors and what each proves
      - Explain why passwords fail and how MFA mitigates it
      - Describe passwordless and phishing-resistant authentication such as FIDO2
    theory: |
      Authentication answers "are you who you claim to be", and it does so with **factors**: something you
      **know** (a password or PIN), something you **have** (a phone, token or security key), and something
      you **are** (a fingerprint or face). Strong authentication combines factors from different categories,
      because each covers the others' weakness, a stolen password is useless without the physical key, and
      a stolen phone is useless without the PIN. Using two of the *same* category (a password and a security
      question, both "know") is not true multi-factor.

      Passwords alone fail constantly, and understanding why motivates everything else. They are reused
      across sites, so one breach unlocks many accounts (**credential stuffing**); they are phished; and
      weak ones are guessed or cracked. **Multi-factor authentication** (MFA) is the single highest-impact
      control against account takeover because it breaks the attacker's usual path: knowing the password is
      no longer enough. But not all MFA is equal, SMS codes can be intercepted or SIM-swapped, and
      push-notification MFA is vulnerable to **MFA fatigue**, where an attacker spams approvals until a tired
      user taps yes.

      The direction of travel is **passwordless** and **phishing-resistant** authentication. **FIDO2** and
      passkeys use a cryptographic key pair bound to the device and the specific site, so there is no shared
      secret to phish and the credential simply will not work on a look-alike domain, defeating the
      phishing that beats even code-based MFA. For a learner this is the practical takeaway: authentication
      strength is a ladder, from a lone password at the bottom, through code and push MFA, up to
      phishing-resistant passkeys, and moving up the ladder is one of the most effective security
      investments an organisation can make.
    examples:
      - title: True multi-factor versus not
        body: |
          Password + security question  -> both "know"  -> NOT real MFA
          Password + phone push         -> know + have   -> MFA
          Passkey (device + biometric)  -> have + are    -> phishing-resistant
      - title: Why FIDO2 resists phishing
        body: |
          Code MFA on fake-bank.com: user types the code -> attacker relays it -> in
          Passkey on fake-bank.com:  key is bound to the REAL domain -> simply won't sign
          No shared secret to phish; the credential refuses the wrong site.
    exercise:
      title: Assess and strengthen authentication for a set of accounts
      environment: Your own accounts or a described scenario, plus a notes template
      tools: [A list of accounts/services, a notes file, a reference on MFA types]
      steps:
        - List several accounts and identify which authentication factors each currently uses.
        - For one password-only account, explain the specific attacks it is exposed to.
        - Identify an account using two factors of the same category and explain why that is not true MFA.
        - Rank the MFA methods in use (SMS, code app, push, passkey) from weakest to strongest and justify the order.
        - Pick one account and describe the move up the ladder you would make and the attack it defeats.
        - Explain how a passkey would behave if the user were lured to a look-alike login page.
      deliverable: An authentication assessment ranking the methods in use, one true-MFA correction, and one concrete upgrade with the attack it defeats.
    expected_outcome: >
      You can distinguish authentication factors, explain why passwords fail and how MFA mitigates it, and
      describe how passwordless, phishing-resistant methods like FIDO2 defeat the attacks that beat
      code-based MFA.
    quiz:
      - prompt: Which pair is true multi-factor authentication?
        options:
          - A password and a security question
          - A password and a phone-based security key
          - Two different passwords
          - A PIN and a memorable word
        answer: 1
        explanation: True MFA combines different categories; a password (know) plus a key (have) qualifies.
      - prompt: MFA is the highest-impact control against account takeover because it
        options:
          - Makes passwords longer
          - Means knowing the password alone is no longer enough to log in
          - Encrypts the network
          - Removes all logins
        answer: 1
        explanation: MFA breaks the attacker's usual path by requiring a second factor beyond the password.
      - prompt: MFA fatigue attacks target
        options: [SMS codes only, Push-notification MFA, by spamming approvals until a user taps yes, Passkeys, Hardware tokens]
        answer: 1
        explanation: Repeated push prompts can wear a user down into approving a fraudulent login.
      - prompt: FIDO2/passkeys resist phishing because the credential is
        options:
          - A longer password
          - A key pair bound to the real site, so it will not authenticate on a look-alike domain
          - Sent by SMS
          - Stored in email
        answer: 1
        explanation: With no shared secret and binding to the legitimate domain, a phishing site cannot use the passkey.
  - slug: sec-security-awareness-training
    title: Security Awareness and the Human Firewall
    order: 10
    difficulty: beginner
    summary: Understand why people are both the biggest attack surface and a powerful line of defence, and how awareness programs, phishing simulations and a reporting culture turn users into sensors.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.6", "secplus:2.2", "sc900:1"]
    learning_objectives:
      - Explain why the human layer is central to security outcomes
      - Describe what an effective security-awareness program contains
      - Build a reporting culture that turns users into a detection source
    theory: |
      Most breaches involve a person, a clicked link, a reused password, a wire sent on a convincing request,
      because attackers target people as the path of least resistance. That makes the **human layer** both the
      largest attack surface and, done right, a powerful line of defence. Technical controls stop a great deal,
      but they cannot catch everything, and the user is often the one who sees the suspicious email or the odd
      request first. Security awareness is the discipline of turning that human layer from a liability into a
      sensor, and it is a recognised security control in its own right, not a poster on the wall.

      An effective **awareness program** is specific and ongoing, not an annual slideshow. It teaches the
      threats people actually face, phishing and its variants, social engineering, safe handling of data,
      password and MFA hygiene, in short, relevant pieces rather than a once-a-year dump, and it is tailored to
      roles (finance staff face invoice fraud; developers face credential leaks). **Phishing simulations** are
      a core tool: sending realistic but safe test phishing to measure who clicks and to give immediate,
      non-punitive teaching when they do. The measure of success is behaviour change, fewer clicks, more
      reports, over time, which is why programs track metrics and repeat.

      The highest-value outcome is a **reporting culture**. A user who spots a phishing email and reports it
      gives the SOC an early warning that may protect everyone else, so the goal is to make reporting easy (a
      one-click button) and safe (never punishing someone who reports, even if they also clicked). A blame-free
      culture is essential: if people fear punishment they hide mistakes, and a hidden click is far more
      dangerous than a reported one. The lesson for an analyst is that users are part of the detection
      pipeline, every reported phish is a lead, and the organisations that defend best are the ones where
      people feel safe raising their hand the moment something looks wrong.
    examples:
      - title: The human layer, both ways
        body: |
          Liability: user clicks a phishing link -> foothold
          Sensor:    user reports a phishing email -> early warning for everyone
          Awareness turns the same person from the first into the second.
      - title: Blame-free reporting
        body: |
          User clicks AND reports it -> thank them, investigate fast, contain
          Punish the click -> next time they hide it -> far more dangerous
          Easy + safe reporting is the whole point.
    exercise:
      title: Design a security-awareness program and reporting flow
      environment: A described organisation (or your own context) and a document or template
      tools: [A document or template, a reference on common threats, a notes file]
      steps:
        - Explain why the human layer is both the biggest attack surface and a potential line of defence.
        - Outline an ongoing awareness program, the topics, the cadence, and how it is tailored to at least two roles.
        - Design a phishing-simulation approach and state what you would measure and how you would teach non-punitively.
        - Define the metrics that show the program is working (click rate, report rate over time).
        - Design an easy, safe reporting flow that feeds reported phishing to the SOC as leads.
        - Explain why a blame-free culture matters and what happens to detection if people fear punishment.
      deliverable: An awareness-program design with role-tailored topics and cadence, a phishing-simulation and metrics plan, a reporting flow into the SOC, and the rationale for a blame-free culture.
    expected_outcome: >
      You can explain why the human layer is central to security, design an ongoing awareness program with
      simulations and metrics, and build a blame-free reporting culture that turns users into an early
      detection source.
    quiz:
      - prompt: Why is the human layer central to security outcomes?
        options:
          - People never make mistakes
          - Attackers target people as the path of least resistance, and users often see threats first
          - Humans are irrelevant to breaches
          - Only technology matters
        answer: 1
        explanation: Most breaches involve a person, so the human layer is both the main target and a key defence.
      - prompt: An effective awareness program is
        options:
          - A single annual slideshow
          - Ongoing, relevant and tailored to the threats different roles actually face
          - Only for executives
          - A one-time poster
        answer: 1
        explanation: Awareness works when it is continuous, relevant and role-specific, not a yearly formality.
      - prompt: A blame-free reporting culture matters because
        options:
          - It avoids all training
          - If people fear punishment they hide mistakes, and a hidden click is more dangerous than a reported one
          - It punishes clicks
          - It removes the SOC
        answer: 1
        explanation: Safe reporting surfaces incidents early; fear drives them underground where they do more harm.
      - prompt: A reported phishing email is valuable to the SOC because it
        options:
          - Wastes time
          - Is an early warning that may protect everyone else who received it
          - Must be ignored
          - Cannot be investigated
        answer: 1
        explanation: User reports act as early detection, letting the SOC contain a campaign before it spreads.
  - slug: sec-authorization-models
    title: Authorization Models and Least Privilege
    order: 11
    difficulty: beginner
    summary: Understand how systems decide what an authenticated user may do, discretionary, role-based and attribute-based access control, and why least privilege underpins them all.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:3", "secplus:3.1"]
    learning_objectives:
      - Distinguish authentication from authorization
      - Compare discretionary, role-based and attribute-based access control
      - Apply least privilege and separation of duties to a real scenario
    theory: |
      Authentication proves who you are; **authorization** decides what you are allowed to do once you are in,
      and keeping the two ideas separate is the starting point. A system can know perfectly well who a user is
      and still need a clear, consistent way to decide whether they may read this file, approve that payment,
      or change a setting. Authorization models are the different schemes for making that decision at scale,
      and choosing and configuring one well is central to limiting what a compromised or malicious account can
      do.

      Three models are common. **Discretionary access control** (DAC) lets the owner of a resource decide who
      may access it, flexible but inconsistent, since control is spread across many individual owners.
      **Role-based access control** (RBAC) assigns permissions to **roles** (such as "finance clerk" or
      "server administrator") and assigns users to roles, so access is granted by job function rather than
      per person, which scales well and is the workhorse of most organisations. **Attribute-based access
      control** (ABAC) decides dynamically from attributes of the user, resource and context (department, data
      classification, time of day, device), which is the most granular and powerful but more complex to manage.
      Most real environments use RBAC as the backbone with some ABAC for fine-grained cases.

      Underpinning every model are two principles. **Least privilege** means granting each user, role or
      process only the access it genuinely needs and no more, so that a compromised account or an insider can
      reach only a limited blast radius. **Separation of duties** splits a sensitive action across more than
      one person so no single account can complete it alone (the person who requests a payment cannot also
      approve it), which limits both fraud and the damage of one stolen credential. Over time, access tends to
      accumulate, people change roles but keep old permissions, so **access reviews** periodically prune this
      "privilege creep". For the analyst, the practical lesson is that well-designed authorization is what
      makes a stolen credential a contained problem rather than a catastrophe, and over-permissioned accounts
      are a risk to watch for.
    examples:
      - title: Three models at a glance
        body: |
          DAC   owner decides (flexible, inconsistent)
          RBAC  permissions -> roles -> users (scales by job function)
          ABAC  decide from attributes (user/resource/context) (granular, complex)
          Most orgs: RBAC backbone + some ABAC.
      - title: Separation of duties
        body: |
          requester of a payment  != approver of a payment
          one stolen account cannot complete the action alone
          limits both fraud and the blast radius of a compromise.
    exercise:
      title: Design authorization for a scenario
      environment: A described organisation with several roles and sensitive actions, plus a document
      tools: [A document or template, a scenario with roles and resources, a notes file]
      steps:
        - Explain the difference between authentication and authorization with an example.
        - For the scenario, choose an authorization model (or mix) and justify it against the organisation's needs.
        - Define two or three roles with the least-privilege permissions each genuinely needs.
        - Identify one sensitive action and apply separation of duties so no single account can complete it alone.
        - Describe how an attribute (such as data classification or device) could refine access with ABAC.
        - Explain how privilege creep happens and how an access review would catch it.
      deliverable: An authorization design naming the model, least-privilege roles, a separation-of-duties control on a sensitive action, one ABAC refinement, and an access-review approach to privilege creep.
    expected_outcome: >
      You can distinguish authentication from authorization, compare DAC, RBAC and ABAC, and apply least
      privilege and separation of duties so that a compromised account has a limited blast radius.
    quiz:
      - prompt: Authorization (as opposed to authentication) decides
        options:
          - Who a user claims to be
          - What an authenticated user is allowed to do
          - How fast the network is
          - Which password to use
        answer: 1
        explanation: Authentication proves identity; authorization governs what that identity may do.
      - prompt: Role-based access control grants permissions by
        options:
          - Each resource owner's discretion
          - Job function, assigning permissions to roles and users to roles
          - Random assignment
          - Time of day only
        answer: 1
        explanation: RBAC ties permissions to roles and users to those roles, scaling by job function.
      - prompt: Least privilege means
        options:
          - Giving everyone admin to be safe
          - Granting only the access genuinely needed, so a compromise has a limited blast radius
          - Removing all access
          - Sharing one account
        answer: 1
        explanation: Minimal necessary access limits what any compromised or malicious account can reach.
      - prompt: Separation of duties limits fraud and credential misuse by
        options:
          - Using longer passwords
          - Splitting a sensitive action so no single account can complete it alone
          - Disabling logging
          - Granting more roles
        answer: 1
        explanation: Requiring more than one party for a sensitive action stops a single account from completing it.
  - slug: sec-control-types
    title: Security Control Types and Functions
    order: 12
    difficulty: beginner
    summary: Classify security controls by how they are implemented (technical, administrative, physical) and what they do (preventive, detective, corrective and more), a vocabulary that underpins how defences are designed and assessed.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.1", "secplus:5.1", "sc900:1"]
    learning_objectives:
      - Classify controls by category (technical, administrative, physical)
      - Classify controls by function (preventive, detective, corrective, and others)
      - Use the taxonomy to find gaps and design balanced defences
    theory: |
      Security professionals need a shared vocabulary for the defences they deploy, and that vocabulary is the
      classification of **security controls** along two axes: how a control is implemented and what it does.
      Getting fluent in it matters because it is how defences are designed, discussed and assessed, and it is
      how you spot that a system is strong in one dimension and dangerously weak in another.

      The first axis is **category**, how the control is implemented. **Technical** (or logical) controls are
      enforced by technology: firewalls, encryption, access control lists, antivirus. **Administrative** (or
      managerial) controls are policies, procedures and processes: security policies, training, background
      checks, change management. **Physical** controls protect the tangible world: locks, fences, guards,
      cameras. A sound program uses all three, because a brilliant technical control is undone by an
      administrative gap (no process to review access) or a physical one (anyone can walk in and take the
      server).

      The second axis is **function**, what the control does relative to an incident. **Preventive** controls
      stop an incident before it happens (a firewall blocking traffic, a lock). **Detective** controls identify
      that something happened (IDS alerts, log monitoring, cameras). **Corrective** controls fix or limit damage
      after the fact (restoring from backup, patching the exploited flaw). The model also names **deterrent**
      controls (discouraging an attacker, like warning signs), **compensating** controls (an alternative when
      the primary control is not feasible), and **directive** controls (instructing behaviour, like a policy).
      The practical power of the taxonomy is in finding **gaps**: a system with strong preventive controls but
      no detective ones will be breached silently, and one with detection but no corrective capability will see
      the attack but not recover. Mapping your controls across both axes reveals where you are over- and
      under-invested, which is exactly how a defender turns a pile of tools into a balanced, layered defence.
    examples:
      - title: Two axes of classification
        body: |
          category:  technical (firewall) | administrative (policy) | physical (lock)
          function:  preventive (block) | detective (alert) | corrective (restore)
                     + deterrent, compensating, directive
          every control has one of each.
      - title: Finding a gap with the taxonomy
        body: |
          strong preventive, NO detective -> breached silently (never notice)
          detective, NO corrective        -> see the attack, can't recover
          mapping both axes reveals where you're under-invested.
    exercise:
      title: Classify controls and find the gaps
      environment: A described environment with a set of existing controls (or your own context) and a document or spreadsheet
      tools: [A list of controls, a spreadsheet or document, a notes file]
      steps:
        - For several existing controls, classify each by category (technical, administrative, physical).
        - Classify each by function (preventive, detective, corrective, or another type) and explain the choice.
        - Give an example of a control that is strong technically but undermined by a missing administrative or physical control.
        - Map the controls across both axes and identify where the environment is over-invested and where it has a gap.
        - For one gap (such as no detective controls for a critical asset), recommend a control to fill it.
        - Explain how a compensating control would be used when a primary control is not feasible.
      deliverable: A control inventory classified on both axes, an identified gap with a recommended control to fill it, and an example of a compensating control.
    expected_outcome: >
      You can classify security controls by category and function, use the taxonomy to find where defences are
      over- or under-invested, and design a balanced mix of preventive, detective and corrective controls
      across technical, administrative and physical categories.
    quiz:
      - prompt: A firewall is which category of control?
        options: [Administrative, Technical (logical), Physical, Directive]
        answer: 1
        explanation: A firewall is enforced by technology, making it a technical/logical control.
      - prompt: Detective controls
        options:
          - Stop an incident before it happens
          - Identify that something happened (such as IDS alerts or log monitoring)
          - Restore from backup
          - Discourage attackers
        answer: 1
        explanation: Detective controls reveal that an event occurred, as opposed to preventing or correcting it.
      - prompt: A system with strong preventive but no detective controls will
        options:
          - Be perfectly secure
          - Tend to be breached silently, because nothing reveals a successful attack
          - Recover automatically
          - Need no further controls
        answer: 1
        explanation: Without detection, a successful breach goes unnoticed, which is why both functions are needed.
      - prompt: A compensating control is
        options:
          - A control that never works
          - An alternative control used when the primary control is not feasible
          - A physical lock only
          - A type of malware
        answer: 1
        explanation: Compensating controls provide equivalent protection when the preferred control cannot be implemented.
  - slug: sec-cryptographic-solutions
    title: Choosing the Right Cryptographic Solution
    order: 13
    difficulty: intermediate
    summary: Go beyond crypto basics to choose the right tool for each goal, whether symmetric versus asymmetric, hashing versus encryption, or protecting data at rest, in transit and in use.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.4", "secplus:4.1", "sc900:3"]
    learning_objectives:
      - Match a cryptographic tool to the security goal it achieves
      - Distinguish confidentiality, integrity and authenticity and the primitives behind each
      - Explain how data is protected at rest, in transit and in use
    theory: |
      Cryptography is not one thing but a toolbox, and the common mistake is reaching for the wrong tool. The
      first question is always **what goal** you are trying to achieve. For **confidentiality** (keeping data
      secret) you use **encryption**: symmetric encryption like AES when the same party or a shared key protects
      bulk data, and asymmetric encryption like RSA or elliptic-curve when two parties who do not share a secret
      need to communicate, typically to exchange a symmetric key. For **integrity** (proving data has not
      changed) you use a **hash** such as SHA-256, which is one-way and not encryption at all. For **authenticity
      and non-repudiation** (proving who sent something) you use **digital signatures**, which combine hashing
      with the sender's private key so anyone can verify with the public key.

      These primitives combine into the solutions seen every day. **TLS** uses asymmetric cryptography to
      authenticate the server and agree a key, then symmetric encryption for speed on the bulk traffic.
      **Password storage** never uses reversible encryption; it uses a slow, salted hash (bcrypt, Argon2) so a
      stolen database cannot be reversed. **Code signing** and **document signing** use digital signatures so a
      recipient can trust origin and integrity. Recognising which goal each solution serves is what lets an
      analyst or architect judge whether a design is sound: encrypting a password database, for instance, is a
      red flag because the goal there is one-way verification, not recoverable secrecy.

      Finally, data must be protected in three **states**, and each needs a different approach. **At rest** (on
      disk) is protected by full-disk or database encryption and good key management. **In transit** (on the
      network) is protected by TLS or a VPN. **In use** (in memory, being processed) is the hardest and uses
      newer techniques like confidential computing and enclaves. Key management underpins all of it: the strength
      of any cryptosystem rests on keys being generated well, stored safely (often in an HSM), rotated, and
      destroyed when retired, because a leaked key defeats even perfect algorithms.
    examples:
      - title: Goal -> tool
        body: |
          confidentiality -> encryption (AES symmetric / RSA-ECC asymmetric)
          integrity        -> hash (SHA-256, one-way, NOT encryption)
          authenticity     -> digital signature (hash + private key, verify with public)
          password storage -> slow salted hash (bcrypt/Argon2), never reversible encryption.
      - title: Three states of data
        body: |
          at rest    -> full-disk/database encryption + key management
          in transit -> TLS / VPN
          in use     -> confidential computing / enclaves (hardest)
          keys underpin all: generate well, store in HSM, rotate, destroy.
    exercise:
      title: Pick cryptographic solutions for a set of goals
      environment: A list of described security goals and a system to protect (or a scenario)
      tools: [A scenario, a document, a notes file]
      steps:
        - For a goal of keeping a file secret between two parties with no shared key, choose the primitive and explain why.
        - For a goal of proving a downloaded file was not altered, choose the primitive and explain why.
        - For a goal of proving who signed a document, choose the primitive and explain why.
        - Explain why a password database must use a salted slow hash and not reversible encryption.
        - Map a described system's data to the three states and name the protection for each.
        - Identify one weak choice in a described design (for example encrypting passwords) and correct it.
      deliverable: A goal-to-primitive mapping for several goals, a three-states protection plan for one system, and a corrected weak cryptographic choice with justification.
    expected_outcome: >
      You can match cryptographic primitives to confidentiality, integrity and authenticity goals, explain how
      data is protected at rest, in transit and in use, and spot a design that uses the wrong cryptographic tool.
    quiz:
      - prompt: To prove a downloaded file has not been altered you would use
        options:
          - Symmetric encryption
          - A cryptographic hash such as SHA-256
          - A longer password
          - A firewall rule
        answer: 1
        explanation: A hash provides integrity; comparing hashes shows whether the file changed.
      - prompt: Passwords should be stored using
        options:
          - Reversible AES encryption
          - A salted, slow hash such as bcrypt or Argon2
          - Plain text for speed
          - A digital certificate
        answer: 1
        explanation: Password verification needs a one-way salted slow hash, not recoverable encryption.
      - prompt: TLS uses asymmetric cryptography mainly to
        options:
          - Encrypt all bulk traffic because it is faster
          - Authenticate the server and agree a symmetric key, which then protects the bulk traffic
          - Store passwords
          - Replace hashing
        answer: 1
        explanation: Asymmetric crypto authenticates and exchanges a key; symmetric crypto then handles bulk data for speed.
      - prompt: Protecting data in use (being processed in memory) is addressed by
        options:
          - Full-disk encryption
          - TLS
          - Confidential computing and enclaves
          - Longer hashes
        answer: 2
        explanation: Data in use is protected by techniques like confidential computing; disk encryption and TLS cover rest and transit.
  - slug: sec-mobile-byod
    title: Mobile Device and BYOD Security
    order: 14
    difficulty: beginner
    summary: Understand the security challenges of mobile devices and bring-your-own-device programmes, the deployment models, and how mobile device management enforces policy without owning the device.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.1", "sc900:3"]
    learning_objectives:
      - Explain the security risks specific to mobile devices
      - Compare BYOD, corporate-owned and other deployment models
      - Describe how MDM and containerisation enforce policy and protect data
    theory: |
      Mobile devices are now primary work tools, and they break the assumptions of traditional endpoint security:
      they leave the office, join untrusted networks, mix personal and work data, and are easily lost or stolen.
      The core risks follow from this. **Loss and theft** put data at physical risk, so encryption and remote wipe
      matter. **Untrusted networks and apps** expose devices to interception and malicious software. **Mixing
      personal and work data** on one device creates privacy and data-leakage tension, especially when the device
      belongs to the employee. And mobile platforms have their own threats, from malicious apps to
      jailbreaking/rooting that removes built-in protections.

      Organisations choose a **deployment model** that trades control against convenience and cost. **BYOD** (bring
      your own device) lets employees use personal devices, which is cheap and popular but gives the organisation
      the least control and the most privacy tension. **COPE** (corporate-owned, personally enabled) gives staff a
      company device they may also use personally, balancing control with usability. **COBO** (corporate-owned,
      business only) maximises control for sensitive roles. **CYOD** (choose your own device) lets staff pick from
      an approved, managed list. The right model depends on the sensitivity of the data and the organisation's
      risk tolerance, and the choice drives everything else about how the devices are secured.

      The enforcement technology is **mobile device management (MDM)**, now often part of broader unified endpoint
      management. MDM lets the organisation push policy to enrolled devices: require a passcode and encryption,
      restrict risky settings, deploy and update managed apps, and remotely lock or wipe a lost device. For BYOD,
      the key technique is **containerisation**, keeping work data in a managed, encrypted container separate from
      personal data, so the organisation can wipe only the work container without touching the employee's photos
      and messages, resolving much of the privacy tension. For the analyst and architect, the goal is to enforce
      the security baseline (encryption, authentication, patch level, no jailbreak) and protect corporate data
      regardless of who owns the hardware, while respecting the personal boundary that BYOD inevitably creates.
    examples:
      - title: Deployment models
        body: |
          BYOD  -> personal device, least org control, most privacy tension (cheap, popular)
          COPE  -> company device, personal use allowed (balanced)
          COBO  -> company device, business only (max control, sensitive roles)
          CYOD  -> pick from an approved managed list
      - title: MDM + containerisation
        body: |
          MDM: push policy (passcode, encryption, managed apps, remote lock/wipe)
          BYOD container: work data in a managed encrypted container, separate from personal
          -> wipe only the work container; employee's personal data untouched.
    exercise:
      title: Design a mobile security approach
      environment: A described organisation with roles of differing data sensitivity (or a scenario)
      tools: [A scenario, a mobile-policy template, a document, a notes file]
      steps:
        - List the security risks that make mobile devices different from fixed endpoints.
        - Recommend a deployment model for a general workforce and justify the control-versus-privacy trade-off.
        - Recommend a different model for a role handling highly sensitive data and say why.
        - Describe the baseline policy MDM should enforce (passcode, encryption, patch level, no jailbreak).
        - Explain how containerisation resolves the privacy tension in a BYOD programme.
        - State what should happen to corporate data when a BYOD device is lost or the employee leaves.
      deliverable: A mobile security approach with deployment-model choices for two role types, an MDM baseline policy, and a BYOD data-protection and offboarding plan.
    expected_outcome: >
      You can explain mobile-specific risks, compare BYOD, COPE, COBO and CYOD, and describe how MDM and
      containerisation enforce a security baseline and protect corporate data while respecting personal privacy.
    quiz:
      - prompt: Compared with corporate-owned models, BYOD gives the organisation
        options:
          - More control over the device
          - The least control and the most privacy tension, since the device is the employee's
          - No security options at all
          - Full ownership of personal data
        answer: 1
        explanation: BYOD trades control and privacy for cost and convenience; the device belongs to the employee.
      - prompt: Containerisation on a BYOD device lets the organisation
        options:
          - Read the employee's personal photos
          - Keep work data in a managed, encrypted container that can be wiped without touching personal data
          - Prevent all personal use
          - Avoid any policy
        answer: 1
        explanation: A separate work container can be wiped alone, protecting corporate data and personal privacy.
      - prompt: A primary mobile risk that drives encryption and remote wipe is
        options:
          - Devices never leave the office
          - Loss or theft, which puts data at physical risk
          - They cannot run apps
          - They have no network
        answer: 1
        explanation: Mobile devices are easily lost or stolen, so encryption and remote wipe protect the data.
      - prompt: Mobile device management (MDM) primarily lets an organisation
        options:
          - Replace the device hardware
          - Push and enforce policy (passcode, encryption, managed apps, remote lock/wipe) on enrolled devices
          - Choose the employee's personal apps
          - Disable the cellular network
        answer: 1
        explanation: MDM enforces the security baseline and can lock or wipe enrolled devices remotely.
  - slug: sec-virtualization-security
    title: Virtualization and Hypervisor Security
    order: 15
    difficulty: intermediate
    summary: Understand how virtualization works, the security benefits and new risks it introduces, and how to protect the hypervisor, virtual machines and their management plane.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:2.5", "sc900:1"]
    learning_objectives:
      - Explain how virtualization and hypervisors work
      - Describe the security benefits and the new risks virtualization introduces
      - Recommend controls for the hypervisor, VMs and management plane
    theory: |
      Virtualization underpins almost all modern infrastructure, including the cloud, so understanding its
      security model is foundational. A **hypervisor** runs multiple **virtual machines (VMs)** on one physical
      host, giving each VM its own virtual hardware while sharing the real hardware underneath. There are two
      broad types: a **type 1** (bare-metal) hypervisor runs directly on the hardware and is used in data centres
      and cloud, while a **type 2** hypervisor runs as an application on a host operating system. The hypervisor's
      job is to keep VMs **isolated** from each other and to mediate their access to shared resources, and that
      isolation is the security property everything else depends on.

      Virtualization brings real security **benefits**: strong isolation between workloads, easy snapshots and
      rollback (useful for recovery and for malware analysis in disposable VMs), rapid rebuilding of compromised
      systems from known-good images, and consolidation that can simplify patching. But it also introduces **new
      risks**. **VM escape**, where an attacker breaks out of a VM to the hypervisor or other VMs, is the most
      serious because it defeats the core isolation guarantee, though it is rare and usually requires a hypervisor
      vulnerability. **VM sprawl** creates many unmanaged, unpatched VMs that become weak points. Snapshots can
      capture and later restore sensitive data or roll a system back to a vulnerable state. And crucially, the
      **management plane**, the console or API that controls all VMs, becomes an extremely high-value target: an
      attacker who controls it controls every VM at once.

      The controls therefore focus on the layers virtualization adds. **Harden and patch the hypervisor**
      diligently, because a flaw there threatens every VM on it. **Protect the management plane** with strong
      authentication, least privilege and network isolation, treating it as tier-zero infrastructure. **Manage VM
      lifecycle** to avoid sprawl, with inventory, patching and decommissioning. **Segment** VMs of different
      trust levels so that compromising one does not expose others, rather than relying on the hypervisor alone.
      And handle snapshots and images as sensitive assets. For the analyst, the lesson is that virtualization does
      not remove security concerns but relocates and adds to them: the host, the hypervisor and especially the
      management plane are now part of the attack surface, and the same isolation that protects workloads becomes
      a single point of catastrophic failure if the layer beneath it is breached.
    examples:
      - title: The model
        body: |
          hypervisor runs many VMs on one host; each VM gets virtual hardware
          type 1 (bare-metal, data centre/cloud) vs type 2 (app on a host OS)
          core security property: ISOLATION between VMs.
      - title: New risks and where to focus
        body: |
          VM escape -> break isolation to hypervisor/other VMs (rare, needs a flaw) = worst case
          VM sprawl -> unmanaged unpatched VMs; snapshots can restore vulnerable/sensitive state
          management plane controls ALL VMs -> tier-zero target
          -> patch hypervisor, lock down management plane, manage VM lifecycle, segment by trust.
    exercise:
      title: Secure a virtualized environment
      environment: A described virtualization deployment (or a scenario)
      tools: [A scenario, an architecture notes file, a document]
      steps:
        - Explain how a hypervisor runs VMs and what isolation guarantee it provides.
        - Distinguish type 1 and type 2 hypervisors and where each is used.
        - Describe two security benefits virtualization provides.
        - Describe VM escape and VM sprawl and why each is a concern.
        - Explain why the management plane is a tier-zero target and how to protect it.
        - Recommend three controls covering the hypervisor, VM lifecycle and segmentation.
      deliverable: A virtualization security plan covering the isolation model, benefits, VM escape and sprawl risks, management-plane protection, and three concrete controls.
    expected_outcome: >
      You can explain virtualization and hypervisors, the benefits and new risks they bring, and recommend
      controls for the hypervisor, VM lifecycle, segmentation and especially the management plane.
    quiz:
      - prompt: The core security property a hypervisor must provide is
        options:
          - Faster graphics
          - Isolation between the virtual machines it runs
          - Unlimited storage
          - Automatic encryption of all data
        answer: 1
        explanation: VMs depend on the hypervisor keeping them isolated from one another.
      - prompt: VM escape is the most serious virtualization risk because it
        options:
          - Slows the host
          - Breaks the isolation guarantee, letting an attacker reach the hypervisor or other VMs
          - Fills the disk
          - Only affects type 2 hypervisors
        answer: 1
        explanation: Escaping a VM defeats the fundamental isolation that all other security relies on.
      - prompt: The virtualization management plane deserves tier-zero protection because
        options:
          - It is rarely used
          - Controlling it means controlling every VM at once
          - It has no network access
          - It stores no credentials
        answer: 1
        explanation: The console or API that governs all VMs is a single point of total compromise.
      - prompt: A good control against VM sprawl is
        options:
          - Creating as many VMs as possible
          - Lifecycle management with inventory, patching and decommissioning of VMs
          - Disabling the hypervisor
          - Never taking snapshots
        answer: 1
        explanation: Tracking, patching and retiring VMs prevents unmanaged, vulnerable machines accumulating.
  - slug: sec-iot-ot-embedded
    title: Securing IoT, OT and Embedded Systems
    order: 16
    difficulty: intermediate
    summary: Understand why Internet of Things, operational technology and embedded devices are hard to secure, the risks they carry, and the compensating controls that protect them when patching is not an option.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:2.5", "sc900:1"]
    learning_objectives:
      - Explain why IoT, OT and embedded devices resist traditional security
      - Describe the risks these devices introduce
      - Apply compensating controls where patching and agents are impossible
    theory: |
      A growing share of the devices on networks are not general-purpose computers but **IoT** (smart cameras,
      sensors, building systems), **OT** (operational technology running physical processes in factories,
      utilities and hospitals) and **embedded** systems (purpose-built computers inside other equipment). They
      share traits that make traditional security hard: they often cannot run an endpoint agent, are rarely or
      never patched, ship with default or hard-coded credentials, run old and unsupported software, and may stay
      in service for a decade or more. Worse, OT historically prioritised **availability and safety** over
      confidentiality, so systems were designed to run continuously and were never meant to be exposed to normal
      IT threats, yet many are now connected.

      The **risks** are both familiar and distinctive. These devices expand the attack surface with poorly secured
      endpoints that are hard to see and harder to fix, and a compromised camera or sensor can be a foothold or a
      botnet recruit. What makes OT especially serious is that an attack can have **physical consequences**:
      stopping a production line, manipulating a safety system, or disrupting critical infrastructure, so the
      impact is not just data loss but potential safety and continuity failures. The convergence of IT and OT
      networks means an intrusion that starts in email can, without proper separation, reach systems that control
      physical processes, which is the scenario that keeps critical-infrastructure defenders awake.

      Because you often **cannot** apply the usual controls (patch promptly, install an agent, change a hard-coded
      password), the strategy shifts to **compensating controls** built around the device. The most important is
      **network segmentation and isolation**: put these devices on separate, tightly controlled network segments
      so they cannot be reached from, or reach into, the general network, and so OT is strongly separated from IT.
      **Monitoring** their network traffic (since you cannot put an agent on them) detects anomalies, and
      specialised OT monitoring understands industrial protocols. **Strict access control** limits who and what
      can communicate with them, and robust **asset inventory** is foundational because you cannot protect devices
      you do not know exist. For the architect and analyst, the mindset is to accept that the device itself may be
      unfixable and to wrap it in controls that limit exposure and detect abuse, while treating OT with extra care
      because the stakes include physical safety, not just information.
    examples:
      - title: Why they are hard to secure
        body: |
          can't run an agent; rarely/never patched; default or hard-coded creds; old unsupported software; 10+ year life
          OT historically prioritised availability + safety over confidentiality, never meant for IT threats.
      - title: Strategy shifts to compensating controls
        body: |
          can't patch/agent/change creds -> wrap the device instead:
          segment + isolate (separate OT from IT), monitor NETWORK traffic (industrial-protocol aware),
          strict access control, solid asset inventory (can't protect what you don't know exists).
    exercise:
      title: Protect IoT and OT devices with compensating controls
      environment: A described environment with IoT or OT devices (or a scenario)
      tools: [A scenario, an architecture notes file, a document]
      steps:
        - Explain three traits that make IoT, OT or embedded devices resist traditional security.
        - Explain why OT attacks can have physical consequences that IT attacks usually do not.
        - Explain the risk of converged IT and OT networks.
        - Recommend a segmentation and isolation approach for the described devices.
        - Explain why network monitoring and asset inventory are especially important here.
        - Identify one control you would apply because patching the device is not possible.
      deliverable: A protection plan for IoT or OT devices covering why they resist normal controls, the physical-impact risk, a segmentation approach, monitoring and inventory, and a compensating control for the unpatchable device.
    expected_outcome: >
      You can explain why IoT, OT and embedded devices resist traditional security, the risks (including physical
      impact) they carry, and the segmentation, monitoring and inventory controls that protect them when patching
      is impossible.
    quiz:
      - prompt: A reason IoT and OT devices resist traditional security is that they
        options:
          - Patch themselves automatically
          - Often cannot run an agent, are rarely patched, and ship with default or hard-coded credentials
          - Have no network connection
          - Are replaced every month
        answer: 1
        explanation: These devices typically cannot be patched or agent-managed and ship with weak defaults.
      - prompt: OT security is especially serious because an attack can
        options:
          - Only leak documents
          - Have physical consequences, disrupting processes or safety systems
          - Never affect anything
          - Only slow email
        answer: 1
        explanation: OT controls physical processes, so compromise can cause safety and continuity failures.
      - prompt: When a device cannot be patched or run an agent, the primary strategy is
        options:
          - Ignore it
          - Wrap it in compensating controls such as segmentation, isolation and network monitoring
          - Connect it directly to the internet
          - Give it admin rights everywhere
        answer: 1
        explanation: Unfixable devices are protected by isolating and monitoring them rather than hardening the device.
      - prompt: Asset inventory is foundational for IoT/OT security because
        options:
          - It speeds up the devices
          - You cannot protect or segment devices you do not know exist
          - It replaces segmentation
          - It encrypts the devices
        answer: 1
        explanation: Unknown devices cannot be segmented, monitored or controlled, so inventory comes first.
  - slug: sec-deception-honeypots
    title: Deception Technology, Honeypots and Honeytokens
    order: 17
    difficulty: intermediate
    summary: Understand how deception turns the tables on attackers using honeypots, honeytokens and decoys that are valuable precisely because any interaction with them is suspicious.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.2", "secplus:4.4", "cysa:1.4"]
    learning_objectives:
      - Explain the principle behind deception technology
      - Describe honeypots, honeytokens and decoys and their uses
      - Explain why deception produces high-fidelity, low-noise alerts
    theory: |
      Most detection tries to pick malicious activity out of a flood of legitimate activity, which is inherently
      noisy. **Deception technology** takes a cleverly different approach: it plants things that have **no
      legitimate purpose**, so that any interaction with them is, by definition, suspicious. This flips the
      signal-to-noise problem on its head. A **honeypot** is a decoy system designed to look like an attractive
      target (a server, a database, an exposed service) but that no real user or process should ever touch; when
      an attacker probes or compromises it, the interaction itself is the alert, with almost no false positives.
      Because the honeypot has no production role, a connection to it is not ambiguous the way a connection to a
      real server is.

      Deception comes in several forms suited to different places. **Honeypots** range from low-interaction
      (simulated services that just record probes) to high-interaction (real systems that let an attacker engage,
      yielding rich intelligence about their techniques at the cost of more risk and management). **Honeytokens**
      are the same idea applied to data and credentials: a fake set of credentials, a decoy document, a bogus API
      key, or a planted database record that is monitored, so that if it is ever used or accessed, you know
      someone is somewhere they should not be, often catching an attacker who has already gotten inside and is
      looting. **Decoys** scattered through the real environment, fake file shares, fake accounts, fake network
      services, act as tripwires for lateral movement, because an attacker exploring the network cannot tell the
      decoys from the real assets and will eventually touch one. Modern deception platforms automate spreading
      such breadcrumbs widely.

      The great value of deception is **fidelity**: its alerts are high-confidence and low-noise because
      legitimate users have no reason to touch a decoy, so a honeypot or honeytoken alert is worth investigating
      immediately in a way an ordinary alert often is not. Deception is also especially good at catching attackers
      who are already **inside**, during the reconnaissance and lateral-movement phases that are otherwise hard to
      detect, and at gathering intelligence on attacker behaviour. Its limits are that it is a complement, not a
      replacement, for primary defences (an attacker might avoid the decoys), it needs careful placement and
      believability to be effective, and high-interaction honeypots carry risk if not isolated. For the analyst
      and architect, deception is a high-leverage addition to a mature programme: cheap to alert on, strong for
      detecting insiders and lateral movement, and valuable for understanding adversaries, precisely because it
      exploits the one thing attackers cannot know, which of the things they find are real and which are traps.
    examples:
      - title: The core principle
        body: |
          normal detection: pick malice out of a flood of legitimate activity (noisy)
          deception: plant things with NO legitimate purpose -> ANY interaction is suspicious by definition
          honeypot touched = the interaction itself is the alert, almost no false positives.
      - title: The forms
        body: |
          honeypots: low-interaction (record probes) to high-interaction (real systems -> rich intel, more risk)
          honeytokens: fake creds/documents/API keys/records monitored -> use = someone is where they shouldn't be
          decoys: fake shares/accounts/services as tripwires for lateral movement.
    exercise:
      title: Design a deception layer
      environment: A described environment where you want earlier, higher-fidelity detection (or a scenario)
      tools: [A scenario, an architecture notes file, a document]
      steps:
        - Explain the principle that makes deception high-fidelity and low-noise.
        - Describe the difference between low- and high-interaction honeypots and their trade-offs.
        - Give two examples of honeytokens and what each would reveal if triggered.
        - Explain how decoys act as tripwires for lateral movement.
        - Explain why deception is especially good at catching attackers already inside.
        - State one limitation and why deception complements rather than replaces primary defences.
      deliverable: A deception design placing honeypots, honeytokens and decoys, explaining the fidelity benefit, the insider/lateral-movement strength, and one limitation.
    expected_outcome: >
      You can explain the principle of deception technology, describe honeypots, honeytokens and decoys, and
      explain why deception produces high-fidelity alerts that are especially effective against insiders and lateral movement.
    quiz:
      - prompt: Deception technology produces high-fidelity alerts because
        options:
          - It inspects all traffic
          - The decoys have no legitimate purpose, so any interaction with them is suspicious by definition
          - It uses machine learning
          - It blocks all attacks
        answer: 1
        explanation: Since nothing legitimate should touch a decoy, interaction is inherently a strong signal.
      - prompt: A honeytoken is
        options:
          - A real production credential
          - A fake credential, document, key or record that is monitored so its use reveals an intruder
          - A type of firewall
          - A backup system
        answer: 1
        explanation: Honeytokens are planted fake assets whose use shows someone is where they should not be.
      - prompt: Deception is especially effective at catching attackers who are
        options:
          - Still outside the perimeter only
          - Already inside, during reconnaissance and lateral movement
          - Using valid MFA
          - Reading public web pages
        answer: 1
        explanation: Decoys and honeytokens trip up intruders exploring the internal environment.
      - prompt: A limitation of deception is that it
        options:
          - Produces constant false positives
          - Complements rather than replaces primary defences, since an attacker might avoid the decoys
          - Cannot generate any alerts
          - Requires no placement thought
        answer: 1
        explanation: Deception is a high-value addition, not a substitute, and needs believable placement.
  - slug: sec-federation-sso
    title: Federation and Single Sign-On
    order: 18
    difficulty: intermediate
    summary: Understand how federation and single sign-on let users authenticate once and access many services, the protocols involved (SAML, OIDC, OAuth), and the security benefits and risks they bring.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:2", "cysa:1.3"]
    learning_objectives:
      - Explain federation and single sign-on and how they relate
      - Describe SAML, OAuth and OpenID Connect at a high level
      - Weigh the security benefits and risks of federated identity
    theory: |
      Modern users access dozens of applications, and **single sign-on (SSO)** lets them authenticate once to a
      central identity provider and then reach many services without logging in again, while **federation**
      extends this across organisational or domain boundaries, letting one organisation's identity provider grant
      access to another's services through an established trust. The two concepts are closely linked: federation
      is the trust relationship that makes cross-domain SSO possible. The central idea is that a trusted
      **identity provider (IdP)** authenticates the user and then vouches for them to the **service providers
      (relying parties)**, which trust the IdP's assertion rather than handling the credentials themselves. This
      is why you can log in to many third-party apps with a corporate or major-provider account.

      A few protocols make this work, and knowing their roles matters. **SAML** is a mature, XML-based standard
      widely used for enterprise web SSO, where the IdP sends the service provider a signed assertion that the
      user is authenticated and who they are. **OAuth 2.0** is an **authorization** framework, it lets a user
      grant an application limited access to resources (via tokens) without sharing their password, and is the
      basis of delegated access. **OpenID Connect (OIDC)** is an authentication layer built on top of OAuth 2.0
      that adds identity, providing a verifiable token about who the user is, and is the common choice for modern
      web and mobile SSO. A useful shorthand: OAuth is about authorization (what an app may do), OIDC adds
      authentication (who the user is), and SAML is the established enterprise equivalent.

      Federation and SSO bring strong **security benefits** but concentrate risk. On the benefit side, users have
      fewer passwords to manage and reuse, central authentication means strong controls (MFA, conditional access,
      monitoring) are applied once and everywhere, and access can be granted and, crucially, revoked centrally,
      disabling one account cuts off many services at once, which is invaluable at offboarding. The flip side is
      that the IdP becomes a **single point of trust and failure**: compromise the IdP or a user's SSO session and
      the attacker potentially reaches everything that trusts it, which is why attacks increasingly target
      identity providers, session tokens and the federation trust itself (for example forging assertions if signing
      keys are stolen). The defences follow: protect the IdP as tier-zero, enforce strong authentication and
      conditional access there, protect and monitor tokens and sessions, and guard the signing keys and trust
      configuration. For the analyst and architect, the lesson is that federated identity is powerful and now
      standard, delivering real security and usability gains by centralising authentication, but it makes identity
      the decisive perimeter, so the IdP and the trust it anchors must be among the most carefully protected and
      closely watched parts of the environment.
    examples:
      - title: How SSO and federation work
        body: |
          IdP authenticates the user once -> vouches for them to service providers (relying parties) that trust the IdP
          SSO: one login -> many apps; federation: that trust extended across org/domain boundaries.
      - title: The protocols
        body: |
          SAML: mature XML enterprise web SSO (signed assertion)
          OAuth 2.0: AUTHORIZATION (delegated access via tokens, no password sharing)
          OIDC: authentication layer ON TOP of OAuth (who the user is) -> modern web/mobile SSO.
    exercise:
      title: Design federated access and assess its risk
      environment: A described organisation adopting SSO across many apps (or a scenario)
      tools: [A scenario, a notes file, a document]
      steps:
        - Explain the relationship between single sign-on and federation.
        - Describe the roles of the identity provider and service providers.
        - Distinguish SAML, OAuth and OpenID Connect and what each is for.
        - List two security benefits of centralising authentication.
        - Explain why the identity provider becomes a single point of trust and failure.
        - Recommend how to protect the IdP, tokens and federation trust.
      deliverable: A federated-access design explaining SSO and federation, the IdP/SP roles, the three protocols, the benefits, the single-point-of-trust risk, and protections for the IdP and trust.
    expected_outcome: >
      You can explain federation and single sign-on, distinguish SAML, OAuth and OIDC, and weigh the benefits of
      centralised authentication against the concentrated risk of the identity provider as the decisive perimeter.
    quiz:
      - prompt: In federated SSO, service providers grant access by
        options:
          - Handling each user's password themselves
          - Trusting an assertion from a central identity provider that authenticated the user
          - Ignoring authentication
          - Issuing their own certificates
        answer: 1
        explanation: Relying parties trust the IdP's assertion rather than handling credentials directly.
      - prompt: OAuth 2.0 is fundamentally a framework for
        options:
          - Authentication (who the user is)
          - Authorization (granting an app limited access via tokens without sharing a password)
          - Disk encryption
          - Network routing
        answer: 1
        explanation: OAuth is about delegated authorization; OIDC adds the authentication/identity layer on top.
      - prompt: A major security benefit of centralised SSO is that access can be
        options:
          - Never revoked
          - Granted and revoked centrally, so disabling one account cuts off many services at once
          - Only granted manually per app
          - Shared freely
        answer: 1
        explanation: Central control means one change (especially at offboarding) propagates across many services.
      - prompt: Federation concentrates risk because the identity provider is
        options:
          - Irrelevant to security
          - A single point of trust and failure, so its compromise can reach everything that trusts it
          - Never targeted
          - Unable to enforce MFA
        answer: 1
        explanation: Compromising the IdP or an SSO session can unlock all federated services, so it is tier-zero.
  - slug: sec-threat-modeling
    title: Threat Modeling Fundamentals
    order: 19
    difficulty: intermediate
    summary: Learn how threat modeling systematically identifies what could go wrong with a system before it is built or attacked, using structured approaches like STRIDE to find and prioritise threats early.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.3", "secplus:3.1", "cysa:1.3"]
    learning_objectives:
      - Explain what threat modeling is and why it is done early
      - Apply a structured approach such as STRIDE to find threats
      - Prioritise and address the threats a model surfaces
    theory: |
      **Threat modeling** is the practice of thinking through, in a structured way, what could go wrong with a
      system, who might attack it, how, and what the impact would be, ideally **before** the system is built, so
      that security is designed in rather than bolted on after an incident. Instead of waiting to discover
      weaknesses through testing or breaches, a team deliberately asks, for a given design, where the valuable
      assets are, how data flows, where trust boundaries lie, and what an attacker could do at each point. The
      value is leverage: a threat found on a whiteboard costs almost nothing to address, while the same flaw found
      in production, or exploited by an attacker, is far more expensive and damaging. Threat modeling turns
      security from reactive to proactive.

      A common way to structure the thinking is a **framework like STRIDE**, which prompts the team to consider
      six categories of threat for each component and data flow: Spoofing (pretending to be someone else),
      Tampering (altering data or code), Repudiation (denying an action without a trace), Information disclosure
      (leaking data), Denial of service (disrupting availability), and Elevation of privilege (gaining rights one
      should not have). Walking through these against a diagram of the system, often a data-flow diagram showing
      components, data stores and trust boundaries, systematically surfaces threats that ad-hoc thinking would
      miss. Other approaches exist (attack trees, PASTA, and simply asking the "four questions": what are we
      building, what can go wrong, what will we do about it, and did we do a good job), but the common thread is a
      structured, repeatable process rather than relying on one expert's intuition.

      The output of threat modeling is not just a list of threats but **prioritised, actionable mitigations**. Each
      identified threat is assessed for likelihood and impact (connecting to risk management), and the team decides
      how to address it, by a design change, a control, or an accepted risk, so the model drives real decisions.
      Threat modeling is most valuable early and when repeated as a design evolves, and it is a collaborative
      activity, best done by the people who understand the system together, not a security team working alone. For
      the analyst and the broader security practitioner, the lessons are that threat modeling is how teams
      anticipate attacks by design rather than discover them by incident, that a structured framework like STRIDE
      makes the search for threats systematic and repeatable, and that its real value comes from turning the
      threats it finds into prioritised mitigations, because the cheapest and most effective place to stop an
      attack is in the design, long before an attacker ever arrives.
    examples:
      - title: Why model threats early
        body: |
          deliberately ask (before building): where are the assets, how does data flow, where are trust boundaries, what could an attacker do
          a threat found on a whiteboard = almost free; the same flaw in production or exploited = expensive
          -> security designed IN, not bolted on; proactive not reactive.
      - title: STRIDE
        body: |
          Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege
          walk the six against a data-flow diagram (components, stores, trust boundaries) -> systematic threat discovery
          then assess likelihood/impact and decide a mitigation for each (design change, control, or accepted risk).
    exercise:
      title: Threat-model a small system
      environment: A described small system or application with its data flows (or a scenario)
      tools: [A scenario, a data-flow sketch, a notes file, a document]
      steps:
        - Explain what threat modeling is and why doing it early gives leverage.
        - Sketch or describe the system's components, data flows and trust boundaries.
        - Apply the STRIDE categories to find threats at the components and flows.
        - Pick the most serious threats and assess their likelihood and impact.
        - Propose a mitigation for each prioritised threat (design change, control, or accepted risk).
        - Explain why threat modeling is collaborative and repeated as the design evolves.
      deliverable: A threat model for the system covering its data flows and trust boundaries, STRIDE-based threats, a prioritisation, and a mitigation for each top threat.
    expected_outcome: >
      You can explain threat modeling and why it is done early, apply STRIDE to systematically find threats in a
      design, and turn those threats into prioritised mitigations that drive real security decisions.
    quiz:
      - prompt: Threat modeling is most valuable when done
        options:
          - Only after a breach
          - Early, ideally before a system is built, so security is designed in rather than bolted on
          - Never
          - Only by one expert in isolation
        answer: 1
        explanation: Finding threats in the design is far cheaper than discovering them in production or via incidents.
      - prompt: STRIDE helps a team by
        options:
          - Encrypting data
          - Prompting consideration of six threat categories against each component and data flow
          - Replacing all testing
          - Removing trust boundaries
        answer: 1
        explanation: STRIDE structures the search for threats (spoofing, tampering, repudiation, disclosure, DoS, elevation).
      - prompt: The real value of a threat model comes from
        options:
          - A long list of threats with no action
          - Turning the identified threats into prioritised, actionable mitigations that drive decisions
          - Ignoring the findings
          - Doing it only once and never again
        answer: 1
        explanation: Threat modeling must lead to prioritised mitigations, not just a catalogue of risks.
      - prompt: A data-flow diagram is useful in threat modeling because it
        options:
          - Hides the system design
          - Shows components, data stores and trust boundaries so threats can be found systematically
          - Replaces the mitigations
          - Measures CPU usage
        answer: 1
        explanation: Mapping flows and trust boundaries reveals where threats can occur.
  - slug: sec-supply-chain-risk
    title: Supply Chain Security and Third-Party Software Risk
    order: 20
    difficulty: intermediate
    summary: Understand how modern systems depend on a vast supply chain of third-party software, libraries and vendors, why this creates a major attack surface, and the practices that manage supply-chain risk.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.3", "secplus:5.1", "cysa:1.3", "secplus:5.3"]
    learning_objectives:
      - Explain why the software and vendor supply chain is a major risk
      - Describe common supply-chain attack patterns
      - Describe practices that manage supply-chain risk
    theory: |
      No modern organisation builds everything itself; it relies on a vast **supply chain** of third-party
      software, open-source libraries, hardware, cloud services and vendors, and that dependence is a major and
      growing security risk because a weakness anywhere in the chain can become the organisation's weakness. The
      essential problem is **transitive trust**: when you install a vendor's product or pull in an open-source
      library, you inherit the security of everything it depends on, and of the processes that built and delivered
      it, often without visibility into any of it. A single widely used component or vendor, if compromised,
      becomes a path into everyone who uses it, which is why supply-chain attacks are attractive to sophisticated
      adversaries, one compromise yields many victims.

      The **attack patterns** are varied. In a **software supply-chain attack**, an attacker compromises a trusted
      product or its build and distribution pipeline so that the legitimate, signed update delivered to customers
      contains malicious code, as in several high-profile incidents, which is devastating because customers trust
      and automatically install updates. In the **open-source** ecosystem, attackers publish malicious packages
      (sometimes typosquatting popular names), take over abandoned but widely used packages, or slip malicious
      changes into dependencies, and because projects pull in deep trees of transitive dependencies, a poisoned
      package deep in the tree can reach many systems. **Vendor and third-party risk** more broadly includes a
      service provider with access to your systems or data being breached, or a vendor's poor security becoming
      your incident. Hardware supply-chain tampering is a further, harder-to-address concern. The common thread is
      that the attacker does not breach you directly, they breach something you trust and depend on.

      Managing supply-chain risk combines **visibility, vetting and controls**. **Know your dependencies**: maintain
      an inventory, increasingly a Software Bill of Materials (SBOM) listing the components in your software, so
      that when a vulnerability or compromise in a component is announced you can tell whether and where you are
      affected, something impossible without that visibility. **Vet and monitor vendors and components**: assess
      the security of significant vendors and open-source dependencies, prefer well-maintained components, and
      watch for advisories. **Apply controls to the pipeline**: verify integrity of updates and packages (signing,
      checksums), pin and review dependencies, and limit the access third parties and their software have (least
      privilege), so a compromised component or vendor is contained. **Plan for it**: include supply-chain
      scenarios in risk assessment and incident response, because some supply-chain compromises are discovered only
      after the fact. For the analyst and the organisation, the lessons are that dependence on third-party software
      and vendors creates transitive trust that attackers exploit to turn one compromise into many, that the attack
      patterns, poisoned updates, malicious packages, breached vendors, all come through something you trust, and
      that managing the risk requires knowing your dependencies (SBOM), vetting and monitoring vendors and
      components, verifying integrity, limiting third-party access, and planning for the compromises that still get
      through, because in a connected software world, your security is only as strong as the weakest link you depend on.
    examples:
      - title: Transitive trust
        body: |
          you depend on third-party software, open-source libraries, vendors, cloud, hardware -> you inherit their security + their build/delivery processes
          one widely used compromised component/vendor = a path into everyone who uses it -> one compromise, many victims.
      - title: Attack patterns and management
        body: |
          poisoned signed update (compromise the build/distribution pipeline); malicious/typosquatted open-source packages; breached vendor with access to you
          manage: SBOM/dependency inventory (know if a component affects you), vet + monitor vendors/components, verify integrity (signing/checksums), limit third-party access, plan for it.
    exercise:
      title: Assess and manage supply-chain risk
      environment: A described organisation relying on vendors and open-source software (or a scenario)
      tools: [A scenario, a dependency or vendor list, a notes file, a document]
      steps:
        - Explain why dependence on third-party software and vendors creates transitive-trust risk.
        - Describe a software supply-chain attack via a poisoned update and why it is so effective.
        - Describe an open-source supply-chain attack pattern.
        - Explain how an SBOM or dependency inventory helps when a component vulnerability is announced.
        - Describe how vetting vendors, verifying integrity and limiting access reduce the risk.
        - Explain why supply-chain scenarios belong in risk assessment and incident response.
      deliverable: A supply-chain risk plan covering transitive trust, the main attack patterns, and management practices (SBOM, vetting, integrity verification, least-privilege access, planning).
    expected_outcome: >
      You can explain why the software and vendor supply chain is a major risk, describe common supply-chain attack
      patterns, and describe the practices (SBOM, vetting, integrity verification, access limits, planning) that manage it.
    quiz:
      - prompt: The core reason the supply chain is a major risk is
        options:
          - Organisations build everything themselves
          - Transitive trust: you inherit the security of the software, components and vendors you depend on
          - Third-party software is always secure
          - Dependencies have no security impact
        answer: 1
        explanation: Depending on others means inheriting their security, so a weakness in the chain becomes yours.
      - prompt: A software supply-chain attack via a poisoned update is devastating because
        options:
          - Customers never install updates
          - Customers trust and automatically install the legitimate, signed update that now contains malicious code
          - It only affects the vendor
          - Updates cannot carry code
        answer: 1
        explanation: Trusted auto-installed updates deliver the attacker's code to many customers at once.
      - prompt: An SBOM (Software Bill of Materials) helps primarily by
        options:
          - Encrypting the software
          - Letting you tell whether and where you use a component when a vulnerability or compromise is announced
          - Removing all dependencies
          - Replacing vendor contracts
        answer: 1
        explanation: Knowing your components lets you assess exposure when a component issue emerges.
      - prompt: A key control to contain a compromised component or vendor is to
        options:
          - Grant third parties full access
          - Limit the access third parties and their software have (least privilege) and verify update integrity
          - Disable all logging
          - Trust all packages without review
        answer: 1
        explanation: Least-privilege access and integrity verification contain a compromise in the chain.
  - slug: sec-secure-configuration
    title: Secure Configuration and Baselines
    order: 21
    difficulty: beginner
    summary: Understand why insecure default configurations are a leading cause of compromise, how security baselines and benchmarks define a known-good hardened state, and how to establish and maintain secure configuration.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "secplus:2.5", "cysa:1.3"]
    learning_objectives:
      - Explain why default configurations are often insecure
      - Describe security baselines and benchmarks and their role
      - Establish and maintain secure configuration at scale
    theory: |
      A great many breaches stem not from sophisticated exploits but from **insecure configuration**, systems left
      with default or weak settings, unnecessary features enabled, default credentials unchanged, or important
      protections switched off. Software and devices often ship configured for ease of setup rather than security
      (open by default, extra services running, verbose and permissive), so a system taken out of the box and
      connected without hardening is frequently exposed from the start. Because misconfiguration is so common and
      so exploitable, establishing and maintaining **secure configuration** is one of the highest-value, most
      fundamental security activities, and unlike chasing every new vulnerability, it addresses a huge class of
      risk with disciplined, repeatable practice.

      The tool for this is a **security baseline** (also realised through **benchmarks** such as the widely used CIS
      Benchmarks and vendor security guides), a defined, known-good hardened configuration for a type of system, an
      operating system, a database, a browser, a cloud service. A baseline specifies the settings that make a
      system reasonably secure: disable unnecessary services and default accounts, enforce strong authentication,
      set appropriate permissions, enable logging, turn on available protections, and so on. Rather than each
      administrator deciding ad hoc what secure means, a baseline captures expert consensus so configurations are
      consistent and defensible, and it connects to the Group Policy baselines met in the Windows module, which are
      one concrete way of applying a baseline. Applying a baseline hardens a system against a broad range of
      attacks at once, and because baselines are standardised, compliance with them can be measured.

      The discipline is **establish, measure and maintain**. Establish by selecting or adapting an appropriate
      baseline for each system type and applying it, ideally automatically through configuration management so
      every system is built to the standard rather than hand-configured. Measure by scanning systems against the
      baseline (configuration and compliance scanning, met in the vulnerability module) to find deviations.
      Maintain by watching for **configuration drift**, the gradual, often unnoticed divergence of a system from
      its secure baseline as changes accumulate, which steadily reopens risk; detecting and correcting drift keeps
      systems in their hardened state over time. The considerations are balancing security against functionality
      (a baseline must not break needed features, so baselines are tailored and tested), and handling exceptions
      formally rather than silently weakening the standard. For the analyst and administrator, the lessons are that
      insecure default configuration is a leading, eminently preventable cause of compromise, that security
      baselines and benchmarks define a known-good hardened state that captures expert consensus and can be applied
      consistently, and that secure configuration is an ongoing discipline of establishing, measuring against, and
      maintaining baselines against drift, because keeping systems configured securely prevents a large share of
      attacks before they ever begin.
    examples:
      - title: Why defaults are insecure
        body: |
          shipped for easy setup, not security: default/weak creds, extra services, protections off, permissive
          out-of-the-box + connected without hardening = exposed from the start -> misconfiguration is a leading breach cause.
      - title: Baselines and drift
        body: |
          baseline/benchmark (CIS, vendor guides): a defined known-good hardened config per system type (disable extras, strong auth, perms, logging, protections on)
          establish (apply via config management) -> measure (scan for deviations) -> maintain (detect + fix DRIFT)
          tailor + test so it doesn't break needed features; handle exceptions formally.
    exercise:
      title: Establish and maintain a secure baseline
      environment: A described set of systems needing hardening (or a scenario)
      tools: [A scenario or a sample benchmark, a document, a notes file]
      steps:
        - Explain why default configurations are often insecure and why this causes so many breaches.
        - Describe what a security baseline or benchmark defines and the consensus it captures.
        - Explain how applying a baseline hardens a system against many attacks at once.
        - Describe how you would apply a baseline consistently and measure compliance.
        - Explain configuration drift and why it reopens risk over time.
        - Explain how exceptions should be handled without silently weakening the baseline.
      deliverable: A secure-configuration plan covering why defaults are insecure, selecting and applying a baseline, measuring compliance, and maintaining against drift with formal exceptions.
    expected_outcome: >
      You can explain why default configurations are insecure, describe security baselines and benchmarks, and
      establish, measure and maintain secure configuration against drift as a fundamental, high-value discipline.
    quiz:
      - prompt: Insecure default configuration is a leading cause of compromise because systems often ship
        options:
          - Fully hardened by default
          - Configured for easy setup with defaults, extra services and protections off, exposed until hardened
          - With no settings at all
          - Disconnected permanently
        answer: 1
        explanation: Ease-of-setup defaults leave systems exposed until they are deliberately hardened.
      - prompt: A security baseline or benchmark (such as CIS) is
        options:
          - A random set of settings
          - A defined, known-good hardened configuration for a system type, capturing expert consensus
          - A type of malware
          - A network cable
        answer: 1
        explanation: Baselines specify a consistent, defensible hardened state for each kind of system.
      - prompt: Configuration drift is dangerous because
        options:
          - It hardens systems automatically
          - Systems gradually diverge from their secure baseline as changes accumulate, reopening risk unnoticed
          - It cannot occur
          - It only affects wallpaper
        answer: 1
        explanation: Unmanaged change erodes the hardened state over time, so drift must be detected and corrected.
      - prompt: Applying a baseline through configuration management is preferable because
        options:
          - Hand-configuring each system is more reliable
          - Every system is built to the standard consistently rather than configured ad hoc
          - It avoids any hardening
          - It removes logging
        answer: 1
        explanation: Automated, consistent application ensures all systems meet the secure standard.
  - slug: sec-cryptographic-attacks
    title: Cryptographic Attacks and Weaknesses
    order: 22
    difficulty: intermediate
    summary: Understand how cryptography fails in practice, not usually by breaking the math but through weak algorithms, poor implementation and misuse, and how to recognise and avoid the common cryptographic weaknesses.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "secplus:1.4", "cysa:1.3"]
    learning_objectives:
      - Explain how cryptography usually fails in practice
      - Describe common cryptographic attacks and weaknesses
      - Recognise and avoid cryptographic misuse
    theory: |
      Cryptography, met earlier as a building block, is only as strong as how it is chosen and used, and in practice
      it almost never fails by someone breaking the underlying mathematics of a strong modern algorithm. Instead it
      fails through **weak algorithms, poor implementation and misuse**, and recognising these failure modes is far
      more useful to a defender than understanding the math, because the weaknesses attackers exploit are
      overwhelmingly about how crypto is applied, not whether the cipher itself is sound. The practical lesson is to
      treat cryptography as something that must be used correctly, with strong current algorithms and sound
      implementation, rather than as a magic protection that works simply because it is present.

      The common **weaknesses and attacks** cluster into a few categories. **Weak or outdated algorithms**: using
      broken or deprecated algorithms (old hashes like MD5 or SHA-1 for security, weak or short keys, obsolete
      protocols like old SSL/TLS versions) means the protection is weak regardless of correct use, so an attacker
      can break it with known techniques. **Poor key management**: as met in the secrets lesson, keys that are
      hardcoded, reused, shared, never rotated or poorly protected undermine even strong algorithms, because the
      security of encryption rests entirely on the secrecy of the key. **Misuse and implementation flaws**: using
      cryptography in the wrong mode or with predictable or reused initialization vectors or nonces, rolling your
      own cryptography instead of using vetted libraries, weak random number generation (predictable values where
      unpredictability is required), and improper validation (for example not verifying certificates). **Attacks on
      secrets directly**: brute force and dictionary attacks against weak passwords and keys, and against stored
      password hashes, which is why strong hashing with salting is used for passwords. **Downgrade attacks** that
      trick systems into using a weaker algorithm or protocol version. The recurring theme is that each of these is
      a failure of selection or use, not of the underlying primitive.

      Avoiding these weaknesses is mostly about **discipline and good defaults**. Use **strong, current algorithms
      and key lengths** and retire deprecated ones; follow authoritative guidance rather than choosing crypto
      yourself. **Never roll your own cryptography**, use well-vetted, maintained libraries and standard protocols,
      which handle the subtle implementation details correctly. **Manage keys properly** (the secrets-management
      discipline). **Use cryptography correctly**, right modes, unique and unpredictable IVs/nonces, proper random
      number generation, and full validation (including certificate validation, connecting to the PKI lesson).
      **Protect against downgrade** by disabling weak protocol versions and ciphers. For the analyst and engineer,
      the lessons are that cryptography in the real world fails through weak algorithms, poor key management and
      misuse rather than broken math, that the common weaknesses, deprecated algorithms, mishandled keys,
      home-grown or misused crypto, weak randomness, missing validation, downgrade, are failures of how crypto is
      applied, and that avoiding them comes down to using strong current algorithms and vetted libraries correctly,
      managing keys well, and validating properly, because the way to defeat an attacker is almost never to
      out-math them but to deny them the weak algorithm, exposed key or implementation slip they were counting on.
    examples:
      - title: How crypto really fails
        body: |
          almost never by breaking strong modern math -> it fails by weak ALGORITHMS, poor KEY MANAGEMENT, and MISUSE
          recognising these failure modes beats understanding the math -> use crypto correctly, don't treat it as magic.
      - title: Common weaknesses
        body: |
          weak/outdated: MD5/SHA-1 for security, short keys, old SSL/TLS; poor keys: hardcoded/reused/un-rotated (secrecy of the key is everything)
          misuse: wrong mode, reused/predictable IV/nonce, ROLL-YOUR-OWN crypto, weak randomness, no cert validation; brute force on weak secrets; DOWNGRADE attacks
          avoid: strong current algorithms, vetted libraries, good key mgmt, correct use + validation, disable weak versions.
    exercise:
      title: Find and fix cryptographic weaknesses
      environment: A described system using cryptography (or a scenario with sample crypto choices)
      tools: [A scenario or sample configuration, a document, a notes file]
      steps:
        - Explain why cryptography usually fails through weak algorithms, poor keys and misuse rather than broken math.
        - Identify a weak or outdated algorithm issue and its risk.
        - Explain how poor key management undermines even strong algorithms.
        - Describe two implementation or misuse flaws (for example reused nonces, rolling your own crypto, weak randomness, missing validation).
        - Explain what a downgrade attack does.
        - Recommend the disciplined practices that avoid these weaknesses.
      deliverable: A cryptographic-weakness review identifying weak algorithms, key-management and misuse issues in the scenario, with recommendations for strong algorithms, vetted libraries, proper key management and validation.
    expected_outcome: >
      You can explain how cryptography fails in practice, describe common cryptographic attacks and weaknesses, and
      recognise and avoid cryptographic misuse through strong algorithms, vetted libraries, good key management and validation.
    quiz:
      - prompt: In practice, cryptography usually fails because of
        options:
          - Someone breaking the math of a strong modern algorithm
          - Weak or outdated algorithms, poor key management, and misuse or implementation flaws
          - Too much randomness
          - Using vetted libraries
        answer: 1
        explanation: Real-world crypto failures are overwhelmingly about selection and use, not broken primitives.
      - prompt: Why is "rolling your own cryptography" discouraged?
        options:
          - It is always faster and safer
          - Subtle implementation details are easy to get wrong, so vetted, maintained libraries should be used instead
          - It uses no keys
          - Libraries are insecure
        answer: 1
        explanation: Home-grown crypto commonly has implementation flaws that vetted libraries avoid.
      - prompt: Poor key management undermines strong algorithms because
        options:
          - Keys are irrelevant to security
          - The security of encryption rests on the secrecy of the key, so exposed, reused or unrotated keys defeat it
          - Strong algorithms need no keys
          - It improves randomness
        answer: 1
        explanation: Even a perfect cipher is broken if its key is exposed or mismanaged.
      - prompt: A downgrade attack works by
        options:
          - Strengthening the encryption
          - Tricking systems into using a weaker algorithm or protocol version that can then be broken
          - Rotating the keys
          - Validating certificates
        answer: 1
        explanation: Downgrade attacks force a fallback to weak crypto, which is why weak versions should be disabled.
  - slug: sec-soc-fundamentals
    title: Introduction to Security Operations and the SOC
    order: 23
    difficulty: beginner
    summary: Understand what a Security Operations Center does, how analyst tiers and the alert-to-response workflow fit together, and where the day-to-day work of detection and response actually happens.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:1", "cysa:3.1"]
    learning_objectives:
      - Explain the purpose and function of a Security Operations Center
      - Describe analyst tiers and the alert-to-response workflow
      - Situate detection and response work within the SOC
    theory: |
      A **Security Operations Center (SOC)** is the team and function responsible for continuously monitoring an
      organisation for security threats and responding to them, and understanding the SOC gives essential context
      for almost everything else in security operations, because the SOC is where detection, investigation and
      response actually happen day to day. The SOC's purpose is to reduce the time between an attack beginning and
      the organisation detecting and stopping it, by watching the telemetry (logs, alerts, the SIEM and detection
      tools met throughout), triaging what comes in, investigating what looks real, and driving response. A SOC may
      be internal, outsourced to a managed service, or a hybrid, and it operates continuously because attacks do
      not keep business hours. For someone entering security operations, the SOC is the environment the work lives
      in, so knowing how it is organised and how work flows through it frames the rest.

      SOCs are commonly organised into **tiers** reflecting a workflow from triage to deep response. **Tier 1
      analysts** monitor and triage the incoming stream of alerts, doing initial assessment to filter out false
      positives and routine noise and escalating genuine or unclear incidents. **Tier 2 analysts** investigate
      escalated incidents more deeply, correlating data, scoping the activity, and handling more complex cases.
      **Tier 3** (senior analysts, threat hunters, incident responders) handle the most serious incidents, proactive
      hunting (met earlier) and advanced analysis, and often improve detections and processes. Supporting roles
      include detection engineers (who build the detections, met earlier), SOC managers, and threat intelligence
      analysts. This tiering is a common model rather than a universal rule, some SOCs use flatter or different
      structures, but the underlying idea is consistent: a workflow that filters a large volume of signals down to
      the few that need deep attention, escalating as complexity and severity rise.

      The **alert-to-response workflow** ties it together and connects to the lessons throughout this curriculum.
      Telemetry flows into the SIEM and detection tools, which generate **alerts**; analysts **triage** each alert
      (is it a false positive, routine, or a real concern), **investigate** those that warrant it (gathering
      context to reach a verdict), and for confirmed incidents move into the **incident response** process
      (containment, eradication, recovery, met in that module). Throughout, **case management** tracks the work,
      **metrics** measure performance (MTTD and MTTR, met earlier), and feedback improves detections to cut noise.
      Alert fatigue, too many low-value alerts, is a central challenge the SOC manages through tuning and good
      detection engineering, because analyst attention is the scarce resource. For the newcomer, the lessons are
      that the SOC is the continuously operating team where monitoring, detection, triage, investigation and
      response come together, that a tiered workflow filters a flood of signals down to the incidents that need
      deep response while escalating by complexity and severity, and that the alert-to-response flow, supported by
      case management, metrics and detection tuning, is the daily rhythm of security operations into which the
      specific skills covered elsewhere all fit.
    examples:
      - title: What a SOC is for
        body: |
          the team/function that continuously monitors for threats + responds -> shrink the time from attack to detection/stop
          internal, outsourced (managed), or hybrid; runs 24/7 because attacks don't keep business hours
          it's the environment detection + response actually live in.
      - title: Tiers and the workflow
        body: |
          Tier 1 triage the alert stream (filter false positives, escalate); Tier 2 investigate deeper; Tier 3 (senior/hunters/responders) handle the worst + hunt + improve detections; + detection engineers, managers, threat intel
          flow: telemetry -> SIEM/detections -> ALERTS -> triage -> investigate -> incident response; case mgmt + metrics (MTTD/MTTR) + tuning; alert fatigue is the central challenge.
    exercise:
      title: Map the SOC and its workflow
      environment: A described organisation standing up or explaining a SOC (or a scenario)
      tools: [A scenario, a document, a notes file]
      steps:
        - Explain the purpose of a SOC and why it operates continuously.
        - Describe the analyst tiers and what each does.
        - Explain how the tiered model filters many signals down to the incidents needing deep response.
        - Trace the alert-to-response workflow from telemetry to incident response.
        - Explain the role of case management and metrics in the workflow.
        - Explain alert fatigue and why analyst attention is the scarce resource.
      deliverable: A SOC overview covering its purpose, the analyst tiers, the alert-to-response workflow, and how case management, metrics and detection tuning support it.
    expected_outcome: >
      You can explain the purpose and function of a SOC, describe analyst tiers and the alert-to-response workflow,
      and situate detection, investigation and response work within the operating rhythm of the SOC.
    quiz:
      - prompt: The core purpose of a SOC is to
        options:
          - Build applications
          - Continuously monitor for threats and respond, reducing the time from an attack beginning to detecting and stopping it
          - Manage payroll
          - Replace the firewall
        answer: 1
        explanation: The SOC exists to detect and respond to threats continuously, shrinking the attacker's window.
      - prompt: In the common tiered model, Tier 1 analysts primarily
        options:
          - Handle only the most advanced incidents
          - Monitor and triage the incoming alert stream, filtering noise and escalating genuine or unclear incidents
          - Write all the software
          - Do nothing
        answer: 1
        explanation: Tier 1 triages alerts, escalating real or unclear ones to deeper investigation.
      - prompt: The alert-to-response workflow runs roughly as
        options:
          - Response, then telemetry, then alerts
          - Telemetry to SIEM/detections to alerts, then triage, investigation, and incident response for confirmed incidents
          - Only manual inspection with no tools
          - Alerts with no investigation
        answer: 1
        explanation: Signals generate alerts that are triaged, investigated, and escalated into incident response.
      - prompt: Alert fatigue is a central SOC challenge because
        options:
          - There are never enough alerts
          - Too many low-value alerts consume scarce analyst attention, so tuning and good detection engineering are essential
          - Analysts have unlimited attention
          - Alerts are always accurate
        answer: 1
        explanation: Analyst attention is limited, so excessive noise must be tuned down to find real incidents.
  - slug: sec-asset-lifecycle-disposal
    title: 'Asset Lifecycle: Procurement, Inventory and Secure Disposal'
    order: 24
    difficulty: beginner
    summary: Follow hardware, software and data assets from procurement to disposal, keep an inventory that stays true, and choose the right sanitisation method.
    theory_minutes: 12
    lab_minutes: 54
    objectives:
    - secplus:4.2
    - cysa:2.1
    learning_objectives:
    - Describe the security tasks at each stage of the asset lifecycle, from acquisition to decommissioning
    - Build and reconcile an asset inventory with owners and classifications
    - Choose between clearing, purging and destruction and evidence disposal with a certificate
    theory: |
      Every control in this catalog assumes you know what you own. **Asset management** makes that true by
      following each hardware, software and data asset through its whole **lifecycle**, and Security+ tests
      the security task at each stage.

      **Acquisition and procurement** is where security is cheapest. Buy from approved vendors and channels so
      hardware is genuine and untampered, check that software is supported and licensed, and require security
      features (TPM, secure boot, update support) before the purchase rather than after. **Assignment and
      accounting** gives every asset an **owner**, the person accountable for it, and a **classification**
      that sets how it must be protected. An asset without an owner is one nobody patches.

      **Monitoring and asset tracking** keeps the record true. The **inventory**, often a configuration
      management database (CMDB), lists each asset with owner, location, classification, software versions and
      status. **Enumeration** keeps it current by discovering what is really there, through network discovery
      scans, endpoint agents, cloud APIs and identity logs, then **reconciling** that against the inventory.
      The gaps are the findings: a device the scan sees but the CMDB does not is unmanaged, and a CMDB entry
      nobody can find may be lost or stolen. Software inventory matters as much as hardware, because
      unlicensed or unapproved software is both a legal and a vulnerability risk.

      **Disposal and decommissioning** ends the lifecycle safely. Data must not leave with the hardware. NIST SP
      800-88 names three levels of **sanitisation**: **clear** (overwrite through normal interfaces, fine for
      reuse inside the organisation), **purge** (cryptographic erase or block erase that defeats lab recovery,
      for media leaving your control), and **destroy** (shred, disintegrate or incinerate, for the most
      sensitive media or failed drives). A third party that destroys media should issue a **certificate of
      destruction** as **certification** that it happened. **Data retention** rules decide what must be kept
      before anything is wiped, so disposal never destroys records you are legally required to hold. Finally,
      update the inventory and revoke the asset's accounts, certificates and network access, because a
      decommissioned server that still has a valid certificate is still a way in.
    examples:
    - title: Reconciling discovery against the CMDB
      body: |
        Discovered on network     In CMDB?   Owner        Finding
        10.2.4.17  ws-fin-022     yes        J. Patel     ok
        10.2.4.51  (no hostname)  NO         -            unmanaged device -> identify, enrol or remove
        10.2.7.9   srv-legacy-03  yes        (left org)   orphaned owner -> reassign
        -          lt-hr-118      yes        A. Moreno    in CMDB, not seen for 60 days -> lost or stolen?
    - title: Choosing a sanitisation method
      body: |
        Laptop SSD reissued to a new employee         -> clear (or purge) and reimage
        Server disks returned to a leasing company    -> purge (cryptographic erase), record serials
        Failed drive that held regulated data         -> destroy (shred), certificate of destruction
        Before any of the above                       -> check the retention schedule and legal holds
    exercise:
      title: Run an asset reconciliation and plan a decommission
      environment: A Linux VM on a lab network or home network you own, plus a spreadsheet acting as the CMDB
      tools:
      - nmap
      - a spreadsheet
      - arp or ip neigh
      - a text editor
      steps:
      - Create a small CMDB sheet with columns for asset, owner, location, classification, OS and status, and fill it from what you believe you own.
      - Run an nmap ping sweep (nmap -sn) of your own lab or home subnet and record every live host.
      - Reconcile the scan against the CMDB and label each difference as unmanaged, orphaned or missing.
      - Write the procurement security requirements you would add for the next laptop purchase.
      - Pick one asset to decommission and choose clear, purge or destroy with a reason tied to its classification and destination.
      - List the accounts, certificates, DNS records and firewall rules that must be revoked when it is retired.
      - Draft the evidence you would keep, including a certificate of destruction if a third party is used.
      deliverable: A reconciled inventory with each discrepancy labelled, a procurement requirements list, and a decommissioning plan with the chosen sanitisation method and evidence.
    expected_outcome: |
      You can explain the security tasks at each asset lifecycle stage, keep an inventory honest by reconciling
      discovery against it, and choose and evidence the right sanitisation method when an asset is retired.
    quiz:
    - prompt: A discovery scan finds a host that is not in the CMDB. What is it?
      options:
      - An unmanaged asset that needs to be identified and enrolled or removed
      - A false positive to ignore
      - Proof the CMDB is complete
      - A decommissioned asset
      answer: 0
      explanation: 'Reconciliation gaps are findings: an unknown device is unmanaged and unprotected.'
    - prompt: Server disks are being returned to a leasing company. Which NIST SP 800-88 level is appropriate?
      options:
      - Clear
      - Purge
      - No action, the lessor wipes them
      - Reformat only
      answer: 1
      explanation: Media leaving your control needs purge, which defeats laboratory recovery.
    - prompt: What should be checked before any media is sanitised?
      options:
      - The vendor's marketing material
      - The data retention schedule and any legal holds
      - The asset's purchase price
      - Nothing, faster disposal is safer
      answer: 1
      explanation: Disposal must not destroy records the organisation is required to keep.
    - prompt: Why does every asset need a named owner?
      options:
      - It is required for warranty claims only
      - Ownership sets accountability for patching, classification and eventual disposal
      - Owners pay for the asset
      - It lets the scanner skip the asset
      answer: 1
      explanation: An asset nobody owns is an asset nobody patches or retires properly.
