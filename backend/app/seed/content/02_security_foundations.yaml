slug: security-foundations
title: Security Foundations
domain: Security Foundations
order: 2
description: >
  The core concepts every Security+ question builds on: security controls, the
  CIA triad, cryptography, and who attacks organisations and why.
lessons:
  - slug: sec-controls-cia
    title: Security Controls, the CIA Triad and Zero Trust
    order: 1
    difficulty: beginner
    summary: Classify security controls and audit a real system against the CIA triad and AAA.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:1.1", "secplus:1.2", "sc900:1"]
    learning_objectives:
      - Classify controls by category (technical, managerial, operational, physical) and type (preventive, detective, corrective and others)
      - Explain confidentiality, integrity, availability, non-repudiation and AAA
      - Describe Zero Trust, deception technologies and physical security controls
    theory: |
      Security+ groups controls two ways. **Category** says what the control is: **technical**
      (firewalls, MFA, encryption), **managerial** (policies, risk assessments), **operational**
      (security guards, awareness training, procedures run by people) and **physical** (locks,
      fences, badges). **Type** says what it does: **preventive** stops an incident, **deterrent**
      discourages it, **detective** finds it, **corrective** fixes it, **compensating** substitutes
      for a control you cannot implement, and **directive** tells people what to do.

      The **CIA triad** is the goal of all of them. **Confidentiality** keeps data from the wrong
      people (encryption, access control). **Integrity** keeps it unaltered (hashing, digital
      signatures). **Availability** keeps it usable (redundancy, backups). **Non-repudiation** means
      someone cannot deny an action they took, which digital signatures and logs provide.
      **AAA** is Authentication (prove who you are), Authorization (what you may do) and
      Accounting (a record of what you did).

      **Zero Trust** removes implicit trust based on network location. A **policy decision
      point** evaluates each request using identity, device health and context, and a **policy
      enforcement point** allows or blocks it. **Deception technology** such as honeypots,
      honeynets, honeyfiles and honeytokens has no legitimate use, so any interaction with it is
      a high-confidence alert. **Gap analysis** compares the controls you have with the controls
      a framework says you need.
    examples:
      - title: One risk, several controls
        body: |
          Risk: stolen laptop exposes customer data
          Preventive / technical:   full-disk encryption (BitLocker)
          Deterrent / physical:     cable lock and asset tag
          Detective / technical:    MDM alert when the device checks in from a new country
          Corrective / operational: remote wipe procedure run by the service desk
          Directive / managerial:   acceptable-use policy requiring encryption
      - title: A honeytoken
        body: |
          A fake cloud access key placed in an internal wiki page.
          No system uses it, so any API call made with it means someone read and
          stole credentials from the wiki.
    exercise:
      title: Run a control inventory and gap analysis on your own lab
      environment: Your Windows VM from the Windows Security course and a spreadsheet
      tools: [PowerShell, Spreadsheet, auditpol, manage-bde]
      steps:
        - Create a spreadsheet with columns Control, Category, Type, CIA goal, Evidence, Status.
        - Check disk encryption with `manage-bde -status` (or Settings > Privacy & security > Device encryption) and record it.
        - Check Windows Defender Firewall profiles with `Get-NetFirewallProfile | Select Name, Enabled` and record them.
        - Check audit logging with `auditpol /get /category:*` and record which categories detect logons and process creation.
        - Check password and lockout policy with `net accounts` and record whether a lockout threshold exists.
        - Classify each control by category and type, and map it to confidentiality, integrity or availability.
        - Add three controls you do not have (for example backups, MFA, a honeyfile), mark them as gaps, and write one sentence on the risk each gap leaves open.
        - Create a honeyfile named `passwords-2026.xlsx` and enable auditing on it (Properties > Security > Advanced > Auditing) so reads generate event 4663.
      deliverable: The completed control inventory with at least eight rows, including three gaps and your honeyfile.
    expected_outcome: >
      You can look at any control and say which category and type it is, which CIA goal it
      serves, and what is missing compared with a baseline.
    quiz:
      - prompt: A security guard checking badges at the entrance is which control category?
        options: [Technical, Managerial, Operational, Compensating]
        answer: 2
        explanation: Guards are people carrying out a procedure, which Security+ calls operational.
      - prompt: Which control type is a security camera that is reviewed after an incident?
        options: [Preventive, Detective, Corrective, Directive]
        answer: 1
        explanation: Reviewing footage finds and records what happened, which is detective.
      - prompt: Digital signatures primarily provide integrity and
        options: [Availability, Non-repudiation, Obfuscation, Load balancing]
        answer: 1
        explanation: A signature proves who signed, so the signer cannot deny it.
      - prompt: Any access to a honeyfile is treated as malicious because
        options:
          - Honeyfiles are encrypted
          - The file has no legitimate business use
          - Honeyfiles contain malware
          - Only administrators can open it
        answer: 1
        explanation: Deception assets have no real purpose, so interaction signals an intruder.
      - prompt: In Zero Trust, which component decides whether a request is allowed?
        options: [Policy enforcement point, Policy decision point, Jump server, Screened subnet]
        answer: 1
        explanation: The policy decision point evaluates the request; the enforcement point applies the decision.

  - slug: sec-crypto-pki
    title: Cryptography, Hashing and PKI in Practice
    order: 2
    difficulty: beginner
    summary: Hash, encrypt, sign and inspect certificates with OpenSSL.
    theory_minutes: 12
    lab_minutes: 50
    objectives: ["secplus:1.4"]
    learning_objectives:
      - Distinguish symmetric encryption, asymmetric encryption and hashing and say when each is used
      - Explain digital signatures, certificates and the chain of trust
      - Use OpenSSL to hash files, encrypt data and inspect a website's certificate
    theory: |
      **Symmetric** encryption (AES) uses one shared key: fast, used for bulk data, but the key
      must be shared safely. **Asymmetric** encryption (RSA, elliptic curve) uses a key pair:
      what the public key encrypts only the private key can decrypt. It is slow, so it is used
      to exchange symmetric keys and to sign. **Hashing** (SHA-256) is one-way: the same input
      always gives the same fixed-length digest, and any change gives a completely different one.
      Passwords should be stored with a **salted**, deliberately slow hash (bcrypt, PBKDF2,
      Argon2), which makes precomputed rainbow tables useless.

      A **digital signature** is a hash of the message signed with the sender's private key;
      anyone can verify it with the public key. A **certificate** binds a public key to an
      identity and is signed by a **Certificate Authority (CA)**. Your browser trusts a site
      because the chain leads from the site's certificate through intermediates to a **root CA**
      in its trust store. Certificates are revoked through **CRLs** or **OCSP**; **OCSP
      stapling** lets the server deliver the status itself.

      Other terms to know: **key escrow** (a third party holds keys for recovery), **HSM** and
      **TPM** (hardware that protects keys), **secure enclave**, **key stretching**,
      **obfuscation** techniques such as steganography, tokenization and data masking, and
      **blockchain** as an append-only ledger. **Wildcard** certificates cover all subdomains,
      and **self-signed** certificates are not trusted by default.
    examples:
      - title: Hashes reveal any change
        body: |
          $ echo "pay 100" | sha256sum
          5c1e...  -
          $ echo "pay 900" | sha256sum
          a8f4...  -
          One character changed, the digest is completely different.
      - title: Inspecting a certificate chain
        body: |
          $ openssl s_client -connect example.com:443 -showcerts </dev/null
          depth=2 ... CN = DigiCert Global Root G2
          depth=1 ... CN = DigiCert Global G2 TLS RSA SHA256 2020 CA1
          depth=0 ... CN = www.example.org
    exercise:
      title: Hash, encrypt, sign and verify
      environment: Linux VM or WSL with OpenSSL (installed by default on Ubuntu)
      tools: [openssl, sha256sum]
      steps:
        - Create a file, record its SHA-256 with `sha256sum`, change one character, hash it again and compare.
        - Encrypt the file with `openssl enc -aes-256-cbc -pbkdf2 -salt -in notes.txt -out notes.enc`, then decrypt it and confirm the hash matches the original.
        - Generate an RSA key pair with `openssl genpkey -algorithm RSA -out key.pem` and extract the public key with `openssl pkey -in key.pem -pubout -out pub.pem`.
        - Sign the file with `openssl dgst -sha256 -sign key.pem -out notes.sig notes.txt` and verify it with `openssl dgst -sha256 -verify pub.pem -signature notes.sig notes.txt`.
        - Change the file and run the verification again; record the result.
        - Inspect a real certificate with `openssl s_client -connect example.com:443 -showcerts` and record the issuer, validity dates and chain depth.
        - Create a self-signed certificate with `openssl req -x509 -newkey rsa:2048 -nodes -keyout lab.key -out lab.crt -days 30 -subj "/CN=lab.local"` and explain why a browser would not trust it.
      deliverable: A short report with your hashes, the verification results before and after the change, and the certificate chain you inspected.
    expected_outcome: >
      You can choose the right cryptographic tool for confidentiality, integrity or
      non-repudiation and verify certificates and signatures yourself.
    quiz:
      - prompt: Which provides integrity but not confidentiality?
        options: [AES encryption, SHA-256 hashing, RSA encryption, A VPN tunnel]
        answer: 1
        explanation: A hash proves data has not changed but does not hide it.
      - prompt: To create a digital signature, the sender uses
        options: [The recipient's public key, The sender's private key, A shared symmetric key, The CA's public key]
        answer: 1
        explanation: Signing uses the sender's private key; anyone verifies with the sender's public key.
      - prompt: Why is AES used for bulk data instead of RSA?
        options:
          - AES is asymmetric
          - Symmetric encryption is much faster
          - RSA cannot encrypt files
          - AES does not need a key
        answer: 1
        explanation: Asymmetric algorithms are slow, so they protect a symmetric key that encrypts the data.
      - prompt: Adding a random salt to password hashes defeats
        options: [Brute force entirely, Precomputed rainbow tables, Phishing, Keyloggers]
        answer: 1
        explanation: Salts make each hash unique, so precomputed tables do not match.
      - prompt: Which lets a web server provide certificate revocation status during the TLS handshake?
        options: [CRL, OCSP stapling, Key escrow, Certificate pinning]
        answer: 1
        explanation: With OCSP stapling the server attaches a signed, recent OCSP response.

  - slug: sec-threat-actors-vulns
    title: Threat Actors and Vulnerability Research
    order: 3
    difficulty: beginner
    summary: Profile threat actors and research, score and remediate real published vulnerabilities.
    theory_minutes: 12
    lab_minutes: 50
    objectives: ["secplus:2.1", "secplus:2.3", "cysa:2.4"]
    learning_objectives:
      - Compare threat actors by sophistication, resources and motivation
      - Name the common vulnerability classes and the control that mitigates each
      - Research a CVE in public databases and turn it into a remediation recommendation
    theory: |
      **Threat actors** differ in resources, sophistication and motive. **Nation-state** groups
      are well funded and patient, seeking espionage or disruption. **Organised crime** wants
      money, most often through ransomware and fraud. **Hacktivists** want attention for a cause.
      **Insider threats** already have access, whether malicious or careless. **Unskilled
      attackers** use tools others wrote. **Shadow IT**, systems staff deploy without approval, is
      treated as a threat source because nobody secures it. Motivations to know include data
      exfiltration, financial gain, espionage, disruption, revenge and ideology.

      **Vulnerability classes** describe *why* a system is weak. **Injection** flaws happen
      when input is treated as code, and are prevented by parameterised queries and input
      validation. **Cross-site scripting** lets input run in another user's browser, prevented
      by output encoding. **Memory** flaws such as buffer overflows are mitigated by safe
      languages, ASLR and DEP. **Race conditions** (time-of-check to time-of-use) need atomic
      operations. **Misconfiguration**, default credentials and missing patches are the most
      common real-world cause. **Zero-days** have no patch yet, so you rely on compensating
      controls. **Supply chain** weaknesses come from vendors and dependencies.

      Every published vulnerability gets a **CVE** identifier. **NVD** adds a **CVSS** score
      (0-10) describing severity, and **CISA's Known Exploited Vulnerabilities (KEV)** catalog
      lists the ones attackers actually use, which should be patched first.
    examples:
      - title: Matching a weakness to its fix
        body: |
          Finding: login form builds SQL with string concatenation
          Class:   Injection (CWE-89)
          Fix:     parameterised queries; least-privilege database account; WAF as compensating control
      - title: Reading a CVSS vector
        body: |
          CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H  -> 9.8 Critical
          Network reachable, low complexity, no privileges, no user interaction:
          anyone on the internet can exploit it. Patch immediately.
    exercise:
      title: Profile an actor and triage three real CVEs
      environment: A web browser and a spreadsheet; no lab VM needed
      tools: [MITRE ATT&CK Groups, NVD, CISA KEV catalog, FIRST CVSS calculator]
      steps:
        - On attack.mitre.org open Groups, choose one financially motivated group and one state-sponsored group, and record each one's motive, typical targets and three techniques.
        - Classify both groups using the Security+ actor types and write one sentence on the controls that would most disrupt each.
        - Open CISA's KEV catalog and pick three entries for products you know (for example a VPN appliance, a browser and a mail server).
        - Look up each CVE on nvd.nist.gov and record the CVSS score, the vector string and the CWE weakness class.
        - Paste each vector into the FIRST CVSS calculator and explain in your own words what each metric means for that CVE.
        - Map each weakness to its vulnerability class from the theory and to a primary fix and a compensating control.
        - Rank the three CVEs for patching and justify the order using KEV status, CVSS and exposure.
      deliverable: An actor profile table and a three-row vulnerability triage table with class, score, fix, compensating control and patch priority.
    expected_outcome: >
      You can explain who is likely to attack an organisation and why, and turn a CVE into a
      prioritised, justified remediation recommendation.
    quiz:
      - prompt: Which threat actor is most associated with ransomware for profit?
        options: [Hacktivist, Organised crime, Nation-state, Shadow IT]
        answer: 1
        explanation: Organised criminal groups are financially motivated, and ransomware is their main business model.
      - prompt: Which control prevents SQL injection at its source?
        options: [Antivirus, Parameterised queries, Full-disk encryption, Longer passwords]
        answer: 1
        explanation: Parameterised queries keep user input as data so it is never executed as SQL.
      - prompt: A vulnerability with no available patch is called a
        options: [Zero-day, Race condition, Misconfiguration, Legacy system]
        answer: 0
        explanation: Defenders have had zero days to fix it, so compensating controls are needed.
      - prompt: Why patch entries in CISA's KEV catalog first?
        options:
          - They always have a CVSS of 10
          - They are confirmed to be exploited in the wild
          - They only affect government systems
          - They cannot be detected
        answer: 1
        explanation: KEV lists vulnerabilities attackers are actively using, which makes them the most urgent.
      - prompt: An employee runs an unapproved cloud file-sharing service for the team. This is
        options: [An insider attack, Shadow IT, A zero-day, Hacktivism]
        answer: 1
        explanation: Systems deployed without IT approval are shadow IT and go unmanaged and unsecured.

  - slug: sec-phishing-social-engineering
    title: Analysing Phishing and Social Engineering
    order: 4
    difficulty: beginner
    summary: Pull apart a phishing email from its headers, links and pretext.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.2", "secplus:5.6", "cysa:1.2"]
    learning_objectives:
      - Describe the common social-engineering techniques and why they work
      - Read an email's headers and authentication results to judge if it is spoofed
      - Safely inspect links and attachments and extract indicators from a phish
    theory: |
      **Social engineering** attacks the person, not the software. The most common form a SOC sees
      is **phishing**, an email that pushes the reader to click a link, open an attachment or hand
      over credentials. It works by borrowing **authority** (a message that looks like it is from
      IT or a bank), creating **urgency** (an account will be closed), and offering a plausible
      **pretext**. Variants include **spear phishing** aimed at one person, **smishing** over SMS
      and **vishing** over the phone.

      The header tells you a lot. The **Received** chain shows the servers the mail passed through,
      and the authentication results record whether **SPF**, **DKIM** and **DMARC** passed. SPF
      checks the sending server is allowed for the domain, DKIM checks a signature over the
      message, and DMARC ties the visible From address to those results. A friendly display name
      hiding a mismatched address, or a Reply-To on a different domain, are classic tells.

      Links and attachments are where the payload lives. Hover to see the real destination, watch
      for lookalike domains and URL shorteners, and treat an unexpected document that asks you to
      enable macros as hostile. Your output from triaging a phish is a set of **indicators**, the
      sender, the URLs and any attachment hashes, that feed blocking and a search for anyone else
      who received it.
    examples:
      - title: A spoofed sender giveaway
        body: |
          From      IT Support <helpdesk@it-support-portal.co>
          Reply-To  harvest@mail.ru
          DMARC     fail
          A display name of IT Support over an unrelated domain, a foreign Reply-To, and a failed DMARC.
      - title: A lookalike link under a safe-looking label
        body: |
          Visible text   https://login.microsoft.com
          Real href      https://login.microsoft.com.secure-check.ru/auth
          The real domain is secure-check.ru, not microsoft.com.
    exercise:
      title: Triage a phishing sample
      environment: An isolated analysis VM; never click live links or open attachments on a work machine
      tools: [A raw email (.eml) sample, a text editor, a URL defang tool, VirusTotal (hash and URL search only)]
      steps:
        - Open a phishing .eml sample in a text editor in your analysis VM.
        - Read the Received chain and note the originating server and the From, Reply-To and Return-Path.
        - Find the authentication results and record whether SPF, DKIM and DMARC passed or failed.
        - List every URL in the body, defang them, and compare the visible text against the real destination.
        - Identify any attachment, record its name and hash, and search the hash on VirusTotal without uploading the file.
        - Decide whether the message is phishing and write the one or two tells that convinced you.
        - Produce an indicator list (sender, URLs, attachment hash) you would hand to blocking and a mailbox search.
      deliverable: A short triage note with the verdict, the deciding tells, and an indicator list for blocking.
    expected_outcome: >
      Given an unfamiliar email you can judge whether it is phishing from its headers
      and links and hand off a usable indicator list, without exposing yourself to the payload.
    quiz:
      - prompt: Which trio of checks helps show whether an email's sender is spoofed?
        options:
          - "TCP, UDP and ICMP"
          - "SPF, DKIM and DMARC"
          - "RAID 0, 1 and 5"
          - "GET, POST and PUT"
        answer: 1
        explanation: SPF, DKIM and DMARC together verify the sending server, a message signature and the From alignment.
      - prompt: A message's display name reads IT Support but the address is on an unrelated domain. This is
        options: [Proof the mail is safe, A common spoofing tell worth investigating, A DKIM signature, A normal mailing list]
        answer: 1
        explanation: A trusted-looking display name over a mismatched address is a classic phishing giveaway.
      - prompt: Why search an attachment's hash on VirusTotal rather than uploading the file?
        options:
          - Hashes are easier to type
          - Uploading may share a targeted sample publicly and tip off the attacker
          - VirusTotal rejects files
          - Hashes identify the victim
        answer: 1
        explanation: A hash lookup reveals nothing new, while an upload can expose a sensitive or targeted sample.
      - prompt: The safest way to check where a link really goes is to
        options: [Click it and see, Hover or inspect the href without clicking, Forward it to a colleague, Reply and ask]
        answer: 1
        explanation: Inspecting the href shows the true destination without executing anything.

  - slug: sec-identity-access-management
    title: Identity and Access Management Fundamentals
    order: 5
    difficulty: beginner
    summary: Understand authentication, authorisation, MFA, SSO and the account lifecycle.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:2", "secplus:1.2"]
    learning_objectives:
      - Distinguish authentication, authorisation and accounting
      - Explain how MFA, SSO and least privilege strengthen access control
      - Describe the account lifecycle and the identity attacks a SOC watches for
    theory: |
      Identity and access management decides who you are and what you may do, and in a modern
      estate it is the real perimeter. Three ideas sit underneath it, together called **AAA**:
      **authentication** proves identity, **authorisation** grants the permissions that identity
      should have, and **accounting** records what was done. Keeping the three straight matters,
      because most access failures are really authorisation failures, not authentication ones.

      Stronger access rests on a few mechanisms. **Multi-factor authentication (MFA)** combines
      factors from different categories, something you know, something you have and something you
      are, so a stolen password alone is not enough. **Single sign-on (SSO)** lets one login reach
      many applications through a trusted identity provider using protocols like SAML and OIDC,
      which is convenient but makes that provider a high-value target. **Least privilege** and
      **role-based access control** keep each account's permissions to the minimum its job needs.

      The **account lifecycle** is where gaps appear. Accounts are provisioned on joining, changed
      when roles change, and must be **deprovisioned promptly** when someone leaves, or you get
      orphaned accounts and privilege creep. Privileged accounts need extra care through
      just-in-time elevation and privileged access management. For a SOC the IAM signals are
      specific: MFA fatigue or push-bombing, impossible-travel logins, MFA suddenly disabled, and
      new grants of privileged access.
    examples:
      - title: Authentication versus authorisation
        body: |
          Authentication   the user proves they are jsmith with a password and MFA
          Authorisation    jsmith is allowed to read the finance folder but not the admin console
          A valid login still should not reach actions the role does not need.
      - title: An IAM signal worth an alert
        body: |
          event   MFA method removed from an admin account, then a login from a new country
          Disabling MFA just before an unusual login is a classic account-takeover pattern.
    exercise:
      title: Review an identity setup against IAM principles
      environment: A sample directory or IAM export with users, roles and sign-in logs
      tools: [A sample user and role list, sample sign-in logs, a notes file]
      steps:
        - From the sample, list the accounts and the roles or permissions each one holds.
        - Flag any account whose permissions look broader than its job would need.
        - Check which accounts have MFA enabled and note any privileged account without it.
        - Look for accounts that should have been deprovisioned, such as ones with no recent activity.
        - In the sign-in logs, search for impossible travel, repeated MFA prompts or MFA being disabled.
        - Recommend one least-privilege change and one monitoring rule for privileged-access grants.
      deliverable: A short IAM review noting over-privileged and stale accounts, MFA gaps and one alerting rule for privileged changes.
    expected_outcome: >
      You can tell authentication from authorisation, explain how MFA, SSO and least
      privilege work, and spot the account-lifecycle gaps and identity attacks a SOC cares about.
    quiz:
      - prompt: Multi-factor authentication is strong because it combines
        options:
          - Two passwords
          - Factors from different categories such as something you know and something you have
          - Two usernames
          - A password typed twice
        answer: 1
        explanation: MFA requires factors of different kinds, so a stolen password alone is not enough to log in.
      - prompt: Authorisation (as opposed to authentication) decides
        options: [Who you are, What an identity is allowed to do, The network speed, The password length]
        answer: 1
        explanation: Authentication proves identity; authorisation grants what that identity may do.
      - prompt: Which account-lifecycle failure most often leaves a security gap?
        options:
          - Creating an account on day one
          - Failing to deprovision an account promptly when someone leaves
          - Enabling MFA
          - Assigning least privilege
        answer: 1
        explanation: Accounts that are not removed on departure become orphaned access an attacker can use.
      - prompt: An admin account's MFA being removed just before a login from a new country is
        options: [Routine maintenance, A classic account-takeover signal, A password reset, A normal SSO event]
        answer: 1
        explanation: Disabling MFA ahead of an unusual login is a common takeover pattern worth alerting on.

  - slug: sec-malware-types-behaviour
    title: Malware Types and How They Behave
    order: 6
    difficulty: beginner
    summary: Tell the main malware families apart by what they do, so you can read an alert and expect the right behaviour.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.1", "secplus:2.4", "cysa:1.2"]
    learning_objectives:
      - Name the main malware families and describe what each one does
      - Match observed behaviour (files, processes, network) to a likely malware type
      - Explain why fileless and living-off-the-land malware is harder to spot
    theory: |
      Malware is a broad word for software written to act against the owner's interest, and the
      families behave differently enough that naming the type tells you what to look for. A **virus**
      attaches to a file and spreads when that file runs; a **worm** spreads on its own across a
      network with no user action. A **trojan** pretends to be something useful to get itself run.
      **Ransomware** encrypts files and demands payment. **Spyware** and a **keylogger** quietly
      collect information, and a **rootkit** hides other malware from the system. A **bot** turns the
      host into one node an attacker controls remotely.

      For an analyst the value is matching **behaviour to type**. Rapid encryption of many files with
      a ransom note is ransomware; a process beaconing to the same external host on a timer looks
      like a bot or remote-access trojan calling home; a new program that spreads to peers over the
      network without anyone opening it behaves like a worm. You rarely name the exact strain from
      one alert, but the shape of the activity, what touched the disk, what ran, what talked to the
      network, points at a family and tells you what to check next.

      The hardest cases carry **no file to find**. **Fileless** malware runs in memory, and
      **living-off-the-land** attacks abuse tools already on the system, such as PowerShell or
      scripting engines, so there is no malicious binary on disk to scan. These defeat simple file-
      based antivirus and are caught by behaviour instead: a trusted tool doing something it never
      normally does. This is foundational knowledge the later hands-on lessons build on; here the aim
      is to recognise the families and their behaviour, not yet to write detections for them.
    examples:
      - title: Behaviour pointing at ransomware
        body: |
          thousands of files rewritten in minutes, new extension, a README demanding payment
          Fast mass-encryption plus a ransom note is ransomware, whatever the exact strain.
      - title: Living-off-the-land activity
        body: |
          powershell.exe launched by a Word document, downloading and running code in memory
          A trusted tool abused to run code with nothing written to disk is living-off-the-land.
    exercise:
      title: Classify malware behaviour from sample descriptions
      environment: A set of short written incident descriptions; no live malware
      tools: [A set of sample behaviour descriptions, a notes file]
      steps:
        - Write a one-line description of each main malware family in your own words.
        - For each sample description, name the most likely malware family and the evidence behind your choice.
        - Identify which sample is a worm and explain what separates it from a virus.
        - Identify any sample that is fileless or living-off-the-land and say why file scanning would miss it.
        - For one sample, list what you would check next (files, processes, network) to confirm the type.
        - Summarise which single behaviour was the strongest clue in each case.
      deliverable: A classification table mapping each sample to a malware family, the evidence, and the next check you would make.
    expected_outcome: >
      You can name the main malware families, match observed behaviour to a likely type, and explain
      why fileless and living-off-the-land malware evades simple file-based scanning.
    quiz:
      - prompt: What distinguishes a worm from a virus?
        options:
          - A worm spreads on its own across a network, while a virus needs an infected file to be run
          - A worm is always harmless
          - A virus only affects printers
          - There is no difference
        answer: 0
        explanation: A worm self-propagates with no user action; a virus spreads when someone runs the infected file.
      - prompt: Rapid encryption of many files followed by a ransom note is characteristic of
        options: [Spyware, Ransomware, A rootkit, A keylogger]
        answer: 1
        explanation: Mass file encryption plus a payment demand is the defining behaviour of ransomware.
      - prompt: Why is fileless or living-off-the-land malware hard to detect?
        options:
          - It is too large to run
          - It runs in memory or abuses trusted built-in tools, so there is no malicious file on disk to scan
          - It only runs on paper
          - It disables the network card
        answer: 1
        explanation: With no binary on disk, file-based antivirus has nothing to match; it must be caught by behaviour.
      - prompt: For an analyst, the main value of naming a malware family is that it
        options: [Changes the hostname, Tells you what behaviour to expect and what to check next, Deletes the alert, Encrypts the logs]
        answer: 1
        explanation: The family predicts the activity's shape, which guides what disk, process and network evidence to look for.
  - slug: sec-data-classification-protection
    title: Data Classification and Protection
    order: 7
    difficulty: beginner
    summary: Classify data by sensitivity and protect it across its states and lifecycle, so controls like encryption and loss prevention are applied where they actually matter.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.2", "secplus:4.6", "sc900:2"]
    learning_objectives:
      - Classify data by sensitivity and explain why classification drives controls
      - Describe protecting data at rest, in transit and in use
      - Explain how data loss prevention and lifecycle handling reduce exposure
    theory: |
      You cannot protect everything equally, so protection starts with knowing what you hold.
      **Data classification** sorts information by sensitivity, for example public, internal,
      confidential and restricted, and that label decides the controls. A restricted customer
      database earns encryption, strict access and monitoring; a public brochure needs none of it.
      Classification also depends on **data types** with legal weight, such as personal data (PII),
      health records (PHI) and cardholder data, each carrying its own handling rules.

      Data has to be protected in three **states**. **At rest** it is protected by storage or disk
      encryption and access control. **In transit** it is protected by TLS so it cannot be read or
      altered on the wire. **In use**, while an application is processing it, is the hardest, and is
      where techniques like tokenisation and careful memory handling apply. The right control for a
      piece of data depends on its classification and which state it is in, which is why the label
      has to travel with the data.

      Two practices keep classified data from leaking. **Data loss prevention** (DLP) inspects email,
      uploads and endpoints for sensitive content leaving where it should not, blocking or alerting
      on a confidential file sent to a personal address. And **lifecycle handling** governs data from
      creation through retention to secure disposal, because data kept past its purpose is pure risk
      and sanitised media cannot leak. Over-classifying everything is its own failure, since if all
      data is restricted, people route around the controls, so classification has to be realistic to
      be followed.
    examples:
      - title: Classification drives the control
        body: |
          Public      marketing PDF        -> no encryption needed
          Internal    org chart            -> access control, no public share
          Restricted  customer PII export  -> encryption + DLP + access logging
      - title: One record, three states
        body: |
          At rest     customer row in an encrypted database
          In transit  same row returned over TLS to the app
          In use      app holds it in memory -> tokenise/mask before display or logs
    exercise:
      title: Classify a sample data set and map its protections
      environment: A sample set of files or records of mixed sensitivity (provided or invented) and a spreadsheet or document
      tools: [A sample data set, a spreadsheet or document, a reference classification scheme]
      steps:
        - Define a simple classification scheme (for example public, internal, confidential, restricted) with one sentence on what belongs in each.
        - Classify each sample file or record and note any that contain regulated data types such as PII or payment data.
        - For each classification, list the control you would apply at rest, in transit and in use.
        - Identify one piece of data that is over-classified or under-classified and correct it, explaining the impact of getting it wrong.
        - Write one DLP rule in plain language that would stop a restricted item leaving by email, and say what it should do on a match.
        - Define a retention and disposal rule for one data type and explain why keeping it longer increases risk.
      deliverable: A classification table for the sample data with per-state controls, one DLP rule, and a retention and disposal rule with its rationale.
    expected_outcome: >
      You can classify data by sensitivity, apply the right protection for its state, and use DLP and
      lifecycle handling to keep sensitive data from leaking, without over-classifying everything into
      unusability.
    quiz:
      - prompt: Why classify data before choosing controls?
        options:
          - To make storage cheaper
          - Because the sensitivity label decides which controls (encryption, access, monitoring) are warranted
          - To delete all data
          - Because every file needs the same protection
        answer: 1
        explanation: Classification matches the strength of controls to the sensitivity of the data instead of treating everything alike.
      - prompt: Which are the three states data must be protected in?
        options:
          - Hot, warm and cold
          - At rest, in transit and in use
          - Open, closed and archived
          - Local, remote and backup
        answer: 1
        explanation: Data at rest, in transit and in use each need different protections such as storage encryption, TLS and tokenisation.
      - prompt: Data loss prevention (DLP) primarily
        options:
          - Encrypts disks
          - Detects or blocks sensitive data leaving where it should not
          - Backs up data
          - Classifies CPUs
        answer: 1
        explanation: DLP inspects content in email, uploads and endpoints to stop sensitive data exfiltration.
      - prompt: Keeping data long past its purpose is a problem because
        options: [It speeds up queries, It is pure risk since data that no longer needs to exist can still leak, It improves classification, It is required by all laws]
        answer: 1
        explanation: Retained-but-unneeded data is exposure with no benefit, which is why lifecycle disposal matters.
  - slug: sec-physical-environmental
    title: Physical and Environmental Security
    order: 8
    difficulty: beginner
    summary: Cover the physical and environmental controls that protect systems and data, because an attacker with physical access or a failed facility can bypass every digital defence.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.2", "secplus:2.1", "sc900:1"]
    learning_objectives:
      - Explain why physical access can defeat digital controls
      - Describe layered physical controls and environmental protections
      - Identify physical and social routes an attacker uses to reach systems
    theory: |
      Security that stops at the network ignores the oldest attack of all: walking in. **Physical
      access** often defeats digital controls outright, an attacker at the keyboard can boot from USB,
      steal a drive, plug in a rogue device, or read a password on a sticky note. So physical security
      is a foundation the digital controls sit on, not an afterthought, and it follows the same
      **defence-in-depth** idea: layers that each slow an intruder and raise the chance of detection.

      Those layers run from the perimeter inward. **Deterrents** (fencing, lighting, signage) discourage
      casual intrusion; **access controls** (badges, locks, mantraps, biometric readers) decide who gets
      in; **surveillance** (cameras, guards, alarms) detects and records; and **zoning** keeps the most
      sensitive areas, a data centre or wiring closet, behind the strongest controls. A recurring weakness
      is **tailgating**, following an authorised person through a door, which badge systems alone do not
      stop, which is why mantraps and awareness matter.

      **Environmental** controls keep the facility itself from failing the systems. Data centres manage
      **power** (UPS and generators against outages), **cooling** (heat is the enemy of hardware),
      **fire suppression** suited to electronics, and **humidity**. The same thinking covers the
      disposal end: **media sanitisation** and secure destruction so a discarded disk does not leak data.
      Physical and social routes overlap, an attacker may impersonate a delivery driver or contractor to
      get inside, so physical security and security awareness reinforce each other. The lesson is that a
      strong firewall means little if someone can carry the server out of the building.
    examples:
      - title: Layered physical controls
        body: |
          Perimeter   fence + lighting            (deter)
          Entry       badge + mantrap             (prevent tailgating)
          Interior    camera + alarmed data hall  (detect + record)
          Each layer slows the intruder and adds a chance to catch them.
      - title: Physical access beating digital controls
        body: |
          Attacker at the device -> boot from USB / pull the drive / plant a keylogger
          Full-disk encryption + locked BIOS + port control raise that bar
          No network control stops someone already at the keyboard.
    exercise:
      title: Assess the physical and environmental security of a space
      environment: An office, home office or described facility, plus a notes template
      tools: [A space to assess (or a floor plan/description), a notes file, a reference control list]
      steps:
        - Walk (or map) the space from the perimeter inward and list the physical controls at each layer (deter, prevent, detect).
        - Identify the most sensitive area (where systems or data live) and judge whether its controls match its sensitivity.
        - Find one tailgating or social route an attacker could use to get past the entry controls.
        - Note the environmental protections present (power backup, cooling, fire, humidity) and one that is missing or weak.
        - Check how media and old equipment are disposed of and whether data could leak that way.
        - Recommend two improvements, one access-control and one environmental, with the risk each addresses.
      deliverable: A layered physical-security assessment of the space with one tailgating route, the environmental gaps, and two prioritised improvements with their risks.
    expected_outcome: >
      You can explain why physical access undermines digital security, assess layered physical and
      environmental controls, and spot the physical and social routes an attacker would use to reach
      systems and data.
    quiz:
      - prompt: Why is physical security foundational to digital security?
        options:
          - It is cheaper
          - An attacker with physical access can often bypass digital controls entirely
          - It replaces encryption
          - It only matters for data centres
        answer: 1
        explanation: Someone at the hardware can boot from USB, steal drives or plant devices, defeating network controls.
      - prompt: Tailgating is
        options:
          - A network attack
          - Following an authorised person through a controlled door
          - A type of firewall
          - A backup method
        answer: 1
        explanation: Tailgating slips past badge controls by following someone in, which mantraps and awareness address.
      - prompt: Which is an environmental control for a data centre?
        options: [A firewall rule, Uninterruptible power and cooling, A password policy, An antivirus scan]
        answer: 1
        explanation: Power backup, cooling, fire suppression and humidity control keep the facility from failing the hardware.
      - prompt: Secure media sanitisation matters because
        options:
          - It speeds up disks
          - A discarded or reused drive can leak data if not properly destroyed or wiped
          - It encrypts the network
          - It is only for paper
        answer: 1
        explanation: Data persists on media, so secure disposal prevents leakage from retired equipment.
  - slug: sec-authentication-passwordless
    title: Authentication Factors and Passwordless
    order: 9
    difficulty: beginner
    summary: Understand authentication factors, why passwords fail, and how MFA and passwordless methods such as FIDO2 raise the bar against the most common attacks.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:3", "secplus:2.4"]
    learning_objectives:
      - Distinguish the authentication factors and what each proves
      - Explain why passwords fail and how MFA mitigates it
      - Describe passwordless and phishing-resistant authentication such as FIDO2
    theory: |
      Authentication answers "are you who you claim to be", and it does so with **factors**: something you
      **know** (a password or PIN), something you **have** (a phone, token or security key), and something
      you **are** (a fingerprint or face). Strong authentication combines factors from different categories,
      because each covers the others' weakness, a stolen password is useless without the physical key, and
      a stolen phone is useless without the PIN. Using two of the *same* category (a password and a security
      question, both "know") is not true multi-factor.

      Passwords alone fail constantly, and understanding why motivates everything else. They are reused
      across sites, so one breach unlocks many accounts (**credential stuffing**); they are phished; and
      weak ones are guessed or cracked. **Multi-factor authentication** (MFA) is the single highest-impact
      control against account takeover because it breaks the attacker's usual path: knowing the password is
      no longer enough. But not all MFA is equal, SMS codes can be intercepted or SIM-swapped, and
      push-notification MFA is vulnerable to **MFA fatigue**, where an attacker spams approvals until a tired
      user taps yes.

      The direction of travel is **passwordless** and **phishing-resistant** authentication. **FIDO2** and
      passkeys use a cryptographic key pair bound to the device and the specific site, so there is no shared
      secret to phish and the credential simply will not work on a look-alike domain, defeating the
      phishing that beats even code-based MFA. For a learner this is the practical takeaway: authentication
      strength is a ladder, from a lone password at the bottom, through code and push MFA, up to
      phishing-resistant passkeys, and moving up the ladder is one of the most effective security
      investments an organisation can make.
    examples:
      - title: True multi-factor versus not
        body: |
          Password + security question  -> both "know"  -> NOT real MFA
          Password + phone push         -> know + have   -> MFA
          Passkey (device + biometric)  -> have + are    -> phishing-resistant
      - title: Why FIDO2 resists phishing
        body: |
          Code MFA on fake-bank.com: user types the code -> attacker relays it -> in
          Passkey on fake-bank.com:  key is bound to the REAL domain -> simply won't sign
          No shared secret to phish; the credential refuses the wrong site.
    exercise:
      title: Assess and strengthen authentication for a set of accounts
      environment: Your own accounts or a described scenario, plus a notes template
      tools: [A list of accounts/services, a notes file, a reference on MFA types]
      steps:
        - List several accounts and identify which authentication factors each currently uses.
        - For one password-only account, explain the specific attacks it is exposed to.
        - Identify an account using two factors of the same category and explain why that is not true MFA.
        - Rank the MFA methods in use (SMS, code app, push, passkey) from weakest to strongest and justify the order.
        - Pick one account and describe the move up the ladder you would make and the attack it defeats.
        - Explain how a passkey would behave if the user were lured to a look-alike login page.
      deliverable: An authentication assessment ranking the methods in use, one true-MFA correction, and one concrete upgrade with the attack it defeats.
    expected_outcome: >
      You can distinguish authentication factors, explain why passwords fail and how MFA mitigates it, and
      describe how passwordless, phishing-resistant methods like FIDO2 defeat the attacks that beat
      code-based MFA.
    quiz:
      - prompt: Which pair is true multi-factor authentication?
        options:
          - A password and a security question
          - A password and a phone-based security key
          - Two different passwords
          - A PIN and a memorable word
        answer: 1
        explanation: True MFA combines different categories; a password (know) plus a key (have) qualifies.
      - prompt: MFA is the highest-impact control against account takeover because it
        options:
          - Makes passwords longer
          - Means knowing the password alone is no longer enough to log in
          - Encrypts the network
          - Removes all logins
        answer: 1
        explanation: MFA breaks the attacker's usual path by requiring a second factor beyond the password.
      - prompt: MFA fatigue attacks target
        options: [SMS codes only, Push-notification MFA, by spamming approvals until a user taps yes, Passkeys, Hardware tokens]
        answer: 1
        explanation: Repeated push prompts can wear a user down into approving a fraudulent login.
      - prompt: FIDO2/passkeys resist phishing because the credential is
        options:
          - A longer password
          - A key pair bound to the real site, so it will not authenticate on a look-alike domain
          - Sent by SMS
          - Stored in email
        answer: 1
        explanation: With no shared secret and binding to the legitimate domain, a phishing site cannot use the passkey.
  - slug: sec-security-awareness-training
    title: Security Awareness and the Human Firewall
    order: 10
    difficulty: beginner
    summary: Understand why people are both the biggest attack surface and a powerful line of defence, and how awareness programs, phishing simulations and a reporting culture turn users into sensors.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.6", "secplus:2.2", "sc900:1"]
    learning_objectives:
      - Explain why the human layer is central to security outcomes
      - Describe what an effective security-awareness program contains
      - Build a reporting culture that turns users into a detection source
    theory: |
      Most breaches involve a person, a clicked link, a reused password, a wire sent on a convincing request,
      because attackers target people as the path of least resistance. That makes the **human layer** both the
      largest attack surface and, done right, a powerful line of defence. Technical controls stop a great deal,
      but they cannot catch everything, and the user is often the one who sees the suspicious email or the odd
      request first. Security awareness is the discipline of turning that human layer from a liability into a
      sensor, and it is a recognised security control in its own right, not a poster on the wall.

      An effective **awareness program** is specific and ongoing, not an annual slideshow. It teaches the
      threats people actually face, phishing and its variants, social engineering, safe handling of data,
      password and MFA hygiene, in short, relevant pieces rather than a once-a-year dump, and it is tailored to
      roles (finance staff face invoice fraud; developers face credential leaks). **Phishing simulations** are
      a core tool: sending realistic but safe test phishing to measure who clicks and to give immediate,
      non-punitive teaching when they do. The measure of success is behaviour change, fewer clicks, more
      reports, over time, which is why programs track metrics and repeat.

      The highest-value outcome is a **reporting culture**. A user who spots a phishing email and reports it
      gives the SOC an early warning that may protect everyone else, so the goal is to make reporting easy (a
      one-click button) and safe (never punishing someone who reports, even if they also clicked). A blame-free
      culture is essential: if people fear punishment they hide mistakes, and a hidden click is far more
      dangerous than a reported one. The lesson for an analyst is that users are part of the detection
      pipeline, every reported phish is a lead, and the organisations that defend best are the ones where
      people feel safe raising their hand the moment something looks wrong.
    examples:
      - title: The human layer, both ways
        body: |
          Liability: user clicks a phishing link -> foothold
          Sensor:    user reports a phishing email -> early warning for everyone
          Awareness turns the same person from the first into the second.
      - title: Blame-free reporting
        body: |
          User clicks AND reports it -> thank them, investigate fast, contain
          Punish the click -> next time they hide it -> far more dangerous
          Easy + safe reporting is the whole point.
    exercise:
      title: Design a security-awareness program and reporting flow
      environment: A described organisation (or your own context) and a document or template
      tools: [A document or template, a reference on common threats, a notes file]
      steps:
        - Explain why the human layer is both the biggest attack surface and a potential line of defence.
        - Outline an ongoing awareness program, the topics, the cadence, and how it is tailored to at least two roles.
        - Design a phishing-simulation approach and state what you would measure and how you would teach non-punitively.
        - Define the metrics that show the program is working (click rate, report rate over time).
        - Design an easy, safe reporting flow that feeds reported phishing to the SOC as leads.
        - Explain why a blame-free culture matters and what happens to detection if people fear punishment.
      deliverable: An awareness-program design with role-tailored topics and cadence, a phishing-simulation and metrics plan, a reporting flow into the SOC, and the rationale for a blame-free culture.
    expected_outcome: >
      You can explain why the human layer is central to security, design an ongoing awareness program with
      simulations and metrics, and build a blame-free reporting culture that turns users into an early
      detection source.
    quiz:
      - prompt: Why is the human layer central to security outcomes?
        options:
          - People never make mistakes
          - Attackers target people as the path of least resistance, and users often see threats first
          - Humans are irrelevant to breaches
          - Only technology matters
        answer: 1
        explanation: Most breaches involve a person, so the human layer is both the main target and a key defence.
      - prompt: An effective awareness program is
        options:
          - A single annual slideshow
          - Ongoing, relevant and tailored to the threats different roles actually face
          - Only for executives
          - A one-time poster
        answer: 1
        explanation: Awareness works when it is continuous, relevant and role-specific, not a yearly formality.
      - prompt: A blame-free reporting culture matters because
        options:
          - It avoids all training
          - If people fear punishment they hide mistakes, and a hidden click is more dangerous than a reported one
          - It punishes clicks
          - It removes the SOC
        answer: 1
        explanation: Safe reporting surfaces incidents early; fear drives them underground where they do more harm.
      - prompt: A reported phishing email is valuable to the SOC because it
        options:
          - Wastes time
          - Is an early warning that may protect everyone else who received it
          - Must be ignored
          - Cannot be investigated
        answer: 1
        explanation: User reports act as early detection, letting the SOC contain a campaign before it spreads.
  - slug: sec-authorization-models
    title: Authorization Models and Least Privilege
    order: 11
    difficulty: beginner
    summary: Understand how systems decide what an authenticated user may do, discretionary, role-based and attribute-based access control, and why least privilege underpins them all.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc900:3", "secplus:3.1"]
    learning_objectives:
      - Distinguish authentication from authorization
      - Compare discretionary, role-based and attribute-based access control
      - Apply least privilege and separation of duties to a real scenario
    theory: |
      Authentication proves who you are; **authorization** decides what you are allowed to do once you are in,
      and keeping the two ideas separate is the starting point. A system can know perfectly well who a user is
      and still need a clear, consistent way to decide whether they may read this file, approve that payment,
      or change a setting. Authorization models are the different schemes for making that decision at scale,
      and choosing and configuring one well is central to limiting what a compromised or malicious account can
      do.

      Three models are common. **Discretionary access control** (DAC) lets the owner of a resource decide who
      may access it, flexible but inconsistent, since control is spread across many individual owners.
      **Role-based access control** (RBAC) assigns permissions to **roles** (such as "finance clerk" or
      "server administrator") and assigns users to roles, so access is granted by job function rather than
      per person, which scales well and is the workhorse of most organisations. **Attribute-based access
      control** (ABAC) decides dynamically from attributes of the user, resource and context (department, data
      classification, time of day, device), which is the most granular and powerful but more complex to manage.
      Most real environments use RBAC as the backbone with some ABAC for fine-grained cases.

      Underpinning every model are two principles. **Least privilege** means granting each user, role or
      process only the access it genuinely needs and no more, so that a compromised account or an insider can
      reach only a limited blast radius. **Separation of duties** splits a sensitive action across more than
      one person so no single account can complete it alone (the person who requests a payment cannot also
      approve it), which limits both fraud and the damage of one stolen credential. Over time, access tends to
      accumulate, people change roles but keep old permissions, so **access reviews** periodically prune this
      "privilege creep". For the analyst, the practical lesson is that well-designed authorization is what
      makes a stolen credential a contained problem rather than a catastrophe, and over-permissioned accounts
      are a risk to watch for.
    examples:
      - title: Three models at a glance
        body: |
          DAC   owner decides (flexible, inconsistent)
          RBAC  permissions -> roles -> users (scales by job function)
          ABAC  decide from attributes (user/resource/context) (granular, complex)
          Most orgs: RBAC backbone + some ABAC.
      - title: Separation of duties
        body: |
          requester of a payment  != approver of a payment
          one stolen account cannot complete the action alone
          limits both fraud and the blast radius of a compromise.
    exercise:
      title: Design authorization for a scenario
      environment: A described organisation with several roles and sensitive actions, plus a document
      tools: [A document or template, a scenario with roles and resources, a notes file]
      steps:
        - Explain the difference between authentication and authorization with an example.
        - For the scenario, choose an authorization model (or mix) and justify it against the organisation's needs.
        - Define two or three roles with the least-privilege permissions each genuinely needs.
        - Identify one sensitive action and apply separation of duties so no single account can complete it alone.
        - Describe how an attribute (such as data classification or device) could refine access with ABAC.
        - Explain how privilege creep happens and how an access review would catch it.
      deliverable: An authorization design naming the model, least-privilege roles, a separation-of-duties control on a sensitive action, one ABAC refinement, and an access-review approach to privilege creep.
    expected_outcome: >
      You can distinguish authentication from authorization, compare DAC, RBAC and ABAC, and apply least
      privilege and separation of duties so that a compromised account has a limited blast radius.
    quiz:
      - prompt: Authorization (as opposed to authentication) decides
        options:
          - Who a user claims to be
          - What an authenticated user is allowed to do
          - How fast the network is
          - Which password to use
        answer: 1
        explanation: Authentication proves identity; authorization governs what that identity may do.
      - prompt: Role-based access control grants permissions by
        options:
          - Each resource owner's discretion
          - Job function, assigning permissions to roles and users to roles
          - Random assignment
          - Time of day only
        answer: 1
        explanation: RBAC ties permissions to roles and users to those roles, scaling by job function.
      - prompt: Least privilege means
        options:
          - Giving everyone admin to be safe
          - Granting only the access genuinely needed, so a compromise has a limited blast radius
          - Removing all access
          - Sharing one account
        answer: 1
        explanation: Minimal necessary access limits what any compromised or malicious account can reach.
      - prompt: Separation of duties limits fraud and credential misuse by
        options:
          - Using longer passwords
          - Splitting a sensitive action so no single account can complete it alone
          - Disabling logging
          - Granting more roles
        answer: 1
        explanation: Requiring more than one party for a sensitive action stops a single account from completing it.
  - slug: sec-control-types
    title: Security Control Types and Functions
    order: 12
    difficulty: beginner
    summary: Classify security controls by how they are implemented (technical, administrative, physical) and what they do (preventive, detective, corrective and more), a vocabulary that underpins how defences are designed and assessed.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:1.1", "secplus:5.1", "sc900:1"]
    learning_objectives:
      - Classify controls by category (technical, administrative, physical)
      - Classify controls by function (preventive, detective, corrective, and others)
      - Use the taxonomy to find gaps and design balanced defences
    theory: |
      Security professionals need a shared vocabulary for the defences they deploy, and that vocabulary is the
      classification of **security controls** along two axes: how a control is implemented and what it does.
      Getting fluent in it matters because it is how defences are designed, discussed and assessed, and it is
      how you spot that a system is strong in one dimension and dangerously weak in another.

      The first axis is **category**, how the control is implemented. **Technical** (or logical) controls are
      enforced by technology: firewalls, encryption, access control lists, antivirus. **Administrative** (or
      managerial) controls are policies, procedures and processes: security policies, training, background
      checks, change management. **Physical** controls protect the tangible world: locks, fences, guards,
      cameras. A sound program uses all three, because a brilliant technical control is undone by an
      administrative gap (no process to review access) or a physical one (anyone can walk in and take the
      server).

      The second axis is **function**, what the control does relative to an incident. **Preventive** controls
      stop an incident before it happens (a firewall blocking traffic, a lock). **Detective** controls identify
      that something happened (IDS alerts, log monitoring, cameras). **Corrective** controls fix or limit damage
      after the fact (restoring from backup, patching the exploited flaw). The model also names **deterrent**
      controls (discouraging an attacker, like warning signs), **compensating** controls (an alternative when
      the primary control is not feasible), and **directive** controls (instructing behaviour, like a policy).
      The practical power of the taxonomy is in finding **gaps**: a system with strong preventive controls but
      no detective ones will be breached silently, and one with detection but no corrective capability will see
      the attack but not recover. Mapping your controls across both axes reveals where you are over- and
      under-invested, which is exactly how a defender turns a pile of tools into a balanced, layered defence.
    examples:
      - title: Two axes of classification
        body: |
          category:  technical (firewall) | administrative (policy) | physical (lock)
          function:  preventive (block) | detective (alert) | corrective (restore)
                     + deterrent, compensating, directive
          every control has one of each.
      - title: Finding a gap with the taxonomy
        body: |
          strong preventive, NO detective -> breached silently (never notice)
          detective, NO corrective        -> see the attack, can't recover
          mapping both axes reveals where you're under-invested.
    exercise:
      title: Classify controls and find the gaps
      environment: A described environment with a set of existing controls (or your own context) and a document or spreadsheet
      tools: [A list of controls, a spreadsheet or document, a notes file]
      steps:
        - For several existing controls, classify each by category (technical, administrative, physical).
        - Classify each by function (preventive, detective, corrective, or another type) and explain the choice.
        - Give an example of a control that is strong technically but undermined by a missing administrative or physical control.
        - Map the controls across both axes and identify where the environment is over-invested and where it has a gap.
        - For one gap (such as no detective controls for a critical asset), recommend a control to fill it.
        - Explain how a compensating control would be used when a primary control is not feasible.
      deliverable: A control inventory classified on both axes, an identified gap with a recommended control to fill it, and an example of a compensating control.
    expected_outcome: >
      You can classify security controls by category and function, use the taxonomy to find where defences are
      over- or under-invested, and design a balanced mix of preventive, detective and corrective controls
      across technical, administrative and physical categories.
    quiz:
      - prompt: A firewall is which category of control?
        options: [Administrative, Technical (logical), Physical, Directive]
        answer: 1
        explanation: A firewall is enforced by technology, making it a technical/logical control.
      - prompt: Detective controls
        options:
          - Stop an incident before it happens
          - Identify that something happened (such as IDS alerts or log monitoring)
          - Restore from backup
          - Discourage attackers
        answer: 1
        explanation: Detective controls reveal that an event occurred, as opposed to preventing or correcting it.
      - prompt: A system with strong preventive but no detective controls will
        options:
          - Be perfectly secure
          - Tend to be breached silently, because nothing reveals a successful attack
          - Recover automatically
          - Need no further controls
        answer: 1
        explanation: Without detection, a successful breach goes unnoticed, which is why both functions are needed.
      - prompt: A compensating control is
        options:
          - A control that never works
          - An alternative control used when the primary control is not feasible
          - A physical lock only
          - A type of malware
        answer: 1
        explanation: Compensating controls provide equivalent protection when the preferred control cannot be implemented.
