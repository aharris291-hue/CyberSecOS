slug: governance-risk-compliance
title: Governance, Risk and Compliance
domain: Governance, Risk and Compliance
order: 12
description: >
  The managerial side of security: governance and policy, risk management,
  third-party risk, compliance, audits, awareness and security automation.
lessons:
  - slug: grc-governance-compliance
    title: Governance, Policies, Compliance and Audits
    order: 1
    difficulty: beginner
    summary: Map governance structures and write policies and a compliance checklist against a real framework.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:5.1", "secplus:5.4", "secplus:5.5", "secplus:5.6", "sc900:4"]
    learning_objectives:
      - Describe security governance: structures, roles, policies, standards and procedures
      - Explain compliance, its consequences and common regulations
      - Explain audits, assessments and security awareness, and start a compliance checklist
    theory: |
      **Governance** is how an organisation directs and controls security. **Structures**
      include a board, committees, and roles with clear responsibilities: **data owner**
      (accountable for a data set), **data controller** (decides why and how data is processed),
      **data processor** (processes on the controller's behalf), **data custodian/steward**
      (day-to-day handling) and the **CISO**. Governance produces written guidance in a
      hierarchy: **policies** (high-level intent, for example an acceptable-use or password
      policy), **standards** (specific requirements), **procedures** (step-by-step), and
      **guidelines** (recommendations). External **governance drivers** include regulations,
      laws and industry frameworks.

      **Compliance** is meeting those obligations, and non-compliance has **consequences**:
      fines, sanctions, reputational damage, loss of licence and legal exposure. Common
      regimes to recognise: **GDPR** (EU privacy), **HIPAA** (US health data), **PCI DSS**
      (payment cards), **SOX**, and frameworks such as **NIST CSF**, **ISO 27001** and **CIS
      Controls**. Compliance is tracked through **internal and external monitoring**,
      **attestation** and **due diligence/due care**.

      **Audits and assessments** check reality against requirements. **Internal** audits are
      run by the organisation; **external** or **third-party** audits give independent
      assurance. **Penetration testing** actively tests defences and can be **known** (white
      box), **partially known** (grey box) or **unknown** (black box) to the tester. Finally,
      people are part of the system: **security awareness** programmes cover phishing
      recognition, anomalous behaviour reporting, and secure habits, reinforced by **phishing
      simulations** and measured over time.
    examples:
      - title: The policy hierarchy
        body: |
          Policy:     "All remote access requires multi-factor authentication."
          Standard:   "MFA uses a TOTP authenticator app or FIDO2 key; SMS is not permitted."
          Procedure:  "1. Enrol device in the portal  2. Register authenticator  3. Test login"
          Guideline:  "Prefer a hardware key for administrators."
      - title: A compliance checklist row (PCI DSS style)
        body: |
          Requirement: Encrypt cardholder data in transit over public networks
          Evidence:    TLS 1.2+ enforced; config screenshot; quarterly external scan report
          Owner:       Platform team     Status: Met     Next review: quarterly
    exercise:
      title: Draft a policy set and a framework-based compliance checklist
      environment: A document editor; the free CIS Controls v8 or NIST CSF reference from the web
      tools: [Document editor, CIS Controls or NIST CSF (public downloads)]
      steps:
        - Download the CIS Controls v8 (or open the NIST Cybersecurity Framework) and skim its top-level controls.
        - Choose five controls relevant to a small team (for example inventory, access control, MFA, backups, awareness training).
        - For each, write a short policy statement, one standard, and a one-line procedure, keeping the hierarchy clear.
        - Build a compliance checklist: control, requirement, evidence you would collect, owner, status and review frequency.
        - Assign each control a data role (owner, custodian) responsible for it.
        - Write a one-paragraph consequences statement for failing an external PCI DSS or GDPR audit, naming at least two concrete consequences.
        - Plan a basic security-awareness element: one phishing-simulation idea and the metric you would track over time.
      deliverable: A five-control policy/standard/procedure set plus a compliance checklist mapped to the framework, with owners and evidence.
    expected_outcome: >
      You can place any piece of security guidance in the policy hierarchy and build a
      framework-based compliance checklist with evidence, owners and review cycles.
    quiz:
      - prompt: Which document gives high-level intent rather than step-by-step instructions?
        options: [Procedure, Policy, Runbook, Checklist]
        answer: 1
        explanation: A policy states intent; procedures give the detailed steps.
      - prompt: A hospital handling patient records in the US must primarily comply with
        options: [PCI DSS, HIPAA, SOX, GDPR]
        answer: 1
        explanation: HIPAA governs protected health information in the United States.
      - prompt: A penetration test where the tester is given no prior information is
        options: [Known (white box), Partially known (grey box), Unknown (black box), Internal audit]
        answer: 2
        explanation: Black-box testing simulates an outside attacker with no inside knowledge.
      - prompt: Who is accountable for a specific data set in a governance model?
        options: [Data processor, Data owner, End user, Auditor]
        answer: 1
        explanation: The data owner is accountable for classification and protection of that data.
      - prompt: A primary purpose of security awareness training is to
        options:
          - Replace technical controls
          - Reduce human-driven risk such as falling for phishing
          - Satisfy the firewall policy
          - Eliminate the need for audits
        answer: 1
        explanation: People are a common attack path, and training reduces that risk.

  - slug: grc-risk-thirdparty-automation
    title: Risk Management, Third-Party Risk and Security Automation
    order: 2
    difficulty: intermediate
    summary: Build a risk register, assess a vendor, and automate a repetitive security task.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:5.2", "secplus:5.3", "secplus:4.7", "cysa:4.1"]
    learning_objectives:
      - Run the risk management process and maintain a risk register
      - Assess and manage third-party and supply-chain risk
      - Explain security automation and orchestration and script a simple automated check
    theory: |
      **Risk management** is identifying, analysing and treating uncertainty. **Risk
      identification** finds what could go wrong; **assessment** can be **qualitative**
      (high/medium/low from likelihood and impact) or **quantitative** using numbers:
      **SLE** (single loss expectancy) = asset value x exposure factor, **ARO** (annual rate
      of occurrence), and **ALE** = SLE x ARO, the expected yearly loss. Treatment options are
      **mitigate**, **transfer**, **avoid** and **accept**, each recorded with an owner in a
      **risk register** along with **inherent** risk (before controls), **residual** risk
      (after) and **risk appetite/tolerance**. A **business impact analysis** identifies
      critical processes and their RTO/RPO. Reporting risk clearly, including in **incident
      and vulnerability reports**, so leaders can act is a core analyst skill.

      **Third-party risk** matters because vendors become part of your attack surface.
      Manage it with **vendor assessments** and questionnaires, **right-to-audit** clauses,
      **service level agreements (SLAs)**, **memoranda of understanding (MOU)**, **master
      service agreements (MSA)** and **business partner agreements (BPA)**, plus
      **supply-chain** analysis of software and hardware. Ongoing **vendor monitoring**
      catches drift after onboarding.

      **Automation and orchestration** reduce toil and speed response. Good use cases:
      enforcing baselines, user provisioning and **deprovisioning**, ticket enrichment,
      continuous compliance checks and guard rails. Benefits are consistency, speed and
      reaction time; considerations include complexity, single points of failure, technical
      debt and the cost of ongoing supportability. A **SOAR** platform runs **playbooks** that
      chain these steps; even a small script that checks a control daily is automation.
    examples:
      - title: Quantitative risk of laptop theft
        body: |
          Asset value = $2,000   Exposure factor = 50%   ->  SLE = $1,000
          ARO = 3 laptops lost per year
          ALE = SLE x ARO = $3,000/year
          A $1,500/year MDM + encryption control is justified against a $3,000 ALE.
      - title: A tiny automation check
        body: |
          #!/usr/bin/env bash
          # Fails if SSH password authentication is enabled (a baseline guard rail)
          if grep -Eq '^\s*PasswordAuthentication\s+yes' /etc/ssh/sshd_config; then
            echo "NON-COMPLIANT: SSH password auth enabled"; exit 1
          fi
          echo "COMPLIANT"
    exercise:
      title: Risk register, vendor assessment and an automated control check
      environment: A spreadsheet and a Linux VM or WSL for the script
      tools: [Spreadsheet, bash or PowerShell]
      steps:
        - Identify five risks to your lab environment (for example weak SSH, no backups, an unpatched VM, a vendor dependency, a shared admin password).
        - For each, record likelihood, impact, a qualitative rating, and the treatment (mitigate/transfer/avoid/accept) with an owner, in a risk register.
        - For the laptop-theft example, compute SLE, ARO and ALE with your own numbers and state whether a given control is cost-justified.
        - Write a short vendor assessment questionnaire (eight questions) covering security practices, breach history, data handling and right-to-audit.
        - Pick one repetitive check and automate it: write a script that tests a control (for example SSH password auth disabled, firewall enabled, or disk encryption on) and exits non-zero when non-compliant.
        - Run the script in both the compliant and non-compliant states and capture the output.
        - Write two sentences on what a SOAR playbook would add if this check ran across 100 hosts.
      deliverable: The risk register (5 rows with treatment and owner), the ALE calculation, the vendor questionnaire, and the working compliance script with its output in both states.
    expected_outcome: >
      You can quantify and record risk, assess a third party, and replace a manual security
      check with an automated one, explaining the trade-offs of doing so.
    quiz:
      - prompt: ALE is calculated as
        options: ["SLE x ARO", "Asset value x ARO", "SLE + ARO", "Exposure factor x ARO"]
        answer: 0
        explanation: Annual loss expectancy is single loss expectancy times the annual rate of occurrence.
      - prompt: Residual risk is the risk that remains
        options:
          - Before any controls are applied
          - After controls are applied
          - Only for third parties
          - After an incident
        answer: 1
        explanation: Inherent risk is before controls; residual risk is what is left after them.
      - prompt: A right-to-audit clause in a vendor contract lets you
        options:
          - Terminate for any reason
          - Inspect the vendor's security controls
          - Avoid paying
          - Use their software free
        answer: 1
        explanation: It grants the ability to verify the vendor's security rather than trust assertions.
      - prompt: Which is the best candidate for security automation?
        options:
          - A one-off investigation requiring judgement
          - A repetitive, well-defined check such as a daily baseline verification
          - A sensitive legal decision
          - Negotiating a vendor contract
        answer: 1
        explanation: Automation suits repetitive, rule-based tasks; judgement-heavy work does not.
      - prompt: A risk the organisation decides to live with, formally and with sign-off, is
        options: [Risk avoidance, Risk acceptance, Risk transference, Risk mitigation]
        answer: 1
        explanation: Acceptance means acknowledging the risk and choosing not to spend more to reduce it.
  - slug: grc-privacy-data-protection
    title: Data Privacy, Classification and Regulated Data
    order: 3
    difficulty: beginner
    summary: Learn how privacy differs from security, how to classify and handle regulated data across its lifecycle, and what frameworks like GDPR, HIPAA and PCI DSS require.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.4", "secplus:5.5", "sc900:4"]
    learning_objectives:
      - Distinguish data privacy from data security and name the key roles
      - Classify data and apply handling rules across its lifecycle
      - Map common regulations to concrete controls a SOC supports
    theory: |
      **Security** protects data from unauthorised access; **privacy** governs whether
      collecting and using personal data is appropriate and lawful in the first place.
      You can be secure yet non-compliant, for example by locking down data you never
      had the right to collect. Privacy centres on **personal data** (PII) and sensitive
      categories such as health or payment data. Two roles recur: the **data controller**
      decides why and how data is processed, and the **data processor** acts on the
      controller's instructions, a distinction that drives who is accountable.

      Good handling starts with **classification**. Data is labelled by sensitivity (for
      example public, internal, confidential, restricted), and the label dictates the
      controls: encryption, who may access it, where it may live, and how long it is
      kept. That last point is the **data lifecycle**, from creation through use and
      storage to **retention** and secure **disposal**. Keeping data longer than needed
      is itself a risk (more to lose in a breach, and often a compliance violation), so
      **minimisation** and documented retention schedules matter. Techniques like
      **anonymisation** (irreversible) and **pseudonymisation** or **tokenisation**
      (reversible with a key) reduce exposure while keeping data useful.

      Regulations turn these ideas into obligations. **GDPR** gives individuals rights
      over their data (access, deletion) and requires breach notification within tight
      deadlines; **HIPAA** governs health information; **PCI DSS** sets controls for
      payment-card data. The SOC rarely writes the policy but **supports** it: detecting
      and reporting breaches within the required window, protecting classified data with
      monitoring and **data loss prevention** (DLP), and producing the logs and evidence
      an audit needs. Knowing which regulation applies to which data tells responders how
      fast and to whom an incident must be escalated.
    examples:
      - title: Classification drives handling
        body: |
          Label        Example                      Controls
          Public       marketing page               no special handling
          Confidential customer PII                  encrypt, restrict access, log
          Restricted   cardholder data (PCI DSS)     encrypt, segment, strict audit
      - title: Privacy is not the same as security
        body: |
          Encrypted database of data you had no lawful basis to collect
          -> secure (well protected) but NOT private/compliant
          Privacy asks "should we hold this?", security asks "is it protected?"
    exercise:
      title: Build a data classification and handling scheme for a scenario
      environment: A described organisation and the data it holds (invent one, or use your workplace) and a document or spreadsheet
      tools: [A document or spreadsheet, a reference on GDPR/HIPAA/PCI DSS basics]
      steps:
        - List the kinds of data the organisation holds and identify which are personal or regulated (PII, health, payment).
        - Define a classification scheme of at least four levels and assign each data type a level with a one-line reason.
        - For each level, write the handling rules (encryption, access, allowed locations, retention period, disposal method).
        - For one regulated data type, name the applicable regulation and two concrete controls it requires.
        - Map the lifecycle of one sensitive data type from creation to secure disposal, noting where minimisation applies.
        - Describe how the SOC would support compliance for this data (monitoring, DLP, breach detection and the notification deadline).
        - State one thing the organisation should stop collecting or keeping, and why, on privacy grounds.
      deliverable: The data inventory, a classification scheme with handling rules, a regulation-to-controls mapping, a lifecycle for one data type, and the SOC's compliance-support role.
    expected_outcome: >
      You can tell privacy from security, classify data and apply lifecycle handling
      rules, map regulations such as GDPR, HIPAA and PCI DSS to concrete controls, and
      explain how a SOC supports compliance through monitoring, DLP and breach reporting.
    quiz:
      - prompt: How does data privacy differ from data security?
        options:
          - They are the same thing
          - Privacy governs whether collecting and using personal data is appropriate and lawful; security protects data from unauthorised access
          - Privacy only applies to encrypted data
          - Security only applies to personal data
        answer: 1
        explanation: You can protect data well (secure) yet still hold or use it unlawfully (not private), so the two are distinct concerns.
      - prompt: The main purpose of data classification is to
        options:
          - Make databases faster
          - Decide the handling controls (access, encryption, retention) a data type requires
          - Replace encryption
          - Count the records
        answer: 1
        explanation: A sensitivity label drives the controls applied, so classification is the basis for proportionate handling.
      - prompt: Keeping personal data longer than needed is discouraged because
        options:
          - It uses disk space
          - It increases breach risk and often violates retention and minimisation requirements
          - It slows backups
          - It changes the data's classification
        answer: 1
        explanation: More retained data means more to lose and frequently breaches data-minimisation and retention rules.
      - prompt: In supporting compliance with a regulation like GDPR, the SOC primarily
        options: [Writes the privacy policy, Detects and reports breaches in time and protects classified data with monitoring and DLP, Sets the company's legal strategy, Chooses which customers to onboard]
        answer: 1
        explanation: The SOC operationalises compliance by monitoring, protecting regulated data and meeting breach-notification deadlines, rather than authoring policy.

  - slug: grc-continuity-incident-readiness
    title: Business Continuity and Incident Readiness
    order: 4
    difficulty: beginner
    summary: Plan to keep running through disruption and to meet breach-reporting duties.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.1", "secplus:4.8", "cysa:4.2", "sc900:4"]
    learning_objectives:
      - Define business continuity and disaster recovery and the metrics RTO and RPO
      - Explain how an incident response plan and a tabletop exercise prepare an organisation
      - Describe breach notification duties and who must be told within what time
    theory: |
      Security governance is not only about preventing incidents; it is about staying in business
      when one happens. **Business continuity planning (BCP)** keeps the essential functions of the
      organisation running through a disruption, while **disaster recovery (DR)** is the narrower
      job of restoring IT systems and data. The two anchor metrics are the **recovery time
      objective (RTO)**, how quickly a system must be back, and the **recovery point objective
      (RPO)**, how much data you can afford to lose, measured as the age of the last good backup.

      Readiness is written down in advance. An **incident response plan** names the roles, the
      decision-makers, the communication paths and the steps for common scenarios, so that nobody
      is improvising during a crisis. A **tabletop exercise** walks the team through a realistic
      scenario on paper to find the gaps, a missing contact, an unclear owner, a backup nobody has
      ever restored, while it is still cheap to fix them. Backups follow the **3-2-1** idea (three
      copies, two media, one off-site) and are only real once a restore has actually been tested.

      Finally, many incidents carry **legal and regulatory reporting duties**. Frameworks such as
      GDPR set tight windows; a personal-data breach is reportable to the regulator within 72
      hours of becoming aware, and contracts and sector rules add their own. The plan should name
      who decides a breach is reportable, who notifies the regulator and the affected people, and
      what must be recorded, because getting the notification wrong adds a second, avoidable harm
      on top of the incident.
    examples:
      - title: RTO and RPO on one system
        body: |
          Order system   RTO = 4 hours   RPO = 15 minutes
          It must be back within 4 hours, and backups every 15 minutes cap the data that can be lost.
      - title: A gap a tabletop exercise exposes
        body: |
          Scenario   ransomware encrypts the file server
          Finding    nightly backups exist but no restore has ever been tested
          An untested backup is an assumption, not a recovery plan.
    exercise:
      title: Draft a continuity and response one-pager
      environment: A notes or document file; no system required
      tools: [A document editor, a backup and recovery reference]
      steps:
        - Pick one business-critical system and write what it does and who depends on it.
        - Assign it an RTO and an RPO and justify each in one line.
        - Describe its backup scheme against the 3-2-1 idea and state when a restore was last tested.
        - Write a short incident response plan for one scenario, naming the roles and the first five actions.
        - Design a one-hour tabletop exercise for that scenario and list the questions you would ask the team.
        - Note the breach-notification duties that would apply, who must be told and within what time.
      deliverable: A one-page readiness brief with the RTO and RPO, the backup and restore status, an IR plan outline, a tabletop agenda and the notification duties.
    expected_outcome: >
      You can set recovery objectives for a system, outline an incident response plan and
      tabletop exercise, and state the breach-notification duties an incident would trigger.
    quiz:
      - prompt: The recovery point objective (RPO) measures
        options:
          - How quickly a system must be back
          - How much data you can afford to lose, as the age of the last good backup
          - The cost of the server
          - The number of users
        answer: 1
        explanation: RPO is the tolerable data loss, set by how old the last usable backup is; RTO is the time-to-restore.
      - prompt: What is the main value of a tabletop exercise?
        options: [It replaces backups, It finds gaps in the plan on paper before a real crisis, It encrypts data, It buys hardware]
        answer: 1
        explanation: A tabletop walks the team through a scenario to surface missing contacts, owners and untested backups cheaply.
      - prompt: An untested backup should be treated as
        options: [A guaranteed recovery, An assumption until a restore is tested, A compliance pass, A tabletop exercise]
        answer: 1
        explanation: A backup is only real once a restore has been proven; until then it is an assumption.
      - prompt: Under GDPR, a reportable personal-data breach must reach the regulator within
        options: ["72 hours of becoming aware", "one calendar year", "ten minutes", "no fixed time"]
        answer: 0
        explanation: GDPR sets a 72-hour window to notify the supervisory authority after becoming aware of a reportable breach.

  - slug: grc-frameworks-control-mapping
    title: Security Frameworks and Control Mapping
    order: 5
    difficulty: beginner
    summary: Use NIST CSF, ISO 27001 and CIS Controls to structure a program and show coverage.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.1", "sc900:4", "cysa:4.1"]
    learning_objectives:
      - Describe what NIST CSF, ISO 27001 and the CIS Controls each provide
      - Explain control mapping and why it satisfies several obligations at once
      - Use a framework to structure a program and demonstrate coverage to auditors
    theory: |
      A security program needs a structure so that effort is deliberate rather than ad hoc, and
      frameworks provide it. **NIST CSF** organises the work into functions, Identify, Protect,
      Detect, Respond and Recover, with Govern added in version 2.0, giving a common language for
      where an activity fits. **ISO 27001** is a certifiable standard for an information security
      management system, an ISMS, that puts the emphasis on a repeatable process of risk
      assessment and treatment. The **CIS Controls** are a prioritised, concrete checklist of
      safeguards, useful when you want specific actions rather than principles.

      Because the frameworks cover similar ground in different words, **control mapping** matters.
      Mapping one framework's controls to another, or to a regulation such as GDPR or PCI DSS,
      lets a single implemented control satisfy several obligations at once and shows auditors the
      same evidence answers many requirements. Without a map you re-implement the same control
      three times and still cannot prove coverage.

      In practice you pick a **primary framework** that fits the organisation, map each requirement
      to the control that actually implements it, and find the **gaps** where a requirement has no
      control behind it. Tracking that over time turns into a maturity view, and for a SOC it is
      the frameworks that decide which detections, logging and response processes are expected and
      how that coverage is demonstrated when an auditor asks.
    examples:
      - title: One control mapped to several requirements
        body: |
          Control    centralised logging with 1-year retention
          Satisfies  NIST CSF Detect, ISO 27001 A.8.15, PCI DSS log-retention requirement
          One implemented control answers requirements in three different frameworks.
      - title: A gap the mapping exposes
        body: |
          Requirement   recover from backups within a set time
          Mapped control   none found (no tested restore process)
          A requirement with no control behind it is a gap to fix, not a box to tick.
    exercise:
      title: Map controls to a framework and find the gaps
      environment: A notes or spreadsheet file with a list of implemented controls
      tools: [A framework reference (NIST CSF or CIS Controls), a list of current controls, a notes file]
      steps:
        - Choose a primary framework that suits a small organisation and note why.
        - List the controls the organisation already has in place.
        - Map each control to the framework requirement or requirements it satisfies.
        - Mark any requirement that has no control behind it as a gap.
        - Show one control that satisfies requirements in two different frameworks or regulations.
        - Recommend which gap to close first and why, based on risk.
      deliverable: A control-mapping table linking controls to framework requirements, with the gaps highlighted and a first priority.
    expected_outcome: >
      You can use a framework to structure a program, map controls to requirements so one
      control covers several obligations, and show where the gaps are and which to close first.
    quiz:
      - prompt: Which framework organises security work into Identify, Protect, Detect, Respond and Recover?
        options: [PCI DSS, The NIST Cybersecurity Framework, A firewall ruleset, The OSI model]
        answer: 1
        explanation: The NIST CSF groups activity into those functions (with Govern added in CSF 2.0) as a common language.
      - prompt: What is the main benefit of control mapping?
        options:
          - It deletes controls
          - One implemented control can satisfy requirements across several frameworks or regulations
          - It replaces the need for controls
          - It hides gaps
        answer: 1
        explanation: Mapping shows how one control answers many requirements, so you prove coverage without duplicating work.
      - prompt: A framework requirement with no control behind it is
        options: [A pass, A gap to fix, An exception, A duplicate]
        answer: 1
        explanation: A requirement nothing implements is a genuine gap, not something to tick off.
      - prompt: ISO 27001 is best described as
        options:
          - A packet analyser
          - A certifiable standard for an information security management system
          - A password policy
          - A cloud provider
        answer: 1
        explanation: ISO 27001 certifies an ISMS built on a repeatable risk-assessment and treatment process.

  - slug: grc-metrics-reporting
    title: Security Metrics and Reporting to Leadership
    order: 6
    difficulty: intermediate
    summary: Turn security activity into a few honest metrics that help leadership make decisions.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.1", "cysa:4.1", "sc900:4"]
    learning_objectives:
      - Explain why a security program is measured and reported to leadership
      - Choose metrics that drive decisions rather than vanity numbers
      - Present risk to a non-technical audience honestly and in business terms
    theory: |
      A security program competes for budget and attention like any other part of a business, and
      leadership funds what it can **see**. Reporting turns a year of quiet work into something a
      board can weigh: where risk sits, whether it is going up or down, and what the next investment
      would buy. Without it, security is invisible until something breaks, which is the worst moment
      to ask for support. So measuring and reporting is not bureaucracy; it is how the program earns
      its mandate.

      The skill is choosing metrics that **drive a decision**. A **vanity metric**, the number of
      attacks blocked, or alerts generated, looks impressive and changes nothing. A useful metric
      answers a question a leader actually has: **mean time to detect and respond** shows whether the
      SOC is getting faster, **patch latency** on critical vulnerabilities shows exposure over time,
      **coverage** (what fraction of assets are monitored or compliant) shows the gaps. A good metric
      has a target, a trend, and an owner, so it points at an action rather than just describing the
      past.

      Finally, the audience is usually **non-technical**, so risk is framed in **business terms**:
      what could happen, how likely, what it would cost, and what reducing it would take. You report
      honestly, including bad news and uncertainty, because a report that only shows green loses the
      trust that makes the next request credible. This caps the governance track: the earlier lessons
      set up policies, risk registers and frameworks, and this lesson is about communicating their
      state upward so the program is understood and resourced.
    examples:
      - title: A vanity metric versus a useful one
        body: |
          vanity:  "4.2 million attacks blocked this quarter"
          useful:  "critical patches now applied in 6 days, down from 21; target is 3"
          The second has a trend and a target, so it points at a decision; the first just impresses.
      - title: Risk in business terms
        body: |
          "An unpatched internet-facing server could expose customer records; likely within a year without action; remediation is 2 weeks of work."
          Likelihood, impact and cost-to-fix let a non-technical leader make the call.
    exercise:
      title: Build a one-page security report for leadership
      environment: A scenario with sample security activity data (incidents, patch times, monitoring coverage)
      tools: [The sample activity data, a notes or document tool]
      steps:
        - List the activity data available and separate the vanity numbers from the decision-driving metrics.
        - Choose three to five metrics to report and give each a target, a trend and an owner.
        - Write one risk in business terms, stating likelihood, impact and what reducing it would take.
        - Draft the one-page report with the metrics and the risk, in language a non-technical leader would follow.
        - Include at least one piece of bad news or uncertainty and explain why hiding it would backfire.
        - State the single decision or investment you want leadership to make from this report.
      deliverable: A one-page leadership security report with a handful of decision-driving metrics, one risk in business terms, and a clear ask.
    expected_outcome: >
      You can choose security metrics that drive decisions, present risk in business terms to a
      non-technical audience, and report honestly enough to keep leadership's trust.
    quiz:
      - prompt: Why report security metrics to leadership at all?
        options:
          - To fill time
          - Leadership funds what it can see; reporting shows where risk sits and what investment would buy
          - To confuse the board
          - Because logs require it
        answer: 1
        explanation: Reporting makes the program's risk and progress visible so leadership can resource it.
      - prompt: Which is a decision-driving metric rather than a vanity metric?
        options:
          - Total number of attacks blocked
          - Mean time to detect and respond, with a target and a trend
          - Number of alerts generated
          - Megabytes of logs collected
        answer: 1
        explanation: MTTD/MTTR with a target and trend answers a real question and points at action; raw blocked-attack counts do not.
      - prompt: When presenting risk to a non-technical audience you should
        options:
          - Use as much jargon as possible
          - Frame it in business terms, likelihood, impact and cost to reduce
          - Only ever show good news
          - Hide the uncertainty
        answer: 1
        explanation: Leaders decide on likelihood, impact and cost; business framing lets them act.
      - prompt: Why include bad news and uncertainty in a security report?
        options: [It never should be included, A report that only shows green loses the trust that makes future requests credible, To look weak, Because it is required by law everywhere]
        answer: 1
        explanation: Honest reporting, including bad news, preserves the credibility the next ask depends on.
  - slug: grc-audits-assessments-evidence
    title: Audits, Assessments and Evidence
    order: 7
    difficulty: beginner
    summary: Prepare for and support security audits and assessments by collecting the evidence that proves controls work, so compliance claims hold up to independent scrutiny.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.1", "secplus:5.5", "cysa:4.1"]
    learning_objectives:
      - Distinguish an audit from an assessment and internal from external review
      - Explain what counts as evidence that a control is designed and operating
      - Prepare for an audit and respond to a finding with a remediation plan
    theory: |
      Claiming a control exists is not the same as proving it, and that proof is what **audits** and
      **assessments** test. An **assessment** is usually an internal or advisory check of how well
      controls work, aimed at improvement; an **audit** is a more formal, often independent evaluation
      against a defined standard, producing an opinion others rely on. Reviews are **internal**
      (first-party, your own team), **second-party** (a customer auditing you) or **external
      third-party** (an independent auditor, as for a SOC 2 report or an ISO 27001 certification). The
      more independent and formal, the more weight the result carries with customers and regulators.

      Audits run on **evidence**, and evidence answers two questions: is the control **designed**
      correctly, and is it **operating** consistently over time. A policy document shows design; a year
      of access-review records, ticket histories, log samples and configuration exports shows operation.
      Auditors often sample, asking for the access reviews from three named months, so evidence has to be
      complete, dated and tied to the control it supports. The practical lesson is that evidence is a
      by-product of running controls well all year, not something manufactured the week before an audit,
      and a control with no evidence is, to an auditor, a control that does not exist.

      An audit ends in **findings**, gaps between what the standard requires and what the evidence shows.
      Each finding is rated by severity and gets a **remediation plan** with an owner and a date; where a
      gap cannot be closed immediately, a documented, risk-accepted **exception** or compensating control
      bridges it. Handled well, this is a continuous loop, controls produce evidence, audits surface gaps,
      remediation closes them, rather than an annual scramble. The SOC's part is often supplying the
      evidence (log retention, monitoring records, incident handling) that proves operational controls ran.
    examples:
      - title: Evidence proving design and operation
        body: |
          Control:   access is reviewed quarterly
          Design:    the access-review policy document
          Operation: the signed Q1, Q2, Q3, Q4 review records with dates and approvers
          No records = unprovable = a finding, even if reviews happened.
      - title: A finding to a remediation plan
        body: |
          Finding:      3 of 12 servers missing current patch baseline (medium)
          Remediation:  owner = infra lead; patch + reporting by date; verify next scan
          Exception:    1 legacy host risk-accepted with a compensating firewall rule
    exercise:
      title: Prepare an evidence pack and work an audit finding
      environment: A small set of security controls (yours or a sample) and a document or spreadsheet for the evidence pack
      tools: [A control list or framework excerpt, sample records/logs, a spreadsheet or document, a notes file]
      steps:
        - Pick three controls and for each state what evidence would prove it is both designed and operating.
        - Assemble or describe the evidence for one control, making sure it is dated, complete and clearly tied to the control.
        - Identify which review type (internal, second-party, external) each control's evidence would satisfy and why independence matters.
        - Given a sample finding (a control with incomplete evidence), rate its severity and explain the gap.
        - Write a remediation plan for the finding with an owner, an action and a target date, and define how you would verify closure.
        - For one gap that cannot be closed quickly, draft a risk-accepted exception with a compensating control.
        - Note one piece of evidence the SOC would supply to prove an operational control actually ran.
      deliverable: An evidence pack for one control (design plus operation), a rated finding with a remediation plan and verification, and one documented exception with a compensating control.
    expected_outcome: >
      You can tell audits from assessments and the review types apart, assemble evidence that proves a
      control is designed and operating, and respond to a finding with a remediation plan or a documented
      exception.
    quiz:
      - prompt: What chiefly distinguishes an external third-party audit from an internal assessment?
        options:
          - It is always cheaper
          - Its independence and formality give the result weight others (customers, regulators) rely on
          - It never produces findings
          - It skips evidence
        answer: 1
        explanation: Independent, formal audits produce opinions that external parties trust, unlike an internal improvement check.
      - prompt: Evidence for a control must show that the control is
        options:
          - Expensive
          - Both designed correctly and operating consistently over time
          - Written in a policy only
          - Owned by the auditor
        answer: 1
        explanation: Auditors test both design (the policy) and operating effectiveness (dated records over time).
      - prompt: To an auditor, a control with no evidence is
        options:
          - Fully compliant
          - Effectively a control that does not exist, and a finding
          - Exempt
          - Low risk
        answer: 1
        explanation: Unprovable controls cannot be relied on, so missing evidence becomes a finding regardless of what happened.
      - prompt: When an audit gap cannot be closed immediately, the right step is
        options: [Ignore it, Document a risk-accepted exception with a compensating control, Delete the finding, Fail the whole audit]
        answer: 1
        explanation: A documented exception plus a compensating control bridges a gap transparently until it can be closed.
  - slug: grc-policies-standards-procedures
    title: Security Policies, Standards and Procedures
    order: 8
    difficulty: beginner
    summary: Understand the document hierarchy that turns security intent into daily practice, policies, standards, procedures and guidelines, and how exceptions and enforcement keep it real.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.1", "secplus:5.2", "cysa:4.1"]
    learning_objectives:
      - Distinguish policies, standards, procedures and guidelines and how they relate
      - Explain how governance documents turn intent into enforceable practice
      - Handle exceptions, enforcement and review so documents stay effective
    theory: |
      A security programme runs on a hierarchy of documents, and confusing their levels is a common
      failure. A **policy** is a high-level statement of intent and requirement approved by leadership, for
      example "all data must be encrypted in transit and at rest"; it is mandatory, stable and says *what*
      and *why*, not *how*. **Standards** make a policy measurable: "TLS 1.2 or higher; AES-256 at rest"
      turns the principle into a testable requirement. **Procedures** are the step-by-step *how* that a
      person follows to meet a standard, and **guidelines** are recommended, non-mandatory best practice.
      The chain matters: a policy without standards is unenforceable, and a procedure with no policy behind
      it is an orphan nobody has authority to require.

      These documents exist to turn intent into **enforceable practice**. A policy that leadership approves
      gives the programme authority, an auditor something to test against, and staff a clear expectation.
      This is also where related governance pieces attach, an **acceptable use policy** for staff
      behaviour, a **data classification** standard, an **incident response** procedure, each tracing up to
      a governing policy. Well-structured documents are how "we take security seriously" becomes something a
      new hire can read and an auditor can verify.

      Documents only stay effective if they are **lived, not shelved**. Every policy needs an **owner**, a
      **review cycle** so it does not drift from reality, and an **exception process** so that when a
      genuine business need conflicts with a standard, the gap is risk-accepted and recorded rather than
      quietly ignored. **Enforcement** closes the loop, a policy nobody enforces trains people to ignore all
      of them. The practical test of a good document set is simple: can someone find the rule, understand
      what they must do, and see the consequence of not doing it.
    examples:
      - title: The document hierarchy in one chain
        body: |
          Policy     "data encrypted in transit and at rest" (what/why, mandatory)
          Standard   "TLS 1.2+, AES-256"                     (measurable)
          Procedure  "how to enable TLS on the web server"   (step-by-step how)
          Guideline  "prefer TLS 1.3 where supported"        (recommended)
      - title: An exception kept honest
        body: |
          Standard: MFA on all admin access
          Reality:  one legacy tool cannot do MFA
          Exception: owner-approved, time-bound, compensating control (jump host + logging)
          Recorded, reviewed, not a silent permanent gap.
    exercise:
      title: Build a slice of a policy framework
      environment: A described organisation or your own context, plus a document or template
      tools: [A document or template, a reference framework for structure, a notes file]
      steps:
        - Pick one security objective (for example access control or encryption) and write a short policy statement of intent for it.
        - Derive one measurable standard from that policy and one step-by-step procedure that implements the standard.
        - Add a guideline that is recommended but not mandatory, and explain the difference in force from the standard.
        - Assign an owner and a review cycle to the policy and explain why both are needed.
        - Draft an exception for a realistic case where the standard cannot be met, with a compensating control and an approver.
        - Describe how the policy would be enforced and what the document set lets an auditor verify.
      deliverable: A documentation slice with a policy, a derived standard and procedure, a guideline, an owner and review cycle, one exception with a compensating control, and the enforcement and audit angle.
    expected_outcome: >
      You can distinguish policies, standards, procedures and guidelines, build a chain that turns intent
      into enforceable, auditable practice, and keep it effective with owners, reviews, exceptions and
      enforcement.
    quiz:
      - prompt: Which document states high-level mandatory intent approved by leadership?
        options: [A procedure, A policy, A guideline, A log]
        answer: 1
        explanation: A policy sets mandatory intent and authority; standards, procedures and guidelines flow from it.
      - prompt: A standard differs from a policy in that it
        options:
          - Is optional
          - Makes the policy measurable and testable (for example specific protocols or settings)
          - Needs no approval
          - Is written by auditors
        answer: 1
        explanation: Standards translate a policy's intent into specific, verifiable requirements.
      - prompt: A guideline is
        options: [Mandatory like a policy, Recommended, non-mandatory best practice, A step-by-step procedure, An audit finding]
        answer: 1
        explanation: Guidelines advise rather than require, unlike policies and standards.
      - prompt: Why does every policy need an owner and a review cycle?
        options:
          - To add paperwork
          - So it stays current with reality and someone is accountable for it, rather than drifting or being ignored
          - To avoid enforcement
          - To make it optional
        answer: 1
        explanation: Ownership and review keep documents accurate and authoritative instead of shelved and stale.
