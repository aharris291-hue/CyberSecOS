slug: governance-risk-compliance
title: Governance, Risk and Compliance
domain: Governance, Risk and Compliance
order: 12
description: >
  The managerial side of security: governance and policy, risk management,
  third-party risk, compliance, audits, awareness and security automation.
lessons:
  - slug: grc-governance-compliance
    title: Governance, Policies, Compliance and Audits
    order: 1
    difficulty: beginner
    summary: Map governance structures and write policies and a compliance checklist against a real framework.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:5.1", "secplus:5.4", "secplus:5.5", "secplus:5.6", "sc900:4"]
    learning_objectives:
      - Describe security governance: structures, roles, policies, standards and procedures
      - Explain compliance, its consequences and common regulations
      - Explain audits, assessments and security awareness, and start a compliance checklist
    theory: |
      **Governance** is how an organisation directs and controls security. **Structures**
      include a board, committees, and roles with clear responsibilities: **data owner**
      (accountable for a data set), **data controller** (decides why and how data is processed),
      **data processor** (processes on the controller's behalf), **data custodian/steward**
      (day-to-day handling) and the **CISO**. Governance produces written guidance in a
      hierarchy: **policies** (high-level intent, for example an acceptable-use or password
      policy), **standards** (specific requirements), **procedures** (step-by-step), and
      **guidelines** (recommendations). External **governance drivers** include regulations,
      laws and industry frameworks.

      **Compliance** is meeting those obligations, and non-compliance has **consequences**:
      fines, sanctions, reputational damage, loss of licence and legal exposure. Common
      regimes to recognise: **GDPR** (EU privacy), **HIPAA** (US health data), **PCI DSS**
      (payment cards), **SOX**, and frameworks such as **NIST CSF**, **ISO 27001** and **CIS
      Controls**. Compliance is tracked through **internal and external monitoring**,
      **attestation** and **due diligence/due care**.

      **Audits and assessments** check reality against requirements. **Internal** audits are
      run by the organisation; **external** or **third-party** audits give independent
      assurance. **Penetration testing** actively tests defences and can be **known** (white
      box), **partially known** (grey box) or **unknown** (black box) to the tester. Finally,
      people are part of the system: **security awareness** programmes cover phishing
      recognition, anomalous behaviour reporting, and secure habits, reinforced by **phishing
      simulations** and measured over time.
    examples:
      - title: The policy hierarchy
        body: |
          Policy:     "All remote access requires multi-factor authentication."
          Standard:   "MFA uses a TOTP authenticator app or FIDO2 key; SMS is not permitted."
          Procedure:  "1. Enrol device in the portal  2. Register authenticator  3. Test login"
          Guideline:  "Prefer a hardware key for administrators."
      - title: A compliance checklist row (PCI DSS style)
        body: |
          Requirement: Encrypt cardholder data in transit over public networks
          Evidence:    TLS 1.2+ enforced; config screenshot; quarterly external scan report
          Owner:       Platform team     Status: Met     Next review: quarterly
    exercise:
      title: Draft a policy set and a framework-based compliance checklist
      environment: A document editor; the free CIS Controls v8 or NIST CSF reference from the web
      tools: [Document editor, CIS Controls or NIST CSF (public downloads)]
      steps:
        - Download the CIS Controls v8 (or open the NIST Cybersecurity Framework) and skim its top-level controls.
        - Choose five controls relevant to a small team (for example inventory, access control, MFA, backups, awareness training).
        - For each, write a short policy statement, one standard, and a one-line procedure, keeping the hierarchy clear.
        - Build a compliance checklist: control, requirement, evidence you would collect, owner, status and review frequency.
        - Assign each control a data role (owner, custodian) responsible for it.
        - Write a one-paragraph consequences statement for failing an external PCI DSS or GDPR audit, naming at least two concrete consequences.
        - Plan a basic security-awareness element: one phishing-simulation idea and the metric you would track over time.
      deliverable: A five-control policy/standard/procedure set plus a compliance checklist mapped to the framework, with owners and evidence.
    expected_outcome: >
      You can place any piece of security guidance in the policy hierarchy and build a
      framework-based compliance checklist with evidence, owners and review cycles.
    quiz:
      - prompt: Which document gives high-level intent rather than step-by-step instructions?
        options: [Procedure, Policy, Runbook, Checklist]
        answer: 1
        explanation: A policy states intent; procedures give the detailed steps.
      - prompt: A hospital handling patient records in the US must primarily comply with
        options: [PCI DSS, HIPAA, SOX, GDPR]
        answer: 1
        explanation: HIPAA governs protected health information in the United States.
      - prompt: A penetration test where the tester is given no prior information is
        options: [Known (white box), Partially known (grey box), Unknown (black box), Internal audit]
        answer: 2
        explanation: Black-box testing simulates an outside attacker with no inside knowledge.
      - prompt: Who is accountable for a specific data set in a governance model?
        options: [Data processor, Data owner, End user, Auditor]
        answer: 1
        explanation: The data owner is accountable for classification and protection of that data.
      - prompt: A primary purpose of security awareness training is to
        options:
          - Replace technical controls
          - Reduce human-driven risk such as falling for phishing
          - Satisfy the firewall policy
          - Eliminate the need for audits
        answer: 1
        explanation: People are a common attack path, and training reduces that risk.

  - slug: grc-risk-thirdparty-automation
    title: Risk Management, Third-Party Risk and Security Automation
    order: 2
    difficulty: intermediate
    summary: Build a risk register, assess a vendor, and automate a repetitive security task.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:5.2", "secplus:5.3", "secplus:4.7", "cysa:4.1"]
    learning_objectives:
      - Run the risk management process and maintain a risk register
      - Assess and manage third-party and supply-chain risk
      - Explain security automation and orchestration and script a simple automated check
    theory: |
      **Risk management** is identifying, analysing and treating uncertainty. **Risk
      identification** finds what could go wrong; **assessment** can be **qualitative**
      (high/medium/low from likelihood and impact) or **quantitative** using numbers:
      **SLE** (single loss expectancy) = asset value x exposure factor, **ARO** (annual rate
      of occurrence), and **ALE** = SLE x ARO, the expected yearly loss. Treatment options are
      **mitigate**, **transfer**, **avoid** and **accept**, each recorded with an owner in a
      **risk register** along with **inherent** risk (before controls), **residual** risk
      (after) and **risk appetite/tolerance**. A **business impact analysis** identifies
      critical processes and their RTO/RPO. Reporting risk clearly, including in **incident
      and vulnerability reports**, so leaders can act is a core analyst skill.

      **Third-party risk** matters because vendors become part of your attack surface.
      Manage it with **vendor assessments** and questionnaires, **right-to-audit** clauses,
      **service level agreements (SLAs)**, **memoranda of understanding (MOU)**, **master
      service agreements (MSA)** and **business partner agreements (BPA)**, plus
      **supply-chain** analysis of software and hardware. Ongoing **vendor monitoring**
      catches drift after onboarding.

      **Automation and orchestration** reduce toil and speed response. Good use cases:
      enforcing baselines, user provisioning and **deprovisioning**, ticket enrichment,
      continuous compliance checks and guard rails. Benefits are consistency, speed and
      reaction time; considerations include complexity, single points of failure, technical
      debt and the cost of ongoing supportability. A **SOAR** platform runs **playbooks** that
      chain these steps; even a small script that checks a control daily is automation.
    examples:
      - title: Quantitative risk of laptop theft
        body: |
          Asset value = $2,000   Exposure factor = 50%   ->  SLE = $1,000
          ARO = 3 laptops lost per year
          ALE = SLE x ARO = $3,000/year
          A $1,500/year MDM + encryption control is justified against a $3,000 ALE.
      - title: A tiny automation check
        body: |
          #!/usr/bin/env bash
          # Fails if SSH password authentication is enabled (a baseline guard rail)
          if grep -Eq '^\s*PasswordAuthentication\s+yes' /etc/ssh/sshd_config; then
            echo "NON-COMPLIANT: SSH password auth enabled"; exit 1
          fi
          echo "COMPLIANT"
    exercise:
      title: Risk register, vendor assessment and an automated control check
      environment: A spreadsheet and a Linux VM or WSL for the script
      tools: [Spreadsheet, bash or PowerShell]
      steps:
        - Identify five risks to your lab environment (for example weak SSH, no backups, an unpatched VM, a vendor dependency, a shared admin password).
        - For each, record likelihood, impact, a qualitative rating, and the treatment (mitigate/transfer/avoid/accept) with an owner, in a risk register.
        - For the laptop-theft example, compute SLE, ARO and ALE with your own numbers and state whether a given control is cost-justified.
        - Write a short vendor assessment questionnaire (eight questions) covering security practices, breach history, data handling and right-to-audit.
        - Pick one repetitive check and automate it: write a script that tests a control (for example SSH password auth disabled, firewall enabled, or disk encryption on) and exits non-zero when non-compliant.
        - Run the script in both the compliant and non-compliant states and capture the output.
        - Write two sentences on what a SOAR playbook would add if this check ran across 100 hosts.
      deliverable: The risk register (5 rows with treatment and owner), the ALE calculation, the vendor questionnaire, and the working compliance script with its output in both states.
    expected_outcome: >
      You can quantify and record risk, assess a third party, and replace a manual security
      check with an automated one, explaining the trade-offs of doing so.
    quiz:
      - prompt: ALE is calculated as
        options: ["SLE x ARO", "Asset value x ARO", "SLE + ARO", "Exposure factor x ARO"]
        answer: 0
        explanation: Annual loss expectancy is single loss expectancy times the annual rate of occurrence.
      - prompt: Residual risk is the risk that remains
        options:
          - Before any controls are applied
          - After controls are applied
          - Only for third parties
          - After an incident
        answer: 1
        explanation: Inherent risk is before controls; residual risk is what is left after them.
      - prompt: A right-to-audit clause in a vendor contract lets you
        options:
          - Terminate for any reason
          - Inspect the vendor's security controls
          - Avoid paying
          - Use their software free
        answer: 1
        explanation: It grants the ability to verify the vendor's security rather than trust assertions.
      - prompt: Which is the best candidate for security automation?
        options:
          - A one-off investigation requiring judgement
          - A repetitive, well-defined check such as a daily baseline verification
          - A sensitive legal decision
          - Negotiating a vendor contract
        answer: 1
        explanation: Automation suits repetitive, rule-based tasks; judgement-heavy work does not.
      - prompt: A risk the organisation decides to live with, formally and with sign-off, is
        options: [Risk avoidance, Risk acceptance, Risk transference, Risk mitigation]
        answer: 1
        explanation: Acceptance means acknowledging the risk and choosing not to spend more to reduce it.
  - slug: grc-privacy-data-protection
    title: Data Privacy, Classification and Regulated Data
    order: 3
    difficulty: beginner
    summary: Learn how privacy differs from security, how to classify and handle regulated data across its lifecycle, and what frameworks like GDPR, HIPAA and PCI DSS require.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:5.4", "secplus:5.5", "sc900:4"]
    learning_objectives:
      - Distinguish data privacy from data security and name the key roles
      - Classify data and apply handling rules across its lifecycle
      - Map common regulations to concrete controls a SOC supports
    theory: |
      **Security** protects data from unauthorised access; **privacy** governs whether
      collecting and using personal data is appropriate and lawful in the first place.
      You can be secure yet non-compliant, for example by locking down data you never
      had the right to collect. Privacy centres on **personal data** (PII) and sensitive
      categories such as health or payment data. Two roles recur: the **data controller**
      decides why and how data is processed, and the **data processor** acts on the
      controller's instructions, a distinction that drives who is accountable.

      Good handling starts with **classification**. Data is labelled by sensitivity (for
      example public, internal, confidential, restricted), and the label dictates the
      controls: encryption, who may access it, where it may live, and how long it is
      kept. That last point is the **data lifecycle**, from creation through use and
      storage to **retention** and secure **disposal**. Keeping data longer than needed
      is itself a risk (more to lose in a breach, and often a compliance violation), so
      **minimisation** and documented retention schedules matter. Techniques like
      **anonymisation** (irreversible) and **pseudonymisation** or **tokenisation**
      (reversible with a key) reduce exposure while keeping data useful.

      Regulations turn these ideas into obligations. **GDPR** gives individuals rights
      over their data (access, deletion) and requires breach notification within tight
      deadlines; **HIPAA** governs health information; **PCI DSS** sets controls for
      payment-card data. The SOC rarely writes the policy but **supports** it: detecting
      and reporting breaches within the required window, protecting classified data with
      monitoring and **data loss prevention** (DLP), and producing the logs and evidence
      an audit needs. Knowing which regulation applies to which data tells responders how
      fast and to whom an incident must be escalated.
    examples:
      - title: Classification drives handling
        body: |
          Label        Example                      Controls
          Public       marketing page               no special handling
          Confidential customer PII                  encrypt, restrict access, log
          Restricted   cardholder data (PCI DSS)     encrypt, segment, strict audit
      - title: Privacy is not the same as security
        body: |
          Encrypted database of data you had no lawful basis to collect
          -> secure (well protected) but NOT private/compliant
          Privacy asks "should we hold this?", security asks "is it protected?"
    exercise:
      title: Build a data classification and handling scheme for a scenario
      environment: A described organisation and the data it holds (invent one, or use your workplace) and a document or spreadsheet
      tools: [A document or spreadsheet, a reference on GDPR/HIPAA/PCI DSS basics]
      steps:
        - List the kinds of data the organisation holds and identify which are personal or regulated (PII, health, payment).
        - Define a classification scheme of at least four levels and assign each data type a level with a one-line reason.
        - For each level, write the handling rules (encryption, access, allowed locations, retention period, disposal method).
        - For one regulated data type, name the applicable regulation and two concrete controls it requires.
        - Map the lifecycle of one sensitive data type from creation to secure disposal, noting where minimisation applies.
        - Describe how the SOC would support compliance for this data (monitoring, DLP, breach detection and the notification deadline).
        - State one thing the organisation should stop collecting or keeping, and why, on privacy grounds.
      deliverable: The data inventory, a classification scheme with handling rules, a regulation-to-controls mapping, a lifecycle for one data type, and the SOC's compliance-support role.
    expected_outcome: >
      You can tell privacy from security, classify data and apply lifecycle handling
      rules, map regulations such as GDPR, HIPAA and PCI DSS to concrete controls, and
      explain how a SOC supports compliance through monitoring, DLP and breach reporting.
    quiz:
      - prompt: How does data privacy differ from data security?
        options:
          - They are the same thing
          - Privacy governs whether collecting and using personal data is appropriate and lawful; security protects data from unauthorised access
          - Privacy only applies to encrypted data
          - Security only applies to personal data
        answer: 1
        explanation: You can protect data well (secure) yet still hold or use it unlawfully (not private), so the two are distinct concerns.
      - prompt: The main purpose of data classification is to
        options:
          - Make databases faster
          - Decide the handling controls (access, encryption, retention) a data type requires
          - Replace encryption
          - Count the records
        answer: 1
        explanation: A sensitivity label drives the controls applied, so classification is the basis for proportionate handling.
      - prompt: Keeping personal data longer than needed is discouraged because
        options:
          - It uses disk space
          - It increases breach risk and often violates retention and minimisation requirements
          - It slows backups
          - It changes the data's classification
        answer: 1
        explanation: More retained data means more to lose and frequently breaches data-minimisation and retention rules.
      - prompt: In supporting compliance with a regulation like GDPR, the SOC primarily
        options: [Writes the privacy policy, Detects and reports breaches in time and protects classified data with monitoring and DLP, Sets the company's legal strategy, Chooses which customers to onboard]
        answer: 1
        explanation: The SOC operationalises compliance by monitoring, protecting regulated data and meeting breach-notification deadlines, rather than authoring policy.
