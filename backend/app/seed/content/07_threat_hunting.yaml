slug: threat-hunting
title: Threat Hunting
domain: Threat Hunting
order: 7
description: >
  Hunting assumes a breach and looks for attackers that alerts missed. Learn to
  form hypotheses from MITRE ATT&CK and test them with data.
lessons:
  - slug: hunt-attack-persistence
    title: Hypothesis-Driven Hunting for Persistence
    order: 1
    difficulty: intermediate
    summary: Use MITRE ATT&CK to hunt for Run key and scheduled task persistence.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Explain the difference between alert triage and proactive threat hunting
      - Navigate MITRE ATT&CK tactics, techniques and procedures
      - Build and test a hunting hypothesis for a persistence technique
    theory: |
      **Threat hunting** is the proactive search for adversaries that evaded automated
      detection. It starts from a **hypothesis**, such as "an attacker has established
      persistence using registry Run keys on a workstation", and uses data to prove or disprove it.

      **MITRE ATT&CK** is a knowledge base of adversary behaviour. **Tactics** are the goal
      (Persistence, Lateral Movement, Exfiltration), **techniques** are how the goal is
      achieved (T1547.001 Registry Run Keys, T1053.005 Scheduled Task), and **procedures** are
      specific real-world implementations. Mapping your hunts and detections to ATT&CK shows
      coverage and gaps.

      A practical hunt loop: pick a technique relevant to your environment; list the data that
      would reveal it (Sysmon 13 for registry writes, Security 4698 for scheduled task creation);
      search for it; **stack** the results (count by value) to find rare outliers; investigate
      outliers; and finally turn what worked into an automated detection.
    examples:
      - title: Hypothesis written down
        body: |
          Hypothesis: A workstation has malware persisting via HKCU\...\CurrentVersion\Run (T1547.001).
          Data: Sysmon event 13, Autoruns output.
          Method: Stack Run key values across hosts; investigate any value seen on only one host.
      - title: Stacking scheduled tasks in KQL
        body: |
          SecurityEvent
          | where EventID == 4698
          | extend Task = tostring(parse_xml(EventData).EventData.Data[1]["#text"])
          | summarize Hosts = dcount(Computer) by Task
          | order by Hosts asc
    exercise:
      title: Plant persistence, then hunt it
      environment: Windows VM with Sysmon installed (from the Windows Security course)
      tools: [Autoruns, Sysmon, PowerShell, MITRE ATT&CK Navigator]
      steps:
        - Read ATT&CK techniques T1547.001 and T1053.005 and note the data sources each lists.
        - Plant benign persistence with `reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v Updater /d "C:\Windows\System32\notepad.exe"`.
        - Create a scheduled task with `schtasks /create /tn "SysCheck" /tr notepad.exe /sc onlogon`.
        - Write a hypothesis, data sources and method for each technique before you search.
        - Find the registry write in Sysmon event 13 and the task creation in Security event 4698 (enable Other Object Access auditing if needed).
        - Run Sysinternals Autoruns, hide Microsoft entries, and confirm both items appear.
        - Remove both persistence items and mark the two techniques in an ATT&CK Navigator layer.
      deliverable: A hunt report with hypothesis, data, queries, findings and an ATT&CK layer screenshot.
    expected_outcome: >
      You can turn an ATT&CK technique into a testable hypothesis, find the evidence, and
      document a repeatable hunt.
    quiz:
      - prompt: What distinguishes threat hunting from alert triage?
        options:
          - Hunting only happens after an alert
          - Hunting proactively searches for threats that did not trigger alerts
          - Hunting is fully automated
          - Hunting only uses antivirus
        answer: 1
        explanation: Hunting assumes compromise and looks for what detections missed.
      - prompt: In ATT&CK, "Persistence" is a
        options: [Technique, Tactic, Procedure, Software]
        answer: 1
        explanation: Tactics are the adversary's goals; techniques are how they achieve them.
      - prompt: What does "stacking" mean in hunting?
        options:
          - Running many tools at once
          - Counting occurrences of values to surface rare outliers
          - Deleting duplicate logs
          - Encrypting data
        answer: 1
        explanation: Rare values across many hosts are often the most interesting.
      - prompt: Which Windows Security event records a scheduled task being created?
        options: ["4688", "4698", "4720", "1102"]
        answer: 1
        explanation: 4698 is "A scheduled task was created".

  - slug: hunt-threat-intel-hypothesis
    title: Threat Intelligence and Hypothesis-Driven Hunting
    order: 2
    difficulty: intermediate
    summary: Turn threat intelligence into a testable hunting hypothesis and hunt for beaconing command-and-control in network logs.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["cysa:1.4", "cysa:1.2", "sc200:4"]
    learning_objectives:
      - Describe threat-intelligence concepts and how they feed hunting
      - Form a testable, hypothesis-driven hunt from intelligence or a framework
      - Hunt for beaconing command-and-control using network telemetry
    theory: |
      **Threat intelligence** is knowledge about adversaries that makes hunting
      focused rather than random. It ranges from **strategic** (who targets your
      sector and why) through **operational** to **tactical** indicators. Analysts
      rank indicators with the **Pyramid of Pain**: hash values and IP addresses are
      trivial for an attacker to change, while **tools** and **tactics, techniques
      and procedures (TTPs)** are costly to change, so hunting for behaviour hurts an
      adversary far more than blocking one hash. Intelligence is tracked as
      **indicators of compromise (IOCs)** and TTPs, often framed with the **Diamond
      Model** (adversary, capability, infrastructure, victim) and mapped to **MITRE
      ATT&CK**.

      **Hypothesis-driven hunting** starts with a specific, testable statement rather
      than a tool. A good hypothesis names an expected behaviour, the data that would
      show it, and what normal looks like: *"an adversary using scheduled beaconing
      would produce regular, similar-sized outbound connections to a rare external
      host; proxy and firewall logs would show this; legitimate traffic is bursty and
      varied."* The hunt then queries that data, separates signal from normal, and
      ends in one of three outcomes: a finding to escalate, a new detection to hand to
      engineering, or a documented "nothing found" that still improves coverage.

      **Beaconing** is a common hunt target. Malware that calls home on a timer leaves
      a statistical fingerprint: low **jitter** (regular intervals), consistent request
      sizes, and a **rare destination** few other hosts contact. You hunt it by grouping
      connections per source-destination pair, measuring the regularity of the interval,
      and ranking by rarity. Because this is behaviour, not a fixed indicator, it finds
      new infrastructure the threat feeds have never listed, which is the whole point of
      hunting above the base of the pyramid.
    examples:
      - title: A hunt hypothesis written down
        body: |
          Hypothesis: a host is beaconing to C2 on a fixed interval.
          Expect:     regular outbound connections, similar byte sizes, rare destination.
          Data:       proxy/firewall logs (src, dst, bytes, timestamp).
          Normal:     human browsing is irregular and hits popular domains.
          Outcome:    escalate a hit, or hand a "regular-interval" detection to engineering.
      - title: Ranking a destination by regularity (KQL-style)
        body: |
          NetworkConnections
          | summarize hits = count(), avgBytes = avg(SentBytes),
                      stdevGap = stdev(datetime_diff('second', TimeGenerated, prev(TimeGenerated)))
                    by SrcIp, DstIp, bin(TimeGenerated, 1d)
          | where hits > 50 and stdevGap < 5   // very regular interval = suspicious
          | order by stdevGap asc
    exercise:
      title: Build a threat-intel hypothesis and hunt for beaconing
      environment: A SIEM or log set with network/proxy connection logs (your Sentinel or ELK lab, or a public PCAP replayed into it); the free MITRE ATT&CK website
      tools: [SIEM query editor or Zeek, MITRE ATT&CK, a document for the hunt report]
      steps:
        - Choose a threat relevant to your lab (for example a commodity loader that beacons to C2) and read its ATT&CK techniques for Command and Control.
        - Write a one-paragraph hunt hypothesis naming the expected behaviour, the data that would reveal it, and what normal traffic looks like.
        - Query your network logs to group connections by source and destination and compute how many hits, average size, and how regular the interval is.
        - Rank destinations by regularity and rarity, and shortlist the most beacon-like source-destination pairs.
        - Investigate one shortlisted pair: check the destination's reputation and whether the process and host explain the traffic, and decide finding vs benign.
        - Place your result on the Pyramid of Pain and explain why a behaviour-based hunt is more durable than blocking the single IP.
        - Write a short hunt report: hypothesis, method, what you found (or did not), and one detection you would hand to engineering.
      deliverable: The written hypothesis, the query and its ranked output, the investigation decision for one pair, and a hunt report ending in a finding or a proposed detection.
    expected_outcome: >
      You can turn threat intelligence into a testable hypothesis, hunt for beaconing
      behaviour in network logs, and finish a hunt with an escalation or a new detection
      rather than a dead end.
    quiz:
      - prompt: On the Pyramid of Pain, hunting for which is most costly for an adversary to evade?
        options: [Hash values, IP addresses, Domain names, Tactics, techniques and procedures]
        answer: 3
        explanation: TTPs sit at the top; changing behaviour is far harder than swapping a hash or IP.
      - prompt: A hypothesis-driven hunt begins with
        options:
          - Running every tool and seeing what fires
          - A specific, testable statement about expected behaviour and the data that would show it
          - Blocking all rare destinations
          - Waiting for an alert
        answer: 1
        explanation: A testable hypothesis guides which data to examine, making hunting proactive and focused.
      - prompt: Low jitter (very regular intervals) in outbound connections can indicate
        options: [A software update, Automated C2 beaconing, Faster internet, A DNS cache]
        answer: 1
        explanation: Human traffic is irregular; machine-timed beacons show consistent intervals.
      - prompt: A hunt that finds nothing is still valuable because it
        options:
          - Proves the network is unbreakable
          - Documents coverage and can become a new detection or baseline
          - Deletes the logs
          - Replaces threat intelligence
        answer: 1
        explanation: A negative result still improves coverage knowledge and can yield a detection or baseline.
      - prompt: The Diamond Model describes an intrusion in terms of
        options:
          - CPU, memory, disk, network
          - Adversary, capability, infrastructure, victim
          - People, process, technology, policy
          - Confidentiality, integrity, availability, safety
        answer: 1
        explanation: The Diamond Model's four vertices are adversary, capability, infrastructure and victim.
  - slug: hunt-c2-beaconing
    title: Hunting Command-and-Control Beaconing
    order: 3
    difficulty: intermediate
    summary: Hunt for the regular callback traffic that malware uses to reach its command-and-control server, separating beacons from noisy-but-benign periodic connections.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Explain how command-and-control beaconing looks in network telemetry
      - Hunt for periodic callbacks using interval, jitter and volume
      - Separate malicious beacons from benign periodic traffic and pivot to the host
    theory: |
      Once malware lands, it usually has to **call home** to a command-and-control
      (**C2**) server for instructions. That callback is often a **beacon**: a small
      request sent on a regular schedule. The schedule is the tell. Human and most
      application traffic is bursty and irregular, while a beacon ticks at a near-fixed
      **interval**, so plotting one host-to-destination pair's connections over time
      shows an unmistakable heartbeat. Modern implants add **jitter** (randomised delay,
      say plus or minus 20%) to blur the interval, so hunters look for a tight cluster
      of intervals rather than one exact number.

      Beyond timing, beacons share traits worth hunting on. The requests are usually
      **small and uniform** in size, the destination is often **newly registered** or
      has a **low reputation**, and the traffic may hide in normal-looking **HTTPS**,
      **DNS** (data smuggled in subdomains) or even a legitimate cloud service used as
      a redirector. Tooling clues help too: a repeated **JA3/JA3S** TLS fingerprint or
      an odd **user-agent** can group a family of beacons. No single signal is proof;
      the hunt combines them, because each one alone has benign look-alikes.

      That is the hard part, **benign periodic traffic**. Software updates, telemetry,
      certificate checks (OCSP), NTP and monitoring agents all beacon on a schedule.
      The hunter's job is to **rule those out**: a known software vendor on a known port
      at a documented cadence is expected, so it is **baselined and allowlisted**, which
      sharpens the next hunt. What survives the filter (a regular, low-volume callback
      to an unknown, low-reputation destination from an unexpected process) is the lead
      to pivot on, moving from the network record to the host to find the process and
      its persistence.
    examples:
      - title: A heartbeat stands out from human traffic
        body: |
          Host -> 203.0.113.9  connection times (seconds apart):
          3601, 3598, 3602, 3600, 3599   -> ~60 min beacon, tiny jitter  SUSPECT
          Host -> cdn.example  connection times:
          4, 220, 17, 905, 6             -> irregular, human browsing     NORMAL
      - title: Rule out the benign before chasing the lead
        body: |
          Periodic to vendor-update.example:443  -> known updater, documented  allowlist
          Periodic to 45.craftreg.xyz:443        -> domain registered 2 days ago, no owner
          Pivot on the second: which process? what persistence launched it?
    exercise:
      title: Hunt a beacon in connection logs and pivot to the host
      environment: Network connection or proxy logs with timestamps (a sample dataset, SIEM export, or lab capture) and a spreadsheet or notebook
      tools: [A SIEM or log tool, a spreadsheet for interval analysis, a domain-reputation lookup]
      steps:
        - State a hunting hypothesis for C2 beaconing in one sentence (for example, a host is calling an unknown destination on a fixed interval).
        - Group connections by source host and destination, and for the busiest pairs compute the time gaps between successive connections.
        - Identify at least one destination whose intervals cluster tightly (allowing for jitter) and note the interval and the typical request size.
        - Check the destination's age and reputation and confirm whether the volume and uniformity fit a beacon.
        - Rule out benign periodic traffic by listing which destinations are known updaters, telemetry or monitoring, and allowlist them with a reason.
        - For the surviving suspect, write the pivot to the host: which process owns the connection and what persistence would you look for.
        - Record the hunt outcome, including what you would turn into a detection if the lead is confirmed.
      deliverable: The hypothesis, the interval analysis identifying a suspected beacon, the benign allowlist with reasons, and the host pivot plus a proposed detection.
    expected_outcome: >
      You can hunt for command-and-control beaconing by its interval, jitter and volume,
      separate it from benign periodic traffic, and pivot from a suspicious callback to
      the host process and its persistence, turning a confirmed lead into a detection.
    quiz:
      - prompt: What most distinguishes malware beaconing from normal user web traffic?
        options:
          - It always uses plain HTTP
          - Its connections recur on a near-fixed interval rather than in irregular bursts
          - It is always a large file transfer
          - It only happens at night
        answer: 1
        explanation: A regular callback interval (even with jitter) is the signature of beaconing, unlike the bursty, irregular pattern of human activity.
      - prompt: Why do implants add jitter to their beacon interval?
        options:
          - To send more data
          - To randomise the timing so the beacon is harder to spot as perfectly periodic
          - To reduce CPU usage
          - To encrypt the traffic
        answer: 1
        explanation: Jitter spreads the interval around a value so hunters must look for a tight cluster of intervals rather than one exact number.
      - prompt: A regular, low-volume callback to a software vendor's documented update endpoint is best treated as
        options:
          - An immediate incident
          - Benign periodic traffic to baseline and allowlist
          - Proof of C2
          - A false negative
        answer: 1
        explanation: Known, documented periodic traffic is expected and should be ruled out and allowlisted so the hunt focuses on unknown destinations.
      - prompt: After finding a suspected beacon in network logs, the next step is to
        options: [Delete the logs, Pivot to the host to find the owning process and its persistence, Reboot the firewall, Lower the destination's CVSS]
        answer: 1
        explanation: The network record is the lead; confirming it means moving to the host to identify the process and how it persists.
  - slug: hunt-lolbins-process-lineage
    title: Hunting Living-off-the-Land and Process Lineage
    order: 4
    difficulty: intermediate
    summary: Hunt for attackers abusing built-in system tools by reading process ancestry and command lines, where the binary is trusted but the behaviour is not.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Explain living-off-the-land and why signatures miss it
      - Hunt with parent-child process lineage and command-line context
      - Separate legitimate admin use from abuse and pivot to a verdict
    theory: |
      Modern intruders prefer to **live off the land**, using tools already on the system
      instead of dropping malware. These **LOLBins** (living-off-the-land binaries) are
      signed, trusted built-ins such as PowerShell, `wmic`, `rundll32`, `regsvr32`,
      `mshta`, `certutil` or `bitsadmin`. Because the binary is legitimate, antivirus
      signatures miss the activity, so the hunt shifts from *what ran* to *how and why it
      ran*. The behaviour is the signal, not the file.

      The strongest behavioural signal is **process lineage**, the parent-child chain.
      A document opening is normal; **Word spawning PowerShell**, or an Office app
      launching `cmd` that launches `certutil` to download a file, is not. Hunters read
      the tree and ask whether this parent should ever launch this child. **Command-line
      context** sharpens it: encoded or obfuscated PowerShell (`-enc`), a `certutil`
      invocation that fetches a URL, or `rundll32` with an unusual export are classic
      abuse patterns. Enriching with the **user**, the **host role** and the **time**
      tells you whether it fits that machine's normal work.

      The hard part, again, is that these tools have **legitimate admin uses**. Backup
      jobs, software deployment and login scripts run the same binaries, so the hunt is
      about **separating admin from abuse**: known management hosts and service accounts
      at expected times are baselined, and what remains (an unexpected parent, an encoded
      command, an office app as the ancestor, a workstation acting like an admin console)
      is the lead. From there the hunter pivots to the full session to reach a verdict and,
      if confirmed, turns the pattern into a behavioural detection rather than a file hash.
    examples:
      - title: The binary is trusted, the lineage is not
        body: |
          Normal:   services.exe -> svchost.exe -> known service
          Suspect:  winword.exe  -> powershell.exe -enc <base64>   (Office spawning PS)
          Suspect:  explorer.exe -> certutil.exe -urlcache -f http://... (download)
      - title: Rule out admin before calling it abuse
        body: |
          powershell on JUMP-ADM by svc-deploy at 02:00  -> known deployment, baseline
          powershell -enc on HR-LAPTOP by a user at 14:00 -> unexpected, pivot and verdict
    exercise:
      title: Hunt living-off-the-land abuse in process telemetry
      environment: Process-creation telemetry with parent-child and command-line fields (EDR or Sysmon/event-log data, a sample set or lab) and a notebook
      tools: [A SIEM or EDR with process events, a list of common LOLBins, a spreadsheet or notebook]
      steps:
        - State a hunting hypothesis for living-off-the-land abuse in one sentence (for example, a trusted binary launched by an unexpected parent).
        - Query process-creation events for a handful of common LOLBins and include the parent process and full command line.
        - Pick two results and read their process lineage, deciding whether the parent should legitimately launch that child.
        - Inspect the command lines for abuse patterns such as encoding, a download flag, or an unusual export, and note what each one does.
        - Enrich with user, host role and time, and rule out legitimate admin or automation by baselining known management hosts and accounts.
        - For one surviving suspect, pivot to the rest of that session (what ran before and after) and write a verdict with your reasoning.
        - Propose a behavioural detection (parent-child plus command-line condition) you would create if the lead is confirmed, not a file hash.
      deliverable: The hypothesis, the LOLBin query results with lineage, the command-line analysis, the admin baseline, and a verdict plus a proposed behavioural detection.
    expected_outcome: >
      You can hunt living-off-the-land activity by reading process lineage and command
      lines rather than file signatures, separate legitimate administration from abuse,
      and turn a confirmed pattern into a behavioural detection.
    quiz:
      - prompt: Why do antivirus signatures often miss living-off-the-land attacks?
        options:
          - The attacks are too small
          - They abuse legitimate, signed built-in tools, so there is no malicious file to signature
          - They only run at night
          - They never touch the disk
        answer: 1
        explanation: LOLBins are trusted system binaries, so detection must focus on how they are used, not on a malicious file signature.
      - prompt: The strongest behavioural signal when hunting LOLBin abuse is
        options:
          - The file's size
          - The parent-child process lineage and command-line context
          - The binary's icon
          - The amount of RAM used
        answer: 1
        explanation: Whether a parent should launch a given child, plus the command line, reveals abuse of an otherwise trusted tool.
      - prompt: Word (winword.exe) spawning an encoded PowerShell command is suspicious because
        options:
          - PowerShell is malware
          - An office document should not normally launch an obfuscated scripting process
          - Word is not signed
          - PowerShell cannot be encoded
        answer: 1
        explanation: The lineage is the anomaly, because a document application launching obfuscated PowerShell is a classic initial-access pattern.
      - prompt: A confirmed LOLBin abuse pattern is best turned into
        options: [A single file hash block, A behavioural detection on parent-child plus command line, A firewall rule, A new password policy]
        answer: 1
        explanation: Because the binary is legitimate, the durable detection is behavioural (lineage and command line), not a file hash.

  - slug: hunt-lateral-movement
    title: Hunting Lateral Movement and Credential Access
    order: 5
    difficulty: advanced
    summary: Hunt the signs of an attacker moving between hosts and stealing credentials.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:1.2", "sc200:4"]
    learning_objectives:
      - Describe how attackers move laterally and harvest credentials inside a network
      - Form hunting hypotheses for remote execution and anomalous authentication
      - Separate normal administration from suspicious movement in the evidence
    theory: |
      Once an attacker has one foothold they rarely stay put. **Lateral movement** is spreading to
      other hosts to reach the real objective, and it runs on stolen credentials. The common
      techniques are worth hunting by name. **Pass-the-hash** and **pass-the-ticket** reuse captured
      authentication material instead of a password. **Remote execution** over SMB, WMI, WinRM or a
      tool like PsExec runs code on another host. **Kerberoasting** requests service tickets to
      crack service-account passwords offline.

      The hunt starts from a hypothesis, not a tool. A good one is specific and falsifiable, such as
      a compromised admin account running code on servers it never normally touches. From there you
      look for the evidence that behaviour would leave, a workstation suddenly making authenticated
      connections to many hosts, a service account logging in interactively, network logons (type 3)
      from an account that only ever worked at a console, or a burst of service-ticket requests.

      The hard part is that administrators do many of these same things. So the hunt is really about
      **baselines**, which accounts normally reach which hosts, from where, at what hours, and about
      **fan-out**, because one source touching many destinations in a short window is the shape
      movement takes. A confirmed hunt turns into a detection and a list of hosts and accounts to
      scope for incident response.
    examples:
      - title: Fan-out from one workstation
        body: |
          host=WKS-14  account=svc-backup  logon_type=3
          targets in 5 min = SRV-01, SRV-02, SRV-03, SRV-07, SRV-09
          A backup service account making network logons to many servers at once is unusual movement.
      - title: A hypothesis written to be falsifiable
        body: |
          Hypothesis   a compromised admin account is running code on hosts it never normally touches
          Evidence     remote-execution events (SMB or WMI) grouped by source account and destination host
          If every destination is one the account routinely administers, the hypothesis fails and you move on.
    exercise:
      title: Hunt lateral movement in sample authentication logs
      environment: A SIEM or notebook with sample authentication and remote-execution logs
      tools: [Sample Windows logon and process logs, a SIEM or notebook, a notes file]
      steps:
        - Write one falsifiable hypothesis about lateral movement, naming the account behaviour you expect to see.
        - Build a baseline of which accounts normally authenticate to which hosts from the sample data.
        - Search for network logons (type 3) by accounts that normally only log in at a console.
        - Look for one source host or account authenticating to many destinations inside a short window.
        - Check for remote-execution signs such as service creation or WMI and PsExec activity on the destinations.
        - For each hit, decide from the baseline whether it is routine administration or suspicious, and say why.
        - Turn one confirmed pattern into a detection idea and list the hosts and accounts to scope.
      deliverable: A hunt write-up with the hypothesis, the suspicious movement you found versus what you ruled out, and one detection idea.
    expected_outcome: >
      You can hypothesise how an attacker would move laterally, find the authentication
      and execution evidence, and tell real movement from normal administration.
    quiz:
      - prompt: Pass-the-hash lets an attacker
        options:
          - Reset a user's password
          - Authenticate using captured credential material instead of the plaintext password
          - Encrypt a disk
          - Scan for open ports
        answer: 1
        explanation: Pass-the-hash reuses a stolen hash to authenticate, so the attacker never needs the plaintext password.
      - prompt: Which pattern most suggests lateral movement rather than normal admin work?
        options: [One account logging into its own workstation, One source authenticating to many hosts it never normally touches in a short window, A nightly backup to the same server, A user reading email]
        answer: 1
        explanation: Fan-out from one source to many unfamiliar destinations in a short window is the shape lateral movement takes.
      - prompt: Why baseline normal account-to-host access before hunting movement?
        options:
          - Baselines slow the hunt down
          - Because administrators do many of the same actions, so you need normal to spot the abnormal
          - To delete logs
          - Baselines replace detections
        answer: 1
        explanation: Much movement looks like administration, so only a baseline of normal access lets you flag the genuinely unusual.
      - prompt: A good hunting hypothesis is
        options: [Something is wrong somewhere, Specific and falsifiable so evidence can confirm or kill it, A list of every tool, Only a dashboard]
        answer: 1
        explanation: A specific, falsifiable hypothesis tells you what evidence to look for and when to move on.

  - slug: hunt-data-exfiltration
    title: Hunting Data Exfiltration
    order: 6
    difficulty: advanced
    summary: Find data leaving the network by its volume, destination and timing.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:1.2", "sc200:4"]
    learning_objectives:
      - Describe how attackers stage and move stolen data out of a network
      - Form hunting hypotheses around egress volume, destination and timing
      - Separate real exfiltration from backups and legitimate sync
    theory: |
      Exfiltration is the objective of many intrusions, and like other attacker behaviour it leaves
      a shape even when the contents are hidden. The pattern is usually **stage, package, move**:
      collect the data into one place, compress or encrypt it into an archive, then push it out over
      a channel the network already allows, an HTTPS upload, a personal cloud-storage account, email,
      or DNS. The payload is hidden by encryption, but the **volume, destination and timing** are
      not.

      Good hunts start from a hypothesis about that shape. A host sending far more outbound than its
      own baseline; a large upload to a new or rare external destination or a personal file-sharing
      service; transfers at odd hours; or a sudden archive creation followed by egress. The metrics
      that expose it are bytes out per host against baseline, an inverted upload-to-download ratio,
      the rarity of the destination, and the time of day. Encrypted traffic defeats content
      inspection but not these signals.

      The discipline is ruling out the benign. Backups, software updates and legitimate cloud sync
      also move large volumes, so a baseline of what each host normally sends, and to where, is what
      lets you flag the genuinely unusual. A confirmed hunt hands over the host, the data that was
      touched, the destination, a timeline, and the containment it calls for, such as blocking the
      destination and isolating the host.
    examples:
      - title: An egress spike against baseline
        body: |
          host=10.2.3.9  normal daily upload = 20-80 MB
          today = 7.1 GB uploaded to an unfamiliar cloud-storage host
          Far above baseline, to a rare destination, is the shape of exfiltration.
      - title: Stage then move
        body: |
          14:40  archive created  /tmp/export.7z (3.2 GB)
          14:52  7.1 GB uploaded to an external host
          A large archive appearing just before a big upload ties staging to egress.
    exercise:
      title: Hunt exfiltration in sample egress data
      environment: A SIEM or notebook with sample proxy, firewall or flow logs
      tools: [Sample egress logs, a SIEM or notebook, a notes file]
      steps:
        - Write one falsifiable hypothesis about how data would leave this environment.
        - Build a per-host baseline of normal outbound volume from the sample data.
        - Flag hosts whose outbound volume is far above their baseline in the hunt window.
        - For a flagged host, check the destination's rarity, the upload-to-download ratio and the time of day.
        - Rule out backups and legitimate cloud sync, and say how you told them apart.
        - For one confirmed case, name the host, the destination, a timeline and the containment you would recommend.
      deliverable: A hunt write-up with the hypothesis, the confirmed exfiltration versus what you ruled out, and the containment actions.
    expected_outcome: >
      You can hypothesise how data would leave, find it by egress volume, destination and
      timing, tell it from backups and sync, and hand off a scoped case with containment.
    quiz:
      - prompt: Encrypted exfiltration still exposes which signals?
        options:
          - The file contents
          - The volume, destination and timing of the transfer
          - The user's password
          - Nothing at all
        answer: 1
        explanation: Encryption hides contents but not how much left, to where, or when, which is what the hunt uses.
      - prompt: A sudden large archive created just before a big upload suggests
        options: [A normal backup, Staging and then exfiltration, A software update, A DNS lookup]
        answer: 1
        explanation: Collecting data into an archive and then pushing it out is the stage-then-move pattern of exfiltration.
      - prompt: Why baseline each host's normal outbound volume before hunting exfiltration?
        options:
          - Baselines are decorative
          - Because backups and legitimate sync also move large volumes, so you need normal to spot the abnormal
          - To block all uploads
          - To delete logs
        answer: 1
        explanation: Large transfers are not all malicious, so a baseline lets you separate exfiltration from benign bulk traffic.
      - prompt: A confirmed exfiltration hunt should hand off
        options: [Just a hunch, The host, destination, data touched, a timeline and containment, A reboot, Nothing]
        answer: 1
        explanation: The useful output scopes the incident with the host, destination, affected data, timeline and containment steps.
  - slug: hunt-identity-cloud
    title: Hunting Identity and Cloud Threats
    order: 7
    difficulty: intermediate
    summary: Hunt for account and cloud abuse in sign-in and audit logs, where the attacker is a valid credential rather than a process on a host.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["sc200:4", "cysa:1.4", "cysa:3.1"]
    learning_objectives:
      - Explain why identity is the primary attack surface in cloud environments
      - Hunt sign-in and audit logs for token theft, consent abuse and anomalous access
      - Separate attacker behaviour from legitimate admin and travel patterns
    theory: |
      In the cloud there is often no malware to find; the attacker signs in as a valid user.
      That makes **identity the perimeter**, and the hunting ground is the **sign-in log** and
      the **audit log** of the identity provider (Entra ID, Okta, Google) and the cloud control
      plane. The hunter looks for a credential being used in ways the real owner would not: from
      a new country, a new device, an odd hour, or from an IP tied to an anonymiser.

      Several behaviours are worth a standing hunt. **Impossible travel** is two sign-ins too far
      apart to be the same person in the time between them. **Token theft** shows up as a session
      reused from a new location without a fresh authentication, which is why MFA alone does not
      end the story. **OAuth consent abuse** is a user granting a malicious app broad, lasting
      access, which survives a password reset. And **privilege escalation** in the control plane,
      a new global admin, a added credential on a service principal, or a mailbox forwarding rule,
      is where an intruder turns a foothold into persistence.

      The hard part is that nearly all of this activity has a legitimate twin: people really do
      travel, admins really do create accounts, and apps really are granted consent. So a cloud
      hunt leans on **baselines** (what is normal for this user, this tenant, this role) and on
      **correlation** (a risky sign-in *and* a new inbox rule *and* a consent grant in one hour is
      a story, any one alone may be noise). As with any hunt, a finding becomes either an incident
      or a new detection, and repeated benign hits feed tuning.
    examples:
      - title: Correlating a cloud account-takeover story
        body: |
          09:02  risky sign-in for user from new country (no MFA prompt - reused token)
          09:05  new mailbox forwarding rule to external address
          09:11  OAuth consent granted to unverified app with Mail.Read
          One event is noise; the three together are an account takeover.
      - title: Impossible travel vs a real trip
        body: |
          Sign-in A  London 08:00    Sign-in B  Sydney 09:30   -> impossible in 90 min
          But: a corporate VPN egress in Sydney can fake this -> check the device and the ASN
          Baseline the user's usual locations before calling it malicious.
    exercise:
      title: Hunt a cloud identity data set
      environment: Sample sign-in and audit logs (a lab tenant's exported logs, the Microsoft demo workspace, or a provided identity data set)
      tools: [SIEM or notebook, sample sign-in and audit logs, a notes file]
      steps:
        - State a hypothesis for an identity threat (for example "a stolen session is being reused from a new location") and the log fields that would show it.
        - Query the sign-in logs for risky or anomalous sign-ins and baseline each flagged user's normal locations, devices and hours.
        - Hunt the audit log for control-plane changes (new admin role, added app credential, new mailbox forwarding rule, OAuth consent grants).
        - Correlate sign-in anomalies with audit changes on the same account within a short window and assemble a timeline.
        - For each lead, decide whether it is an attack or a legitimate twin (real travel, an admin's expected change) and justify it from the evidence.
        - Write either the incident hand-off (timeline and affected identities) or the detection you would build for a true finding, and note any benign pattern to tune out.
      deliverable: A hunt write-up with the hypothesis, the anomalies and audit changes found, the correlated timeline, your true/false calls with justification, and the detection or tuning that results.
    expected_outcome: >
      You can hunt sign-in and audit logs for identity and cloud abuse, correlate a risky
      sign-in with control-plane changes into a story, and tell attacker behaviour from its
      legitimate twin before escalating.
    quiz:
      - prompt: Why is identity described as the perimeter in cloud environments?
        options:
          - Because cloud has no logs
          - Because an attacker often uses a valid credential rather than malware on a host
          - Because firewalls are unnecessary
          - Because MFA removes all risk
        answer: 1
        explanation: With no host to compromise, access turns on credentials, so identity is the main attack surface.
      - prompt: Why does MFA alone not rule out account compromise?
        options:
          - MFA is never used in the cloud
          - A stolen session token can be reused without a fresh authentication
          - MFA deletes the sign-in logs
          - MFA only applies to admins
        answer: 1
        explanation: Token theft reuses an already-authenticated session, so the attacker never faces the MFA prompt.
      - prompt: OAuth consent abuse is dangerous mainly because
        options:
          - It changes the user's password
          - The granted app access is broad and persists through a password reset
          - It only affects one email
          - It disables logging
        answer: 1
        explanation: A consent grant gives an app lasting access that survives credential resets, making it stealthy persistence.
      - prompt: What most reliably separates a cloud attack from its legitimate twin?
        options:
          - Acting on any single risky sign-in immediately
          - Baselining normal behaviour and correlating multiple events into one story
          - Ignoring the audit log
          - Trusting the IP geolocation alone
        answer: 1
        explanation: Baselines plus correlation turn ambiguous single events into a defensible finding and cut false positives.
  - slug: hunt-ransomware-precursors
    title: Hunting Ransomware Precursors
    order: 8
    difficulty: intermediate
    summary: Hunt for the activity that precedes ransomware, access, discovery, credential theft, lateral movement and staging, so it is caught in the hours before encryption, not after.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Describe the typical stages that precede ransomware encryption
      - Hunt for discovery, credential access, lateral movement and staging behaviours
      - Prioritise precursor findings so response happens before encryption
    theory: |
      Ransomware encryption is the last act, not the first. Modern ransomware intrusions unfold over hours
      to days: an initial foothold (phishing, a vulnerable service, bought access), then **discovery** of
      the environment, **credential theft** to gain privilege, **lateral movement** to spread,
      **defence evasion** (disabling security tools, clearing logs), **exfiltration** for double extortion,
      and finally mass **encryption**. Every stage before the last leaves telemetry, so the goal of hunting
      ransomware is to catch the precursors and respond in the window before the payload fires.

      The precursor behaviours are specific and huntable. **Discovery** shows up as a burst of network and
      AD enumeration, tools like network scanners, `net`/`nltest`, or AD query tools run in quick
      succession. **Credential access** appears as LSASS access, Kerberoasting, or a dump of the domain
      database. **Lateral movement** rides legitimate channels, RDP, SMB, remote service creation, WMI, and
      a spike of these from one host to many is a strong signal. **Staging and defence evasion** include
      shadow-copy deletion (`vssadmin delete shadows`), stopping backup and AV services, and archiving data
      before exfiltration. Hunting for these behaviours, rather than a specific ransomware family, catches
      intrusions regardless of the strain.

      Because the clock is running, **prioritisation** is everything. A precursor finding is not a routine
      queue item; shadow-copy deletion or mass SMB access from one host is a likely active intrusion minutes
      from encryption, and it is escalated immediately for containment, isolate the host, disable the
      account, rather than worked slowly. The hunter still confirms, a backup admin legitimately touches
      shadow copies, but the bar for fast action is low when the pattern fits a ransomware kill chain. The
      payoff of this hunt is the whole game: catching it at discovery or lateral movement means a contained
      incident; catching it at encryption means a disaster-recovery event.
    examples:
      - title: A precursor kill chain to catch early
        body: |
          foothold -> AD discovery (nltest/net) -> LSASS dump -> RDP/SMB to many hosts
          -> stop AV + "vssadmin delete shadows" -> archive + exfil -> ENCRYPT
          Every arrow before ENCRYPT is a chance to hunt and contain.
      - title: A high-urgency precursor
        body: |
          Event: "vssadmin delete shadows /all" on a file server
          Legit? rarely -> likely ransomware staging, minutes from encryption
          Action: escalate NOW (isolate host, disable account), confirm in parallel.
    exercise:
      title: Hunt a data set for ransomware precursors
      environment: Sample endpoint, AD and network logs (provided or lab-generated) containing some benign and some precursor-like activity
      tools: [A SIEM or notebook, sample logs, a MITRE ATT&CK reference, a notes file]
      steps:
        - List the stages that precede ransomware encryption and the telemetry each would produce.
        - Hunt the logs for discovery activity (a burst of network or AD enumeration) and note what you find.
        - Hunt for credential-access and lateral-movement signals (LSASS access, RDP/SMB spikes from one host to many).
        - Hunt for staging and defence evasion (shadow-copy deletion, stopping backup or AV services) and rate its urgency.
        - For the highest-urgency finding, write the immediate containment action and say how you would confirm in parallel rather than before acting.
        - Map your findings to ATT&CK stages and state at which stage you would have caught this intrusion.
      deliverable: A hunt write-up listing the precursor stages found, the highest-urgency finding with an immediate containment action, and the ATT&CK stage at which the intrusion would have been caught.
    expected_outcome: >
      You can hunt the discovery, credential-access, lateral-movement and staging behaviours that precede
      ransomware, prioritise a precursor as an active intrusion, and drive containment in the window before
      encryption rather than after.
    quiz:
      - prompt: Why hunt ransomware precursors rather than the encryption itself?
        options:
          - Encryption is harmless
          - The stages before encryption leave telemetry and offer a window to contain the intrusion first
          - Precursors are easier to ignore
          - Encryption cannot be detected
        answer: 1
        explanation: Catching discovery, credential theft or lateral movement lets you contain before the payload fires.
      - prompt: Deletion of volume shadow copies (vssadmin delete shadows) is
        options:
          - Routine maintenance to ignore
          - A high-urgency ransomware-staging signal to escalate immediately
          - A network scan
          - A backup success
        answer: 1
        explanation: Destroying shadow copies removes recovery options and typically precedes encryption, warranting immediate action.
      - prompt: Hunting for precursor behaviours rather than a specific family means
        options:
          - It only works on one strain
          - It catches ransomware intrusions regardless of the particular family
          - It needs the ransom note first
          - It ignores lateral movement
        answer: 1
        explanation: Behaviour-based hunting generalises across strains because the kill-chain stages are common.
      - prompt: A spike of RDP/SMB connections from one host to many is a sign of
        options: [Normal backups, Lateral movement worth urgent investigation, A DNS change, A patch install]
        answer: 1
        explanation: One host suddenly reaching many others over remote channels is classic lateral movement.
  - slug: hunt-initial-access-phishing
    title: Hunting for Initial Access
    order: 9
    difficulty: intermediate
    summary: Hunt for the earliest stage of an intrusion, how the attacker first got in, by looking for the signs of phishing, malicious documents and exploited exposure before the foothold becomes an incident.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Describe the common initial-access techniques and their telemetry
      - Hunt for the signs of a foothold being established
      - Connect an initial-access finding to the activity that follows
    theory: |
      Every intrusion has a first step, and hunting for **initial access** aims to catch it before it becomes
      a full incident. The common routes are well understood: **phishing** that lures a user into opening a
      malicious attachment or link, **malicious documents** that execute code when opened, exploitation of an
      **exposed service** or unpatched internet-facing application, and the use of **valid accounts** bought or
      phished. Each leaves a distinctive early footprint, and because initial access is the narrowest point of
      the whole attack, catching it there contains an intrusion with the least damage.

      The telemetry is specific and huntable. Phishing-driven access often shows as an email attachment opened,
      then an Office application spawning a script interpreter (Word launching PowerShell), then a network
      connection, a tell-tale chain. Exploited exposure shows as a web or application server spawning a shell
      or making unexpected outbound connections shortly after an inbound request. Valid-account abuse shows as
      a first-ever login from a new location or device. The hunter looks for these early sequences rather than
      waiting for later, louder stages, and uses the organisation's own baseline, which users normally run
      macros, which servers normally spawn shells (almost none), to tell the foothold from the noise.

      What makes initial-access hunting powerful is **connecting it forward**. A single suspicious document
      execution is a lead; the same host then doing discovery, reaching out to an unfamiliar domain, or a new
      account appearing turns it into a confirmed foothold with a story. So the hunt does not stop at the first
      sign, it pivots to what the host or account did next, building the early timeline that lets responders
      contain the intrusion while it is still one host. The discipline is the same as any hunt, a hit is a lead
      confirmed against the baseline and corroborating activity, but the payoff is the highest, because
      catching the attacker at the front door is far cheaper than catching them at the vault.
    examples:
      - title: A phishing foothold chain
        body: |
          email attachment opened -> WINWORD.EXE spawns powershell.exe
          -> outbound connection to an unfamiliar domain
          Three ordinary events; the sequence is the foothold.
      - title: Exploited exposure
        body: |
          inbound request to web server -> server spawns /bin/sh
          -> outbound to 185.x.x.x shortly after
          Servers almost never spawn shells; the baseline makes this stand out.
    exercise:
      title: Hunt a data set for initial access and pivot forward
      environment: Sample email, endpoint and web/server logs (provided or lab-generated) containing a foothold and benign activity
      tools: [A SIEM or notebook, sample multi-source logs, a MITRE ATT&CK reference, a notes file]
      steps:
        - List the common initial-access techniques and the early telemetry each produces.
        - Hunt the logs for a phishing-driven foothold (document opened then a script interpreter then network activity) and describe what you find.
        - Hunt for an exploited-exposure foothold (a server spawning a shell or making unexpected outbound connections).
        - For one finding, show the baseline that makes it stand out (what that host or user normally does).
        - Pivot forward from the finding to what the host or account did next, building the early timeline.
        - Map the findings to ATT&CK initial-access techniques and state how you would confirm before escalating to containment.
      deliverable: A hunt write-up with the initial-access techniques, one phishing and one exploitation foothold found, the baseline that revealed each, the forward pivot timeline, and the ATT&CK mapping.
    expected_outcome: >
      You can hunt for initial access, recognising the phishing, malicious-document and exploited-exposure
      footprints, confirm them against the baseline, and pivot forward to the following activity so an
      intrusion is contained while it is still a single foothold.
    quiz:
      - prompt: Why is hunting for initial access especially valuable?
        options:
          - It is the loudest stage
          - It is the narrowest point of the attack, so catching it there contains the intrusion with the least damage
          - It cannot be detected
          - It only matters after encryption
        answer: 1
        explanation: Initial access is the front door; catching it there is far cheaper than catching later stages.
      - prompt: An Office application spawning a script interpreter and then making a network connection suggests
        options: [Normal use, A phishing-driven foothold being established, A backup, A patch install]
        answer: 1
        explanation: Document-to-interpreter-to-network is a classic malicious-document execution chain.
      - prompt: A web server spawning a shell shortly after an inbound request suggests
        options: [Routine maintenance, Exploitation of the exposed service, A DNS change, A certificate renewal]
        answer: 1
        explanation: Servers almost never spawn shells, so this pattern indicates an exploited foothold.
      - prompt: After finding a likely foothold, the hunter should
        options:
          - Stop there
          - Pivot forward to what the host or account did next to build the early timeline
          - Delete the logs
          - Ignore the baseline
        answer: 1
        explanation: Connecting the foothold to subsequent activity confirms the intrusion and enables containment.
  - slug: hunt-program-metrics
    title: Building and Measuring a Hunt Program
    order: 10
    difficulty: intermediate
    summary: Turn ad-hoc hunting into a repeatable program with hypotheses, documentation and metrics, so hunts improve detections and coverage over time instead of being one-off efforts.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:4.1", "sc200:4"]
    learning_objectives:
      - Explain why hunting needs to be a program, not a series of one-off efforts
      - Structure hunts so their results are repeatable and feed back into detection
      - Measure a hunt program by outcomes beyond whether it found an intrusion
    theory: |
      A single clever hunt is valuable; a **hunt program** is far more so, because it makes the value
      repeatable and compounding. Ad-hoc hunting, someone pokes at the data when they have time, finds things
      inconsistently and leaves nothing behind. A program structures the work: hunts are planned around
      **hypotheses** tied to real threats and the organisation's risk (often framed with MITRE ATT&CK),
      documented as they run, and, crucially, their results are turned into lasting improvements rather than
      evaporating when the hunt ends. The shift is from heroics to a discipline that gets better over time.

      Structure starts with the **hypothesis**: a testable statement like "an attacker is using WMI for lateral
      movement, and we would see it as X". The hunt gathers the relevant data, tests the hypothesis, and reaches
      a verdict, found evidence, found nothing, or inconclusive because the data was missing. Each outcome is
      useful. A finding becomes an incident. A clean result with good data increases confidence and, importantly,
      often becomes a **new detection**, if you could hunt it manually, you can frequently automate it so the
      SIEM catches it next time. And a hunt blocked by missing data is itself a finding: it reveals a
      **visibility gap** to close. Documenting each hunt, hypothesis, data used, method, result, means the next
      hunter builds on it instead of starting over.

      Measuring a hunt program is subtle, because "did we catch an attacker" is the wrong primary metric, most
      hunts correctly find nothing, and a program judged only on catches would be called a failure while doing
      its job. Better measures are **outcomes**: new detections created, visibility gaps found and closed,
      ATT&CK coverage exercised, and dwell-time reductions when hunts do find things. These show the program
      hardening the environment whether or not any single hunt lands. For the analyst, the lesson is that
      hunting matures like any capability, from inspired one-offs into a measured program whose real product is
      better detection and fewer blind spots, not just the occasional dramatic catch.
    examples:
      - title: Every hunt outcome is useful
        body: |
          found evidence     -> incident
          clean + good data  -> confidence + often a NEW automated detection
          blocked, no data   -> a visibility gap to close (also a finding)
          Nothing is wasted if the hunt is structured.
      - title: Measuring by outcomes, not catches
        body: |
          Wrong metric:  "intrusions caught" (most hunts rightly find none)
          Right metrics: new detections, gaps closed, ATT&CK coverage, dwell-time reduction
          The program hardens the environment whether or not a hunt lands.
    exercise:
      title: Plan a structured hunt and define program metrics
      environment: A described environment with available data sources (or a lab), plus a hunt-documentation template
      tools: [A hunt template, a MITRE ATT&CK reference, available data sources or a lab, a notes file]
      steps:
        - Explain why ad-hoc hunting leaves less value than a structured program.
        - Write a testable hypothesis for a hunt, tied to a real threat and framed with ATT&CK.
        - Describe the data the hunt needs, the method, and the three possible verdicts (evidence / clean / inconclusive) and what each means.
        - Explain how a clean result with good data can become a new automated detection, and how a data-blocked hunt reveals a visibility gap.
        - Document the hunt so a future hunter can build on it (hypothesis, data, method, result).
        - Define the outcome metrics you would track for the program and explain why "intrusions caught" is the wrong primary measure.
      deliverable: A structured hunt plan with a hypothesis, data and method, the three verdicts and their follow-ups, documentation for reuse, and a set of outcome metrics for the program.
    expected_outcome: >
      You can turn hunting into a repeatable program built on hypotheses and documentation, convert hunt
      results into new detections and closed visibility gaps, and measure the program by outcomes rather than
      by whether any single hunt caught an intrusion.
    quiz:
      - prompt: Why structure hunting as a program rather than ad-hoc efforts?
        options:
          - To do less hunting
          - To make its value repeatable and compounding, with results that feed back into detection
          - To avoid documentation
          - Because hunting never works
        answer: 1
        explanation: A program makes hunts planned, documented and improvement-driving instead of inconsistent one-offs.
      - prompt: A hunt that finds nothing but had good data is valuable because it
        options:
          - Was a waste
          - Increases confidence and often becomes a new automated detection
          - Means the data is useless
          - Should be hidden
        answer: 1
        explanation: A clean result with solid data builds assurance and can often be automated into a standing detection.
      - prompt: A hunt blocked by missing data reveals
        options:
          - Nothing
          - A visibility gap to close, which is itself a useful finding
          - That hunting is pointless
          - A false positive
        answer: 1
        explanation: Missing data that stops a hunt exposes a blind spot the program should remediate.
      - prompt: Why is "intrusions caught" the wrong primary metric for a hunt program?
        options:
          - Catches do not matter
          - Most hunts correctly find nothing, so a program judged only on catches looks like a failure while doing its job
          - It is too easy to measure
          - It ignores detections
        answer: 1
        explanation: Since most hunts rightly find nothing, outcomes like new detections and closed gaps better reflect value.
  - slug: hunt-defense-evasion
    title: Hunting Defense Evasion
    order: 11
    difficulty: intermediate
    summary: Hunt for the things attackers do to stay hidden, clearing logs, disabling security tools, timestomping and hiding in trusted locations, because the act of hiding is itself a detectable signal.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Describe common defense-evasion techniques attackers use to stay hidden
      - Hunt for the traces that evasion itself leaves behind
      - Treat gaps and tampering as signals rather than dead ends
    theory: |
      Skilled attackers spend real effort **not being seen**, and that effort is itself huntable. Defense
      evasion is the set of techniques used to avoid detection and hinder investigation: clearing or disabling
      logs, killing or blinding security tools, hiding files in trusted locations, masquerading as legitimate
      processes, and tampering with timestamps. The key insight for a hunter is counter-intuitive but powerful:
      the act of hiding usually leaves its own trace, so evasion techniques become detection opportunities
      rather than impenetrable cover.

      The techniques and their traces are specific. **Clearing logs** leaves a tell, the event that records the
      log being cleared, or a conspicuous gap where events should be. **Disabling security tools** (stopping
      the EDR or antivirus service, adding exclusions, tampering with the agent) generates its own events and a
      suspicious silence from a sensor that was reporting a moment ago. **Masquerading** puts a malicious file
      under a trusted name or in a system directory, detectable by mismatches, the right name in the wrong
      path, a signed-looking binary that is not actually signed, a system process with the wrong parent.
      **Timestomping** alters a file's timestamps to blend in, but often leaves inconsistencies between
      different timestamp fields that forensic analysis spots. Each technique maps to a MITRE ATT&CK
      defense-evasion behaviour with known artefacts to hunt.

      The decisive shift in mindset is to treat **absence and inconsistency as signals**. A naive monitor sees
      a host go quiet and assumes all is well; a hunter asks why a machine that always reports stopped, why a
      log has a gap, why a sensor was disabled. Missing data is not the end of a hunt but a lead pointing at
      what the attacker wanted to hide. The hunter correlates these evasion tells with other activity, a
      disabled EDR right before a burst of unexplained process activity is a strong story, and confirms against
      legitimate causes (an admin did update the agent) before escalating. Hunting defense evasion is where
      defenders turn the attacker's own caution against them, because the harder someone works to hide, the
      more traces of hiding they tend to leave.
    examples:
      - title: Hiding leaves a trace
        body: |
          cleared logs   -> the "log cleared" event, or a conspicuous gap
          disabled EDR   -> tamper event + sudden silence from a reporting sensor
          masquerading   -> right name, wrong path; wrong parent process
          timestomping   -> inconsistent timestamp fields
      - title: Absence as a signal
        body: |
          host that always reports goes quiet -> why?
          EDR disabled, THEN a burst of unexplained process activity
          correlate the evasion with what it was hiding; confirm vs an admin update.
    exercise:
      title: Hunt a data set for defense evasion
      environment: Sample endpoint, security-tool and event logs (provided or lab-generated) containing evasion attempts and benign activity
      tools: [A SIEM or notebook, sample logs including security-tool telemetry, a MITRE ATT&CK reference, a notes file]
      steps:
        - List common defense-evasion techniques and the trace each one tends to leave.
        - Hunt the logs for log-clearing or a conspicuous gap where events should be, and describe what you find.
        - Hunt for a security tool being disabled or tampered with, and the silence that follows.
        - Look for a masquerading file (right name, wrong path; wrong parent process) and explain the mismatch.
        - Correlate one evasion tell with the activity it was likely hiding to build a story.
        - Confirm against a legitimate cause (such as an admin update) before escalating, and map findings to ATT&CK.
      deliverable: A hunt write-up listing evasion techniques and their traces, the log-clearing, tool-disabling and masquerading findings, the correlation with hidden activity, and the legitimate-cause check with ATT&CK mapping.
    expected_outcome: >
      You can hunt for defense-evasion techniques by the traces that hiding leaves, treat missing data and
      inconsistencies as leads rather than dead ends, and correlate evasion with the activity it conceals
      before confirming and escalating.
    quiz:
      - prompt: Why is defense evasion itself huntable?
        options:
          - Attackers never hide
          - The act of hiding usually leaves its own trace, turning evasion into a detection opportunity
          - It is invisible
          - Only logs matter
        answer: 1
        explanation: Clearing logs, disabling tools and masquerading all leave characteristic artefacts to hunt.
      - prompt: A host that always reports suddenly going silent should be treated as
        options: [All clear, A lead, since the absence of expected data may be the attacker hiding, A backup, A network upgrade]
        answer: 1
        explanation: Unexpected silence can mean a disabled sensor, so absence is a signal, not reassurance.
      - prompt: Masquerading is often detectable by
        options:
          - The file's colour
          - Mismatches like the right name in the wrong path or a system process with the wrong parent
          - Its size only
          - The time of day
        answer: 1
        explanation: Masqueraded files betray themselves through path, signature or parent-process inconsistencies.
      - prompt: Before escalating an evasion finding, the hunter should
        options:
          - Nothing
          - Confirm against legitimate causes, such as an administrator updating the agent
          - Delete the logs
          - Disable the sensor
        answer: 1
        explanation: Legitimate activity can mimic evasion, so confirmation against normal causes precedes escalation.
  - slug: hunt-supply-chain
    title: Hunting Supply-Chain and Trusted-Relationship Threats
    order: 12
    difficulty: advanced
    summary: Hunt for compromise that arrives through trusted channels, a poisoned software update, a compromised vendor, a malicious dependency, where the malicious activity wears the clothes of something legitimate.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:4"]
    learning_objectives:
      - Explain how supply-chain and trusted-relationship compromises work
      - Hunt for malicious activity originating from trusted software or vendors
      - Focus on behaviour, since the source itself appears legitimate
    theory: |
      The hardest intrusions to catch are those that arrive through a **trusted channel**. In a supply-chain
      attack, the adversary compromises something the target already trusts, a software vendor's build pipeline
      (so a signed update carries a backdoor), a popular open-source dependency, a managed service provider with
      access into many customers, so the malicious code or access enters wearing legitimate clothes. Trusted-
      relationship attacks are similar: an attacker uses a third party's legitimate access (a vendor's VPN, an
      MSP's management tooling) to reach the target. These defeat defences built on "is this source trusted?",
      because the source genuinely is.

      Because the source looks legitimate, hunting must focus on **behaviour**, not origin. A signed, trusted
      application is normally benign, but a hunter asks what it does: does this software, after an update
      suddenly reach out to a new external domain, spawn a command interpreter, read credentials, or behave in a
      way it never did before? A trusted vendor connection is expected, but does it suddenly touch systems it
      never accessed, at odd hours, or move toward sensitive data? The key shift is to baseline the normal
      behaviour of trusted software and relationships and hunt for deviations, the update that changed what the
      application does, the vendor account that expanded its reach, because the compromise reveals itself in
      behaviour even when the identity and signature check out.

      This is genuinely difficult and is where hunting earns its keep, because automated prevention tends to
      wave trusted things through. The hunter leans on anomaly detection over trusted entities, threat
      intelligence about known supply-chain incidents (so you can check whether you run an affected version or
      vendor), and scrutiny of the trust relationships themselves, what access do our vendors and software
      actually have, and is it monitored and least-privilege. The mindset is to extend zero-trust thinking into
      hunting: trust is not a free pass from scrutiny, and even signed, vendor-supplied, long-standing things
      are hunted by what they do. As always, a deviation is a lead confirmed against baseline and corroborating
      activity before escalation, but supply-chain hunting is often the only way these high-impact, low-
      frequency compromises are found.
    examples:
      - title: Compromise through a trusted channel
        body: |
          vendor build pipeline compromised -> signed update carries a backdoor
          signature checks out, source is trusted -> prevention waves it through
          only behaviour gives it away.
      - title: Behaviour betrays a trusted source
        body: |
          trusted app, AFTER an update: reaches a new external domain + spawns a shell
          vendor account: suddenly touches systems it never accessed, at 3am
          baseline the trusted thing; hunt the deviation.
    exercise:
      title: Hunt for a supply-chain or trusted-relationship compromise
      environment: Sample endpoint, network and access logs (provided or lab-generated) involving trusted software or a vendor connection with some anomalous behaviour
      tools: [A SIEM or notebook, sample logs, threat-intel references on supply-chain incidents, a notes file]
      steps:
        - Explain how supply-chain and trusted-relationship compromises bypass defences built on trusting the source.
        - Baseline the normal behaviour of a trusted application or a vendor connection in the data.
        - Hunt for a deviation (a trusted app reaching new destinations or spawning a shell after an update; a vendor account expanding its reach) and describe what you find.
        - Explain why focusing on behaviour rather than origin is necessary here.
        - Use threat intelligence to check whether an affected version or vendor is present.
        - Scrutinise one trust relationship (what access a vendor or software actually has) and recommend tightening it, then state how you would confirm the finding before escalating.
      deliverable: A hunt write-up explaining the trusted-channel problem, the baseline and the behavioural deviation found, the threat-intel check, a trust-relationship tightening recommendation, and the confirmation step.
    expected_outcome: >
      You can hunt for supply-chain and trusted-relationship compromises by focusing on the behaviour of
      trusted software and vendors rather than their origin, baselining what is normal and hunting deviations,
      and scrutinising the trust relationships themselves.
    quiz:
      - prompt: Why are supply-chain compromises so hard to catch?
        options:
          - They are very loud
          - The malicious code or access arrives through a trusted, often signed, channel, defeating source-based trust
          - They never use real software
          - They only affect one machine
        answer: 1
        explanation: The source genuinely is trusted, so defences based on trusting it wave the attack through.
      - prompt: Hunting supply-chain threats must focus on
        options:
          - Whether the source is signed
          - Behaviour, since the source itself appears legitimate
          - The file size only
          - The vendor's logo
        answer: 1
        explanation: Because identity and signature check out, only anomalous behaviour reveals the compromise.
      - prompt: A trusted application that, after an update, suddenly reaches a new external domain and spawns a shell is
        options: [Always fine, A behavioural deviation worth hunting despite the trusted source, A normal backup, Proof of a patch]
        answer: 1
        explanation: New, out-of-character behaviour from trusted software is exactly the supply-chain signal to investigate.
      - prompt: Applying zero-trust thinking to hunting means
        options:
          - Trusting signed software completely
          - Treating trust as no free pass from scrutiny, hunting even vendor-supplied, signed things by what they do
          - Ignoring behaviour
          - Only hunting untrusted sources
        answer: 1
        explanation: Zero-trust hunting scrutinises trusted entities by behaviour rather than exempting them.
  - slug: hunt-attack-methodology
    title: ATT&CK-Driven Hunting Methodology
    order: 13
    difficulty: advanced
    summary: Learn a repeatable, framework-driven hunting method that picks a technique from MITRE ATT&CK, forms a hypothesis, gathers the data, analyses, and feeds results back into detections.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.4"]
    learning_objectives:
      - Use MITRE ATT&CK to select and scope a hunt
      - Follow a repeatable hunt loop from hypothesis to outcome
      - Convert hunt findings into durable detections
    theory: |
      Hunting can drift into aimless log-staring without a method, and the most durable method is **driven by
      MITRE ATT&CK**. Rather than hunting for a vague sense of badness, the hunter picks a specific **technique**
      that matters to the organisation (informed by threat intelligence about the actors targeting its sector)
      and asks a focused question: if an adversary used this technique here, what would it look like, and do we
      see it? Starting from a named technique scopes the hunt, points directly at the data sources needed, and
      makes the result measurable, because afterwards you can say the environment was examined for that specific
      behaviour.

      The hunt then follows a repeatable **loop**. Form a **hypothesis** grounded in the technique, for example
      that an attacker is using a scheduled task for persistence. Identify the **data** that would reveal it
      (process-creation logs, task-creation events, autoruns) and confirm you actually collect it, because a hunt
      is only as good as its telemetry. **Analyse**: pull the relevant data and apply techniques like stack
      counting (grouping and counting to make the rare stand out), timelining, and outlier analysis to separate
      normal from suspicious. **Investigate** promising leads to a conclusion, and document what was examined and
      found. Crucially, the loop does not end with a yes or no: every hunt either finds something, which becomes
      an incident, or finds nothing, which still teaches you about your visibility and your environment's normal.

      The output that makes hunting pay off over time is **feedback into detection**. When a hunt finds a
      malicious pattern, that pattern becomes a new SIEM rule so the SOC catches it automatically next time; the
      hunt should not have to be repeated by hand. When a hunt reveals a visibility gap (you could not test a
      technique because you do not collect the data), that becomes a logging requirement. This is what separates
      mature hunting from one-off curiosity: it steadily converts human investigation into automated coverage and
      better telemetry, measurably expanding what the organisation can detect. The ATT&CK technique list doubles
      as a backlog, letting a team work systematically through the techniques most relevant to its threat model.
    examples:
      - title: The hunt loop
        body: |
          pick technique (ATT&CK, threat-intel driven)
          -> hypothesis -> identify + confirm data -> analyse (stack count, timeline, outliers)
          -> investigate leads -> document
          -> FEEDBACK: finding -> new detection; gap -> logging requirement.
      - title: Stack counting
        body: |
          group scheduled-task creators by parent process, count occurrences
          thousands: normal admin tooling   |   one odd parent, once: investigate
          making the rare stand out against the common.
    exercise:
      title: Run an ATT&CK-driven hunt end to end
      environment: A described environment with available data sources and a chosen technique (or a scenario)
      tools: [A scenario or sample telemetry, the ATT&CK reference, a document, a notes file]
      steps:
        - Pick an ATT&CK technique relevant to a described threat model and justify the choice.
        - Write a concrete, testable hypothesis for that technique in this environment.
        - Identify the data sources needed and state whether they are collected.
        - Describe the analysis you would apply (stack counting, timelining, outliers) to separate normal from suspicious.
        - Decide an outcome for a sample lead (benign, inconclusive, or incident) with reasoning.
        - Convert the result into either a new detection rule or a logging requirement.
      deliverable: A documented hunt for one ATT&CK technique, covering hypothesis, data sources, analysis approach, a lead decision, and a concrete detection or logging follow-up.
    expected_outcome: >
      You can run a repeatable, ATT&CK-driven hunt from technique selection through hypothesis, data, analysis and
      outcome, and convert every hunt into a durable detection or a logging improvement.
    quiz:
      - prompt: Starting a hunt from a specific ATT&CK technique helps because it
        options:
          - Guarantees you find an attacker
          - Scopes the hunt, points at the data needed, and makes the result measurable
          - Replaces the need for data
          - Avoids forming any hypothesis
        answer: 1
        explanation: A named technique gives the hunt focus, a data target, and a measurable outcome.
      - prompt: A hunt that finds nothing is still valuable because it
        options:
          - Wasted no time
          - Teaches you about your visibility and your environment's normal, and can reveal logging gaps
          - Proves there are no attackers ever
          - Means logging can stop
        answer: 1
        explanation: Even an empty hunt informs visibility and baselines and can expose telemetry gaps.
      - prompt: Stack counting is an analysis technique that
        options:
          - Encrypts the logs
          - Groups and counts values so rare occurrences stand out against common ones
          - Deletes duplicate events
          - Blocks traffic
        answer: 1
        explanation: Stack counting surfaces outliers by making the infrequent visible against the frequent.
      - prompt: The feedback step that makes hunting pay off over time is
        options:
          - Forgetting the result
          - Turning a found pattern into a new detection, or a visibility gap into a logging requirement
          - Repeating the same manual hunt forever
          - Deleting the hypothesis
        answer: 1
        explanation: Converting findings into detections and logging requirements grows automated coverage.
  - slug: hunt-analytics-techniques
    title: Analytics-Driven Hunting Techniques
    order: 14
    difficulty: advanced
    summary: Learn the data-analysis techniques that make hunting scalable, covering frequency and stack analysis, outlier detection, long-tail analysis and clustering, applied to large volumes of telemetry.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.4"]
    learning_objectives:
      - Apply frequency and stack analysis to surface rare activity
      - Use long-tail and outlier analysis to find anomalies at scale
      - Choose the right analytic technique for a hunting question
    theory: |
      When telemetry is measured in millions of events, a hunter cannot read it all, so hunting becomes a
      **data-analysis** discipline that makes the suspicious stand out mathematically. The foundational technique
      is **frequency analysis**, often called **stack counting**: group events by a meaningful field and count how
      often each value appears. Grouping process executions by their hash, or scheduled-task creators by parent
      process, turns a flood into a ranked list where the overwhelmingly common entries are almost always
      legitimate and the handful of rare ones deserve a look. The insight is that malicious activity is usually
      **rare** against a backdrop of repetitive normal behaviour, so counting is a cheap, powerful way to make it
      visible.

      Several related techniques extend this. **Long-tail analysis** focuses deliberately on the least frequent
      values, the one-off DNS domain contacted once, the binary that ran on a single host, the user-agent seen
      exactly once, because attacker tooling and infrastructure are often unique and therefore live in the tail.
      **Outlier detection** looks for values that deviate from a numeric baseline, such as a host transferring far
      more data than its peers or a user logging in at an unusual hour. **Clustering and comparison** group similar
      entities so that one that behaves differently from its cluster (a server acting unlike other servers of its
      role) stands out. Each technique answers the same underlying question from a different angle: what here does
      not look like everything else?

      Using these well requires **judgement about normal and about data volume**. Rare is not the same as
      malicious: new software, a one-off admin action, or a rarely used but legitimate tool will all appear in the
      tail, so the output of these techniques is a shortlist to investigate, not a verdict. The analyst must also
      scope sensibly, counting over the right window and the right population, because a value that is rare across
      the whole fleet may be normal for one team. The payoff is scalability: these techniques let one hunter
      meaningfully examine enormous datasets and repeatedly find footholds that signature-based detection missed,
      and a pattern found this way should be converted into a detection so the work is not repeated. For the
      analyst, mastering frequency, long-tail and outlier analysis is what turns hunting from reading logs into
      interrogating data.
    examples:
      - title: Stack counting
        body: |
          group process executions by hash, count per hash
          millions collapse to a ranked list: common = almost always legit; rare = investigate
          malicious activity is usually RARE against repetitive normal.
      - title: Long-tail and outliers
        body: |
          long tail: the domain contacted ONCE, the binary on ONE host -> attacker infra lives here
          outlier: host sending far more data than its peers; logon at an odd hour
          clustering: the one server behaving unlike others of its role.
    exercise:
      title: Apply analytic techniques to a dataset
      environment: A described large dataset (process, DNS or proxy telemetry) or a sample extract
      tools: [A scenario or sample telemetry, a document, a notes file]
      steps:
        - Explain stack counting and the field you would group by for a given hunt question.
        - Apply frequency thinking to a sample and identify the rare values worth investigating.
        - Explain long-tail analysis and give an example value that would appear in the tail.
        - Describe an outlier-detection approach for a numeric signal (data volume, logon hour).
        - Explain why rare does not automatically mean malicious and how you would triage the shortlist.
        - Convert one confirmed finding into a detection so the analysis need not be repeated.
      deliverable: An analytics-driven hunt applying stack counting and long-tail or outlier analysis to a dataset, a triaged shortlist of rare values, and one detection derived from a finding.
    expected_outcome: >
      You can apply frequency, long-tail and outlier analysis to large telemetry to surface rare and anomalous
      activity, triage the results with judgement about normal, and convert findings into durable detections.
    quiz:
      - prompt: Stack counting surfaces suspicious activity by
        options:
          - Encrypting the data
          - Grouping and counting values so the rare ones stand out against common, repetitive normal
          - Deleting frequent events
          - Blocking traffic
        answer: 1
        explanation: Counting makes rare values visible against the large volume of legitimate, repetitive activity.
      - prompt: Long-tail analysis deliberately focuses on
        options:
          - The most common values
          - The least frequent values, where unique attacker tooling and infrastructure often live
          - Encrypted traffic only
          - The fastest events
        answer: 1
        explanation: Attacker artefacts are often unique, so they appear in the infrequent tail of the data.
      - prompt: A key caution when using these techniques is that
        options:
          - Rare always means malicious
          - Rare does not automatically mean malicious, so the output is a shortlist to investigate, not a verdict
          - Counting never helps
          - Outliers are always benign
        answer: 1
        explanation: Legitimate new or rarely used activity also appears rare, so results need triage.
      - prompt: The main advantage of analytics-driven hunting is that it
        options:
          - Needs no data
          - Scales, letting one hunter meaningfully examine enormous datasets and find what signatures missed
          - Replaces all detections
          - Only works on small logs
        answer: 1
        explanation: Mathematical techniques make huge datasets tractable and reveal footholds signatures miss.
