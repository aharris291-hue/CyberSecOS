slug: networking-foundations
title: Networking Foundations for SOC Analysts
domain: Networking
order: 1
description: >
  How data moves across a network and what normal versus malicious traffic
  looks like in a packet capture. Every later SOC skill builds on this.
lessons:
  - slug: net-osi-tcpip
    title: The OSI and TCP/IP Models and the TCP Handshake
    order: 1
    difficulty: beginner
    summary: Map traffic to network layers and read a TCP three-way handshake in Wireshark.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:4.9", "cysa:1.1"]
    learning_objectives:
      - Name the seven OSI layers and the four TCP/IP layers and map common protocols to them
      - Explain the TCP three-way handshake and the role of SYN, ACK, FIN and RST flags
      - Distinguish TCP from UDP and say when each is used
      - Filter a packet capture in Wireshark to isolate a single conversation
    theory: |
      Networks are described in layers so that each problem can be reasoned about on its own.
      The OSI model has seven layers: Physical, Data Link, Network, Transport, Session,
      Presentation and Application. The TCP/IP model used on real networks compresses these
      into four: Link, Internet (IP), Transport (TCP/UDP) and Application (HTTP, DNS, SMB...).

      As an analyst you mostly work at three layers. The **Network layer** gives you source and
      destination IP addresses, which tell you *who* is talking. The **Transport layer** gives you
      ports and flags, which tell you *which service* and *what state* the conversation is in. The
      **Application layer** tells you *what was said*.

      TCP is connection-oriented. Before any data flows, the client sends **SYN**, the server
      answers **SYN-ACK**, and the client confirms with **ACK**. A connection ends with **FIN**
      exchanges, or abruptly with **RST**. UDP has no handshake: it simply sends datagrams, which
      makes it fast (DNS, VoIP, streaming) but easy to spoof.

      Why this matters in a SOC: a burst of SYNs with no completed handshakes suggests a port scan
      or SYN flood; RSTs from many ports suggest closed ports being probed; a completed handshake
      to an unusual external IP is worth a closer look.
    examples:
      - title: A normal handshake in Wireshark
        body: |
          No.  Source         Destination    Protocol Info
          1    10.0.0.15      93.184.216.34  TCP      51544 → 443 [SYN] Seq=0
          2    93.184.216.34  10.0.0.15      TCP      443 → 51544 [SYN, ACK] Seq=0 Ack=1
          3    10.0.0.15      93.184.216.34  TCP      51544 → 443 [ACK] Seq=1 Ack=1
          The client picked an ephemeral source port (51544) and connected to HTTPS (443).
      - title: Useful Wireshark display filters
        body: |
          tcp.flags.syn == 1 && tcp.flags.ack == 0   # connection attempts only
          ip.addr == 10.0.0.15                       # everything to/from one host
          tcp.stream eq 4                            # one TCP conversation
          udp.port == 53                             # DNS traffic
    exercise:
      title: Capture and dissect your own handshake
      environment: Your own computer, or a Windows/Linux VM, with Wireshark installed
      tools: [Wireshark]
      steps:
        - Install Wireshark (wireshark.org) and start a capture on your active network interface.
        - In a browser, visit http://neverssl.com and then https://example.com, then stop the capture.
        - Apply the filter `tcp.flags.syn == 1 && tcp.flags.ack == 0` and note each server you connected to.
        - Right-click one SYN packet, choose Follow > TCP Stream, and identify the SYN, SYN-ACK and ACK packets.
        - For the neverssl.com stream, find the HTTP GET request and the server's response code.
        - Apply `udp.port == 53` and find the DNS query and answer that preceded each connection.
        - Fill in a table with columns Layer, Field, Value for one packet (MAC, IP, port, protocol).
      deliverable: A short note with your layer table, screenshots of the handshake, and the DNS answer for example.com.
    expected_outcome: >
      You can open any capture, isolate a single TCP conversation, point to the three handshake
      packets, and explain which layer each header field belongs to.
    quiz:
      - prompt: At which OSI layer do TCP and UDP operate?
        options: [Network, Transport, Session, Data Link]
        answer: 1
        explanation: TCP and UDP are Transport layer (layer 4) protocols; IP is the Network layer.
      - prompt: What is the correct order of the TCP three-way handshake?
        options: ["SYN, ACK, SYN-ACK", "SYN, SYN-ACK, ACK", "ACK, SYN, FIN", "SYN, FIN, ACK"]
        answer: 1
        explanation: The client sends SYN, the server replies SYN-ACK, the client completes with ACK.
      - prompt: Many SYN packets to different ports from one host, with no completed handshakes, most likely indicate
        options: [A file download, Normal web browsing, A port scan, A DNS lookup]
        answer: 2
        explanation: Half-open connections across many ports are the signature of a SYN (stealth) scan.
      - prompt: Which protocol is connectionless and commonly used by DNS queries?
        options: [TCP, UDP, ICMP, ARP]
        answer: 1
        explanation: DNS queries normally use UDP port 53; TCP is used for large responses and zone transfers.

  - slug: net-ports-protocols
    title: Ports, Services and DNS
    order: 2
    difficulty: beginner
    summary: Recognise common services by port, enumerate a host with Nmap and read DNS traffic.
    theory_minutes: 10
    lab_minutes: 50
    objectives: ["secplus:2.2", "secplus:4.3", "cysa:1.3"]
    learning_objectives:
      - Identify the well-known ports for the services a SOC sees daily
      - Explain how DNS resolution works and which record types matter in investigations
      - Run an Nmap service scan against a lab host and interpret the results
    theory: |
      A port identifies a service on a host. Ports 0-1023 are well-known: 22 SSH, 25 SMTP,
      53 DNS, 80 HTTP, 443 HTTPS, 445 SMB, 3389 RDP. Every open port is part of the **attack
      surface**; exposed SMB and RDP are among the most abused entry points on the internet.

      **DNS** turns names into addresses. A client asks its resolver, which walks root, TLD and
      authoritative servers and caches the answer for the record's TTL. Record types you will
      meet: A/AAAA (address), CNAME (alias), MX (mail), TXT (free text, also abused for data
      exfiltration), and PTR (reverse lookup).

      Attackers use DNS because it is almost always allowed out. Very long or random-looking
      subdomains, high volumes of TXT queries, and lookups of newly registered domains are
      classic indicators of tunnelling or malware command and control.

      **Nmap** is the standard tool for discovering hosts and services. A SOC analyst uses it to
      verify what is really exposed, for example when an alert names a port you do not expect.
      Only scan systems you own or are authorised to test.
    examples:
      - title: Nmap service and version scan
        body: |
          $ nmap -sV -p- 192.168.56.101
          PORT     STATE SERVICE VERSION
          22/tcp   open  ssh     OpenSSH 8.9p1 Ubuntu
          80/tcp   open  http    Apache httpd 2.4.52
          3306/tcp open  mysql   MySQL 8.0.36
          A database port open to the network is a finding to report.
      - title: Suspicious DNS pattern
        body: |
          query TXT  a9f3k2m1q8.data.badexample.net
          query TXT  b7d2n4p0x5.data.badexample.net
          query TXT  c1e8r6t3z9.data.badexample.net
          High-entropy subdomains with repeated TXT lookups suggest DNS tunnelling.
    exercise:
      title: Enumerate a lab host and trace its DNS
      environment: VirtualBox host-only network with an Ubuntu Server VM (target) and your machine or a Kali VM
      tools: [Nmap, dig, tcpdump]
      steps:
        - Create an Ubuntu Server VM on a host-only network and install openssh-server and apache2.
        - From your scanning machine run `nmap -sn 192.168.56.0/24` to discover live hosts.
        - Run `nmap -sV -p- <target>` and record every open port, service and version.
        - Stop apache2 on the target, rescan port 80, and note how the state changes.
        - On the target run `sudo tcpdump -n -i any port 53` while running `dig example.com A`, `dig example.com MX` and `dig -x 8.8.8.8`.
        - Identify the query, the answer and the TTL for each lookup in the tcpdump output.
      deliverable: A one-page exposure report listing open ports, services, versions and which ones should not be exposed.
    expected_outcome: >
      You can name a service from its port, produce and explain an Nmap service scan, and
      read DNS queries and answers directly from captured traffic.
    quiz:
      - prompt: Which port does RDP use by default?
        options: ["22", "445", "3389", "8080"]
        answer: 2
        explanation: Remote Desktop Protocol listens on TCP 3389.
      - prompt: Which DNS record type is most often abused to carry exfiltrated data?
        options: [A, MX, TXT, PTR]
        answer: 2
        explanation: TXT records hold arbitrary text, which makes them convenient for tunnelling data.
      - prompt: What does `nmap -sV` add to a scan?
        options: [OS detection, Service and version detection, UDP scanning, Script scanning only]
        answer: 1
        explanation: -sV probes open ports to identify the service and its version.
      - prompt: SMB, often targeted by worms and ransomware, uses which port?
        options: ["139 only", "445", "53", "1433"]
        answer: 1
        explanation: Modern SMB runs directly over TCP 445.

  - slug: net-traffic-analysis
    title: Finding Malicious Traffic in a Packet Capture
    order: 3
    difficulty: intermediate
    summary: Triage a real malware pcap and extract indicators of compromise.
    theory_minutes: 12
    lab_minutes: 60
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Use Wireshark statistics to find the busiest and most unusual conversations
      - Recognise beaconing, suspicious downloads and cleartext credentials
      - Extract indicators of compromise (IPs, domains, file hashes) from a capture
    theory: |
      Analysing a capture is a funnel: start wide, then narrow. **Statistics > Conversations**
      and **Statistics > Protocol Hierarchy** show who talked the most and over what. Unusual
      protocols, internal hosts talking directly to the internet over odd ports, or one host
      generating most of the traffic are good starting points.

      **Beaconing** is malware checking in with its command-and-control server at regular
      intervals. In a capture it appears as many small, similarly sized connections to the same
      destination spaced evenly in time. **Suspicious downloads** show as HTTP requests for
      executables or scripts, often with mismatched file extensions or from bare IP addresses.

      Your output is a list of **indicators of compromise (IOCs)**: malicious IPs, domains,
      URLs and file hashes. These feed blocking, SIEM searches and threat-intelligence sharing.
      Always record the timestamp and the infected internal host with each IOC.
    examples:
      - title: Beaconing visible in conversation timing
        body: |
          Time       Source       Destination     Length
          10:00:00   10.1.1.23    185.0.2.10:8080  312
          10:01:00   10.1.1.23    185.0.2.10:8080  311
          10:02:00   10.1.1.23    185.0.2.10:8080  312
          Same host, same destination, same size, exactly 60 seconds apart.
      - title: Exporting a downloaded file for hashing
        body: |
          File > Export Objects > HTTP > select invoice.exe > Save
          $ sha256sum invoice.exe
          The hash can be checked on VirusTotal without uploading the file.
    exercise:
      title: Triage a malware traffic exercise
      environment: An isolated analysis VM (no shared folders); never run extracted files
      tools: [Wireshark, sha256sum or Get-FileHash, VirusTotal (hash search only)]
      steps:
        - Download a beginner exercise pcap from malware-traffic-analysis.net into your analysis VM (archives use the password documented on the site).
        - Open Statistics > Protocol Hierarchy and Statistics > Conversations and note the top talkers.
        - Identify the infected internal host (IP, MAC and hostname from DHCP or NBNS traffic).
        - Filter `http.request` and list every requested URL; flag executables, scripts and requests to bare IPs.
        - Look for beaconing by sorting conversations to one destination by time.
        - Export any downloaded files with File > Export Objects > HTTP and hash them; search the hashes on VirusTotal.
        - Write a timeline of what happened, from first suspicious request to last C2 contact.
      deliverable: An IOC table (type, value, first seen, related host) and a five-line incident timeline.
    expected_outcome: >
      Given an unfamiliar capture you can identify the victim host, the malicious
      infrastructure and the payload, and hand off a usable IOC list.
    quiz:
      - prompt: Evenly spaced, similarly sized connections from one host to the same external IP most likely indicate
        options: [Software updates, Beaconing to a C2 server, A port scan, DNS caching]
        answer: 1
        explanation: Regular, uniform check-ins are the hallmark of command-and-control beaconing.
      - prompt: Which Wireshark feature lets you save a file transferred over HTTP?
        options: [Follow TCP Stream, Export Objects > HTTP, Expert Information, Decode As]
        answer: 1
        explanation: Export Objects reassembles transferred files so you can hash them.
      - prompt: Why search a file's hash on VirusTotal instead of uploading the file?
        options:
          - Hashes are faster to type
          - Uploading may share sensitive or targeted samples publicly and tip off the attacker
          - VirusTotal does not accept uploads
          - Hashes reveal the attacker's identity
        answer: 1
        explanation: Uploads become available to other users; a hash lookup reveals nothing new.
      - prompt: Which of these is an indicator of compromise?
        options: [A firewall vendor name, The SHA-256 of a malicious payload, The OSI model, A user's job title]
        answer: 1
        explanation: File hashes, malicious domains, IPs and URLs are classic IOCs.

  - slug: net-encrypted-traffic
    title: Reading Encrypted Traffic with TLS Metadata
    order: 4
    difficulty: intermediate
    summary: Spot malicious TLS sessions from SNI, certificates and JA3 without decrypting.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.9", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Explain which parts of a TLS session stay in cleartext and why they are useful
      - Use the Server Name Indication, certificate fields and JA3 fingerprints as indicators
      - Triage an encrypted conversation without decrypting the payload
    theory: |
      Most traffic is now encrypted with **TLS**, so you rarely see payloads. The useful part is
      that the handshake leaks a lot before encryption starts. The **Client Hello** carries the
      **Server Name Indication (SNI)**, the hostname the client asked for, in cleartext, and the
      **Server Hello** and certificate expose the subject, issuer and validity dates. These are
      often enough to decide whether a session deserves a closer look.

      A few patterns stand out. Connections to a bare IP with **no SNI**, or an SNI that does not
      match the certificate subject, are worth flagging. **Self-signed certificates**, certificates
      valid for only a few days, or subjects full of random characters often belong to malware or
      throwaway infrastructure. A long-lived connection to one destination with steady timing still
      looks like beaconing even when you cannot read the bytes.

      **JA3** and **JA3S** hash the ordered fields of the Client and Server Hello into a short
      fingerprint of the client and server software. The same malware family tends to produce the
      same JA3, so a known-bad fingerprint is an indicator even against a brand-new domain. None of
      this needs decryption; it all comes from metadata that TLS leaves in the open.
    examples:
      - title: SNI and certificate mismatch
        body: |
          Client Hello  SNI = cdn.example-good.com
          Certificate   subject CN = a83kfj.duckdns.org   issuer = self-signed
          The requested name and the presented certificate disagree, and the cert is self-signed.
      - title: Pulling JA3 in Wireshark
        body: |
          Filter    tls.handshake.type == 1
          The JA3 field appears under the TLS layer once JA3 is enabled in preferences.
          Record the hash and compare it against a threat-intel JA3 blocklist.
    exercise:
      title: Triage encrypted sessions from metadata
      environment: An isolated analysis VM with a sample TLS capture; only analyse traffic you are authorised to
      tools: [Wireshark, a JA3 reference list, a text editor]
      steps:
        - Open a capture containing HTTPS traffic in your analysis VM.
        - Filter `tls.handshake.type == 1` and list the SNI value for each Client Hello.
        - Filter `tls.handshake.type == 11` and record the certificate subject, issuer and validity period for each server.
        - Flag any session where the SNI is missing, is a bare IP, or disagrees with the certificate subject.
        - Note any self-signed certificate or one valid for only a handful of days.
        - Enable JA3 in Wireshark preferences and collect the JA3 hash for each suspicious client.
        - Write up the sessions you would escalate and the single metadata field that justified each one.
      deliverable: A short table of suspicious TLS sessions with the SNI, certificate subject, JA3 hash and the reason each was flagged.
    expected_outcome: >
      You can decide which encrypted sessions are worth investigating using only
      the handshake metadata, without ever decrypting the payload.
    quiz:
      - prompt: Which part of a TLS session reveals the requested hostname in cleartext?
        options: [The encrypted application data, The Server Name Indication in the Client Hello, The session ticket, The message authentication code]
        answer: 1
        explanation: The SNI is sent in the clear in the Client Hello so the server can present the right certificate.
      - prompt: A JA3 fingerprint is most useful because
        options:
          - It decrypts the TLS session
          - The same client software tends to produce the same hash, so a known-bad value is an indicator even for a new domain
          - It reveals the user's password
          - It replaces the need for certificates
        answer: 1
        explanation: JA3 hashes the client's handshake fields, so malware reusing a TLS stack keeps a recognisable fingerprint.
      - prompt: Which observation most warrants a closer look?
        options: [A certificate issued by a well-known authority, An SNI that matches the certificate subject, A self-signed certificate valid for three days on a connection to a bare IP, A long-lived session to a known update server]
        answer: 2
        explanation: Self-signed, short-lived certificates on connections to bare IPs are common to malware and throwaway infrastructure.
      - prompt: Can beaconing still be spotted in encrypted traffic?
        options: [No, encryption hides everything, Yes, the timing and size of connections are still visible, Only with the private key, Only over UDP]
        answer: 1
        explanation: Connection timing and sizes are metadata TLS does not hide, so regular check-ins still stand out.

  - slug: net-dns-abuse
    title: Detecting DNS Abuse, Tunnelling and DGA
    order: 5
    difficulty: intermediate
    summary: Spot command-and-control, tunnelling and domain-generation activity hiding in DNS.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Explain why attackers abuse DNS and which DNS behaviours are suspicious
      - Recognise tunnelling, domain-generation algorithms and fast flux in query logs
      - Hunt DNS logs for the metrics that expose abuse
    theory: |
      DNS is needed everywhere and is usually allowed outbound, so attackers lean on it heavily.
      **DNS tunnelling** hides data or command-and-control inside queries and responses; in the
      logs it shows as long, high-entropy subdomains, a burst of TXT or NULL record queries, and
      heavy query volume to a single domain. The payload rides in the part of the name the client
      controls, so the giveaway is the shape of the traffic, not its content.

      Two more patterns are worth knowing. A **domain generation algorithm (DGA)** has malware try
      many random-looking domains until one resolves, so you see a spike of **NXDOMAIN** (does not
      exist) responses from one host as it works through dead names. **Fast flux** rotates many IP
      addresses behind one name with very low TTLs to resist takedown. And **encrypted DNS** (DoH
      or DoT) can bypass your monitoring entirely, so a client quietly bypassing the internal
      resolver is itself a flag.

      None of this needs the query contents. You hunt it with a handful of metrics: query length
      and entropy, the NXDOMAIN rate per host, query volume per domain, unusual record types, and
      abnormally low TTLs. A host that scores high on several at once is the one to investigate,
      and the output is a list of suspect domains and the internal host behind them.
    examples:
      - title: A tunnelling query by its shape
        body: |
          Query   a8f3k2j9x1q7.d4t4.exfil-example.net  type=TXT
          A long, high-entropy label and a TXT lookup to one domain is a tunnelling signature.
      - title: A DGA host by its NXDOMAIN rate
        body: |
          host=10.1.1.23  NXDOMAIN responses in 2 min = 180
          A single host generating a flood of failed lookups is working through generated domains.
    exercise:
      title: Hunt DNS abuse in query logs
      environment: A SIEM or notebook with a sample DNS query log
      tools: [A sample DNS log, a SIEM or notebook, a notes file]
      steps:
        - Load a sample DNS query log and list the top domains by query volume.
        - Flag domains whose subdomains are long or look high-entropy rather than human-readable.
        - Count NXDOMAIN responses per host and pick out any host with an unusually high rate.
        - List the record types in use and flag a spike in TXT or NULL queries to one domain.
        - Check for a client resolving names without going through the internal resolver.
        - Combine the signals and name the hosts and domains you would escalate.
        - Write an indicator list of the suspect domains and the internal hosts behind them.
      deliverable: A short hunt note listing suspect domains, the internal hosts involved and the DNS metric that flagged each.
    expected_outcome: >
      You can tell abusive DNS from normal lookups using query shape, NXDOMAIN rate,
      record type and TTL, and hand off the suspect domains and hosts.
    quiz:
      - prompt: A host suddenly producing a flood of NXDOMAIN responses most likely indicates
        options: [A faster connection, Malware working through algorithm-generated domains, A DNS cache hit, A normal software update]
        answer: 1
        explanation: A DGA tries many generated domains until one resolves, so failed lookups spike from the infected host.
      - prompt: Long, high-entropy subdomains with heavy TXT queries to one domain suggest
        options:
          - A content delivery network
          - DNS tunnelling of data or command-and-control
          - A healthy resolver
          - A time-synchronisation service
        answer: 1
        explanation: Tunnelling encodes data in the query name and often uses TXT records, giving long high-entropy labels to one domain.
      - prompt: Why can encrypted DNS (DoH or DoT) be a monitoring problem?
        options:
          - It speeds up name resolution
          - A client can bypass the internal resolver and hide its lookups from you
          - It deletes DNS logs
          - It blocks all DNS
        answer: 1
        explanation: Encrypted DNS to an external resolver takes the queries out of your visibility, so bypassing the internal resolver is itself suspicious.
      - prompt: DNS abuse is best hunted by
        options: [Reading every query by hand, Metrics like query length, NXDOMAIN rate and record type, Blocking all DNS, Ignoring DNS entirely]
        answer: 1
        explanation: Abuse shows in the shape and volume of traffic, so metrics such as entropy, NXDOMAIN rate and record type surface it.

  - slug: net-flow-lateral-movement
    title: Flow Analysis and Detecting Scanning and Lateral Movement
    order: 6
    difficulty: intermediate
    summary: Use connection flow records to spot scanning and east-west movement without full packet capture.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Explain what a flow record is and how it differs from full packet capture
      - Recognise horizontal and vertical scanning in flow data
      - Spot east-west lateral movement that north-south monitoring misses
    theory: |
      Full packet capture is rich but expensive to keep, so most networks are watched with **flow
      records** instead. A flow is a summary of one conversation, source and destination address
      and port, protocol, byte and packet counts, and start and end time, without the payload. You
      lose the content but gain a cheap, long record of **who talked to whom**, which is exactly
      what you need to see movement across a network.

      Scanning has a recognisable shape in flow data. A **vertical scan** is one source hitting many
      ports on one host; a **horizontal scan** is one source hitting the same port across many
      hosts. Both show up as a fan of short, small, often half-open flows from a single source in a
      brief window. A host that suddenly opens connections to dozens of peers it never spoke to
      before is behaving like a scanner even if each flow looks ordinary on its own.

      The highest-value use of flow data is **east-west** visibility. Perimeter tools watch
      north-south traffic crossing the network edge, but an attacker who is already inside moves
      sideways, server to server, workstation to server, on internal protocols like SMB and RDP.
      That lateral movement never crosses the perimeter, so only internal flow records reveal it:
      an administrative workstation reaching many servers on port 445, or a server opening RDP to
      peers it normally only answers. Baselining each host's normal set of peers turns these into
      alerts. This is a different altitude from reading a single packet capture; here you are
      watching the whole network's connection graph for movement, not dissecting one session.
    examples:
      - title: A horizontal scan in flow records
        body: |
          src 10.0.0.50 -> 10.0.0.0/24 port 445  200 flows  avg 2 packets each  5 seconds
          One source touching port 445 across a whole subnet in seconds is a scan, not normal use.
      - title: Lateral movement east-west
        body: |
          workstation 10.0.5.12 -> 10.0.9.21, .22, .23 ... port 3389 (RDP)
          A workstation opening RDP to many servers it never contacted before is lateral movement.
    exercise:
      title: Hunt scanning and lateral movement in sample flow data
      environment: A sample set of network flow records (NetFlow or Zeek conn logs) in a file
      tools: [A sample flow or conn log, command-line tools or a spreadsheet]
      steps:
        - Describe how a flow record differs from a full packet capture and what each is good for.
        - Count distinct destination ports per source to find any vertical scan, and name the source.
        - Count distinct destination hosts per source and port to find any horizontal scan.
        - Identify an internal host whose set of peers is far larger than the others and explain why it stands out.
        - Decide which of the findings is east-west lateral movement and which is north-south, and say why it matters.
        - Write the one host you would isolate first and the flow evidence behind that call.
      deliverable: A short flow-analysis note listing the scan or scans found, the lateral-movement host, and the evidence for each.
    expected_outcome: >
      You can read flow records, recognise horizontal and vertical scanning, and spot east-west
      lateral movement that perimeter monitoring would miss.
    quiz:
      - prompt: A flow record differs from full packet capture in that it
        options:
          - Contains the full payload of every packet
          - Summarises a conversation (addresses, ports, counts, time) without the payload
          - Only works for encrypted traffic
          - Is larger than a packet capture
        answer: 1
        explanation: A flow is a metadata summary of a conversation, cheap to keep, with no payload.
      - prompt: One source connecting to the same port across many hosts in a short window is
        options: [A vertical scan, A horizontal scan, A normal backup, A DNS lookup]
        answer: 1
        explanation: Same port, many hosts is a horizontal scan; many ports on one host is vertical.
      - prompt: Why is internal (east-west) flow visibility important?
        options:
          - It is cheaper than any other monitoring
          - Lateral movement between internal hosts never crosses the perimeter, so only internal flows reveal it
          - It replaces endpoint logging
          - It decrypts TLS
        answer: 1
        explanation: An attacker already inside moves server to server, traffic the perimeter never sees.
      - prompt: Flow analysis differs from reading a single packet capture in that it
        options: [Is the same thing, Watches the whole network's connection graph rather than dissecting one session, Only reads payloads, Needs no baseline]
        answer: 1
        explanation: Flow analysis is about who-talks-to-whom across the network, a different altitude from one session.
  - slug: net-wireless-access-security
    title: Wireless and Network Access Security
    order: 7
    difficulty: intermediate
    summary: Secure the edge where devices join the network, covering Wi-Fi encryption, rogue access points and port-based access control, and spot the attacks that target it.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.2", "secplus:4.3", "cysa:1.1"]
    learning_objectives:
      - Explain how modern Wi-Fi is secured and where it is still attacked
      - Describe port-based network access control and why it matters for wired ports too
      - Detect rogue access points and unauthorised devices joining the network
    theory: |
      The edge where a device joins the network is a favourite target, because an attacker who
      gets on the LAN skips the perimeter entirely. On wireless, **WPA2** and **WPA3** encrypt the
      link; WPA3 adds forward secrecy and resistance to offline password cracking. Enterprise Wi-Fi
      avoids a shared passphrase altogether and authenticates each user or device with **802.1X**
      against a RADIUS server, so access can be tied to identity and revoked individually.

      The classic wireless attacks exploit trust in the network name. A **rogue access point** is an
      unauthorised AP plugged into the corporate network; an **evil twin** is an attacker AP
      broadcasting a familiar SSID so victims connect to it and expose traffic or credentials.
      **Deauthentication** frames can knock clients off a legitimate AP to push them onto the evil
      twin. Defences are network hygiene: a wireless IDS that flags unknown BSSIDs, client
      configuration that does not auto-join open networks, and certificate-based 802.1X so a client
      only trusts the real RADIUS server.

      The same access-control idea applies to wired ports. **802.1X** on a switch port, or MAC-based
      NAC, stops someone walking in and plugging a laptop into a conference-room jack. A SOC watches
      for the signs of edge abuse: a new device MAC on a port that should be a phone, an AP
      appearing with a cloned SSID, or a burst of deauth frames. As always, a hit is a lead; a new
      device may be a legitimate replacement, so it is confirmed against asset records before action.
    examples:
      - title: Evil twin versus the real AP
        body: |
          Real AP    SSID "CorpWifi"  BSSID aa:bb:cc:...  802.1X + cert
          Evil twin  SSID "CorpWifi"  BSSID 66:77:88:...  open or captive portal
          A client pinned to the RADIUS cert will not hand credentials to the twin.
      - title: A rogue device on a wired port
        body: |
          Port Gi1/0/14 expected: VoIP phone MAC 00:1a:...  (in asset inventory)
          Observed: a second, unknown MAC behind it -> possible rogue switch/laptop
          Confirm against inventory before disabling the port.
    exercise:
      title: Assess and monitor network access security in a lab
      environment: A home or lab network with a configurable access point and switch (or a simulator), plus a packet capture tool
      tools: [A Wi-Fi AP or simulator, a managed switch or NAC feature if available, Wireshark, a notes file]
      steps:
        - Document your test network's wireless security (WPA2 vs WPA3, whether it uses a shared key or 802.1X) and note one weakness in the current setup.
        - Capture wireless management traffic (or review a provided capture) and identify beacon frames and any deauthentication frames.
        - Describe how an evil twin would appear in your capture and what client setting would stop a device trusting it.
        - On a switch or NAC simulator, enable or describe port-based access control and test what happens when an unknown device connects.
        - Build a short list of the devices authorised on your network (by MAC or certificate) and define how you would detect a new, unlisted one.
        - Write a detection idea for a rogue AP broadcasting your SSID and state how you would confirm it before acting.
      deliverable: A short assessment of the network's edge security with one captured or described attack indicator, a port-access-control test result, and a rogue-device detection and confirmation plan.
    expected_outcome: >
      You can explain how Wi-Fi and wired access control are secured, recognise rogue-AP, evil-twin
      and deauthentication attacks in traffic, and detect an unauthorised device joining the network
      before confirming and acting.
    quiz:
      - prompt: What does WPA3 add over WPA2 for wireless security?
        options:
          - Nothing, they are identical
          - Forward secrecy and resistance to offline password cracking
          - It removes the need for a password
          - It disables logging
        answer: 1
        explanation: WPA3 strengthens the handshake, adding forward secrecy and making captured traffic far harder to crack offline.
      - prompt: An evil twin attack works by
        options:
          - Encrypting all traffic
          - Broadcasting a familiar SSID so victims connect to the attacker's access point
          - Disabling the switch
          - Patching the client
        answer: 1
        explanation: The evil twin imitates a trusted network name so clients connect and expose traffic or credentials.
      - prompt: 802.1X on a wired switch port primarily prevents
        options:
          - Slow network speeds
          - An unauthorised device from gaining access just by plugging into a jack
          - Wi-Fi interference
          - Log tampering
        answer: 1
        explanation: Port-based access control authenticates the device or user before the port carries traffic, stopping walk-up access.
      - prompt: A new, unknown MAC address behind a port expected to hold a phone should be
        options: [Ignored, Treated as a lead and confirmed against asset inventory before action, Immediately trusted, Deleted from logs]
        answer: 1
        explanation: It may be a rogue device or a legitimate replacement, so it is confirmed against inventory before any action.
  - slug: net-vpn-remote-access
    title: VPN and Remote Access Security
    order: 8
    difficulty: intermediate
    summary: Understand how VPNs protect remote connections, where split tunnelling and weak configuration create risk, and how to spot abused remote access.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.2", "secplus:4.3", "cysa:1.1"]
    learning_objectives:
      - Explain how IPsec and TLS VPNs protect traffic and authenticate endpoints
      - Describe the risk of split tunnelling, weak ciphers and over-broad access
      - Detect abused or anomalous remote-access sessions in logs
    theory: |
      Remote access extends the trusted network to wherever a user is, which is useful and dangerous
      in equal measure. A **VPN** builds an encrypted tunnel between a client and the network so traffic
      cannot be read or altered on the path. **IPsec** VPNs operate at the network layer and are common
      for site-to-site links; **TLS** VPNs (and SSL portals) operate higher up and suit remote users on
      untrusted networks. Both must authenticate the endpoint, ideally with certificates or MFA rather
      than a shared secret, because a VPN that anyone can log into is a doorway, not a defence.

      Configuration decides whether a VPN helps or hurts. **Split tunnelling** sends only corporate
      traffic down the tunnel and lets the rest go direct, which is efficient but means a compromised
      home device bridges the internet and the corporate network at once; **full tunnelling** is safer
      for high-risk users. Weak or legacy ciphers, no MFA, and over-broad access, a VPN that drops users
      straight onto a flat internal network rather than a segmented one, turn a single stolen credential
      into deep access. The modern direction is **zero-trust network access**, which grants access per
      application after checking identity and device, instead of trusting anyone on the tunnel.

      For a SOC, remote access is a rich signal. A VPN login from a new country, at an odd hour, or
      concurrent logins from two places for one account are the same account-takeover tells as any other
      remote authentication. A hit is a lead, confirmed against the user's travel and device before
      action, but unusual remote access is often the first visible step of an intrusion.
    examples:
      - title: Split versus full tunnelling
        body: |
          Split:  corp traffic -> tunnel; everything else -> direct (home device bridges both)
          Full:   all traffic  -> tunnel and corporate controls (safer for risky users)
          Choose by how much you trust the endpoint.
      - title: A suspicious VPN session
        body: |
          08:00 VPN login user from UK (usual)
          08:05 VPN login same user from another continent -> concurrent, impossible
          Confirm against travel/device, then treat as possible credential theft.
    exercise:
      title: Review a remote-access setup and its logs
      environment: A VPN client/server lab, a cloud VPN, or provided VPN configuration and sample logs
      tools: [A VPN setup or its configuration, sample VPN/auth logs, a notes file]
      steps:
        - Identify whether the VPN uses IPsec or TLS and how it authenticates users, and note whether MFA is enforced.
        - Determine whether it uses split or full tunnelling and explain the risk of the current choice for a high-risk user.
        - Check the cipher suite or protocol version and flag anything weak or legacy.
        - Describe how far a user lands on the internal network after connecting and whether that access is segmented or flat.
        - Review sample VPN login logs and identify one session that looks anomalous (new location, odd hour, concurrent logins).
        - State how you would confirm that session before acting and one improvement (MFA, full tunnelling, per-app access) you would make.
      deliverable: A short assessment of the VPN's authentication, tunnelling and access scope, one anomalous session from the logs with a confirmation plan, and one concrete hardening recommendation.
    expected_outcome: >
      You can explain how VPNs protect remote connections, judge the risk in a split-tunnel or
      over-broad configuration, and detect an abused remote-access session before confirming and acting.
    quiz:
      - prompt: The main security purpose of a VPN is to
        options:
          - Speed up the connection
          - Encrypt and authenticate traffic between a client and the network over an untrusted path
          - Replace the firewall
          - Store logs
        answer: 1
        explanation: A VPN builds an authenticated, encrypted tunnel so traffic cannot be read or altered in transit.
      - prompt: Why can split tunnelling increase risk?
        options:
          - It encrypts too much
          - A compromised endpoint bridges the internet and the corporate network at the same time
          - It disables the VPN
          - It blocks all traffic
        answer: 1
        explanation: With split tunnelling the device is on both networks at once, so a compromise can pivot inward.
      - prompt: A VPN should ideally authenticate users with
        options: [A single shared password, Certificates or MFA rather than a shared secret, No authentication, Only a username]
        answer: 1
        explanation: Strong per-user authentication stops a single leaked secret from opening the tunnel to anyone.
      - prompt: Concurrent VPN logins for one account from two distant locations are
        options: [Always fine, A lead to confirm against travel and device as possible account takeover, Proof of a firewall fault, A reason to disable logging]
        answer: 1
        explanation: Impossible concurrent sessions are a classic takeover tell, confirmed against context before action.
