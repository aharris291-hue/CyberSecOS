slug: networking-foundations
title: Networking Foundations for SOC Analysts
domain: Networking
order: 1
description: >
  How data moves across a network and what normal versus malicious traffic
  looks like in a packet capture. Every later SOC skill builds on this.
lessons:
  - slug: net-osi-tcpip
    title: The OSI and TCP/IP Models and the TCP Handshake
    order: 1
    difficulty: beginner
    summary: Map traffic to network layers and read a TCP three-way handshake in Wireshark.
    theory_minutes: 12
    lab_minutes: 48
    objectives: ["secplus:4.9", "cysa:1.1"]
    learning_objectives:
      - Name the seven OSI layers and the four TCP/IP layers and map common protocols to them
      - Explain the TCP three-way handshake and the role of SYN, ACK, FIN and RST flags
      - Distinguish TCP from UDP and say when each is used
      - Filter a packet capture in Wireshark to isolate a single conversation
    theory: |
      Networks are described in layers so that each problem can be reasoned about on its own.
      The OSI model has seven layers: Physical, Data Link, Network, Transport, Session,
      Presentation and Application. The TCP/IP model used on real networks compresses these
      into four: Link, Internet (IP), Transport (TCP/UDP) and Application (HTTP, DNS, SMB...).

      As an analyst you mostly work at three layers. The **Network layer** gives you source and
      destination IP addresses, which tell you *who* is talking. The **Transport layer** gives you
      ports and flags, which tell you *which service* and *what state* the conversation is in. The
      **Application layer** tells you *what was said*.

      TCP is connection-oriented. Before any data flows, the client sends **SYN**, the server
      answers **SYN-ACK**, and the client confirms with **ACK**. A connection ends with **FIN**
      exchanges, or abruptly with **RST**. UDP has no handshake: it simply sends datagrams, which
      makes it fast (DNS, VoIP, streaming) but easy to spoof.

      Why this matters in a SOC: a burst of SYNs with no completed handshakes suggests a port scan
      or SYN flood; RSTs from many ports suggest closed ports being probed; a completed handshake
      to an unusual external IP is worth a closer look.
    examples:
      - title: A normal handshake in Wireshark
        body: |
          No.  Source         Destination    Protocol Info
          1    10.0.0.15      93.184.216.34  TCP      51544 → 443 [SYN] Seq=0
          2    93.184.216.34  10.0.0.15      TCP      443 → 51544 [SYN, ACK] Seq=0 Ack=1
          3    10.0.0.15      93.184.216.34  TCP      51544 → 443 [ACK] Seq=1 Ack=1
          The client picked an ephemeral source port (51544) and connected to HTTPS (443).
      - title: Useful Wireshark display filters
        body: |
          tcp.flags.syn == 1 && tcp.flags.ack == 0   # connection attempts only
          ip.addr == 10.0.0.15                       # everything to/from one host
          tcp.stream eq 4                            # one TCP conversation
          udp.port == 53                             # DNS traffic
    exercise:
      title: Capture and dissect your own handshake
      environment: Your own computer, or a Windows/Linux VM, with Wireshark installed
      tools: [Wireshark]
      steps:
        - Install Wireshark (wireshark.org) and start a capture on your active network interface.
        - In a browser, visit http://neverssl.com and then https://example.com, then stop the capture.
        - Apply the filter `tcp.flags.syn == 1 && tcp.flags.ack == 0` and note each server you connected to.
        - Right-click one SYN packet, choose Follow > TCP Stream, and identify the SYN, SYN-ACK and ACK packets.
        - For the neverssl.com stream, find the HTTP GET request and the server's response code.
        - Apply `udp.port == 53` and find the DNS query and answer that preceded each connection.
        - Fill in a table with columns Layer, Field, Value for one packet (MAC, IP, port, protocol).
      deliverable: A short note with your layer table, screenshots of the handshake, and the DNS answer for example.com.
    expected_outcome: >
      You can open any capture, isolate a single TCP conversation, point to the three handshake
      packets, and explain which layer each header field belongs to.
    quiz:
      - prompt: At which OSI layer do TCP and UDP operate?
        options: [Network, Transport, Session, Data Link]
        answer: 1
        explanation: TCP and UDP are Transport layer (layer 4) protocols; IP is the Network layer.
      - prompt: What is the correct order of the TCP three-way handshake?
        options: ["SYN, ACK, SYN-ACK", "SYN, SYN-ACK, ACK", "ACK, SYN, FIN", "SYN, FIN, ACK"]
        answer: 1
        explanation: The client sends SYN, the server replies SYN-ACK, the client completes with ACK.
      - prompt: Many SYN packets to different ports from one host, with no completed handshakes, most likely indicate
        options: [A file download, Normal web browsing, A port scan, A DNS lookup]
        answer: 2
        explanation: Half-open connections across many ports are the signature of a SYN (stealth) scan.
      - prompt: Which protocol is connectionless and commonly used by DNS queries?
        options: [TCP, UDP, ICMP, ARP]
        answer: 1
        explanation: DNS queries normally use UDP port 53; TCP is used for large responses and zone transfers.

  - slug: net-ports-protocols
    title: Ports, Services and DNS
    order: 2
    difficulty: beginner
    summary: Recognise common services by port, enumerate a host with Nmap and read DNS traffic.
    theory_minutes: 10
    lab_minutes: 50
    objectives: ["secplus:2.2", "secplus:4.3", "cysa:1.3"]
    learning_objectives:
      - Identify the well-known ports for the services a SOC sees daily
      - Explain how DNS resolution works and which record types matter in investigations
      - Run an Nmap service scan against a lab host and interpret the results
    theory: |
      A port identifies a service on a host. Ports 0-1023 are well-known: 22 SSH, 25 SMTP,
      53 DNS, 80 HTTP, 443 HTTPS, 445 SMB, 3389 RDP. Every open port is part of the **attack
      surface**; exposed SMB and RDP are among the most abused entry points on the internet.

      **DNS** turns names into addresses. A client asks its resolver, which walks root, TLD and
      authoritative servers and caches the answer for the record's TTL. Record types you will
      meet: A/AAAA (address), CNAME (alias), MX (mail), TXT (free text, also abused for data
      exfiltration), and PTR (reverse lookup).

      Attackers use DNS because it is almost always allowed out. Very long or random-looking
      subdomains, high volumes of TXT queries, and lookups of newly registered domains are
      classic indicators of tunnelling or malware command and control.

      **Nmap** is the standard tool for discovering hosts and services. A SOC analyst uses it to
      verify what is really exposed, for example when an alert names a port you do not expect.
      Only scan systems you own or are authorised to test.
    examples:
      - title: Nmap service and version scan
        body: |
          $ nmap -sV -p- 192.168.56.101
          PORT     STATE SERVICE VERSION
          22/tcp   open  ssh     OpenSSH 8.9p1 Ubuntu
          80/tcp   open  http    Apache httpd 2.4.52
          3306/tcp open  mysql   MySQL 8.0.36
          A database port open to the network is a finding to report.
      - title: Suspicious DNS pattern
        body: |
          query TXT  a9f3k2m1q8.data.badexample.net
          query TXT  b7d2n4p0x5.data.badexample.net
          query TXT  c1e8r6t3z9.data.badexample.net
          High-entropy subdomains with repeated TXT lookups suggest DNS tunnelling.
    exercise:
      title: Enumerate a lab host and trace its DNS
      environment: VirtualBox host-only network with an Ubuntu Server VM (target) and your machine or a Kali VM
      tools: [Nmap, dig, tcpdump]
      steps:
        - Create an Ubuntu Server VM on a host-only network and install openssh-server and apache2.
        - From your scanning machine run `nmap -sn 192.168.56.0/24` to discover live hosts.
        - Run `nmap -sV -p- <target>` and record every open port, service and version.
        - Stop apache2 on the target, rescan port 80, and note how the state changes.
        - On the target run `sudo tcpdump -n -i any port 53` while running `dig example.com A`, `dig example.com MX` and `dig -x 8.8.8.8`.
        - Identify the query, the answer and the TTL for each lookup in the tcpdump output.
      deliverable: A one-page exposure report listing open ports, services, versions and which ones should not be exposed.
    expected_outcome: >
      You can name a service from its port, produce and explain an Nmap service scan, and
      read DNS queries and answers directly from captured traffic.
    quiz:
      - prompt: Which port does RDP use by default?
        options: ["22", "445", "3389", "8080"]
        answer: 2
        explanation: Remote Desktop Protocol listens on TCP 3389.
      - prompt: Which DNS record type is most often abused to carry exfiltrated data?
        options: [A, MX, TXT, PTR]
        answer: 2
        explanation: TXT records hold arbitrary text, which makes them convenient for tunnelling data.
      - prompt: What does `nmap -sV` add to a scan?
        options: [OS detection, Service and version detection, UDP scanning, Script scanning only]
        answer: 1
        explanation: -sV probes open ports to identify the service and its version.
      - prompt: SMB, often targeted by worms and ransomware, uses which port?
        options: ["139 only", "445", "53", "1433"]
        answer: 1
        explanation: Modern SMB runs directly over TCP 445.

  - slug: net-traffic-analysis
    title: Finding Malicious Traffic in a Packet Capture
    order: 3
    difficulty: intermediate
    summary: Triage a real malware pcap and extract indicators of compromise.
    theory_minutes: 12
    lab_minutes: 60
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Use Wireshark statistics to find the busiest and most unusual conversations
      - Recognise beaconing, suspicious downloads and cleartext credentials
      - Extract indicators of compromise (IPs, domains, file hashes) from a capture
    theory: |
      Analysing a capture is a funnel: start wide, then narrow. **Statistics > Conversations**
      and **Statistics > Protocol Hierarchy** show who talked the most and over what. Unusual
      protocols, internal hosts talking directly to the internet over odd ports, or one host
      generating most of the traffic are good starting points.

      **Beaconing** is malware checking in with its command-and-control server at regular
      intervals. In a capture it appears as many small, similarly sized connections to the same
      destination spaced evenly in time. **Suspicious downloads** show as HTTP requests for
      executables or scripts, often with mismatched file extensions or from bare IP addresses.

      Your output is a list of **indicators of compromise (IOCs)**: malicious IPs, domains,
      URLs and file hashes. These feed blocking, SIEM searches and threat-intelligence sharing.
      Always record the timestamp and the infected internal host with each IOC.
    examples:
      - title: Beaconing visible in conversation timing
        body: |
          Time       Source       Destination     Length
          10:00:00   10.1.1.23    185.0.2.10:8080  312
          10:01:00   10.1.1.23    185.0.2.10:8080  311
          10:02:00   10.1.1.23    185.0.2.10:8080  312
          Same host, same destination, same size, exactly 60 seconds apart.
      - title: Exporting a downloaded file for hashing
        body: |
          File > Export Objects > HTTP > select invoice.exe > Save
          $ sha256sum invoice.exe
          The hash can be checked on VirusTotal without uploading the file.
    exercise:
      title: Triage a malware traffic exercise
      environment: An isolated analysis VM (no shared folders); never run extracted files
      tools: [Wireshark, sha256sum or Get-FileHash, VirusTotal (hash search only)]
      steps:
        - Download a beginner exercise pcap from malware-traffic-analysis.net into your analysis VM (archives use the password documented on the site).
        - Open Statistics > Protocol Hierarchy and Statistics > Conversations and note the top talkers.
        - Identify the infected internal host (IP, MAC and hostname from DHCP or NBNS traffic).
        - Filter `http.request` and list every requested URL; flag executables, scripts and requests to bare IPs.
        - Look for beaconing by sorting conversations to one destination by time.
        - Export any downloaded files with File > Export Objects > HTTP and hash them; search the hashes on VirusTotal.
        - Write a timeline of what happened, from first suspicious request to last C2 contact.
      deliverable: An IOC table (type, value, first seen, related host) and a five-line incident timeline.
    expected_outcome: >
      Given an unfamiliar capture you can identify the victim host, the malicious
      infrastructure and the payload, and hand off a usable IOC list.
    quiz:
      - prompt: Evenly spaced, similarly sized connections from one host to the same external IP most likely indicate
        options: [Software updates, Beaconing to a C2 server, A port scan, DNS caching]
        answer: 1
        explanation: Regular, uniform check-ins are the hallmark of command-and-control beaconing.
      - prompt: Which Wireshark feature lets you save a file transferred over HTTP?
        options: [Follow TCP Stream, Export Objects > HTTP, Expert Information, Decode As]
        answer: 1
        explanation: Export Objects reassembles transferred files so you can hash them.
      - prompt: Why search a file's hash on VirusTotal instead of uploading the file?
        options:
          - Hashes are faster to type
          - Uploading may share sensitive or targeted samples publicly and tip off the attacker
          - VirusTotal does not accept uploads
          - Hashes reveal the attacker's identity
        answer: 1
        explanation: Uploads become available to other users; a hash lookup reveals nothing new.
      - prompt: Which of these is an indicator of compromise?
        options: [A firewall vendor name, The SHA-256 of a malicious payload, The OSI model, A user's job title]
        answer: 1
        explanation: File hashes, malicious domains, IPs and URLs are classic IOCs.

  - slug: net-encrypted-traffic
    title: Reading Encrypted Traffic with TLS Metadata
    order: 4
    difficulty: intermediate
    summary: Spot malicious TLS sessions from SNI, certificates and JA3 without decrypting.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.9", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Explain which parts of a TLS session stay in cleartext and why they are useful
      - Use the Server Name Indication, certificate fields and JA3 fingerprints as indicators
      - Triage an encrypted conversation without decrypting the payload
    theory: |
      Most traffic is now encrypted with **TLS**, so you rarely see payloads. The useful part is
      that the handshake leaks a lot before encryption starts. The **Client Hello** carries the
      **Server Name Indication (SNI)**, the hostname the client asked for, in cleartext, and the
      **Server Hello** and certificate expose the subject, issuer and validity dates. These are
      often enough to decide whether a session deserves a closer look.

      A few patterns stand out. Connections to a bare IP with **no SNI**, or an SNI that does not
      match the certificate subject, are worth flagging. **Self-signed certificates**, certificates
      valid for only a few days, or subjects full of random characters often belong to malware or
      throwaway infrastructure. A long-lived connection to one destination with steady timing still
      looks like beaconing even when you cannot read the bytes.

      **JA3** and **JA3S** hash the ordered fields of the Client and Server Hello into a short
      fingerprint of the client and server software. The same malware family tends to produce the
      same JA3, so a known-bad fingerprint is an indicator even against a brand-new domain. None of
      this needs decryption; it all comes from metadata that TLS leaves in the open.
    examples:
      - title: SNI and certificate mismatch
        body: |
          Client Hello  SNI = cdn.example-good.com
          Certificate   subject CN = a83kfj.duckdns.org   issuer = self-signed
          The requested name and the presented certificate disagree, and the cert is self-signed.
      - title: Pulling JA3 in Wireshark
        body: |
          Filter    tls.handshake.type == 1
          The JA3 field appears under the TLS layer once JA3 is enabled in preferences.
          Record the hash and compare it against a threat-intel JA3 blocklist.
    exercise:
      title: Triage encrypted sessions from metadata
      environment: An isolated analysis VM with a sample TLS capture; only analyse traffic you are authorised to
      tools: [Wireshark, a JA3 reference list, a text editor]
      steps:
        - Open a capture containing HTTPS traffic in your analysis VM.
        - Filter `tls.handshake.type == 1` and list the SNI value for each Client Hello.
        - Filter `tls.handshake.type == 11` and record the certificate subject, issuer and validity period for each server.
        - Flag any session where the SNI is missing, is a bare IP, or disagrees with the certificate subject.
        - Note any self-signed certificate or one valid for only a handful of days.
        - Enable JA3 in Wireshark preferences and collect the JA3 hash for each suspicious client.
        - Write up the sessions you would escalate and the single metadata field that justified each one.
      deliverable: A short table of suspicious TLS sessions with the SNI, certificate subject, JA3 hash and the reason each was flagged.
    expected_outcome: >
      You can decide which encrypted sessions are worth investigating using only
      the handshake metadata, without ever decrypting the payload.
    quiz:
      - prompt: Which part of a TLS session reveals the requested hostname in cleartext?
        options: [The encrypted application data, The Server Name Indication in the Client Hello, The session ticket, The message authentication code]
        answer: 1
        explanation: The SNI is sent in the clear in the Client Hello so the server can present the right certificate.
      - prompt: A JA3 fingerprint is most useful because
        options:
          - It decrypts the TLS session
          - The same client software tends to produce the same hash, so a known-bad value is an indicator even for a new domain
          - It reveals the user's password
          - It replaces the need for certificates
        answer: 1
        explanation: JA3 hashes the client's handshake fields, so malware reusing a TLS stack keeps a recognisable fingerprint.
      - prompt: Which observation most warrants a closer look?
        options: [A certificate issued by a well-known authority, An SNI that matches the certificate subject, A self-signed certificate valid for three days on a connection to a bare IP, A long-lived session to a known update server]
        answer: 2
        explanation: Self-signed, short-lived certificates on connections to bare IPs are common to malware and throwaway infrastructure.
      - prompt: Can beaconing still be spotted in encrypted traffic?
        options: [No, encryption hides everything, Yes, the timing and size of connections are still visible, Only with the private key, Only over UDP]
        answer: 1
        explanation: Connection timing and sizes are metadata TLS does not hide, so regular check-ins still stand out.

  - slug: net-dns-abuse
    title: Detecting DNS Abuse, Tunnelling and DGA
    order: 5
    difficulty: intermediate
    summary: Spot command-and-control, tunnelling and domain-generation activity hiding in DNS.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Explain why attackers abuse DNS and which DNS behaviours are suspicious
      - Recognise tunnelling, domain-generation algorithms and fast flux in query logs
      - Hunt DNS logs for the metrics that expose abuse
    theory: |
      DNS is needed everywhere and is usually allowed outbound, so attackers lean on it heavily.
      **DNS tunnelling** hides data or command-and-control inside queries and responses; in the
      logs it shows as long, high-entropy subdomains, a burst of TXT or NULL record queries, and
      heavy query volume to a single domain. The payload rides in the part of the name the client
      controls, so the giveaway is the shape of the traffic, not its content.

      Two more patterns are worth knowing. A **domain generation algorithm (DGA)** has malware try
      many random-looking domains until one resolves, so you see a spike of **NXDOMAIN** (does not
      exist) responses from one host as it works through dead names. **Fast flux** rotates many IP
      addresses behind one name with very low TTLs to resist takedown. And **encrypted DNS** (DoH
      or DoT) can bypass your monitoring entirely, so a client quietly bypassing the internal
      resolver is itself a flag.

      None of this needs the query contents. You hunt it with a handful of metrics: query length
      and entropy, the NXDOMAIN rate per host, query volume per domain, unusual record types, and
      abnormally low TTLs. A host that scores high on several at once is the one to investigate,
      and the output is a list of suspect domains and the internal host behind them.
    examples:
      - title: A tunnelling query by its shape
        body: |
          Query   a8f3k2j9x1q7.d4t4.exfil-example.net  type=TXT
          A long, high-entropy label and a TXT lookup to one domain is a tunnelling signature.
      - title: A DGA host by its NXDOMAIN rate
        body: |
          host=10.1.1.23  NXDOMAIN responses in 2 min = 180
          A single host generating a flood of failed lookups is working through generated domains.
    exercise:
      title: Hunt DNS abuse in query logs
      environment: A SIEM or notebook with a sample DNS query log
      tools: [A sample DNS log, a SIEM or notebook, a notes file]
      steps:
        - Load a sample DNS query log and list the top domains by query volume.
        - Flag domains whose subdomains are long or look high-entropy rather than human-readable.
        - Count NXDOMAIN responses per host and pick out any host with an unusually high rate.
        - List the record types in use and flag a spike in TXT or NULL queries to one domain.
        - Check for a client resolving names without going through the internal resolver.
        - Combine the signals and name the hosts and domains you would escalate.
        - Write an indicator list of the suspect domains and the internal hosts behind them.
      deliverable: A short hunt note listing suspect domains, the internal hosts involved and the DNS metric that flagged each.
    expected_outcome: >
      You can tell abusive DNS from normal lookups using query shape, NXDOMAIN rate,
      record type and TTL, and hand off the suspect domains and hosts.
    quiz:
      - prompt: A host suddenly producing a flood of NXDOMAIN responses most likely indicates
        options: [A faster connection, Malware working through algorithm-generated domains, A DNS cache hit, A normal software update]
        answer: 1
        explanation: A DGA tries many generated domains until one resolves, so failed lookups spike from the infected host.
      - prompt: Long, high-entropy subdomains with heavy TXT queries to one domain suggest
        options:
          - A content delivery network
          - DNS tunnelling of data or command-and-control
          - A healthy resolver
          - A time-synchronisation service
        answer: 1
        explanation: Tunnelling encodes data in the query name and often uses TXT records, giving long high-entropy labels to one domain.
      - prompt: Why can encrypted DNS (DoH or DoT) be a monitoring problem?
        options:
          - It speeds up name resolution
          - A client can bypass the internal resolver and hide its lookups from you
          - It deletes DNS logs
          - It blocks all DNS
        answer: 1
        explanation: Encrypted DNS to an external resolver takes the queries out of your visibility, so bypassing the internal resolver is itself suspicious.
      - prompt: DNS abuse is best hunted by
        options: [Reading every query by hand, Metrics like query length, NXDOMAIN rate and record type, Blocking all DNS, Ignoring DNS entirely]
        answer: 1
        explanation: Abuse shows in the shape and volume of traffic, so metrics such as entropy, NXDOMAIN rate and record type surface it.

  - slug: net-flow-lateral-movement
    title: Flow Analysis and Detecting Scanning and Lateral Movement
    order: 6
    difficulty: intermediate
    summary: Use connection flow records to spot scanning and east-west movement without full packet capture.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:1.3"]
    learning_objectives:
      - Explain what a flow record is and how it differs from full packet capture
      - Recognise horizontal and vertical scanning in flow data
      - Spot east-west lateral movement that north-south monitoring misses
    theory: |
      Full packet capture is rich but expensive to keep, so most networks are watched with **flow
      records** instead. A flow is a summary of one conversation, source and destination address
      and port, protocol, byte and packet counts, and start and end time, without the payload. You
      lose the content but gain a cheap, long record of **who talked to whom**, which is exactly
      what you need to see movement across a network.

      Scanning has a recognisable shape in flow data. A **vertical scan** is one source hitting many
      ports on one host; a **horizontal scan** is one source hitting the same port across many
      hosts. Both show up as a fan of short, small, often half-open flows from a single source in a
      brief window. A host that suddenly opens connections to dozens of peers it never spoke to
      before is behaving like a scanner even if each flow looks ordinary on its own.

      The highest-value use of flow data is **east-west** visibility. Perimeter tools watch
      north-south traffic crossing the network edge, but an attacker who is already inside moves
      sideways, server to server, workstation to server, on internal protocols like SMB and RDP.
      That lateral movement never crosses the perimeter, so only internal flow records reveal it:
      an administrative workstation reaching many servers on port 445, or a server opening RDP to
      peers it normally only answers. Baselining each host's normal set of peers turns these into
      alerts. This is a different altitude from reading a single packet capture; here you are
      watching the whole network's connection graph for movement, not dissecting one session.
    examples:
      - title: A horizontal scan in flow records
        body: |
          src 10.0.0.50 -> 10.0.0.0/24 port 445  200 flows  avg 2 packets each  5 seconds
          One source touching port 445 across a whole subnet in seconds is a scan, not normal use.
      - title: Lateral movement east-west
        body: |
          workstation 10.0.5.12 -> 10.0.9.21, .22, .23 ... port 3389 (RDP)
          A workstation opening RDP to many servers it never contacted before is lateral movement.
    exercise:
      title: Hunt scanning and lateral movement in sample flow data
      environment: A sample set of network flow records (NetFlow or Zeek conn logs) in a file
      tools: [A sample flow or conn log, command-line tools or a spreadsheet]
      steps:
        - Describe how a flow record differs from a full packet capture and what each is good for.
        - Count distinct destination ports per source to find any vertical scan, and name the source.
        - Count distinct destination hosts per source and port to find any horizontal scan.
        - Identify an internal host whose set of peers is far larger than the others and explain why it stands out.
        - Decide which of the findings is east-west lateral movement and which is north-south, and say why it matters.
        - Write the one host you would isolate first and the flow evidence behind that call.
      deliverable: A short flow-analysis note listing the scan or scans found, the lateral-movement host, and the evidence for each.
    expected_outcome: >
      You can read flow records, recognise horizontal and vertical scanning, and spot east-west
      lateral movement that perimeter monitoring would miss.
    quiz:
      - prompt: A flow record differs from full packet capture in that it
        options:
          - Contains the full payload of every packet
          - Summarises a conversation (addresses, ports, counts, time) without the payload
          - Only works for encrypted traffic
          - Is larger than a packet capture
        answer: 1
        explanation: A flow is a metadata summary of a conversation, cheap to keep, with no payload.
      - prompt: One source connecting to the same port across many hosts in a short window is
        options: [A vertical scan, A horizontal scan, A normal backup, A DNS lookup]
        answer: 1
        explanation: Same port, many hosts is a horizontal scan; many ports on one host is vertical.
      - prompt: Why is internal (east-west) flow visibility important?
        options:
          - It is cheaper than any other monitoring
          - Lateral movement between internal hosts never crosses the perimeter, so only internal flows reveal it
          - It replaces endpoint logging
          - It decrypts TLS
        answer: 1
        explanation: An attacker already inside moves server to server, traffic the perimeter never sees.
      - prompt: Flow analysis differs from reading a single packet capture in that it
        options: [Is the same thing, Watches the whole network's connection graph rather than dissecting one session, Only reads payloads, Needs no baseline]
        answer: 1
        explanation: Flow analysis is about who-talks-to-whom across the network, a different altitude from one session.
  - slug: net-wireless-access-security
    title: Wireless and Network Access Security
    order: 7
    difficulty: intermediate
    summary: Secure the edge where devices join the network, covering Wi-Fi encryption, rogue access points and port-based access control, and spot the attacks that target it.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.2", "secplus:4.3", "cysa:1.1"]
    learning_objectives:
      - Explain how modern Wi-Fi is secured and where it is still attacked
      - Describe port-based network access control and why it matters for wired ports too
      - Detect rogue access points and unauthorised devices joining the network
    theory: |
      The edge where a device joins the network is a favourite target, because an attacker who
      gets on the LAN skips the perimeter entirely. On wireless, **WPA2** and **WPA3** encrypt the
      link; WPA3 adds forward secrecy and resistance to offline password cracking. Enterprise Wi-Fi
      avoids a shared passphrase altogether and authenticates each user or device with **802.1X**
      against a RADIUS server, so access can be tied to identity and revoked individually.

      The classic wireless attacks exploit trust in the network name. A **rogue access point** is an
      unauthorised AP plugged into the corporate network; an **evil twin** is an attacker AP
      broadcasting a familiar SSID so victims connect to it and expose traffic or credentials.
      **Deauthentication** frames can knock clients off a legitimate AP to push them onto the evil
      twin. Defences are network hygiene: a wireless IDS that flags unknown BSSIDs, client
      configuration that does not auto-join open networks, and certificate-based 802.1X so a client
      only trusts the real RADIUS server.

      The same access-control idea applies to wired ports. **802.1X** on a switch port, or MAC-based
      NAC, stops someone walking in and plugging a laptop into a conference-room jack. A SOC watches
      for the signs of edge abuse: a new device MAC on a port that should be a phone, an AP
      appearing with a cloned SSID, or a burst of deauth frames. As always, a hit is a lead; a new
      device may be a legitimate replacement, so it is confirmed against asset records before action.
    examples:
      - title: Evil twin versus the real AP
        body: |
          Real AP    SSID "CorpWifi"  BSSID aa:bb:cc:...  802.1X + cert
          Evil twin  SSID "CorpWifi"  BSSID 66:77:88:...  open or captive portal
          A client pinned to the RADIUS cert will not hand credentials to the twin.
      - title: A rogue device on a wired port
        body: |
          Port Gi1/0/14 expected: VoIP phone MAC 00:1a:...  (in asset inventory)
          Observed: a second, unknown MAC behind it -> possible rogue switch/laptop
          Confirm against inventory before disabling the port.
    exercise:
      title: Assess and monitor network access security in a lab
      environment: A home or lab network with a configurable access point and switch (or a simulator), plus a packet capture tool
      tools: [A Wi-Fi AP or simulator, a managed switch or NAC feature if available, Wireshark, a notes file]
      steps:
        - Document your test network's wireless security (WPA2 vs WPA3, whether it uses a shared key or 802.1X) and note one weakness in the current setup.
        - Capture wireless management traffic (or review a provided capture) and identify beacon frames and any deauthentication frames.
        - Describe how an evil twin would appear in your capture and what client setting would stop a device trusting it.
        - On a switch or NAC simulator, enable or describe port-based access control and test what happens when an unknown device connects.
        - Build a short list of the devices authorised on your network (by MAC or certificate) and define how you would detect a new, unlisted one.
        - Write a detection idea for a rogue AP broadcasting your SSID and state how you would confirm it before acting.
      deliverable: A short assessment of the network's edge security with one captured or described attack indicator, a port-access-control test result, and a rogue-device detection and confirmation plan.
    expected_outcome: >
      You can explain how Wi-Fi and wired access control are secured, recognise rogue-AP, evil-twin
      and deauthentication attacks in traffic, and detect an unauthorised device joining the network
      before confirming and acting.
    quiz:
      - prompt: What does WPA3 add over WPA2 for wireless security?
        options:
          - Nothing, they are identical
          - Forward secrecy and resistance to offline password cracking
          - It removes the need for a password
          - It disables logging
        answer: 1
        explanation: WPA3 strengthens the handshake, adding forward secrecy and making captured traffic far harder to crack offline.
      - prompt: An evil twin attack works by
        options:
          - Encrypting all traffic
          - Broadcasting a familiar SSID so victims connect to the attacker's access point
          - Disabling the switch
          - Patching the client
        answer: 1
        explanation: The evil twin imitates a trusted network name so clients connect and expose traffic or credentials.
      - prompt: 802.1X on a wired switch port primarily prevents
        options:
          - Slow network speeds
          - An unauthorised device from gaining access just by plugging into a jack
          - Wi-Fi interference
          - Log tampering
        answer: 1
        explanation: Port-based access control authenticates the device or user before the port carries traffic, stopping walk-up access.
      - prompt: A new, unknown MAC address behind a port expected to hold a phone should be
        options: [Ignored, Treated as a lead and confirmed against asset inventory before action, Immediately trusted, Deleted from logs]
        answer: 1
        explanation: It may be a rogue device or a legitimate replacement, so it is confirmed against inventory before any action.
  - slug: net-vpn-remote-access
    title: VPN and Remote Access Security
    order: 8
    difficulty: intermediate
    summary: Understand how VPNs protect remote connections, where split tunnelling and weak configuration create risk, and how to spot abused remote access.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.2", "secplus:4.3", "cysa:1.1"]
    learning_objectives:
      - Explain how IPsec and TLS VPNs protect traffic and authenticate endpoints
      - Describe the risk of split tunnelling, weak ciphers and over-broad access
      - Detect abused or anomalous remote-access sessions in logs
    theory: |
      Remote access extends the trusted network to wherever a user is, which is useful and dangerous
      in equal measure. A **VPN** builds an encrypted tunnel between a client and the network so traffic
      cannot be read or altered on the path. **IPsec** VPNs operate at the network layer and are common
      for site-to-site links; **TLS** VPNs (and SSL portals) operate higher up and suit remote users on
      untrusted networks. Both must authenticate the endpoint, ideally with certificates or MFA rather
      than a shared secret, because a VPN that anyone can log into is a doorway, not a defence.

      Configuration decides whether a VPN helps or hurts. **Split tunnelling** sends only corporate
      traffic down the tunnel and lets the rest go direct, which is efficient but means a compromised
      home device bridges the internet and the corporate network at once; **full tunnelling** is safer
      for high-risk users. Weak or legacy ciphers, no MFA, and over-broad access, a VPN that drops users
      straight onto a flat internal network rather than a segmented one, turn a single stolen credential
      into deep access. The modern direction is **zero-trust network access**, which grants access per
      application after checking identity and device, instead of trusting anyone on the tunnel.

      For a SOC, remote access is a rich signal. A VPN login from a new country, at an odd hour, or
      concurrent logins from two places for one account are the same account-takeover tells as any other
      remote authentication. A hit is a lead, confirmed against the user's travel and device before
      action, but unusual remote access is often the first visible step of an intrusion.
    examples:
      - title: Split versus full tunnelling
        body: |
          Split:  corp traffic -> tunnel; everything else -> direct (home device bridges both)
          Full:   all traffic  -> tunnel and corporate controls (safer for risky users)
          Choose by how much you trust the endpoint.
      - title: A suspicious VPN session
        body: |
          08:00 VPN login user from UK (usual)
          08:05 VPN login same user from another continent -> concurrent, impossible
          Confirm against travel/device, then treat as possible credential theft.
    exercise:
      title: Review a remote-access setup and its logs
      environment: A VPN client/server lab, a cloud VPN, or provided VPN configuration and sample logs
      tools: [A VPN setup or its configuration, sample VPN/auth logs, a notes file]
      steps:
        - Identify whether the VPN uses IPsec or TLS and how it authenticates users, and note whether MFA is enforced.
        - Determine whether it uses split or full tunnelling and explain the risk of the current choice for a high-risk user.
        - Check the cipher suite or protocol version and flag anything weak or legacy.
        - Describe how far a user lands on the internal network after connecting and whether that access is segmented or flat.
        - Review sample VPN login logs and identify one session that looks anomalous (new location, odd hour, concurrent logins).
        - State how you would confirm that session before acting and one improvement (MFA, full tunnelling, per-app access) you would make.
      deliverable: A short assessment of the VPN's authentication, tunnelling and access scope, one anomalous session from the logs with a confirmation plan, and one concrete hardening recommendation.
    expected_outcome: >
      You can explain how VPNs protect remote connections, judge the risk in a split-tunnel or
      over-broad configuration, and detect an abused remote-access session before confirming and acting.
    quiz:
      - prompt: The main security purpose of a VPN is to
        options:
          - Speed up the connection
          - Encrypt and authenticate traffic between a client and the network over an untrusted path
          - Replace the firewall
          - Store logs
        answer: 1
        explanation: A VPN builds an authenticated, encrypted tunnel so traffic cannot be read or altered in transit.
      - prompt: Why can split tunnelling increase risk?
        options:
          - It encrypts too much
          - A compromised endpoint bridges the internet and the corporate network at the same time
          - It disables the VPN
          - It blocks all traffic
        answer: 1
        explanation: With split tunnelling the device is on both networks at once, so a compromise can pivot inward.
      - prompt: A VPN should ideally authenticate users with
        options: [A single shared password, Certificates or MFA rather than a shared secret, No authentication, Only a username]
        answer: 1
        explanation: Strong per-user authentication stops a single leaked secret from opening the tunnel to anyone.
      - prompt: Concurrent VPN logins for one account from two distant locations are
        options: [Always fine, A lead to confirm against travel and device as possible account takeover, Proof of a firewall fault, A reason to disable logging]
        answer: 1
        explanation: Impossible concurrent sessions are a classic takeover tell, confirmed against context before action.
  - slug: net-nac-8021x
    title: Network Access Control and 802.1X
    order: 9
    difficulty: intermediate
    summary: Control which devices are allowed onto the network at the moment they connect, using 802.1X and NAC, so an unknown or non-compliant device cannot simply plug in and belong.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "secplus:4.4", "cysa:1.3"]
    learning_objectives:
      - Explain what network access control decides and why it matters
      - Describe 802.1X authentication and its supplicant/authenticator/server roles
      - Design NAC enforcement including posture checks and quarantine
    theory: |
      Most network controls assume a device is already on the network; **network access control** (NAC) asks
      the earlier question of whether a device should be let on at all. Without it, anyone who reaches a
      network port or wireless SSID is effectively trusted, a visitor's laptop, an attacker's implant, an
      unpatched personal device can all join and start talking to internal systems. NAC moves the trust
      decision to the moment of connection: authenticate the device and its user, check that it meets policy,
      and only then grant access, often to a specific segment rather than the whole network.

      The core technology is **802.1X**, a standard for port-based authentication with three roles. The
      **supplicant** is the device trying to connect; the **authenticator** is the switch or wireless access
      point it connects through, which holds the port closed to everything except the authentication exchange;
      and the **authentication server** (usually RADIUS) makes the decision, typically against the directory
      or certificates. Until the supplicant proves who it is, the port passes nothing else, so an
      unauthenticated device simply cannot reach the network. This is how enterprises stop a random device in
      a conference-room jack from gaining access.

      Mature NAC adds **posture** and **enforcement**. Posture checks ask whether the connecting device is
      compliant, patched, running endpoint protection, disk encrypted, and a device that fails is placed in a
      **quarantine** VLAN with access only to remediation resources rather than the production network. NAC
      also handles the devices that cannot do 802.1X (printers, IoT) through MAC-based profiling, carefully,
      since MACs can be spoofed. For the analyst, NAC is both a control and a telemetry source: it logs every
      join, every failed authentication, and every quarantined device, so a burst of failed 802.1X attempts or
      an unknown device repeatedly trying to connect is a lead worth confirming against what is expected on
      that segment.
    examples:
      - title: The 802.1X three roles
        body: |
          supplicant (laptop) -> authenticator (switch port, held closed)
          -> authentication server (RADIUS) decides
          Until the laptop authenticates, the port passes only the auth exchange.
      - title: Posture-based quarantine
        body: |
          Device connects, 802.1X ok, posture check: AV disabled, 40 patches behind
          -> placed in quarantine VLAN (remediation only), not production
          Compliant devices get full access; non-compliant get fixed first.
    exercise:
      title: Design NAC enforcement for a network
      environment: A lab with an 802.1X-capable switch/RADIUS (or a described network and NAC policy to design)
      tools: [A switch/RADIUS lab or a network description, a NAC policy template, a notes file]
      steps:
        - Explain what access decision NAC makes and the risk of a network with no access control at the port.
        - Describe the supplicant, authenticator and authentication-server roles in an 802.1X exchange for a connecting device.
        - Design an authentication policy, which devices use 802.1X with certificates versus credentials, and how printers or IoT are handled safely.
        - Add a posture check and define what a non-compliant device gets (quarantine VLAN and remediation access).
        - Identify one NAC log signal (a burst of failed authentications, an unknown device) that would be worth investigating.
        - State how you would confirm that signal against the devices expected on that segment before acting.
      deliverable: A NAC design with an 802.1X authentication policy, handling for non-802.1X devices, a posture-and-quarantine rule, and one log signal with its confirmation step.
    expected_outcome: >
      You can explain what network access control decides, describe 802.1X and its three roles, and design
      NAC enforcement with posture checks and quarantine so only authenticated, compliant devices reach the
      production network.
    quiz:
      - prompt: Network access control primarily decides
        options:
          - How fast the network runs
          - Whether a device should be allowed onto the network at the moment it connects
          - Which websites are blocked
          - How logs are stored
        answer: 1
        explanation: NAC moves the trust decision to connection time, authenticating and checking a device before granting access.
      - prompt: In 802.1X, the switch port that holds the connection closed until authentication is the
        options: [Supplicant, Authenticator, Authentication server, Directory]
        answer: 1
        explanation: The authenticator (switch or access point) passes only the auth exchange until the supplicant proves its identity.
      - prompt: A device that fails a NAC posture check is best
        options:
          - Given full access anyway
          - Placed in a quarantine VLAN with access only to remediation resources
          - Blocked from the internet only
          - Logged and ignored
        answer: 1
        explanation: Quarantine lets the device be remediated without exposing the production network.
      - prompt: A burst of failed 802.1X authentications on a segment is
        options: [Routine, A lead to confirm against the devices expected there, Proof of a switch failure, A reason to disable NAC]
        answer: 1
        explanation: Repeated failed joins can indicate an unauthorised device trying to connect, worth investigating in context.
  - slug: net-ddos-defense
    title: Defending Against DDoS and Volumetric Attacks
    order: 10
    difficulty: intermediate
    summary: Understand how denial-of-service attacks overwhelm a target, the layers they hit, and the defences, from upstream scrubbing to rate limiting, that keep a service available.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "secplus:4.4", "cysa:1.1"]
    learning_objectives:
      - Explain how volumetric, protocol and application DDoS attacks work
      - Describe the layered defences that keep a service available under attack
      - Recognise a DDoS in traffic patterns and distinguish it from a real spike
    theory: |
      Availability is one of the three pillars of security, and **denial-of-service** attacks target it
      directly by overwhelming a system so legitimate users cannot reach it. A **distributed** denial of
      service (DDoS) uses many sources at once, often a botnet of compromised devices, which makes it both
      more powerful and harder to block by simply dropping one address. Understanding the attack means seeing
      that it comes in different flavours aimed at different layers, and the defence differs for each.

      There are three broad types. **Volumetric** attacks flood the target's bandwidth with sheer traffic
      (amplification attacks abuse protocols like DNS and NTP to multiply the volume), so the link saturates
      before packets even reach the server. **Protocol** attacks exhaust connection state, a SYN flood leaves
      half-open connections until the server's table fills. **Application-layer** attacks are subtler and
      lower-volume: they send requests that look legitimate but are expensive to serve (a flood of searches or
      logins), exhausting the application rather than the pipe, which makes them hard to tell from a genuine
      traffic surge.

      Defence is layered and mostly about scale and filtering. Because a large volumetric attack can exceed
      any single site's bandwidth, the heavy lifting happens **upstream**: cloud scrubbing services and
      content delivery networks absorb and filter the flood before it reaches the origin, and the origin's
      address is kept hidden behind them. Closer in, **rate limiting**, connection limits, SYN cookies and
      web-application-firewall rules handle protocol and application attacks. The analyst's role is detection
      and coordination: recognising the pattern (a sudden flood from many sources, or a spike of expensive
      requests), distinguishing it from a legitimate surge or a flash crowd, and engaging the upstream
      defences, because a DDoS is survived by preparation and capacity, not fixed after the fact.
    examples:
      - title: Three layers of DoS
        body: |
          Volumetric  flood bandwidth (DNS/NTP amplification) -> link saturates
          Protocol    exhaust state (SYN flood) -> connection table fills
          Application expensive requests (search/login flood) -> app exhausted
          Each needs a different defence.
      - title: Upstream scrubbing
        body: |
          attack traffic -> cloud scrubbing / CDN (absorb + filter) -> clean traffic -> origin
          origin address hidden behind the service
          A flood bigger than your pipe must be stopped before your pipe.
    exercise:
      title: Plan DDoS defences and recognise an attack
      environment: A described service and its architecture, plus sample traffic data (or a scenario) showing an attack
      tools: [A service description, sample traffic data or a scenario, a notes file]
      steps:
        - Explain how a distributed attack differs from a single-source one and why that matters for blocking.
        - For a sample service, identify which layer (volumetric, protocol, application) each of two attack scenarios targets.
        - Describe the upstream defence (scrubbing or CDN) that handles a large volumetric attack and why it must be upstream.
        - Specify the closer-in defences (rate limiting, SYN cookies, WAF rules) for the protocol and application attacks.
        - Review the traffic pattern and distinguish a DDoS from a legitimate surge or flash crowd, stating the signals you used.
        - Outline the response steps and who you would engage when an attack is confirmed.
      deliverable: A DDoS defence plan mapping each attack type to its layer and defence, the upstream-versus-origin split, and a traffic analysis distinguishing attack from legitimate surge with a response outline.
    expected_outcome: >
      You can explain volumetric, protocol and application denial-of-service attacks, design the layered
      defences that keep a service available, and recognise an attack in traffic patterns while telling it
      apart from a legitimate surge.
    quiz:
      - prompt: A distributed denial-of-service attack is harder to block because
        options:
          - It uses one powerful computer
          - It comes from many sources at once, so dropping a single address does not stop it
          - It is always encrypted
          - It only targets email
        answer: 1
        explanation: Many simultaneous sources mean no single block stops it, and the volume is larger.
      - prompt: A volumetric attack must be mitigated upstream because
        options:
          - Upstream is cheaper
          - A flood larger than your own bandwidth must be absorbed before it reaches your link
          - The origin has no CPU
          - Logging is upstream
        answer: 1
        explanation: If the attack exceeds your pipe, only upstream scrubbing or a CDN can absorb it before it saturates you.
      - prompt: An application-layer DDoS is hard to detect because
        options:
          - It uses huge bandwidth
          - Its requests look legitimate but are expensive to serve, resembling a real traffic surge
          - It never reaches the server
          - It only uses ICMP
        answer: 1
        explanation: Low-volume but costly requests mimic genuine traffic, making them hard to distinguish from a surge.
      - prompt: A SYN flood is which type of attack?
        options: [Volumetric, Protocol (exhausting connection state), Application-layer, Physical]
        answer: 1
        explanation: A SYN flood exhausts the connection-state table, a protocol-layer attack.
  - slug: net-segmentation-vlans
    title: Network Segmentation and VLANs
    order: 11
    difficulty: intermediate
    summary: Divide a flat network into segments with VLANs and access control so a compromise in one area cannot reach the rest, and so monitoring concentrates at the boundaries.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.4", "cysa:1.3"]
    learning_objectives:
      - Explain why a flat network is dangerous and segmentation limits blast radius
      - Describe how VLANs and inter-VLAN access control implement segmentation
      - Place monitoring at segment boundaries to catch lateral movement
    theory: |
      A **flat network**, where every device can reach every other, is one of the most common and most
      dangerous conditions in security, because a single compromised host can then reach everything: servers,
      other users, sensitive systems. **Segmentation** breaks that reachability into zones so that a foothold
      in one part of the network does not grant access to the rest, directly limiting the **blast radius** of
      any compromise. It is the network embodiment of least privilege: devices can reach only what they have a
      genuine need to reach.

      The common building block is the **VLAN** (virtual LAN), which divides one physical switch
      infrastructure into separate logical networks, so that, for example, user workstations, servers, VoIP
      phones, and guest devices each sit on their own VLAN even though they share the same switches. VLANs
      alone only separate broadcast domains; the security comes from **inter-VLAN access control**, a firewall
      or layer-3 device between VLANs that permits only the traffic that should cross (users reach the
      application servers they need, but not each other, and guests reach only the internet). The more
      sensitive the segment, cardholder data, industrial control systems, the stricter and more isolated it is.

      Segmentation also transforms monitoring. When traffic must cross a controlled boundary to move between
      zones, those boundaries become natural **choke points** where the SOC can watch and enforce: east-west
      traffic that used to be invisible on a flat network now passes a firewall that logs it, so lateral
      movement from one segment toward another is far more likely to be seen. For the analyst, the practical
      upshot is twofold, segmentation contains incidents and it creates visibility, and unexpected traffic
      attempting to cross from a low-trust segment toward a sensitive one is a high-value signal to confirm
      against what is normally allowed. Micro-segmentation takes this to its logical end, isolating individual
      workloads, but even coarse VLAN segmentation is one of the highest-impact architectural controls a
      network can have.
    examples:
      - title: Flat versus segmented
        body: |
          Flat:      one compromised desktop -> reaches servers + every other host
          Segmented: users | servers | guests | sensitive, boundaries controlled
          A foothold is stuck in its segment unless it defeats a boundary.
      - title: Boundary as a choke point
        body: |
          user VLAN -> [firewall logs + rules] -> server VLAN
          east-west traffic now crosses a monitored boundary
          lateral movement toward sensitive zones becomes visible.
    exercise:
      title: Design network segmentation and its monitoring
      environment: A described network with mixed device types (or a lab with VLAN-capable switching), plus a diagram or document
      tools: [A network description or VLAN lab, a diagram or document, a notes file]
      steps:
        - Explain the risk of the current flat network and what a single compromise could reach.
        - Divide the environment into VLANs by function (users, servers, guests, sensitive) and justify the split.
        - Specify the inter-VLAN access control, what traffic may cross each boundary and why, applying least privilege.
        - Identify the most sensitive segment and describe how strictly it is isolated.
        - Choose one boundary as a monitoring choke point and state the crossing that would be suspicious.
        - Explain how this segmentation would contain a compromise that started in the user VLAN.
      deliverable: A segmentation design with VLANs by function, inter-VLAN access rules, the isolation of the sensitive segment, a boundary monitoring point, and the blast-radius containment it provides.
    expected_outcome: >
      You can explain why flat networks are dangerous, segment a network with VLANs and inter-VLAN access
      control to limit blast radius, and use segment boundaries as monitoring choke points that reveal lateral
      movement.
    quiz:
      - prompt: Why is a flat network dangerous?
        options:
          - It is slow
          - A single compromised host can reach every other device, including sensitive systems
          - It uses too many VLANs
          - It cannot be monitored at all
        answer: 1
        explanation: With no segmentation, one foothold has unrestricted reach across the whole network.
      - prompt: VLANs provide security only when combined with
        options:
          - More switches
          - Inter-VLAN access control that permits only the traffic that should cross
          - Faster cabling
          - Disabled logging
        answer: 1
        explanation: VLANs separate networks logically, but a firewall or layer-3 control between them enforces what may cross.
      - prompt: Segmentation improves monitoring because
        options:
          - It deletes logs
          - Traffic must cross controlled boundaries that act as choke points where the SOC can watch and enforce
          - It hides east-west traffic
          - It removes firewalls
        answer: 1
        explanation: Boundaries make previously invisible east-west traffic pass a monitored, logged control.
      - prompt: Traffic attempting to cross from a low-trust segment toward a sensitive one is
        options: [Always fine, A high-value signal to confirm against what is normally allowed, A backup, A routine broadcast]
        answer: 1
        explanation: Unexpected crossings toward sensitive zones are classic lateral-movement signals worth investigating.
  - slug: net-proxy-tls-inspection
    title: Web Proxies, Gateways and TLS Inspection
    order: 12
    difficulty: intermediate
    summary: Understand how forward proxies and secure web gateways control and inspect outbound web traffic, why TLS inspection is needed to see inside encryption, and the trade-offs it brings.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.4", "cysa:1.1"]
    learning_objectives:
      - Explain how forward proxies and secure web gateways control outbound traffic
      - Describe why and how TLS inspection reveals encrypted content
      - Weigh the security value of inspection against its privacy and risk trade-offs
    theory: |
      Most of what users and malware do reaches the internet over the web, so controlling and seeing outbound
      web traffic is a high-value capability. A **forward proxy** sits between users and the internet: every web
      request passes through it, so it can enforce policy (block categories of sites, known-bad domains and
      file types), cache content, and, importantly, **log** every request for the SOC. A **secure web gateway**
      (SWG) is the modern, feature-rich version, adding malware scanning, URL filtering, data-loss checks and
      threat intelligence. Routing web traffic through such a choke point turns a sprawling, invisible flow into
      something policy-controlled and observable.

      The complication is **encryption**. The majority of web traffic is now HTTPS, which hides the content, and
      the URL path, from a proxy that only sees the destination. **TLS inspection** (also called SSL inspection
      or break-and-inspect) lets the gateway decrypt, examine, and re-encrypt traffic so it can apply malware
      scanning and policy to the actual content. It works by having the gateway act as a trusted man-in-the-
      middle: clients trust a certificate the organisation controls, so the gateway can terminate and re-
      establish the TLS session. Without it, an SWG is largely blind to the inside of encrypted traffic, which
      is where modern malware and data exfiltration hide.

      Inspection is powerful but carries real **trade-offs** to weigh honestly. It raises privacy concerns
      (the organisation can see inside employees' encrypted sessions, so sensitive categories like banking and
      health are usually exempted), it can break applications that use certificate pinning or mutual TLS, and
      the inspection point itself becomes a high-value target and a potential single point of failure holding
      decrypted traffic. The engineering decision is therefore selective: inspect what policy and risk justify,
      exempt what privacy or compatibility require, and protect the inspection infrastructure well. For the
      analyst, the proxy and gateway logs are a primary detection source, revealing connections to malicious
      sites, large uploads, and odd user-agents, so understanding what the gateway can and cannot see (encrypted
      versus inspected) is essential to interpreting them.
    examples:
      - title: What a proxy/SWG adds
        body: |
          user -> [proxy/SWG: policy + malware scan + logging] -> internet
          blocks bad categories/domains/file types; logs every request for the SOC
          turns invisible outbound web into a controlled, observable choke point.
      - title: TLS inspection trade-off
        body: |
          without: HTTPS content hidden -> malware/exfil inside encryption unseen
          with:    gateway decrypts/inspects/re-encrypts (trusted MITM)
          but: privacy concerns, breaks cert-pinned apps, high-value decryption point
          -> inspect selectively, exempt sensitive categories.
    exercise:
      title: Design web-gateway policy and inspection scope
      environment: A described organisation and its web-access needs, plus sample proxy logs (or a scenario)
      tools: [A scenario or sample proxy logs, a document, a notes file]
      steps:
        - Explain what a forward proxy or secure web gateway controls and logs for outbound web traffic.
        - Explain why TLS inspection is needed to see inside HTTPS and how the gateway acts as a trusted intermediary.
        - Decide which traffic to inspect and which to exempt (for example banking, health) and justify the privacy trade-off.
        - Identify one application that TLS inspection could break and how you would handle it.
        - Review sample proxy logs and identify one request worth investigating (malicious domain, large upload, odd user-agent).
        - State what the gateway can and cannot see for an encrypted-but-not-inspected session, and how that affects your analysis.
      deliverable: A web-gateway design with an inspection-versus-exemption policy and its trade-offs, a broken-app handling note, and a proxy-log review identifying one suspicious request with the visibility caveat.
    expected_outcome: >
      You can explain how proxies and secure web gateways control and log outbound web traffic, why TLS
      inspection is needed to see inside encryption, and weigh inspection's security value against its privacy,
      compatibility and risk trade-offs when reading gateway logs.
    quiz:
      - prompt: A secure web gateway improves security mainly by
        options:
          - Speeding up the internet
          - Routing outbound web traffic through a choke point that enforces policy, scans for malware and logs every request
          - Encrypting the disk
          - Replacing the firewall entirely
        answer: 1
        explanation: An SWG makes sprawling outbound web traffic policy-controlled and observable.
      - prompt: TLS inspection is needed because
        options:
          - HTTPS is slow
          - Without it the gateway cannot see inside encrypted traffic, where malware and exfiltration hide
          - It disables logging
          - Encryption is illegal
        answer: 1
        explanation: Most web traffic is HTTPS, so inspection is required to apply scanning and policy to the content.
      - prompt: A genuine trade-off of TLS inspection is
        options:
          - It makes traffic faster
          - Privacy concerns and breaking apps that use certificate pinning, plus a high-value decryption point
          - It removes all risk
          - It needs no certificates
        answer: 1
        explanation: Inspection raises privacy issues, can break pinned apps, and concentrates decrypted traffic at a sensitive point.
      - prompt: For an encrypted session the gateway does NOT inspect, the proxy log shows
        options: [The full content, The destination and metadata but not the encrypted content, Nothing at all, The user's password]
        answer: 1
        explanation: Without inspection the proxy sees the destination and metadata but not the encrypted payload.
  - slug: net-ids-ips
    title: Intrusion Detection and Prevention Systems
    order: 13
    difficulty: intermediate
    summary: Understand how network IDS and IPS work, the difference between signature and anomaly detection, where they sit in the network, and how to read and tune their alerts.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.4", "cysa:1.1"]
    learning_objectives:
      - Explain how an IDS detects and an IPS blocks malicious network activity
      - Contrast signature-based and anomaly-based detection and their trade-offs
      - Read IDS/IPS alerts and reason about placement and false positives
    theory: |
      An **intrusion detection system (IDS)** watches network traffic and raises an alert when it sees something
      that matches a known attack or looks abnormal; an **intrusion prevention system (IPS)** does the same but
      sits **inline** so it can also drop or reset the connection. The difference is placement and authority: an
      IDS observes a copy of traffic (from a SPAN port or tap) and is purely a detection source, while an IPS is
      in the path of the traffic and can stop an attack in real time at the cost of becoming a potential
      bottleneck and single point of failure. Both are a core SOC data source, turning raw packets into
      named, investigable events.

      Detection works two broad ways. **Signature-based** detection matches traffic against a library of known
      patterns, for example the byte sequence of a specific exploit or a known-bad user-agent. It is precise and
      explains itself but is blind to anything not yet in the signature set, so it misses novel attacks.
      **Anomaly-based** detection builds a model of normal traffic and flags deviations, for example an
      unusual volume, protocol, or destination. It can catch new attacks but produces more false positives and is
      harder to explain. Mature deployments use both: signatures for the known, anomaly models for the unknown,
      with threat-intelligence feeds keeping signatures current.

      For the analyst, the practical work is **triage and tuning**. Every alert carries a signature name or rule
      id, a source and destination, and often a snippet of the matching traffic, which is where investigation
      starts. Many alerts are **false positives** (a vulnerability scanner, a backup job, a benign tool that
      resembles an attack), so the skill is deciding quickly whether an alert reflects real malicious activity and
      suppressing or refining noisy rules without blinding the sensor. Placement matters too: a sensor at the
      perimeter sees traffic entering and leaving, while one inside sees lateral movement, so understanding what a
      given sensor can and cannot see is essential to interpreting what it reports and what it would miss.
    examples:
      - title: IDS versus IPS
        body: |
          IDS: copy of traffic (SPAN/tap) -> alert only (detection source)
          IPS: inline -> alert + drop/reset (can stop the attack, can bottleneck)
          same detection engine, different placement and authority.
      - title: Signature versus anomaly
        body: |
          signature: matches known patterns -> precise, self-explaining, blind to novel
          anomaly:   models normal, flags deviations -> catches new, noisier, harder to explain
          mature sensors run both; threat intel keeps signatures current.
    exercise:
      title: Triage and tune IDS/IPS alerts
      environment: A described network with an IDS/IPS and a set of sample alerts (or a scenario)
      tools: [A scenario or sample IDS alerts, a document, a notes file]
      steps:
        - Explain the difference between an IDS and an IPS in placement and what each can do to traffic.
        - Contrast signature-based and anomaly-based detection and give one attack each is better at catching.
        - Review the sample alerts and classify at least three as likely true or false positives, with reasoning.
        - For one likely false positive, describe how you would tune or suppress the rule without blinding the sensor.
        - Decide where you would place a sensor to see lateral movement versus perimeter traffic and why.
        - State one attack the current sensor would miss and what would be needed to detect it.
      deliverable: An alert-triage note classifying several alerts true or false positive, a tuning plan for one noisy rule, a sensor-placement decision, and one identified detection gap.
    expected_outcome: >
      You can explain how IDS and IPS detect and respond to network attacks, contrast signature and anomaly
      detection, triage alerts into true and false positives, and reason about sensor placement and detection
      gaps when reading IDS/IPS output.
    quiz:
      - prompt: The key difference between an IDS and an IPS is that
        options:
          - An IDS is faster
          - An IPS sits inline and can drop or reset malicious connections, while an IDS only observes and alerts
          - An IDS encrypts traffic
          - They are identical
        answer: 1
        explanation: An IPS is inline and can block; an IDS observes a copy of traffic and only alerts.
      - prompt: Signature-based detection's main weakness is that it
        options:
          - Is always wrong
          - Cannot detect attacks that are not yet in its signature library
          - Needs no updates
          - Only works on encrypted traffic
        answer: 1
        explanation: Signatures match known patterns, so novel attacks with no signature are missed.
      - prompt: Anomaly-based detection is valuable because it can
        options:
          - Never produce false positives
          - Flag deviations from normal and so catch attacks that have no known signature
          - Replace all logging
          - Decrypt traffic by itself
        answer: 1
        explanation: Modelling normal lets it catch novel activity, at the cost of more false positives.
      - prompt: A perimeter IDS sensor would be least able to see
        options:
          - Traffic entering from the internet
          - Traffic leaving to the internet
          - Lateral movement between two internal hosts that never crosses the perimeter
          - Inbound scans
        answer: 2
        explanation: Purely internal lateral movement never reaches the perimeter, so a perimeter sensor misses it.
  - slug: net-dhcp-arp-attacks
    title: DHCP, ARP and Layer 2 Attacks
    order: 14
    difficulty: intermediate
    summary: Understand how DHCP and ARP work on a local network, the Layer 2 attacks that abuse them (ARP spoofing, rogue DHCP, DHCP starvation), and the switch features that defend against them.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.4", "cysa:1.1"]
    learning_objectives:
      - Explain how DHCP assigns addresses and how ARP resolves them on a LAN
      - Describe ARP spoofing, rogue DHCP and DHCP starvation attacks
      - Identify switch defences such as DHCP snooping and dynamic ARP inspection
    theory: |
      Many attacks happen not at the perimeter but on the **local network**, at Layer 2, where two protocols that
      assume a trusted LAN become weapons. **DHCP** hands out IP configuration: a client broadcasts a request and
      a DHCP server replies with an address, gateway and DNS servers. **ARP** resolves an IP address to the MAC
      address of the machine that holds it, again by broadcast, and hosts simply cache whatever answer they hear.
      Both were designed for a cooperative local network and have no authentication, which is exactly the weakness
      attackers exploit once they have a foothold on the LAN.

      The classic attacks follow directly. **ARP spoofing** (or poisoning) is an attacker answering ARP requests
      with its own MAC, so victims send traffic meant for the gateway or a peer to the attacker instead, enabling
      a man-in-the-middle position to read or alter traffic. **Rogue DHCP** is an attacker running an
      unauthorised DHCP server that answers faster than the real one, handing victims a malicious gateway or DNS
      so their traffic is steered through the attacker. **DHCP starvation** floods the real server with requests
      to exhaust its address pool, often as a setup for a rogue server to take over. None of these needs to defeat
      encryption; they exploit the trust built into Layer 2, and because they are local and quiet they are easy to
      miss without the right controls.

      The defences live on the **switch**. **DHCP snooping** lets the switch learn which ports are allowed to send
      DHCP server replies (the trusted uplink to the real server) and drop server replies from any other port,
      killing rogue DHCP. **Dynamic ARP inspection** builds on the snooping table to validate ARP messages and
      drop spoofed ones. **Port security** limits how many MAC addresses a port may learn, blunting starvation and
      MAC flooding. For the analyst, the signals of these attacks are duplicate-IP or changed-MAC warnings,
      gateway MAC addresses that suddenly change, and DHCP offers from unexpected sources, so understanding the
      normal Layer 2 behaviour of a segment is what makes an attack on it visible. The broader lesson is that a
      secure network hardens the access layer, not just the edge.
    examples:
      - title: The Layer 2 attacks
        body: |
          ARP spoofing   -> attacker answers ARP with its MAC -> MITM (victims send via attacker)
          rogue DHCP     -> attacker's DHCP answers first -> malicious gateway/DNS
          DHCP starvation-> flood requests, exhaust pool -> sets up rogue takeover
          all exploit unauthenticated, trusting Layer 2.
      - title: Switch defences
        body: |
          DHCP snooping          -> only trusted port may send DHCP server replies -> kills rogue DHCP
          dynamic ARP inspection -> validate ARP against snooping table -> drops spoofed ARP
          port security          -> limit MACs per port -> blunts starvation/flooding.
    exercise:
      title: Analyse and defend a Layer 2 segment
      environment: A described LAN segment with sample symptoms or a packet summary (or a scenario)
      tools: [A scenario or sample ARP/DHCP evidence, a document, a notes file]
      steps:
        - Explain how DHCP assigns configuration and how ARP resolves IP to MAC on a LAN.
        - Describe ARP spoofing and how it puts an attacker in the middle of traffic.
        - Describe rogue DHCP and DHCP starvation and how they work together.
        - Given sample symptoms (changed gateway MAC, DHCP offer from an odd source), identify the likely attack.
        - Recommend the switch defences that stop each attack and say what each one does.
        - State one observable signal an analyst could monitor to catch these attacks early.
      deliverable: A Layer 2 analysis identifying the likely attack from sample symptoms, a mapping of each attack to its switch defence, and one monitoring signal.
    expected_outcome: >
      You can explain DHCP and ARP on a LAN, describe ARP spoofing, rogue DHCP and DHCP starvation, and recommend
      the switch defences (DHCP snooping, dynamic ARP inspection, port security) and signals that counter them.
    quiz:
      - prompt: ARP spoofing lets an attacker intercept traffic because
        options:
          - It breaks TLS encryption
          - Hosts cache whatever ARP reply they hear, so a forged reply redirects traffic to the attacker
          - It requires physical access to the server
          - It only affects wireless
        answer: 1
        explanation: ARP has no authentication; hosts trust forged replies and send traffic to the attacker.
      - prompt: A rogue DHCP server harms victims mainly by
        options:
          - Speeding up their connection
          - Handing them a malicious gateway or DNS so their traffic is steered through the attacker
          - Encrypting their disks
          - Blocking all DHCP
        answer: 1
        explanation: A rogue DHCP server supplies attacker-controlled gateway and DNS settings.
      - prompt: DHCP snooping defends a network by
        options:
          - Encrypting DHCP
          - Allowing DHCP server replies only from trusted ports and dropping them from others
          - Disabling ARP
          - Assigning static IPs only
        answer: 1
        explanation: Snooping permits server replies only from the trusted uplink, stopping rogue DHCP servers.
      - prompt: Dynamic ARP inspection relies on
        options:
          - A longer password
          - The DHCP snooping binding table to validate ARP messages and drop spoofed ones
          - Turning off the switch
          - Encrypting ARP
        answer: 1
        explanation: Dynamic ARP inspection checks ARP against the snooping table and discards forged entries.
  - slug: net-ipv6-security
    title: IPv6 Security for SOC Analysts
    order: 15
    difficulty: intermediate
    summary: Understand how IPv6 differs from IPv4, the security risks of an often-overlooked protocol that is on by default, and how to monitor and control it.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.4", "cysa:1.1"]
    learning_objectives:
      - Explain the key differences between IPv6 and IPv4 that matter for security
      - Identify the risks of IPv6 being enabled but unmonitored
      - Recommend controls to monitor and govern IPv6 on a network
    theory: |
      IPv6 is not a future concern but a present one: it is enabled by default on modern operating systems and is
      often running on networks whose defenders think only in IPv4. That gap is the core security problem. IPv6
      differs from IPv4 in ways that matter: addresses are vastly larger (128-bit), hosts can **autoconfigure**
      addresses without DHCP using router advertisements, there is no NAT in the traditional sense (every host can
      have a globally routable address), and link-local addressing and multicast behave differently. Each of these
      is fine when understood and managed, and a liability when ignored.

      The risks follow from being unmanaged. A network with firewalls and monitoring carefully tuned for IPv4 may
      pass IPv6 traffic unfiltered, giving an attacker a path that the defences never inspect. **Rogue router
      advertisements** are the IPv6 analogue of rogue DHCP: an attacker sends crafted advertisements so victims
      autoconfigure a malicious gateway, enabling man-in-the-middle, and the defence (RA Guard) is often not
      enabled because no one was thinking about IPv6. Tunnelling technologies that carry IPv6 over IPv4 can let
      traffic bypass controls entirely. Attackers also use IPv6 for covert channels and to evade IPv4-only
      detection. The theme is that IPv6 enlarges the attack surface precisely because it is present but
      unwatched.

      The controls are mostly about **parity and visibility**. If IPv6 is not needed, it can be disabled, but a
      cleaner approach is to manage it as deliberately as IPv4: apply equivalent firewall rules to IPv6, ensure
      the SIEM ingests and parses IPv6 addresses and events, enable RA Guard and related Layer 2 protections on
      switches, and include IPv6 in vulnerability scanning and asset inventory. For the analyst, the practical
      lesson is to check whether IPv6 is active and monitored, because an investigation that only looks at IPv4
      can miss half the picture, and to recognise IPv6 addresses and their forms in logs. The broader point is
      that a protocol enabled by default must be governed on purpose, not left as an unexamined default.
    examples:
      - title: What is different in IPv6
        body: |
          128-bit addresses; autoconfiguration via router advertisements (no DHCP needed)
          no traditional NAT (hosts can be globally routable); link-local + multicast behave differently
          on by default on modern OSes.
      - title: The core risk and defence
        body: |
          IPv4-tuned firewalls/monitoring may pass IPv6 UNFILTERED -> an uninspected path
          rogue router advertisement = IPv6 rogue DHCP -> malicious gateway (defence: RA Guard, often off)
          -> achieve parity: equal firewall rules, SIEM parses IPv6, RA Guard on, IPv6 in scans + inventory.
    exercise:
      title: Assess and govern IPv6 on a network
      environment: A described network that has not deliberately managed IPv6 (or a scenario)
      tools: [A scenario or sample config, a document, a notes file]
      steps:
        - Explain two ways IPv6 differs from IPv4 that have security consequences.
        - Describe the risk of IPv6 being enabled but unmonitored on an IPv4-focused network.
        - Explain a rogue router advertisement attack and the RA Guard defence.
        - Decide whether to disable or deliberately manage IPv6 for the described network and justify it.
        - Recommend three parity controls (firewall, SIEM parsing, scanning, inventory) for IPv6.
        - State one thing an analyst should check in logs to confirm IPv6 is visible.
      deliverable: An IPv6 assessment covering the security-relevant differences, the unmonitored risk, the rogue-RA defence, a manage-or-disable decision, and parity controls.
    expected_outcome: >
      You can explain how IPv6 differs from IPv4, the risks of leaving it enabled but unmonitored, and the parity
      controls and defences (RA Guard, equal firewalling, SIEM parsing, scanning) that bring it under governance.
    quiz:
      - prompt: A central IPv6 security risk on many networks is that
        options:
          - IPv6 cannot be attacked
          - It is enabled by default but passes unfiltered and unmonitored on IPv4-tuned defences
          - It encrypts all traffic automatically
          - It has fewer addresses than IPv4
        answer: 1
        explanation: IPv6 is on by default; defences tuned only for IPv4 may ignore it, creating a blind path.
      - prompt: A rogue router advertisement attack is the IPv6 analogue of
        options:
          - Password cracking
          - Rogue DHCP, tricking hosts into autoconfiguring a malicious gateway
          - Disk encryption
          - A denial-of-service flood
        answer: 1
        explanation: Crafted router advertisements make victims adopt an attacker gateway, like rogue DHCP in IPv4.
      - prompt: RA Guard is a switch feature that
        options:
          - Encrypts IPv6 traffic
          - Blocks unauthorised router advertisements to prevent rogue-gateway attacks
          - Assigns IPv4 addresses
          - Disables multicast
        answer: 1
        explanation: RA Guard drops router advertisements from untrusted ports, stopping rogue-RA attacks.
      - prompt: The best general approach to IPv6 if it is present is to
        options:
          - Ignore it
          - Govern it with parity to IPv4 (equal firewalling, SIEM parsing, scanning, inventory) or disable it deliberately
          - Assume the firewall already covers it
          - Only scan it once a year
        answer: 1
        explanation: IPv6 should be managed as deliberately as IPv4, or disabled on purpose, not left unexamined.
  - slug: net-email-authentication
    title: Email Authentication with SPF, DKIM and DMARC
    order: 16
    difficulty: intermediate
    summary: Understand the DNS-based mechanisms that prove an email's sender is legitimate, how SPF, DKIM and DMARC work together to fight spoofing, and how to read their results in headers.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:2.4", "cysa:1.1"]
    learning_objectives:
      - Explain how SPF, DKIM and DMARC each help authenticate email
      - Describe how the three work together to prevent domain spoofing
      - Read authentication results in email headers
    theory: |
      Plain email has no built-in way to prove who sent it, which is why spoofing, forging the From address, is so
      common in phishing. Three DNS-based standards close that gap, and understanding them is essential for both
      defending a domain and investigating suspicious mail. **SPF** (Sender Policy Framework) lets a domain owner
      publish, in DNS, which mail servers are allowed to send on its behalf; a receiving server checks whether the
      message came from a listed server. **DKIM** (DomainKeys Identified Mail) adds a cryptographic signature to
      each message using a private key, which the receiver verifies against a public key in DNS, proving the
      message was not altered and came from a server holding the key. SPF checks the sending path; DKIM checks the
      message's integrity and origin.

      Individually, SPF and DKIM have gaps, which is where **DMARC** (Domain-based Message Authentication,
      Reporting and Conformance) ties them together. DMARC lets the domain owner publish a policy saying what to
      do with mail that fails authentication, and crucially it requires **alignment**: the domain the user
      actually sees in the From address must match the domain that SPF or DKIM validated, which stops an attacker
      from passing SPF for their own throwaway domain while forging someone else's From. The DMARC policy can be
      none (monitor only), quarantine (send to spam), or reject (refuse), and DMARC also provides **reporting** so
      the domain owner learns who is sending mail as their domain, legitimate or not. Together the three let a
      receiver answer: is this really from the domain it claims, and what should I do if not?

      For the analyst, the practical skill is **reading the results** in the message headers, where receiving
      servers record the outcome (an Authentication-Results header showing spf=pass/fail, dkim=pass/fail and
      dmarc=pass/fail). A phishing email spoofing a known brand will typically fail DMARC or show misaligned
      domains, which is strong evidence during triage, while legitimate mail from a well-configured sender passes
      all three aligned. On the defensive side, publishing SPF and DKIM and moving DMARC from monitoring to reject
      is one of the highest-value anti-phishing steps an organisation can take to stop others impersonating its
      domain. The limitation worth remembering is that these prove the *domain*, not that the content is safe, and
      they do not stop look-alike domains or a compromised legitimate account, so they are a powerful layer, not a
      complete defence.
    examples:
      - title: What each one proves
        body: |
          SPF  -> DNS lists which servers may send for the domain (checks the sending path)
          DKIM -> cryptographic signature verified via DNS public key (integrity + origin)
          DMARC-> policy (none/quarantine/reject) + ALIGNMENT (visible From must match what passed) + reporting.
      - title: Reading the headers
        body: |
          Authentication-Results: spf=pass dkim=pass dmarc=pass  -> legitimate, aligned
          brand spoof in phishing -> typically dmarc=fail or misaligned From
          note: proves the DOMAIN, not that content is safe; look-alike domains still get through.
    exercise:
      title: Analyse email authentication and harden a domain
      environment: A described domain plus sample email headers (or a scenario)
      tools: [A scenario or sample email headers, a document, a notes file]
      steps:
        - Explain what SPF, DKIM and DMARC each check.
        - Explain what DMARC alignment adds that SPF and DKIM alone do not.
        - Read a sample Authentication-Results header and state whether the message is trustworthy.
        - Identify a spoofed message by its failed or misaligned authentication and explain the signal.
        - Recommend a DMARC policy progression for a domain and justify moving toward reject.
        - State one thing these mechanisms do not protect against.
      deliverable: An email-authentication analysis reading sample headers, identifying a spoofed message, a DMARC hardening recommendation, and a note on the mechanisms' limits.
    expected_outcome: >
      You can explain SPF, DKIM and DMARC and how alignment ties them together, read authentication results in
      headers to spot spoofing, and recommend a DMARC policy that stops others impersonating a domain.
    quiz:
      - prompt: DKIM proves that an email
        options:
          - Was sent from an allowed server path
          - Carries a valid cryptographic signature, showing it was not altered and came from a key-holding sender
          - Contains no malware
          - Was read by the recipient
        answer: 1
        explanation: DKIM signs the message so the receiver can verify integrity and origin via a DNS public key.
      - prompt: DMARC's alignment requirement is important because it
        options:
          - Encrypts the message body
          - Requires the visible From domain to match what SPF or DKIM validated, stopping spoofing via throwaway domains
          - Deletes spam automatically
          - Replaces SPF and DKIM
        answer: 1
        explanation: Alignment prevents passing authentication for one domain while forging another in the From field.
      - prompt: An analyst triaging a suspected brand-spoofing email should check the headers for
        options:
          - The font used
          - Authentication-Results showing dmarc=fail or misaligned domains
          - The image sizes
          - The subject length
        answer: 1
        explanation: A failed or misaligned DMARC result is strong evidence of domain spoofing.
      - prompt: A limitation of SPF, DKIM and DMARC is that they
        options:
          - Prove the content is safe
          - Prove the sending domain but not that content is safe, and do not stop look-alike domains
          - Block all phishing
          - Encrypt every message
        answer: 1
        explanation: They authenticate the domain, not content, and do not address look-alike domains or account takeover.
  - slug: net-load-balancing-reverse-proxy
    title: Load Balancers and Reverse Proxies
    order: 17
    difficulty: intermediate
    summary: Understand how load balancers and reverse proxies sit in front of services, the security functions they add such as TLS termination and filtering, and what their logs reveal to an analyst.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:3.2", "cysa:1.1"]
    learning_objectives:
      - Explain how load balancers and reverse proxies front services
      - Describe the security functions they provide
      - Interpret their logs and understand how they affect visibility
    theory: |
      Public services are rarely exposed directly; they usually sit behind a **load balancer** or **reverse
      proxy**, and understanding this tier matters because it is both a security control and a place that shapes
      what an analyst sees. A **reverse proxy** receives client requests and forwards them to one or more backend
      servers, presenting a single front door to the outside while hiding the internal topology. A **load
      balancer** does the same while distributing traffic across many backends for scale and availability, with
      health checks that route around failed servers. The two roles overlap heavily in modern appliances and
      cloud services, and the key idea is that this tier is a deliberate **choke point** through which traffic is
      funneled, which is exactly what makes it useful for both performance and security.

      Because everything passes through it, this tier can enforce **security functions** centrally. It commonly
      performs **TLS termination**, decrypting inbound HTTPS so it can inspect, route and re-encrypt, which
      centralises certificate management and enables inspection. It can host a **web application firewall** to
      filter application-layer attacks, apply **rate limiting** and connection controls to blunt abuse and
      denial-of-service, hide backend details that would aid reconnaissance, and add authentication or access
      control in front of applications that lack it. By concentrating these controls at the edge of a service, the
      reverse proxy or load balancer protects backends that may be harder to secure individually and gives one
      consistent place to apply policy.

      For the analyst, this tier is a rich **log source** but also something that changes **visibility** in ways
      worth understanding. Its access logs capture every request with client details, paths and response codes,
      often enriched, making it a prime detection source for web attacks and abuse. But because it sits in the
      middle, it affects what backends see: unless configured to pass the original client address (for example via
      an X-Forwarded-For header), backend logs may show the proxy's address instead of the real client, which can
      mislead an investigation that only looks at the backend. TLS termination also means the proxy, not the
      backend, is where encrypted traffic is visible. The practical lessons are to use the proxy or load-balancer
      logs as a front-line view of what reached a service, to know whether real client addresses are being
      preserved so attribution is correct, and to recognise this tier as a valuable place to add defensive
      controls and a key point to monitor, since it is the funnel through which attacks on the service must pass.
    examples:
      - title: What they do
        body: |
          reverse proxy: single front door, forwards to backends, hides internal topology
          load balancer: distributes across backends for scale + availability, health-checks around failures
          both = a deliberate CHOKE POINT for traffic.
      - title: Security + visibility effects
        body: |
          functions: TLS termination, WAF, rate limiting, hide backends, add auth in front
          visibility: backend may see the PROXY's IP unless X-Forwarded-For passes the real client
          -> proxy/LB logs are a front-line view; confirm client IPs are preserved for correct attribution.
    exercise:
      title: Analyse a service behind a reverse proxy or load balancer
      environment: A described service fronted by a proxy or load balancer, with sample logs (or a scenario)
      tools: [A scenario or sample proxy/LB logs, a document, a notes file]
      steps:
        - Explain the difference and overlap between a reverse proxy and a load balancer.
        - Describe three security functions this tier can provide.
        - Explain why it is a good place to put a web application firewall and rate limiting.
        - Read a sample access log entry and extract the client, path and response.
        - Explain how backend logs can be misleading if the real client address is not preserved.
        - State what TLS termination at the proxy means for where encrypted traffic is visible.
      deliverable: An analysis of a proxied service covering the roles involved, security functions, a read of sample logs, the client-address visibility caveat, and the implication of TLS termination.
    expected_outcome: >
      You can explain how load balancers and reverse proxies front services, the security functions they add, and
      how to read their logs and account for the visibility and attribution effects of this middle tier.
    quiz:
      - prompt: A reverse proxy improves security partly by
        options:
          - Exposing every backend directly to the internet
          - Presenting a single front door that hides internal topology and concentrates controls at the edge
          - Disabling TLS
          - Removing all logging
        answer: 1
        explanation: It funnels traffic through one controlled choke point, hiding backends and centralising policy.
      - prompt: TLS termination at a load balancer or reverse proxy means
        options:
          - Traffic is never encrypted
          - The proxy decrypts inbound HTTPS, so inspection and encrypted-traffic visibility happen there, not at the backend
          - Backends must each manage certificates
          - Encryption is impossible
        answer: 1
        explanation: Terminating TLS at the edge centralises certificates and moves inspection to the proxy.
      - prompt: Backend logs behind a proxy can mislead an investigation when
        options:
          - They are encrypted
          - The real client address is not preserved, so backends log the proxy's address instead
          - They are too detailed
          - The proxy is removed
        answer: 1
        explanation: Without passing the original client IP, backends attribute traffic to the proxy, not the client.
      - prompt: This tier is valuable to an analyst because it
        options:
          - Never sees any traffic
          - Is a choke point whose logs give a front-line view of every request reaching the service
          - Hides all attacks
          - Replaces the SIEM
        answer: 1
        explanation: As the funnel for service traffic, its logs capture every request, a prime detection source.
  - slug: net-dns-security-dnssec
    title: DNS Architecture and Security
    order: 18
    difficulty: intermediate
    summary: Understand how DNS resolution works, why DNS is a critical and trusted dependency, and the security mechanisms (DNSSEC, DoH/DoT, filtering) that protect it and the visibility it gives defenders.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.4", "cysa:1.1"]
    learning_objectives:
      - Explain how DNS resolution works and why it is a trusted dependency
      - Describe DNSSEC, encrypted DNS and DNS filtering
      - Use DNS as a security control and a detection source
    theory: |
      Almost every connection starts with a **DNS** lookup turning a name into an address, which makes DNS both a
      critical dependency and a trusted one that is widely abused. Resolution is hierarchical: a client asks a
      resolver, which, if it does not have the answer cached, walks from the root servers to the authoritative
      server for the domain and returns the address. The design assumes answers are honest, and classic DNS has
      no authentication, so an attacker who can tamper with responses (cache poisoning, on-path spoofing) can
      redirect victims to malicious servers, and attackers also abuse DNS for their own purposes, resolving
      command-and-control domains, tunnelling data in queries, and using fast-changing domains. Understanding the
      resolution path is the basis for both defending DNS and reading it.

      Several mechanisms harden DNS. **DNSSEC** adds cryptographic signatures to DNS records so a resolver can
      verify that an answer genuinely came from the authoritative source and was not altered, addressing the
      integrity gap (though it does not add confidentiality). **Encrypted DNS**, DNS over HTTPS (DoH) and DNS over
      TLS (DoT), encrypts the query between client and resolver so it cannot be read or modified in transit, which
      protects user privacy but, notably, can also **reduce defenders' visibility** if endpoints use external
      encrypted resolvers that bypass the organisation's own DNS, a real trade-off security teams must manage.
      **DNS filtering** uses the resolver as a control point, blocking or sinkholing known-malicious domains so a
      lookup for a bad domain simply fails, which is a cheap and effective layer against malware and phishing.

      For the analyst, DNS is one of the **richest detection sources** precisely because nearly everything uses
      it. DNS logs reveal connections to known-bad or newly registered domains, the beaconing rhythm of
      command-and-control by resolution pattern, data exfiltration via abnormally long or high-volume queries
      (tunnelling), and algorithmically generated domains. Because a lookup usually precedes the actual
      connection, DNS can give early warning. The architectural lessons are to run and control internal DNS so you
      keep that visibility (and to govern the use of external encrypted resolvers that would blind you), to apply
      DNSSEC validation and DNS filtering, and to log and monitor DNS centrally. The recurring theme is that DNS is
      a trusted foundation attackers exploit, so hardening it (DNSSEC, filtering), managing the visibility
      trade-off of encryption, and mining its logs are all high-value, because the one thing almost every attack
      touches is the name lookup that starts its connections.
    examples:
      - title: Resolution and its trust gap
        body: |
          client -> resolver -> (root -> TLD -> authoritative) -> address; cached along the way
          classic DNS has no authentication -> cache poisoning/spoofing can redirect victims
          attackers also abuse DNS: C2 domains, tunnelling, fast-changing/generated domains.
      - title: Hardening and the visibility trade-off
        body: |
          DNSSEC: signs records -> verify integrity/origin (no confidentiality)
          DoH/DoT: encrypt the query -> privacy, BUT external encrypted resolvers can BLIND defenders
          DNS filtering: block/sinkhole bad domains at the resolver; DNS logs are a rich early detection source.
    exercise:
      title: Secure DNS and use it for detection
      environment: A described network with its DNS setup and sample DNS logs (or a scenario)
      tools: [A scenario or sample DNS logs, a document, a notes file]
      steps:
        - Explain how DNS resolution works and why classic DNS answers are trusted but unauthenticated.
        - Explain what DNSSEC adds and what it does not (integrity, not confidentiality).
        - Explain how encrypted DNS (DoH/DoT) helps privacy but can reduce defender visibility.
        - Describe how DNS filtering acts as a control point against malware and phishing.
        - Identify a suspicious pattern in sample DNS logs (new domain, long queries, beaconing).
        - Recommend how to keep DNS visibility while managing external encrypted resolvers.
      deliverable: A DNS security plan covering the resolution trust gap, DNSSEC, the encrypted-DNS visibility trade-off, filtering, and a detection finding from sample logs.
    expected_outcome: >
      You can explain DNS resolution and its trust gap, describe DNSSEC, encrypted DNS and filtering, manage the
      visibility trade-off of encrypted resolvers, and use DNS logs as an early, high-value detection source.
    quiz:
      - prompt: Classic DNS is abusable for redirection because
        options:
          - It encrypts everything
          - It has no authentication, so tampered or spoofed answers can redirect victims
          - It never caches
          - It cannot resolve names
        answer: 1
        explanation: Without authentication, poisoned or spoofed responses can send victims to malicious servers.
      - prompt: DNSSEC provides
        options:
          - Confidentiality of queries
          - Cryptographic verification that answers are authentic and unaltered (integrity and origin)
          - Faster resolution
          - DNS filtering
        answer: 1
        explanation: DNSSEC signs records for integrity and origin; it does not encrypt the query.
      - prompt: A security trade-off of DNS over HTTPS (DoH) is that it
        options:
          - Always improves defender visibility
          - Can reduce defender visibility if endpoints use external encrypted resolvers that bypass organisational DNS
          - Disables DNS entirely
          - Removes the need for filtering
        answer: 1
        explanation: Encrypted external resolvers can bypass organisational DNS, blinding monitoring.
      - prompt: DNS logs are a valuable detection source because
        options:
          - Almost nothing uses DNS
          - Nearly every connection begins with a lookup, so DNS reveals bad domains, beaconing and tunnelling, often early
          - They contain no useful data
          - They cannot be collected
        answer: 1
        explanation: Since lookups precede connections, DNS logs expose malicious infrastructure and patterns early.
  - slug: net-device-infrastructure-security
    title: Network Device and Infrastructure Security
    order: 19
    difficulty: intermediate
    summary: Learn why routers, switches and other network infrastructure are high-value targets, how to harden their management, and why their logs and configurations matter to a SOC.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.5", "cysa:1.1"]
    learning_objectives:
      - Explain why network infrastructure devices are high-value targets
      - Harden the management of routers, switches and similar devices
      - Use device configuration and logs as a security source
    theory: |
      The routers, switches, firewalls and other devices that move traffic are the **infrastructure** of a network,
      and because they sit in the path of everything, compromising one gives an attacker enormous power, to
      reroute, intercept, or block traffic, to pivot deeper, and to hide. Yet these devices are often less well
      secured than servers: they may run outdated firmware, use default or weak credentials, expose management
      interfaces, and be monitored far less than endpoints. Nation-state and sophisticated attackers specifically
      target network devices precisely because they are powerful, persistent (firmware implants survive reboots
      and reinstalls of other systems), and poorly watched, so a SOC must treat infrastructure as part of its
      protected and monitored estate, not as plumbing that takes care of itself.

      **Hardening** network devices follows familiar principles applied to their specifics. Protect the
      **management plane**: restrict management access to a dedicated, isolated network, use strong unique
      credentials and centralised authentication, disable unused services and default accounts, and never expose
      management interfaces to the internet. Keep firmware patched, because device vulnerabilities are exploited
      like any other. Use secure management protocols (SSH not Telnet, SNMPv3 not older SNMP with default
      community strings) so management traffic is not sniffable or trivially forged. Protect the **control plane**
      (routing protocols) with authentication so an attacker cannot inject false routes. Back up configurations and
      monitor them for unauthorised change. These steps reduce the chance that a device is taken over and limit
      what an attacker can do if one is.

      For the analyst, network devices are also a **visibility source** that is easy to overlook. Their logs record
      configuration changes, logins to the management plane (a change or login nobody authorised is a strong
      signal), interface and routing changes, and access-control-list hits, and their flow data (covered earlier)
      is a core detection source. Monitoring device configurations for drift catches both attacker tampering and
      risky mistakes. The recurring themes are that infrastructure devices are powerful, persistent and
      under-watched targets, so they deserve real hardening (especially of the management and control planes,
      secure protocols and patching), configuration backup and change monitoring, and inclusion in SOC visibility,
      because an attacker who owns the network's own devices owns the network itself, and the logs and
      configurations of those devices are both something to protect and a place to detect.
    examples:
      - title: Why infrastructure is a prime target
        body: |
          devices sit in the path of EVERYTHING -> reroute/intercept/block, pivot, hide; firmware implants survive reinstalls
          often weak: old firmware, default/weak creds, exposed management, barely monitored
          -> sophisticated attackers target them precisely because they are powerful, persistent and under-watched.
      - title: Hardening the planes
        body: |
          management plane: isolated mgmt network, strong central auth, disable defaults, NEVER expose to internet
          secure protocols: SSH not Telnet, SNMPv3 not old SNMP; patch firmware
          control plane: authenticate routing protocols; back up configs + monitor for change (logins/config changes = signals).
    exercise:
      title: Harden and monitor network infrastructure
      environment: A described network with its devices and sample device logs (or a scenario)
      tools: [A scenario or sample device configs and logs, a document, a notes file]
      steps:
        - Explain why a compromised router or switch is so damaging and why devices are often under-secured.
        - Describe how you would protect the management plane of the devices.
        - Explain which secure protocols replace which insecure ones and why.
        - Explain how control-plane (routing) protection prevents route injection.
        - Identify a suspicious event in sample device logs (unauthorised login or config change).
        - Explain how configuration backup and drift monitoring help security.
      deliverable: An infrastructure-security plan covering why devices are targets, management- and control-plane hardening, secure protocols, and using device logs and configuration monitoring for detection.
    expected_outcome: >
      You can explain why network infrastructure is a high-value, persistent target, harden the management and
      control planes with secure protocols and patching, and use device configurations and logs as a SOC source.
    quiz:
      - prompt: Network infrastructure devices are high-value targets mainly because
        options:
          - They are never connected to anything
          - They sit in the traffic path and, if compromised, allow interception, rerouting, persistence and pivoting
          - They contain no useful access
          - They cannot run firmware
        answer: 1
        explanation: Controlling a device in the traffic path gives an attacker broad, persistent power over the network.
      - prompt: A key management-plane hardening step is to
        options:
          - Expose management interfaces to the internet
          - Restrict management access to an isolated network with strong central authentication and no default accounts
          - Use Telnet everywhere
          - Share one password across devices
        answer: 1
        explanation: Isolating and strongly authenticating management access protects the most sensitive control point.
      - prompt: Which replacement improves management security?
        options:
          - Replacing SSH with Telnet
          - Using SSH instead of Telnet and SNMPv3 instead of older SNMP with default community strings
          - Removing all authentication
          - Disabling logging
        answer: 1
        explanation: Secure protocols prevent management traffic from being sniffed or trivially forged.
      - prompt: For a SOC, network device logs are valuable because they record
        options:
          - Nothing useful
          - Management logins, configuration and routing changes and ACL hits, where unauthorised change is a strong signal
          - Only device temperature
          - Only marketing data
        answer: 1
        explanation: Device logs reveal tampering and unauthorised access to critical infrastructure.
  - slug: net-routing-security
    title: Routing and BGP Security
    order: 20
    difficulty: advanced
    summary: Understand how routing decides the path traffic takes, why routing protocols such as BGP were built on trust, and how routing attacks like BGP hijacking and route leaks threaten availability and confidentiality.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:1.4", "cysa:1.1"]
    learning_objectives:
      - Explain how routing directs traffic and why it is trust-based
      - Describe routing attacks like BGP hijacking and route leaks
      - Describe the controls that make routing more secure
    theory: |
      **Routing** is how networks decide the path a packet takes from source to destination, and on the internet
      the protocol that glues the independent networks together is **BGP** (Border Gateway Protocol), which lets
      networks (autonomous systems) advertise to each other which address ranges they can reach. The critical fact
      is that BGP was designed on **trust**: historically a network simply announced the routes it claimed to serve,
      and other networks believed it, with little built-in verification. That trust model works when everyone is
      honest and careful, but it means a network that announces routes it should not, whether maliciously or by
      mistake, can attract or disrupt traffic that was never meant for it, which is the root of routing security
      problems.

      The resulting attacks and incidents are serious. **BGP hijacking** is when a network announces address ranges
      it does not own, causing other networks to send that traffic to the attacker, who can then black-hole it
      (denial of service), intercept and inspect it (confidentiality), or man-in-the-middle it, high-profile
      incidents have redirected large volumes of internet traffic this way. **Route leaks** are the often-accidental
      propagation of routes that should not have been shared, which can overload or misdirect traffic and cause
      outages. Because routing operates between organisations and across the global internet, the impact of these
      events can be wide-reaching and hard for any single victim to prevent, and they can be difficult to
      distinguish from legitimate routing changes, making detection a challenge. Within an organisation, internal
      routing protocols face analogous risks if an attacker can inject false routes to reroute or intercept
      internal traffic.

      The **controls** add verification and hygiene to a trust-based system. **RPKI** (Resource Public Key
      Infrastructure) lets networks cryptographically certify which autonomous system is authorised to announce
      which address ranges, so others can reject invalid announcements, directly countering hijacks. **Route
      filtering** and prefix limits let networks reject announcements that do not make sense (for example a peer
      suddenly claiming routes it should not), and industry norms (such as MANRS) promote these good practices.
      **Authenticating internal routing** protocols prevents route injection inside an organisation. Monitoring
      routing, watching for unexpected changes to how your prefixes are announced and reached, provides detection,
      and some organisations subscribe to services that alert on hijacks of their address space. For the analyst,
      the lessons are that routing, especially BGP, underpins connectivity and was built on trust rather than
      verification, that routing attacks like hijacking and route leaks can redirect, intercept or disrupt traffic
      at large scale, and that the defences, RPKI, route filtering, authenticated internal routing and routing
      monitoring, add the verification and vigilance that a trust-based system needs, which matters because when
      routing is subverted, traffic goes where the attacker wants regardless of how well the endpoints are secured.
    examples:
      - title: Why routing is trust-based
        body: |
          BGP lets networks (autonomous systems) announce which address ranges they can reach -> others historically just BELIEVE it
          little built-in verification -> a false announcement (malicious or mistaken) attracts or disrupts traffic
          that is the root of routing security problems.
      - title: Attacks and controls
        body: |
          BGP hijack: announce ranges you don't own -> black-hole (DoS), intercept, or MITM traffic; route leak: accidental bad propagation -> outages
          RPKI: cryptographically certify who may announce what -> reject invalid announcements; route filtering/prefix limits; authenticate internal routing; monitor your prefixes.
    exercise:
      title: Assess and defend routing security
      environment: A described network and its internet routing (or a scenario with sample routing events)
      tools: [A scenario or sample routing changes, a document, a notes file]
      steps:
        - Explain how BGP lets networks advertise reachability and why it is trust-based.
        - Describe BGP hijacking and the three things an attacker can do with redirected traffic.
        - Explain what a route leak is and why it is often accidental.
        - Explain how RPKI counters hijacking.
        - Describe route filtering and authenticated internal routing as controls.
        - Explain how monitoring your own prefixes provides detection.
      deliverable: A routing-security plan covering the trust model, hijacking and route leaks, and the controls (RPKI, route filtering, authenticated internal routing, monitoring).
    expected_outcome: >
      You can explain how routing and BGP direct traffic on a trust model, describe hijacking and route leaks, and
      describe the controls (RPKI, filtering, authentication, monitoring) that add verification to routing.
    quiz:
      - prompt: BGP routing security problems stem from the fact that BGP was
        options:
          - Designed with full cryptographic verification from the start
          - Built on trust, so networks historically believed each other's route announcements with little verification
          - Never used on the internet
          - Immune to misconfiguration
        answer: 1
        explanation: BGP's trust model means a false announcement can attract or disrupt traffic, the root of hijacks and leaks.
      - prompt: In a BGP hijack, an attacker who announces address ranges it does not own can
        options:
          - Only improve performance
          - Black-hole, intercept, or man-in-the-middle the redirected traffic
          - Nothing at all
          - Only send email
        answer: 1
        explanation: Redirected traffic can be dropped (DoS), inspected, or man-in-the-middled.
      - prompt: RPKI improves routing security by
        options:
          - Encrypting all packets
          - Cryptographically certifying which autonomous system may announce which address ranges, so invalid announcements can be rejected
          - Disabling routing
          - Removing all filtering
        answer: 1
        explanation: RPKI lets networks validate route origin and reject unauthorised announcements.
      - prompt: Subverted routing is dangerous even when endpoints are well secured because
        options:
          - Endpoints control routing
          - Traffic goes where the attacker directs it regardless of endpoint security
          - Routing has no effect on traffic
          - It only affects wireless
        answer: 1
        explanation: If routing is hijacked, traffic is redirected before endpoint protections are relevant.
