slug: incident-response
title: Incident Response
domain: Incident Response
order: 8
description: >
  When an alert turns out to be real, the SOC runs incident response. Learn the
  lifecycle and practise triaging and documenting a phishing incident.
lessons:
  - slug: ir-phishing-triage
    title: The Incident Response Lifecycle and Phishing Triage
    order: 1
    difficulty: beginner
    summary: Apply the NIST lifecycle to a phishing alert, from analysis to a written report.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.8", "cysa:3.2", "cysa:3.3", "cysa:4.2", "sc200:3"]
    learning_objectives:
      - Describe the phases of the NIST incident response lifecycle
      - Analyse a suspicious email's headers, links and attachments safely
      - Decide on containment actions and write an incident report
    theory: |
      NIST SP 800-61 describes four phases: **Preparation**; **Detection and Analysis**;
      **Containment, Eradication and Recovery**; and **Post-Incident Activity** (lessons
      learned). CompTIA lists them in more steps (preparation, detection, analysis,
      containment, eradication, recovery, lessons learned), but the flow is the same.

      Phishing is the most common incident a junior analyst handles. Triage questions:
      Is the sender who they claim to be? Check the **Return-Path**, **Received** chain and
      **SPF/DKIM/DMARC** results in the headers. Where do links really go? Expand them without
      clicking, and check reputation. What is the attachment? Hash it and check, or detonate it
      in a sandbox. Who else received it, and did anyone click?

      **Containment** for phishing usually means purging the email from all mailboxes,
      blocking the sender and URLs, and resetting credentials for anyone who entered them.
      Everything is recorded with timestamps; a clear **incident report** (summary, timeline,
      impact, actions, recommendations) is a deliverable employers look for.
    examples:
      - title: Header red flags
        body: |
          From: "IT Support" <support@yourcompany.com>
          Return-Path: <bounce@mail-yourcompany-support.xyz>
          Authentication-Results: spf=fail; dkim=none; dmarc=fail
          The display name and From look internal, but the infrastructure is not.
      - title: Incident report skeleton
        body: |
          Summary | Timeline (UTC) | Affected users and systems | Indicators |
          Actions taken | Root cause | Recommendations
    exercise:
      title: Triage a phishing email end to end
      environment: Your computer; a sample phishing .eml from a public phishing-analysis training set
      tools: [Text editor, MXToolbox header analyzer, URLScan.io, VirusTotal (hash search)]
      steps:
        - Download a sample phishing email (.eml) from a public phishing-analysis training repository; do not open attachments.
        - Open the .eml in a text editor and record From, Return-Path, Reply-To, Subject and the Received chain.
        - Paste the headers into MXToolbox's header analyzer and record the SPF, DKIM and DMARC results.
        - Extract every URL, defang them (hxxp, [.]) and submit them to URLScan.io; note the final landing page.
        - If there is an attachment, extract it inside a VM, hash it and search the hash on VirusTotal.
        - Decide verdict (malicious, suspicious, benign) and list the containment actions you would take.
        - Write an incident report using the skeleton from the examples, mapping each step to its NIST phase.
      deliverable: A one-page phishing incident report with IOCs, verdict and containment actions.
    expected_outcome: >
      You can take a reported email from first look to a defensible verdict and a report a
      SOC lead would accept.
    quiz:
      - prompt: Which NIST phase includes purging malicious emails and blocking URLs?
        options:
          - Preparation
          - Detection and Analysis
          - Containment, Eradication and Recovery
          - Post-Incident Activity
        answer: 2
        explanation: Removing the threat and limiting spread is containment and eradication.
      - prompt: An email shows `spf=fail` and `dmarc=fail`. This suggests
        options:
          - The email was encrypted
          - The sending server was not authorised to send for that domain
          - The recipient's mailbox is full
          - The attachment is safe
        answer: 1
        explanation: SPF and DMARC failures mean the message did not come from the domain's authorised infrastructure.
      - prompt: Why defang URLs (hxxp, [.]) in reports?
        options:
          - To make them shorter
          - To prevent accidental clicks and auto-linking
          - It is required by SMTP
          - To hide them from the SIEM
        answer: 1
        explanation: Defanged indicators cannot be clicked by mistake.
      - prompt: What is the main output of the post-incident phase?
        options: [A new firewall, Lessons learned and improvements, Deleted logs, A password reset]
        answer: 1
        explanation: Post-incident activity captures lessons learned to improve preparation.

  - slug: ir-containment-recovery
    title: Containment, Recovery and Post-Incident Review
    order: 2
    difficulty: intermediate
    summary: Take a confirmed incident through containment, eradication and recovery, then run a lessons-learned review and build a reusable playbook.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "cysa:3.2", "cysa:3.3", "cysa:3.1"]
    learning_objectives:
      - Choose a containment strategy that preserves evidence
      - Walk an incident through eradication, recovery and verification
      - Run a post-incident review and capture it as a reusable playbook
    theory: |
      The phishing lesson covered detection, analysis and reporting; this lesson
      covers what happens once an incident is confirmed. The **NIST** lifecycle moves
      from analysis into **containment, eradication and recovery**, then
      **post-incident activity**. **Containment** stops the spread, and the strategy
      is a trade-off. **Short-term** containment is immediate (isolate a host from the
      network, disable an account) while **long-term** containment keeps the business
      running while a permanent fix is prepared. A key rule is to **preserve evidence**
      while containing. Pulling the power cord destroys memory-resident artefacts, so
      analysts prefer network isolation and a memory capture before reimaging.

      **Eradication** removes the adversary's foothold: deleting malware and the
      persistence it created, resetting compromised credentials, and closing the
      initial access vector. **Recovery** returns systems to production from a known
      good state, restoring from clean backups and monitoring closely for the attacker
      returning. Nothing is called recovered until it is **verified**, because
      reinfection from a missed persistence mechanism is common. The whole response
      is framed by an attack model such as **MITRE ATT&CK** or the **Cyber Kill Chain**,
      which helps responders anticipate the adversary's next step.

      The phase teams most often skip is **post-incident activity**. A **lessons-learned**
      review, held soon after closure, asks what happened, how well the response went,
      and what to change, producing concrete actions with owners. Recurring responses
      are captured as **playbooks** and **runbooks** so the next analyst does not start
      from scratch, and **metrics** such as dwell time and time-to-contain show whether
      the SOC is improving. **Preparation**, the first NIST phase, is really the output
      of this one: better tooling, access and playbooks ready before the next incident.
    examples:
      - title: Containment that preserves evidence
        body: |
          Compromised laptop detected.
          Wrong:  power it off      -> loses memory, running processes, network state
          Right:  isolate at the network (keep it powered), capture memory and disk,
                  disable the user's sessions, then reimage from a clean build
      - title: A lessons-learned action table
        body: |
          Finding                         Action                          Owner     Due
          MFA was not enforced on VPN     Enforce MFA for all remote acc. IT        2 weeks
          Alert sat 6h before triage      Add after-hours on-call rota    SOC lead  1 month
          No playbook for this malware    Write and test a playbook       Analyst   2 weeks
    exercise:
      title: Run an incident through containment to a lessons-learned playbook
      environment: A written incident scenario (use your phishing-triage result or a sample compromise) and a document or wiki for the playbook
      tools: [A document editor, the MITRE ATT&CK website, your IR notes]
      steps:
        - Take a confirmed incident (a compromised workstation and account) and map the attacker's steps so far to MITRE ATT&CK or the Cyber Kill Chain.
        - Decide a containment strategy that preserves evidence, writing the exact order of actions (isolate, capture, disable) and why power-off is avoided.
        - List the eradication steps needed to remove the foothold, including persistence removal and credential resets, and the initial vector you would close.
        - Write the recovery steps and, crucially, how you would verify the system is clean before and after returning it to production.
        - Hold a short lessons-learned review (on paper) and produce an action table with at least three findings, each with an owner and a due date.
        - Capture the whole response as a reusable playbook: trigger, roles, step-by-step actions, and the decision points where an analyst must escalate.
        - State two metrics you would track (for example time-to-contain and dwell time) and how preparation for the next incident improves because of this one.
      deliverable: The ATT&CK mapping, the ordered containment/eradication/recovery steps with verification, the lessons-learned action table, and the reusable playbook.
    expected_outcome: >
      You can take a confirmed incident through evidence-preserving containment,
      eradication and verified recovery, then turn the response into a lessons-learned
      review and a playbook that makes the next response faster.
    quiz:
      - prompt: Why do responders prefer network isolation over powering a compromised host off?
        options:
          - It is faster to type
          - Powering off destroys memory-resident evidence and running state
          - It uses less electricity
          - It automatically removes malware
        answer: 1
        explanation: Network isolation contains the host while preserving volatile evidence that a shutdown would lose.
      - prompt: Eradication in the incident lifecycle means
        options:
          - Writing the final report
          - Removing the adversary's foothold, including malware, persistence and the initial vector
          - Restoring from backup
          - Notifying customers
        answer: 1
        explanation: Eradication removes the attacker's presence so recovery does not simply restore a compromised state.
      - prompt: A system should not be called recovered until it is
        options: [Rebooted, Verified clean and monitored for the attacker's return, Renamed, Re-IP'd]
        answer: 1
        explanation: Missed persistence often causes reinfection, so verification and monitoring are required before closure.
      - prompt: The main purpose of a lessons-learned review is to
        options:
          - Assign blame
          - Produce concrete improvement actions with owners so the next response is better
          - Close the ticket faster
          - Satisfy the firewall policy
        answer: 1
        explanation: It is a blameless review that turns the incident into owned, actionable improvements.
      - prompt: A playbook helps a SOC because it
        options:
          - Replaces the analyst
          - Captures a repeatable response so the next analyst does not start from scratch
          - Deletes old alerts
          - Guarantees no incidents
        answer: 1
        explanation: Playbooks encode proven steps for a scenario, making response consistent and faster.
  - slug: ir-forensics-evidence
    title: Digital Forensics and Evidence Handling
    order: 3
    difficulty: intermediate
    summary: Acquire and preserve evidence from a compromised host in the right order, keep an unbroken chain of custody, and build a defensible timeline of what happened.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "cysa:3.2", "cysa:4.2"]
    learning_objectives:
      - Acquire volatile and non-volatile evidence in the correct order
      - Preserve integrity with hashing and an unbroken chain of custody
      - Reconstruct a timeline from host artefacts to answer what happened
    theory: |
      When an incident may lead to discipline, legal action or a regulator, how you
      handle evidence matters as much as what you find. The guiding rule is the
      **order of volatility**: capture the most fleeting data first. Memory (RAM),
      running processes and network connections vanish on shutdown, so they come
      before the disk, which in turn comes before backups and archived logs. This is
      exactly why the containment lesson said to isolate a host at the network rather
      than pull its power.

      Integrity is proved, not assumed. An analyst takes a **forensic image** (a
      bit-for-bit copy) and records a cryptographic **hash** (such as SHA-256) of the
      original and the copy; matching hashes show the copy is faithful and that
      nothing changed later. All work is done on the copy, never the original, often
      through a **write blocker** so the acquisition itself cannot alter the source.
      Every transfer is logged in a **chain of custody** that records who held the
      evidence, when, and why, from seizure to storage. A gap in that chain can make
      the evidence worthless.

      The payoff is a **timeline**. Hosts are full of timestamped artefacts, including
      event logs, file **MAC times** (modified, accessed, created), browser and command
      history, prefetch and scheduled tasks. Correlating them reconstructs the sequence
      from initial access to actions on objectives, and anchors each claim to a source.
      Analysts stay alert to **anti-forensics** such as cleared logs or timestomped
      files, where the absence or inconsistency of an artefact is itself a finding.
    examples:
      - title: Collect in order of volatility
        body: |
          First  -> memory, running processes, open network connections, logged-in users
          Then   -> the disk image (bit-for-bit copy, through a write blocker)
          Last   -> backups and archived/central logs
          Rationale: volatile data is gone the moment the host powers down.
      - title: Hashing proves the image is faithful
        body: |
          sha256(original_disk)  = 3b1f...e9a2
          sha256(working_copy)   = 3b1f...e9a2   -> identical, copy is sound
          Analysis runs on the copy; the original is sealed and logged.
    exercise:
      title: Acquire evidence and build a timeline for a scenario
      environment: A practice host or a provided disk/memory sample (a disposable VM you can snapshot, or sample artefacts) and a document for notes
      tools: [A hashing utility such as sha256sum, a timeline or spreadsheet tool, your incident notes]
      steps:
        - Write the acquisition order you would follow for a live compromised host, from most to least volatile, and justify the first and last items.
        - On a practice file or disk image, generate a SHA-256 hash and record it, then copy the file and hash the copy to show the two match.
        - Draft a chain-of-custody record with fields for item, who collected it, date and time, and each subsequent handoff.
        - Collect at least four timestamped artefacts from the scenario (for example event-log entries, file MAC times, command history, scheduled tasks).
        - Correlate them into a single ordered timeline, with each entry citing the artefact it came from.
        - Identify one point where an attacker could use anti-forensics and say how you would detect the tampering.
        - Write a short factual summary of what the timeline shows, separating what the evidence proves from what you infer.
      deliverable: The acquisition-order note, a matching original/copy hash pair, a chain-of-custody record, and a sourced timeline with a short factual summary.
    expected_outcome: >
      You can acquire evidence in order of volatility, prove its integrity with hashing
      and an unbroken chain of custody, and reconstruct a sourced timeline that stands
      up to scrutiny, while staying alert to anti-forensic tampering.
    quiz:
      - prompt: Following the order of volatility, which should you capture first?
        options:
          - An archived log from the central SIEM
          - The contents of RAM and running network connections
          - A full disk image
          - A nightly backup
        answer: 1
        explanation: Memory and live network state are the most volatile and are lost on shutdown, so they are collected before disk and backups.
      - prompt: Why does an analyst hash the original evidence and the working copy?
        options:
          - To compress them
          - To prove the copy is a faithful, unaltered duplicate of the original
          - To encrypt the evidence
          - To speed up analysis
        answer: 1
        explanation: Matching cryptographic hashes demonstrate the copy is identical to the source and that nothing changed afterwards.
      - prompt: A broken chain of custody is a problem because
        options:
          - It makes the image larger
          - It can render the evidence inadmissible or unreliable
          - It deletes the timeline
          - It changes the CVSS score
        answer: 1
        explanation: Unaccounted gaps in who held evidence and when undermine its integrity and its value in any proceeding.
      - prompt: Cleared logs or timestomped files are examples of
        options: [Normal maintenance, Anti-forensics that are themselves findings, Backups, Patch management]
        answer: 1
        explanation: Deliberate tampering to hinder investigation is anti-forensics, and its traces or inconsistencies are evidence in their own right.
  - slug: ir-severity-communication
    title: Incident Severity, Communication and Reporting
    order: 4
    difficulty: intermediate
    summary: Classify an incident's severity consistently, keep the right people informed at the right cadence, and write a report that stands up after the fact.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "cysa:3.3", "cysa:4.2"]
    learning_objectives:
      - Classify incident severity with a consistent, documented matrix
      - Communicate to technical and non-technical audiences at the right cadence
      - Write an incident report that is accurate, sourced and useful later
    theory: |
      Technical response is only half of incident handling; the other half is deciding
      how serious it is and telling the right people. A **severity matrix** makes the
      first call consistent, rating an incident on **impact** (data loss, systems down,
      safety, regulatory exposure) and **scope** (one host or the whole fleet) to produce
      a level such as SEV-1 to SEV-4. The level is not academic: it drives who is woken,
      how fast, and whether to invoke a major-incident process. A documented matrix stops
      severity being argued from scratch under pressure and keeps two analysts from rating
      the same event differently.

      **Communication** is tailored to the audience. Responders need precise technical
      detail; leadership needs impact, risk and what is being done, in plain language
      without jargon; legal, compliance and PR may need to know because of **notification
      obligations** (tying back to the privacy and compliance lessons). The discipline is
      a **cadence**: regular updates even when the update is "no change", a single source
      of truth, and care not to speculate on cause before it is known. Stating an
      unconfirmed attacker or blaming a team early is how an incident's story goes wrong.
      Who speaks externally is decided in advance, not mid-crisis.

      Afterwards comes the **report**. A good incident report is factual and **sourced**,
      separating what the evidence proves from what is inferred, and typically covers the
      timeline, impact, root cause, the response taken and the follow-up actions with
      owners. It serves several readers at once: the team learning from it, leadership
      accounting for it, and sometimes an auditor or regulator. It links to the
      lessons-learned review rather than repeating it, and it avoids blame, because a
      report that punishes honesty kills the next incident's information flow.
    examples:
      - title: A severity matrix makes the call repeatable
        body: |
          Impact \ Scope   one host         many hosts / critical system
          data at risk     SEV-3            SEV-1
          nuisance only    SEV-4            SEV-2
          The level sets who is paged, how fast, and whether it is a major incident.
      - title: Same incident, two audiences
        body: |
          To responders:  "LSASS access on HOST-7 by svc-x; isolating, capturing memory"
          To leadership:  "One laptop isolated as a precaution, no customer data affected
                           so far, next update in 1 hour"
    exercise:
      title: Classify, communicate and report on an incident scenario
      environment: An incident scenario (reuse an earlier one or invent a compromise) and a document for the matrix, updates and report
      tools: [A document editor, your incident notes, a reference on breach-notification basics]
      steps:
        - Build a simple severity matrix with at least three levels, defined by impact and scope, and write what each level triggers (who is informed, how fast).
        - Apply the matrix to your scenario and justify the severity level you assign.
        - Write a technical update for responders and a separate plain-language update for leadership about the same point in the incident.
        - State which non-technical stakeholders (legal, compliance, PR) would need to know and why, including any notification obligation.
        - Define an update cadence for the incident and write one "no material change" update that still reassures without speculating on cause.
        - Write a short incident report with timeline, impact, root cause, response and follow-up actions with owners, marking what is proven versus inferred.
        - Note one thing you deliberately did not say publicly and why (for example, unconfirmed attribution).
      deliverable: The severity matrix with triggers, a justified severity rating, audience-tailored updates, a cadence with one update, and a sourced incident report.
    expected_outcome: >
      You can rate an incident's severity consistently, communicate to technical and
      non-technical audiences at the right cadence without speculating, and write an
      accurate, sourced report that serves the team, leadership and any auditor later.
    quiz:
      - prompt: What is the main purpose of a severity matrix?
        options:
          - To assign blame for the incident
          - To rate impact and scope consistently so the level drives the right response
          - To replace the incident report
          - To count alerts
        answer: 1
        explanation: A documented matrix makes severity repeatable and ties the level to who is informed and how fast, instead of arguing it under pressure.
      - prompt: A good leadership update during an incident
        options:
          - Uses as much technical jargon as possible
          - States impact, risk and action in plain language without speculating on cause
          - Names the suspected attacker immediately
          - Is sent only once at the end
        answer: 1
        explanation: Leadership needs clear impact and status; speculating on cause or attribution early is how an incident's story goes wrong.
      - prompt: Why keep a regular update cadence even when there is no change?
        options:
          - To fill the log
          - To maintain a single source of truth and reassure stakeholders without rumour filling the gap
          - To increase MTTR
          - Because the matrix requires it
        answer: 1
        explanation: Regular updates, even "no change", keep everyone aligned and stop speculation from taking over.
      - prompt: An incident report should
        options: [Blame the analyst who missed it, Separate what the evidence proves from what is inferred and avoid blame, Omit the timeline, Speculate freely on cause]
        answer: 1
        explanation: A factual, sourced, blame-free report serves learning and accountability and keeps information flowing for the next incident.

  - slug: ir-ransomware-response
    title: Responding to a Ransomware Incident
    order: 5
    difficulty: intermediate
    summary: Work a ransomware incident from detection through isolation to recovery.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "cysa:3.2", "cysa:3.3"]
    learning_objectives:
      - Recognise the early signs of ransomware before full encryption
      - Apply the response steps of scope, isolate, preserve, eradicate and recover in order
      - Explain why paying is a last resort and how good backups change the decision
    theory: |
      Ransomware encrypts an organisation's files and demands payment for the key, and modern
      variants also **steal data first** so the attacker can threaten to leak it. The incident
      usually does not start with encryption; it starts with the intrusion days earlier. Early
      signs a SOC can catch include mass file renames, bursts of file writes, **shadow copies being
      deleted**, security tools disabled, and new admin accounts. Catching it in that window is the
      difference between one host and the whole estate.

      The response follows the incident-response lifecycle under pressure. **Scope** which hosts and
      accounts are affected before touching anything. **Isolate** the affected machines from the
      network to stop the spread, preferring containment that keeps the host powered on. **Preserve**
      evidence, memory, logs and a sample of the ransom note and an encrypted file, because it aids
      attribution and any decryptor. **Eradicate** the attacker's access, then **recover** from
      known-good backups onto clean systems.

      The payment question is where governance meets the technical work. Paying funds crime, carries
      no guarantee the data returns, and may breach sanctions, so it is a **last resort** and a
      business and legal decision, not the SOC's. Tested, offline, immutable backups are what make a
      confident refusal realistic, which is why ransomware readiness is really backup readiness. The
      incident ends with recovery verified and a post-incident review that fixes the original way in.
    examples:
      - title: Early signs before full encryption
        body: |
          vssadmin delete shadows /all         shadow copies being destroyed
          Defender real-time protection = off  security tooling disabled
          200 files renamed to .locked in 60s  mass rename burst
          Any one of these in isolation is a reason to investigate now, not after encryption.
      - title: Why backups decide the payment question
        body: |
          Backups   offline, immutable, restore tested last month
          Outcome   recover to clean systems without paying
          An untested or online-only backup often leaves payment as the only option, so test restores.
    exercise:
      title: Work a ransomware scenario on paper
      environment: A tabletop or notes file with a sample ransomware scenario and host inventory
      tools: [A scenario brief, a host and backup inventory, a notes file]
      steps:
        - From the scenario, list the early indicators and the time you would have first been able to act.
        - Scope the incident, naming the affected hosts and accounts and how you confirmed each.
        - Write the isolation steps, keeping affected hosts powered on where you can, and say what you isolate first.
        - List the evidence you would preserve before eradication and why each item matters.
        - Plan recovery from the backup inventory, noting which backups you trust and whether a restore was ever tested.
        - State the payment recommendation and who actually makes that decision.
        - Name the one root-cause fix a post-incident review should require so it does not recur.
      deliverable: A one-page ransomware response plan with scope, isolation, evidence, recovery, the payment recommendation and a root-cause fix.
    expected_outcome: >
      You can recognise ransomware early, work it through scope, isolation, evidence,
      eradication and recovery, and explain why tested backups make not paying possible.
    quiz:
      - prompt: Which is an early sign of ransomware a SOC can catch before mass encryption?
        options:
          - A user changing their wallpaper
          - Shadow copies being deleted and security tools disabled
          - A successful nightly backup
          - A routine software update
        answer: 1
        explanation: Deleting shadow copies and disabling security tools are classic pre-encryption steps worth acting on immediately.
      - prompt: What is the right order for the core response steps?
        options:
          - Recover first, then scope, then isolate
          - "Scope, isolate, preserve, eradicate, recover"
          - Pay first and investigate later
          - Delete everything and rebuild
        answer: 1
        explanation: You scope, isolate, preserve evidence, eradicate access and then recover, in that order.
      - prompt: Paying the ransom is best treated as
        options: [The first step, A last resort and a business and legal decision, Always required, The SOC analyst's call alone]
        answer: 1
        explanation: Payment funds crime, guarantees nothing and may breach sanctions, so it is a last-resort decision made by the business, not the SOC.
      - prompt: What makes a confident decision not to pay realistic?
        options:
          - A large SIEM
          - "Tested, offline, immutable backups"
          - A faster firewall
          - More analysts on shift
        answer: 1
        explanation: If clean, tested backups can restore the data, the organisation does not depend on the attacker's key.

  - slug: ir-bec-account-takeover
    title: Responding to Business Email Compromise
    order: 6
    difficulty: intermediate
    summary: Work an account-takeover incident in a mailbox from detection to containment.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "cysa:3.2", "cysa:4.2"]
    learning_objectives:
      - Describe how business email compromise works and why it often involves no malware
      - Recognise the signs of a mailbox takeover in sign-in and mailbox telemetry
      - Contain an account takeover and assess its financial and notification impact
    theory: |
      **Business email compromise (BEC)** is an attacker operating a real mailbox after taking over
      the account, usually for financial fraud, fake invoices, redirected payroll or supplier
      payments, rather than to drop malware. Entry is typically phishing or password spraying, and
      sometimes weak or bypassable MFA. Because the attacker uses the legitimate account, there is
      no malicious binary to find; the evidence is in **identity and mailbox telemetry**.

      The signs are recognisable once you know them. A suspicious sign-in, a new location,
      impossible travel, or an unusual client, is the entry. Then come the tell-tale mailbox
      changes: new **inbox rules** that auto-delete or move replies so the real user never sees
      them, **mail forwarding** to an external address, and messages in Sent that the user did not
      write. These rules exist to hide the fraud while the attacker conducts it.

      Response is fast and specific. Confirm the takeover from the sign-in logs, then **revoke the
      account's sessions and reset the password**, enforce or repair MFA, and **remove the malicious
      inbox rules and forwarding** so the attacker loses both access and concealment. Search what
      was sent and to whom, warn any recipients who received fraudulent payment requests, and check
      for actual financial impact. If customer data or payments are involved, the notification
      duties from the governance side apply. This is distinct from phishing triage, where you
      analyse a suspicious message; here the account is already compromised and the job is to take
      it back.
    examples:
      - title: A concealment inbox rule
        body: |
          rule   if subject contains "invoice" or "payment" then move to RSS Feeds and mark read
          A rule hiding payment replies from the real user is a hallmark of BEC.
      - title: The takeover sign-in
        body: |
          sign-in  user=finance-clerk  location=another country  MFA=not satisfied  result=success
          An impossible-travel login that somehow succeeded points at account takeover.
    exercise:
      title: Work a BEC incident from sample telemetry
      environment: A sample set of sign-in logs, mailbox audit events and inbox-rule changes
      tools: [Sample sign-in and mailbox audit logs, a notes file]
      steps:
        - From the sign-in logs, identify the suspicious login and note the location, client and MFA state.
        - Find any new inbox rules or mail forwarding and explain what each one is hiding or doing.
        - List the containment steps in order, starting with revoking sessions and resetting the password.
        - Say how you would restore or enforce MFA and remove the malicious rules and forwarding.
        - Search what the account sent during the takeover and decide who needs warning.
        - Assess the financial and notification impact and state who must be told.
      deliverable: A BEC response note with the takeover evidence, the ordered containment steps, the malicious rules removed, and the impact and notifications.
    expected_outcome: >
      You can recognise an account takeover from identity and mailbox telemetry, contain
      it in the right order, and assess the fraud, warnings and notifications it triggers.
    quiz:
      - prompt: Business email compromise usually involves
        options:
          - Ransomware encrypting the mailbox
          - An attacker operating a legitimate account, often with no malware, for financial fraud
          - A denial-of-service attack
          - A firewall change
        answer: 1
        explanation: BEC rides a real account for fraud, so there is typically no malware, only misuse of legitimate access.
      - prompt: A new inbox rule that moves payment replies to a hidden folder is
        options: [Normal tidying, A concealment technique typical of BEC, A backup, A spam filter working]
        answer: 1
        explanation: Hiding replies about invoices or payments keeps the real user unaware while the attacker commits fraud.
      - prompt: The first containment step for a confirmed mailbox takeover is
        options:
          - Send a company-wide email
          - Revoke the account's sessions and reset the password
          - Delete the mailbox
          - Buy more storage
        answer: 1
        explanation: Cutting the attacker's active access by revoking sessions and resetting the password comes first.
      - prompt: How does BEC response differ from phishing triage?
        options: [They are identical, In BEC the account is already compromised and must be taken back, BEC only analyses an email, BEC needs no containment]
        answer: 1
        explanation: Phishing triage analyses a suspicious message; BEC response reclaims an account that is already under attacker control.
  - slug: ir-insider-threat
    title: Responding to an Insider Threat
    order: 7
    difficulty: intermediate
    summary: Work a suspected insider data-theft case where the user is authorised, so evidence handling, discretion and HR and legal coordination matter as much as the technical work.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:3.1", "cysa:4.2", "secplus:4.8"]
    learning_objectives:
      - Explain how an insider incident differs from an external intrusion
      - Build a defensible case from authorised activity without tipping off the subject
      - Coordinate with HR and legal and preserve evidence for possible proceedings
    theory: |
      An insider incident breaks the usual assumption that access itself is the anomaly. The
      subject is a legitimate user doing things they are **allowed** to do, so the signal is not
      "who got in" but **intent and pattern**: a departing employee bulk-downloading a customer
      database, a disgruntled admin copying source code to personal storage, an account quietly
      emailing files to a private address. Because the actions are authorised, detection leans on
      **behaviour against a baseline** (volume, timing, destination) rather than on a blocked or
      failed event.

      The response is as much procedural as technical. The first rule is **discretion**: an
      insider who realises they are being watched can destroy evidence or accelerate, so the
      investigation is kept need-to-know and the subject is usually not confronted until the case
      is built. This is the point where security stops acting alone, **HR and legal** are brought
      in early, because the outcome may be disciplinary or legal, and actions like reviewing a
      person's activity or accessing their files have policy and privacy constraints that vary by
      jurisdiction. Security gathers facts; HR and legal decide what happens to the person.

      Evidence handling is therefore stricter than in a routine alert. Logs, file-access records
      and endpoint data are preserved with a **chain of custody** so they hold up if the case goes
      to proceedings, and the analyst records what they did and when. Containment is chosen to
      preserve evidence and avoid alerting the subject, for example monitoring more closely, or
      disabling access at a planned moment coordinated with HR, rather than an abrupt lockout.
      After the case, the lessons feed controls, data-loss prevention, joiners-movers-leavers
      access reviews, and least privilege, that make the next insider harder.
    examples:
      - title: The same action, two readings
        body: |
          Event:   user downloads 4 GB from the CRM on a Friday evening
          Benign:  sales lead building a quarter-end report (matches their role and history)
          Insider: user resigned yesterday; destination is a personal cloud drive
          Baseline and context, not the action alone, decide which it is.
      - title: A discreet, evidence-preserving response path
        body: |
          Do:    keep need-to-know; loop in HR+legal; preserve logs with chain of custody
          Do:    increase monitoring; plan access removal with HR for a set time
          Avoid: confronting the subject early or an abrupt lockout that tips them off and loses evidence
    exercise:
      title: Work a suspected insider case to a hand-off
      environment: A sample data set of file-access, DLP and sign-in logs for one user (provided or lab-generated) and a document for the case file
      tools: [Sample user-activity logs, a document for the case file, your organisation's (or a sample) insider-threat and evidence policy]
      steps:
        - From a tip or an anomaly, state what authorised-but-suspicious behaviour you are investigating and the baseline you will compare it against.
        - Gather the relevant activity (file access, data movement, sign-ins) and build a timeline, noting volume, timing and destinations against the user's normal pattern.
        - Decide at each step what you may and may not do under policy and privacy constraints, and record who outside security (HR, legal) must be involved and when.
        - Preserve the evidence with a chain of custody, writing down what you collected, from where, and when.
        - Choose a containment approach that preserves evidence and does not tip off the subject, and justify it.
        - Reach a verdict (malicious insider, policy violation, or benign) from the evidence, and write the hand-off to HR and legal with the timeline and preserved evidence.
        - List two controls (for example DLP tuning or a leaver access review) that would reduce the risk of a repeat.
      deliverable: A case file with the baseline and timeline, the policy and coordination notes, the chain-of-custody record, the containment choice with justification, the verdict, and the HR and legal hand-off.
    expected_outcome: >
      You can investigate a suspected insider from authorised activity, build a discreet and
      evidence-sound case, coordinate with HR and legal, and hand off a defensible result while
      preserving evidence throughout.
    quiz:
      - prompt: What makes an insider incident different from an external intrusion?
        options:
          - There are never any logs
          - The subject is an authorised user, so the signal is intent and pattern, not a blocked access
          - It is always accidental
          - It cannot be detected
        answer: 1
        explanation: Insiders act within their permissions, so detection relies on behaviour against a baseline rather than failed or blocked events.
      - prompt: Why is discretion emphasised in an insider investigation?
        options:
          - To save storage
          - Because a subject who knows they are watched may destroy evidence or accelerate
          - Because insiders are never dangerous
          - To skip documentation
        answer: 1
        explanation: Tipping off the subject risks evidence destruction and escalation, so the case is kept need-to-know until built.
      - prompt: Who should security coordinate with early in an insider case?
        options: [Only the subject, HR and legal, The press, No one]
        answer: 1
        explanation: Insider outcomes are disciplinary or legal and constrained by policy and privacy, so HR and legal are involved early.
      - prompt: Why maintain a chain of custody for the evidence?
        options:
          - To make queries faster
          - So the evidence holds up if the case leads to disciplinary or legal proceedings
          - To delete the logs sooner
          - To avoid involving HR
        answer: 1
        explanation: A documented chain of custody keeps evidence defensible for any proceedings that follow.
  - slug: ir-web-app-compromise
    title: Responding to a Web Application Compromise
    order: 8
    difficulty: intermediate
    summary: Work a compromised web application or server, from detecting a web shell or injection to scoping the breach, preserving evidence and recovering without reinfection.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:3.1", "cysa:3.2", "secplus:4.8"]
    learning_objectives:
      - Recognise the signs of a compromised web application or server
      - Scope the breach, what was accessed, changed, or used as a foothold
      - Recover safely and close the entry point to prevent reinfection
    theory: |
      A public web application is exposed by design, so it is a constant target, and its compromise has a
      recognisable shape. The common entry points are **injection** (SQL injection reaching the database),
      **file upload** or deserialisation flaws dropping a **web shell**, and exploitation of an unpatched
      framework. The tell-tale signs are a new or modified file in the web root, a script executing from an
      upload directory, outbound connections from the web server to odd destinations, and anomalous entries
      in the access logs, long encoded query strings, requests to files that should not exist, or a single
      IP hitting an endpoint thousands of times.

      Response starts with **scoping**, which is harder than it looks because a web server is often a pivot,
      not the goal. The questions are: what was the entry point, what did the attacker access (did the SQL
      injection reach customer data?), what did they change or plant (a web shell, a new admin account, a
      cron job), and did they move deeper into the network using the server as a foothold. Web server logs,
      file timestamps and database query logs build the timeline. As with any incident, evidence is
      **preserved** before cleanup, a captured copy of the web shell, the logs, and the affected files,
      because you will need them for the root cause and possibly for disclosure.

      Recovery has a specific trap: **cleaning without closing the hole**. Deleting a web shell while leaving
      the vulnerable upload endpoint in place just invites reinfection, often within hours, because the
      server's address is now on target lists. So recovery means removing all attacker artefacts (shells,
      accounts, persistence), **patching or fixing the entry point**, rotating any credentials or keys the
      server held, and ideally rebuilding from a known-good image rather than trusting a cleaned host. The
      incident closes with a root cause that names the entry point and the fix that ensures the same request
      cannot succeed again.
    examples:
      - title: Signs of a web compromise in the logs
        body: |
          access.log: POST /upload.php (200) then GET /uploads/shell.php?cmd=... (200)
          web root:   new file shell.php, modified minutes ago
          net:        web server -> external IP outbound (unusual)
          The upload then execute pattern is a web shell being planted and used.
      - title: Recovery that actually holds
        body: |
          Wrong: delete shell.php -> reinfected within hours (hole still open)
          Right: remove all artefacts + fix the upload flaw + rotate secrets + rebuild from image
          Close the entry point, or the cleanup is temporary.
    exercise:
      title: Work a web-application compromise to recovery
      environment: A sample set of web server access logs, file listings and (optionally) database logs showing a compromise, plus a document for the write-up
      tools: [Sample web/access logs, file-timestamp data, a document for the timeline, a notes file]
      steps:
        - Identify the signs of compromise in the logs and files (new/modified web-root files, suspicious access-log entries, odd outbound connections).
        - Determine the likely entry point (injection, file upload, unpatched component) from the evidence.
        - Scope the breach, what the attacker accessed, what they changed or planted, and whether they used the server to move deeper.
        - Build a timeline from the logs and file timestamps and preserve the key evidence before any cleanup.
        - Write the recovery plan, remove all artefacts, fix the entry point, rotate secrets, and rebuild, explaining why deleting the shell alone is not enough.
        - State the root cause and the specific fix that ensures the same request cannot succeed again.
      deliverable: An incident write-up with the signs of compromise, the entry point, the scoped impact, a timeline with preserved evidence, a recovery plan that closes the hole, and the root cause with its fix.
    expected_outcome: >
      You can recognise a compromised web application, scope what the attacker accessed and planted,
      preserve evidence, and recover by closing the entry point and rebuilding so the same compromise does
      not simply recur.
    quiz:
      - prompt: An "upload then execute" pattern in web logs (POST to an upload, then GET of a script in the upload directory) usually indicates
        options:
          - A normal backup
          - A web shell being planted and then used
          - A DNS change
          - A patch install
        answer: 1
        explanation: Uploading a script and then requesting it to run is the signature of a web shell.
      - prompt: Why is scoping a web-server compromise especially important?
        options:
          - Web servers are never important
          - The server is often a pivot, so you must learn what was accessed and whether the attacker moved deeper
          - Scoping wastes time
          - Logs are irrelevant
        answer: 1
        explanation: A web server is frequently a foothold, so scoping must cover data accessed and lateral movement, not just the host.
      - prompt: Deleting a web shell without fixing the vulnerable endpoint typically leads to
        options: [Permanent resolution, Reinfection, often within hours, Faster performance, A closed incident]
        answer: 1
        explanation: If the entry point remains, the exposed server is quickly recompromised.
      - prompt: The most reliable recovery for a compromised web server is to
        options:
          - Clean the files in place and move on
          - Remove artefacts, fix the entry point, rotate secrets and rebuild from a known-good image
          - Reboot it
          - Change its IP address
        answer: 1
        explanation: Closing the hole and rebuilding from a trusted image avoids trusting a potentially still-compromised host.
