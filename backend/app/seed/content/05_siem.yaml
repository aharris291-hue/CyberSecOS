slug: siem-fundamentals
title: SIEM Fundamentals
domain: SIEM
order: 5
description: >
  The SIEM is the SOC analyst's main workspace. Learn how logs are collected,
  normalised and searched, using KQL in Microsoft Sentinel.
lessons:
  - slug: siem-kql-basics
    title: Searching Logs with KQL
    order: 1
    difficulty: beginner
    summary: Write KQL queries to filter, aggregate and visualise security events.
    theory_minutes: 12
    lab_minutes: 50
    objectives: ["secplus:4.4", "sc900:3", "sc200:1", "cysa:1.3"]
    learning_objectives:
      - Explain what a SIEM does from collection to alerting
      - Write KQL queries using where, project, summarize and render
      - Turn a manual search into a reusable query that answers an investigation question
    theory: |
      A **SIEM** (Security Information and Event Management) collects logs from endpoints,
      servers, network devices and cloud services, **normalises** them into common fields,
      stores them for search, and runs **analytics rules** that raise alerts. Microsoft
      Sentinel, Splunk and Elastic are the common platforms; the concepts transfer.

      Microsoft Sentinel and Defender use **KQL** (Kusto Query Language). A query starts with a
      table and pipes rows through operators:

      - `where` filters rows, `project` chooses columns, `extend` adds computed columns
      - `summarize count() by Field` aggregates, `bin(TimeGenerated, 1h)` buckets time
      - `order by`, `top`, and `render timechart` present the result

      Good queries always bound **time** first (`where TimeGenerated > ago(24h)`), because it
      is the cheapest filter. Then filter on the most selective field, then aggregate. Saving
      a query that answers a recurring question is the first step toward an analytics rule.
    examples:
      - title: Failed sign-ins by account
        body: |
          SecurityEvent
          | where TimeGenerated > ago(1d)
          | where EventID == 4625
          | summarize Failures = count() by TargetAccount, IpAddress
          | where Failures > 10
          | order by Failures desc
      - title: Logons over time
        body: |
          SecurityEvent
          | where TimeGenerated > ago(7d) and EventID == 4624
          | summarize count() by bin(TimeGenerated, 1h)
          | render timechart
    exercise:
      title: Answer investigation questions in a live KQL environment
      environment: >
        The free Microsoft Log Analytics demo workspace (aka.ms/lademo, requires a Microsoft
        account) or a Microsoft Sentinel trial workspace
      tools: [KQL, Log Analytics]
      steps:
        - Open the demo workspace and run `SecurityEvent | take 10` to see the available columns.
        - Write a query that counts events by EventID over the last 24 hours and lists the top 10.
        - Write a query that finds accounts with more than 10 failed logons (EventID 4625) in a day.
        - For the top account, list the source IPs and the first and last failure times using min() and max().
        - Check whether any of those IPs also produced a successful 4624 logon.
        - Chart logon volume per hour for the last 7 days with render timechart and describe any spike.
        - Save your best query with a descriptive name and a comment explaining what it detects.
      deliverable: Five working KQL queries with one sentence each on what they answer.
    expected_outcome: >
      You can open an unfamiliar SIEM table and write time-bounded, aggregated KQL to answer
      who, what, when and from where.
    quiz:
      - prompt: Which KQL operator aggregates rows, for example counting events per user?
        options: [project, where, summarize, extend]
        answer: 2
        explanation: summarize performs aggregations such as count(), dcount() and max().
      - prompt: Why should a query filter on time first?
        options:
          - KQL requires it
          - Time filters are the cheapest way to cut the data scanned
          - It sorts the results
          - It removes duplicates
        answer: 1
        explanation: Logs are partitioned by time, so a time bound reduces the work dramatically.
      - prompt: What does "normalisation" mean in a SIEM?
        options:
          - Deleting old logs
          - Mapping different log formats into common field names
          - Encrypting logs at rest
          - Sending alerts by email
        answer: 1
        explanation: Normalised fields let one query cover many data sources.
      - prompt: Which KQL line keeps only failed Windows logons?
        options: ["| where EventID == 4624", "| where EventID == 4625", "| project EventID", "| summarize 4625"]
        answer: 1
        explanation: 4625 is the failed logon event.

  - slug: siem-log-sources-alerting
    title: Log Sources, Correlation and Alerting
    order: 2
    difficulty: intermediate
    summary: Onboard the right log sources, write a correlation rule, and tune an alert so it fires on real activity without drowning the analyst.
    theory_minutes: 12
    lab_minutes: 52
    objectives: ["secplus:4.4", "sc200:1", "sc200:2", "cysa:1.5"]
    learning_objectives:
      - Explain which log sources a SOC needs and what each one reveals
      - Write a correlation rule that joins events across sources into one alert
      - Tune alert thresholds and severity to balance detection against false positives
    theory: |
      A SIEM is only as good as the logs feeding it. The core **log sources** a SOC
      onboards are authentication (sign-ins, Kerberos, VPN), endpoint (process
      creation, PowerShell, Sysmon), network (firewall, proxy, DNS), cloud control
      plane (Entra ID, CloudTrail), and application logs. Each answers a different
      question: endpoint logs show *what ran*, authentication logs show *who got in*,
      network logs show *where traffic went*. Coverage gaps are blind spots, so a
      SOC tracks **log source health** (is it still arriving, is parsing correct)
      as carefully as the detections themselves.

      A single event is rarely an incident; **correlation** is what turns noise into
      signal. A correlation rule joins events across time and source, for example a
      failed-logon burst **followed by** a success from the same account, or a new
      process **plus** an outbound connection to a rare destination. SIEMs express
      this as a scheduled query with a grouping key (user, host, IP) and a time
      window. Good rules carry context in the alert: the entities involved, the
      source events, and a mapped **MITRE ATT&CK** technique so the analyst knows
      what they are looking at.

      Every detection trades **false positives** against **false negatives**.
      Thresholds that are too tight miss real activity; too loose and analysts get
      **alert fatigue** and start ignoring the queue. Tuning means raising a
      threshold, excluding known-good behaviour with an allow list, enriching with
      asset criticality so a domain controller scores higher than a test VM, and
      assigning **severity** so the worst alerts surface first. Measuring volume,
      precision and time-to-triage over time is how a SOC keeps the signal high.
    examples:
      - title: A brute-force-then-success correlation (KQL)
        body: |
          SigninLogs
          | where ResultType != 0          // failures
          | summarize failures = count() by UserPrincipalName, bin(TimeGenerated, 10m)
          | where failures >= 10
          | join kind=inner (
              SigninLogs | where ResultType == 0   // a success
            ) on UserPrincipalName
          // Alert: many failures then a success for the same account in 10 minutes
      - title: An alert tuned for signal
        body: |
          Rule: Rare outbound destination from a server
          Raw:     every server talking to any new IP  -> hundreds/day (noise)
          Tuned:   exclude known update/CDN ranges; only servers tagged "crown-jewel";
                   first-seen in 30 days; severity = High if asset is Restricted
          Result:  a handful of reviewable alerts per day with context attached
    exercise:
      title: Onboard a source, write a correlation rule and tune its alert
      environment: Your SIEM lab from the KQL lesson (Microsoft Sentinel free tier, an ELK stack, or a local log set) with sample authentication and endpoint logs
      tools: [SIEM query editor, sample log data, a spreadsheet for tuning notes]
      steps:
        - List the log sources already arriving in your SIEM and note one question each answers; identify one source you are missing and how you would onboard it.
        - Pick a multi-step behaviour to detect (for example repeated logon failures followed by a success, or a new process making an outbound connection).
        - Write a correlation query that joins the events on a grouping key (user, host or IP) within a time window and returns the involved entities.
        - Run it against the sample data, confirm it fires on the intended activity, and record how many results it produces.
        - Tune it: add an allow list for known-good behaviour, raise the threshold, and assign a severity based on asset criticality; re-run and compare the before/after counts.
        - Map the detection to a MITRE ATT&CK technique and write the alert description an analyst would read, naming the entities and the source events.
        - Write two sentences on how you would measure whether this alert stays useful (volume, precision, time-to-triage) over the next month.
      deliverable: The correlation query, the before/after result counts from tuning, the ATT&CK mapping, and the analyst-facing alert description.
    expected_outcome: >
      You can choose the log sources a detection needs, write a correlation rule that
      joins events into one contextual alert, and tune it so it fires on real activity
      without burying the analyst.
    quiz:
      - prompt: Why is correlation across sources more useful than alerting on single events?
        options:
          - It uses less storage
          - It joins related events so a multi-step attack becomes one contextual alert
          - It removes the need for log sources
          - It disables false positives automatically
        answer: 1
        explanation: Correlation links related events (for example failures then a success) into a single, reviewable signal.
      - prompt: Alert fatigue is best described as
        options:
          - A SIEM running out of disk
          - Analysts ignoring alerts because too many are low-value or false
          - A rule that never fires
          - A slow query
        answer: 1
        explanation: Too many low-value alerts erode attention, so real ones get missed; tuning reduces this.
      - prompt: Enriching an alert with asset criticality helps because
        options:
          - It makes queries run faster
          - The same activity on a critical asset can be scored and triaged ahead of a test box
          - It deletes low-severity logs
          - It replaces the time window
        answer: 1
        explanation: Criticality lets identical behaviour be prioritised by how much the affected asset matters.
      - prompt: A SOC tracks log source health mainly to
        options:
          - Reduce licensing cost
          - Catch blind spots when a source stops arriving or parses incorrectly
          - Speed up correlation
          - Replace ATT&CK mapping
        answer: 1
        explanation: A silent or mis-parsed source is an undetected gap in coverage.
      - prompt: Mapping a detection to a MITRE ATT&CK technique primarily gives the analyst
        options:
          - A faster query
          - Immediate context on what adversary behaviour the alert represents
          - A lower false-positive rate
          - More log sources
        answer: 1
        explanation: The technique label tells the analyst what the alert means in attacker terms, speeding triage.

  - slug: siem-alert-investigation
    title: Investigating an Alert in the SIEM
    order: 3
    difficulty: intermediate
    summary: Take a fired alert and work it to a verdict - pivoting across data sources, building a timeline, and deciding true vs false positive.
    theory_minutes: 12
    lab_minutes: 52
    objectives: ["secplus:4.9", "cysa:1.3", "sc200:3"]
    learning_objectives:
      - Triage a fired alert and decide what to do first
      - Pivot across data sources to gather context on the entities involved
      - Build a timeline and reach a defensible true/false-positive verdict
    theory: |
      An alert is a question, not an answer. **Triage** decides how urgently to work it:
      what fired, which entities (user, host, IP) are involved, how critical the asset is,
      and whether it matches a known-good pattern. A SOC works the queue by severity and
      age, and the first job on any alert is to understand what the detection actually
      matched before touching anything else.

      Investigation is **pivoting**: starting from the alert's entities and following them
      across data sources. From a suspicious process you pivot to the host's other
      activity, to the user's logons, to the destination's network connections and
      reputation. Each pivot either builds the case or clears it. Along the way you build
      a **timeline** - the ordered sequence of events across sources - because order and
      proximity are what turn separate logs into a story ("the logon, then the process,
      then the outbound connection, all within a minute").

      Every investigation ends in a **verdict** with evidence. A **true positive** is
      escalated into incident response with the timeline and indicators attached; a
      **false positive** is documented and fed back into **tuning** so the same benign
      activity does not fire again. A **benign true positive** (real but authorised, like
      an admin's expected tool use) is recorded as an exception. Good analysts leave a
      trail: what they checked, what they found, and why they concluded what they did, so
      the next person can trust and reuse the work. This feeds process-improvement metrics
      like time-to-triage and false-positive rate.
    examples:
      - title: Pivoting from one alert
        body: |
          Alert: rare process 'update.exe' on HR-LAPTOP-12 (user: jsmith)
          Pivot 1 host:  what else ran on HR-LAPTOP-12 in +/- 10 min?
          Pivot 2 user:  where else did jsmith authenticate today?
          Pivot 3 net:   who did update.exe connect to, and is that IP known-bad?
          Each pivot builds the timeline or clears the alert.
      - title: Three verdicts, three actions
        body: |
          True positive:        malware confirmed      -> escalate to IR with timeline
          False positive:       benign tool misdetected -> document + tune the rule
          Benign true positive: admin's real tool use   -> record an approved exception
    exercise:
      title: Work an alert from fired to verdict in your SIEM
      environment: Your SIEM lab with sample endpoint, authentication and network logs (Sentinel free tier, ELK, or a provided data set), plus one seeded suspicious event
      tools: [SIEM query editor, sample logs, a document for the investigation write-up]
      steps:
        - Take a fired alert (reuse a detection from an earlier lesson or seed one) and write down what it matched and which entities (user, host, IP) it names.
        - Triage it: state the severity, the asset's criticality, and whether it resembles any known-good pattern, then decide it is worth a full look.
        - Pivot on the host: query everything that entity did within a short window around the alert and note anything related.
        - Pivot on the user and the destination IP in turn, checking logons and the destination's reputation, recording what each pivot adds or rules out.
        - Assemble the related events into a single timeline ordered by time across the sources.
        - Reach a verdict (true positive, false positive, or benign true positive) and justify it from your timeline; state the next action for that verdict.
        - If it is a false or benign positive, write the tuning change; if true, list the indicators and timeline you would hand to incident response.
      deliverable: A one-page investigation write-up covering the alert and entities, the pivots you ran with findings, the assembled timeline, the verdict with justification, and the resulting action (escalate or tune).
    expected_outcome: >
      You can take a fired alert, pivot across data sources to build a timeline, and reach
      a defensible verdict with the right next action, leaving a trail the next analyst can
      trust.
    quiz:
      - prompt: The first thing to do with a newly fired alert is to
        options:
          - Close it
          - Understand what the detection matched and which entities are involved
          - Reboot the host
          - Delete the rule
        answer: 1
        explanation: Triage starts by understanding what fired and on what before taking any action.
      - prompt: What pivoting means during an investigation
        options:
          - Rotating the dashboard
          - Following the alert's entities across data sources to gather context
          - Changing the severity
          - Restarting the SIEM
        answer: 1
        explanation: Pivoting follows users, hosts and IPs across sources to build or clear the case.
      - prompt: A real but authorised activity that triggers an alert is a
        options: [False positive, Benign true positive, False negative, Flake]
        answer: 1
        explanation: A benign true positive is genuinely detected activity that is expected and authorised.
      - prompt: Why build a timeline across data sources?
        options:
          - To use more storage
          - Because the order and proximity of events turn separate logs into a coherent story
          - To avoid pivoting
          - To replace the verdict
        answer: 1
        explanation: Sequencing events across sources reveals the narrative that single logs cannot.
      - prompt: After confirming a false positive, the follow-up that prevents a repeat is
        options: [Escalate to IR, Tune the detection, Reimage the host, Notify customers]
        answer: 1
        explanation: Feeding false positives back into tuning stops the same benign activity firing again.
  - slug: siem-dashboards-metrics
    title: SOC Dashboards, Metrics and Shift Handover
    order: 4
    difficulty: intermediate
    summary: Turn raw SIEM data into dashboards and metrics the SOC runs on, and hand a shift over cleanly so nothing in flight is dropped.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:1", "cysa:1.3"]
    learning_objectives:
      - Build a dashboard that answers a specific operational question
      - Define and interpret the core SOC metrics such as MTTD and MTTR
      - Run a shift handover that carries open work across without loss
    theory: |
      A SIEM is only useful if people can see what matters at a glance. A **dashboard**
      is a saved set of visualisations answering a specific question, such as what is in
      the alert queue, which detections are noisiest, or where ingestion has stopped. The
      discipline is to build for a **question and an audience**, not to crowd every chart
      onto one screen. An analyst's triage dashboard shows the live queue and the newest
      high-severity alerts; a manager's view shows trend and backlog. A good panel leads
      to an action, and a dashboard nobody acts on is just decoration.

      SOCs are measured, and the headline numbers are time-based. **MTTD** (mean time to
      detect) is how long between an attack starting and an alert firing; **MTTR** (mean
      time to respond, or resolve) is how long from alert to containment or closure.
      **Dwell time** is how long an adversary was present before detection. **Alert
      volume** and **false-positive rate** show whether the team is drowning, and tie back
      to the tuning discipline. Metrics guide improvement, but they can be gamed, so they
      are read together and in context. Closing alerts fast looks good until you see the
      ones closed without real investigation.

      A SOC runs continuously, so the **shift handover** is where continuity is won or
      lost. The outgoing analyst passes on what is **in flight**: open investigations and
      their current state, alerts deliberately left pending and why, anything suppressed
      temporarily, and watch items expected on the next shift. A short written handover,
      backed by a dashboard the next analyst can open, prevents a live incident from
      stalling at a shift boundary or being worked twice. The same record feeds the
      lessons-learned loop, because repeated handover items reveal where tuning or
      automation is overdue.
    examples:
      - title: One dashboard, one question, one audience
        body: |
          Analyst triage view:  open queue by severity | newest criticals | SLA breaches
          Manager view:         weekly alert trend | MTTR trend | top noisy rules
          Each panel should lead to an action; drop panels nobody acts on.
      - title: A handover note that carries work across
        body: |
          Open:     INC-204 phishing, host isolated, awaiting memory capture
          Pending:  3 medium alerts on HOST-7, likely benign update, confirm AM
          Suppressed: backup-agent LSASS rule on HOST-DB until 09:00 (ticket #88)
          Watch:    vendor advisory out; expect scan noise overnight
    exercise:
      title: Build a SOC dashboard and write a shift handover
      environment: A SIEM with sample data (a lab tenant or your earlier SIEM lesson environment) and a document for the handover
      tools: [A SIEM with dashboard/workbook features, a document for the handover, your notes on SOC metrics]
      steps:
        - Choose one operational question and one audience (for example, an analyst triaging the live queue) and list the panels that answer it.
        - Build the dashboard with at least three panels, each of which leads to a clear action.
        - Define MTTD, MTTR and dwell time in your own words and identify where in your data each would be measured.
        - Compute or estimate one metric (for example MTTR) from a sample of alerts and note one way it could be misleading if read alone.
        - Identify the current noisiest detection from your data and state whether it needs tuning, linking back to false-positive rate.
        - Write a shift-handover note covering open investigations, pending alerts, temporary suppressions and watch items, each with its current state.
        - Explain how the next analyst would use your dashboard plus the note to pick up without re-doing work.
      deliverable: The dashboard definition (panels and their actions), one computed metric with a caveat, and a shift-handover note covering open, pending, suppressed and watch items.
    expected_outcome: >
      You can build a SIEM dashboard that drives action for a specific audience, define
      and interpret the core SOC metrics, and run a shift handover that carries open work
      across cleanly so investigations are never dropped or duplicated at a boundary.
    quiz:
      - prompt: What makes a SOC dashboard effective?
        options:
          - It shows every available chart on one screen
          - Each panel answers a question for a specific audience and leads to an action
          - It uses the most colours possible
          - It refreshes once a day
        answer: 1
        explanation: Dashboards are built for a question and an audience, and panels that do not drive action are just decoration.
      - prompt: MTTR (mean time to respond) measures
        options:
          - How many alerts fired
          - The time from an alert to containment or resolution
          - The number of dashboards
          - How long logs are retained
        answer: 1
        explanation: MTTR tracks how quickly the team acts on an alert, a core responsiveness metric alongside MTTD and dwell time.
      - prompt: Why can closing alerts quickly be a misleading metric on its own?
        options:
          - Fast closure always means good work
          - Alerts may be closed without real investigation, so speed must be read with quality
          - It has no downside
          - It increases dwell time
        answer: 1
        explanation: Metrics can be gamed, so a fast close rate must be read alongside whether the alerts were actually investigated.
      - prompt: The main purpose of a shift handover is to
        options: [Reset all dashboards, Carry in-flight investigations and watch items across so nothing is dropped or duplicated, Delete old alerts, Change the SIEM schema]
        answer: 1
        explanation: A handover preserves continuity across a 24/7 operation by passing open work and context to the next analyst.

  - slug: siem-log-normalisation
    title: Onboarding and Normalising Log Sources
    order: 5
    difficulty: intermediate
    summary: Get a new log source into the SIEM parsed, normalised and ready to search.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Describe the steps to onboard a new log source into a SIEM
      - Explain why normalising fields to a common schema matters for searching and correlation
      - Validate that a newly onboarded source is parsed, timestamped and complete
    theory: |
      A SIEM is only as good as the data in it, and raw logs arrive in a dozen shapes.
      **Onboarding** is the work of getting a new source, a firewall, a cloud audit log or an
      endpoint agent, from a stream of text into fields an analyst can search. The first step is
      **collection**, deciding how the data arrives (an agent, syslog, an API pull) and confirming
      it actually lands. The second is **parsing**, breaking each event into fields such as source
      IP, user and action.

      Different products name the same thing differently, so the third step is **normalisation**,
      mapping those fields onto a **common schema** such as the Elastic Common Schema or a SIEM's
      information model. Once a user is always `user.name` and a source address is always
      `source.ip`, one search and one correlation rule work across every source. Without it, every
      detection has to know the quirks of every vendor, which does not scale.

      Two details decide whether the data is trustworthy. **Timestamps** must be parsed into a real
      time and stored in UTC, because an event in the wrong time zone lands in the wrong place on a
      timeline. And you must check for **completeness**, that the volume looks right, that no fields
      are silently dropped, and that the source has not gone quiet. Onboarding ends not when data
      arrives but when a test search returns correct, normalised, correctly timed results.
    examples:
      - title: Normalising two sources to one field
        body: |
          Firewall       src=10.1.1.5
          Cloud audit    callerIp=10.1.1.5
          Both map to source.ip = 10.1.1.5, so one search finds the host across both.
      - title: A timestamp parsed into UTC
        body: |
          Raw      Oct 20 14:02:11 host sshd[1123] Failed password
          Parsed   @timestamp = 2026-10-20T13:02:11Z  (host is BST, stored as UTC)
          Storing UTC keeps the event in the right place on a cross-source timeline.
    exercise:
      title: Onboard a sample log source end to end
      environment: A SIEM or a local parser with a sample log from an unfamiliar source
      tools: [A sample raw log, a SIEM or a parsing tool, a common-schema field reference]
      steps:
        - Take a sample log from a source the SIEM does not yet parse and confirm the events are arriving.
        - Write or configure a parser that splits each event into named fields.
        - Map those fields onto the common schema so the user, source address and action match the names other sources use.
        - Parse the timestamp into a real time and store it in UTC, checking one event against its original local time.
        - Run a test search that should return known events and confirm the fields come back populated and correct.
        - Check the event volume looks reasonable and note how you would alert if the source went silent.
        - Record the field mapping and the validation you ran so the next person can trust the source.
      deliverable: A field-mapping note for the new source plus the test search and the completeness check you used to validate it.
    expected_outcome: >
      You can take an unfamiliar log source and onboard it so its events are parsed,
      normalised to the common schema, correctly timestamped and verified as complete.
    quiz:
      - prompt: Why normalise fields from different sources onto a common schema?
        options:
          - To make logs larger
          - So one search and one correlation rule work across every source
          - To delete old logs
          - To avoid parsing
        answer: 1
        explanation: A shared schema means a detection refers to one field name instead of every vendor's quirks, so it scales across sources.
      - prompt: Event timestamps should be stored in
        options: [The sender's local time, UTC, Whatever the vendor happens to send, Only inside the raw message text]
        answer: 1
        explanation: Storing UTC keeps events from different sources and zones aligned on a single timeline.
      - prompt: Onboarding a log source is finished when
        options:
          - The data first arrives
          - A test search returns correct, normalised, correctly timed results
          - The parser is written
          - The source is added to a list
        answer: 1
        explanation: Arrival is only the start; the source is onboarded once searches return correct, normalised, well-timed data.
      - prompt: A sudden drop to zero events from an onboarded source most likely means
        options: [The source is healthy, A collection or parsing problem worth alerting on, Normalisation succeeded, The schema improved]
        answer: 1
        explanation: A silent source usually signals a broken collector or parser, which is why completeness monitoring matters.

  - slug: siem-threat-intel-matching
    title: Threat Intelligence Matching in the SIEM
    order: 6
    difficulty: intermediate
    summary: Match indicators against your logs with watchlists, context and aging.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.4"]
    learning_objectives:
      - Explain how a SIEM matches threat-intel indicators against log events
      - Judge indicator quality by context, confidence, recency and scope
      - Treat a match as a lead to triage, not a verdict, and watch feed health
    theory: |
      Threat intelligence only earns its keep once it meets your logs. A SIEM ingests **indicators**
      of compromise, IP addresses, domains, file hashes and URLs, from one or more feeds, stores
      them in a **watchlist** or lookup table, and matches them against incoming events, either
      enriching at ingest or joining at search time. A match raises an alert that an indicator a
      feed called malicious has just appeared in your environment.

      Quality matters far more than volume. Each indicator should carry **context**, why it is
      considered bad, a confidence level and its source, so an analyst can weigh a hit. Indicators
      must also be **aged out**, because a malicious IP reassigned to a content delivery network
      becomes a false-positive machine if it never expires. And matching must be **scoped** to the
      right field, matching an external-IP feed only against external addresses, so you do not flag
      your own hosts. High-confidence, recent, specific indicators are worth far more than a huge
      stale list, and duplicates across feeds should be collapsed.

      A match is a **lead, not a verdict**. An IP on a feed may be shared hosting; a hash may be a
      renamed legitimate tool. The analyst confirms before acting. For the SOC the health signals
      are their own concern: are indicators actually arriving from each feed, what is the
      false-positive rate per feed, and is matching keeping up with ingest.
    examples:
      - title: An indicator with usable context
        body: |
          indicator   198.51.100.7  type=ip  confidence=high  source=feedA  reason=known C2  added=2026-10-18
          Context and a recent date let an analyst weigh the hit instead of guessing.
      - title: A stale indicator causing noise
        body: |
          indicator   203.0.113.9 added 14 months ago, now a CDN edge node
          Every internal user hitting that CDN now trips the rule, so the indicator must age out.
    exercise:
      title: Match a threat-intel feed against sample logs
      environment: A SIEM or notebook with sample logs and a small indicator feed
      tools: [A sample indicator feed, sample proxy or DNS logs, a SIEM or notebook, a notes file]
      steps:
        - Load a small indicator feed and note the context each indicator carries (type, confidence, source, date).
        - Match the indicators against the sample logs on the correct field for each indicator type.
        - For each hit, decide whether it is a real lead or a likely false positive and say why.
        - Find one indicator that is stale or too broad and propose an aging or scoping rule for it.
        - Rank the hits by indicator confidence and recency to decide triage order.
        - Note how you would monitor that each feed is still delivering indicators.
      deliverable: A short triage note listing the matches, which you would escalate, and one aging or scoping improvement for the feed.
    expected_outcome: >
      You can match indicators against logs, judge them by context and recency, treat a
      hit as a lead to confirm, and keep the feed from generating stale-indicator noise.
    quiz:
      - prompt: A SIEM matches threat intelligence by
        options:
          - Deleting matching logs
          - Comparing incoming events against a watchlist of indicators and alerting on a hit
          - Blocking all traffic
          - Encrypting the logs
        answer: 1
        explanation: Indicators are held in a watchlist and matched against events, raising an alert when one appears.
      - prompt: Why must indicators be aged out over time?
        options: [To save keystrokes, Because a stale indicator (like an IP reassigned to a CDN) becomes a false-positive source, To hide them, To block all DNS]
        answer: 1
        explanation: Indicators go stale as infrastructure is reassigned, so keeping them forever generates false positives.
      - prompt: A threat-intel match should be treated as
        options: [A confirmed incident, A lead to triage and confirm, A reason to ignore the host, A billing event]
        answer: 1
        explanation: Feeds carry shared hosting and renamed tools, so a match is a lead the analyst confirms, not a verdict.
      - prompt: Which indicator is most valuable?
        options:
          - An old, low-confidence entry from an unknown source
          - A high-confidence, recent, specific indicator with context
          - A broad internal IP range
          - A duplicate of three other feeds
        answer: 1
        explanation: Confidence, recency, specificity and context make an indicator actionable; volume alone does not.
  - slug: siem-soar-automation
    title: Automating Response with SOAR Playbooks
    order: 7
    difficulty: intermediate
    summary: Turn a repeatable alert response into a SOAR playbook that enriches, contains and escalates while keeping the analyst in control.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:4", "cysa:1.5"]
    learning_objectives:
      - Explain what SOAR adds on top of a SIEM and when automation is worth it
      - Design a playbook that enriches, decides and acts with a human checkpoint
      - Keep automated actions safe with scoping, approvals and an audit trail
    theory: |
      A SIEM detects; a **SOAR** (Security Orchestration, Automation and Response) acts on
      what the SIEM finds. In Microsoft Sentinel these are **playbooks** (Logic Apps) run by
      **automation rules**; other stacks call them workflows. The point is to take the
      repetitive, well-understood part of a response, the enrichment and the first safe
      actions, off the analyst's hands so they spend their attention on judgement instead of
      copy-paste.

      A good playbook follows a shape: **trigger** on an alert, **enrich** by pulling context
      (the user's recent sign-ins, the IP's reputation, the host's owner), **decide** with
      simple logic, then **act**. Low-risk actions, posting the enriched summary to the ticket,
      tagging the alert, opening a case, are safe to fully automate. High-impact actions,
      disabling an account, isolating a host, blocking an IP, belong behind a **human
      checkpoint**: the playbook prepares the action and an analyst approves it. This keeps
      speed without handing containment decisions to a rule that cannot see context.

      Automation that can change your environment has to be governed. Each playbook runs with
      an **identity** whose permissions should be the least it needs, actions should be
      **scoped** so a bug cannot disable every account, and every run must leave an **audit
      trail** of what fired, what it did and who approved it. The measure of success is not how
      much is automated but whether mean time to respond falls while false actions stay near
      zero; an over-eager playbook that isolates a domain controller on a false positive costs
      more than it saves.
    examples:
      - title: An enrich-decide-act playbook outline
        body: |
          Trigger:  "impossible travel" sign-in alert
          Enrich:   last 24h sign-ins, IP reputation, user's manager and department
          Decide:   risky sign-in AND no recent MFA?  -> prepare account-disable
          Act:      post enriched summary to ticket (auto); account-disable (needs approval)
      - title: A guardrail that keeps automation safe
        body: |
          Playbook identity:  can disable users, cannot delete them (least privilege)
          Scope:              one account per run; refuse if >5 in 10 min (runaway guard)
          Audit:              every run logs alert id, actions, approver, outcome
    exercise:
      title: Design and dry-run a response playbook
      environment: Your SIEM lab (Sentinel free tier with Logic Apps, or a paper/notebook design plus a scripting runtime for a mock enrichment)
      tools: [SIEM automation feature or a notebook, sample alert, a notes file]
      steps:
        - Pick one repeatable alert from an earlier lesson and write down the manual steps an analyst takes today to work it.
        - Split those steps into enrich, decide and act, and mark which actions are low-risk (safe to automate) and which are high-impact (need approval).
        - Design the playbook trigger and the enrichment it would gather, naming each data source.
        - Write the decision logic as plain conditions and define the human checkpoint for any containment action.
        - Dry-run it against a sample alert (really in the SIEM, or on paper), recording what each step would output.
        - Add guardrails: the identity's least-privilege permissions, a scope limit, and the audit fields each run must record.
        - State how you would measure whether the playbook helps (time-to-respond, false-action rate) over its first month.
      deliverable: A playbook design (trigger, enrichment, decision, actions with the approval checkpoint), its guardrails, and the dry-run output on one sample alert.
    expected_outcome: >
      You can take a repeatable alert response and turn it into a SOAR playbook that enriches
      and acts safely, keeping a human checkpoint on high-impact actions and an audit trail on
      every run.
    quiz:
      - prompt: What does SOAR add on top of a SIEM?
        options:
          - More log storage
          - Orchestration and automation that act on what the SIEM detects
          - A replacement for analysts
          - Faster KQL queries
        answer: 1
        explanation: SOAR orchestrates enrichment and response actions around the alerts a SIEM raises.
      - prompt: Which action is best left behind a human approval checkpoint?
        options:
          - Posting an enriched summary to the ticket
          - Tagging the alert
          - Isolating a host or disabling an account
          - Opening a case
        answer: 2
        explanation: High-impact containment actions need a human decision; low-risk enrichment can be fully automated.
      - prompt: Why should a playbook's identity have least-privilege permissions?
        options:
          - To make it run faster
          - So a bug or abuse cannot take actions far beyond what the playbook needs
          - To reduce log volume
          - To skip the audit trail
        answer: 1
        explanation: Least privilege limits the blast radius if the automation misfires or is abused.
      - prompt: The real measure of a good response playbook is
        options:
          - How many actions it automates
          - That time-to-respond falls while false actions stay near zero
          - That it never needs approval
          - That it disables accounts quickly
        answer: 1
        explanation: Automation is worth it only if it speeds real response without causing wrong actions.
  - slug: siem-ueba-anomaly
    title: Behaviour Analytics and Anomaly Detection in the SIEM
    order: 8
    difficulty: intermediate
    summary: Use user and entity behaviour analytics to catch threats that signature rules miss, by baselining normal and alerting on meaningful deviation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain how UEBA complements signature and correlation rules
      - Describe baselining and what makes a deviation meaningful
      - Triage an anomaly-based alert, which carries more uncertainty than a rule
    theory: |
      Signature and correlation rules catch known patterns, but an attacker using valid credentials and
      normal tools may never trip one. **User and entity behaviour analytics** (UEBA) fills that gap by
      learning what is normal for each user, host and service account and alerting when behaviour deviates
      meaningfully. Instead of "this matches a known-bad pattern", the question becomes "this account has
      never done this before", which is how insider misuse, compromised accounts and slow, low-and-slow
      attacks surface.

      UEBA works by **baselining**. Over a learning period it builds a profile per entity, typical logon
      times and locations, the systems a user touches, normal data volumes, the processes a server runs, and
      then scores new activity against that profile. A finance user suddenly accessing source-code
      repositories, a service account logging in interactively, or a workstation uploading gigabytes at 3am
      all score as anomalies because they diverge from the entity's own history. Good systems combine weak
      signals: no single oddity is damning, but several together, a new location *and* a new device *and* a
      sensitive-data access, raise a **risk score** worth an analyst's time.

      The catch is that an anomaly is **not** a detection; it is a statistical oddity that carries more
      uncertainty than a signature hit. People change roles, travel, and work late, so UEBA generates more
      ambiguous alerts, and triage leans even harder on context and the baseline itself: is this genuinely
      new for this entity, or just new to a too-short learning window. The analyst's job is to confirm
      against the entity's real history and corroborating signals before escalating, and to feed false
      positives back so the model improves. Used well, UEBA is the layer that catches the quiet,
      credentialed attacker the rules cannot see.
    examples:
      - title: Weak signals combining into risk
        body: |
          New country (minor) + new device (minor) + bulk HR-data access (notable)
          Individually: noise.  Together: high risk score -> analyst review
          UEBA scores the combination, not each event alone.
      - title: Anomaly versus signature
        body: |
          Signature:  "process X with known-bad hash"      (certain, known)
          Anomaly:    "this service account logged on interactively for the first time"
          The anomaly is a lead with uncertainty, confirmed against the baseline.
    exercise:
      title: Baseline an entity and triage an anomaly
      environment: A SIEM with UEBA features or sample activity logs with enough history to baseline
      tools: [A SIEM or sample logs, a notes file, a spreadsheet for the baseline]
      steps:
        - Pick one entity (a user or service account) and build a simple baseline from its history, typical hours, locations, systems and data volumes.
        - Identify an activity in the data that deviates from that baseline and describe which dimension it departs from.
        - Explain why combining several weak signals gives a more reliable alert than any single oddity.
        - Triage the anomaly, decide whether it is likely benign (role change, travel) or suspicious, using corroborating signals.
        - State how a too-short learning window could make normal activity look anomalous, and how you would account for it.
        - Decide the outcome (escalate, or dismiss and feed back) and note how that feedback improves the model.
      deliverable: A baseline for one entity, one anomaly with the dimension it deviates on, your triage verdict with the signals used, and the feedback that would tune the model.
    expected_outcome: >
      You can explain how UEBA complements rule-based detection, baseline an entity's normal behaviour,
      and triage an anomaly-based alert, allowing for its greater uncertainty and confirming against history
      before escalating.
    quiz:
      - prompt: UEBA catches threats that signature rules miss because it
        options:
          - Uses more storage
          - Learns each entity's normal behaviour and alerts on meaningful deviation, catching valid-credential abuse
          - Blocks all traffic
          - Only reads known-bad hashes
        answer: 1
        explanation: Behaviour analytics flags activity that is abnormal for an entity even when it matches no known-bad pattern.
      - prompt: Combining several weak signals into a risk score is useful because
        options:
          - It ignores context
          - No single oddity is damning, but several together are far more likely to be real
          - It removes the baseline
          - It disables alerts
        answer: 1
        explanation: Correlated weak signals raise confidence that an anomaly reflects a real threat.
      - prompt: Compared with a signature hit, an anomaly-based alert
        options:
          - Is always a true positive
          - Carries more uncertainty and needs confirmation against the entity's history
          - Needs no triage
          - Cannot be a false positive
        answer: 1
        explanation: Anomalies are statistical oddities, so they are confirmed against baseline and context before escalation.
      - prompt: A too-short UEBA learning window can cause
        options: [Perfect accuracy, Normal activity to look anomalous because the baseline is incomplete, No alerts ever, Faster networks]
        answer: 1
        explanation: An incomplete baseline misjudges normal behaviour, so the window length must be accounted for in triage.
  - slug: siem-correlation-rules
    title: Writing and Managing Correlation Rules
    order: 9
    difficulty: intermediate
    summary: Build correlation rules that combine events across time and sources into meaningful alerts, and manage them so they stay precise, documented and trustworthy.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["sc200:2", "secplus:4.4", "cysa:1.3"]
    learning_objectives:
      - Explain what correlation rules add beyond single-event alerts
      - Write a correlation rule combining events across time and sources
      - Manage rules with documentation, severity and lifecycle discipline
    theory: |
      A single log event rarely means much on its own; the signal is often in the **combination**. One failed
      login is noise; fifty failed logins followed by a success from the same source is a brute-force
      compromise. A **correlation rule** is how a SIEM expresses that: it watches for a pattern of events
      across time, and across different log sources, and raises one meaningful alert when the pattern matches,
      instead of flooding analysts with the individual events. This is the step up from simple matching that
      turns a pile of logs into detections.

      Writing a correlation rule means being precise about the pattern. The building blocks are the **events**
      to match, the **grouping key** that ties them together (the same user, host or source IP), the **time
      window** in which they must occur, and the **threshold** or **sequence** that triggers. "A failed logon
      followed by a success from the same source within five minutes" needs a sequence and a grouping key;
      "more than 100 denied connections from one host in a minute" needs a threshold. The craft is choosing
      these so the rule fires on the attack and not on the benign version, which depends heavily on the logs
      being normalised so the grouping key means the same thing across sources, the reason normalisation and
      correlation go hand in hand.

      Rules are not written once and forgotten; they are **managed** like code. Each rule needs a clear name
      and description of what it detects and why, a severity that reflects real impact, a mapping to a
      technique (ATT&CK) so coverage is visible, and a documented response so an analyst who gets the alert
      knows what to do. Over time rules are reviewed, tuned when they get noisy, and retired when they no
      longer earn their place. A SIEM full of undocumented, unmaintained rules is as much a liability as too
      few rules, so the discipline of rule management, versioning, testing changes, measuring each rule's
      output, is what keeps the detection set trustworthy rather than a source of fatigue.
    examples:
      - title: Correlation versus single events
        body: |
          single:  "failed logon" (noise, thousands a day)
          correlation: 50 failed logons THEN a success, same source, 5 min window
          -> one meaningful brute-force alert instead of 51 raw events
      - title: The building blocks of a rule
        body: |
          events:   denied connection
          group by: source IP
          window:   60 seconds
          threshold: > 100  -> alert "possible scan/flood from <ip>"
    exercise:
      title: Write and document a correlation rule
      environment: A SIEM or a notebook with sample multi-source logs containing a correlatable attack pattern
      tools: [A SIEM or notebook, sample logs with an embedded pattern, a rule-documentation template, a notes file]
      steps:
        - Identify an attack pattern in the sample data that no single event would reveal on its own.
        - Specify the rule's building blocks, the events to match, the grouping key, the time window, and the threshold or sequence.
        - Write the correlation rule (in the SIEM's language or pseudocode) and run it against the data to confirm it fires on the pattern.
        - Explain how normalisation of the sources makes the grouping key reliable across them.
        - Document the rule, name, description, severity, ATT&CK mapping and the response an analyst should take.
        - Describe how you would test a change to this rule and measure its output so it stays trustworthy.
      deliverable: A documented correlation rule with its building blocks, a run showing it fires on the pattern, the normalisation dependency, and the management details (severity, mapping, response, change-testing).
    expected_outcome: >
      You can explain what correlation adds over single-event alerts, write a rule that combines events across
      time and sources into one meaningful alert, and manage rules with documentation, severity and lifecycle
      discipline so the detection set stays precise and trustworthy.
    quiz:
      - prompt: A correlation rule is valuable because it
        options:
          - Deletes logs
          - Combines a pattern of events across time and sources into one meaningful alert
          - Stores more data
          - Replaces the firewall
        answer: 1
        explanation: Correlation surfaces the signal that lies in combinations of events rather than single ones.
      - prompt: Which building block ties correlated events to the same entity?
        options: [The time window, The grouping key (such as user, host or source IP), The severity, The description]
        answer: 1
        explanation: The grouping key links events belonging to the same user, host or source so the pattern is coherent.
      - prompt: Correlation depends on normalisation because
        options:
          - Normalisation deletes events
          - The grouping key must mean the same thing across different sources for the rule to work
          - It is faster
          - Rules cannot use time windows otherwise
        answer: 1
        explanation: Only when sources share a normalised schema does a grouping key correlate events across them.
      - prompt: Managing correlation rules like code means
        options:
          - Writing them once and never touching them
          - Documenting, versioning, testing changes and measuring each rule's output over its lifecycle
          - Disabling logging
          - Avoiding severities
        answer: 1
        explanation: Rule lifecycle management keeps the detection set documented, tuned and trustworthy.
  - slug: siem-use-case-development
    title: SIEM Use-Case Development and the Detection Backlog
    order: 10
    difficulty: intermediate
    summary: Turn threats and requirements into a prioritised set of SIEM detections through a use-case process, so the SIEM covers what matters instead of whatever was easy to write.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["sc200:2", "cysa:1.3", "secplus:4.4"]
    learning_objectives:
      - Explain what a detection use case is and why a structured process matters
      - Develop a use case from threat and requirement through to a deployed detection
      - Prioritise and manage a detection backlog against risk and coverage
    theory: |
      A SIEM full of detections that were easy to write, rather than the ones that matter, gives a false sense
      of security. **Use-case development** is the structured process that fixes this: it starts from what you
      need to detect, a threat, a compliance requirement, a risk to a specific asset, and works forward to a
      deployed, tested detection, instead of starting from whatever log happened to be available. A **use case**
      is that unit of work: a documented statement of what you want to detect, why it matters, what data it
      needs, the logic, and the response. Thinking in use cases keeps the SIEM aligned with real risk.

      Developing one follows a path. Begin with the **requirement**: what threat or scenario (often framed with
      MITRE ATT&CK) and why it is worth detecting. Check the **data**: do you ingest the logs this needs, and
      are they parsed and normalised, if not, onboarding that data is a prerequisite, which is why use-case
      development often drives log onboarding rather than the reverse. Then design the **detection logic**, set
      its **severity** and the **response** an analyst should take, **test** it against known-good and known-bad
      activity, and deploy it with documentation. Each use case therefore ties a real threat to concrete
      telemetry and a concrete response, with no orphan rules and no silent gaps.

      Because you cannot build everything at once, use cases are managed as a prioritised **backlog**.
      Prioritisation weighs the risk the use case addresses, the likelihood and impact of the threat, the value
      of the assets involved, against the effort and data readiness to build it, so the SIEM grows toward the
      highest-value coverage first. The backlog also makes **coverage** visible: mapping use cases to ATT&CK
      shows what you can and cannot detect, turning gaps into planned work rather than blind spots. For the SOC,
      this discipline is what separates a SIEM that reflects a deliberate detection strategy from one that is an
      accidental pile of rules.
    examples:
      - title: A use case from requirement to detection
        body: |
          requirement: detect credential dumping (ATT&CK T1003), high risk
          data: need LSASS-access telemetry -> onboard if missing
          logic + severity + response -> test on known-good/bad -> deploy + document
      - title: Prioritising the backlog
        body: |
          use case A: high-risk threat, data already onboarded -> build first
          use case B: medium risk, needs new log source -> schedule onboarding
          map all to ATT&CK -> gaps become planned work, not blind spots
    exercise:
      title: Develop a SIEM use case and prioritise a backlog
      environment: A SIEM or a notebook, plus a short list of threats/requirements and the available log sources
      tools: [A SIEM or notebook, a MITRE ATT&CK reference, a use-case template, a notes file]
      steps:
        - Pick a threat or requirement and write the use-case requirement, what to detect and why it matters.
        - Check whether the data it needs is already ingested, parsed and normalised, and note any onboarding prerequisite.
        - Design the detection logic, severity and the analyst response for the use case.
        - Describe how you would test the detection against known-good and known-bad activity before deploying it.
        - Build a small backlog of several use cases and prioritise them by risk versus effort and data readiness.
        - Map the use cases to ATT&CK and identify one coverage gap that becomes planned work.
      deliverable: One fully developed use case (requirement, data, logic, severity, response, test plan) plus a prioritised backlog mapped to ATT&CK with one identified coverage gap.
    expected_outcome: >
      You can develop a SIEM detection use case from threat and requirement through to a tested, documented
      detection, and manage a prioritised backlog against risk and ATT&CK coverage so the SIEM reflects a
      deliberate strategy.
    quiz:
      - prompt: Use-case development improves a SIEM by
        options:
          - Writing whatever detections are easiest
          - Starting from what needs to be detected and working forward to a tested, deployed detection
          - Deleting old logs
          - Avoiding documentation
        answer: 1
        explanation: Starting from requirements keeps detections aligned with real risk rather than data convenience.
      - prompt: If a use case needs a log source that is not yet ingested, you should
        options:
          - Abandon the use case
          - Treat onboarding that data as a prerequisite, so use-case development drives log onboarding
          - Write the rule anyway
          - Disable the SIEM
        answer: 1
        explanation: Requirements often drive which data to onboard, rather than the reverse.
      - prompt: A detection backlog is prioritised by
        options:
          - Alphabetical order
          - The risk the use case addresses weighed against the effort and data readiness to build it
          - The length of the rule
          - The time of day
        answer: 1
        explanation: Prioritising by risk versus effort grows coverage toward the highest value first.
      - prompt: Mapping use cases to ATT&CK makes
        options:
          - The SIEM slower
          - Detection coverage and gaps visible, turning blind spots into planned work
          - Logs disappear
          - Rules optional
        answer: 1
        explanation: ATT&CK mapping shows what you can and cannot detect, so gaps become deliberate backlog items.
  - slug: siem-retention-storage
    title: Log Retention, Storage Tiers and Compliance
    order: 11
    difficulty: beginner
    summary: Decide how long to keep which logs and where, balancing detection needs, investigation and compliance against the real cost of storing high-volume data.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:4.1", "sc200:1"]
    learning_objectives:
      - Explain why log retention is a deliberate decision, not an afterthought
      - Balance detection, investigation and compliance needs against storage cost
      - Use storage tiers and a retention policy to keep the right data affordably
    theory: |
      Logs are the raw material of detection and investigation, but they are also voluminous and expensive to
      store and search, so **how long to keep which logs, and where** is a real decision with security
      consequences. Keep too little and an investigation hits a wall, you discover a breach that began four
      months ago but your logs only go back thirty days, so you cannot reconstruct it. Keep everything hot
      forever and the cost becomes unsustainable and searches slow to a crawl. Retention is the deliberate
      balancing of these pressures, and getting it wrong is a quiet but serious gap.

      Three forces set the requirement. **Detection** needs recent data readily searchable, most alerting works
      on a short window. **Investigation** needs a longer history because intrusions are often discovered long
      after they begin; the industry's dwell-time reality (attackers present for weeks or months before
      detection) means short retention can make a breach uninvestigable. **Compliance** often sets hard
      minimums: regulations and standards may require that certain logs be retained for a year or more, turning
      retention from a preference into an obligation. The right policy satisfies the longest of these for each
      log type, and different logs warrant different periods, authentication and security events longer,
      high-volume debug data shorter.

      The way to make this affordable is **storage tiering**. Recent data sits in a **hot** tier, indexed and
      instantly searchable for detection and active investigation; older data moves to **warm** and then
      **cold** or archival storage, far cheaper but slower to query, kept to satisfy long investigations and
      compliance. A good retention policy therefore specifies, per log source, how long it stays in each tier,
      driven by its detection value, investigative usefulness and any compliance mandate. For the analyst, the
      practical consequences are concrete: know what is searchable instantly versus what must be restored from
      archive, ensure the logs that matter for incidents are retained long enough, and recognise that a
      too-short or inconsistent retention policy is itself a risk that can make an incident impossible to fully
      understand.
    examples:
      - title: The cost of too-short retention
        body: |
          breach began 4 months ago, logs only go back 30 days
          -> cannot reconstruct the intrusion
          dwell time is often weeks/months, so short retention blinds investigation.
      - title: Storage tiers
        body: |
          hot    recent, indexed, instant search (detection + active IR)
          warm   older, slower, cheaper
          cold   archival, cheapest, slow to query (long IR + compliance)
          policy sets how long each log source stays in each tier.
    exercise:
      title: Build a log-retention policy with storage tiers
      environment: A list of log sources with volumes and sensitivities (or a described environment) and a document or spreadsheet
      tools: [A list of log sources, a spreadsheet or document, a reference on common compliance retention minimums, a notes file]
      steps:
        - Explain the risk of keeping too little log history, using the idea of attacker dwell time.
        - For several log sources, note each one's detection value, investigative usefulness and any compliance minimum.
        - Decide a retention period for each source that satisfies the longest applicable need.
        - Assign each source to hot, warm and cold tiers over its lifetime, balancing searchability against cost.
        - Identify which data an analyst can search instantly versus what must be restored from archive during an incident.
        - Explain why a too-short or inconsistent retention policy is itself a security risk.
      deliverable: A retention policy specifying, per log source, the retention period and the hot/warm/cold tiering, justified by detection, investigation and compliance needs, with the restore implications for incidents noted.
    expected_outcome: >
      You can set log retention deliberately, balancing detection, investigation and compliance against
      storage cost, and use hot, warm and cold tiers so the right data is available at the right speed without
      unsustainable cost.
    quiz:
      - prompt: Why is log retention a security decision, not just an IT cost question?
        options:
          - It never matters
          - Too-short retention can make a breach impossible to investigate, since intrusions are often found long after they begin
          - Logs are free to store
          - Only compliance cares
        answer: 1
        explanation: Dwell time means short retention can leave an investigation with no history of the intrusion.
      - prompt: Compliance requirements affect retention by
        options:
          - Making it optional
          - Often setting hard minimum periods certain logs must be kept
          - Deleting logs faster
          - Reducing storage cost
        answer: 1
        explanation: Regulations and standards may mandate retaining specific logs for a year or more.
      - prompt: Storage tiering keeps retention affordable by
        options:
          - Deleting all old data
          - Holding recent data hot and instantly searchable while moving older data to cheaper, slower warm/cold tiers
          - Storing everything hot forever
          - Avoiding all archival
        answer: 1
        explanation: Tiering balances instant searchability for recent data against cheaper long-term storage for the rest.
      - prompt: During an incident, data in cold/archival storage is
        options: [Instantly searchable, Cheaper but slower, often needing restoration before querying, Deleted, Unusable]
        answer: 1
        explanation: Cold storage is cost-effective for long retention but slower to query, sometimes requiring restore.
  - slug: siem-architecture-pipeline
    title: SIEM Architecture and the Data Pipeline
    order: 12
    difficulty: intermediate
    summary: Understand how a SIEM is built, from collection and forwarding through parsing, indexing and storage, so you can reason about coverage, reliability and why data sometimes does not arrive.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["sc200:1", "secplus:4.4", "cysa:1.3"]
    learning_objectives:
      - Describe the stages of a SIEM data pipeline from source to search
      - Explain collection methods and where data loss or delay occurs
      - Reason about SIEM reliability, scaling and coverage gaps
    theory: |
      A SIEM is often treated as a magic box where logs go in and alerts come out, but understanding its
      **architecture** is what lets an analyst reason about why a detection fired late, why some data is
      missing, or whether a source is even being collected. The pipeline has recognisable stages:
      **collection** from sources, **transport/forwarding** to the platform, **parsing and normalisation** into
      a common schema, **indexing** for fast search, and **storage** across tiers. A failure or bottleneck at
      any stage affects everything downstream, so detection quality depends on the whole pipeline working, not
      just on the rules.

      **Collection** happens in a few ways, and each has implications. **Agents** on endpoints collect and
      forward richly but must be deployed and maintained. **Agentless** collection pulls from APIs or receives
      syslog, simpler but sometimes less detailed or reliable. **Forwarders** and intermediate collectors
      aggregate and buffer data on its way to the platform, which matters because buffering is what prevents log
      loss during a spike or an outage. Understanding the collection method for each source tells you how timely
      and complete that data is, and where it could silently stop. A source that was never onboarded, or an
      agent that died, is a blind spot the rules can never compensate for.

      Two architectural realities shape the analyst's expectations. **Scale**: SIEMs ingest enormous volumes,
      so ingestion lag, index capacity and storage tiering all affect what is searchable and how fast, which is
      why a query over months of data is slow and why very high-volume sources are sometimes sampled or
      filtered. **Reliability**: because the pipeline can drop or delay data, monitoring the pipeline itself,
      ingestion rates per source, sources that go quiet, forwarder health, is part of running a SIEM; a source
      that stops sending is both an operational problem and a possible security signal (an attacker disabling
      logging). For the analyst, knowing the architecture means knowing the limits of the data: what is
      collected, how current it is, what might be missing, and therefore how much to trust an absence of alerts.
      A detection is only as good as the pipeline feeding it.
    examples:
      - title: The pipeline stages
        body: |
          source -> collection (agent/agentless) -> forwarder (buffer)
          -> parse/normalise -> index -> storage (hot/warm/cold)
          a failure at any stage affects everything downstream.
      - title: An absence that matters
        body: |
          a source stops sending events
          -> operational problem (agent died?) AND possible security signal (logging disabled?)
          monitoring ingestion per source catches both.
    exercise:
      title: Map a SIEM pipeline and find its weak points
      environment: A described SIEM deployment with several log sources (or a lab), plus a diagram or document
      tools: [A SIEM description or lab, a diagram or document, a notes file]
      steps:
        - Draw the pipeline stages from source to searchable data and explain what each stage does.
        - For two sources, identify the collection method (agent or agentless) and what that implies for timeliness and completeness.
        - Explain where buffering occurs and why it matters during an ingestion spike or outage.
        - Identify how scale (ingestion lag, index capacity, storage tiers) affects what is searchable and how fast.
        - Describe how you would monitor the pipeline itself and what a source going quiet could mean.
        - Explain how understanding the architecture changes how much you trust an absence of alerts.
      deliverable: A SIEM pipeline map with the collection methods, buffering and scale considerations, a pipeline-monitoring approach, and an explanation of how architecture bounds trust in the data.
    expected_outcome: >
      You can describe a SIEM's data pipeline from collection to search, explain where data is lost or delayed,
      and reason about reliability, scale and coverage so you know the limits of the data and how much to trust
      an absence of alerts.
    quiz:
      - prompt: The stages of a SIEM data pipeline include
        options:
          - Only alerting
          - Collection, forwarding, parsing/normalisation, indexing and storage
          - Only storage
          - Only dashboards
        answer: 1
        explanation: Data flows through collection, transport, parsing, indexing and storage before it is searchable.
      - prompt: Why do forwarders and collectors buffer data?
        options:
          - To delete it
          - To prevent log loss during an ingestion spike or outage
          - To encrypt the disk
          - To slow it down
        answer: 1
        explanation: Buffering holds data when the platform is busy or briefly unavailable, preventing loss.
      - prompt: A source that stops sending events to the SIEM is
        options:
          - Always fine
          - Both an operational problem and a possible security signal (such as disabled logging)
          - Proof of a fast network
          - A storage upgrade
        answer: 1
        explanation: A quiet source may be a failed agent or an attacker disabling logging, so it warrants attention.
      - prompt: Understanding SIEM architecture helps an analyst because it reveals
        options:
          - Nothing useful
          - The limits of the data, what is collected, how current it is, and what might be missing
          - Only the vendor's price
          - The colour of dashboards
        answer: 1
        explanation: Knowing the pipeline tells you how complete and timely the data is, and how much to trust an absence of alerts.
