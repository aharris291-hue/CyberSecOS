slug: detection-engineering
title: Detection Engineering
domain: Detection Engineering
order: 9
description: >
  Detection engineers turn attacker behaviour into reliable alerts. Learn to
  write, test and tune portable detection rules with Sigma.
lessons:
  - slug: de-sigma-rules
    title: Writing and Testing Sigma Rules
    order: 1
    difficulty: intermediate
    summary: Write a Sigma rule for encoded PowerShell, convert it to KQL and tune false positives.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.4", "cysa:1.5", "sc200:2"]
    learning_objectives:
      - Describe the detection engineering lifecycle
      - Write a Sigma rule with logsource, detection and condition sections
      - Convert a Sigma rule to a SIEM query and tune it against real data
    theory: |
      A good detection is **specific** (few false positives), **robust** (hard to evade with
      trivial changes) and **documented** (an analyst knows what to do when it fires). The
      lifecycle is: research a technique, identify the telemetry, write the logic, test it
      against both malicious and normal activity, deploy, and tune as false positives appear.

      **Sigma** is an open, vendor-neutral format for detections, written in YAML. A rule has a
      `logsource` (product and category, for example windows / process_creation), a `detection`
      section with named selections, and a `condition` combining them. Tools like **sigma-cli**
      (pySigma) convert rules to KQL, Splunk SPL or Elastic queries, so one rule serves many SIEMs.

      Tuning is part of the job. Rather than deleting a noisy rule, add a filter for the known
      benign case (a specific management tool's path or parent process) and record why. Each
      rule should carry ATT&CK tags so coverage can be measured.
    examples:
      - title: A Sigma rule
        body: |
          title: Encoded PowerShell Command Line
          status: experimental
          logsource:
            product: windows
            category: process_creation
          detection:
            selection:
              Image|endswith: '\powershell.exe'
              CommandLine|contains:
                - ' -enc '
                - ' -EncodedCommand '
            condition: selection
          level: medium
          tags: [attack.execution, attack.t1059.001]
      - title: Converting to KQL
        body: |
          pip install sigma-cli
          sigma plugin install microsoft365defender
          sigma convert -t microsoft365defender encoded_powershell.yml
    exercise:
      title: Build, test and tune a detection
      environment: Python 3 on your computer, plus the Windows VM with Sysmon from earlier
      tools: [sigma-cli, PowerShell, Sysmon]
      steps:
        - Install sigma-cli with pip and install a backend plugin (for example microsoft365defender or splunk).
        - Write the encoded PowerShell rule from the examples in a file and validate it with `sigma check`.
        - Convert it with `sigma convert` and read the generated query.
        - In your Windows VM, run an encoded command and a normal PowerShell command; confirm your logic matches only the encoded one using Get-WinEvent against Sysmon event 1.
        - Evade your own rule by using `-e` instead of `-enc` and confirm it is missed.
        - Improve the rule to catch abbreviations (for example `|re` with a regular expression or more contains values) and retest.
        - Add a filter section for one benign case, document it in the description, and add ATT&CK tags.
      deliverable: The final Sigma rule, its converted query, and a test log showing true positive, evasion attempt and fixed result.
    expected_outcome: >
      You can author a portable detection, prove it fires on the behaviour and not on normal
      use, and harden it against simple evasions.
    quiz:
      - prompt: In a Sigma rule, which section states which logs the rule applies to?
        options: [detection, condition, logsource, falsepositives]
        answer: 2
        explanation: logsource defines the product, category or service the rule targets.
      - prompt: What is the main advantage of writing detections in Sigma?
        options:
          - It runs faster than KQL
          - One rule can be converted for many different SIEMs
          - It replaces the need for logs
          - It blocks attacks automatically
        answer: 1
        explanation: Sigma is vendor-neutral and converted to each platform's query language.
      - prompt: A rule fires constantly on a legitimate backup tool. The best first response is
        options:
          - Delete the rule
          - Add a documented filter for that specific benign case
          - Disable logging on the server
          - Raise the rule's severity
        answer: 1
        explanation: Targeted, documented exclusions keep coverage while removing noise.
      - prompt: A detection that misses `-e` but catches `-enc` lacks
        options: [Specificity, Robustness, Documentation, A severity level]
        answer: 1
        explanation: Robust detections survive trivial variations by the attacker.

  - slug: de-testing-coverage
    title: Testing Detections and Mapping Coverage
    order: 2
    difficulty: intermediate
    summary: Validate a detection against benign test activity, measure its precision, and map your rule set to MITRE ATT&CK to find coverage gaps.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.5", "cysa:3.1"]
    learning_objectives:
      - Validate a detection by generating the behaviour it should catch
      - Measure a detection's precision and recall and tune from the results
      - Map a rule set to MITRE ATT&CK to see and close coverage gaps
    theory: |
      Writing a detection is only half the job; an untested rule is a guess.
      **Detection validation** generates the behaviour a rule should catch in a safe
      lab and confirms the rule fires, then generates benign look-alike activity to
      confirm it does not. Teams do this with controlled, well-understood test actions
      (a benign script that writes a Run key, a safe simulation of a logon pattern)
      rather than real malware, so the signal is known in advance. This is the core of
      **detection-as-code**: rules live in version control, each has a documented test,
      and a change is reviewed and re-tested like any other code.

      Detections are measured, not assumed. **Precision** is how many alerts were real
      out of those raised; **recall** is how much of the real activity was caught. A
      rule with high recall but low precision floods the queue; one with high precision
      but low recall is quiet but misses things. Tuning moves a rule toward both using
      allow lists, better fields and thresholds, and every change is re-validated so a
      fix does not silently break detection. Tracking these numbers over time is part of
      **process improvement**: the SOC can show a rule getting better rather than just
      busier.

      Individual rules say nothing about overall **coverage**. Mapping every detection
      to a **MITRE ATT&CK** technique produces a heatmap showing which tactics and
      techniques are well covered, thinly covered, or blind. A **detection maturity**
      view then prioritises the gaps by how relevant each technique is to the
      organisation's real threats, so engineering builds the detection that closes the
      most important blind spot next rather than the easiest one. Coverage mapping turns
      a pile of rules into a deliberate, measurable program.
    examples:
      - title: A validation record for one rule
        body: |
          Rule: encoded PowerShell (-enc) execution
          Positive test: run a benign script with an -enc flag  -> rule fired (good)
          Negative test: run normal admin PowerShell            -> no alert (good)
          Result: precision improved after excluding a known deployment tool's -enc use
      - title: An ATT&CK coverage snapshot
        body: |
          Tactic                 Techniques covered / total   Note
          Execution              4 / 6                        PowerShell, WMI covered
          Persistence            2 / 8                        Run key, scheduled task only
          Lateral Movement       0 / 5                        blind spot -> build next
    exercise:
      title: Validate a detection and map your coverage to ATT&CK
      environment: Your detection lab (Sigma plus a SIEM, or a local rule set) on an isolated VM, and the free MITRE ATT&CK Navigator
      tools: [SIEM or Sigma, MITRE ATT&CK Navigator, a spreadsheet, a benign test script]
      steps:
        - Take an existing detection (for example your encoded-PowerShell Sigma rule) and write down exactly what behaviour should and should not trigger it.
        - In an isolated VM, generate the target behaviour with a benign, well-understood test action and confirm the rule fires; record the evidence.
        - Generate benign look-alike activity and confirm the rule stays quiet; if it fires, note the false positive and its cause.
        - Estimate the rule's precision and recall from your tests and make one tuning change (allow list, field or threshold), then re-validate both cases.
        - Map every detection you have to a MITRE ATT&CK technique in the Navigator and colour a simple coverage heatmap.
        - Identify your biggest blind spot and justify, using your organisation's likely threats, why it is the next detection to build.
        - Record the rule, its test, and the change in a version-controlled file (or a documented change entry) as detection-as-code.
      deliverable: The validation evidence (positive and negative tests), the precision/recall estimate and tuning result, and the ATT&CK coverage heatmap naming the next gap to close.
    expected_outcome: >
      You can prove a detection works with positive and negative tests, measure and tune
      its precision and recall, and map your rule set to ATT&CK so coverage gaps are
      visible and prioritised.
    quiz:
      - prompt: Why generate benign look-alike activity when testing a detection?
        options:
          - To fill up the logs
          - To confirm the rule does not raise false positives on normal behaviour
          - To replace the positive test
          - To slow the SIEM down
        answer: 1
        explanation: A negative test checks the rule stays quiet on benign activity, measuring false positives.
      - prompt: A detection with high recall but low precision will
        options:
          - Miss most real activity
          - Catch real activity but also flood the queue with false positives
          - Never fire
          - Run faster
        answer: 1
        explanation: High recall catches the activity; low precision means many of those alerts are false.
      - prompt: Mapping detections to MITRE ATT&CK mainly lets a team
        options:
          - Delete old rules
          - See which tactics and techniques are covered or blind and prioritise gaps
          - Avoid testing
          - Lower storage cost
        answer: 1
        explanation: Coverage mapping turns individual rules into a visible, prioritisable program.
      - prompt: Detection-as-code means detections are
        options:
          - Written only in a SIEM UI
          - Kept in version control with documented tests and reviewed changes
          - Never changed
          - Run manually each day
        answer: 1
        explanation: Treating rules like code adds versioning, tests and review so changes are safe and repeatable.
      - prompt: After tuning a detection, why re-validate it?
        options:
          - To use more compute
          - To confirm the change did not silently break the rule's detection
          - To reset its ATT&CK mapping
          - To clear the alert queue
        answer: 1
        explanation: Re-running the positive and negative tests ensures a fix still catches real activity.
  - slug: de-tuning-false-positives
    title: Tuning Detections and Cutting False Positives
    order: 3
    difficulty: intermediate
    summary: Take a noisy detection and make it trustworthy by measuring precision, tuning with context instead of blanket suppression, and managing the rule over its lifecycle.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "sc200:2"]
    learning_objectives:
      - Measure a detection with true/false positives and precision
      - Tune out noise with scoped context rather than blanket suppression
      - Manage a rule through its lifecycle so it stays trustworthy
    theory: |
      A detection that fires constantly is worse than none, because **alert fatigue**
      trains analysts to close alerts unread and the real one gets missed with the
      rest. Tuning is the discipline that keeps detections trustworthy. Start by
      measuring. A **true positive** is a real detection of the behaviour; a **false
      positive** is benign activity that matched; a **false negative** is the attack
      the rule missed. **Precision** is true positives over everything the rule fired
      (true plus false positives), and it answers the analyst's real question of
      whether an alert from this rule is worth opening.

      Tuning is not simply making a rule fire less. The goal is to drop the false
      positives while keeping the true ones, which means **scoped context** rather
      than a blanket mute. If a backup service legitimately triggers a credential-access
      rule, exclude that specific account on that specific host, not the whole technique.
      Good levers are **allowlisting** known-good identities or paths, **thresholds**
      and rate limits for noisy-but-sometimes-real behaviour, and **enrichment** that
      adds asset, identity or threat-intel context so the rule can be specific. Blanket
      suppression is a last resort because it quietly creates false negatives, which is
      how a tuned-away rule misses the real attack.

      Detections need **lifecycle management**. Each rule carries metadata such as its
      author, its **ATT&CK** mapping, its data source and its known false positives, so
      the next analyst understands it. Rules are version-controlled as **detection-as-code**
      and tested in CI (the previous lesson), reviewed on a schedule, and **retired**
      when the logging or the threat changes. A rule nobody trusts or maintains is
      **detection debt**, and removing it can be as valuable as writing a new one.
    examples:
      - title: Scoped tuning versus a blanket mute
        body: |
          Noisy rule: "LSASS access" fires on a backup agent every night.
          Blanket:  disable the rule           -> also blinds you to real credential theft
          Scoped:   exclude svc-backup on HOST-DB only, keep the rule everywhere else
      - title: Precision makes the noise concrete
        body: |
          Last 30 days: 60 alerts -> 6 true positives, 54 false positives
          Precision = 6 / 60 = 10%  (9 in 10 alerts are noise)
          After scoped tuning: 9 alerts -> 6 true, 3 false  -> precision 67%
    exercise:
      title: Tune a noisy detection and document its lifecycle
      environment: A detection rule and a sample of its alerts (reuse a Sigma rule from the earlier lessons, with real or invented alert outcomes) and a document or repo
      tools: [Your detection rules, a spreadsheet for the metrics, a text editor or git repo]
      steps:
        - Take one detection and label a sample of at least ten of its alerts as true or false positives.
        - Calculate the rule's precision from those labels and state in a sentence whether an analyst should trust it.
        - For the false positives, identify the specific benign cause (an account, host, path or schedule) rather than just calling them noise.
        - Write a scoped tuning change (an allowlist entry, a threshold, or an enrichment condition) that removes those false positives without muting the whole technique.
        - Explain what false negative a blanket suppression of this rule would risk, to justify the scoped approach.
        - Add lifecycle metadata to the rule: author, ATT&CK technique, data source, and a list of its known false positives.
        - Decide a review date and the condition under which you would retire the rule, and record it.
      deliverable: The before/after precision figures, the scoped tuning change, the rule's lifecycle metadata, and a stated review-or-retire condition.
    expected_outcome: >
      You can measure a detection's precision, cut its false positives with scoped
      context instead of blanket suppression, and manage it over its lifecycle so the
      SOC keeps trusting its alerts and does not accumulate detection debt.
    quiz:
      - prompt: A rule fired 40 times last month with 4 true positives and 36 false positives. Its precision is
        options:
          - 90%
          - 10%
          - 40%
          - 4%
        answer: 1
        explanation: Precision is true positives over all alerts fired, so 4 / 40 = 10%, meaning nine in ten alerts are noise.
      - prompt: Why is blanket suppression of a noisy rule a last resort?
        options:
          - It is slower to configure
          - It quietly creates false negatives, so real attacks are missed
          - It costs more to license
          - It changes the ATT&CK mapping
        answer: 1
        explanation: Muting the whole rule removes the true positives along with the noise, blinding the SOC to the real behaviour.
      - prompt: The best way to remove a recurring benign match is to
        options:
          - Delete the detection
          - Exclude the specific known-good account, host or path with scoped context
          - Raise every threshold to the maximum
          - Stop logging the data source
        answer: 1
        explanation: Scoped exclusions and enrichment drop the false positives while keeping the detection active for genuine activity.
      - prompt: A rule nobody trusts or maintains is best described as
        options: [A true positive, Detection debt worth retiring, A compensating control, An enrichment source]
        answer: 1
        explanation: Unmaintained, distrusted rules are detection debt, and retiring them can be as valuable as adding new coverage.

  - slug: de-alert-enrichment-correlation
    title: Enriching and Correlating Alerts
    order: 4
    difficulty: intermediate
    summary: Turn a bare detection into an actionable alert with context and correlation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "cysa:1.4", "sc200:2"]
    learning_objectives:
      - Explain why a raw detection needs enrichment before an analyst can act on it
      - List the context sources that make an alert actionable
      - Correlate and deduplicate related alerts into a single incident
    theory: |
      A detection rule fires on a pattern, but a bare alert, a username, an IP and a timestamp,
      forces the analyst to go and look everything up by hand. **Enrichment** adds that context
      automatically as the alert is created, so the analyst reads one record instead of pivoting
      across five tools. Good enrichment answers the obvious first questions before they are asked.

      The useful context sources are predictable. **Asset data** says what the host is and how
      important it is. **Identity data** says who the user is, their role and whether the account
      is privileged. **Threat intelligence** says whether an IP, domain or hash is already known
      bad. **Geolocation and history** say whether this is normal for this user. Mapping the
      detection to a framework such as **MITRE ATT&CK** tells the analyst what stage of an attack
      the behaviour belongs to.

      Enrichment is also how you fight alert fatigue. One intrusion often trips several rules, so
      **correlation** groups alerts that share an entity or a time window, and **deduplication**
      collapses repeats of the same thing into one. The result is fewer, richer alerts: an analyst
      opens a single incident that already carries the host, the user, the threat-intel verdict
      and the ATT&CK technique, and can make a decision instead of assembling facts.
    examples:
      - title: A bare alert versus an enriched one
        body: |
          Bare       login_failed  user=jsmith  src=203.0.113.9
          Enriched   login_failed  user=jsmith (Finance, non-admin)  src=203.0.113.9
                     threat-intel = known brute-force source, geo = different country
          The enriched alert answers who, from where and how risky before the analyst pivots.
      - title: Correlating repeats into one incident
        body: |
          40 login_failed alerts, same user, same source, within 3 minutes
          Correlation groups them as one brute-force incident rather than 40 tickets.
    exercise:
      title: Design the enrichment for one detection
      environment: A SIEM or notebook with sample alert, asset, identity and threat-intel data
      tools: [A sample alert feed, an asset or identity list, a threat-intel list, a notes file]
      steps:
        - Take one raw detection, such as a failed-login or suspicious-process alert, and list the fields it carries.
        - Write down the questions an analyst would have to look up by hand to triage it.
        - For each question, name the data source that answers it and the field you would join on.
        - Build the enriched alert on paper or in the tool, adding asset, identity and threat-intel context.
        - Map the detection to a MITRE ATT&CK technique and add that to the record.
        - Define a correlation rule that groups alerts sharing the same user and source inside a time window, and a deduplication key.
        - Compare the raw and enriched alerts and note how many pivots the enrichment saved.
      deliverable: An enriched-alert design listing each context field, its source, the ATT&CK mapping and the correlation and dedup keys.
    expected_outcome: >
      You can take a bare detection and specify the enrichment, ATT&CK mapping and
      correlation that turn it into a single actionable alert an analyst can decide on.
    quiz:
      - prompt: Why enrich an alert at creation time rather than leaving it bare?
        options:
          - To make the alert larger
          - So the analyst reads one record instead of pivoting across several tools
          - To slow the pipeline down
          - To avoid writing detection rules
        answer: 1
        explanation: Enrichment adds the context up front, so the analyst decides from one record rather than looking everything up by hand.
      - prompt: Which of these is an identity-context source for enrichment?
        options: [The user's role and whether the account is privileged, The office Wi-Fi password, The server's fan speed, The SIEM licence count]
        answer: 0
        explanation: Identity context is who the user is, their role and privilege level, which shapes how serious the alert is.
      - prompt: Forty identical failed-login alerts for one user in three minutes should be
        options: [Forty separate tickets, Correlated and deduplicated into one incident, Deleted, Ignored]
        answer: 1
        explanation: Correlation and deduplication collapse related and repeated alerts into a single incident, cutting fatigue.
      - prompt: Mapping a detection to MITRE ATT&CK tells the analyst
        options: [The server's uptime, What stage of an attack the behaviour belongs to, The cost of the SIEM, The user's salary]
        answer: 1
        explanation: An ATT&CK technique places the behaviour in the attack lifecycle, adding meaning to the alert.

  - slug: de-behavioural-anomaly-detection
    title: Behavioural and Anomaly-Based Detection
    order: 5
    difficulty: advanced
    summary: Detect attacks by how far behaviour strays from a baseline, not by a fixed signature.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Contrast signature-based detection with behavioural and anomaly-based detection
      - Build a baseline and choose a threshold that balances catching attacks against false positives
      - Say when a behavioural detection is the right tool and when it is not
    theory: |
      A signature detection fires on a known pattern, this command line or that file hash. It is
      precise but blind to anything new. **Behavioural** and **anomaly-based** detection take the
      opposite approach, learning what normal looks like and then alerting when something strays
      far enough from it. This catches attacks that have no signature yet, such as a user suddenly
      downloading ten times their usual data or logging in from a new country at 3am.

      The method rests on a **baseline**. You pick an entity (a user, a host, a service account) and
      a measure (bytes downloaded per day, distinct hosts contacted, logon hours) and learn its
      normal range over time. A detection then flags values far outside that range. Tools that do
      this across many entities and signals are often sold as **UEBA**, user and entity behaviour
      analytics, but the idea works with a simple statistical threshold too.

      The hard trade-off is the **threshold**. Set it tight and you drown in false positives as
      normal-but-rare behaviour trips it; set it loose and a real attack hides in the noise. So
      behavioural detection is best for things that genuinely have a stable normal and high impact
      when they change, such as privileged accounts, data egress and authentication, and a poor fit
      for noisy, ever-changing activity. In practice the two approaches are paired, signatures for
      the known and behaviour for the novel.
    examples:
      - title: A baseline deviation worth alerting on
        body: |
          user=jsmith  normal daily egress = 50-200 MB
          today = 9.4 GB to an external host
          The value is far outside the learned range, so it is flagged for review.
      - title: Tight versus loose threshold
        body: |
          Threshold at 2x normal    many false positives from busy-but-benign days
          Threshold at 20x normal   quieter, but a slow data theft stays under the line
          The threshold is a dial between missed attacks and analyst fatigue.
    exercise:
      title: Design a behavioural detection for one entity
      environment: A notebook or SIEM with sample per-user or per-host activity over time
      tools: [A sample activity dataset, a notebook or SIEM, a notes file]
      steps:
        - Pick one entity and one measure that should have a stable normal, such as daily data egress per user.
        - Build a baseline of that measure from the historical sample data and describe its normal range.
        - Choose a threshold for flagging a deviation and justify where you put it.
        - Run the detection over the sample and list what it flags.
        - For each flag, decide whether it is a real anomaly or normal-but-rare, and tune the threshold once.
        - Compare how a signature rule would have done on the same data and note what each approach catches.
        - State whether this measure is a good fit for behavioural detection and why.
      deliverable: A behavioural-detection design with the entity, measure, baseline, chosen threshold and the false-positive trade-off you made.
    expected_outcome: >
      You can build a baseline, set a defensible threshold, and judge when behavioural
      detection beats a signature and when it would only generate noise.
    quiz:
      - prompt: How does anomaly-based detection differ from signature-based detection?
        options:
          - It only works on malware hashes
          - It alerts on behaviour that strays far from a learned baseline rather than a known pattern
          - It needs no data
          - It is the same thing
        answer: 1
        explanation: Signatures match known patterns; anomaly detection learns normal and flags large deviations, catching novel activity.
      - prompt: Setting a behavioural threshold too tight tends to
        options: [Catch nothing at all, Produce many false positives from normal-but-rare activity, Delete the baseline, Disable signatures]
        answer: 1
        explanation: A tight threshold trips on benign but unusual behaviour, flooding analysts with false positives.
      - prompt: Which is the best fit for behavioural detection?
        options:
          - Noisy, ever-changing activity with no stable normal
          - A privileged account's data egress, which has a stable normal and high impact
          - A fixed, well-known malware hash
          - A static configuration file
        answer: 1
        explanation: Behavioural detection suits high-impact measures with a stable normal, such as privileged-account egress.
      - prompt: Signature and behavioural detection are best used
        options:
          - One instead of the other
          - "Together, signatures for the known and behaviour for the novel"
          - Never together
          - Only on weekends
        answer: 1
        explanation: They are complementary; signatures catch the known and behavioural detection catches what has no signature yet.

  - slug: de-detection-as-code
    title: Detection-as-Code and the Detection Lifecycle
    order: 6
    difficulty: intermediate
    summary: Manage detections like software with version control, review and CI validation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Explain why detections are managed as code once there are many of them
      - Describe the detection lifecycle from proposal through review, CI and deprecation
      - Say what continuous integration validates before a rule reaches production
    theory: |
      A handful of detections can live in a console, but once there are hundreds, editing them by
      hand there does not scale and nobody can say why a rule exists. Mature teams treat
      **detections as code**. Each rule is a file in **version control**, so every change has an
      author, a diff and a history, and ships only after a **pull request** that a second engineer
      reviews. The same discipline that protects application code now protects detections.

      **Continuous integration** is what makes this safe. When a rule changes, CI checks it
      automatically: that the syntax is valid, that it **fires on a sample of known-bad logs**, and
      that it **stays quiet on known-good** ones, before the change can merge. A rule that would
      break or flood analysts is caught in the pipeline rather than in production. Rules then roll
      out through **environments**, test first, then production, so a change is proven before it
      reaches the live SOC.

      The lifecycle does not end at deployment. Detections are **deprecated deliberately** when the
      data source they rely on goes away or the threat changes, instead of being left to rot and
      generate noise. Metrics, true-positive and false-positive rates and coverage, guide what to
      keep, tune or retire. The payoff is software discipline for detection: review catches
      mistakes, CI stops a bad rule reaching production, and the history explains every rule. This
      is the workflow around all the rules, distinct from writing or testing any single one.
    examples:
      - title: A rule change as a reviewed pull request
        body: |
          PR #214  detections/windows/lsass_access.yml  +threshold tweak
          author requests review; CI runs before anyone can merge
          Every detection change is authored, diffed and reviewed like code.
      - title: CI catching a bad rule
        body: |
          CI step   run rule against known-good sample
          result    FAILED  rule fired on 4,000 benign events
          CI blocks the merge, so the noisy rule never reaches production.
    exercise:
      title: Design a detection-as-code pipeline on paper
      environment: A notes or diagram file; no running pipeline required
      tools: [A sample detection rule, a notes or diagram tool]
      steps:
        - Describe how a new detection would be proposed and where the rule file would live.
        - Define the review step and who signs off before a rule can merge.
        - List the checks CI should run, including firing on known-bad and staying quiet on known-good samples.
        - Describe how a rule moves from a test environment to production.
        - Define when and how a rule is deprecated, and what metrics decide it.
        - Explain in one line how this workflow differs from writing or testing a single rule.
      deliverable: A one-page detection lifecycle covering proposal, review, CI checks, rollout, metrics and deprecation.
    expected_outcome: >
      You can describe a detection-as-code workflow, say what CI validates before a rule
      ships, and explain how the lifecycle keeps a large rule set reviewed and current.
    quiz:
      - prompt: Why manage detections as code in version control?
        options:
          - To make them secret
          - So every change has an author, a diff, a history and a review before it ships
          - To slow the SOC down
          - To avoid writing rules
        answer: 1
        explanation: Version control gives detections authorship, history and peer review, the same discipline as application code.
      - prompt: What should CI validate before a detection rule merges?
        options:
          - Only the file name
          - That it is valid, fires on known-bad samples and stays quiet on known-good ones
          - The analyst's password
          - The size of the SIEM
        answer: 1
        explanation: CI proves the rule works and will not flood analysts before it can reach production.
      - prompt: Deprecating a detection deliberately matters because
        options: [It never matters, A rule whose data source or threat has changed otherwise rots and generates noise, It deletes the SIEM, It disables CI]
        answer: 1
        explanation: Retiring stale rules on purpose keeps the rule set accurate instead of accumulating noisy dead detections.
      - prompt: Detection-as-code differs from writing a single rule in that it is
        options: [The same thing, The workflow and lifecycle around all the rules, A type of malware, A dashboard]
        answer: 1
        explanation: Detection-as-code is the review, CI, rollout and deprecation process around the whole rule set, not one rule.
  - slug: de-adversary-emulation
    title: Purple-Teaming to Drive Detections
    order: 7
    difficulty: intermediate
    summary: Use adversary emulation and purple-team exercises to find detection gaps and build evidence-backed detections for real attacker techniques.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Explain how adversary emulation and purple-teaming drive detection engineering
      - Run a safe emulation of an ATT&CK technique and capture the telemetry it produces
      - Turn an observed technique into a tested detection and measure coverage honestly
    theory: |
      Writing detections from imagination leaves gaps you cannot see. **Adversary emulation**
      closes them by safely reproducing real attacker techniques in your own environment and
      watching what telemetry they leave. A **purple team** is the collaboration that makes this
      productive: the **red** side runs the technique, the **blue** side watches whether it is
      detected, and the two work together in the open rather than red scoring points off blue.
      The output is not a report card but a list of concrete detection improvements.

      The method is **threat-informed**. You pick techniques that matter to your organisation,
      usually from **MITRE ATT&CK** and from the groups known to target your sector, and emulate
      them one at a time. Tools like Atomic Red Team provide small, reversible tests for individual
      techniques; a controlled lab or an explicitly authorised test window keeps it safe. For each
      technique you record three things: did an existing detection fire, what raw telemetry was
      produced (process events, command lines, network connections), and where the visibility gaps
      are. A technique that produced telemetry but no alert is a detection you are missing; a
      technique that produced no telemetry at all is a logging gap to fix first.

      Each gap then becomes a **tested detection**. You write the rule against the telemetry the
      emulation produced, confirm it fires on a re-run, and check it does not drown the analyst in
      false positives, the same discipline as any detection work. Mapping results back to ATT&CK
      lets you show **coverage honestly**: not "we cover ATT&CK" but "we detect these techniques,
      with this confidence, and here are the known gaps." Run regularly, purple-teaming turns a
      detection catalogue from a guess into something measured against real adversary behaviour.
    examples:
      - title: One emulated technique, three findings
        body: |
          Technique: T1059.001 PowerShell (encoded command)
          Fired?     no existing alert
          Telemetry: Event 4104 script block + process cmdline with -enc
          Result:    write a detection on encoded PowerShell; gap closed, re-test to confirm
      - title: Purple-team loop, not a scoreboard
        body: |
          Red:   runs the technique in an authorised window
          Blue:  checks SIEM/EDR for an alert and for raw telemetry
          Both:  agree the gap, build the detection, re-run until it fires cleanly
          Output: new tested detections + an honest coverage map, not a win/lose score
    exercise:
      title: Run a mini purple-team cycle on one technique
      environment: An isolated lab VM with endpoint logging and your SIEM/EDR (or sample telemetry), plus an authorised, reversible test such as an Atomic Red Team atomic
      tools: [A lab VM with logging, a SIEM or EDR, an adversary-emulation test (e.g. Atomic Red Team), a notes file]
      steps:
        - Choose one ATT&CK technique relevant to your environment and state why it matters and what telemetry you expect it to produce.
        - Confirm the test is safe and reversible and that you have authorisation and a logging-enabled lab to run it in.
        - Run the emulation and check whether any existing detection fired; record the result.
        - Collect the raw telemetry the technique produced (process events, command lines, network connections) and identify any logging gap where expected telemetry was missing.
        - Write a detection against that telemetry and re-run the emulation to confirm it fires, then check it against benign activity for false positives.
        - Map the technique and your result to ATT&CK and record it as detected (with confidence) or a remaining gap.
        - Summarise the coverage change and the next technique you would emulate.
      deliverable: A purple-team note covering the technique and expectation, whether it was detected, the telemetry and any logging gap, the new tested detection, and the honest ATT&CK coverage update.
    expected_outcome: >
      You can run a safe adversary emulation of an ATT&CK technique, capture the telemetry it
      produces, turn a gap into a tested detection, and report detection coverage honestly
      against real attacker behaviour.
    quiz:
      - prompt: How does purple-teaming improve detection engineering?
        options:
          - It replaces the SIEM
          - Red emulates real techniques while blue checks detection, producing concrete detection improvements
          - It scores red against blue
          - It removes the need for ATT&CK
        answer: 1
        explanation: Purple-teaming is a collaboration whose output is detection gaps closed, not a win/lose score.
      - prompt: A technique that produced telemetry but fired no alert is
        options:
          - Fully covered
          - A missing detection to build
          - A logging gap
          - A false positive
        answer: 1
        explanation: The telemetry exists, so a detection can and should be written against it.
      - prompt: A technique that produced no telemetry at all means you should first
        options:
          - Write a detection anyway
          - Fix the logging or visibility gap before a detection is even possible
          - Ignore the technique
          - Lower the severity
        answer: 1
        explanation: With no telemetry there is nothing to detect on, so visibility must be fixed first.
      - prompt: What does honest ATT&CK coverage reporting look like?
        options:
          - Claiming the whole matrix is covered
          - Stating which techniques are detected, with what confidence, and the known gaps
          - Hiding the gaps
          - Counting rules written
        answer: 1
        explanation: Honest coverage names detected techniques and remaining gaps rather than claiming blanket coverage.
  - slug: de-credential-access-detection
    title: Detecting Credential Access and Privilege Escalation
    order: 8
    difficulty: intermediate
    summary: Engineer detections for the credential-theft and privilege-escalation techniques that turn a foothold into domain control, where precision matters because admins do similar things.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Describe the main credential-access and privilege-escalation techniques to detect
      - Engineer detections that separate attacker behaviour from legitimate admin work
      - Tune these high-value detections for precision without missing the real thing
    theory: |
      Credential access is the hinge of most intrusions: it is how an attacker turns a single compromised
      host into the keys to the domain. The techniques are well known, so they are prime detection targets.
      **LSASS access** (dumping memory to steal hashes and tickets), **Kerberoasting** (requesting service
      tickets to crack offline), **DCSync** (abusing replication to pull password hashes from a domain
      controller), and local **privilege escalation** (token manipulation, abusing a vulnerable service or
      a UAC bypass) each leave characteristic telemetry, process access to LSASS, a burst of service-ticket
      requests, replication requests from a non-DC, or a child process spawned with elevated integrity.

      Engineering detections for these is high value but demands **precision**, because the legitimate twin
      is always close: backup and EDR tools read LSASS, domain controllers replicate constantly, and admins
      elevate privileges all day. A naive "alert on any LSASS access" drowns the analyst; a good detection
      narrows by *who* and *how*, an unexpected process (not the known AV) accessing LSASS, a DCSync-style
      replication request from a host that is not a domain controller, or Kerberoast-pattern ticket requests
      far above an account's baseline. The art is encoding the difference between the attack and its
      authorised look-alike into the rule.

      This is where the detection-engineering discipline pays off. These detections are tuned with
      **allow-lists** of known-good tools and service accounts, enriched with **asset context** (the same
      behaviour is far more alarming on a domain controller), and validated by **emulating the technique**
      to confirm the rule fires on the attack but stays quiet on routine admin work. Because the payoff of
      a true positive here is enormous, catching an intrusion before it reaches domain dominance, these
      detections are worth the effort to get precise, and they are re-tuned, never simply switched off, when
      they prove noisy.
    examples:
      - title: Narrowing an LSASS-access detection
        body: |
          Naive:  alert on ANY process opening lsass.exe -> floods on AV/EDR/backup
          Tuned:  alert when a process NOT on the known-good list opens lsass with read rights
          Encode the attacker/admin difference into the rule.
      - title: DCSync from the wrong place
        body: |
          Replication (DsGetNCChanges) request -> normal between domain controllers
          Same request from a workstation        -> DCSync abuse, high confidence
          Asset context (is the source a DC?) makes the detection precise.
    exercise:
      title: Engineer and tune a credential-access detection
      environment: A lab with endpoint/AD telemetry or sample logs, ideally with an emulation tool (such as an Atomic Red Team test) or provided attack and benign samples
      tools: [A SIEM/EDR or sample logs, an emulation test or attack/benign samples, a MITRE ATT&CK reference, a notes file]
      steps:
        - Choose one credential-access or privilege-escalation technique and describe the telemetry it produces and its legitimate twin.
        - Write a first-pass detection for it and identify why a naive version would be noisy.
        - Narrow the detection by who and how, using an allow-list of known-good tools or service accounts and asset context.
        - Emulate the technique (or use the attack sample) and confirm the detection fires on the attack.
        - Run the detection against benign/admin activity and confirm it stays quiet, tuning if it does not.
        - Map it to ATT&CK, note the asset context that raises its severity, and state how you would re-tune rather than disable it if it later proves noisy.
      deliverable: A tuned detection for one technique with its first-pass and narrowed versions, the emulation result showing it fires on the attack and not on benign activity, and the ATT&CK mapping with asset-context severity.
    expected_outcome: >
      You can engineer detections for LSASS access, Kerberoasting, DCSync and privilege escalation, encode
      the difference between the attack and its authorised look-alike, and tune them for precision so these
      high-value detections catch the real thing without drowning the analyst.
    quiz:
      - prompt: Why is credential access a high-value detection target?
        options:
          - It is harmless
          - It is how an attacker turns one compromised host into domain-wide control
          - It only affects printers
          - It cannot be detected
        answer: 1
        explanation: Stealing credentials enables privilege escalation and lateral movement to domain dominance.
      - prompt: Why must an LSASS-access detection be narrowed rather than alert on any access?
        options:
          - LSASS is never accessed
          - Legitimate tools (AV, EDR, backup) read LSASS, so a naive rule floods the analyst
          - Narrowing is impossible
          - It should be disabled
        answer: 1
        explanation: Precision separates the attacker from authorised tools that also touch LSASS.
      - prompt: A DCSync-style replication request is high-confidence malicious when it comes from
        options: [Another domain controller, A host that is not a domain controller, The backup server, The DNS server]
        answer: 1
        explanation: Replication is normal between DCs; from a workstation it indicates DCSync abuse.
      - prompt: When a high-value credential-access detection proves noisy, the right move is to
        options: [Disable it, Re-tune it with allow-lists and context rather than switch it off, Delete the logs, Lower all severities]
        answer: 1
        explanation: These detections are too valuable to drop, so they are tuned for precision instead of disabled.
  - slug: de-detection-tuning
    title: Reducing False Positives and Tuning Detections
    order: 9
    difficulty: intermediate
    summary: Make detections precise, tuning out false positives without silencing real threats, because an alert pipeline that cries wolf is as dangerous as having no detection at all.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.3", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Explain how alert fatigue from false positives harms security
      - Apply tuning techniques that cut noise without losing true positives
      - Measure a detection's quality and decide when to tune, not disable
    theory: |
      A detection that fires constantly on benign activity is not a minor annoyance; it is a security risk.
      **Alert fatigue** is real: when analysts face hundreds of false positives a day, they start to
      rubber-stamp or ignore alerts, and the one true positive in the pile gets closed with the rest. So the
      quality of a detection is not just whether it catches the attack, but whether it does so without
      drowning the team, and tuning, the deliberate reduction of false positives, is a core detection-engineering
      skill that directly improves the SOC's ability to catch real threats.

      The techniques are specific and preferred in roughly this order. First, **narrow the logic**: make the
      rule more precise so it matches the attack and not its benign twin, requiring a suspicious parent
      process, a specific argument, or a sequence rather than a single common event. Second, use
      **allow-lists** for the known-good causes, the backup tool that legitimately touches the files, the
      vulnerability scanner that trips the rule nightly, so those specific, verified cases are excluded by
      identity rather than by weakening the detection for everyone. Third, add **context and thresholds**,
      fire only when the behaviour exceeds a baseline, or raise severity with asset criticality, so routine
      low-level occurrences do not page anyone. The order matters: tightening logic and allow-listing
      specific causes keep the detection sharp, whereas crude broadening dulls it.

      Underpinning tuning is **measurement**. You cannot tune what you do not measure, so good teams track
      each detection's volume and its true-positive rate, and treat a detection that is all noise as a bug to
      fix, not a fact to live with. The crucial discipline, carried over from every detection lesson, is that
      the answer to a noisy high-value detection is to **tune it, never to disable it**: disabling blinds you
      to the attack it was built for. Equally, tuning must not quietly cut true positives, so each change is
      validated against known attack samples to confirm the detection still fires on the real thing. Precise,
      measured, continually tuned detections are what make an alert queue something analysts can actually
      trust and work.
    examples:
      - title: Tune by narrowing, not broadening
        body: |
          Noisy:  alert on any use of PsExec
          Tuned:  alert on PsExec from a non-admin host to many targets in a short window
          Sharper logic keeps the attack, drops the routine admin use.
      - title: Allow-list a specific known-good cause
        body: |
          Rule trips nightly on the vuln scanner's traffic
          Fix: exclude THAT scanner's identity/host -> noise gone
          Wrong fix: disable the rule -> blind to the real attack it catches
    exercise:
      title: Tune a noisy detection without losing coverage
      environment: A SIEM/EDR or sample alerts from a detection that is firing with many false positives, plus known attack samples or test events
      tools: [A SIEM/EDR or sample alerts, known attack/benign samples, a notes file]
      steps:
        - Take a noisy detection and review a sample of its alerts to identify the benign causes of the false positives.
        - Explain how alert fatigue from this detection could cause a real threat to be missed.
        - Tune it first by narrowing the logic so it better separates the attack from the benign twin.
        - Add an allow-list for a specific verified known-good cause and explain why that is better than broadening the rule.
        - Validate the tuned detection against a known attack sample to confirm it still fires on the real thing.
        - Define the metrics (alert volume, true-positive rate) you would track, and state why you tune rather than disable.
      deliverable: A tuning write-up identifying the false-positive causes, the narrowed logic and allow-list applied, a validation showing the attack is still caught, and the metrics plus the tune-not-disable rationale.
    expected_outcome: >
      You can reduce a detection's false positives by narrowing logic, allow-listing verified causes and
      adding context, validate that it still catches the real attack, measure its quality, and always tune
      rather than disable a noisy high-value detection.
    quiz:
      - prompt: Why is a detection that fires constantly on benign activity a security risk?
        options:
          - It uses disk space
          - Alert fatigue leads analysts to ignore or rubber-stamp alerts, so a real one gets missed
          - It is always wrong
          - It slows the network
        answer: 1
        explanation: Flooding analysts with false positives causes the true positive to be closed with the noise.
      - prompt: The preferred first tuning technique is to
        options:
          - Disable the rule
          - Narrow the logic so it matches the attack and not its benign twin
          - Lower every severity
          - Delete the logs
        answer: 1
        explanation: Tightening the logic keeps the detection sharp while removing benign matches.
      - prompt: Allow-listing a known-good cause is better than broadening the rule because
        options:
          - It is faster to type
          - It excludes a specific verified case by identity without weakening the detection for everyone
          - It disables the rule
          - It raises false positives
        answer: 1
        explanation: Excluding a specific verified cause preserves detection strength, unlike crude broadening.
      - prompt: When a high-value detection is noisy, the correct response is to
        options: [Disable it, Tune it and validate it still fires on real attacks, Ignore all its alerts, Delete the detection]
        answer: 1
        explanation: Disabling blinds you to the attack; tuning with validation keeps coverage while cutting noise.
