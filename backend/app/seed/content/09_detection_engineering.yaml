slug: detection-engineering
title: Detection Engineering
domain: Detection Engineering
order: 9
description: >
  Detection engineers turn attacker behaviour into reliable alerts. Learn to
  write, test and tune portable detection rules with Sigma.
lessons:
  - slug: de-sigma-rules
    title: Writing and Testing Sigma Rules
    order: 1
    difficulty: intermediate
    summary: Write a Sigma rule for encoded PowerShell, convert it to KQL and tune false positives.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.4", "cysa:1.5", "sc200:2"]
    learning_objectives:
      - Describe the detection engineering lifecycle
      - Write a Sigma rule with logsource, detection and condition sections
      - Convert a Sigma rule to a SIEM query and tune it against real data
    theory: |
      A good detection is **specific** (few false positives), **robust** (hard to evade with
      trivial changes) and **documented** (an analyst knows what to do when it fires). The
      lifecycle is: research a technique, identify the telemetry, write the logic, test it
      against both malicious and normal activity, deploy, and tune as false positives appear.

      **Sigma** is an open, vendor-neutral format for detections, written in YAML. A rule has a
      `logsource` (product and category, for example windows / process_creation), a `detection`
      section with named selections, and a `condition` combining them. Tools like **sigma-cli**
      (pySigma) convert rules to KQL, Splunk SPL or Elastic queries, so one rule serves many SIEMs.

      Tuning is part of the job. Rather than deleting a noisy rule, add a filter for the known
      benign case (a specific management tool's path or parent process) and record why. Each
      rule should carry ATT&CK tags so coverage can be measured.
    examples:
      - title: A Sigma rule
        body: |
          title: Encoded PowerShell Command Line
          status: experimental
          logsource:
            product: windows
            category: process_creation
          detection:
            selection:
              Image|endswith: '\powershell.exe'
              CommandLine|contains:
                - ' -enc '
                - ' -EncodedCommand '
            condition: selection
          level: medium
          tags: [attack.execution, attack.t1059.001]
      - title: Converting to KQL
        body: |
          pip install sigma-cli
          sigma plugin install microsoft365defender
          sigma convert -t microsoft365defender encoded_powershell.yml
    exercise:
      title: Build, test and tune a detection
      environment: Python 3 on your computer, plus the Windows VM with Sysmon from earlier
      tools: [sigma-cli, PowerShell, Sysmon]
      steps:
        - Install sigma-cli with pip and install a backend plugin (for example microsoft365defender or splunk).
        - Write the encoded PowerShell rule from the examples in a file and validate it with `sigma check`.
        - Convert it with `sigma convert` and read the generated query.
        - In your Windows VM, run an encoded command and a normal PowerShell command; confirm your logic matches only the encoded one using Get-WinEvent against Sysmon event 1.
        - Evade your own rule by using `-e` instead of `-enc` and confirm it is missed.
        - Improve the rule to catch abbreviations (for example `|re` with a regular expression or more contains values) and retest.
        - Add a filter section for one benign case, document it in the description, and add ATT&CK tags.
      deliverable: The final Sigma rule, its converted query, and a test log showing true positive, evasion attempt and fixed result.
    expected_outcome: >
      You can author a portable detection, prove it fires on the behaviour and not on normal
      use, and harden it against simple evasions.
    quiz:
      - prompt: In a Sigma rule, which section states which logs the rule applies to?
        options: [detection, condition, logsource, falsepositives]
        answer: 2
        explanation: logsource defines the product, category or service the rule targets.
      - prompt: What is the main advantage of writing detections in Sigma?
        options:
          - It runs faster than KQL
          - One rule can be converted for many different SIEMs
          - It replaces the need for logs
          - It blocks attacks automatically
        answer: 1
        explanation: Sigma is vendor-neutral and converted to each platform's query language.
      - prompt: A rule fires constantly on a legitimate backup tool. The best first response is
        options:
          - Delete the rule
          - Add a documented filter for that specific benign case
          - Disable logging on the server
          - Raise the rule's severity
        answer: 1
        explanation: Targeted, documented exclusions keep coverage while removing noise.
      - prompt: A detection that misses `-e` but catches `-enc` lacks
        options: [Specificity, Robustness, Documentation, A severity level]
        answer: 1
        explanation: Robust detections survive trivial variations by the attacker.

  - slug: de-testing-coverage
    title: Testing Detections and Mapping Coverage
    order: 2
    difficulty: intermediate
    summary: Validate a detection against benign test activity, measure its precision, and map your rule set to MITRE ATT&CK to find coverage gaps.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.5", "cysa:3.1"]
    learning_objectives:
      - Validate a detection by generating the behaviour it should catch
      - Measure a detection's precision and recall and tune from the results
      - Map a rule set to MITRE ATT&CK to see and close coverage gaps
    theory: |
      Writing a detection is only half the job; an untested rule is a guess.
      **Detection validation** generates the behaviour a rule should catch in a safe
      lab and confirms the rule fires, then generates benign look-alike activity to
      confirm it does not. Teams do this with controlled, well-understood test actions
      (a benign script that writes a Run key, a safe simulation of a logon pattern)
      rather than real malware, so the signal is known in advance. This is the core of
      **detection-as-code**: rules live in version control, each has a documented test,
      and a change is reviewed and re-tested like any other code.

      Detections are measured, not assumed. **Precision** is how many alerts were real
      out of those raised; **recall** is how much of the real activity was caught. A
      rule with high recall but low precision floods the queue; one with high precision
      but low recall is quiet but misses things. Tuning moves a rule toward both using
      allow lists, better fields and thresholds, and every change is re-validated so a
      fix does not silently break detection. Tracking these numbers over time is part of
      **process improvement**: the SOC can show a rule getting better rather than just
      busier.

      Individual rules say nothing about overall **coverage**. Mapping every detection
      to a **MITRE ATT&CK** technique produces a heatmap showing which tactics and
      techniques are well covered, thinly covered, or blind. A **detection maturity**
      view then prioritises the gaps by how relevant each technique is to the
      organisation's real threats, so engineering builds the detection that closes the
      most important blind spot next rather than the easiest one. Coverage mapping turns
      a pile of rules into a deliberate, measurable program.
    examples:
      - title: A validation record for one rule
        body: |
          Rule: encoded PowerShell (-enc) execution
          Positive test: run a benign script with an -enc flag  -> rule fired (good)
          Negative test: run normal admin PowerShell            -> no alert (good)
          Result: precision improved after excluding a known deployment tool's -enc use
      - title: An ATT&CK coverage snapshot
        body: |
          Tactic                 Techniques covered / total   Note
          Execution              4 / 6                        PowerShell, WMI covered
          Persistence            2 / 8                        Run key, scheduled task only
          Lateral Movement       0 / 5                        blind spot -> build next
    exercise:
      title: Validate a detection and map your coverage to ATT&CK
      environment: Your detection lab (Sigma plus a SIEM, or a local rule set) on an isolated VM, and the free MITRE ATT&CK Navigator
      tools: [SIEM or Sigma, MITRE ATT&CK Navigator, a spreadsheet, a benign test script]
      steps:
        - Take an existing detection (for example your encoded-PowerShell Sigma rule) and write down exactly what behaviour should and should not trigger it.
        - In an isolated VM, generate the target behaviour with a benign, well-understood test action and confirm the rule fires; record the evidence.
        - Generate benign look-alike activity and confirm the rule stays quiet; if it fires, note the false positive and its cause.
        - Estimate the rule's precision and recall from your tests and make one tuning change (allow list, field or threshold), then re-validate both cases.
        - Map every detection you have to a MITRE ATT&CK technique in the Navigator and colour a simple coverage heatmap.
        - Identify your biggest blind spot and justify, using your organisation's likely threats, why it is the next detection to build.
        - Record the rule, its test, and the change in a version-controlled file (or a documented change entry) as detection-as-code.
      deliverable: The validation evidence (positive and negative tests), the precision/recall estimate and tuning result, and the ATT&CK coverage heatmap naming the next gap to close.
    expected_outcome: >
      You can prove a detection works with positive and negative tests, measure and tune
      its precision and recall, and map your rule set to ATT&CK so coverage gaps are
      visible and prioritised.
    quiz:
      - prompt: Why generate benign look-alike activity when testing a detection?
        options:
          - To fill up the logs
          - To confirm the rule does not raise false positives on normal behaviour
          - To replace the positive test
          - To slow the SIEM down
        answer: 1
        explanation: A negative test checks the rule stays quiet on benign activity, measuring false positives.
      - prompt: A detection with high recall but low precision will
        options:
          - Miss most real activity
          - Catch real activity but also flood the queue with false positives
          - Never fire
          - Run faster
        answer: 1
        explanation: High recall catches the activity; low precision means many of those alerts are false.
      - prompt: Mapping detections to MITRE ATT&CK mainly lets a team
        options:
          - Delete old rules
          - See which tactics and techniques are covered or blind and prioritise gaps
          - Avoid testing
          - Lower storage cost
        answer: 1
        explanation: Coverage mapping turns individual rules into a visible, prioritisable program.
      - prompt: Detection-as-code means detections are
        options:
          - Written only in a SIEM UI
          - Kept in version control with documented tests and reviewed changes
          - Never changed
          - Run manually each day
        answer: 1
        explanation: Treating rules like code adds versioning, tests and review so changes are safe and repeatable.
      - prompt: After tuning a detection, why re-validate it?
        options:
          - To use more compute
          - To confirm the change did not silently break the rule's detection
          - To reset its ATT&CK mapping
          - To clear the alert queue
        answer: 1
        explanation: Re-running the positive and negative tests ensures a fix still catches real activity.
  - slug: de-tuning-false-positives
    title: Tuning Detections and Cutting False Positives
    order: 3
    difficulty: intermediate
    summary: Take a noisy detection and make it trustworthy by measuring precision, tuning with context instead of blanket suppression, and managing the rule over its lifecycle.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "sc200:2"]
    learning_objectives:
      - Measure a detection with true/false positives and precision
      - Tune out noise with scoped context rather than blanket suppression
      - Manage a rule through its lifecycle so it stays trustworthy
    theory: |
      A detection that fires constantly is worse than none, because **alert fatigue**
      trains analysts to close alerts unread and the real one gets missed with the
      rest. Tuning is the discipline that keeps detections trustworthy. Start by
      measuring. A **true positive** is a real detection of the behaviour; a **false
      positive** is benign activity that matched; a **false negative** is the attack
      the rule missed. **Precision** is true positives over everything the rule fired
      (true plus false positives), and it answers the analyst's real question of
      whether an alert from this rule is worth opening.

      Tuning is not simply making a rule fire less. The goal is to drop the false
      positives while keeping the true ones, which means **scoped context** rather
      than a blanket mute. If a backup service legitimately triggers a credential-access
      rule, exclude that specific account on that specific host, not the whole technique.
      Good levers are **allowlisting** known-good identities or paths, **thresholds**
      and rate limits for noisy-but-sometimes-real behaviour, and **enrichment** that
      adds asset, identity or threat-intel context so the rule can be specific. Blanket
      suppression is a last resort because it quietly creates false negatives, which is
      how a tuned-away rule misses the real attack.

      Detections need **lifecycle management**. Each rule carries metadata such as its
      author, its **ATT&CK** mapping, its data source and its known false positives, so
      the next analyst understands it. Rules are version-controlled as **detection-as-code**
      and tested in CI (the previous lesson), reviewed on a schedule, and **retired**
      when the logging or the threat changes. A rule nobody trusts or maintains is
      **detection debt**, and removing it can be as valuable as writing a new one.
    examples:
      - title: Scoped tuning versus a blanket mute
        body: |
          Noisy rule: "LSASS access" fires on a backup agent every night.
          Blanket:  disable the rule           -> also blinds you to real credential theft
          Scoped:   exclude svc-backup on HOST-DB only, keep the rule everywhere else
      - title: Precision makes the noise concrete
        body: |
          Last 30 days: 60 alerts -> 6 true positives, 54 false positives
          Precision = 6 / 60 = 10%  (9 in 10 alerts are noise)
          After scoped tuning: 9 alerts -> 6 true, 3 false  -> precision 67%
    exercise:
      title: Tune a noisy detection and document its lifecycle
      environment: A detection rule and a sample of its alerts (reuse a Sigma rule from the earlier lessons, with real or invented alert outcomes) and a document or repo
      tools: [Your detection rules, a spreadsheet for the metrics, a text editor or git repo]
      steps:
        - Take one detection and label a sample of at least ten of its alerts as true or false positives.
        - Calculate the rule's precision from those labels and state in a sentence whether an analyst should trust it.
        - For the false positives, identify the specific benign cause (an account, host, path or schedule) rather than just calling them noise.
        - Write a scoped tuning change (an allowlist entry, a threshold, or an enrichment condition) that removes those false positives without muting the whole technique.
        - Explain what false negative a blanket suppression of this rule would risk, to justify the scoped approach.
        - Add lifecycle metadata to the rule: author, ATT&CK technique, data source, and a list of its known false positives.
        - Decide a review date and the condition under which you would retire the rule, and record it.
      deliverable: The before/after precision figures, the scoped tuning change, the rule's lifecycle metadata, and a stated review-or-retire condition.
    expected_outcome: >
      You can measure a detection's precision, cut its false positives with scoped
      context instead of blanket suppression, and manage it over its lifecycle so the
      SOC keeps trusting its alerts and does not accumulate detection debt.
    quiz:
      - prompt: A rule fired 40 times last month with 4 true positives and 36 false positives. Its precision is
        options:
          - 90%
          - 10%
          - 40%
          - 4%
        answer: 1
        explanation: Precision is true positives over all alerts fired, so 4 / 40 = 10%, meaning nine in ten alerts are noise.
      - prompt: Why is blanket suppression of a noisy rule a last resort?
        options:
          - It is slower to configure
          - It quietly creates false negatives, so real attacks are missed
          - It costs more to license
          - It changes the ATT&CK mapping
        answer: 1
        explanation: Muting the whole rule removes the true positives along with the noise, blinding the SOC to the real behaviour.
      - prompt: The best way to remove a recurring benign match is to
        options:
          - Delete the detection
          - Exclude the specific known-good account, host or path with scoped context
          - Raise every threshold to the maximum
          - Stop logging the data source
        answer: 1
        explanation: Scoped exclusions and enrichment drop the false positives while keeping the detection active for genuine activity.
      - prompt: A rule nobody trusts or maintains is best described as
        options: [A true positive, Detection debt worth retiring, A compensating control, An enrichment source]
        answer: 1
        explanation: Unmaintained, distrusted rules are detection debt, and retiring them can be as valuable as adding new coverage.

  - slug: de-alert-enrichment-correlation
    title: Enriching and Correlating Alerts
    order: 4
    difficulty: intermediate
    summary: Turn a bare detection into an actionable alert with context and correlation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "cysa:1.4", "sc200:2"]
    learning_objectives:
      - Explain why a raw detection needs enrichment before an analyst can act on it
      - List the context sources that make an alert actionable
      - Correlate and deduplicate related alerts into a single incident
    theory: |
      A detection rule fires on a pattern, but a bare alert, a username, an IP and a timestamp,
      forces the analyst to go and look everything up by hand. **Enrichment** adds that context
      automatically as the alert is created, so the analyst reads one record instead of pivoting
      across five tools. Good enrichment answers the obvious first questions before they are asked.

      The useful context sources are predictable. **Asset data** says what the host is and how
      important it is. **Identity data** says who the user is, their role and whether the account
      is privileged. **Threat intelligence** says whether an IP, domain or hash is already known
      bad. **Geolocation and history** say whether this is normal for this user. Mapping the
      detection to a framework such as **MITRE ATT&CK** tells the analyst what stage of an attack
      the behaviour belongs to.

      Enrichment is also how you fight alert fatigue. One intrusion often trips several rules, so
      **correlation** groups alerts that share an entity or a time window, and **deduplication**
      collapses repeats of the same thing into one. The result is fewer, richer alerts: an analyst
      opens a single incident that already carries the host, the user, the threat-intel verdict
      and the ATT&CK technique, and can make a decision instead of assembling facts.
    examples:
      - title: A bare alert versus an enriched one
        body: |
          Bare       login_failed  user=jsmith  src=203.0.113.9
          Enriched   login_failed  user=jsmith (Finance, non-admin)  src=203.0.113.9
                     threat-intel = known brute-force source, geo = different country
          The enriched alert answers who, from where and how risky before the analyst pivots.
      - title: Correlating repeats into one incident
        body: |
          40 login_failed alerts, same user, same source, within 3 minutes
          Correlation groups them as one brute-force incident rather than 40 tickets.
    exercise:
      title: Design the enrichment for one detection
      environment: A SIEM or notebook with sample alert, asset, identity and threat-intel data
      tools: [A sample alert feed, an asset or identity list, a threat-intel list, a notes file]
      steps:
        - Take one raw detection, such as a failed-login or suspicious-process alert, and list the fields it carries.
        - Write down the questions an analyst would have to look up by hand to triage it.
        - For each question, name the data source that answers it and the field you would join on.
        - Build the enriched alert on paper or in the tool, adding asset, identity and threat-intel context.
        - Map the detection to a MITRE ATT&CK technique and add that to the record.
        - Define a correlation rule that groups alerts sharing the same user and source inside a time window, and a deduplication key.
        - Compare the raw and enriched alerts and note how many pivots the enrichment saved.
      deliverable: An enriched-alert design listing each context field, its source, the ATT&CK mapping and the correlation and dedup keys.
    expected_outcome: >
      You can take a bare detection and specify the enrichment, ATT&CK mapping and
      correlation that turn it into a single actionable alert an analyst can decide on.
    quiz:
      - prompt: Why enrich an alert at creation time rather than leaving it bare?
        options:
          - To make the alert larger
          - So the analyst reads one record instead of pivoting across several tools
          - To slow the pipeline down
          - To avoid writing detection rules
        answer: 1
        explanation: Enrichment adds the context up front, so the analyst decides from one record rather than looking everything up by hand.
      - prompt: Which of these is an identity-context source for enrichment?
        options: [The user's role and whether the account is privileged, The office Wi-Fi password, The server's fan speed, The SIEM licence count]
        answer: 0
        explanation: Identity context is who the user is, their role and privilege level, which shapes how serious the alert is.
      - prompt: Forty identical failed-login alerts for one user in three minutes should be
        options: [Forty separate tickets, Correlated and deduplicated into one incident, Deleted, Ignored]
        answer: 1
        explanation: Correlation and deduplication collapse related and repeated alerts into a single incident, cutting fatigue.
      - prompt: Mapping a detection to MITRE ATT&CK tells the analyst
        options: [The server's uptime, What stage of an attack the behaviour belongs to, The cost of the SIEM, The user's salary]
        answer: 1
        explanation: An ATT&CK technique places the behaviour in the attack lifecycle, adding meaning to the alert.

  - slug: de-behavioural-anomaly-detection
    title: Behavioural and Anomaly-Based Detection
    order: 5
    difficulty: advanced
    summary: Detect attacks by how far behaviour strays from a baseline, not by a fixed signature.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Contrast signature-based detection with behavioural and anomaly-based detection
      - Build a baseline and choose a threshold that balances catching attacks against false positives
      - Say when a behavioural detection is the right tool and when it is not
    theory: |
      A signature detection fires on a known pattern, this command line or that file hash. It is
      precise but blind to anything new. **Behavioural** and **anomaly-based** detection take the
      opposite approach, learning what normal looks like and then alerting when something strays
      far enough from it. This catches attacks that have no signature yet, such as a user suddenly
      downloading ten times their usual data or logging in from a new country at 3am.

      The method rests on a **baseline**. You pick an entity (a user, a host, a service account) and
      a measure (bytes downloaded per day, distinct hosts contacted, logon hours) and learn its
      normal range over time. A detection then flags values far outside that range. Tools that do
      this across many entities and signals are often sold as **UEBA**, user and entity behaviour
      analytics, but the idea works with a simple statistical threshold too.

      The hard trade-off is the **threshold**. Set it tight and you drown in false positives as
      normal-but-rare behaviour trips it; set it loose and a real attack hides in the noise. So
      behavioural detection is best for things that genuinely have a stable normal and high impact
      when they change, such as privileged accounts, data egress and authentication, and a poor fit
      for noisy, ever-changing activity. In practice the two approaches are paired, signatures for
      the known and behaviour for the novel.
    examples:
      - title: A baseline deviation worth alerting on
        body: |
          user=jsmith  normal daily egress = 50-200 MB
          today = 9.4 GB to an external host
          The value is far outside the learned range, so it is flagged for review.
      - title: Tight versus loose threshold
        body: |
          Threshold at 2x normal    many false positives from busy-but-benign days
          Threshold at 20x normal   quieter, but a slow data theft stays under the line
          The threshold is a dial between missed attacks and analyst fatigue.
    exercise:
      title: Design a behavioural detection for one entity
      environment: A notebook or SIEM with sample per-user or per-host activity over time
      tools: [A sample activity dataset, a notebook or SIEM, a notes file]
      steps:
        - Pick one entity and one measure that should have a stable normal, such as daily data egress per user.
        - Build a baseline of that measure from the historical sample data and describe its normal range.
        - Choose a threshold for flagging a deviation and justify where you put it.
        - Run the detection over the sample and list what it flags.
        - For each flag, decide whether it is a real anomaly or normal-but-rare, and tune the threshold once.
        - Compare how a signature rule would have done on the same data and note what each approach catches.
        - State whether this measure is a good fit for behavioural detection and why.
      deliverable: A behavioural-detection design with the entity, measure, baseline, chosen threshold and the false-positive trade-off you made.
    expected_outcome: >
      You can build a baseline, set a defensible threshold, and judge when behavioural
      detection beats a signature and when it would only generate noise.
    quiz:
      - prompt: How does anomaly-based detection differ from signature-based detection?
        options:
          - It only works on malware hashes
          - It alerts on behaviour that strays far from a learned baseline rather than a known pattern
          - It needs no data
          - It is the same thing
        answer: 1
        explanation: Signatures match known patterns; anomaly detection learns normal and flags large deviations, catching novel activity.
      - prompt: Setting a behavioural threshold too tight tends to
        options: [Catch nothing at all, Produce many false positives from normal-but-rare activity, Delete the baseline, Disable signatures]
        answer: 1
        explanation: A tight threshold trips on benign but unusual behaviour, flooding analysts with false positives.
      - prompt: Which is the best fit for behavioural detection?
        options:
          - Noisy, ever-changing activity with no stable normal
          - A privileged account's data egress, which has a stable normal and high impact
          - A fixed, well-known malware hash
          - A static configuration file
        answer: 1
        explanation: Behavioural detection suits high-impact measures with a stable normal, such as privileged-account egress.
      - prompt: Signature and behavioural detection are best used
        options:
          - One instead of the other
          - "Together, signatures for the known and behaviour for the novel"
          - Never together
          - Only on weekends
        answer: 1
        explanation: They are complementary; signatures catch the known and behavioural detection catches what has no signature yet.

  - slug: de-detection-as-code
    title: Detection-as-Code and the Detection Lifecycle
    order: 6
    difficulty: intermediate
    summary: Manage detections like software with version control, review and CI validation.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "cysa:1.5", "cysa:3.1", "sc200:2", "secplus:4.7"]
    learning_objectives:
      - Explain why detections are managed as code once there are many of them
      - Describe the detection lifecycle from proposal through review, CI and deprecation
      - Say what continuous integration validates before a rule reaches production
    theory: |
      A handful of detections can live in a console, but once there are hundreds, editing them by
      hand there does not scale and nobody can say why a rule exists. Mature teams treat
      **detections as code**. Each rule is a file in **version control**, so every change has an
      author, a diff and a history, and ships only after a **pull request** that a second engineer
      reviews. The same discipline that protects application code now protects detections.

      **Continuous integration** is what makes this safe. When a rule changes, CI checks it
      automatically: that the syntax is valid, that it **fires on a sample of known-bad logs**, and
      that it **stays quiet on known-good** ones, before the change can merge. A rule that would
      break or flood analysts is caught in the pipeline rather than in production. Rules then roll
      out through **environments**, test first, then production, so a change is proven before it
      reaches the live SOC.

      The lifecycle does not end at deployment. Detections are **deprecated deliberately** when the
      data source they rely on goes away or the threat changes, instead of being left to rot and
      generate noise. Metrics, true-positive and false-positive rates and coverage, guide what to
      keep, tune or retire. The payoff is software discipline for detection: review catches
      mistakes, CI stops a bad rule reaching production, and the history explains every rule. This
      is the workflow around all the rules, distinct from writing or testing any single one.
    examples:
      - title: A rule change as a reviewed pull request
        body: |
          PR #214  detections/windows/lsass_access.yml  +threshold tweak
          author requests review; CI runs before anyone can merge
          Every detection change is authored, diffed and reviewed like code.
      - title: CI catching a bad rule
        body: |
          CI step   run rule against known-good sample
          result    FAILED  rule fired on 4,000 benign events
          CI blocks the merge, so the noisy rule never reaches production.
    exercise:
      title: Design a detection-as-code pipeline on paper
      environment: A notes or diagram file; no running pipeline required
      tools: [A sample detection rule, a notes or diagram tool]
      steps:
        - Describe how a new detection would be proposed and where the rule file would live.
        - Define the review step and who signs off before a rule can merge.
        - List the checks CI should run, including firing on known-bad and staying quiet on known-good samples.
        - Describe how a rule moves from a test environment to production.
        - Define when and how a rule is deprecated, and what metrics decide it.
        - Explain in one line how this workflow differs from writing or testing a single rule.
      deliverable: A one-page detection lifecycle covering proposal, review, CI checks, rollout, metrics and deprecation.
    expected_outcome: >
      You can describe a detection-as-code workflow, say what CI validates before a rule
      ships, and explain how the lifecycle keeps a large rule set reviewed and current.
    quiz:
      - prompt: Why manage detections as code in version control?
        options:
          - To make them secret
          - So every change has an author, a diff, a history and a review before it ships
          - To slow the SOC down
          - To avoid writing rules
        answer: 1
        explanation: Version control gives detections authorship, history and peer review, the same discipline as application code.
      - prompt: What should CI validate before a detection rule merges?
        options:
          - Only the file name
          - That it is valid, fires on known-bad samples and stays quiet on known-good ones
          - The analyst's password
          - The size of the SIEM
        answer: 1
        explanation: CI proves the rule works and will not flood analysts before it can reach production.
      - prompt: Deprecating a detection deliberately matters because
        options: [It never matters, A rule whose data source or threat has changed otherwise rots and generates noise, It deletes the SIEM, It disables CI]
        answer: 1
        explanation: Retiring stale rules on purpose keeps the rule set accurate instead of accumulating noisy dead detections.
      - prompt: Detection-as-code differs from writing a single rule in that it is
        options: [The same thing, The workflow and lifecycle around all the rules, A type of malware, A dashboard]
        answer: 1
        explanation: Detection-as-code is the review, CI, rollout and deprecation process around the whole rule set, not one rule.
  - slug: de-adversary-emulation
    title: Purple-Teaming to Drive Detections
    order: 7
    difficulty: intermediate
    summary: Use adversary emulation and purple-team exercises to find detection gaps and build evidence-backed detections for real attacker techniques.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Explain how adversary emulation and purple-teaming drive detection engineering
      - Run a safe emulation of an ATT&CK technique and capture the telemetry it produces
      - Turn an observed technique into a tested detection and measure coverage honestly
    theory: |
      Writing detections from imagination leaves gaps you cannot see. **Adversary emulation**
      closes them by safely reproducing real attacker techniques in your own environment and
      watching what telemetry they leave. A **purple team** is the collaboration that makes this
      productive: the **red** side runs the technique, the **blue** side watches whether it is
      detected, and the two work together in the open rather than red scoring points off blue.
      The output is not a report card but a list of concrete detection improvements.

      The method is **threat-informed**. You pick techniques that matter to your organisation,
      usually from **MITRE ATT&CK** and from the groups known to target your sector, and emulate
      them one at a time. Tools like Atomic Red Team provide small, reversible tests for individual
      techniques; a controlled lab or an explicitly authorised test window keeps it safe. For each
      technique you record three things: did an existing detection fire, what raw telemetry was
      produced (process events, command lines, network connections), and where the visibility gaps
      are. A technique that produced telemetry but no alert is a detection you are missing; a
      technique that produced no telemetry at all is a logging gap to fix first.

      Each gap then becomes a **tested detection**. You write the rule against the telemetry the
      emulation produced, confirm it fires on a re-run, and check it does not drown the analyst in
      false positives, the same discipline as any detection work. Mapping results back to ATT&CK
      lets you show **coverage honestly**: not "we cover ATT&CK" but "we detect these techniques,
      with this confidence, and here are the known gaps." Run regularly, purple-teaming turns a
      detection catalogue from a guess into something measured against real adversary behaviour.
    examples:
      - title: One emulated technique, three findings
        body: |
          Technique: T1059.001 PowerShell (encoded command)
          Fired?     no existing alert
          Telemetry: Event 4104 script block + process cmdline with -enc
          Result:    write a detection on encoded PowerShell; gap closed, re-test to confirm
      - title: Purple-team loop, not a scoreboard
        body: |
          Red:   runs the technique in an authorised window
          Blue:  checks SIEM/EDR for an alert and for raw telemetry
          Both:  agree the gap, build the detection, re-run until it fires cleanly
          Output: new tested detections + an honest coverage map, not a win/lose score
    exercise:
      title: Run a mini purple-team cycle on one technique
      environment: An isolated lab VM with endpoint logging and your SIEM/EDR (or sample telemetry), plus an authorised, reversible test such as an Atomic Red Team atomic
      tools: [A lab VM with logging, a SIEM or EDR, an adversary-emulation test (e.g. Atomic Red Team), a notes file]
      steps:
        - Choose one ATT&CK technique relevant to your environment and state why it matters and what telemetry you expect it to produce.
        - Confirm the test is safe and reversible and that you have authorisation and a logging-enabled lab to run it in.
        - Run the emulation and check whether any existing detection fired; record the result.
        - Collect the raw telemetry the technique produced (process events, command lines, network connections) and identify any logging gap where expected telemetry was missing.
        - Write a detection against that telemetry and re-run the emulation to confirm it fires, then check it against benign activity for false positives.
        - Map the technique and your result to ATT&CK and record it as detected (with confidence) or a remaining gap.
        - Summarise the coverage change and the next technique you would emulate.
      deliverable: A purple-team note covering the technique and expectation, whether it was detected, the telemetry and any logging gap, the new tested detection, and the honest ATT&CK coverage update.
    expected_outcome: >
      You can run a safe adversary emulation of an ATT&CK technique, capture the telemetry it
      produces, turn a gap into a tested detection, and report detection coverage honestly
      against real attacker behaviour.
    quiz:
      - prompt: How does purple-teaming improve detection engineering?
        options:
          - It replaces the SIEM
          - Red emulates real techniques while blue checks detection, producing concrete detection improvements
          - It scores red against blue
          - It removes the need for ATT&CK
        answer: 1
        explanation: Purple-teaming is a collaboration whose output is detection gaps closed, not a win/lose score.
      - prompt: A technique that produced telemetry but fired no alert is
        options:
          - Fully covered
          - A missing detection to build
          - A logging gap
          - A false positive
        answer: 1
        explanation: The telemetry exists, so a detection can and should be written against it.
      - prompt: A technique that produced no telemetry at all means you should first
        options:
          - Write a detection anyway
          - Fix the logging or visibility gap before a detection is even possible
          - Ignore the technique
          - Lower the severity
        answer: 1
        explanation: With no telemetry there is nothing to detect on, so visibility must be fixed first.
      - prompt: What does honest ATT&CK coverage reporting look like?
        options:
          - Claiming the whole matrix is covered
          - Stating which techniques are detected, with what confidence, and the known gaps
          - Hiding the gaps
          - Counting rules written
        answer: 1
        explanation: Honest coverage names detected techniques and remaining gaps rather than claiming blanket coverage.
  - slug: de-credential-access-detection
    title: Detecting Credential Access and Privilege Escalation
    order: 8
    difficulty: intermediate
    summary: Engineer detections for the credential-theft and privilege-escalation techniques that turn a foothold into domain control, where precision matters because admins do similar things.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Describe the main credential-access and privilege-escalation techniques to detect
      - Engineer detections that separate attacker behaviour from legitimate admin work
      - Tune these high-value detections for precision without missing the real thing
    theory: |
      Credential access is the hinge of most intrusions: it is how an attacker turns a single compromised
      host into the keys to the domain. The techniques are well known, so they are prime detection targets.
      **LSASS access** (dumping memory to steal hashes and tickets), **Kerberoasting** (requesting service
      tickets to crack offline), **DCSync** (abusing replication to pull password hashes from a domain
      controller), and local **privilege escalation** (token manipulation, abusing a vulnerable service or
      a UAC bypass) each leave characteristic telemetry, process access to LSASS, a burst of service-ticket
      requests, replication requests from a non-DC, or a child process spawned with elevated integrity.

      Engineering detections for these is high value but demands **precision**, because the legitimate twin
      is always close: backup and EDR tools read LSASS, domain controllers replicate constantly, and admins
      elevate privileges all day. A naive "alert on any LSASS access" drowns the analyst; a good detection
      narrows by *who* and *how*, an unexpected process (not the known AV) accessing LSASS, a DCSync-style
      replication request from a host that is not a domain controller, or Kerberoast-pattern ticket requests
      far above an account's baseline. The art is encoding the difference between the attack and its
      authorised look-alike into the rule.

      This is where the detection-engineering discipline pays off. These detections are tuned with
      **allow-lists** of known-good tools and service accounts, enriched with **asset context** (the same
      behaviour is far more alarming on a domain controller), and validated by **emulating the technique**
      to confirm the rule fires on the attack but stays quiet on routine admin work. Because the payoff of
      a true positive here is enormous, catching an intrusion before it reaches domain dominance, these
      detections are worth the effort to get precise, and they are re-tuned, never simply switched off, when
      they prove noisy.
    examples:
      - title: Narrowing an LSASS-access detection
        body: |
          Naive:  alert on ANY process opening lsass.exe -> floods on AV/EDR/backup
          Tuned:  alert when a process NOT on the known-good list opens lsass with read rights
          Encode the attacker/admin difference into the rule.
      - title: DCSync from the wrong place
        body: |
          Replication (DsGetNCChanges) request -> normal between domain controllers
          Same request from a workstation        -> DCSync abuse, high confidence
          Asset context (is the source a DC?) makes the detection precise.
    exercise:
      title: Engineer and tune a credential-access detection
      environment: A lab with endpoint/AD telemetry or sample logs, ideally with an emulation tool (such as an Atomic Red Team test) or provided attack and benign samples
      tools: [A SIEM/EDR or sample logs, an emulation test or attack/benign samples, a MITRE ATT&CK reference, a notes file]
      steps:
        - Choose one credential-access or privilege-escalation technique and describe the telemetry it produces and its legitimate twin.
        - Write a first-pass detection for it and identify why a naive version would be noisy.
        - Narrow the detection by who and how, using an allow-list of known-good tools or service accounts and asset context.
        - Emulate the technique (or use the attack sample) and confirm the detection fires on the attack.
        - Run the detection against benign/admin activity and confirm it stays quiet, tuning if it does not.
        - Map it to ATT&CK, note the asset context that raises its severity, and state how you would re-tune rather than disable it if it later proves noisy.
      deliverable: A tuned detection for one technique with its first-pass and narrowed versions, the emulation result showing it fires on the attack and not on benign activity, and the ATT&CK mapping with asset-context severity.
    expected_outcome: >
      You can engineer detections for LSASS access, Kerberoasting, DCSync and privilege escalation, encode
      the difference between the attack and its authorised look-alike, and tune them for precision so these
      high-value detections catch the real thing without drowning the analyst.
    quiz:
      - prompt: Why is credential access a high-value detection target?
        options:
          - It is harmless
          - It is how an attacker turns one compromised host into domain-wide control
          - It only affects printers
          - It cannot be detected
        answer: 1
        explanation: Stealing credentials enables privilege escalation and lateral movement to domain dominance.
      - prompt: Why must an LSASS-access detection be narrowed rather than alert on any access?
        options:
          - LSASS is never accessed
          - Legitimate tools (AV, EDR, backup) read LSASS, so a naive rule floods the analyst
          - Narrowing is impossible
          - It should be disabled
        answer: 1
        explanation: Precision separates the attacker from authorised tools that also touch LSASS.
      - prompt: A DCSync-style replication request is high-confidence malicious when it comes from
        options: [Another domain controller, A host that is not a domain controller, The backup server, The DNS server]
        answer: 1
        explanation: Replication is normal between DCs; from a workstation it indicates DCSync abuse.
      - prompt: When a high-value credential-access detection proves noisy, the right move is to
        options: [Disable it, Re-tune it with allow-lists and context rather than switch it off, Delete the logs, Lower all severities]
        answer: 1
        explanation: These detections are too valuable to drop, so they are tuned for precision instead of disabled.
  - slug: de-lateral-movement-detection
    title: Detecting Lateral Movement and Remote Execution
    order: 9
    difficulty: intermediate
    summary: Engineer detections for how attackers move host-to-host, remote services, SMB, WMI, RDP and remote scheduled tasks, where the techniques ride the same channels administrators use every day.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Describe the main lateral-movement and remote-execution techniques
      - Engineer detections that separate attacker movement from admin activity
      - Use correlation and asset context to make these detections precise
    theory: |
      Once an attacker has one host, they spread, and **lateral movement** is how a single compromise becomes
      many. The techniques are a defined set: **remote service creation** and **WMI** to run code on another
      machine, **SMB** to copy tools and access admin shares, **RDP** for interactive access, **remote
      scheduled tasks**, and credential reuse (pass-the-hash) to authenticate as they go. These are prime
      detection targets because they sit between initial access and the objective, catch them and you break the
      attack before it reaches its goal, but they are hard because every one of these channels is also how
      administrators legitimately manage machines.

      Engineering detections here means encoding the difference between the attacker and the admin. The signals
      are in the pattern: remote execution spawned by an unexpected parent, a service created remotely with a
      random name, one host suddenly authenticating to many others in a short window (the fan-out that admins
      rarely produce), RDP from a workstation that never initiates RDP, or WMI invoking a command interpreter.
      A naive "alert on any remote service creation" drowns the analyst in legitimate administration; a good
      detection narrows by source (is this a known management host?), by the command run, and by volume and
      timing, so it fires on the attacker's spread and stays quiet for the admin's routine.

      Two techniques make these detections precise. **Correlation** combines the weak individual signals, one
      remote logon is nothing, but a remote logon plus a new service plus an outbound connection, same source,
      short window, is movement, so a correlation rule across those events is far stronger than any single one.
      **Asset context** sharpens severity: the same WMI execution is routine from the admin jump host and
      alarming from a finance workstation, and movement toward a domain controller or critical server
      outranks movement between desktops. As with every detection, these are tuned not disabled when noisy, and
      validated by emulating the technique to confirm they fire on the attack. Lateral-movement detection is
      where correlation and context earn their keep, because the raw events are ordinary and only their pattern
      and placement reveal the intrusion.
    examples:
      - title: The admin twin problem
        body: |
          remote service creation -> admin deploying software OR attacker running a tool
          same channel, different intent
          narrow by: source host, command, volume, timing -> keep the attacker, drop the admin
      - title: Correlating weak signals into movement
        body: |
          remote logon (weak) + new service (weak) + outbound (weak)
          same source host, 2-minute window -> strong "lateral movement" alert
          asset context: target = domain controller -> raise severity
    exercise:
      title: Engineer a lateral-movement detection with correlation and context
      environment: A lab with endpoint/AD telemetry or sample logs containing lateral movement and benign admin activity, ideally with an emulation tool
      tools: [A SIEM/EDR or sample logs, an emulation test or attack/benign samples, a MITRE ATT&CK reference, a notes file]
      steps:
        - List the main lateral-movement and remote-execution techniques and the telemetry each produces.
        - Choose one technique and describe its legitimate administrative twin and why a naive rule would be noisy.
        - Engineer a detection that narrows by source, command and volume or timing to separate attacker movement from admin activity.
        - Strengthen it with a correlation rule combining several weak signals from the same source in a short window.
        - Add asset context so the severity reflects the target (for example movement toward a domain controller).
        - Emulate or replay the technique to confirm the detection fires on the attack and stays quiet on benign admin activity.
      deliverable: A tuned lateral-movement detection with its narrowing logic, a correlation rule over weak signals, asset-context severity, and a validation showing it fires on the attack but not on routine administration.
    expected_outcome: >
      You can engineer detections for lateral movement and remote execution, encode the difference between the
      attacker and the administrator who uses the same channels, and use correlation and asset context to make
      these detections precise.
    quiz:
      - prompt: Why are lateral-movement techniques prime detection targets?
        options:
          - They are harmless
          - They sit between initial access and the objective, so catching them breaks the attack before it reaches its goal
          - They cannot be logged
          - They only occur after encryption
        answer: 1
        explanation: Detecting movement interrupts the attack mid-chain, before it reaches critical systems.
      - prompt: Lateral-movement detections are hard because the channels (SMB, WMI, RDP, remote services) are
        options:
          - Never used
          - Also how administrators legitimately manage machines
          - Always encrypted
          - Only on domain controllers
        answer: 1
        explanation: The same channels serve legitimate administration, so detections must separate attacker from admin.
      - prompt: Correlating a remote logon, a new service and an outbound connection from one source in a short window is stronger than any single event because
        options:
          - It uses more storage
          - Each signal is weak alone but together they form a reliable movement pattern
          - It ignores context
          - It disables the rule
        answer: 1
        explanation: Correlation combines weak signals into a high-confidence detection of movement.
      - prompt: Asset context improves a lateral-movement detection by
        options:
          - Deleting events
          - Raising severity when the target is critical, such as movement toward a domain controller
          - Removing the baseline
          - Slowing the SIEM
        answer: 1
        explanation: The same technique matters more against critical assets, so context sharpens severity.
  - slug: de-exfil-c2-detection
    title: Detecting Data Exfiltration and Command-and-Control
    order: 10
    difficulty: intermediate
    summary: Engineer detections for how attackers talk to their infrastructure and steal data, beaconing, tunnelling and large or unusual outbound transfers, where the traffic hides among normal activity.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Describe command-and-control and exfiltration techniques and their signals
      - Engineer detections for beaconing, tunnelling and anomalous transfers
      - Use baselines and enrichment to separate malicious egress from normal traffic
    theory: |
      Two late-stage behaviours give an attacker away if you can see egress: **command-and-control** (C2), the
      channel malware uses to receive instructions, and **exfiltration**, the theft of data out of the
      environment. Both have to cross the boundary outbound, which is the defender's opportunity, but both also
      try hard to blend into normal traffic, hiding in HTTPS, DNS, or ordinary-looking web requests. Engineering
      detections for them means knowing their signatures and encoding them in a way that separates the malicious
      flow from the enormous volume of legitimate outbound traffic.

      C2 has characteristic patterns. **Beaconing** is the strongest: malware checks in on a regular interval, so
      a host making connections to the same destination at suspiciously regular timing (even with jitter) stands
      out from human-driven traffic. Other tells are connections to newly registered or low-reputation domains,
      unusual user-agents, long-lived connections, and protocol mismatches (non-DNS data over port 53, non-web
      traffic over 443). **Exfiltration** shows as volume and destination anomalies: a host uploading far more
      than it ever has, large transfers to cloud storage or unfamiliar destinations, data moving at odd hours, or
      slow **low-and-slow** trickles designed to stay under thresholds. DNS and encrypted channels are abused for
      both, which is why egress visibility and decryption or metadata analysis matter.

      Making these detections work relies on **baselines** and **enrichment**, because raw egress is huge and
      mostly benign. A beaconing detection needs a baseline of normal connection timing; an exfiltration detection
      needs a baseline of normal upload volume per host so "far more than usual" has meaning. Enriching flows with
      domain reputation, newly-seen-domain flags, and destination categorisation turns a bare connection into
      "this host beaconed to a domain registered yesterday" that an analyst can judge fast. As with every
      detection, these are tuned not disabled when noisy (a backup job legitimately uploads a lot; a software
      updater beacons regularly), validated against known patterns, and sharpened with asset context. Detecting
      C2 and exfiltration is where egress monitoring pays off, catching the attacker at the two moments they must
      reach outside.
    examples:
      - title: Beaconing stands out from human traffic
        body: |
          human browsing: irregular, bursty
          beacon: connect to same host every ~60s (+/- jitter), tiny payloads
          Regular timing to one destination is the signal.
      - title: Exfiltration as a volume anomaly
        body: |
          host baseline upload: ~50 MB/day
          today: 8 GB to an unfamiliar cloud bucket at 03:00
          "far more than usual" only has meaning against the baseline.
    exercise:
      title: Engineer C2 and exfiltration detections
      environment: A SIEM/EDR or sample network/proxy/DNS logs containing beaconing or exfiltration among benign traffic
      tools: [A SIEM or notebook, sample egress logs, a domain-reputation or enrichment source, a MITRE ATT&CK reference, a notes file]
      steps:
        - Describe the signals of command-and-control (beaconing, low-reputation domains, protocol mismatch) and of exfiltration (volume and destination anomalies).
        - Engineer a beaconing detection and explain the timing baseline it needs to separate malware check-ins from human traffic.
        - Engineer an exfiltration detection and explain the per-host upload baseline it needs for "far more than usual" to mean something.
        - Enrich the flows with domain reputation and newly-seen-domain flags and show how that speeds an analyst's judgement.
        - Identify a legitimate cause that would make each detection noisy (backup job, software updater) and tune rather than disable it.
        - Validate the detections against the known patterns in the data and map them to ATT&CK.
      deliverable: Two tuned detections (beaconing and exfiltration) with the baselines and enrichment they rely on, the benign causes handled by tuning, and a validation mapped to ATT&CK.
    expected_outcome: >
      You can engineer detections for command-and-control and exfiltration, using timing and volume baselines
      and egress enrichment to separate malicious beaconing and transfers from the large volume of legitimate
      outbound traffic.
    quiz:
      - prompt: Why are C2 and exfiltration good detection opportunities?
        options:
          - They never cross the network boundary
          - Both must cross the boundary outbound, giving the defender a chance to see them
          - They only happen offline
          - They cannot be logged
        answer: 1
        explanation: Both behaviours require outbound communication, which egress monitoring can observe.
      - prompt: Beaconing is detectable mainly by
        options:
          - Its huge bandwidth
          - Regular connection timing to the same destination, unlike bursty human traffic
          - Its use of email
          - The absence of any connection
        answer: 1
        explanation: Malware check-ins occur at regular intervals, which stands out from human-driven patterns.
      - prompt: An exfiltration detection needs a per-host upload baseline because
        options:
          - Baselines are decorative
          - A spike only has meaning relative to what that host normally uploads
          - It disables logging
          - All hosts upload the same amount
        answer: 1
        explanation: Volume anomalies require a baseline of normal per-host upload to be meaningful.
      - prompt: A legitimate cause that can make a beaconing detection noisy is
        options: [A firewall, A software updater that checks in on a regular interval, A disabled service, A printer]
        answer: 1
        explanation: Regular-interval updaters resemble beaconing, so the detection is tuned rather than disabled.
  - slug: de-persistence-detection
    title: Detecting Persistence Mechanisms
    order: 11
    difficulty: intermediate
    summary: Engineer detections for how attackers survive a reboot, autostart entries, scheduled tasks, services, account creation and more, where the challenge is that the system is full of legitimate persistence.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Describe the main persistence mechanisms attackers use
      - Engineer detections that separate malicious from legitimate persistence
      - Use baselining and change detection to find new persistence
    theory: |
      An attacker who gains access wants to **keep** it across reboots and logoffs, and **persistence** is how
      they do it. The mechanisms are a well-catalogued set: autostart locations (registry run keys, startup
      folders), **scheduled tasks**, **services**, new or modified **accounts**, and more subtle methods like
      hijacking how a legitimate program loads a library or handles an event. Detecting persistence is high
      value because it catches an attacker establishing a foothold they intend to reuse, and because
      persistence is often set up early, catching it can interrupt an intrusion before its objective.

      The difficulty is that systems are **full of legitimate persistence**. Software installs services,
      schedules update tasks, and adds autostart entries all the time, so an alert on "a new scheduled task"
      or "a new service" drowns the analyst. The engineering problem is to separate the attacker's persistence
      from the constant background of legitimate autostart activity. The signals that help: a persistence entry
      pointing at an unusual location (a user temp directory, not a program-files path), created by an
      unexpected process, with an obfuscated or script-based command, or appearing on a host where that
      software is not installed. Enrichment with what is normal for the environment, which services and tasks
      are expected on this class of machine, turns "a new task" into "a new task no other machine has".

      Two approaches make these detections work. **Baselining and change detection** are especially powerful
      for persistence: because the set of autostart entries on a given system is relatively stable, a tool that
      snapshots the baseline and alerts on **new or changed** entries surfaces exactly the additions worth
      examining, rather than every entry. And **behavioural context** sharpens it, a scheduled task created by
      a Office document or a service whose binary lives in a temp folder is suspicious regardless of the rest.
      As with every detection, these are tuned against known-good software behaviour and validated by emulating
      the persistence techniques. Detecting persistence is a cornerstone of endpoint detection, because almost
      every intrusion establishes some, and the defender who catches the foothold catches the attacker before
      they can comfortably return.
    examples:
      - title: Legitimate persistence is everywhere
        body: |
          software installs services, schedules update tasks, adds run keys (constant, benign)
          naive alert on "new service" -> floods
          signal: new task pointing at a temp dir, odd parent, obfuscated command.
      - title: Baseline and change detection
        body: |
          snapshot autostart entries (stable set) -> alert on NEW/changed only
          "a new task no other machine of this class has" stands out
          behavioural context: task created by WINWORD.EXE -> suspicious regardless.
    exercise:
      title: Engineer a persistence detection with baselining
      environment: A lab with endpoint telemetry or sample logs/autostart snapshots containing malicious and benign persistence, ideally with an emulation tool
      tools: [A SIEM/EDR or sample logs and autostart snapshots, an emulation test or samples, a MITRE ATT&CK reference, a notes file]
      steps:
        - List the main persistence mechanisms and the telemetry each produces.
        - Choose one mechanism and explain why a naive "new entry" alert would be too noisy given legitimate persistence.
        - Engineer a detection that narrows by location, creating process, command characteristics and environment baseline.
        - Apply baselining or change detection so only new or changed autostart entries are surfaced.
        - Add behavioural context (such as a task created by an Office document) to sharpen the detection.
        - Emulate the persistence technique to confirm the detection fires on it and stays quiet on legitimate software, mapping to ATT&CK.
      deliverable: A tuned persistence detection with its narrowing logic, a baselining/change-detection approach, behavioural context, and a validation showing it fires on the technique but not on normal software, mapped to ATT&CK.
    expected_outcome: >
      You can engineer detections for the common persistence mechanisms, separate malicious from the abundant
      legitimate persistence using baselining and behavioural context, and validate the detections by
      emulating the techniques.
    quiz:
      - prompt: Why is detecting persistence high value?
        options:
          - It is rare
          - It catches an attacker establishing a foothold they intend to reuse, often early in the intrusion
          - It only matters after encryption
          - Persistence cannot be detected
        answer: 1
        explanation: Catching persistence interrupts the attacker's ability to return and often comes early in the attack.
      - prompt: The main difficulty in detecting persistence is that
        options:
          - Persistence never happens
          - Systems are full of legitimate persistence (software services, update tasks, autostart entries)
          - Logs are unavailable
          - It requires no tuning
        answer: 1
        explanation: Constant legitimate autostart activity means naive alerts drown the analyst.
      - prompt: Baselining and change detection help with persistence because
        options:
          - They delete entries
          - The set of autostart entries is relatively stable, so alerting on new or changed ones surfaces the additions worth examining
          - They disable logging
          - They ignore new entries
        answer: 1
        explanation: A stable baseline makes new or changed autostart entries stand out as the items to investigate.
      - prompt: A scheduled task whose binary lives in a user temp folder, created by an Office document, is
        options: [Routine, Suspicious regardless of the rest, worth detecting, A backup, A normal update]
        answer: 1
        explanation: Unusual location and parent process make such persistence suspicious on its own.
  - slug: de-evasion-detection
    title: Detecting Defense Evasion and Log Tampering
    order: 12
    difficulty: intermediate
    summary: Engineer detections for the actions attackers take to hide, clearing logs, disabling security tools, tampering with agents, where the evasion itself, and the silence it creates, are the signals.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.4", "cysa:3.1", "sc200:2"]
    learning_objectives:
      - Describe the defense-evasion actions worth detecting
      - Engineer detections for tampering and for suspicious absence of data
      - Build "something stopped reporting" detections that catch silent evasion
    theory: |
      Attackers work to avoid detection, and those evasion actions are themselves highly detectable if you build
      for them. Where threat hunting looks for evasion reactively, detection engineering builds the standing
      detections that catch it automatically: clearing event logs, stopping or tampering with security agents
      (EDR, antivirus), adding exclusions to security tools, disabling audit policy, and killing logging
      services. These are high-value detections because few legitimate activities clear logs or disable the EDR,
      so a well-built detection here has a strong signal-to-noise ratio and often catches an intrusion right at
      the moment the attacker tries to go dark.

      The direct detections target the tampering **events** themselves. Operating systems and security tools
      emit telltale signals: the Windows event that records the log being cleared, EDR self-protection alerts
      when its service or files are tampered with, events for audit-policy changes, and service-stop events for
      security services. Engineering these is largely about knowing which events to watch and enriching them,
      a log-clear or an EDR-disable is suspicious almost regardless of context, so these can be high-severity
      with little tuning, though you still allow-list the rare legitimate cause (an authorised reimage,
      maintenance by a known admin process).

      The subtler and more powerful class detects the **absence** evasion creates. The hardest evasion to catch
      with event-based rules is when the attacker succeeds in stopping the telemetry, there is no event because
      the sensor is gone. The answer is detections built on expectation: a host that always reported and
      suddenly stops, an EDR agent that misses its regular check-in, a log source whose volume drops to zero,
      an endpoint that disappears from the fleet. These "something that should be here is not" detections turn
      silence into signal, and they are essential because a capable attacker's whole aim is to produce that
      silence. As with all detections, these are tuned against legitimate causes (a machine powered off, a
      maintenance window) and validated by emulating the evasion. Detecting defense evasion, both the tampering
      events and the suspicious silence, is a cornerstone of catching sophisticated attackers who assume that
      going dark makes them safe.
    examples:
      - title: Direct tampering detections
        body: |
          event-log cleared / EDR service stopped / AV exclusion added / audit policy disabled
          few legitimate causes -> high severity, little tuning
          allow-list the rare authorised case (reimage, known admin process).
      - title: Absence as the detection
        body: |
          host that always reported -> stops; EDR misses its check-in; log volume -> 0
          no event, because the sensor is gone -> detect the SILENCE
          "something that should be here is not" turns going-dark into a signal.
    exercise:
      title: Engineer tampering and absence detections
      environment: A SIEM/EDR or sample logs with security-tool and logging telemetry, including tampering and a source going silent, ideally with an emulation tool
      tools: [A SIEM/EDR or sample logs, an emulation test or samples, a MITRE ATT&CK reference, a notes file]
      steps:
        - List the defense-evasion actions worth detecting and the telltale event each produces.
        - Engineer a direct detection for one tampering action (log clear, EDR disable, audit-policy change) and set an appropriate severity.
        - Allow-list the rare legitimate cause for that action and explain why it needs little other tuning.
        - Engineer an absence-based detection (a host or log source that stops reporting, an EDR missing its check-in) and explain why it catches what event rules cannot.
        - Tune the absence detection against legitimate causes (powered-off machines, maintenance windows).
        - Emulate the evasion to validate both detections fire, and map them to ATT&CK defense-evasion techniques.
      deliverable: Two detections, one for a tampering event and one for suspicious absence, with severities, allow-lists and tuning, validated by emulation and mapped to ATT&CK.
    expected_outcome: >
      You can engineer detections for defense-evasion tampering events and, crucially, for the suspicious
      absence of data that a successful evasion creates, turning an attacker's attempt to go dark into a
      high-value signal.
    quiz:
      - prompt: Why are defense-evasion actions good detection targets?
        options:
          - They are very common and benign
          - Few legitimate activities clear logs or disable the EDR, so detections here have a strong signal
          - They cannot be detected
          - They only occur offline
        answer: 1
        explanation: Because evasion actions are rarely legitimate, detections for them are high-signal and need little tuning.
      - prompt: The hardest evasion to catch with event-based rules is when the attacker
        options:
          - Makes lots of noise
          - Succeeds in stopping the telemetry, so there is no event to match
          - Uses a known signature
          - Sends an email
        answer: 1
        explanation: If the sensor is disabled there is no event, so you must detect the resulting absence.
      - prompt: An "absence" detection works by
        options:
          - Matching a malicious signature
          - Alerting when something that should be reporting (a host, an EDR agent, a log source) goes silent
          - Deleting logs
          - Ignoring quiet sources
        answer: 1
        explanation: Expectation-based detections turn the silence a successful evasion creates into a signal.
      - prompt: A direct tampering detection such as "event log cleared" can be
        options: [Low priority always, High severity with little tuning, since few legitimate activities clear logs, Disabled safely, Ignored]
        answer: 1
        explanation: Log-clearing is rarely legitimate, so it warrants a high-severity, low-tuning detection with a small allow-list.
  - slug: de-initial-access-detection
    title: Detecting Initial Access and Phishing
    order: 13
    difficulty: advanced
    summary: Engineer detections for the initial-access tactic, covering phishing delivery, malicious attachments and links, and the first-stage execution that follows a successful lure.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Identify the data sources that reveal initial access and phishing
      - Engineer detections for delivery and first-stage execution
      - Balance coverage against false positives for high-volume email and web activity
    theory: |
      **Initial access** is the tactic by which an attacker first gets into an environment, and because so many
      intrusions begin with **phishing**, detecting this stage well pays off disproportionately: catching an
      attacker at delivery or first execution stops the whole chain before persistence or lateral movement. The
      challenge is that the raw material (email and web traffic) is enormous and almost entirely legitimate, so
      detection engineering here is as much about controlling false positives as about coverage. The data sources
      are email security logs (sender, authentication results such as SPF/DKIM/DMARC, attachment and URL
      verdicts), web proxy logs (what links were clicked and where they led), and endpoint telemetry (what the
      opened attachment or downloaded file actually did).

      Effective detections target the **behaviours**, not just known-bad indicators which rotate quickly. At
      **delivery**, signals include messages failing sender authentication, display-name spoofing of executives,
      newly registered sender domains, and attachments of risky types or with macros. At **click/first stage**,
      the highest-value detections sit on the endpoint: an Office application spawning a script interpreter
      (`winword.exe` launching `powershell.exe`), a document process writing and executing a file, a browser
      download immediately executing, or a LNK or ISO file launching a hidden payload. These behavioural
      detections survive indicator churn because they catch the mechanism of the lure rather than a specific file
      hash. Correlating a suspicious email with a subsequent endpoint behaviour on the recipient's host is a
      powerful, high-confidence signal.

      The engineering discipline is **tuning for a noisy domain**. A rule that fires on every macro-enabled
      document will drown the SOC, so detections are scoped (unexpected parent-child process relationships,
      execution from temporary paths, external senders combined with risky actions) and enriched (was the sender
      external, was the domain newly registered, did the user actually interact). Coverage is measured against the
      initial-access techniques in ATT&CK, and gaps (for example no detection for malicious OneNote or container
      files) are prioritised by what current threat intelligence shows attackers using. The goal is a small set
      of high-confidence, behaviour-based detections that catch the lure's mechanics while leaving ordinary email
      and browsing unflagged.
    examples:
      - title: Where to detect initial access
        body: |
          delivery  -> email logs: SPF/DKIM/DMARC fails, display-name spoof, new domain, risky attachment
          first stage -> endpoint: winword.exe -> powershell.exe, doc writes+runs a file, LNK/ISO launches payload
          correlate suspicious email + later endpoint behaviour on recipient -> high confidence.
      - title: Behaviour over indicators
        body: |
          hash/domain blocklist -> rotates fast, misses the next variant
          behaviour (Office spawns script interpreter) -> catches the mechanism regardless of the file
          -> prefer behavioural detections, enrich to cut false positives.
    exercise:
      title: Engineer initial-access detections
      environment: A described environment with email, proxy and endpoint telemetry (or a scenario)
      tools: [A scenario or sample email/endpoint events, the ATT&CK reference, a document, a notes file]
      steps:
        - Identify the data sources that reveal phishing delivery and first-stage execution.
        - Write a delivery-stage detection idea (for example external sender failing DMARC with a macro attachment).
        - Write an endpoint first-stage detection idea (for example an Office app spawning a script interpreter).
        - Explain why behaviour-based detections outlast indicator-based ones for this tactic.
        - Describe how you would correlate a suspicious email with later endpoint activity for higher confidence.
        - Propose one tuning or enrichment step to keep false positives manageable in this high-volume domain.
      deliverable: A set of initial-access detection ideas across delivery and first stage, a correlation approach, and a tuning or enrichment plan to control false positives.
    expected_outcome: >
      You can identify the telemetry for initial access and phishing, engineer behaviour-based detections for
      delivery and first-stage execution, correlate email and endpoint signals, and tune for a high-volume domain.
    quiz:
      - prompt: Detecting an attacker at initial access is high value because it
        options:
          - Is the easiest stage
          - Stops the attack chain before persistence and lateral movement develop
          - Requires no data
          - Only matters after data theft
        answer: 1
        explanation: Catching delivery or first execution prevents the whole later chain.
      - prompt: A high-value endpoint signal for a successful phishing lure is
        options:
          - A normal system update
          - An Office application spawning a script interpreter such as PowerShell
          - A user reading email
          - A scheduled backup
        answer: 1
        explanation: Office spawning a script interpreter is a classic first-stage execution behaviour.
      - prompt: Behaviour-based detections are preferred for initial access because
        options:
          - They never fire
          - They catch the mechanism of the lure and survive the fast churn of file hashes and domains
          - Indicators never change
          - They need no tuning
        answer: 1
        explanation: Behaviours persist while specific indicators rotate quickly, so they catch new variants.
      - prompt: The main engineering challenge for initial-access detection is
        options:
          - There is no relevant data
          - Email and web traffic are huge and mostly legitimate, so controlling false positives is as important as coverage
          - Attackers never phish
          - Endpoints have no logs
        answer: 1
        explanation: The domain is high-volume and benign-heavy, so false-positive control is central.
  - slug: de-privilege-escalation-detection
    title: Detecting Privilege Escalation
    order: 14
    difficulty: advanced
    summary: Engineer detections for the privilege-escalation tactic across Windows and Linux, covering token and UAC abuse, sudo and SUID abuse, service and scheduled-task abuse, and exploitation of misconfigurations.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Identify common privilege-escalation techniques on Windows and Linux
      - Engineer behaviour-based detections for them
      - Reduce false positives by distinguishing legitimate administration
    theory: |
      **Privilege escalation** is the tactic by which an attacker turns a low-privileged foothold into
      administrative or root control, and detecting it well is high value because it sits between initial access
      and the serious damage that elevated rights enable. Escalation comes in two broad flavours. **Vertical**
      escalation gains higher privilege (a standard user becoming administrator or root); **horizontal** movement
      takes over another account at the same level. The techniques differ by platform but share a shape: abuse a
      legitimate mechanism or exploit a misconfiguration to run code with more authority than you were granted.

      On **Windows**, common techniques include **token manipulation** (stealing or impersonating the access token
      of a privileged process), **UAC bypass** (tricking the elevation mechanism into granting admin without a
      prompt), abusing **service** configurations (a service whose binary or path a low-privileged user can modify
      runs as SYSTEM), and **scheduled tasks** or startup items that run with higher rights. On **Linux**, the
      classic paths are **sudo misconfigurations** (a user allowed to run a specific command that can be abused to
      spawn a root shell), **SUID/SGID binaries** (programs that run as their owner, exploitable if they can be
      made to execute arbitrary code), writable files in privileged contexts, and kernel exploits. The detections
      that catch these watch for the **behavioural signature** of elevation: a process whose integrity or
      privilege level jumps, a child process running as a more privileged user than its parent, modification of a
      service binary or a sudoers file, execution of a known-abusable SUID binary in an unusual way, or a UAC
      auto-elevation from an unexpected process.

      The engineering challenge, as always, is **separating attack from administration**, because legitimate admins
      also elevate privilege all day. Effective detections are therefore scoped and enriched: elevation from an
      interactive admin session during business hours is normal, while elevation spawned by a document process, a
      web server, or an unexpected service account is not. Correlating the escalation with what came before (a
      suspicious initial access, an unusual parent process) and after (new persistence, credential access) raises
      confidence greatly, since escalation rarely happens in isolation during an attack. Coverage is measured
      against the privilege-escalation techniques in ATT&CK, and gaps are prioritised by what current intelligence
      shows in use. For the analyst, the key is to detect the mechanism of elevation and then lean hard on context,
      because the raw event "a process gained admin rights" is common and only becomes an alert when its origin and
      surroundings do not fit normal administration.
    examples:
      - title: Techniques by platform
        body: |
          Windows: token theft/impersonation, UAC bypass, modifiable service binary -> runs as SYSTEM, scheduled task
          Linux:   sudo misconfig -> root shell, abusable SUID/SGID binary, writable privileged file, kernel exploit
          shared shape: abuse a legit mechanism or misconfig to run with more authority.
      - title: Detect the mechanism, lean on context
        body: |
          signal: child runs as MORE privileged user than parent; service binary or sudoers modified; UAC auto-elevate from odd process
          normal: interactive admin elevating in business hours
          suspicious: elevation spawned by a document/web-server/odd service account; correlate with before+after.
    exercise:
      title: Engineer privilege-escalation detections
      environment: A described environment with Windows and Linux endpoint telemetry (or a scenario)
      tools: [A scenario or sample events, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain the difference between vertical and horizontal privilege escalation.
        - Describe two Windows escalation techniques and the behavioural signal each produces.
        - Describe two Linux escalation techniques and the behavioural signal each produces.
        - Write a detection idea for one technique that targets the mechanism rather than a specific tool.
        - Explain how you would distinguish the detection from legitimate administrative elevation.
        - Describe how correlating with preceding and following activity raises confidence.
      deliverable: A set of privilege-escalation detection ideas across Windows and Linux, each with its behavioural signal, plus a false-positive-reduction and correlation approach.
    expected_outcome: >
      You can identify Windows and Linux privilege-escalation techniques, engineer behaviour-based detections for
      them, and use context and correlation to separate real escalation from legitimate administration.
    quiz:
      - prompt: A strong behavioural signal of privilege escalation is
        options:
          - A user reading email
          - A child process running as a more privileged user than its parent, or a service binary being modified
          - A normal scheduled backup
          - A DNS lookup
        answer: 1
        explanation: Elevation shows up as privilege jumps and modification of mechanisms that run with high rights.
      - prompt: On Linux, an abusable SUID binary can escalate privilege because it
        options:
          - Encrypts the disk
          - Runs as its owner (often root), so coercing it to execute arbitrary code yields that owner's rights
          - Disables logging
          - Is always malicious
        answer: 1
        explanation: SUID programs run with the owner's privileges, so exploiting one grants those privileges.
      - prompt: The main challenge in detecting privilege escalation is
        options:
          - There is no telemetry
          - Legitimate administrators elevate privilege constantly, so attack must be separated from normal admin
          - It never happens in real attacks
          - Elevation cannot be logged
        answer: 1
        explanation: Elevation is routine for admins, so detections must use context to flag only the abnormal.
      - prompt: Confidence in a privilege-escalation detection rises most when you
        options:
          - Ignore surrounding events
          - Correlate it with suspicious activity before (odd parent, initial access) and after (persistence, credential access)
          - Only look at the single event
          - Disable the rule
        answer: 1
        explanation: Escalation rarely stands alone in an attack, so surrounding context strongly raises confidence.
  - slug: de-discovery-detection
    title: Detecting Discovery and Reconnaissance
    order: 15
    difficulty: advanced
    summary: Engineer detections for the discovery tactic, the enumeration an attacker performs after gaining access to map the environment, which is quiet, uses built-in tools, and is often the earliest internal signal.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain what discovery is and why detecting it is valuable
      - Identify common discovery techniques and their telemetry
      - Engineer detections that separate attacker enumeration from normal activity
    theory: |
      After gaining a foothold, an attacker rarely knows the environment, so they **discover** it: enumerating
      users, groups, hosts, shares, privileges, security tooling and trust relationships to plan where to go next.
      Detecting this **discovery** tactic is valuable because it often happens early, before lateral movement and
      impact, so catching it buys time to respond before real damage. The difficulty is that discovery is quiet
      and uses **built-in, legitimate tools**: commands like `whoami`, `net group`, `nltest`, `arp -a`, and
      PowerShell Active Directory queries on Windows, or `id`, `uname`, `cat /etc/passwd` and network enumeration
      on Linux, are exactly what administrators and scripts run too. There is no malware to catch, so detection
      must focus on the pattern and context of ordinary commands rather than any single command being bad.

      The signals that distinguish attacker discovery from normal use are mostly about **clustering and
      anomaly**. A single `whoami` is meaningless; a **burst** of enumeration commands run in quick succession
      from one process or user, especially shortly after a suspicious logon or an initial-access event, is a
      strong pattern, because attackers typically run reconnaissance as a flurry while admins run such commands
      sparingly and in context. The **source** matters enormously: discovery commands spawned by a document
      process, a web server, or an unusual parent are suspicious in a way the same commands from an interactive
      admin shell are not. Specific high-value targets of enumeration, such as queries for domain admins, domain
      trusts, or the presence of security products, are more suspicious than generic commands. Tools that automate
      domain enumeration leave their own recognisable patterns of rapid, broad querying.

      Engineering these detections is a careful exercise in **context and correlation** because the false-positive
      risk is high. Effective rules look for the combination, several discovery commands in a short window from a
      non-interactive or unusual parent, rather than any one command, and they gain confidence by correlating with
      what came before (initial access) and after (credential access, lateral movement), since discovery sits
      between them in the attack chain. Enrichment, is this host a workstation where admin enumeration is odd, or
      a jump box where it is normal, further reduces noise. Coverage is measured against the discovery techniques
      in ATT&CK, and because many discovery commands are individually benign, these detections are often tuned to
      feed investigation and correlation rather than to page an analyst on every hit. For the analyst, discovery
      detection is high-leverage early warning, and the craft is recognising the shape of enumeration, a burst of
      ordinary commands from the wrong place at the wrong time, rather than hunting for a forbidden command that
      does not exist.
    examples:
      - title: Discovery uses built-in tools
        body: |
          Windows: whoami, net group, nltest, arp -a, AD PowerShell queries
          Linux: id, uname, cat /etc/passwd, network enumeration
          same commands admins run -> no malware -> detect the PATTERN + CONTEXT, not the command.
      - title: What makes it suspicious
        body: |
          a BURST of enumeration from one process/user, right after a suspicious logon
          spawned by a document/web-server/odd parent (not an interactive admin shell)
          targets domain admins / trusts / security products
          -> correlate with before (initial access) + after (cred access, lateral movement).
    exercise:
      title: Engineer discovery detections
      environment: A described environment with endpoint command telemetry (or a scenario)
      tools: [A scenario or sample process/command events, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain what the discovery tactic is and why detecting it early is valuable.
        - List common discovery commands on Windows and Linux and note that they are legitimate tools.
        - Explain why a single discovery command is not a detection but a burst can be.
        - Write a detection idea based on clustering and an unusual parent process.
        - Explain how correlation with preceding and following activity raises confidence.
        - Describe a tuning or enrichment step that reduces false positives from legitimate administration.
      deliverable: A discovery-detection plan covering the tactic, common commands, a clustering-plus-context detection idea, correlation across the attack chain, and a false-positive-reduction step.
    expected_outcome: >
      You can explain the discovery tactic, identify its built-in-tool telemetry, and engineer context- and
      correlation-based detections that separate attacker enumeration from legitimate administrative activity.
    quiz:
      - prompt: Detecting discovery is valuable mainly because it
        options:
          - Happens only after data theft
          - Often occurs early, before lateral movement and impact, buying time to respond
          - Involves obvious malware
          - Cannot be logged
        answer: 1
        explanation: Discovery precedes serious actions, so catching it gives an early chance to intervene.
      - prompt: Discovery is hard to detect because it
        options:
          - Always uses custom malware
          - Uses built-in, legitimate tools that administrators and scripts also run
          - Produces no logs at all
          - Only happens offline
        answer: 1
        explanation: Enumeration uses normal commands, so there is no inherently malicious tool to flag.
      - prompt: A strong discovery detection focuses on
        options:
          - A single whoami command
          - A burst of enumeration commands in a short window from a non-interactive or unusual parent
          - Any use of PowerShell ever
          - Disabling the rule
        answer: 1
        explanation: Clustering plus an unusual source distinguishes attacker recon from routine admin use.
      - prompt: Confidence in a discovery detection rises most when it is correlated with
        options:
          - Nothing else
          - Preceding initial access and following credential access or lateral movement
          - Only the time of day
          - The size of the log file
        answer: 1
        explanation: Discovery sits between initial access and later stages, so surrounding activity confirms it.
  - slug: de-yara-rules
    title: Writing YARA Rules for File and Memory Detection
    order: 16
    difficulty: advanced
    summary: Learn how YARA rules describe and detect malicious files and memory patterns, how to write effective rules by strings and conditions, and where YARA fits alongside behavioural detection.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain what YARA is and what it detects
      - Write a YARA rule using strings and a condition
      - Balance specificity against generality to control false positives
    theory: |
      **YARA** is a pattern-matching tool, often called the pattern-matching swiss-army knife for malware, that
      lets an analyst describe the characteristics of malicious files or memory and then scan for anything
      matching. Where behavioural detection watches what code *does* at runtime, YARA examines what content *is*:
      the bytes, strings and structure of a file or a region of memory. It is widely used to identify malware
      families, detect specific tools and implants on disk or in memory, hunt across an estate for known-bad
      content, and triage suspicious files. Understanding YARA complements the behavioural detection skills from
      earlier lessons, because some things are best caught by their content and others by their behaviour.

      A YARA rule has a simple, readable structure built around two parts. The **strings** section defines the
      patterns to look for, which can be text strings, hexadecimal byte sequences (useful for code or headers), or
      regular expressions, each given an identifier. The **condition** section is a logical expression that
      decides when the rule matches, for example requiring that a certain number of the defined strings are
      present, that specific ones appear together, or that a pattern occurs at a particular offset such as a file
      header. A rule might say: match if this unique code sequence and either of these two characteristic strings
      are present. This structure makes rules both expressive and auditable, and because they are plain text they
      are easy to share, which is why threat-intelligence providers publish YARA rules for new malware.

      The craft of writing good rules is **balancing specificity against generality**. A rule tied to content too
      specific (a single hard-coded string or hash) catches only one exact sample and misses trivial variants; a
      rule too broad (a common string that also appears in legitimate software) generates false positives. The
      skill is to key on characteristics that are **distinctive to the malware but stable across its variants**,
      such as a unique decryption routine, an unusual combination of strings, or a structural quirk, so the rule
      catches the family without flagging benign files. Good practice includes testing rules against both known
      malware and a large set of clean files to measure false positives, using meaningful rule names and metadata,
      and keeping rules maintainable. For the analyst, YARA is valuable for hunting (sweep every endpoint or every
      file for a known implant), for enriching detections (a file that triggers a behavioural alert can be YARA-
      scanned for family attribution), and for incident response (search memory captures and disk images for
      indicators), so writing clear, well-balanced rules is a practical, high-leverage detection-engineering
      skill, used alongside, not instead of, behaviour-based detection.
    examples:
      - title: What YARA matches
        body: |
          behavioural detection: what code DOES at runtime
          YARA: what content IS -> bytes, strings, structure of a file or memory region
          uses: identify malware families, find implants on disk/in memory, hunt, triage files.
      - title: Rule structure and the balance
        body: |
          strings: text, hex byte sequences, or regex (each named)
          condition: logical expression (N of the strings, specific ones together, pattern at an offset)
          balance: too specific (one hash) misses variants; too broad (common string) -> false positives
          -> key on distinctive-but-stable traits (unique routine, odd string combo).
    exercise:
      title: Write and tune a YARA rule
      environment: A described malware sample's characteristics and a set of clean files (or a scenario)
      tools: [A scenario or sample strings/bytes, the YARA reference, a document, a notes file]
      steps:
        - Explain what YARA detects and how it differs from behavioural detection.
        - Describe the strings and condition sections of a YARA rule.
        - Sketch a rule for a described sample using a couple of distinctive strings and a condition.
        - Explain why keying on a single hard-coded string or hash makes a poor rule.
        - Explain how you would test the rule against clean files to control false positives.
        - Describe one way an analyst would use the rule (hunting, enrichment or incident response).
      deliverable: A YARA rule sketch for a sample with strings and a condition, a critique of an overly specific or broad approach, a false-positive testing plan, and a use case.
    expected_outcome: >
      You can explain what YARA detects, write a rule with strings and a condition balanced for specificity and
      generality, test it against clean files, and apply it for hunting, enrichment and incident response.
    quiz:
      - prompt: YARA detects malware primarily by
        options:
          - Watching runtime behaviour
          - Matching the content (bytes, strings, structure) of files or memory against defined patterns
          - Monitoring network timing
          - Checking user logins
        answer: 1
        explanation: YARA is content pattern-matching on files and memory, complementing behavioural detection.
      - prompt: The condition section of a YARA rule
        options:
          - Lists only the file name
          - Is a logical expression deciding when the rule matches (for example N of the defined strings present)
          - Encrypts the file
          - Deletes the match
        answer: 1
        explanation: The condition combines the defined strings into the logic that triggers a match.
      - prompt: A rule keyed to a single hard-coded string or hash is poor because it
        options:
          - Is too general
          - Catches only one exact sample and misses trivial variants
          - Always produces false positives
          - Cannot be written in YARA
        answer: 1
        explanation: Over-specific rules match one sample and fail on minor variants of the same malware.
      - prompt: Good YARA rules key on characteristics that are
        options:
          - Common to all software
          - Distinctive to the malware but stable across its variants
          - Randomly chosen
          - Only the file size
        answer: 1
        explanation: Distinctive-but-stable traits catch the family without flagging benign files.
  - slug: de-command-execution
    title: Detecting Command and Script Execution
    order: 17
    difficulty: advanced
    summary: Engineer detections for the execution tactic, how attackers run commands and scripts through interpreters, scripting engines and native tooling, which is central to nearly every intrusion.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain the execution tactic and why detecting it is high-value
      - Identify command- and script-execution telemetry and patterns
      - Engineer detections that catch malicious execution amid heavy legitimate use
    theory: |
      Nearly every intrusion involves the attacker **running commands or scripts** at some point, so the
      **execution** tactic is one of the richest and most central places to detect malice. Attackers execute code
      through command interpreters (cmd, bash), scripting engines (PowerShell, Windows Script Host, Python), and
      native tools, often chaining them, a document launching PowerShell, which downloads and runs the next stage.
      Detecting execution well pays off because it sits early and recurs throughout an attack, but it is also one
      of the hardest areas because these same interpreters are used constantly and legitimately by administrators,
      scripts and software, so the challenge is separating malicious execution from the enormous volume of benign
      execution.

      The telemetry is primarily **process creation** enriched with command lines, plus script-engine-specific
      logging. The highest-value signals are in the **relationships and the content**, not the mere fact that an
      interpreter ran. **Parent-child relationships** are revealing: an Office application or a PDF reader spawning
      a command interpreter or PowerShell is a classic malicious execution pattern, as is a web server process
      spawning a shell, because these parents have no legitimate reason to launch interpreters. **Command-line
      content** carries strong signals: encoded or obfuscated commands (base64 blobs, excessive escaping),
      download-and-execute one-liners, execution from suspicious paths (temp directories, user profiles), and
      known malicious tooling patterns. **Script-engine logging**, such as PowerShell script-block logging, exposes
      what scripts actually do even when obfuscated at the command line, which is why enabling it is a major
      detection enabler. Each of these turns raw execution events into something a detection can key on.

      Engineering these detections is an exercise in **behaviour and context over blocklists**, because you cannot
      simply forbid PowerShell. Effective rules target the suspicious combination, an unusual parent spawning an
      interpreter, an interpreter running an encoded command, execution from a temp path, rather than the
      interpreter alone, and they lean on enrichment (is this parent-child pair ever normal here) and correlation
      (execution following a suspicious email or preceding network activity). The approach is the same
      behaviour-based thinking used across detection engineering, and coverage is measured against the execution
      techniques in ATT&CK, with PowerShell and other scripting given particular attention because they are so
      heavily abused. Tuning is critical given the volume, so these detections are scoped and enriched to avoid
      drowning the SOC in legitimate administrative scripting. For the analyst, the lesson is that execution is
      where much of an attack becomes visible if you are watching the right signals, parent-child anomalies,
      command-line content and script-block logs, and that the craft is distinguishing the malicious use of
      universal tools from their constant legitimate use through context, not through pretending the tools
      themselves are forbidden.
    examples:
      - title: Where execution shows up
        body: |
          interpreters (cmd, bash), script engines (PowerShell, WSH, Python), native tools, often chained
          classic: document -> PowerShell -> download + run next stage
          central + early + recurring -> high value; but heavily used legitimately -> hard.
      - title: The high-value signals
        body: |
          parent-child: Office/PDF/web-server spawning an interpreter or shell (no legit reason)
          command line: encoded/obfuscated (base64), download-and-execute one-liners, temp-path execution
          script-block logging (PowerShell) reveals what obfuscated scripts actually do -> enable it.
    exercise:
      title: Engineer command and script execution detections
      environment: A described environment with process-creation and script-engine telemetry (or a scenario)
      tools: [A scenario or sample process/command events, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain the execution tactic and why detecting it is both high-value and difficult.
        - Identify the telemetry that reveals command and script execution.
        - Describe a suspicious parent-child execution pattern and why it is malicious.
        - Describe two command-line content signals that suggest malicious execution.
        - Explain why PowerShell script-block logging is a major detection enabler.
        - Describe how you would tune these detections to avoid drowning in legitimate scripting.
      deliverable: A set of execution detection ideas based on parent-child relationships and command-line content, the role of script-block logging, and a tuning approach for the high volume.
    expected_outcome: >
      You can explain the execution tactic, identify command- and script-execution telemetry and patterns, and
      engineer behaviour- and context-based detections that catch malicious execution amid heavy legitimate use.
    quiz:
      - prompt: Detecting the execution tactic is high-value but difficult because
        options:
          - Attackers never run commands
          - Code execution is central and early in attacks, but the same interpreters are used constantly and legitimately
          - Interpreters leave no telemetry
          - It only happens after data theft
        answer: 1
        explanation: Execution recurs throughout attacks, yet legitimate interpreter use is enormous, so separation is hard.
      - prompt: A classic malicious execution pattern is
        options:
          - A user opening a web page
          - An Office application or PDF reader spawning a command interpreter or PowerShell
          - A scheduled backup running
          - A normal login
        answer: 1
        explanation: Document applications have no legitimate reason to launch interpreters, so this is suspicious.
      - prompt: PowerShell script-block logging is valuable because it
        options:
          - Blocks all PowerShell
          - Reveals what scripts actually do even when the command line is obfuscated
          - Encrypts the scripts
          - Deletes the logs
        answer: 1
        explanation: Script-block logging exposes deobfuscated script content, a major detection enabler.
      - prompt: Because interpreters are used legitimately all the time, execution detections should
        options:
          - Forbid all scripting
          - Target suspicious combinations (unusual parent, encoded command, temp-path execution) with context, not the interpreter alone
          - Ignore command lines
          - Alert on every PowerShell launch
        answer: 1
        explanation: Behaviour and context distinguish malicious execution from constant legitimate interpreter use.
  - slug: de-impact-detection
    title: Detecting the Impact Tactic - Ransomware and Destruction
    order: 18
    difficulty: advanced
    summary: Engineer detections for the impact tactic, where an attacker encrypts, destroys or disrupts data and systems, catching ransomware and wipers fast because at this stage every minute of delay means more damage.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain the impact tactic and why fast detection is critical
      - Identify the behavioural signals of ransomware and destructive attacks
      - Engineer detections that catch impact early enough to limit damage
    theory: |
      The **impact** tactic is the attacker's end goal in destructive operations, encrypting data for ransom,
      wiping systems, destroying backups, or disrupting services, and detecting it is unlike other tactics in one
      crucial respect: by the time impact begins, damage is actively happening, so detection speed matters more
      than anywhere else. A ransomware encryption routine can render thousands of files unusable in minutes, so a
      detection that fires quickly and triggers automated containment can be the difference between a contained
      incident and an organisation-wide outage. Ideally impact is prevented by catching earlier tactics, but as a
      last line, fast impact detection limits the blast radius, making it a high-priority, if late, signal.

      The behavioural signals of destructive impact are often **loud**, which helps. **Ransomware encryption**
      produces a distinctive pattern: a process rapidly opening, reading and writing (or replacing) a large number
      of files across directories, often changing file extensions, dropping ransom notes (new identical files
      appearing in many folders), and a spike in file I/O and entropy as files become encrypted. **Shadow-copy and
      backup deletion** is a near-universal ransomware precursor, attackers delete Volume Shadow Copies and try to
      destroy backups so victims cannot recover, so commands that delete shadow copies or disable recovery are a
      very strong, specific signal. **Destruction and wiping** show as mass file deletion or overwriting, and
      **disruption** as stopping critical services or mass system shutdowns. Because these behaviours are extreme
      and rare in normal operation, they are comparatively detectable, the challenge is less false positives than
      speed and automated response.

      Engineering impact detections therefore emphasises **high-fidelity behavioural rules and fast response**.
      Detect the mass-file-modification pattern of encryption (a single process touching very many files rapidly,
      extension changes, ransom-note creation), detect shadow-copy deletion and recovery-disabling commands as a
      specific high-confidence rule, detect mass deletion and service-stoppage patterns, and wherever possible wire
      these to **automated containment** (isolate the host immediately) because manual response is too slow once
      encryption is underway. These detections lean on endpoint telemetry (file and process activity) and are a
      prime use case for automated response. Coverage is measured against the impact techniques in ATT&CK, with
      ransomware behaviours given priority. The honest caveat is that impact detection is a last line, far better
      to catch the intrusion earlier, but it is an essential safety net, and the shadow-copy-deletion signal in
      particular is valuable because it often fires in the brief window between an attacker gaining control and
      beginning encryption. For the analyst, the lesson is that impact is where speed is everything: the signals
      are loud and detectable, so the engineering priority is firing fast and triggering automated containment to
      limit damage that is, by definition, already beginning.
    examples:
      - title: Why speed is everything
        body: |
          impact = encrypt/wipe/destroy/disrupt -> damage is ACTIVELY happening when it starts
          ransomware encrypts thousands of files in minutes -> fast detection + auto-containment limits blast radius
          a late signal, but an essential last line.
      - title: Loud, detectable signals
        body: |
          encryption: one process rapidly read/writes MANY files, extension changes, ransom notes in many folders, I/O + entropy spike
          shadow-copy / backup deletion + recovery-disabling commands = very strong, specific precursor
          destruction: mass deletion/overwrite; disruption: stopping critical services / mass shutdown
          -> wire to AUTOMATED containment (manual is too slow).
    exercise:
      title: Engineer impact and ransomware detections
      environment: A described environment with endpoint file and process telemetry (or a scenario)
      tools: [A scenario or sample events, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain the impact tactic and why detection speed matters more than for other tactics.
        - Describe the behavioural pattern of ransomware encryption.
        - Explain why shadow-copy and backup deletion is such a strong, specific signal.
        - Write a detection idea for the mass-file-modification pattern of encryption.
        - Explain why impact detections should trigger automated containment.
        - Acknowledge why impact detection is a last line and what should ideally catch the attack sooner.
      deliverable: A set of impact detection ideas covering encryption, shadow-copy deletion and destruction, wired to automated containment, with an acknowledgement of its last-line role.
    expected_outcome: >
      You can explain the impact tactic and why speed is critical, identify the loud behavioural signals of
      ransomware and destruction, and engineer high-fidelity detections wired to automated containment to limit damage.
    quiz:
      - prompt: Detecting the impact tactic differs from other tactics mainly because
        options:
          - It is the easiest to prevent
          - Damage is actively happening once it begins, so detection speed and automated response matter most
          - It leaves no signals
          - It never causes harm
        answer: 1
        explanation: Impact is live damage, so firing fast and auto-containing is more important than elsewhere.
      - prompt: A very strong, specific ransomware precursor signal is
        options:
          - A normal file read
          - Deletion of Volume Shadow Copies and commands that disable recovery
          - A DNS lookup
          - A software update
        answer: 1
        explanation: Attackers delete shadow copies and disable recovery before encrypting, a high-confidence signal.
      - prompt: Ransomware encryption shows up behaviourally as
        options:
          - One file opened once
          - A single process rapidly reading and writing many files, changing extensions and dropping ransom notes
          - A reboot
          - A normal login
        answer: 1
        explanation: Mass rapid file modification with extension changes and ransom notes is the encryption pattern.
      - prompt: Impact detections should ideally trigger
        options:
          - A weekly report
          - Automated containment, because manual response is too slow once encryption is underway
          - Nothing at all
          - A password reset only
        answer: 1
        explanation: Since damage is immediate, automated isolation limits the blast radius faster than manual action.
  - slug: de-cloud-detection
    title: Detecting Threats in Cloud Environments
    order: 19
    difficulty: advanced
    summary: Engineer detections for cloud environments, where the control plane, identity and provider logs replace host and network telemetry, and the threats and signals differ from on-premises detection.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.3"]
    learning_objectives:
      - Explain how cloud detection differs from on-premises detection
      - Identify the key cloud threats and the logs that reveal them
      - Engineer detections against the cloud control plane and identity
    theory: |
      Most of the detection engineering met so far focuses on endpoint and network telemetry, but in the cloud the
      ground shifts: there is often no traditional host or network tap to watch, and instead the richest, and
      sometimes only, telemetry is the provider's **control-plane audit log**, the record of every API call that
      creates, changes, accesses or deletes a resource. Cloud detection is therefore largely about engineering
      detections against **API activity and identity**, because a cloud attack typically unfolds as a sequence of
      API calls made with compromised credentials rather than as malware on a box. This reframes the detection
      engineer's job: the data source is the audit log (and identity and resource logs), and the behaviours to
      detect are suspicious patterns of API and identity activity.

      The **key cloud threats** and their signals are distinct. **Credential and identity abuse** is central: a
      stolen access key or account used from a new location or in anomalous ways, impossible-travel sign-ins, use
      of long-dormant credentials, or a surge of failed then successful authentications. **Privilege escalation in
      IAM** shows as an identity granting itself or another new permissions, attaching powerful policies, or
      creating new credentials, high-value detections because IAM escalation is how cloud attackers gain control.
      **Reconnaissance** appears as a burst of enumeration API calls (listing buckets, roles, instances).
      **Resource abuse** such as cryptojacking shows as unexpected creation of expensive compute, and **data
      access and exfiltration** as unusual reads or downloads from storage, or making a resource public.
      **Defense evasion** in the cloud includes disabling logging, deleting trails, or changing security
      configurations, and detecting tampering with the logging itself is critical because it is both an attack
      step and a threat to your own visibility. Mapping these to a cloud-focused view of ATT&CK gives coverage
      targets just as on-premises.

      Engineering cloud detections follows the same disciplined approach, adapted to the data. Detections are
      written against the audit and identity logs (ideally normalised into the SIEM via the cloud onboarding met
      earlier), combining specific high-confidence rules (logging disabled, a root or break-glass account used, a
      new admin policy attached) with behavioural and anomaly detection (unusual API patterns, impossible travel,
      first-time actions for an identity), since baselining normal API and identity behaviour is especially
      powerful in the cloud. Cloud-native detection services provided by the platforms generate many of these
      signals out of the box and feed the SIEM, so the engineer's role is often to tune, enrich and correlate them
      with the rest of the picture rather than build everything from scratch. The considerations mirror
      on-premises, tuning for noise, and ensuring the logs exist in the first place (detection is impossible
      without the audit log enabled). For the analyst, the lessons are that cloud detection centres on the control
      plane and identity rather than hosts and networks, that the audit log is the primary source and its own
      integrity a priority, that the key cloud threats, credential abuse, IAM escalation, recon, resource abuse,
      data access, and logging tampering, each have recognisable API signals, and that engineering detections
      against normalised cloud logs, blending precise rules with behavioural baselining, is how a SOC gains
      visibility into attacks that never touch a traditional host.
    examples:
      - title: What changes for cloud detection
        body: |
          often no host/network tap -> the richest telemetry is the control-plane AUDIT LOG (every API call) + identity logs
          a cloud attack = a sequence of API calls with compromised creds, not malware on a box
          -> detect suspicious API + identity patterns; protect the log's own integrity.
      - title: Key cloud threats and signals
        body: |
          credential/identity abuse (new location, impossible travel, dormant key); IAM privilege escalation (self-granting permissions, new admin policy, new keys)
          recon (burst of enumeration calls); resource abuse (unexpected expensive compute); data access/exfil (unusual storage reads, making a resource public)
          defense evasion (disabling logging, deleting trails) -> blend precise rules + behavioural baselining; cloud-native services feed many signals.
    exercise:
      title: Engineer cloud detections
      environment: A described cloud environment with sample control-plane and identity logs (or a scenario)
      tools: [A scenario or sample cloud logs, the ATT&CK reference, a document, a notes file]
      steps:
        - Explain why cloud detection centres on the control-plane audit log and identity rather than hosts and networks.
        - Identify three key cloud threats and the API or identity signals that reveal each.
        - Explain why detecting tampering with logging itself is critical in the cloud.
        - Write a high-confidence detection idea (for example a new admin policy attached or logging disabled).
        - Write a behavioural detection idea based on baselining normal API or identity activity.
        - Explain the role of cloud-native detection services and why the logs must be enabled first.
      deliverable: A cloud-detection plan covering the shift to control-plane and identity telemetry, key threats and their signals, a high-confidence rule, a behavioural detection, and the role of cloud-native services.
    expected_outcome: >
      You can explain how cloud detection differs from on-premises, identify the key cloud threats and the logs
      that reveal them, and engineer detections against the control plane and identity blending rules with baselining.
    quiz:
      - prompt: Cloud detection centres on the control-plane audit log because
        options:
          - Hosts are the only cloud telemetry
          - There is often no traditional host or network tap, and the audit log records the API calls an attack is made of
          - Audit logs contain no useful data
          - Cloud has no identities
        answer: 1
        explanation: Cloud attacks unfold as API calls with credentials, so the audit and identity logs are the key source.
      - prompt: A high-value cloud detection is IAM privilege escalation, which shows as
        options:
          - A normal read of one file
          - An identity granting itself new permissions, attaching powerful policies or creating new credentials
          - A scheduled backup
          - A DNS lookup
        answer: 1
        explanation: IAM escalation is how cloud attackers gain control, so self-granted permissions are a strong signal.
      - prompt: Detecting the disabling or deletion of logging is critical because it is
        options:
          - Harmless routine activity
          - Both an attacker defense-evasion step and a direct threat to your own visibility
          - Only a performance issue
          - Never possible to detect
        answer: 1
        explanation: Tampering with logging both hides the attacker and blinds the defender, so it must be detected.
      - prompt: Behavioural detection is especially powerful in the cloud because
        options:
          - API activity is random and unbaselinable
          - Baselining normal API and identity behaviour makes anomalies like impossible travel and first-time actions stand out
          - It replaces the need for logs
          - It only works on endpoints
        answer: 1
        explanation: Baselining identity and API patterns surfaces the anomalies typical of cloud credential abuse.
