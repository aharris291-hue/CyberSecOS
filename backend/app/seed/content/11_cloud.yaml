slug: cloud-security
title: Cloud Security Operations
domain: Cloud Security
order: 11
description: >
  Identity is the new perimeter. Learn the shared responsibility model and how to
  investigate cloud sign-ins with Microsoft Entra ID logs.
lessons:
  - slug: cloud-identity-signins
    title: Shared Responsibility and Investigating Cloud Sign-ins
    order: 1
    difficulty: beginner
    summary: Understand who secures what in the cloud and investigate risky Entra ID sign-ins.
    theory_minutes: 12
    lab_minutes: 50
    objectives: ["secplus:3.1", "secplus:4.6", "sc900:1", "sc900:2", "sc200:1"]
    learning_objectives:
      - Explain the shared responsibility model for IaaS, PaaS and SaaS
      - Describe Zero Trust and why identity is central to cloud security
      - Investigate sign-in logs for password spraying, impossible travel and MFA fatigue
    theory: |
      In the cloud, security is shared. The provider always secures the physical data centre
      and hypervisor. In **IaaS** you still secure the OS, apps and data; in **PaaS** you secure
      apps, data and identities; in **SaaS** you mainly secure identities, data and
      configuration. Misconfiguration and stolen credentials, not provider failures, cause most
      cloud breaches.

      **Zero Trust** means "never trust, always verify": every request is authenticated,
      authorised and evaluated using signals such as user, device, location and risk.
      **Microsoft Entra ID** (formerly Azure AD) provides identity, **MFA** and **Conditional
      Access** policies that enforce these decisions.

      Entra **sign-in logs** are where cloud identity attacks show up. **Password spraying**
      is one or two passwords tried against many accounts from the same IPs. **Impossible
      travel** is the same account signing in from distant locations within minutes. **MFA
      fatigue** is a flood of MFA prompts until a tired user approves one. Result codes such as
      50126 (invalid credentials) and 50074 (MFA required) help you read what happened.
    examples:
      - title: Password spray in KQL
        body: |
          SigninLogs
          | where TimeGenerated > ago(1d) and ResultType == "50126"
          | summarize Accounts = dcount(UserPrincipalName), Attempts = count() by IPAddress
          | where Accounts > 10
          | order by Accounts desc
      - title: Shared responsibility at a glance
        body: |
          Layer          IaaS       PaaS       SaaS
          Data           Customer   Customer   Customer
          Identities     Customer   Customer   Customer
          Application    Customer   Customer   Provider
          OS             Customer   Provider   Provider
          Physical       Provider   Provider   Provider
    exercise:
      title: Investigate sign-ins in a Microsoft 365 developer tenant
      environment: >
        A free Microsoft 365 Developer Program tenant or Azure free account (Entra ID P2 trial
        enables risk reports), or the Log Analytics demo workspace's SigninLogs table
      tools: [Microsoft Entra admin center, KQL]
      steps:
        - Create two test users in your tenant and enable MFA for one of them.
        - Sign in as each user from a browser, then deliberately fail three sign-ins with a wrong password.
        - Open Entra admin center > Monitoring > Sign-in logs and find your failed and successful attempts; record result codes.
        - Add a filter by IP address and by application; identify which sign-ins satisfied MFA.
        - Create a Conditional Access policy in report-only mode that requires MFA for all users, and view its report-only result on a new sign-in.
        - Write the password-spray KQL query from the examples and run it in Log Analytics or the demo workspace.
        - Fill in the shared responsibility table for a web app on a VM versus the same app on App Service.
      deliverable: Screenshots of the sign-in investigation, your Conditional Access report-only result, and the completed responsibility table.
    expected_outcome: >
      You can explain who is responsible for each cloud layer and investigate common identity
      attacks from sign-in logs.
    quiz:
      - prompt: In SaaS, which of these is always the customer's responsibility?
        options: [Physical security, Hypervisor patching, User identities and access, Application code]
        answer: 2
        explanation: Customers always own their data, identities and access configuration.
      - prompt: Many accounts failing with the same password from one IP is
        options: [Impossible travel, Password spraying, MFA fatigue, Session hijacking]
        answer: 1
        explanation: Spraying tries a few common passwords against many accounts to avoid lockouts.
      - prompt: The core principle of Zero Trust is
        options:
          - Trust everything inside the corporate network
          - Never trust, always verify every request
          - Use only one password
          - Block all cloud services
        answer: 1
        explanation: Zero Trust evaluates every access request regardless of network location.
      - prompt: Which Entra feature enforces "require MFA when signing in from outside the country"?
        options: [Conditional Access, Sign-in logs, Password writeback, Groups]
        answer: 0
        explanation: Conditional Access policies apply conditions and controls such as MFA.

  - slug: cloud-logging-posture
    title: Cloud Logging and Posture Management
    order: 2
    difficulty: intermediate
    summary: Turn on the cloud audit logs that matter, find a risky misconfiguration, and read a posture-management finding to a fix.
    theory_minutes: 12
    lab_minutes: 52
    objectives: ["secplus:3.1", "secplus:4.1", "sc900:3", "sc200:2"]
    learning_objectives:
      - Explain the cloud control-plane logs a SOC relies on
      - Find a common misconfiguration and explain its risk
      - Read a cloud posture-management finding and turn it into a fix
    theory: |
      In the cloud the **control plane** (the API that creates and changes resources)
      is the most important thing to watch, because an attacker with stolen credentials
      acts through it rather than on a single host. The essential **audit logs** record
      who did what: **AWS CloudTrail**, **Azure Activity log** and **Microsoft Entra**
      sign-in and audit logs, plus resource-level logs such as storage access. A SOC's
      first cloud task is ensuring these are enabled, centralised and retained, because
      an action nobody logged is an action nobody can investigate. These feed the same
      SIEM detections covered earlier, now looking for things like a new access key, a
      permission grant, or public exposure of a resource.

      Most cloud incidents start with a **misconfiguration**, not an exploit. Classic
      examples: a storage bucket or blob made public, an over-permissive identity role
      with wildcard permissions, a security group open to the internet on a sensitive
      port, and disabled logging. These are failures of configuration against the
      **shared responsibility model**, where securing *what you put in* the cloud is
      the customer's job. **Cloud Security Posture Management (CSPM)** tools continuously
      check resources against benchmarks (for example the CIS cloud benchmarks) and
      raise **findings** ranked by severity.

      A finding is only useful once it becomes a fix. Each one names the resource, the
      rule it broke, and usually a remediation, and the analyst's job is to confirm the
      risk, decide whether it is a true exposure, and route it to remediation with the
      right urgency. **Workload protection** adds runtime detection on top of
      configuration checks: tools such as **Microsoft Defender for Cloud** watch for
      suspicious behaviour like a compute instance querying the cloud metadata service
      for credentials. Posture management (prevent misconfiguration) and workload
      protection (detect behaviour) together are how a SOC covers the cloud.
    examples:
      - title: A CloudTrail event worth alerting on
        body: |
          eventName: CreateAccessKey        // a new long-lived credential was created
          userIdentity: assumed-role/deploy  on an account that normally uses SSO
          sourceIPAddress: an unfamiliar country
          Alert: new access key on a human identity from a rare location -> investigate
      - title: A CSPM finding read to a fix
        body: |
          Finding:   Storage account "backups" allows public read   Severity: High
          Rule:      CIS - no anonymous public access to object storage
          Confirm:   the bucket holds database exports (regulated data) -> true exposure
          Fix:       remove public access, add a private endpoint, rotate anything leaked
    exercise:
      title: Enable cloud logging, find a misconfiguration and remediate a finding
      environment: A free-tier cloud account (AWS Free Tier, Azure free account) or a cloud sandbox; never use a production account
      tools: [Cloud provider console, the provider's audit log (CloudTrail/Activity/Entra), a free CSPM or the provider's built-in posture tool]
      steps:
        - In a free-tier or sandbox account (never production), confirm the control-plane audit log is enabled and centralised, and note its retention.
        - Perform a benign logged action (create then delete a test resource) and find the corresponding entry in the audit log, identifying who, what and from where.
        - Deliberately create one common misconfiguration on a test resource (for example a storage container set to public read) in the sandbox.
        - Run the provider's posture tool or a free CSPM and locate the finding for your misconfiguration; record its severity and the rule it cites.
        - Confirm the risk, then remediate it (remove public access) and re-run the check to show the finding cleared.
        - Write one SIEM-style detection idea for a control-plane event worth alerting on (for example a new access key from a rare location) and the log it reads.
        - Summarise, using the shared responsibility model, which of these the provider secures and which you must.
      deliverable: Evidence of the audit-log entry for your test action, the CSPM finding before and after remediation, and one control-plane detection idea with its log source.
    expected_outcome: >
      You can ensure the cloud control-plane logs are flowing, find and remediate a
      common misconfiguration from a posture finding, and name a control-plane event
      worth detecting, framed by the shared responsibility model.
    quiz:
      - prompt: Why is the cloud control plane the priority for SOC logging?
        options:
          - It is the only thing that generates logs
          - An attacker with stolen credentials acts through its API to create and change resources
          - It is cheaper to log
          - It replaces endpoint logs
        answer: 1
        explanation: Control-plane API activity is how cloud resources are created and changed, so it is where credential misuse shows.
      - prompt: Most cloud security incidents begin with
        options: [A zero-day exploit, A misconfiguration such as public storage or over-permissive roles, A DDoS, A phishing call]
        answer: 1
        explanation: Misconfigured resources and identities are the leading cause of cloud exposure.
      - prompt: Under the shared responsibility model, securing the data and configuration you put in the cloud is
        options: [The provider's job, The customer's job, Nobody's job, The auditor's job]
        answer: 1
        explanation: Providers secure the cloud itself; customers secure what they deploy and configure in it.
      - prompt: A CSPM tool primarily
        options:
          - Blocks all traffic
          - Continuously checks resources against benchmarks and raises ranked findings
          - Replaces the SIEM
          - Encrypts backups
        answer: 1
        explanation: Cloud Security Posture Management flags configuration drift against benchmarks as prioritised findings.
      - prompt: Workload protection differs from posture management because it
        options:
          - Only checks configuration
          - Adds runtime detection of suspicious behaviour on top of configuration checks
          - Is a billing feature
          - Disables logging
        answer: 1
        explanation: Posture management prevents misconfiguration; workload protection detects malicious runtime behaviour.
  - slug: cloud-workload-storage
    title: Hardening Cloud Workloads and Storage
    order: 3
    difficulty: intermediate
    summary: Find and fix the misconfigurations that cause most cloud incidents, from public storage and over-broad roles to exposed metadata and leaked secrets.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.1", "sc200:1"]
    learning_objectives:
      - Explain why misconfiguration, not exploits, drives most cloud breaches
      - Find and fix public storage, over-broad roles and exposed metadata
      - Keep secrets out of workloads and enforce safe defaults with guardrails
    theory: |
      Most cloud breaches are not clever exploits; they are **misconfigurations**. Under
      the shared-responsibility model the provider secures the infrastructure, but the
      customer still configures access, storage and workloads, and small mistakes there
      are the common cause. The classic one is **public object storage**: a bucket opened
      to the internet, or made public by a broad default, exposing data with no attacker
      skill required. Hunting these means checking effective access, not intent, because
      a resource can be public through an account-wide setting even when its own policy
      looks fine.

      Identity is the next big surface. Cloud roles are easy to make **over-privileged**,
      and a wildcard permission (`Action: *`) on a workload is an attacker's dream once
      they land on it. The principle is least privilege: scope roles to the specific
      actions and resources needed. A cloud-specific trap is the **instance metadata
      service** (IMDS): a workload can read its own credentials from a local metadata
      endpoint, and if the app has a server-side request forgery flaw, an attacker can
      make it fetch those credentials. Enforcing the hardened version of IMDS closes
      that path. **Secrets** are another: keys hard-coded in code, images or environment
      variables leak constantly, so they belong in a managed **secrets vault** and should
      be short-lived and rotated.

      Doing this by hand does not scale, so cloud security leans on **guardrails**. **Cloud
      security posture management** (CSPM) continuously scans for these misconfigurations
      against a benchmark (such as CIS) and flags drift. **Policy-as-code** and
      **service control policies** prevent whole classes of mistake, for example refusing
      to create a public bucket at all, which is stronger than finding it after the fact.
      Safe **defaults** plus continuous scanning beat one-off manual review.
    examples:
      - title: Effective access, not the resource policy alone
        body: |
          Bucket policy: private
          Account setting: "block public access" = OFF, ACL grants AllUsers read
          Effective: PUBLIC. Check the combination, not just the bucket's own policy.
      - title: Least privilege instead of a wildcard role
        body: |
          Over-broad:  Action: s3:*            Resource: *
          Scoped:      Action: s3:GetObject    Resource: arn:...:bucket/reports/*
          The scoped role cannot be abused to read or delete everything if stolen.
    exercise:
      title: Audit and harden a cloud workload and its storage
      environment: A cloud account you may safely inspect (a free-tier or lab tenant) or a provided configuration export, plus a document
      tools: [A cloud console or CLI, a CSPM or benchmark checklist such as CIS, a secrets manager]
      steps:
        - Inventory the storage buckets or containers in the scope and determine the effective public/private status of each, not just its own policy.
        - For any that are effectively public, write the exact change that makes them private and note the account-wide setting that should enforce it.
        - Pick one workload role and check its permissions; rewrite an over-broad or wildcard permission to least privilege scoped to specific actions and resources.
        - Check whether the hardened instance metadata service is enforced and explain the server-side request forgery risk if it is not.
        - Find one place a secret could be hard-coded (code, image, environment variable) and describe moving it to a secrets vault with rotation.
        - Run the workload against a benchmark checklist (CIS or a CSPM scan) and record at least three findings with their fixes.
        - Propose one guardrail (policy-as-code or a service control policy) that would prevent one of these misconfigurations from recurring.
      deliverable: The storage access audit with fixes, a least-privilege role rewrite, the IMDS and secrets findings, a benchmark result with three fixes, and one preventive guardrail.
    expected_outcome: >
      You can audit a cloud environment for the misconfigurations that cause most
      breaches, fix public storage, over-broad roles, exposed metadata and leaked
      secrets, and propose guardrails that prevent the mistakes from recurring.
    quiz:
      - prompt: What causes the majority of cloud security incidents?
        options:
          - Zero-day exploits in the hypervisor
          - Customer misconfiguration of access, storage and workloads
          - Physical theft of servers
          - Weak provider data centres
        answer: 1
        explanation: Under shared responsibility the customer configures access and resources, and misconfigurations there are the common cause of breaches.
      - prompt: To decide whether a storage bucket is exposed, you should check
        options:
          - Only the bucket's own policy
          - The effective access from all settings combined, including account-wide controls and ACLs
          - The number of files in it
          - Its storage class
        answer: 1
        explanation: A bucket can be public through an account setting or ACL even when its own policy looks private, so effective access is what matters.
      - prompt: Enforcing the hardened instance metadata service (IMDS) mitigates
        options:
          - Slow network speeds
          - An attacker using a server-side request forgery flaw to steal the workload's credentials
          - High storage costs
          - Expired TLS certificates
        answer: 1
        explanation: Hardened IMDS blocks the SSRF-to-credential-theft path that exposes a workload's role credentials.
      - prompt: A guardrail such as policy-as-code that refuses to create a public bucket is better than finding one later because it
        options: [Runs faster, Prevents the whole class of misconfiguration rather than detecting it after exposure, Needs no permissions, Encrypts the data]
        answer: 1
        explanation: Preventive guardrails stop the mistake from happening, which is stronger than detecting and remediating it after data is already exposed.

  - slug: cloud-incident-investigation
    title: Investigating a Cloud Incident from Audit Logs
    order: 4
    difficulty: intermediate
    summary: Trace an attacker through cloud audit logs from first access to data exfiltration.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["sc200:1", "sc200:3", "cysa:3.2", "secplus:4.8"]
    learning_objectives:
      - Name the cloud audit log that records control-plane actions on each major platform
      - Reconstruct an attacker's path through identity, persistence and data access
      - Produce a cloud incident timeline and the containment actions it calls for
    theory: |
      In the cloud the attacker's moves show up in the **control plane**, the API calls that
      create, change and delete resources, and every major platform records them. On AWS this is
      **CloudTrail**, on Azure the **Activity log** and sign-in logs, on Google Cloud the **Cloud
      Audit Logs**. Each entry carries who made the call, from where, what action, on what
      resource, and whether it succeeded. That is enough to rebuild an incident even when you
      never touch the hosts.

      Cloud intrusions follow a recognisable shape. Access usually starts with a **stolen
      credential or key**, so the first sign is a sign-in or API call from a new location or a
      service account behaving like a person. Next comes **escalation and persistence**, attaching
      an admin policy, creating a new access key, adding a user, or changing a role so the access
      survives. Then the objective, often **data access or exfiltration** from object storage or a
      database, or spinning up expensive compute. Reading the log in that order turns a pile of
      events into a story.

      Your output is a **timeline** and a set of **containment** actions. The timeline lists each
      event with its time, identity, source and resource. Containment in the cloud is fast and
      specific, disable or rotate the credential, detach the added policy, revoke sessions, and
      lock down the exposed resource, and every step should itself be recorded so the response is
      auditable.
    examples:
      - title: A persistence step in the audit log
        body: |
          time=14:02  identity=svc-ci  action=AttachUserPolicy  policy=AdministratorAccess  result=success
          A build service account granting itself admin is escalation, not normal CI behaviour.
      - title: Reading the exfiltration step
        body: |
          time=14:19  identity=svc-ci  action=GetObject  bucket=customer-exports  count=3100
          A sudden bulk read of an export bucket by that same identity is the likely objective.
    exercise:
      title: Reconstruct a cloud intrusion from a log sample
      environment: A sample cloud audit log (CloudTrail, Azure Activity or a GCP equivalent) in a notebook or SIEM
      tools: [A sample audit log, jq or a SIEM, a timeline template]
      steps:
        - Load a sample cloud audit log covering a suspected incident window.
        - Find the first suspicious authentication or API call and note the identity, source and time.
        - Follow that identity forward and flag any escalation or persistence action, such as a policy attach or a new access key.
        - Identify the data-access or resource-creation events that look like the attacker's objective.
        - Build a timeline with one row per event, each carrying time, identity, source, action and resource.
        - List the containment actions the incident calls for and the order you would do them in.
        - Note which log fields you would turn into a detection so this is caught sooner next time.
      deliverable: A cloud incident timeline and an ordered containment action list, with one proposed detection.
    expected_outcome: >
      Given a cloud audit log you can reconstruct an attacker's path from first access
      to objective, produce a timeline, and name the containment actions and a detection.
    quiz:
      - prompt: Which log records control-plane API actions on AWS?
        options: [CloudTrail, A browser history, The billing PDF, The OS syslog]
        answer: 0
        explanation: CloudTrail records who made which API call on which resource, the backbone of an AWS investigation.
      - prompt: A build service account attaches AdministratorAccess to itself. This is best read as
        options:
          - Normal continuous integration
          - Privilege escalation and likely persistence
          - A billing event
          - A network scan
        answer: 1
        explanation: A service account granting itself admin is escalation and a persistence foothold, not routine CI.
      - prompt: A sensible first containment step for a compromised cloud credential is to
        options: [Buy more storage, Disable or rotate the credential and revoke its sessions, Restart the website, Delete the audit log]
        answer: 1
        explanation: Cutting off the attacker's access by disabling or rotating the credential comes first; never destroy the logs.
      - prompt: Why read cloud audit events in the order access, then escalation, then objective?
        options: [It is alphabetical, It turns scattered events into a coherent attack story, It is required by law, It saves disk space]
        answer: 1
        explanation: Following the attacker's natural progression reconstructs the incident instead of leaving a pile of events.

  - slug: cloud-iam-privilege
    title: Cloud Identity, Roles and Least Privilege
    order: 5
    difficulty: intermediate
    summary: Spot over-broad cloud permissions and privilege-escalation paths in roles and policies.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc200:1", "sc900:2"]
    learning_objectives:
      - Describe how cloud access is granted through policies, roles and service identities
      - Recognise over-broad permissions and privilege-escalation paths
      - Name the controls and signals that keep cloud identity least-privileged
    theory: |
      In the cloud, identity is the perimeter and misconfigured permissions are the most common
      serious risk. Access is granted by **policies** that list allowed actions and are attached to
      **roles**, users and **service identities**, the managed identities, service accounts and
      instance roles that let workloads call the platform without a human. Because almost everything
      is an API call, a permission is effectively a capability, and a careless grant hands an
      attacker that capability.

      The failure modes are predictable. **Over-broad permissions**, the wildcard `*:*` or a
      service with far more rights than it uses, give a huge blast radius. **Long-lived access
      keys** are credentials waiting to leak. And the dangerous one is a **privilege-escalation
      path**: a role allowed to modify its own policy, attach an admin policy, or assume a more
      powerful role can quietly promote itself. Spotting these needs you to read the policy, not
      just trust the role's name.

      The controls are about caps and review. **Least privilege** grants only what is used, and
      **permission boundaries** or **service control policies** cap what any identity can ever do,
      however its policies change. Access analyzers and entitlement reviews surface unused and risky
      grants. For a SOC, the live signals tie back to incidents: a new admin-policy attach, a role
      assuming another it never normally does, and fresh access-key creation are all worth an alert.
    examples:
      - title: An over-broad policy
        body: |
          Statement   Effect=Allow  Action=*  Resource=*
          A policy granting every action on every resource is the opposite of least privilege.
      - title: A privilege-escalation path
        body: |
          Role app-ci may call AttachRolePolicy on itself
          It can attach AdministratorAccess to its own role and become admin, so the grant is dangerous.
    exercise:
      title: Audit cloud roles for least privilege
      environment: A sample set of cloud IAM policies and roles in a notebook or console export
      tools: [Sample IAM policies and roles, a policy reference, a notes file]
      steps:
        - List the roles and service identities in the sample and the policies attached to each.
        - Flag any policy using wildcard actions or resources and note what it could reach.
        - Identify any long-lived access keys and say why they are a risk.
        - Look for privilege-escalation paths, such as a role that can modify its own policy or assume a stronger role.
        - Recommend a least-privilege change and where a permission boundary or service control policy would cap the risk.
        - Name the identity events you would alert on, such as a new admin-policy attach or access-key creation.
      deliverable: An IAM audit note listing over-broad policies, escalation paths, a least-privilege fix and the identity alerts to add.
    expected_outcome: >
      You can read cloud policies for over-broad grants and escalation paths, recommend
      least-privilege caps, and name the identity signals that tie into incident detection.
    quiz:
      - prompt: In the cloud, a permission is effectively
        options: [A cosmetic label, A capability, since almost everything is an API call, A billing line, A network port]
        answer: 1
        explanation: Because cloud actions are API calls, granting a permission grants the capability to perform them.
      - prompt: Which policy is the clearest least-privilege violation?
        options:
          - A read-only policy on one bucket
          - A policy allowing all actions on all resources
          - A policy scoped to one function
          - A deny-all policy
        answer: 1
        explanation: A wildcard allow on every action and resource gives the widest possible blast radius.
      - prompt: A role that can attach an admin policy to itself represents
        options: [Normal automation, A privilege-escalation path, A backup job, A logging feature]
        answer: 1
        explanation: Being able to grant itself more power lets the role escalate to admin, so the grant is dangerous.
      - prompt: What caps what an identity can ever do regardless of its attached policies?
        options: [A faster region, A permission boundary or service control policy, A larger instance, A longer access key]
        answer: 1
        explanation: Permission boundaries and service control policies set a ceiling that individual policy grants cannot exceed.

  - slug: cloud-containers-serverless
    title: Securing Containers and Serverless Workloads
    order: 6
    difficulty: intermediate
    summary: Secure container images and functions across build, deploy and run, and give each the least privilege it needs.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.1", "sc200:2"]
    learning_objectives:
      - Describe where risk enters a container workload across build, registry and runtime
      - Explain what serverless functions change about the attack surface
      - Apply least privilege to the identity a container or function runs as
    theory: |
      Containers and serverless functions package an application with its dependencies and run it on
      shared cloud infrastructure, and the security problems follow that lifecycle. At **build** time
      the risk is the image contents: a base image with known vulnerabilities, or secrets baked into
      a layer. In the **registry** the risk is trust: pulling an unsigned or unverified image, or one
      that has drifted since it was scanned. At **runtime** the risk is what the container can do,
      whether it runs as root, what it can reach on the network, and whether it can escape to the
      host. Scanning images for known vulnerabilities and signing them so only trusted images deploy
      covers the first two stages; restricting the running container covers the third.

      **Serverless** functions change the surface rather than removing it. There is no server for you
      to patch, which is the appeal, but the function's **code and dependencies** are still yours to
      secure, and the function runs with an **identity** that holds cloud permissions. The classic
      serverless mistake is giving a small function a broad role, so a flaw in a few lines of code
      inherits wide access to the account. Event-driven triggers also widen the entry points, since
      a function may run in response to an upload, a queue message or an API call.

      The thread through both is **least privilege on the workload's identity**. A container or
      function should run as a non-root user where it can, hold only the cloud permissions its job
      needs, and reach only the services it must. That way a compromised workload is contained to
      what little it was allowed to do. This builds on the earlier least-privilege lesson, which
      covered human and service roles; here the same principle is applied to the ephemeral identity a
      container or function runs under.
    examples:
      - title: An over-privileged function
        body: |
          function "resize-image" role: AdministratorAccess
          A thumbnail function with full admin rights turns one code flaw into full account access.
      - title: A vulnerable base image
        body: |
          image scan: base layer "oldlinux:1.0" - 42 known CVEs, 3 critical
          Known-vulnerable base layers ship their flaws into every container built on them.
    exercise:
      title: Review a container and serverless setup for weaknesses
      environment: A sample container image definition and a serverless function with its role, on paper or in a lab
      tools: [A sample Dockerfile or image manifest, a function definition and its role, a notes file]
      steps:
        - Walk the container lifecycle and name the main risk at build, registry and runtime.
        - Inspect the image definition for a vulnerable base image, baked-in secrets or running as root.
        - Describe how image scanning and signing would address the build and registry risks.
        - Examine the serverless function's role and decide whether it follows least privilege.
        - Rewrite the function's permissions to only what its job needs, and say what a compromise could then reach.
        - List the event triggers for the function and note which widen the attack surface.
      deliverable: A review note listing the container and serverless weaknesses found and the least-privilege and scanning fixes for each.
    expected_outcome: >
      You can identify where risk enters a container workload, explain what serverless changes about
      the attack surface, and tighten the identity a container or function runs as.
    quiz:
      - prompt: At which stage does an unsigned or unverified image mainly create risk?
        options: [Only at build, In the registry, where trust in the image is established before it is pulled, Never, Only after deletion]
        answer: 1
        explanation: The registry is where image trust matters; pulling unsigned or drifted images undermines it.
      - prompt: What does serverless change about security?
        options:
          - It removes all security concerns
          - It removes the server to patch, but the code, dependencies and the function's identity permissions are still yours to secure
          - It makes code unhackable
          - It encrypts everything automatically
        answer: 1
        explanation: Serverless offloads the server, but your code, its dependencies and its granted permissions remain your responsibility.
      - prompt: Giving a small function a broad cloud role is dangerous because
        options:
          - Functions cannot use roles
          - A flaw in a few lines of code then inherits wide access to the account
          - It makes the function slower
          - Broad roles are free
        answer: 1
        explanation: An over-privileged function turns one small code flaw into account-wide access.
      - prompt: The common principle for securing both containers and functions is
        options: [Run everything as root, Least privilege on the workload's identity so a compromise is contained, Disable logging, Use the largest instance]
        answer: 1
        explanation: Running with only the permissions the job needs limits what a compromised workload can do.
  - slug: cloud-network-segmentation
    title: Cloud Network Security and Segmentation
    order: 7
    difficulty: intermediate
    summary: Design and monitor cloud network boundaries with virtual networks, security groups, private endpoints and egress control, so a compromised workload cannot roam freely.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.1", "sc200:1"]
    learning_objectives:
      - Explain how cloud virtual networks and security groups segment workloads
      - Use private endpoints and egress control to limit exposure and exfiltration
      - Monitor flow logs to detect lateral movement and unexpected connections
    theory: |
      Cloud networking is software-defined, which makes segmentation both easier and easier to get
      wrong. Workloads live in a **virtual network** (VPC or VNet) carved into subnets, and traffic
      between them is governed by **security groups** and network ACLs, stateful rules that say which
      sources, ports and destinations are allowed. The default posture should be deny, with access
      opened deliberately, so a web tier can reach the app tier and the app tier can reach the
      database, but nothing can reach the database directly from the internet. Good segmentation means
      a compromise of one workload does not hand the attacker the whole environment.

      Two controls cut exposure sharply. **Private endpoints** let workloads reach managed services
      (storage, databases, key vaults) over the provider's private network instead of the public
      internet, so the service never needs a public face. **Egress control** governs outbound traffic,
      which is what most designs neglect, and it is the path data exfiltration and command-and-control
      take. Restricting outbound to known destinations, through a controlled egress point, turns a quiet
      data theft into a blocked connection and an alert. A storage bucket or database reachable from the
      public internet is the classic cloud breach, and segmentation plus private access is what prevents
      it.

      Segmentation is only trustworthy if you can **see** the traffic. Cloud **flow logs** (VPC Flow
      Logs, NSG flow logs) record the connections allowed and denied, and they are where a SOC spots
      lateral movement, an internal host suddenly talking to many others, or a workload reaching an
      external IP it never used before. As elsewhere, a finding is a lead: a new connection may be a
      legitimate deployment, so it is checked against expected architecture before action. Design the
      boundaries, enforce least-exposure, and monitor the flows that cross them.
    examples:
      - title: Tiered segmentation with default deny
        body: |
          Internet -> web subnet (443 only)
          web      -> app subnet (app port only)
          app      -> db subnet  (db port only)    db NOT reachable from internet
          Each hop is an explicit allow; everything else is denied.
      - title: Egress control catching exfiltration
        body: |
          Open egress:    workload can send data anywhere -> silent exfil possible
          Controlled:     outbound only to approved endpoints; a new destination is blocked + logged
          The blocked connection becomes an alert instead of a breach.
    exercise:
      title: Design and review cloud network segmentation
      environment: A cloud free tier or a diagram tool, plus sample flow logs (provided or exported)
      tools: [A cloud account free tier or a diagram tool, sample VPC/NSG flow logs, a notes file]
      steps:
        - Design a three-tier virtual network (web, app, data) and write the security-group rules that allow only the necessary traffic between tiers, defaulting to deny.
        - Confirm the data tier has no path from the public internet and explain how a private endpoint would protect a managed service it uses.
        - Define an egress-control rule that limits outbound traffic and state what it should do when a workload contacts an unapproved destination.
        - Review a sample of flow logs and identify one allowed connection and one denied connection, explaining what each tells you.
        - Spot one flow-log pattern that would suggest lateral movement or exfiltration and describe how you would confirm it against the expected architecture.
        - Note one common misconfiguration (such as a publicly reachable storage bucket) and the segmentation change that prevents it.
      deliverable: A segmentation design with security-group rules, the private-endpoint and egress-control decisions, and a flow-log review identifying a normal and a suspicious pattern with how you would confirm it.
    expected_outcome: >
      You can design cloud network segmentation with least-exposure security groups, private endpoints
      and egress control, and monitor flow logs to detect lateral movement and exfiltration while
      confirming findings against the intended architecture.
    quiz:
      - prompt: The default posture for cloud security-group rules should be
        options:
          - Allow all, then block problems
          - Deny by default, opening only the access deliberately needed
          - Open to the internet
          - Random
        answer: 1
        explanation: Default-deny with deliberate allows limits what a compromised workload can reach.
      - prompt: A private endpoint improves security by
        options:
          - Making the service public
          - Letting workloads reach a managed service over the private network so it needs no public face
          - Encrypting the CPU
          - Removing flow logs
        answer: 1
        explanation: Private endpoints keep managed services off the public internet, cutting their exposure.
      - prompt: Why is egress (outbound) control important in the cloud?
        options:
          - It speeds up downloads
          - It is the path data exfiltration and command-and-control take, so restricting it blocks and reveals them
          - It is never needed
          - It replaces security groups
        answer: 1
        explanation: Controlling outbound traffic turns silent exfiltration into a blocked, alerted connection.
      - prompt: Cloud flow logs are mainly used to
        options:
          - Store files
          - Record allowed and denied connections so lateral movement and odd traffic can be detected
          - Replace security groups
          - Bill customers
        answer: 1
        explanation: Flow logs give the visibility to spot lateral movement and unexpected connections across the network.
  - slug: cloud-data-protection-kms
    title: Cloud Data Protection and Key Management
    order: 8
    difficulty: intermediate
    summary: Protect data in the cloud with encryption and managed keys, and understand who holds the keys, how access is controlled, and how key misuse shows up in logs.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.1", "sc900:2"]
    learning_objectives:
      - Explain cloud encryption at rest and in transit and the role of a KMS
      - Describe provider-managed versus customer-managed keys and when each fits
      - Monitor key usage and access so encryption is not quietly undermined
    theory: |
      In the cloud, encryption is the default expectation, so the interesting questions are about **keys**:
      who holds them, who can use them, and how that is controlled. Data is encrypted **at rest** in storage
      and databases and **in transit** over TLS, but encryption only protects data to the extent the keys
      are protected. A **key management service** (KMS) centralises creating, storing, rotating and
      controlling access to keys, and crucially logs every use, which turns "is this data encrypted" into
      "who decrypted this, when, and were they allowed to".

      The main design choice is **who manages the key**. **Provider-managed keys** are the simplest: the
      cloud handles everything, which is fine for most data. **Customer-managed keys** (CMKs) give you
      control over rotation and, most importantly, the ability to **revoke** access, destroying or disabling
      the key makes the data unreadable even to the provider's services, which matters for regulated data or
      a clean offboarding. The strongest tier, **customer-supplied** or HSM-backed keys, keeps key material
      under your sole control at the cost of complexity. The right choice follows the data's sensitivity, not
      a reflex to always pick the most control.

      Because the key is now the crown jewel, **access to the key is the real access control**. KMS key
      policies decide which identities may encrypt, decrypt or manage a key, and least privilege here is
      essential, an over-broad key policy undoes the encryption, since anyone who can call decrypt can read
      the data. The SOC watches KMS logs for the tells of abuse: a key used by an unexpected identity, a
      spike in decrypt calls, or an attempt to disable or schedule deletion of a key (a ransomware or
      destruction move). As always a hit is a lead confirmed against normal usage, but key activity is where
      cloud data compromise becomes visible.
    examples:
      - title: Customer-managed key enabling revocation
        body: |
          Provider-managed: simple; provider controls the key
          Customer-managed: you rotate AND can disable the key -> data unreadable on offboarding
          Choose by sensitivity and the need to revoke.
      - title: Key misuse in the logs
        body: |
          KMS log: Decrypt by role "build-ci" on the HR data key -> unexpected identity
          KMS log: ScheduleKeyDeletion on a production key       -> possible destruction attack
          Both are leads to confirm against normal usage.
    exercise:
      title: Design key management and monitor key usage
      environment: A cloud free tier with a KMS, or sample key policies and KMS logs
      tools: [A cloud KMS or sample policies, sample KMS logs, a notes file]
      steps:
        - For a sample data set of mixed sensitivity, decide which data uses provider-managed versus customer-managed keys and justify each.
        - Write or review a key policy and apply least privilege so only the identities that need encrypt/decrypt have it.
        - Explain how disabling a customer-managed key would affect the data and when you would use that (offboarding, incident).
        - Review sample KMS logs and identify one key use by an unexpected identity and one key-management action worth alerting on.
        - State how you would confirm a suspicious key use before acting, and one alert you would build on KMS activity.
        - Note one misconfiguration (an over-broad key policy) that would undermine the encryption and how to fix it.
      deliverable: A key-management design (managed-versus-customer choices with least-privilege policies), a KMS-log review flagging one suspicious use and one alert-worthy action, and one misconfiguration with its fix.
    expected_outcome: >
      You can design cloud data protection around key management, choose provider- versus customer-managed
      keys by sensitivity, enforce least privilege on key access, and monitor KMS logs to catch key misuse
      before it becomes a data compromise.
    quiz:
      - prompt: In the cloud, encryption only protects data to the extent that
        options:
          - The network is fast
          - The keys are protected and their use is controlled and logged
          - The data is public
          - Backups exist
        answer: 1
        explanation: Encryption hinges on key protection and access control, so key management is the real control.
      - prompt: A key advantage of customer-managed keys over provider-managed keys is
        options:
          - They are always cheaper
          - You can rotate and revoke the key, making data unreadable even to the provider's services
          - They need no policy
          - They disable logging
        answer: 1
        explanation: Customer-managed keys give control over rotation and revocation, which matters for regulated data and offboarding.
      - prompt: An over-broad KMS key policy is dangerous because
        options:
          - It slows encryption
          - Anyone who can call decrypt can read the data, undoing the encryption
          - It deletes logs
          - It encrypts twice
        answer: 1
        explanation: Access to the key is access to the data, so least privilege on key policies is essential.
      - prompt: A KMS log entry scheduling deletion of a production key should be treated as
        options: [Routine, A lead to confirm, possibly a destruction or ransomware action, A billing event, A success message]
        answer: 1
        explanation: Disabling or deleting keys can destroy data access, so such actions are investigated against normal usage.
  - slug: cloud-posture-misconfiguration
    title: Cloud Security Posture and Misconfiguration
    order: 9
    difficulty: intermediate
    summary: Find and fix the misconfigurations that cause most cloud breaches, using posture management to continuously check cloud resources against secure baselines.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "cysa:2.1", "sc900:2"]
    learning_objectives:
      - Explain why misconfiguration is the leading cause of cloud breaches
      - Describe cloud security posture management (CSPM) and what it checks
      - Prioritise and remediate the misconfigurations that matter most
    theory: |
      Most cloud breaches are not clever exploits; they are **misconfigurations**, a storage bucket left
      public, a database exposed to the internet, over-permissive access, logging switched off. The cloud's
      speed and self-service are the cause: anyone can spin up resources in minutes, and a single wrong
      setting exposes data at internet scale. So a central cloud-security discipline is continuously checking
      that resources match a **secure baseline**, which is exactly what **cloud security posture management**
      (CSPM) does.

      CSPM tools connect to the cloud account through its API and continuously evaluate every resource
      against a library of checks drawn from provider best practice and benchmarks like the CIS foundations:
      are any storage buckets public, are databases reachable from the internet, is encryption enabled, is
      logging and monitoring turned on, are there identities with excessive permissions, are there unused
      credentials. Because the cloud exposes its whole configuration through the API, this assessment is
      comprehensive in a way on-premises rarely is, the tool can see every resource and its settings, not a
      sample. The output is a prioritised list of findings mapped to the resources and accounts they affect.

      The skill, as always, is **prioritisation and remediation**, not drowning in findings. A public bucket
      holding customer data is an emergency; the same setting on an empty test bucket is noise, so findings
      are triaged by the sensitivity and exposure of what they affect, not the raw rule. The strongest
      programmes shift this left, checking infrastructure-as-code templates before deployment so the
      misconfiguration never reaches production, and wiring CSPM alerts into the SOC so a newly public bucket
      raises an alarm in minutes. The lesson is that in the cloud, configuration *is* security: watching and
      fixing posture continuously prevents the single most common way organisations get breached.
    examples:
      - title: The classic cloud breach
        body: |
          storage bucket: "public read" + customer data inside
          one wrong setting -> data exposed at internet scale
          No exploit required; the misconfiguration is the breach.
      - title: Prioritising posture findings
        body: |
          Public bucket, empty test data   -> low (noise)
          Public bucket, customer PII       -> EMERGENCY
          Triage by sensitivity + exposure, not the raw rule count.
    exercise:
      title: Assess cloud posture and remediate misconfigurations
      environment: A cloud free tier or a provided set of cloud configuration/CSPM findings
      tools: [A cloud account or sample config/findings, a CSPM tool or a CIS benchmark checklist, a notes file]
      steps:
        - Explain why misconfiguration, rather than exploitation, causes most cloud breaches.
        - Review a set of resources (or CSPM findings) against a baseline and list the misconfigurations found.
        - Identify the highest-risk finding by the sensitivity and exposure of the resource it affects, not the raw rule.
        - Write the remediation for that finding and describe how you would verify it is fixed.
        - Describe how checking infrastructure-as-code before deployment would have prevented one finding.
        - Propose one CSPM alert to wire into the SOC (for example a newly public bucket) and why it matters.
      deliverable: A posture assessment listing the misconfigurations, the highest-risk one with its remediation and verification, a prevent-at-deploy example, and one SOC alert to add.
    expected_outcome: >
      You can explain why misconfiguration drives most cloud breaches, use posture management to check
      resources against a baseline, and prioritise and remediate the misconfigurations that actually expose
      sensitive data.
    quiz:
      - prompt: The leading cause of cloud breaches is
        options:
          - Zero-day exploits
          - Misconfiguration, such as public storage or over-permissive access
          - Slow networks
          - Weak encryption algorithms
        answer: 1
        explanation: Most cloud breaches stem from wrong settings exposing data, not sophisticated exploits.
      - prompt: Cloud security posture management (CSPM) works by
        options:
          - Scanning network ports from outside
          - Continuously evaluating cloud resources via the API against a secure baseline
          - Reading application source code
          - Testing user passwords
        answer: 1
        explanation: CSPM uses the cloud API to check every resource's configuration against best-practice baselines.
      - prompt: Posture findings should be prioritised by
        options:
          - The raw number of rules broken
          - The sensitivity and exposure of the resources they affect
          - Alphabetical order
          - The time of day
        answer: 1
        explanation: A public bucket of customer data is an emergency; the same on empty test data is noise.
      - prompt: Checking infrastructure-as-code before deployment helps because
        options:
          - It is slower
          - The misconfiguration is caught before it ever reaches production
          - It disables logging
          - It replaces CSPM entirely
        answer: 1
        explanation: Shifting posture checks left stops bad configurations from being deployed in the first place.
