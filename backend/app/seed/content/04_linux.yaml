slug: linux-security
title: Linux Security Operations
domain: Linux Security
order: 4
description: >
  Most servers and cloud workloads run Linux. Learn where Linux records
  authentication and how to find and fix risky configurations.
lessons:
  - slug: linux-auth-logs
    title: Investigating SSH Brute Force in auth.log
    order: 1
    difficulty: beginner
    summary: Use grep, awk and journalctl to find SSH attacks and confirm whether any succeeded.
    theory_minutes: 10
    lab_minutes: 50
    objectives: ["secplus:2.4", "secplus:4.9", "cysa:1.3"]
    learning_objectives:
      - Locate authentication logs on Debian/Ubuntu and RHEL-family systems
      - Count failed and successful SSH logons per source IP with command-line tools
      - Determine whether a brute-force attempt was successful
    theory: |
      Linux authentication events are written by sshd, sudo and PAM. On Debian and Ubuntu they
      go to **/var/log/auth.log**; on RHEL, Rocky and Fedora to **/var/log/secure**. On systemd
      systems `journalctl -u ssh` (or `-u sshd`) shows the same entries.

      Lines to know: `Failed password for <user> from <ip>`, `Invalid user <name> from <ip>`
      (the account does not exist, a sign of username guessing), and `Accepted password` or
      `Accepted publickey`. A single source with hundreds of failures followed by an
      **Accepted** line is the critical pattern: the attacker got in.

      The classic toolchain is `grep` to select lines, `awk` to pull out fields, and
      `sort | uniq -c | sort -nr` to count. These one-liners are the Linux equivalent of a SIEM
      aggregation and are invaluable on a server with no agent installed.
    examples:
      - title: Top attacking IPs
        body: |
          grep "Failed password" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr | head
            412 198.51.100.7
             38 203.0.113.80
      - title: Did any attacker succeed?
        body: |
          grep "Accepted" /var/log/auth.log | grep 198.51.100.7
          Oct 19 03:12:44 web01 sshd[2211]: Accepted password for deploy from 198.51.100.7 port 50122 ssh2
    exercise:
      title: Attack and investigate your own SSH server
      environment: Two VMs on a host-only network, an Ubuntu Server target and a Kali or second Ubuntu attacker
      tools: [ssh, hydra, grep, awk, journalctl, fail2ban]
      steps:
        - On the target, install openssh-server and create a user `labuser` with a weak password you choose.
        - From the attacker, run a small Hydra attack against `labuser` with a ten-word list that contains the real password.
        - On the target, count failed attempts per IP with the grep/awk pipeline from the examples.
        - Identify the exact time the attacker succeeded and the source port used.
        - List invalid usernames the attacker tried, if any, with `grep "Invalid user"`.
        - Install fail2ban, enable the sshd jail, repeat the attack and confirm the attacker IP is banned with `fail2ban-client status sshd`.
        - Disable password authentication in /etc/ssh/sshd_config, restart sshd, and confirm password logins now fail.
      deliverable: A short incident summary with attacker IP, number of attempts, time of compromise and the two mitigations you applied.
    expected_outcome: >
      You can prove from logs whether a brute-force attack succeeded and you can stop the
      next one with rate limiting and key-only authentication.
    quiz:
      - prompt: On Ubuntu, where are SSH authentication events written by default?
        options: [/var/log/secure, /var/log/auth.log, /var/log/kern.log, /etc/ssh/log]
        answer: 1
        explanation: Debian and Ubuntu use /var/log/auth.log; RHEL-family systems use /var/log/secure.
      - prompt: What does "Invalid user admin from 198.51.100.7" tell you?
        options:
          - The admin password was wrong
          - The attacker tried a username that does not exist on the system
          - The admin account was locked
          - The connection used a public key
        answer: 1
        explanation: '"Invalid user" means the account name is unknown, indicating username guessing.'
      - prompt: Which pipeline counts occurrences of each value and sorts them, highest first?
        options: ["sort | uniq -c | sort -nr", "uniq | sort", "wc -l | sort", "head | tail"]
        answer: 0
        explanation: uniq -c counts adjacent duplicates, so sort first, then sort the counts numerically in reverse.
      - prompt: Which change most effectively stops SSH password brute force?
        options:
          - Changing the hostname
          - Disabling password authentication and using keys
          - Increasing log verbosity
          - Moving auth.log to another folder
        answer: 1
        explanation: With key-only authentication, guessed passwords are useless.

  - slug: linux-permissions-hardening
    title: Permissions, SUID and Basic Hardening
    order: 2
    difficulty: beginner
    summary: Read Linux permissions, find dangerous SUID binaries and apply a hardening baseline.
    theory_minutes: 10
    lab_minutes: 45
    objectives: ["secplus:2.5", "secplus:4.1", "cysa:2.4"]
    learning_objectives:
      - Read and change permissions with chmod and chown, including octal notation
      - Explain why SUID binaries and world-writable files are privilege-escalation risks
      - Apply and verify a small hardening baseline
    theory: |
      Every file has an owner, a group and permissions for **user**, **group** and **others**:
      read (4), write (2) and execute (1). `chmod 640 file` means owner read/write, group read,
      others nothing. The principle of **least privilege** says nothing should have more access
      than it needs.

      The **SUID** bit makes a program run as its owner, usually root, whatever user starts it.
      `passwd` needs this, but a SUID copy of `find`, `vim` or `bash` lets any user become root.
      GTFOBins documents how common binaries can be abused this way. **World-writable** files
      and directories (other users can write) let attackers plant or modify scripts that
      privileged processes later run.

      A basic hardening baseline: patch regularly (`unattended-upgrades`), remove unused
      services, enable a host firewall (`ufw`), disable root SSH login, and audit SUID and
      world-writable files on a schedule. Tools such as **Lynis** score a system against
      hundreds of such checks.
    examples:
      - title: Finding SUID binaries
        body: |
          find / -perm -4000 -type f 2>/dev/null
          /usr/bin/passwd
          /usr/bin/sudo
          /usr/bin/find      <-- not normally SUID: investigate
      - title: Octal permissions
        body: |
          -rw-r----- 1 root adm 4096 auth.log   = 640
          -rwxr-xr-x 1 root root 1234 script.sh = 755
    exercise:
      title: Plant, find and fix privilege-escalation risks
      environment: An Ubuntu VM where you have sudo
      tools: [find, chmod, ufw, Lynis]
      steps:
        - As root, simulate a misconfiguration with `sudo cp /usr/bin/find /usr/local/bin/find2 && sudo chmod u+s /usr/local/bin/find2`.
        - As a normal user, run `find / -perm -4000 -type f 2>/dev/null` and spot the planted binary.
        - Use GTFOBins to understand how `find` with SUID can spawn a root shell, and verify it in your VM with `find2 . -exec /bin/sh -p \; -quit`.
        - Remove the SUID bit with `sudo chmod u-s /usr/local/bin/find2` and confirm the escalation no longer works.
        - Find world-writable files with `find / -xdev -type f -perm -0002 2>/dev/null`.
        - Enable ufw allowing only SSH, set `PermitRootLogin no`, and install unattended-upgrades.
        - Run `sudo lynis audit system` before and after your changes and compare the hardening index.
      deliverable: Before/after Lynis hardening scores and a list of the changes you made.
    expected_outcome: >
      You can find and remove the most common Linux privilege-escalation misconfigurations
      and measure the effect of hardening.
    quiz:
      - prompt: What does `chmod 640 report.txt` set?
        options:
          - Owner rwx, group r, others none
          - Owner rw, group r, others none
          - Owner rw, group rw, others r
          - Everyone read only
        answer: 1
        explanation: 6 = read+write for owner, 4 = read for group, 0 = nothing for others.
      - prompt: Why is a SUID-root copy of /bin/bash dangerous?
        options:
          - It uses more memory
          - Any user who runs it can get a root shell
          - It disables logging
          - It prevents updates
        answer: 1
        explanation: SUID runs the program with the owner's (root's) privileges.
      - prompt: Which command lists SUID files?
        options:
          - "find / -perm -4000 -type f"
          - "ls -la /etc"
          - "chmod -R 755 /"
          - "grep suid /etc/passwd"
        answer: 0
        explanation: -perm -4000 matches files with the SUID bit set.
      - prompt: The principle of least privilege means
        options:
          - Users get admin rights to avoid support tickets
          - Every account and process gets only the access it needs
          - Only the CEO has passwords
          - Root logins are preferred
        answer: 1
        explanation: Least privilege limits damage when an account or process is compromised.

  - slug: linux-audit-persistence
    title: Auditing and Hunting Persistence on Linux
    order: 3
    difficulty: intermediate
    summary: Turn on Linux auditing, then hunt the common persistence spots - cron, systemd, shell startup files - and investigate a suspicious process.
    theory_minutes: 12
    lab_minutes: 55
    objectives: ["secplus:4.9", "cysa:1.2", "cysa:3.2"]
    learning_objectives:
      - Configure Linux auditing and know which logs answer which question
      - Enumerate the common persistence locations on a Linux host
      - Investigate a suspicious process from a running system back to its on-disk source
    theory: |
      To investigate a Linux host you first need it to keep records. **journald** (via
      `journalctl`) holds systemd's structured logs; **auditd** records security-relevant
      kernel events (file access, execution, privilege changes) against rules you define;
      and classic files under `/var/log` (auth, syslog) still matter. The skill is
      knowing which to ask: auth logs for who logged in, auditd for what a process did,
      journald for service behaviour. A SOC enables these before an incident, ships them
      off-host so an attacker cannot simply wipe them, and protects their integrity.

      Attackers want to survive a reboot, so **persistence** lives in a handful of
      predictable places. **cron** (`/etc/crontab`, `/etc/cron.*`, per-user crontabs) and
      **systemd** units and timers are the classics; **shell startup files**
      (`~/.bashrc`, `~/.profile`, `/etc/profile.d`) run code at login; **SSH
      authorized_keys** grants silent re-entry; and service or package hooks can relaunch
      a payload. Knowing the list turns hunting into a checklist: enumerate each location
      and compare against a known-good baseline, because a new timer or an unfamiliar key
      is far easier to spot than arbitrary malware.

      When you find a suspicious **running process**, you trace it from memory back to
      disk. `/proc/<pid>` is the bridge: `exe` is a link to the binary, `cwd` its working
      directory, `cmdline` how it was launched, and the open sockets show where it talks.
      From there you find how it was started and how it persists, then you have what an
      incident response needs: the indicator, the persistence mechanism to remove, and the
      detection to write so it is caught next time.
    examples:
      - title: Where persistence hides
        body: |
          cron:       /etc/crontab, /etc/cron.d/*, crontab -l   (scheduled re-launch)
          systemd:    /etc/systemd/system/*.service and *.timer (service/timer)
          shell:      ~/.bashrc, /etc/profile.d/*.sh            (runs at login)
          ssh:        ~/.ssh/authorized_keys                    (silent re-entry)
      - title: Tracing a process from PID to disk
        body: |
          $ ls -l /proc/4821/exe     -> /tmp/.cache/update   (binary in a hidden tmp path)
          $ cat /proc/4821/cmdline   -> ./update --daemon
          $ grep -R update /etc/cron* /etc/systemd  -> a systemd timer relaunches it
          Finding: timer = persistence to remove; /tmp binary = IOC to hash and detect.
    exercise:
      title: Audit a host and hunt a planted persistence mechanism
      environment: A disposable Linux VM or container you control (never a production host)
      tools: [auditd, journalctl, systemctl, crontab, ls/grep, a notes file]
      steps:
        - Install and enable auditd, add one rule (for example watch /etc/passwd for writes), and confirm an event appears when you touch the watched file.
        - Use journalctl to find a service's recent logs and note how you would narrow by time and unit.
        - Plant a benign persistence mechanism on the VM yourself (for example a harmless cron entry or systemd timer that writes a timestamp to a file) to act as the thing you will hunt.
        - Enumerate each common persistence location (cron, systemd units and timers, shell startup files, authorized_keys) and find your planted entry by comparing against what you expect.
        - Start the benign process it launches and trace it with /proc/<pid>/exe, cwd and cmdline back to its on-disk binary and how it was started.
        - Remove the persistence, confirm it no longer relaunches, and record the indicators (path, command, mechanism) as you would for an incident.
        - Write one auditd or journald-based detection idea that would have caught the persistence being created.
      deliverable: The working auditd rule and its event, notes showing you found the planted persistence by location, the /proc trace to the binary, and one detection idea.
    expected_outcome: >
      You can enable and use Linux auditing, check every common persistence location
      against a baseline, and trace a suspicious process back to its source and its
      persistence so it can be removed and detected.
    quiz:
      - prompt: Which tool records security-relevant kernel events such as file access and execution against rules you define?
        options: [journalctl, auditd, crontab, top]
        answer: 1
        explanation: auditd applies audit rules and logs matching kernel events for investigation.
      - prompt: Which of these is a common Linux persistence location?
        options: ["A systemd timer unit", "The CPU cache", "The ARP table", "The MOTD banner"]
        answer: 0
        explanation: systemd timers (and services), cron, shell startup files and authorized_keys are classic persistence spots.
      - prompt: To find the on-disk binary behind a running PID you would inspect
        options: ["/proc/<pid>/exe", "/etc/hostname", "/var/run/utmp", "/dev/null"]
        answer: 0
        explanation: /proc/<pid>/exe is a symlink to the executable backing the process.
      - prompt: Why do SOCs ship Linux logs off the host?
        options:
          - To save local disk only
          - So an attacker who compromises the host cannot simply delete the evidence
          - To make them load faster
          - Because journald requires it
        answer: 1
        explanation: Off-host (and integrity-protected) logs survive an attacker trying to cover their tracks.
      - prompt: An unfamiliar entry in ~/.ssh/authorized_keys most likely represents
        options: [A performance tweak, A silent re-entry mechanism for an attacker, A normal backup, A kernel module]
        answer: 1
        explanation: An added public key lets someone log in without a password, a common persistence and re-entry trick.

  - slug: linux-log-triage-cli
    title: Command-Line Log Triage with grep, awk and jq
    order: 4
    difficulty: intermediate
    summary: Turn raw Linux logs into answers using grep, awk, sort, uniq and jq.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.9", "cysa:1.1", "cysa:1.3"]
    learning_objectives:
      - Extract and count fields from text logs with grep, awk, sort and uniq
      - Build a top-talkers and failed-login summary from a raw log file
      - Query structured JSON logs with jq
    theory: |
      A SOC analyst on Linux lives at the command line, because the logs are plain text and the
      tools are already there. The core pattern is a **pipeline**: filter with `grep`, pull out a
      field with `awk`, then rank what is left with `sort`, `uniq -c` and `sort -nr`. That one
      idiom answers most triage questions, such as which address failed to log in the most, which
      URL was requested most often, or which account ran a command.

      `grep` finds lines; its `-E` flag enables extended regular expressions and `-c` counts the
      matches instead of printing them. `awk` splits each line into fields on whitespace by
      default, so `awk '{print $1}'` prints the first column and `-F` changes the delimiter.
      Chaining `sort` into `uniq -c` collapses duplicates into counts, and a final `sort -nr` puts
      the biggest numbers on top. Add `head` to keep only the leaders.

      Modern logs are increasingly **JSON**, one object per line. `jq` parses them safely so you do
      not have to write fragile regexes; it selects records on a field and prints just the values
      you want. Whether the log is text or JSON, the goal is the same, to reduce thousands of lines
      to the handful of rows that answer the question in front of you.
    examples:
      - title: Top failed-login source addresses from auth.log
        body: |
          grep "Failed password" /var/log/auth.log \
            | awk '{print $(NF-3)}' \
            | sort | uniq -c | sort -nr | head
          The count on the left ranks the noisiest source addresses.
      - title: Counting events in a JSON log with jq
        body: |
          jq -r 'select(.event == "login_failed") | .src_ip' events.json \
            | sort | uniq -c | sort -nr | head
          jq handles the quoting and nesting that a regex would get wrong.
    exercise:
      title: Build a triage summary from raw logs
      environment: Any Linux shell or VM with sample log files; work on copies, not live system logs
      tools: [grep, awk, sort, uniq, jq]
      steps:
        - Copy a sample auth.log and a JSON event log into a working directory.
        - Count the total failed logins with `grep -c "Failed password" auth.log`.
        - Produce a ranked list of the source addresses with the most failed logins using an awk and sort-uniq pipeline.
        - For the top source address, list the usernames it tried and decide whether it looks like spraying or brute force.
        - Use `jq` to pull every failed-login record from the JSON log and rank its source addresses the same way.
        - Compare the two logs and note whether the same address appears in both.
        - Write a three-line summary naming the worst offender, the number of attempts and the accounts targeted.
      deliverable: A short triage note with the top source addresses, their attempt counts and the exact commands you ran.
    expected_outcome: >
      You can turn a raw text or JSON log into a ranked summary at the command line
      and answer who, how often and against what without a SIEM.
    quiz:
      - prompt: Which pipeline ranks the most frequent values in a column?
        options:
          - "head then tail"
          - "sort then uniq -c then sort -nr"
          - "grep -v then wc"
          - "awk with no pattern"
        answer: 1
        explanation: Sorting then uniq -c counts duplicates, and a final numeric reverse sort puts the most frequent on top.
      - prompt: By default, awk splits each input line on
        options: [Commas, Whitespace, Colon characters, Tab characters only]
        answer: 1
        explanation: awk uses runs of whitespace as the default field separator; the -F flag changes it.
      - prompt: Why prefer jq over a regular expression for JSON logs?
        options:
          - jq is faster to type
          - jq understands JSON structure, so quoting and nesting do not break it
          - Regular expressions cannot read files
          - jq encrypts the output
        answer: 1
        explanation: jq parses the JSON properly, avoiding the brittle edge cases a regex hits on quotes and nesting.
      - prompt: What does grep -c do?
        options: [Colourises the output, Counts matching lines, Shows surrounding context, Searches case-insensitively]
        answer: 1
        explanation: The -c flag prints the number of matching lines instead of the lines themselves.

  - slug: linux-live-response
    title: Triaging a Live Linux Host
    order: 5
    difficulty: intermediate
    summary: Investigate a running Linux host's processes, network and files before the state changes.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.9", "cysa:1.2", "cysa:3.2"]
    learning_objectives:
      - Capture the volatile state of a suspected Linux host in the right order
      - Use process, network and open-file tools to find a foothold
      - Preserve findings and build a quick timeline without destroying evidence
    theory: |
      When a Linux host is suspected compromised, the running state is the evidence, and it
      disappears on reboot, so triage it live and in order of volatility. Start with **processes**:
      `ps auxf` shows the tree, and the tell-tales are processes running from `/tmp` or `/dev/shm`,
      odd names, or a binary that has been deleted while still running (`ls -l /proc/<pid>/exe`
      shows `(deleted)`). From a suspect PID, `/proc/<pid>/cmdline`, `cwd` and `environ` reveal how
      it was launched.

      Next the **network**: `ss -tupan` lists listening ports and established connections mapped to
      their process, so an unexpected listener or an outbound connection to an odd address points
      straight at the foothold. **Open files** via `lsof` tie processes to the files and sockets
      they hold. Then check **loaded kernel modules** with `lsmod`, since a rootkit may hide there,
      and look for recently changed files with `find / -mtime -1` around the suspected time.

      The discipline matters as much as the commands. **Do not reboot** a host you are triaging; it
      wipes memory, running processes and network state. Record each command and its output,
      capture a memory image if you can, and assemble a short **timeline** of what ran, what it
      connected to and what it touched. That timeline is what turns a hunch into a scoped incident
      you can hand to containment.
    examples:
      - title: A process running from a deleted binary
        body: |
          ps        PID 2041  ./update  (cwd=/tmp)
          /proc     ls -l /proc/2041/exe -> /tmp/update (deleted)
          A running process whose on-disk binary is gone is a classic sign of a dropped implant.
      - title: An unexpected listener tied to a process
        body: |
          ss -tupan   LISTEN  0.0.0.0:4444  users:(("update",pid=2041))
          A process listening on an unusual port is a likely backdoor or reverse-shell handler.
    exercise:
      title: Triage a suspect Linux host from sample captures
      environment: A lab VM or sample command outputs from a suspected-compromised host; work on a copy
      tools: [ps, ss, lsof, find, access to /proc]
      steps:
        - List the full process tree and flag any process running from /tmp, /dev/shm or with an odd name.
        - For one suspect PID, read /proc/<pid>/cmdline, cwd and exe and note whether the binary is marked deleted.
        - List network connections with ss and map any unexpected listener or outbound connection to its process.
        - Use lsof to see the files and sockets the suspect process holds open.
        - Check loaded kernel modules and recently modified files around the suspected time.
        - Record each command and its output, and say why you would not reboot the host yet.
        - Assemble a short timeline of what ran, what it connected to and what it touched.
      deliverable: A triage note with the suspect process, its network and file activity, the evidence you preserved and a short timeline.
    expected_outcome: >
      You can capture a live Linux host's volatile state in order, find a foothold from
      its processes, network and files, and preserve a timeline without destroying evidence.
    quiz:
      - prompt: Why triage a suspected Linux host before rebooting it?
        options:
          - Rebooting is faster
          - A reboot wipes volatile state such as memory, running processes and network connections
          - Rebooting preserves evidence
          - It makes no difference
        answer: 1
        explanation: Volatile state is the evidence; a reboot destroys the running processes, memory and connections you need.
      - prompt: A running process whose on-disk binary shows as (deleted) in /proc/<pid>/exe suggests
        options: [A normal update, A dropped implant that removed its file to hide, A kernel feature, A backup job]
        answer: 1
        explanation: Malware often deletes its binary after launch while the process keeps running, leaving the (deleted) marker.
      - prompt: Which tool maps listening ports and connections to the owning process?
        options: ["ss -tupan", "cat /etc/passwd", "uptime", "echo $PATH"]
        answer: 0
        explanation: ss with those flags lists TCP and UDP listeners and connections together with the process that owns each.
      - prompt: After the triage, the most useful hand-off to containment is
        options: [A reboot, A short timeline of what ran, connected and was touched, A screenshot of the desktop, Nothing]
        answer: 1
        explanation: A timeline of process, network and file activity scopes the incident so containment knows what to act on.

  - slug: linux-privilege-escalation
    title: Detecting Linux Privilege Escalation
    order: 6
    difficulty: advanced
    summary: Find the traces an attacker leaves when escalating from a normal user to root on Linux.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.4", "cysa:1.2", "cysa:3.2"]
    learning_objectives:
      - Describe the common Linux privilege-escalation routes and what each leaves behind
      - Read sudo, auth and audit logs for signs of escalation
      - Separate a legitimate administrative action from an abuse of the same mechanism
    theory: |
      An attacker who lands on a Linux host usually arrives as an **unprivileged user** and then
      works to become **root**. The common routes are well known: abusing **sudo** rights, exploiting
      a **SUID** binary that runs as its owner, using a misconfigured service or cron job that runs
      as root, or a kernel exploit. Each route leaves different traces, and knowing them turns a
      pile of logs into a story.

      Sudo abuse is the most visible. Every sudo invocation is logged with the user, the target
      user and the command, so a normal account suddenly running `sudo` to spawn a shell, or running
      a command through a program that can break out to a shell, stands out. **SUID** abuse is
      quieter: the giveaway is a process whose effective user is root but whose parent chain starts
      from an ordinary user's session, often through a known breakout binary. A cron or service
      misconfiguration shows up as a root process launched from a path a normal user can write to.

      The hard part is telling abuse from legitimate administration, because an admin uses the same
      mechanisms. Context decides: **who** ran it, from **where**, at **what time**, and whether it
      fits their normal pattern. An admin running `sudo apt upgrade` at midday from their usual host
      is routine; a web-service account running `sudo` to launch bash at 3am is not. You also look
      for the **sequence**, enumeration commands, then the escalation attempt, then actions as root,
      which no routine task produces. This builds on the hardening lesson, which prevented these
      weaknesses; here the weakness has been used and the job is to find the evidence after the fact.
    examples:
      - title: A service account breaking out through sudo
        body: |
          sudo: www-data : TTY=pts/1 ; USER=root ; COMMAND=/bin/bash
          A non-interactive service account using sudo to launch a root shell is escalation, not admin work.
      - title: A SUID breakout in the process tree
        body: |
          parent: bash (uid 1001)  ->  find (euid 0, SUID)  ->  sh (uid 0)
          A root shell parented off an ordinary user's SUID binary is a classic privilege-escalation chain.
    exercise:
      title: Investigate a privilege-escalation incident from sample logs
      environment: A sample set of Linux logs (sudo/auth log, audit log and a process listing) from a suspect host
      tools: [Sample auth, sudo and audit logs, a process tree, a notes file]
      steps:
        - List the common privilege-escalation routes and name the log or artifact that would show each.
        - Search the sudo and auth logs for any non-admin account using sudo and note the command it ran.
        - Find a process whose effective user is root but whose parent chain starts from an ordinary user.
        - Decide, with reasons, which events are legitimate administration and which are abuse.
        - Reconstruct the sequence from the first suspicious command to the first action taken as root.
        - State how the account escalated and what you would collect before the host is changed.
      deliverable: A privilege-escalation note with the route used, the log evidence, and the reasoning that separates abuse from normal admin.
    expected_outcome: >
      You can recognise the common Linux privilege-escalation routes, find their traces in sudo,
      auth and audit logs, and distinguish an attack from legitimate administrative use.
    quiz:
      - prompt: Which of these is a common Linux privilege-escalation route?
        options:
          - Reading a public web page
          - Abusing sudo rights or a SUID binary to run as root
          - Changing the desktop wallpaper
          - Sending an email
        answer: 1
        explanation: Sudo misconfiguration and SUID binaries are classic routes from an ordinary user to root.
      - prompt: A SUID-based escalation is best spotted by
        options:
          - A process running as root whose parent chain starts from an ordinary user's session
          - The size of the log file
          - The hostname
          - A single failed password
        answer: 0
        explanation: A root-effective process parented off a normal user through a breakout binary is the SUID tell.
      - prompt: What best separates legitimate sudo use from abuse?
        options:
          - The colour of the terminal
          - Context, who ran it, from where, when, and whether it fits their normal pattern
          - The length of the command
          - Whether the moon is full
        answer: 1
        explanation: Admins and attackers use the same mechanisms, so context and normal patterns decide which it is.
      - prompt: How does this lesson differ from Linux hardening?
        options: [It is the same, Hardening prevents the weakness; this finds the evidence after it has been used, It only covers firewalls, It ignores logs]
        answer: 1
        explanation: Hardening closes the gaps in advance; detection reconstructs what happened once a gap was exploited.
  - slug: linux-malware-rootkit-detection
    title: Linux Malware and Rootkit Detection
    order: 7
    difficulty: intermediate
    summary: Find malware and rootkits on a Linux host by checking processes, network connections, loaded modules and file integrity, and tell a compromise from normal admin activity.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["cysa:1.2", "cysa:3.2", "secplus:4.9"]
    learning_objectives:
      - Hunt a Linux host for malware using processes, connections and persistence
      - Explain how user-space and kernel rootkits hide and how to spot them
      - Distinguish a real compromise from legitimate administration
    theory: |
      Linux malware is often quieter than its Windows cousin, a mining binary, a backdoor, or a
      web shell on a server, so detection leans on examining the live system and its integrity.
      The first pass is behavioural: **unusual processes** (an unknown binary, a process running
      from /tmp or /dev/shm, a deleted executable still running), **unexpected network connections**
      (a listening port or an outbound connection to a strange host), and **persistence** in cron,
      systemd units, shell profiles or SSH authorized_keys. These are the same places an admin works,
      so each finding is weighed against what is normal for the host.

      A **rootkit** is built to defeat exactly that inspection. A **user-space rootkit** replaces
      tools like ps, ls or netstat with trojaned versions that hide the attacker's files and
      processes, so the box lies to you. A **kernel rootkit** loads a malicious module and hooks the
      kernel itself, hiding processes and connections below the level any user tool can see. The tells
      are discrepancies: a port shown by a direct kernel query but not by netstat, a process in
      /proc that ps does not list, or a loaded module with no legitimate origin. This is why serious
      checks use trusted static binaries and cross-check two independent views.

      **File integrity** ties it together. A baseline of known-good hashes (from a tool like AIDE, or
      package-manager verification) reveals a replaced system binary at once, which is why integrity
      monitoring is a core control. The safest inspection of a suspected rootkit is from **outside** the
      running system, mounting the disk from a trusted live image, because a compromised kernel cannot
      hide from an OS it is not running under. As always, a finding is confirmed, not assumed; a
      sysadmin's own tool or a package update can look anomalous until checked.
    examples:
      - title: A process that does not add up
        body: |
          /proc shows PID 2931 with deleted exe  (ls -l /proc/2931/exe -> "(deleted)")
          ss shows a listener on :4444 that netstat does not  -> tool may be trojaned
          Cross-check two views; trust the kernel query over the user tool.
      - title: File integrity catching a replaced binary
        body: |
          Baseline  /bin/ls  sha256 a1b2...   package-verified
          Now       /bin/ls  sha256 ffee...   -> replaced; likely a user-space rootkit
          Inspect from a trusted live image, not the running system.
    exercise:
      title: Triage a Linux host for malware and rootkit signs
      environment: A disposable Linux VM (optionally with a benign simulated indicator such as a binary in /tmp and a cron entry) or a provided triage data set
      tools: [A Linux VM or data set, standard tools (ps, ss, ls, systemctl, crontab), a file-integrity or package-verify tool, a notes file]
      steps:
        - List running processes and flag any running from temporary directories, with deleted executables, or otherwise unexpected for this host.
        - List listening ports and active connections and identify any that do not match a known service.
        - Check the common persistence locations (cron, systemd units, shell profiles, SSH authorized_keys) and note anything unexplained.
        - Cross-check one finding using two independent views (for example ss versus netstat, or /proc versus ps) and explain what a discrepancy would mean.
        - Verify the integrity of key system binaries against a baseline or the package manager and record any mismatch.
        - For each finding, decide whether it is malware, a rootkit indicator, or legitimate administration, and justify how you would confirm it safely.
      deliverable: A triage note listing the processes, connections and persistence checked, any integrity mismatch, the cross-check you ran, and your confirmed verdict with the safe next step.
    expected_outcome: >
      You can hunt a Linux host for malware and rootkits across processes, connections, persistence and
      file integrity, recognise how rootkits hide, and separate a real compromise from normal admin
      work before acting.
    quiz:
      - prompt: A process running from /tmp or /dev/shm with a deleted executable is
        options:
          - Always normal
          - A suspicious indicator worth investigating
          - Proof of a kernel rootkit
          - A network setting
        answer: 1
        explanation: Running from temporary storage with a deleted on-disk image is a common malware trait worth a closer look.
      - prompt: A user-space rootkit hides activity by
        options:
          - Encrypting the disk
          - Replacing tools like ps, ls and netstat with trojaned versions that omit the attacker's artefacts
          - Loading more RAM
          - Rotating logs
        answer: 1
        explanation: Trojaned user tools make the system lie about its own processes, files and connections.
      - prompt: Why inspect a suspected kernel rootkit from outside the running system?
        options:
          - It is faster
          - A compromised kernel can hide from tools running under it, but not from an OS it is not running
          - It uses less disk
          - To avoid writing notes
        answer: 1
        explanation: Examining the disk from a trusted live image bypasses a kernel that hides artefacts while it runs.
      - prompt: File integrity monitoring detects a rootkit's replaced binary by
        options: [Encrypting it, Comparing current hashes against a known-good baseline, Deleting it, Rebooting]
        answer: 1
        explanation: A hash that no longer matches the baseline reveals a tampered system binary immediately.
  - slug: linux-mac-selinux-apparmor
    title: Mandatory Access Control with SELinux and AppArmor
    order: 8
    difficulty: intermediate
    summary: Use SELinux and AppArmor to confine processes so a compromised service cannot do whatever its user account could, and read the denials these systems log.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "secplus:2.5", "cysa:1.3"]
    learning_objectives:
      - Explain the difference between discretionary and mandatory access control
      - Describe how SELinux and AppArmor confine a process to a policy
      - Read MAC denials and tell a real block from a policy that needs tuning
    theory: |
      Standard Linux permissions are **discretionary**: the owner of a file decides who can access it, and
      a process runs with all the authority of the user that launched it. That means a compromised web
      server running as its service account can touch everything that account can, which is usually far
      more than the web server needs. **Mandatory access control** (MAC) closes that gap by enforcing a
      system-wide policy that even the owner cannot override, confining each process to exactly the files,
      ports and capabilities its role requires.

      Linux has two common MAC systems. **SELinux** labels every process and object with a security context
      and allows an action only if policy permits that label to act on that label; it is powerful and
      fine-grained but has a steep learning curve. **AppArmor** confines programs by **path-based profiles**
      that list what each binary may do, which is simpler to read and write. Either way the win is the same:
      if an attacker exploits a confined service, the MAC policy still blocks it from reading /etc/shadow,
      writing outside its directories, or opening unexpected network connections, so a code-execution bug
      does not become full host control.

      The operational skill is reading **denials**. When MAC blocks something it logs it (SELinux AVC
      denials, AppArmor DENIED messages), and the analyst's job is to tell a genuine attack block from a
      profile that is simply too tight for legitimate work. The wrong reflex, seen constantly, is to disable
      SELinux at the first inconvenience, which throws away the protection; the right move is to read the
      denial, decide whether the action is legitimate, and adjust the policy narrowly if so. Run in
      permissive mode to learn what would be denied, then enforce, exactly the staged approach good hardening
      always uses.
    examples:
      - title: MAC containing a compromised service
        body: |
          Web app (exploited) tries to read /etc/shadow
          DAC alone:  allowed if the service user can read it
          SELinux/AppArmor: denied by policy regardless of user -> exploit contained
      - title: A denial to read, not to silence
        body: |
          AVC denial: httpd_t tried to read user_home_t file
          Legit?  no  -> this is the attack being blocked (good)
          Legit?  yes -> adjust the profile narrowly; do not disable SELinux
    exercise:
      title: Confine a service and interpret MAC denials
      environment: A Linux VM with SELinux (RHEL/Fedora family) or AppArmor (Debian/Ubuntu family), or provided denial logs and profiles
      tools: [A Linux VM with SELinux or AppArmor, the audit log or dmesg, policy tools (semanage/ausearch or aa-status), a notes file]
      steps:
        - Determine which MAC system is active and whether it is in enforcing or permissive mode.
        - Pick a service (such as a web server) and describe or inspect the policy or profile that confines it.
        - Trigger or review a denial where the service attempts something outside its policy and locate the logged denial.
        - For one denial, decide whether it represents a real block of unwanted behaviour or a legitimate action the profile is too tight for.
        - For a legitimate case, adjust the policy or profile narrowly to allow just that action, and explain why disabling MAC would be the wrong fix.
        - Describe how you would use permissive mode to roll out a new confinement safely before enforcing it.
      deliverable: A note identifying the MAC system and mode, the confined service's policy, one denial with your legitimate-or-attack verdict, the narrow fix (or why to keep the block), and the safe rollout approach.
    expected_outcome: >
      You can explain mandatory versus discretionary access control, confine a service with SELinux or
      AppArmor so a compromise is contained, and read denials to tune policy without throwing away the
      protection.
    quiz:
      - prompt: How does mandatory access control differ from standard Linux permissions?
        options:
          - It is the same thing
          - It enforces a system-wide policy that even the file owner cannot override, confining each process
          - It removes all permissions
          - It only applies to root
        answer: 1
        explanation: MAC constrains processes to a policy regardless of owner, limiting what a compromised service can do.
      - prompt: A benefit of confining a service with SELinux or AppArmor is that
        options:
          - Services run faster
          - An exploited service is still blocked from files, ports and actions outside its policy
          - Passwords are not needed
          - Logs are deleted
        answer: 1
        explanation: Confinement contains a compromise so code execution in the service does not become full host control.
      - prompt: The right response to a legitimate action blocked by SELinux is to
        options:
          - Disable SELinux
          - Read the denial and adjust the policy narrowly to allow just that action
          - Ignore it
          - Reboot repeatedly
        answer: 1
        explanation: Tuning the policy preserves protection; disabling SELinux throws it away for everything.
      - prompt: Running MAC in permissive mode first lets you
        options: [Block everything immediately, Learn what would be denied before enforcing, Delete the policy, Skip logging]
        answer: 1
        explanation: Permissive mode logs what would be denied so a profile can be tuned before enforcement, avoiding outages.
  - slug: linux-network-firewall
    title: Linux Network Security and Host Firewalling
    order: 9
    difficulty: intermediate
    summary: Control what a Linux host accepts and initiates with nftables/iptables and firewalld, and use that control both to harden the host and to detect unexpected network behaviour.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "secplus:4.1", "cysa:1.3"]
    learning_objectives:
      - Explain host-based firewalling and default-deny on Linux
      - Build and read nftables/iptables or firewalld rules
      - Use egress control and connection logs to detect compromise
    theory: |
      A Linux host should not accept or initiate whatever it likes; a **host-based firewall** decides, and
      it is a control the network firewall cannot replace because it protects the host even from threats
      already inside the network. Linux implements this in the kernel through **netfilter**, configured by
      **iptables** (the long-standing tool) or its successor **nftables**, often wrapped by a friendlier
      front end like **firewalld** or **ufw**. The guiding principle is **default-deny**: start by dropping
      everything, then explicitly allow only the ports and directions the host genuinely needs, so an
      unexpected service cannot be reached even if it is accidentally running.

      Rules are evaluated in order against each packet, matching on direction, address, port and connection
      **state**. The state concept is important: a **stateful** firewall allows return traffic for
      connections the host already established without needing a separate rule, which is what lets a server
      answer clients while still blocking unsolicited inbound. A typical hardened server allows inbound only
      on its service port and SSH (ideally from limited sources), allows established/related return traffic,
      and drops the rest. Reading an existing rule set, what is allowed inbound, what is allowed outbound,
      and what is logged, is the core operational skill.

      The most under-used side is **egress control**, restricting what the host may connect *out* to. Most
      hosts only need to reach a few destinations (updates, a database, a log server), so a tight outbound
      policy is a powerful detector and limiter of compromise: malware that tries to beacon to its C2 server
      is blocked, and the **dropped-connection logs** become an alert that something on the host is trying
      to talk somewhere it should not. The analyst's habit is to treat firewall logs as telemetry, a sudden
      spray of blocked outbound attempts from one host is a strong sign of malware or scanning, confirmed
      against what the host is supposed to do.
    examples:
      - title: Default-deny with stateful return traffic
        body: |
          policy: DROP everything (in and out) by default
          allow in:  tcp 443 (service), tcp 22 from admin subnet
          allow:     established/related return traffic (stateful)
          result:    anything unexpected is dropped and can be logged
      - title: Egress control as a detector
        body: |
          Host should reach: updates, db:5432, logserver:514 -> allowed
          Log shows: DROP out to 185.x.x.x:4444 (unknown) -> malware beaconing?
          Blocked AND logged: the firewall both stops and reveals the C2 attempt.
    exercise:
      title: Build and audit a host firewall, then read its logs
      environment: A Linux VM with nftables/iptables or firewalld, or a provided rule set and sample firewall logs
      tools: [A Linux VM or sample rules, the firewall tooling or its config, sample drop logs, a notes file]
      steps:
        - Inspect (or build) the host's firewall rules and state what is allowed inbound and outbound.
        - Confirm the policy is default-deny and explain what happens to a packet that matches no allow rule.
        - Explain how stateful matching lets the host answer clients without an explicit return-traffic rule.
        - Add or review an egress rule that restricts outbound connections to only the destinations the host needs.
        - Review sample dropped-connection logs and identify one outbound attempt that suggests compromise.
        - Describe how you would confirm that finding against the host's intended behaviour before acting.
      deliverable: A firewall audit covering the inbound/outbound allow lists, the default-deny confirmation, an egress rule, one suspicious dropped-outbound finding from the logs, and the confirmation step.
    expected_outcome: >
      You can build and read a default-deny Linux host firewall with stateful rules, use egress control to
      harden the host, and treat dropped-connection logs as telemetry that reveals a host trying to talk
      where it should not.
    quiz:
      - prompt: A default-deny host firewall policy means
        options:
          - Everything is allowed unless blocked
          - Everything is dropped unless explicitly allowed
          - Logging is disabled
          - Only inbound is filtered
        answer: 1
        explanation: Default-deny drops all traffic by default and permits only what is explicitly needed.
      - prompt: Stateful firewalling lets a server
        options:
          - Block its own responses
          - Answer clients by allowing return traffic for connections it already established
          - Ignore all packets
          - Skip logging
        answer: 1
        explanation: Tracking connection state allows legitimate return traffic without a separate inbound rule.
      - prompt: Why is egress (outbound) control a powerful control?
        options:
          - It speeds up the host
          - It blocks and reveals malware trying to beacon to destinations the host should never reach
          - It is only cosmetic
          - It replaces patching
        answer: 1
        explanation: Tight outbound policy both stops C2 connections and turns the attempts into alerts.
      - prompt: A spray of blocked outbound attempts from one host to unknown destinations is
        options: [Routine, A strong sign of malware or scanning to confirm against intended behaviour, A backup, A DNS update]
        answer: 1
        explanation: Many blocked egress attempts suggest a compromised host beaconing or scanning, worth investigating.
  - slug: linux-container-security
    title: Container Security on Linux
    order: 10
    difficulty: intermediate
    summary: Understand how Linux containers are built and isolated, where that isolation is weaker than a VM, and how to run containers so a compromise stays contained.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.1", "secplus:4.1", "cysa:1.3"]
    learning_objectives:
      - Explain how Linux containers isolate workloads and how that differs from VMs
      - Identify the common container misconfigurations that break isolation
      - Harden container runtime so a compromise cannot escape to the host
    theory: |
      Containers package an application with its dependencies and run it isolated on a shared Linux kernel, and
      understanding that last part is the key to securing them. Unlike a virtual machine, which has its own
      kernel and a strong hardware-enforced boundary, containers are isolated by **kernel features**,
      **namespaces** (which give each container its own view of processes, network and filesystem) and
      **cgroups** (which limit its resources). This is lighter and faster than a VM but the boundary is softer:
      every container shares the host kernel, so a kernel vulnerability or a misconfiguration can let a
      container **escape** to the host, which is the central risk to reason about.

      Most container compromises come from **misconfiguration**, not exotic kernel exploits. Running a container
      as **root** (the default in many images) means a process that breaks out has host root; running with the
      **privileged** flag or mounting the Docker socket or host filesystem hands the container the keys to the
      host directly; and pulling untrusted or unscanned images brings in vulnerable or malicious code. Each of
      these quietly dissolves the isolation that is the whole point of a container. The defensive mindset is to
      treat the container boundary as real but thin, and to avoid the configurations that remove it.

      Hardening follows directly. Run containers as a **non-root** user and drop unnecessary Linux
      **capabilities**, so even a breakout has little power. Never run privileged or mount the host's sensitive
      paths unless genuinely required. Use **read-only** filesystems and resource limits to constrain behaviour,
      apply a **seccomp** or AppArmor/SELinux profile to restrict the system calls a container can make, and run
      only **scanned, trusted images** from known registries. For the analyst, containers are also a monitoring
      surface: a container spawning an unexpected shell, making outbound connections it never should, or
      attempting to access the host filesystem or Docker socket are strong signals of compromise or an escape
      attempt, confirmed against what that workload normally does.
    examples:
      - title: Container isolation versus a VM
        body: |
          VM:        own kernel, hardware-enforced boundary (strong)
          Container: shared host kernel, namespaces + cgroups (lighter, softer)
          A kernel bug or misconfig can let a container escape to the host.
      - title: Misconfigurations that dissolve isolation
        body: |
          run as root + --privileged + mount /var/run/docker.sock
          -> a breakout has host root and full control
          Non-root + drop capabilities + no privileged = a real boundary.
    exercise:
      title: Harden a container and spot an escape attempt
      environment: A Linux VM with a container runtime (or provided container configs and runtime logs)
      tools: [A container runtime or sample configs, a seccomp/AppArmor reference, sample runtime logs, a notes file]
      steps:
        - Explain how namespaces and cgroups isolate a container and why that boundary is softer than a VM's.
        - Review a container's run configuration and identify misconfigurations that break isolation (root, privileged, host mounts, untrusted image).
        - Rewrite the configuration to run non-root, drop unnecessary capabilities and avoid privileged mode, explaining each change.
        - Add a read-only filesystem, resource limits and a seccomp or MAC profile, and state what each constrains.
        - Review sample runtime logs and identify one signal of a compromise or escape attempt (unexpected shell, host-socket access).
        - State how you would confirm that signal against the workload's normal behaviour before acting.
      deliverable: A container-hardening note explaining the isolation model, the misconfigurations found and fixed, the added runtime constraints, and one escape-attempt signal with its confirmation step.
    expected_outcome: >
      You can explain how Linux containers are isolated and why the boundary is softer than a VM's, find and
      fix the misconfigurations that break isolation, and harden the runtime so a container compromise stays
      contained.
    quiz:
      - prompt: Container isolation differs from a VM's because containers
        options:
          - Have their own kernel
          - Share the host kernel and are isolated by namespaces and cgroups, a softer boundary
          - Cannot be isolated at all
          - Run on separate hardware
        answer: 1
        explanation: Containers share the host kernel, so a kernel bug or misconfiguration can break the boundary.
      - prompt: Most container compromises come from
        options:
          - Exotic kernel exploits
          - Misconfiguration such as running as root, privileged mode or mounting the host
          - Slow networks
          - Too many images
        answer: 1
        explanation: Dangerous run configurations dissolve isolation far more often than kernel exploits.
      - prompt: Running a container as a non-root user with dropped capabilities helps because
        options:
          - It is faster
          - Even a breakout then has little power on the host
          - It disables logging
          - It removes the kernel
        answer: 1
        explanation: Least privilege inside the container limits the impact of any escape.
      - prompt: A container attempting to access the Docker socket or host filesystem is
        options: [Routine, A strong signal of a compromise or escape attempt to confirm in context, A backup, A normal update]
        answer: 1
        explanation: Reaching for the host socket or filesystem is a classic escape move worth investigating.
  - slug: linux-ssh-hardening
    title: Securing SSH and Remote Access
    order: 11
    difficulty: intermediate
    summary: Harden SSH, the front door to most Linux systems and a constant attack target, with key-based authentication, sensible configuration and monitoring of access attempts.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "secplus:4.6", "cysa:1.3"]
    learning_objectives:
      - Explain why SSH is a prime target and how key-based auth hardens it
      - Configure SSH securely (keys, root login, limits) and monitor access
      - Recognise brute-force and credential attacks against SSH in logs
    theory: |
      SSH is how administrators reach most Linux systems, which makes it both essential and a constant target:
      any internet-facing SSH service will see automated brute-force attempts within minutes. Hardening it is
      one of the highest-value Linux tasks, and it starts with authentication. **Password authentication** is
      the weak point, guessable, reused, brute-forceable, so the single biggest improvement is **key-based
      authentication**: the server holds the user's public key and only a holder of the matching private key
      can log in, which defeats password guessing entirely. Keys should themselves be protected with a
      passphrase, and for the strongest assurance paired with MFA.

      Good SSH configuration closes the common weaknesses. **Disable direct root login** so an attacker cannot
      target the one account that exists everywhere, and require administrators to log in as themselves and
      escalate. **Disable password authentication** once keys are in place. **Restrict who may connect**,
      by user, group, and ideally source address, so SSH is not open to the whole internet, and run it behind
      a bastion/jump host or VPN for sensitive systems rather than exposing it directly. Smaller settings
      matter too: sensible idle timeouts, limiting authentication attempts, and keeping the SSH software
      patched against protocol and implementation flaws.

      Finally, SSH is a rich **monitoring** source because attacks against it are so visible. The auth logs
      record every attempt, so a flood of failed logins from one address (brute force), failures across many
      usernames (spraying), or a successful login from an unexpected country or at an odd hour are classic
      leads. Tools like fail2ban can automatically block repeat offenders, but the analyst's job is to
      distinguish the constant background noise of internet scanning from an attempt that actually succeeded or
      that targets a real account, confirming against the user's normal access. The lesson is that SSH is the
      front door, so locking it with keys, tightening its configuration, and watching who knocks is
      fundamental Linux hardening.
    examples:
      - title: Keys beat passwords
        body: |
          password auth: brute-forceable, reused, guessable
          key auth:      only the private-key holder logs in -> password guessing defeated
          protect the key with a passphrase; add MFA for the strongest assurance.
      - title: SSH attacks in the auth log
        body: |
          many failures from one IP            -> brute force
          failures across many usernames       -> password spraying
          success from an unexpected country    -> confirm against the user's normal access
    exercise:
      title: Harden an SSH service and read its logs
      environment: A Linux VM running SSH (or a provided sshd_config and sample auth logs)
      tools: [A Linux VM or sshd_config and logs, the auth log, a notes file]
      steps:
        - Explain why SSH is a prime target and why key-based authentication is the biggest single improvement.
        - Review (or set) the SSH configuration, disable root login and password auth, and restrict who and where may connect.
        - Explain the role of a bastion/jump host or VPN for reaching sensitive systems rather than exposing SSH directly.
        - Review sample auth logs and distinguish background scanning noise from a brute force or spray against a real account.
        - Identify a successful login worth investigating and how you would confirm it against the user's normal access.
        - Describe how automated blocking (such as fail2ban) helps and what it does not solve.
      deliverable: An SSH-hardening note covering key-based auth, the configuration changes, bastion/VPN placement, a log analysis distinguishing noise from a real attack, and the role and limits of automated blocking.
    expected_outcome: >
      You can harden SSH with key-based authentication and sound configuration, place it behind a bastion or
      VPN for sensitive systems, and read its logs to tell background scanning from a real brute-force or
      targeted attack.
    quiz:
      - prompt: The single biggest improvement to SSH security is usually
        options:
          - A longer banner
          - Key-based authentication, which defeats password guessing
          - A faster network
          - Disabling logging
        answer: 1
        explanation: Keys mean only the private-key holder can log in, removing the password-guessing attack entirely.
      - prompt: Disabling direct root login over SSH helps because
        options:
          - Root is unimportant
          - An attacker cannot target the one account that exists on every system; admins log in as themselves and escalate
          - It speeds up logins
          - It encrypts the disk
        answer: 1
        explanation: Removing direct root login denies attackers the universal, high-value target account.
      - prompt: Many SSH login failures across many different usernames indicates
        options: [A backup, Password spraying, A DNS change, A patch]
        answer: 1
        explanation: Trying many usernames (often with common passwords) is the spraying pattern.
      - prompt: A successful SSH login from an unexpected country should be
        options: [Ignored, Confirmed against the user's normal access as a possible compromise, Deleted, Assumed safe]
        answer: 1
        explanation: An anomalous successful login is a lead to confirm against the user's travel and normal behaviour.
  - slug: linux-file-integrity-monitoring
    title: File Integrity Monitoring on Linux
    order: 12
    difficulty: intermediate
    summary: Detect unauthorised changes to critical files by establishing a known-good baseline and alerting on deviations, catching the tampering, backdoors and persistence that attackers leave on disk.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "cysa:3.1", "cysa:1.3"]
    learning_objectives:
      - Explain what file integrity monitoring detects and why it matters
      - Build a baseline and alert on deviations for critical files
      - Tune FIM so legitimate change does not drown real tampering
    theory: |
      Attackers who gain access to a Linux system frequently **change files**: replacing a system binary with a
      trojaned version, adding a backdoor, editing a configuration to weaken security, or planting a persistence
      script. **File integrity monitoring** (FIM) detects exactly this, by establishing a **baseline** of what
      critical files should look like and alerting when they change unexpectedly. It is a detective control that
      catches the on-disk footprint of compromise that other tools may miss, and it is required by several
      compliance standards for precisely that reason.

      FIM works by recording, for each monitored file, a **cryptographic hash** and metadata (permissions,
      owner, size, timestamps) in a trusted baseline, then periodically re-checking the files against it and
      reporting any deviation: a changed hash means the content was modified, a changed owner or permission may
      mean tampering. Tools like AIDE and others build and verify these baselines. What to monitor is the key
      design decision: system binaries, critical configuration (what is in /etc), authentication files, and
      startup/persistence locations are high value, because unexpected change there is strongly suspicious,
      whereas monitoring constantly-changing data (logs, temp, caches) just produces noise.

      The central challenge is the same as any detection: **legitimate change**. Systems change all the time,
      package updates replace binaries, administrators edit configs, so a naive FIM that alerts on every change
      is quickly ignored. Good FIM is tuned: it expects and accounts for authorised change (correlating with
      the patch and change-management process, so a binary that changed during a known update is not an alert,
      but the same binary changing at 3am outside any change window is), and it focuses on the files where
      unexpected change is meaningful. The baseline itself must be **protected and trusted**, stored where an
      attacker cannot quietly alter it to match their changes, or the whole control is defeated. For the
      analyst, a FIM alert, "a system binary changed outside any maintenance window", is a high-value lead:
      it points directly at tampering, confirmed against the change process before escalation.
    examples:
      - title: How FIM detects tampering
        body: |
          baseline: /usr/bin/sshd hash=abc..., owner=root, perms=755
          recheck:  hash=def... -> content changed!
          outside any update/change window -> likely a trojaned binary.
      - title: Tuning out legitimate change
        body: |
          binary changed DURING a known package update -> expected, not an alert
          same binary changed at 3am, no change window  -> high-value lead
          correlate with the change-management process.
    exercise:
      title: Set up and tune file integrity monitoring
      environment: A Linux VM with a FIM tool (such as AIDE) or provided baseline and change data
      tools: [A Linux VM with a FIM tool or sample baseline/change data, a notes file]
      steps:
        - Explain what file integrity monitoring detects and the kinds of attacker activity it catches.
        - Choose which files and directories to monitor (system binaries, /etc, auth files, startup locations) and justify the selection.
        - Build (or review) a baseline recording hashes and metadata, and explain why the baseline must be protected and trusted.
        - Simulate or review a change and show how the deviation (changed hash or ownership) is detected.
        - Distinguish a legitimate change (during a known update) from suspicious tampering and explain how you would correlate with the change process.
        - State how you would confirm a FIM alert before escalating and why monitoring noisy data directories is counterproductive.
      deliverable: A FIM setup with a justified monitoring scope, a protected baseline, a detected deviation, and a tuning approach that separates authorised change from tampering by correlating with the change process.
    expected_outcome: >
      You can explain and configure file integrity monitoring to catch on-disk tampering, build and protect a
      baseline, and tune it against legitimate change so that a real deviation stands out as a high-value lead.
    quiz:
      - prompt: File integrity monitoring detects
        options:
          - Network bandwidth
          - Unauthorised changes to critical files (trojaned binaries, backdoors, tampered configs)
          - CPU temperature
          - User passwords
        answer: 1
        explanation: FIM catches the on-disk footprint of compromise by detecting unexpected file changes.
      - prompt: FIM works by comparing files against
        options:
          - A random value
          - A trusted baseline of cryptographic hashes and metadata
          - The network configuration
          - The user list
        answer: 1
        explanation: FIM records hashes and metadata in a baseline and alerts when files deviate from it.
      - prompt: The main challenge for FIM is
        options:
          - Files never change
          - Legitimate change (updates, admin edits), so it must be tuned to avoid drowning real tampering in noise
          - It cannot hash files
          - It only works on Windows
        answer: 1
        explanation: Systems change constantly, so FIM must account for authorised change to keep real deviations visible.
      - prompt: Why must the FIM baseline be protected and trusted?
        options:
          - To save space
          - So an attacker cannot quietly alter it to match their changes and defeat the control
          - To speed up checks
          - It need not be protected
        answer: 1
        explanation: If an attacker can edit the baseline, they can hide their changes, defeating the monitoring.
  - slug: linux-systemd-cron-persistence
    title: systemd and Cron Persistence on Linux
    order: 13
    difficulty: intermediate
    summary: Learn the scheduling and service mechanisms attackers abuse to persist on Linux (cron, at, systemd services and timers) and how to hunt for and harden them.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.1", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain how cron, at, systemd services and timers run code on a schedule or at boot
      - Identify how attackers abuse these for persistence
      - Hunt for malicious scheduled tasks and harden the mechanisms
    theory: |
      Persistence is how an attacker survives a reboot or a closed shell, and on Linux the richest persistence
      surface is the legitimate machinery for running things automatically. **Cron** runs commands on a schedule
      from per-user crontabs and from system directories like `/etc/cron.d`, `/etc/crontab` and the
      `/etc/cron.{hourly,daily,weekly}` folders. **at** schedules a one-off job. **systemd** is the modern and
      most important surface: a **service unit** can start a program at boot or on demand, and a **timer unit**
      can trigger a service on a schedule, a cleaner and more flexible replacement for cron. Each of these is a
      normal administration tool, which is exactly why attackers like them: a malicious cron line or systemd unit
      blends in with legitimate automation.

      Abuse follows the mechanisms. An attacker who gains access drops a cron entry that re-runs their payload
      every few minutes, or installs a systemd service that restarts their implant whenever it dies and starts it
      again at boot, or hides a timer that fires the payload quietly overnight. Because these run with the
      privileges of whoever owns them, a task in root's crontab or a system-level systemd unit gives rooted
      persistence. The tell-tales are subtle: a unit or cron entry in an unusual location, pointing at a binary
      in `/tmp` or a user's home directory, with a recent timestamp, owned by or running as an account that
      should not be scheduling work.

      Hunting is a matter of enumerating all of these surfaces and comparing them to a known-good baseline.
      Analysts list every user and system crontab, every unit with `systemctl list-unit-files` and
      `list-timers`, and inspect what each actually runs and where that file lives. Anything pointing at a
      world-writable or temporary path, recently created, or not traceable to a package or a known change is
      suspect. Hardening means restricting who can use cron and at (the `cron.allow`/`cron.deny` files),
      monitoring the unit and cron directories for changes with file-integrity monitoring, and treating any new
      persistence mechanism as a change that must be explainable. The discipline is the same as on Windows
      autoruns: know what normally runs automatically, and investigate anything that does not fit.
    examples:
      - title: The persistence surfaces
        body: |
          cron    -> per-user crontabs + /etc/cron.d, /etc/crontab, cron.{hourly,daily,weekly}
          at      -> one-off scheduled job
          systemd -> service unit (boot/on-demand) + timer unit (scheduled)
          all legitimate admin tools -> malicious entries blend in.
      - title: What a suspicious entry looks like
        body: |
          */5 * * * * /tmp/.update      <- runs every 5 min from /tmp (hidden file)
          systemd unit ExecStart=/home/user/.cache/helper   <- restarts implant, starts at boot
          recent timestamp, odd path, runs as root -> investigate.
    exercise:
      title: Hunt for and harden Linux persistence
      environment: A Linux host or sample listings of crontabs and systemd units (or a scenario)
      tools: [A scenario or sample crontab/systemctl output, a terminal or notes file]
      steps:
        - Explain how cron, at, systemd services and systemd timers each run code automatically.
        - Enumerate the persistence surfaces (user and system crontabs, unit files, timers) in the sample.
        - Identify at least one suspicious entry (odd path, /tmp binary, recent timestamp, unexpected owner) and say why.
        - Explain how an attacker uses a systemd service to survive both a crash and a reboot.
        - Recommend hardening (cron.allow/deny, file-integrity monitoring of unit and cron directories).
        - State how you would confirm whether a given unit or cron entry is legitimate.
      deliverable: A persistence hunt identifying a suspicious cron or systemd entry with reasoning, an explanation of systemd-based persistence, and a hardening plan for the scheduling surfaces.
    expected_outcome: >
      You can enumerate the cron, at and systemd persistence surfaces on Linux, spot a malicious scheduled task or
      service by its path, timing and owner, and recommend hardening that limits and monitors these mechanisms.
    quiz:
      - prompt: A systemd timer unit is used to
        options:
          - Encrypt the disk
          - Trigger a service on a schedule, a flexible replacement for cron
          - Replace the firewall
          - Store passwords
        answer: 1
        explanation: Timer units schedule the activation of service units, serving the role cron traditionally did.
      - prompt: Attackers favour cron and systemd for persistence because
        options:
          - They are rarely present on Linux
          - They are legitimate automation tools, so malicious entries blend in with normal scheduled work
          - They require no privileges
          - They cannot survive a reboot
        answer: 1
        explanation: Being standard admin tools, a malicious cron line or unit looks like ordinary automation.
      - prompt: A strong indicator that a scheduled task is malicious is that it
        options:
          - Runs a system package on a normal schedule
          - Executes a recently created binary from /tmp or a hidden path, often as root
          - Appears in the vendor documentation
          - Has existed unchanged for years
        answer: 1
        explanation: Execution of a recent binary from a temporary or hidden path, especially as root, is a classic persistence tell.
      - prompt: Hardening Linux scheduling persistence includes
        options:
          - Disabling all logging
          - Restricting cron/at use (cron.allow/deny) and monitoring unit and cron directories for changes
          - Giving everyone cron access
          - Removing systemd entirely
        answer: 1
        explanation: Limiting who can schedule and watching the directories for changes constrains and surfaces abuse.
  - slug: linux-kernel-hardening
    title: Linux Kernel Hardening and Capabilities
    order: 14
    difficulty: advanced
    summary: Go below the file system to the kernel, covering Linux capabilities, seccomp, namespaces and kernel parameters, and how they reduce the privilege and attack surface of processes.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:2.5", "cysa:1.2"]
    learning_objectives:
      - Explain Linux capabilities as a finer-grained alternative to full root
      - Describe how seccomp and namespaces restrict what a process can do
      - Apply kernel-level hardening to reduce a process's attack surface
    theory: |
      Traditional Unix privilege is all-or-nothing: a process runs as an ordinary user or as all-powerful root.
      Modern Linux breaks root's power into **capabilities**, dozens of discrete privileges that can be granted
      individually. A program that only needs to bind to a low-numbered port needs `CAP_NET_BIND_SERVICE`, not
      full root, and a program that needs to change file ownership needs `CAP_CHOWN`. Granting only the required
      capabilities (and dropping the rest) means that if the process is compromised, the attacker inherits a thin
      slice of privilege rather than the keys to the machine. This is least privilege applied at the kernel level,
      and it is foundational to how containers and hardened services run.

      Two further mechanisms narrow what a process can do. **seccomp** (secure computing mode) filters the
      **system calls** a process may make: since every interaction with the kernel goes through syscalls, a
      seccomp profile that allows only the handful a program actually uses drastically shrinks its attack surface,
      so a bug that would let an attacker call a dangerous syscall simply cannot reach it. **Namespaces** give a
      process an isolated view of system resources, its own process tree, network, mount points and user ids, and
      are the building block of container isolation: a process in its own namespaces cannot see or affect what is
      outside them. Together, capabilities, seccomp and namespaces are the kernel features that make a modern
      container a reasonably contained unit rather than just a packaged process.

      Finally, the kernel itself is hardened through **parameters and modules**. `sysctl` settings control
      behaviour such as restricting access to kernel logs and pointers, enabling address-space layout
      randomisation, and tightening network stack behaviour; unneeded kernel modules and filesystems can be
      blacklisted to remove attack surface; and mandatory access control (SELinux or AppArmor) adds a policy layer
      above discretionary permissions. For the analyst and engineer, the value of understanding these is twofold:
      you can harden a service by giving it only the capabilities and syscalls it needs, and you can reason about
      the blast radius of a compromise, because a process stripped of capabilities, confined by seccomp and boxed
      in namespaces is far less useful to an attacker than one running as unconfined root.
    examples:
      - title: Capabilities instead of full root
        body: |
          need to bind port 80 -> CAP_NET_BIND_SERVICE only (not root)
          need to change ownership -> CAP_CHOWN only
          drop the rest -> compromise inherits a thin slice, not the whole machine.
      - title: seccomp + namespaces
        body: |
          seccomp: allow only the syscalls the program uses -> dangerous syscalls unreachable
          namespaces: own process tree / network / mounts / user ids -> can't see outside the box
          together = the basis of container isolation.
    exercise:
      title: Harden a service at the kernel level
      environment: A described Linux service and its actual needs (or a scenario)
      tools: [A Linux host or scenario, a terminal or notes file, a document]
      steps:
        - Explain how capabilities differ from running a process as full root.
        - For a described service, identify the minimum capabilities it genuinely needs and which to drop.
        - Explain how a seccomp profile reduces a process's attack surface.
        - Explain how namespaces isolate a process and why that limits a compromise.
        - Name two sysctl or module-level hardening steps and the risk each reduces.
        - Describe how you would reason about the blast radius if the hardened service were compromised.
      deliverable: A kernel-level hardening plan for one service, covering the minimum capability set, a seccomp rationale, namespace isolation, two kernel-parameter or module steps, and a blast-radius assessment.
    expected_outcome: >
      You can explain Linux capabilities, seccomp and namespaces, apply them to give a service least privilege at
      the kernel level, and reason about how kernel hardening limits the blast radius of a compromise.
    quiz:
      - prompt: Linux capabilities improve on traditional root by
        options:
          - Making every process root
          - Splitting root's power into discrete privileges that can be granted individually
          - Removing all privileges
          - Encrypting the kernel
        answer: 1
        explanation: Capabilities let a process hold only the specific privileges it needs rather than all of root.
      - prompt: A seccomp profile reduces attack surface by
        options:
          - Encrypting the disk
          - Restricting which system calls a process may make to only those it needs
          - Adding more users
          - Disabling the network
        answer: 1
        explanation: Limiting allowed syscalls means dangerous ones cannot be reached even via a bug.
      - prompt: Namespaces contribute to container isolation by giving a process
        options:
          - A faster CPU
          - An isolated view of resources (its own process tree, network, mounts, user ids)
          - Root on the host
          - Unlimited memory
        answer: 1
        explanation: Namespaces box a process into its own view of system resources, isolating it from the host.
      - prompt: Dropping unneeded capabilities from a service mainly
        options:
          - Speeds up the CPU
          - Limits what an attacker gains if the service is compromised, applying least privilege
          - Encrypts network traffic
          - Disables logging
        answer: 1
        explanation: With fewer capabilities, a compromised process grants the attacker far less power.
  - slug: linux-web-server-security
    title: Web Server Log Analysis and Hardening on Linux
    order: 15
    difficulty: intermediate
    summary: Learn to read web server access and error logs to spot attacks, and to harden a Linux web server, since public web servers are among the most attacked systems.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:3.2", "secplus:4.1", "cysa:1.1", "cysa:2.4"]
    learning_objectives:
      - Read web server access and error logs to identify attacks
      - Recognise common web attack signatures in logs
      - Harden a Linux web server against common threats
    theory: |
      A public web server is one of the most exposed systems an organisation runs, reachable by anyone on the
      internet, so its logs are a front-line detection source and its hardening is high priority. **Access logs**
      record every request: the client IP, timestamp, the HTTP method and path, the status code returned, the
      user-agent and often the referrer. **Error logs** record server-side problems. Reading these fluently is a
      core analyst skill because attacks against web applications leave distinctive traces here before they
      succeed, and the server log is often the only place a reconnaissance or probing phase is visible.

      Several attack patterns have recognisable **signatures** in access logs. A burst of requests to many
      different paths, especially to admin pages, backup files and common vulnerabilities, is **scanning or
      directory enumeration**, often with a scanner's user-agent. Requests whose paths or parameters contain
      `../`, SQL fragments (`' OR 1=1`), script tags, or long encoded strings signal attempts at **path
      traversal, SQL injection or cross-site scripting**. A spike of failed logins against a login endpoint is
      **brute forcing or credential stuffing**. A sudden stream of 500 errors in the error log may mean an attack
      is triggering faults, and a 200 where you would expect a 404 may mean an attacker found something real.
      Correlating status codes with paths and volumes turns a wall of log lines into a story of what was tried and
      what worked.

      **Hardening** reduces both the attack surface and the blast radius. Run the web server as an unprivileged,
      dedicated user so a compromise does not yield root; keep the server and application patched; disable unused
      modules and remove default content and verbose version banners that aid reconnaissance; enforce TLS with
      sound configuration; and set sensible limits (request size, rate limiting) to blunt abuse. A **web
      application firewall** in front adds signature and anomaly filtering for the application-layer attacks seen
      above. File and directory permissions should prevent the web process from writing where it executes, and
      logging should be complete and shipped off the host so an attacker cannot simply erase their traces. For the
      analyst, the combination matters: hardening makes attacks less likely to succeed, and good logging makes the
      attempts that do occur visible, so reading the logs and tightening the configuration are two halves of
      defending the most-attacked box on the network.
    examples:
      - title: Attack signatures in access logs
        body: |
          many paths / admin / backup files + scanner user-agent -> scanning/enumeration
          path or params with ../ , ' OR 1=1 , <script> , long encoded blobs -> traversal/SQLi/XSS
          burst of failed logins -> brute force / credential stuffing
          200 where you expected 404 -> attacker found something real.
      - title: Hardening a web server
        body: |
          run as unprivileged dedicated user (compromise != root); patch server + app
          disable unused modules, remove default content + version banner; enforce TLS
          rate limit + request-size limits; WAF in front; ship logs off-host (can't be erased).
    exercise:
      title: Analyse web server logs and harden the server
      environment: A Linux web server or sample access and error logs (or a scenario)
      tools: [A scenario or sample web logs, a terminal or notes file, a document]
      steps:
        - Explain what the access log and error log each record and why both matter.
        - Identify a scanning or enumeration pattern in the sample and the signal that gives it away.
        - Identify an injection or traversal attempt in the sample by its path or parameters.
        - Interpret a suspicious status-code pattern (for example a 200 where a 404 was expected).
        - Recommend three hardening measures and the risk each reduces.
        - Explain why shipping logs off the host matters for investigation.
      deliverable: A web server analysis identifying a scan and an injection attempt from sample logs, an interpretation of a status-code anomaly, and a hardening plan with three measures.
    expected_outcome: >
      You can read web server access and error logs to spot scanning, injection and brute-force attacks, interpret
      status-code patterns, and harden a Linux web server to reduce both the attack surface and the blast radius.
    quiz:
      - prompt: In a web server access log, a path containing a sequence like ../ most likely indicates
        options:
          - A normal image request
          - A path-traversal attempt to reach files outside the web root
          - A successful login
          - A DNS query
        answer: 1
        explanation: The ../ sequence is the classic signature of directory or path traversal.
      - prompt: A burst of requests to many admin and backup paths with a scanner user-agent suggests
        options:
          - A search engine indexing
          - Scanning or directory enumeration by an attacker
          - A software update
          - A backup job
        answer: 1
        explanation: Rapid probing of many sensitive paths with a scanner agent is enumeration.
      - prompt: Running the web server as an unprivileged dedicated user mainly
        options:
          - Speeds up the server
          - Limits the blast radius so a web compromise does not immediately yield root
          - Encrypts the traffic
          - Removes the need for patching
        answer: 1
        explanation: Least privilege for the web process contains the damage if it is compromised.
      - prompt: Shipping web server logs off the host is important because it
        options:
          - Saves disk space only
          - Preserves the evidence so an attacker who compromises the host cannot erase their traces
          - Makes the site faster
          - Disables the error log
        answer: 1
        explanation: Off-host logs survive host compromise, keeping the attack trail intact for investigation.
  - slug: linux-package-supply-chain
    title: Package Management and Software Supply Chain on Linux
    order: 16
    difficulty: intermediate
    summary: Understand how Linux software is installed and trusted through package managers and repositories, the supply-chain risks involved, and how signing, pinning and provenance protect the chain.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:2.3", "secplus:4.1", "cysa:1.3"]
    learning_objectives:
      - Explain how Linux package managers install and verify software
      - Describe software supply-chain risks on Linux
      - Apply signing, trusted repositories and provenance to protect the chain
    theory: |
      On Linux, almost all software arrives through **package managers** (apt, yum/dnf, apk and others) pulling
      from **repositories**, and understanding this chain is essential because it is both a security strength and
      a target. The strength is that mainstream repositories distribute **signed** packages: the package manager
      verifies each package against the repository's cryptographic key before installing, so a package that was
      tampered with in transit or served by an impostor mirror is rejected. This is why adding a third-party
      repository means adding and trusting its signing key, and why doing that casually is risky: you are
      extending your trust to whoever controls that repository and key.

      The **supply-chain risks** are where modern attacks increasingly live, because compromising the software
      everyone installs is far more efficient than attacking each target. Risks include installing from
      **untrusted or compromised repositories**, pulling in a **malicious or typo-squatted package** (a name close
      to a popular one), a **dependency** several layers down being malicious or vulnerable, and, at the extreme, a
      legitimate upstream project being compromised so that even the official package carries a backdoor. The same
      concerns apply strongly to **language package ecosystems** (pip, npm and similar) that developers use
      alongside the OS package manager, which often pull directly from the internet with weaker vetting and are a
      frequent vector. A single poisoned dependency can reach enormous numbers of systems, as real incidents have
      shown.

      Protecting the chain combines **trust, verification and provenance**. Prefer official, signed repositories
      and add third-party ones sparingly and deliberately, verifying their keys. **Pin** versions and use lock
      files so builds are reproducible and an attacker cannot silently slip in a new malicious version. Scan
      dependencies for known vulnerabilities (software composition analysis) and increasingly track
      **provenance**, a verifiable record of where a package came from and how it was built, with emerging
      standards and software bills of materials (SBOMs) that inventory exactly what is installed. For the analyst,
      the practical signals are packages installed from unexpected repositories, unsigned or key-mismatch
      warnings, and newly added repository keys, while the architectural lesson is that trusting software is a
      deliberate decision: every repository and dependency you accept is part of your attack surface, so the chain
      must be curated, verified and inventoried rather than trusted by default.
    examples:
      - title: The trust chain
        body: |
          package manager pulls from repositories; packages are SIGNED -> verified against the repo key before install
          tampered or impostor-served packages are rejected
          adding a third-party repo = adding and trusting its signing key (extends your trust).
      - title: Supply-chain risks and defences
        body: |
          risks: untrusted/compromised repo, typo-squatted package, malicious deep dependency, poisoned upstream
          (language ecosystems pip/npm pull from the internet with weaker vetting -> frequent vector)
          defend: official signed repos, pin versions + lock files, SCA scanning, provenance + SBOM inventory.
    exercise:
      title: Secure a Linux software supply chain
      environment: A described Linux system or build pipeline and its software sources (or a scenario)
      tools: [A scenario or sample package sources, a terminal or notes file, a document]
      steps:
        - Explain how a package manager verifies a package before installing it.
        - Explain why adding a third-party repository extends your trust and the risk that carries.
        - Describe three supply-chain risks (typo-squatting, malicious dependency, compromised upstream).
        - Explain why language ecosystems like pip and npm are a frequent additional vector.
        - Recommend defences including signed repositories, version pinning and dependency scanning.
        - Explain how provenance or an SBOM helps after a supply-chain incident is announced.
      deliverable: A supply-chain security plan covering package verification, repository trust, the main risks, language-ecosystem exposure, and defences including pinning, scanning and provenance/SBOM.
    expected_outcome: >
      You can explain how Linux package managers verify software, the supply-chain risks across OS and language
      ecosystems, and the signing, pinning, scanning and provenance practices that protect the chain.
    quiz:
      - prompt: Mainstream Linux repositories protect installs by
        options:
          - Installing any package without checks
          - Distributing signed packages that the package manager verifies against the repository key before installing
          - Disabling the network
          - Encrypting the disk
        answer: 1
        explanation: Package signing lets the manager reject tampered or impostor-served packages.
      - prompt: Adding a third-party repository is risky mainly because it
        options:
          - Speeds up installs
          - Extends your trust to whoever controls that repository and its signing key
          - Removes all packages
          - Disables apt or dnf
        answer: 1
        explanation: You trust the third party's key, so a compromise there can push malicious packages to you.
      - prompt: A typo-squatted package is one that
        options:
          - Has a verified SBOM
          - Uses a name close to a popular package to trick users into installing malicious code
          - Is always signed
          - Cannot be installed
        answer: 1
        explanation: Typo-squatting relies on a near-identical name to a trusted package to deceive installers.
      - prompt: Version pinning and lock files protect the supply chain by
        options:
          - Encrypting dependencies
          - Making builds reproducible so an attacker cannot silently substitute a new malicious version
          - Removing all dependencies
          - Disabling signing
        answer: 1
        explanation: Pinning fixes exact versions, preventing silent introduction of a malicious update.
  - slug: linux-shell-forensics
    title: Shell History and Command Forensics on Linux
    order: 17
    difficulty: intermediate
    summary: Learn to reconstruct what happened on a Linux host from shell history, command logging and related artifacts, and understand how attackers try to hide their tracks.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Locate and interpret shell history and command-logging artifacts
      - Reconstruct a user or attacker's command activity
      - Recognise anti-forensic attempts to hide command history
    theory: |
      When investigating a compromised or suspicious Linux host, one of the most revealing questions is simply
      what **commands** were run, and several artifacts can answer it. The most familiar is **shell history**:
      files like `.bash_history` in each user's home directory record the commands a shell has run, often with
      timestamps if the shell is configured for them. History is a quick first look that can show an attacker's
      exact actions, reconnaissance, downloads, privilege escalation attempts, in their own words. But history has
      real limitations as evidence: it is written on shell exit (so a still-open or killed session may not have
      flushed), it is per-user and per-shell, it can be disabled or redirected, and the user can edit or delete
      it, so it is a valuable lead but not a trustworthy complete record on its own.

      More reliable sources exist when they have been enabled in advance. The Linux **audit system (auditd)** can
      log command execution (via execve) with full detail, user, command, arguments, time, in a way the user
      cannot simply erase, and shipping those logs off the host makes them tamper-resistant. Other artifacts fill
      the picture: `/var/log` authentication and sudo logs show who became root and when, process accounting if
      enabled records executed commands, and timestamps across the filesystem (when files were created, modified
      or accessed) help build a timeline. Correlating shell history against these independent sources is how an
      analyst distinguishes a genuine record from one that has been tampered with, and how they fill the gaps that
      history alone leaves.

      Attackers know about these artifacts and attempt **anti-forensics**. Common tricks include clearing or
      truncating history files, setting the history size to zero or pointing `HISTFILE` at `/dev/null`, running
      commands with a leading space (which, with a common setting, keeps them out of history), using shells or
      techniques that do not log, and deleting logs. Crucially, these evasions often leave their own traces, a
      suspiciously empty or truncated history, a gap in logs, the command that disabled history still captured by
      auditd, which is why having independent, tamper-resistant logging (auditd shipped off-host) matters so much:
      it survives the attacker's attempt to cover the local history. For the analyst, the practical approach is to
      treat shell history as a useful but untrustworthy first lead, to lean on auditd and off-host logs for the
      authoritative record, to correlate multiple sources into a timeline, and to read the absence or manipulation
      of history as itself a finding, because an attacker's effort to hide their commands is often as telling as
      the commands themselves.
    examples:
      - title: Command artifacts
        body: |
          shell history (.bash_history): quick first look, commands in the attacker's own words
            BUT: flushed on exit, per-user/shell, editable/deletable -> a lead, not a trustworthy record.
          auditd (execve): full command logging the user can't easily erase; ship OFF-HOST -> tamper-resistant
          + auth/sudo logs, process accounting, filesystem timestamps -> correlate into a timeline.
      - title: Anti-forensics and its traces
        body: |
          clear/truncate history; HISTSIZE=0; HISTFILE=/dev/null; leading-space commands; delete logs
          but evasions leave traces: empty/truncated history, log gaps, the disabling command captured by auditd
          -> absence/manipulation of history is itself a finding.
    exercise:
      title: Reconstruct command activity on a host
      environment: A described compromised Linux host with history and logs (or a scenario)
      tools: [A scenario or sample history/auditd/auth logs, a terminal or notes file, a document]
      steps:
        - Locate shell history and explain what it shows and its limitations as evidence.
        - Explain why auditd execve logging shipped off-host is a more reliable record.
        - Use auth and sudo logs to determine who gained root and when.
        - Correlate history, auditd and filesystem timestamps into a short timeline of attacker activity.
        - Identify an anti-forensic attempt (cleared history, HISTFILE redirected) and the trace it left.
        - Explain why the manipulation of history is itself an investigative finding.
      deliverable: A command-forensics reconstruction building a timeline from history, auditd and auth logs, identifying an anti-forensic attempt and its residual trace.
    expected_outcome: >
      You can locate and interpret shell history and command-logging artifacts, reconstruct command activity into
      a timeline using tamper-resistant sources, and recognise anti-forensic attempts and the traces they leave.
    quiz:
      - prompt: Shell history (.bash_history) is a useful but untrustworthy record because it
        options:
          - Cannot be read at all
          - Is flushed on exit, is per-user and per-shell, and can be edited or deleted by the user
          - Is cryptographically signed
          - Logs every process on the system
        answer: 1
        explanation: History is a quick lead but easily incomplete or altered, so it is not authoritative.
      - prompt: A more reliable, tamper-resistant record of executed commands comes from
        options:
          - The desktop wallpaper
          - The audit system (auditd) logging execve, especially when shipped off the host
          - The history file alone
          - The screensaver
        answer: 1
        explanation: Auditd records commands the user cannot easily erase, and off-host storage resists tampering.
      - prompt: An attacker pointing HISTFILE at /dev/null is attempting to
        options:
          - Speed up the shell
          - Prevent their commands from being recorded in shell history
          - Encrypt the history
          - Back up the history
        answer: 1
        explanation: Redirecting HISTFILE discards history so the commands are not saved.
      - prompt: A suspiciously empty or truncated history should be treated as
        options:
          - Proof nothing happened
          - Itself a finding, since anti-forensic manipulation is often as telling as the commands
          - A reason to stop investigating
          - A normal state always
        answer: 1
        explanation: Missing or manipulated history signals an attacker covering tracks, which is significant.
  - slug: linux-ebpf-monitoring
    title: Runtime Security Monitoring with eBPF
    order: 18
    difficulty: advanced
    summary: Understand how eBPF enables deep, low-overhead visibility into the Linux kernel for security monitoring, and how modern runtime security and detection tools use it to see process, file and network activity.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:3", "cysa:1.1"]
    learning_objectives:
      - Explain what eBPF is and why it suits security monitoring
      - Describe the kernel-level visibility eBPF provides
      - Apply eBPF-based tooling for Linux runtime detection
    theory: |
      **eBPF** (extended Berkeley Packet Filter) is a technology that lets small, safe programs run inside the
      **Linux kernel** in response to events, without modifying the kernel or loading risky kernel modules, and it
      has become the foundation of modern Linux observability and runtime security. For security, its appeal is
      deep visibility with low overhead: because eBPF programs attach directly to kernel events, they can observe,
      with high fidelity and at the source, exactly what processes do, system calls, process creation, file
      access, network connections, as it happens, rather than inferring it from logs after the fact. The kernel
      verifies each eBPF program before running it, so this power comes with safety guarantees that traditional
      kernel modules lacked, which is why it is now trusted in production.

      The **visibility** eBPF provides is precisely what security monitoring wants. By hooking kernel functions and
      system calls, eBPF-based tools see process execution (every program launched, with its arguments and
      lineage), file activity (what was read, written, or executed), and network activity (connections, their
      processes and destinations), all correlated at the kernel level where it cannot easily be hidden. This is
      especially valuable on Linux servers and in containers, where it provides the runtime visibility that EDR
      brings to endpoints: a single eBPF-based agent can watch an entire host and its containers from the kernel,
      seeing into containers without needing an agent inside each one, because containers share the host kernel.
      This makes eBPF a natural fit for cloud-native and containerised environments where traditional
      host-based agents struggle.

      In practice, security teams use eBPF through **tools rather than by writing raw programs**: runtime security
      and detection projects and commercial products build on eBPF to provide detections, alerting on suspicious
      process execution, unexpected network connections, container escapes, privilege changes and the behavioural
      patterns covered in earlier detection lessons, now observed directly from the kernel. The benefits are
      fidelity (seeing the real syscall-level truth), low performance cost, and container-awareness, while the
      considerations include needing a sufficiently modern kernel and the usual tuning to control noise. For the
      analyst, the key point is conceptual: eBPF is how modern Linux and container runtime detection gets its
      high-quality telemetry, delivering the process, file and network visibility that behaviour-based detection
      and hunting depend on, from inside the kernel where activity is hardest to hide, so understanding that eBPF
      underpins today's Linux runtime security explains where that rich telemetry comes from and why it is trusted.
    examples:
      - title: What eBPF is
        body: |
          small, kernel-verified programs run inside the Linux kernel on events (no kernel module, no kernel changes)
          deep visibility + low overhead; observe at the SOURCE, as it happens (not inferred from logs later).
      - title: Visibility it gives (and containers)
        body: |
          hooks syscalls/kernel funcs -> process execution + lineage, file read/write/exec, network connections
          one kernel-level agent watches the host AND its containers (shared kernel) -> no agent inside each container
          = EDR-grade runtime visibility for Linux servers and cloud-native/containerised environments.
    exercise:
      title: Plan eBPF-based runtime monitoring
      environment: A described Linux or containerised environment needing runtime visibility (or a scenario)
      tools: [A scenario, a notes file, a document]
      steps:
        - Explain what eBPF is and why kernel verification makes it safer than traditional kernel modules.
        - Describe the process, file and network visibility eBPF provides and why observing at the kernel matters.
        - Explain why eBPF is especially valuable for containers.
        - Give two detections an eBPF-based tool could provide for Linux runtime threats.
        - Note the practical considerations (kernel version, tuning for noise).
        - Explain how eBPF telemetry supports the behaviour-based detection and hunting from earlier lessons.
      deliverable: A plan for eBPF-based runtime monitoring covering what it is, the visibility it gives, its container advantage, example detections, practical considerations, and its role in behaviour-based detection.
    expected_outcome: >
      You can explain what eBPF is and why it suits security monitoring, describe the kernel-level process, file
      and network visibility it provides, and apply eBPF-based tooling for Linux and container runtime detection.
    quiz:
      - prompt: eBPF is attractive for security monitoring because it
        options:
          - Requires risky kernel modules
          - Runs kernel-verified programs inside the kernel to observe activity with high fidelity and low overhead
          - Only works on Windows
          - Infers activity from logs after the fact
        answer: 1
        explanation: eBPF observes directly at kernel events, safely and efficiently, rather than inferring later.
      - prompt: eBPF is especially valuable for containers because
        options:
          - Containers have their own kernels
          - Containers share the host kernel, so one kernel-level agent sees into all of them without an agent inside each
          - It disables containers
          - It only sees network traffic
        answer: 1
        explanation: Shared-kernel visibility lets a single eBPF agent monitor the host and all its containers.
      - prompt: The kind of visibility eBPF provides includes
        options:
          - Only CPU temperature
          - Process execution and lineage, file activity, and network connections observed at the kernel
          - Only disk space
          - Only user passwords
        answer: 1
        explanation: eBPF hooks syscalls and kernel functions to see process, file and network activity.
      - prompt: Security teams typically use eBPF by
        options:
          - Writing raw eBPF programs for every detection
          - Using runtime-security and detection tools built on eBPF that provide detections and alerting
          - Avoiding it entirely
          - Disabling the kernel
        answer: 1
        explanation: Teams consume eBPF through tools and products rather than hand-writing kernel programs.
  - slug: linux-auditd
    title: Linux Auditing with auditd
    order: 19
    difficulty: advanced
    summary: Learn how the Linux audit system (auditd) records detailed security-relevant events at the kernel level, how to write audit rules, and how auditd underpins Linux detection and forensics.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:3", "cysa:1.1"]
    learning_objectives:
      - Explain what auditd is and the visibility it provides
      - Write audit rules to capture security-relevant events
      - Use auditd data for Linux detection and investigation
    theory: |
      The Linux **audit system**, with its daemon **auditd**, is the kernel's built-in facility for recording
      security-relevant events, and it provides the detailed, authoritative telemetry that Linux detection and
      forensics depend on. Ordinary logs (auth.log, application logs) capture a lot, but auditd goes deeper by
      recording events at the kernel level: system calls, file access, command execution, authentication events,
      and changes to sensitive files, with details like which user and process did what, when, and with what
      result. Because it sees system calls as they happen, auditd can record things higher-level logs miss, and its
      records are harder for an attacker to avoid producing, making it a cornerstone of serious Linux monitoring
      and a primary source for many Linux detections and investigations.

      The power of auditd comes from **audit rules**, which tell it what to record. Rules can watch specific files
      or directories for access or modification (a **watch**, useful for sensitive files like /etc/passwd,
      /etc/shadow, SSH configs and binaries), or trigger on specific **system calls** with filters (for example,
      record every execve to capture command execution, or every change to file permissions). Well-designed rule
      sets, such as those derived from security benchmarks or mapped to ATT&CK, capture the events that matter,
      command execution, sensitive file changes, privilege changes, module loading, without drowning the system in
      noise, which is the central tuning challenge: auditd can record almost everything, so rules must be chosen to
      capture high-value events at an acceptable volume. Each rule can carry a key so matching events are easy to
      search and attribute to a detection purpose.

      For the analyst, auditd is both a **detection feed and a forensic record**. Forwarded into a SIEM, auditd
      events power detections for suspicious command execution, tampering with sensitive files, unexpected
      privilege use and more, complementing the eBPF-based runtime monitoring and the log triage covered earlier.
      In an investigation, auditd logs can reconstruct exactly what a user or process did, what commands ran, what
      files were touched, which is invaluable for understanding a Linux compromise. The considerations are the
      volume and performance cost (so rules are tuned), and that auditd logs, like any, must be protected and
      ideally shipped off-host so an attacker who gains root cannot simply erase them. The recurring lessons are
      that auditd is the Linux kernel's authoritative security-event recorder, that the quality of what it captures
      depends entirely on well-chosen, tuned audit rules, and that its detailed, hard-to-avoid records make it a
      foundational source for both detecting Linux attacks and investigating them after the fact.
    examples:
      - title: Why auditd goes deeper
        body: |
          kernel-level recording of syscalls, file access, command execution, auth, sensitive-file changes (who/what/when/result)
          sees what higher-level logs miss; records harder for an attacker to avoid producing
          -> cornerstone of serious Linux monitoring and a primary forensic source.
      - title: Audit rules
        body: |
          watch a file/dir for access or change (e.g. /etc/shadow, SSH config, binaries)
          trigger on a syscall with filters (e.g. record every execve = command execution; permission changes)
          tune to capture high-value events at acceptable volume; tag rules with a key for easy search; ship logs off-host.
    exercise:
      title: Configure and use auditd
      environment: A described Linux host needing audit coverage (or a scenario with sample audit logs)
      tools: [A scenario or sample auditd logs, a document, a notes file]
      steps:
        - Explain what auditd records and why it goes deeper than ordinary logs.
        - Write an audit rule (in words) that watches a sensitive file for modification.
        - Write an audit rule that records command execution via a system call.
        - Explain the tuning challenge of capturing high-value events without excessive volume.
        - Describe a detection you could build from auditd events in a SIEM.
        - Explain why auditd logs should be protected and shipped off-host.
      deliverable: An auditd plan with example watch and syscall rules, a tuning rationale, a SIEM detection idea, and log-protection measures.
    expected_outcome: >
      You can explain auditd and the kernel-level visibility it provides, write audit rules to capture
      security-relevant events, and use auditd data for Linux detection and forensic investigation.
    quiz:
      - prompt: auditd provides deeper visibility than ordinary logs because it
        options:
          - Only records uptime
          - Records security-relevant events at the kernel level, including system calls, file access and command execution
          - Cannot see file access
          - Runs only in the cloud
        answer: 1
        explanation: Kernel-level auditing captures detailed events that higher-level logs often miss.
      - prompt: Audit rules determine
        options:
          - The server's IP address
          - What auditd records, such as watching sensitive files or triggering on specific system calls
          - The CPU speed
          - The desktop wallpaper
        answer: 1
        explanation: Rules (watches and syscall triggers) decide which events auditd captures.
      - prompt: The central tuning challenge with auditd is that
        options:
          - It cannot record anything
          - It can record almost everything, so rules must capture high-value events without excessive volume
          - It only records one event
          - It needs no configuration
        answer: 1
        explanation: Because auditd can log nearly everything, rules must be chosen to balance value against noise.
      - prompt: auditd logs should be shipped off-host because
        options:
          - It improves CPU performance
          - An attacker who gains root could otherwise erase them, so off-host copies preserve the record
          - It makes them unreadable
          - It disables auditing
        answer: 1
        explanation: Centralising audit logs protects them from tampering by an attacker with local root.
  - slug: linux-pam-authentication
    title: PAM and Linux Authentication Hardening
    order: 20
    difficulty: intermediate
    summary: Understand how Pluggable Authentication Modules (PAM) control authentication on Linux, why PAM is a powerful security control point, and how to harden and monitor Linux authentication through it.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.6", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain what PAM is and why it is central to Linux authentication
      - Harden Linux authentication through PAM configuration
      - Monitor authentication and recognise PAM as an attack surface
    theory: |
      On Linux, the question of how a user proves who they are, at login, over SSH, when using sudo, is answered by
      **PAM**, Pluggable Authentication Modules, a flexible framework that sits between applications and the actual
      authentication methods. Rather than each program implementing its own password checking, applications call
      PAM, and PAM runs a configurable **stack** of modules that decide whether authentication succeeds and what
      else happens (checking passwords, enforcing password quality, limiting login times, locking accounts after
      failures, requiring a second factor, logging the attempt). This makes PAM a single, powerful control point:
      change the PAM configuration and you change how authentication works across the system, which is exactly why
      it is central both to hardening Linux authentication and, if abused, to subverting it.

      **Hardening through PAM** applies several controls at this chokepoint. Enforce **strong password policy**
      (complexity, length, history, preventing reuse) via the relevant modules. Implement **account lockout or
      rate limiting** so repeated failed attempts (the brute force met in the auth-log lesson) are slowed or
      blocked. Add **multi-factor authentication** by inserting an MFA module into the stack, so even SSH or console
      logins require a second factor. Restrict **who can log in and when** (limiting access to certain users,
      groups, or times) and control resource limits. Because sudo also uses PAM, these controls extend to privilege
      elevation. The common theme is that PAM lets an administrator impose consistent, strong authentication
      policy across the system from one framework, rather than hoping each application does the right thing.

      PAM is also an **attack surface and a monitoring source**, which defenders must appreciate. Because PAM
      governs authentication, an attacker with root may try to subvert it, a **malicious PAM module** or a modified
      configuration can create a backdoor (for example a module that accepts a secret password for any account, or
      that silently harvests credentials as users authenticate), a stealthy and dangerous persistence and
      credential-theft technique. So the integrity of PAM configuration and modules is something to protect and
      monitor (file integrity monitoring, met earlier, applies directly), and unexpected changes to PAM are a
      strong signal. On the detection side, PAM-driven authentication events feed the logs analysed for brute
      force, unusual logins and privilege use. For the analyst, the lessons are that PAM is the configurable heart
      of Linux authentication and a single powerful place to enforce strong password policy, lockout, MFA and
      access restrictions, that because it controls authentication it is a prized target, so its integrity must be
      protected and monitored, and that authentication is both hardened and attacked at this chokepoint, which is
      why understanding PAM is essential to securing Linux systems.
    examples:
      - title: PAM as the authentication chokepoint
        body: |
          apps (login, SSH, sudo) call PAM -> PAM runs a configurable STACK of modules deciding success + side effects
          one control point: change PAM config -> change authentication system-wide
          -> central to hardening AND, if abused, to subverting authentication.
      - title: Harden and the attack surface
        body: |
          harden: strong password policy, account lockout/rate limiting (brute force), insert an MFA module, restrict who/when can log in (sudo too)
          attack: a malicious PAM module or modified config = backdoor (accept a secret password for any account) or credential harvester -> stealthy persistence
          -> protect + monitor PAM integrity (FIM); PAM events feed auth-log detections.
    exercise:
      title: Harden and monitor Linux authentication via PAM
      environment: A described Linux host and its authentication requirements (or a scenario)
      tools: [A scenario or sample PAM config and auth logs, a document, a notes file]
      steps:
        - Explain what PAM is and why calling it a single control point is accurate.
        - Describe how you would enforce strong password policy and account lockout via PAM.
        - Explain how MFA and access restrictions are added through the PAM stack.
        - Explain why PAM also governs sudo privilege elevation.
        - Describe how a malicious PAM module or config change creates a backdoor and why it is stealthy.
        - Explain how you would protect and monitor PAM integrity and use its events for detection.
      deliverable: A PAM hardening and monitoring plan covering password policy, lockout, MFA and access restrictions, plus protecting PAM integrity against malicious modules and using PAM events for detection.
    expected_outcome: >
      You can explain PAM and its central role in Linux authentication, harden authentication through PAM
      configuration, and recognise PAM as both an attack surface to protect and a source of detection telemetry.
    quiz:
      - prompt: PAM is central to Linux authentication because
        options:
          - Each application implements its own password checking
          - Applications call PAM, which runs a configurable stack of modules governing authentication system-wide
          - It only controls the desktop background
          - It disables SSH
        answer: 1
        explanation: PAM is the single configurable framework through which Linux authentication flows.
      - prompt: Which is a PAM-based hardening control?
        options:
          - Disabling all logging
          - Enforcing strong password policy, account lockout and inserting an MFA module into the stack
          - Granting everyone root
          - Removing authentication
        answer: 1
        explanation: PAM is where password policy, lockout, MFA and access restrictions are enforced.
      - prompt: A malicious PAM module is dangerous because it can
        options:
          - Only change the hostname
          - Create a backdoor (for example accept a secret password for any account) or harvest credentials stealthily
          - Improve authentication security
          - Do nothing
        answer: 1
        explanation: Because PAM governs authentication, subverting it yields stealthy persistence and credential theft.
      - prompt: Because PAM controls authentication, defenders should
        options:
          - Ignore changes to PAM
          - Protect and monitor PAM configuration and module integrity, treating unexpected changes as a strong signal
          - Delete PAM
          - Share the PAM config publicly
        answer: 1
        explanation: PAM integrity is security-critical, so changes to it must be monitored and investigated.
  - slug: linux-centralised-logging
    title: Centralised Logging on Linux
    order: 21
    difficulty: intermediate
    summary: Understand how Linux logging works (syslog and the journal), why logs must be shipped off the host to a central collector, and how centralised logging underpins both detection and tamper-resistant forensics.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.4", "sc200:2", "cysa:1.4"]
    learning_objectives:
      - Explain how Linux logging works and what it records
      - Explain why logs must be centralised off the host
      - Design centralised logging for detection and forensics
    theory: |
      Linux systems generate a wealth of security-relevant logs, authentication events, system messages, service
      logs, and the auditd records met earlier, but by default these live **locally on each host**, which is both
      hard to monitor at scale and dangerous, because an attacker who compromises the host can read, alter or
      delete the very logs that would reveal them. Understanding Linux logging starts with how it is produced: the
      traditional **syslog** mechanism and the modern **systemd journal (journald)** collect messages from the
      kernel, services and applications, writing them to local files or the journal. These local logs are
      essential, but relying on them alone leaves each host an island whose evidence an attacker controls, which is
      why **centralised logging**, shipping logs off the host to a central collector, is a foundational practice.

      The case for **centralisation** is both operational and security-critical. Operationally, a SOC cannot log in
      to hundreds of hosts to read logs; it needs them aggregated where they can be searched, correlated and fed to
      the SIEM, so that a detection can span many hosts and an analyst can investigate from one place (the
      onboarding and correlation ideas from the SIEM module applied to Linux). Security-critically, shipping logs
      off-host in near real time means that even if an attacker gains root and wipes the local logs, the evidence
      already sent to the central collector survives, preserving the record of the attack. This tamper-resistance
      is exactly why log deletion is a recognised attacker technique and why off-host logging defeats it, and it
      makes the central collector itself a protected, high-value system. Centralisation also enables consistent
      retention and integrity protection of logs that scattered local files cannot provide.

      Designing centralised logging on Linux involves **collecting, forwarding and protecting** the right data. A
      forwarding agent (rsyslog, the journal's own forwarding, or a log shipper) sends local logs, syslog messages,
      journal entries, auth logs, auditd output, to the central collector or SIEM, ideally over a secure,
      authenticated channel so logs are not readable or forgeable in transit. The design decides which logs to
      ship (security-relevant ones prioritised), ensures reliable delivery (so a brief network outage does not
      silently lose logs, connecting to the collection-health monitoring met earlier), and protects the collector.
      Time synchronisation across hosts is important so that correlated events line up on one timeline. The
      considerations are volume and cost (so not everything is shipped indiscriminately), reliability, and securing
      the pipeline. For the analyst, the lessons are that Linux produces rich local logs via syslog and the journal
      but that local-only logs are both unmanageable at scale and destroyable by an attacker, that centralising
      logs off the host is what enables detection across many systems and preserves tamper-resistant evidence, and
      that a sound design collects the right logs, forwards them securely and reliably to a protected collector,
      and keeps clocks in sync, so that the record of what happened on every Linux host survives and is usable even
      when the hosts themselves are compromised.
    examples:
      - title: Local logs are islands an attacker controls
        body: |
          syslog + systemd journal (journald) collect kernel/service/app messages locally; plus auth logs + auditd
          local-only = hard to monitor at scale AND an attacker with root can read/alter/DELETE them
          -> ship logs OFF the host.
      - title: Why centralise
        body: |
          operational: aggregate -> search/correlate/SIEM, detection spans many hosts, investigate from one place
          security: logs already sent survive local wiping -> tamper-resistant evidence (defeats log deletion); protect the collector
          design: secure authenticated forwarding, reliable delivery (no silent loss), time sync across hosts.
    exercise:
      title: Design centralised Linux logging
      environment: A described fleet of Linux hosts needing central logging (or a scenario)
      tools: [A scenario, a document, a notes file]
      steps:
        - Explain how Linux produces logs via syslog and the systemd journal and what they record.
        - Explain the two reasons (operational and security) that local-only logs are insufficient.
        - Explain how off-host logging preserves evidence even when an attacker wipes local logs.
        - Describe how logs are forwarded to a central collector and why the channel should be secure.
        - Explain why reliable delivery and time synchronisation matter.
        - Note the considerations (volume and cost, protecting the collector).
      deliverable: A centralised-logging design covering Linux log sources, the operational and security case for centralising, secure reliable forwarding, time sync, and protecting the collector.
    expected_outcome: >
      You can explain Linux logging via syslog and the journal, explain why logs must be centralised off the host
      for detection and tamper-resistant forensics, and design secure, reliable centralised logging across a fleet.
    quiz:
      - prompt: Relying only on local Linux logs is dangerous because
        options:
          - Local logs are always encrypted
          - An attacker who compromises the host can read, alter or delete the logs that would reveal them
          - Local logs cannot be written
          - It improves detection
        answer: 1
        explanation: Local-only logs are controlled by whoever owns the host, so an attacker can destroy the evidence.
      - prompt: Shipping logs off-host in near real time provides
        options:
          - Slower logging
          - Tamper-resistant evidence, since logs already sent survive even if the attacker wipes the local copies
          - No security benefit
          - A way to delete logs faster
        answer: 1
        explanation: Centralised copies preserve the record even when local logs are destroyed, defeating log deletion.
      - prompt: Time synchronisation across hosts matters for centralised logging because
        options:
          - It speeds up the network
          - Correlated events from different hosts must line up on one accurate timeline
          - It encrypts the logs
          - It reduces log volume
        answer: 1
        explanation: Accurate clocks let events across hosts be correlated into a coherent timeline.
      - prompt: A centralised logging design should forward logs
        options:
          - In clear text with no reliability
          - Over a secure, authenticated channel with reliable delivery so logs are not forgeable or silently lost
          - Only once a year
          - Only to the same host
        answer: 1
        explanation: Secure, reliable forwarding protects logs in transit and avoids silent gaps.
  - slug: linux-memory-forensics
    title: Linux Memory and Process Forensics
    order: 22
    difficulty: advanced
    summary: Learn how analysing a Linux system's memory and running processes reveals compromise that disk analysis misses, especially fileless and in-memory threats, and how to acquire and examine Linux memory safely.
    theory_minutes: 12
    lab_minutes: 54
    objectives: ["secplus:4.8", "sc200:3", "cysa:1.2"]
    learning_objectives:
      - Explain why memory and process forensics matter on Linux
      - Describe how Linux memory and process state are acquired and examined
      - Use memory and process analysis to find Linux compromise
    theory: |
      Much of what matters during a live Linux compromise exists only in **memory and running process state**, not
      on disk, so examining them reveals threats that disk forensics alone misses. An attacker's running malware,
      injected code, decrypted payloads, active network connections, and in-memory-only (fileless) implants may
      leave little or nothing on disk, and a process whose executable was deleted from disk can still be running.
      The live state of the system, what processes exist, what they are doing, what they have open, what is in
      memory, is therefore a rich and sometimes irreplaceable source of evidence, which complements the disk and
      log forensics covered elsewhere and is especially important for sophisticated, stealthy, or fileless Linux
      threats that are designed to avoid leaving disk artifacts.

      Examining this state comes in two related forms. **Live process analysis** inspects the running system through
      its own interfaces: the process list and the rich information Linux exposes about each process (through /proc),
      including the process's executable path (revealing a process whose binary was deleted, or one running from a
      suspicious or temporary location), its open files and network connections, its command line, its environment,
      and its memory maps. This can quickly surface a suspicious process, an unexpected listener, a process
      masquerading under a normal name, or a binary running from /tmp. **Memory forensics** goes deeper by capturing
      a full image of the system's RAM and analysing it offline with specialised tooling (memory-analysis
      frameworks with Linux support), which can reconstruct processes, network connections, loaded kernel modules,
      and injected or hidden code, including things an attacker tried to hide from the live system, such as a
      rootkit concealing processes. Memory analysis can reveal what even a compromised live system would not show,
      because the rootkit cannot hide from a raw memory image the way it hides from the tools it has subverted.

      Doing this well requires **care in acquisition and interpretation**. Capturing memory from a running system
      must be done carefully and ideally with a trusted mechanism, because the act of collection touches the system
      and a compromised host's own tools may lie (which is why trusted, statically linked tools or a memory image
      analysed offline are preferred, echoing the live-response caution met earlier). Timeliness matters, memory is
      volatile and lost on reboot or shutdown, so if memory evidence is needed it must be captured before the system
      is powered down, which is a key early decision in Linux incident response. Interpretation requires knowing
      what normal process and memory state looks like so anomalies stand out, and findings are corroborated with
      disk, log and network evidence. For the analyst, the lessons are that memory and running-process state hold
      evidence of compromise, especially fileless and hidden threats, that disk analysis alone misses, that live
      process analysis (via /proc and process information) and full memory forensics each reveal different depths,
      with memory imaging able to expose what a subverted live system hides, and that capturing this volatile
      evidence carefully and before shutdown, then interpreting it against a baseline and corroborating it, is how a
      responder uncovers the in-memory reality of a Linux compromise.
    examples:
      - title: Why memory beats disk for live threats
        body: |
          running malware, injected code, decrypted payloads, active connections, fileless implants -> often ONLY in memory
          a process whose binary was deleted from disk can still be running -> disk forensics misses it
          live state is rich, sometimes irreplaceable evidence for stealthy/fileless Linux threats.
      - title: Two forms, with care
        body: |
          live process analysis: /proc + process info (deleted/odd-location binary, open files, connections, cmdline, memory maps) -> surface a suspicious process fast
          memory forensics: image RAM, analyse offline -> reconstruct processes/connections/modules/injected code; reveals what a rootkit HID from live tools
          acquire carefully (trusted tools, memory is volatile -> capture BEFORE shutdown); baseline + corroborate.
    exercise:
      title: Analyse Linux memory and process state
      environment: A described compromised Linux host (or a scenario with sample process/memory data)
      tools: [A scenario or sample /proc and process data, a document, a notes file]
      steps:
        - Explain why memory and process state reveal compromise that disk analysis misses.
        - Describe what live process analysis via /proc can surface (deleted binary, odd location, connections).
        - Explain what full memory forensics adds and how it exposes hidden or injected code.
        - Explain why memory imaging can reveal what a subverted live system hides.
        - Explain why memory must be captured carefully and before shutdown.
        - Explain how findings are interpreted against a baseline and corroborated.
      deliverable: A Linux memory-and-process forensics plan covering why it matters, live process analysis via /proc, full memory forensics, careful volatile-evidence acquisition before shutdown, and interpretation with corroboration.
    expected_outcome: >
      You can explain why Linux memory and process forensics matter, describe live process analysis and full memory
      imaging, and use them to find compromise, including fileless and hidden threats, that disk analysis misses.
    quiz:
      - prompt: Memory and process forensics matter on Linux because
        options:
          - Everything an attacker does is always on disk
          - Running malware, injected code and fileless implants may exist only in memory, which disk analysis misses
          - Memory holds no useful evidence
          - Processes cannot be examined
        answer: 1
        explanation: Live, in-memory and fileless threats leave little on disk, so memory holds key evidence.
      - prompt: Live process analysis via /proc can quickly reveal
        options:
          - Only the hostname
          - A process whose binary was deleted or runs from a suspicious location, its open files and network connections
          - The office temperature
          - Nothing about running processes
        answer: 1
        explanation: /proc exposes a process's executable path, connections and more, surfacing suspicious processes.
      - prompt: Full memory imaging can expose what a live system hides because
        options:
          - It cannot see memory
          - A rootkit cannot hide from a raw memory image the way it hides from the live tools it has subverted
          - It only reads disk
          - It trusts the compromised tools
        answer: 1
        explanation: Offline analysis of a raw memory image bypasses the subverted tools a rootkit relies on.
      - prompt: Memory evidence must be captured
        options:
          - Any time, since memory is permanent
          - Carefully and before shutdown, because memory is volatile and lost on reboot or power-off
          - Only after the system is powered down
          - Never
        answer: 1
        explanation: Volatile memory is lost at shutdown, so it must be acquired, carefully, while the system runs.
  - slug: linux-security-scripting
    title: Scripting Security Automation with Bash and Python
    order: 23
    difficulty: intermediate
    summary: Write small, safe scripts that automate routine security operations tasks, and weigh when automation helps and when it adds risk.
    theory_minutes: 12
    lab_minutes: 54
    objectives:
    - secplus:4.7
    - cysa:1.3
    learning_objectives:
    - Identify security operations tasks that are good candidates for scripting and orchestration
    - Write a Bash or Python script that calls an API, checks a control and raises a ticket
    - Weigh the benefits of automation against complexity, cost, technical debt and single points of failure
    theory: |
      Most of a security team's week is repetitive: checking that a control is still on, pulling the same
      context for every alert, creating and removing accounts, opening a ticket when something drifts. A short
      **script** turns each of those into a task that runs the same way every time. Security+ groups this under
      **automation and orchestration**: automation does one task without a person, and orchestration chains
      several automated tasks, often across tools, into a workflow such as a SOAR playbook or a CI pipeline.

      Good **use cases** share three traits: the task is frequent, well understood and low in judgement. The
      exam's list is a useful checklist. **User and resource provisioning** creates and, just as important,
      **deprovisions** accounts and access from the HR record, so leavers lose access on their last day.
      **Guard rails** stop an unsafe change before it lands, for example a pipeline check that rejects a public
      storage bucket. **Security groups** and firewall rules are applied from code rather than by hand.
      **Ticket creation** and **escalation** open a case with the evidence attached and route it by severity.
      **Enabling or disabling services and access** responds to an event, such as disabling a compromised
      account. **Continuous integration and testing** runs checks on every change, and **integrations and
      APIs** let one script talk to the identity provider, the SIEM and the ticketing system together.

      The **benefits** are efficiency and time saved, **enforced baselines** and standard configurations, secure
      scaling, better **employee retention** because skilled staff stop doing drudgery, faster **reaction
      time**, and acting as a **workforce multiplier**. The **considerations** are real too. Automation adds
      **complexity**, has a build and run **cost**, can become a **single point of failure** (one broken script
      silently stops deprovisioning for everyone), accrues **technical debt** when nobody maintains it, and
      needs ongoing **supportability**. So treat scripts like code: keep them in version control, run them with
      a least-privilege service identity, never hard-code secrets, log what they did, fail loudly rather than
      silently, and add a dry-run mode so a change can be previewed before it is applied.
    examples:
    - title: A guard-rail check in Bash
      body: |
        #!/usr/bin/env bash
        set -euo pipefail                      # stop on any error, unset variable or failed pipe
        # Flag world-writable files under /etc and open a ticket if any are found
        found=$(find /etc -xdev -type f -perm -0002 2>/dev/null || true)
        if [[ -n "$found" ]]; then
          echo "$found" > /tmp/ww_files.txt
          ./open_ticket.sh --severity medium --title "World-writable files in /etc" --attach /tmp/ww_files.txt
        fi
    - title: Deprovisioning from an HR export in Python (dry run first)
      body: |
        import csv, os, requests
        DRY_RUN = os.environ.get("DRY_RUN", "1") == "1"
        TOKEN = os.environ["IDP_TOKEN"]               # from the secrets manager, never in the file
        for row in csv.DictReader(open("leavers.csv")):
            user = row["upn"]
            if DRY_RUN:
                print(f"would disable {user}")
                continue
            r = requests.patch(f"https://idp.example/api/users/{user}",
                               json={"enabled": False},
                               headers={"Authorization": f"Bearer {TOKEN}"}, timeout=10)
            r.raise_for_status()                       # fail loudly, never silently
            print(f"disabled {user}")
    exercise:
      title: Automate a control check and its ticket
      environment: A Linux VM or WSL with Bash and Python 3; a local file standing in for an HR leaver export and a stub ticket script
      tools:
      - bash
      - python3
      - find
      - requests or curl
      - a text editor
      steps:
      - List five recurring tasks from a SOC or IT week and mark which are frequent, well understood and low in judgement.
      - Write a Bash script with set -euo pipefail that checks one control (for example world-writable files or an SSH setting) and exits non-zero on failure.
      - Extend it to call a stub ticket script with the evidence attached when the check fails.
      - Write a Python deprovisioning script that reads a leaver CSV and supports a DRY_RUN mode that only prints what it would do.
      - Move any credential into an environment variable and confirm the script refuses to run without it.
      - Add logging of every action with a timestamp so the run leaves an audit trail.
      - 'Write a short note on the risks of your automation: what happens if it fails silently, who maintains it, and what single point of failure it creates.'
      deliverable: Two working scripts (a control check with ticket creation and a dry-run deprovisioning script) plus a one-page note on use cases, benefits and the risks you mitigated.
    expected_outcome: |
      You can pick security tasks that suit automation, write small Bash and Python scripts that check a control,
      call an API and raise a ticket safely, and explain the benefits and the costs of automation and
      orchestration in the terms Security+ uses.
    quiz:
    - prompt: Which task is the best first candidate for automation?
      options:
      - Deciding whether a novel alert is a true positive
      - Disabling accounts for leavers listed in the daily HR export
      - Negotiating a vendor contract
      - Writing the incident report narrative
      answer: 1
      explanation: Deprovisioning from an authoritative feed is frequent, well understood and low in judgement.
    - prompt: A pipeline check that rejects a change creating a public storage bucket is an example of a
      options:
      - Guard rail
      - Compensating control
      - Honeypot
      - Tabletop exercise
      answer: 0
      explanation: Guard rails stop unsafe changes automatically before they land.
    - prompt: One deprovisioning script failed silently for three weeks and leavers kept access. Which automation consideration does this illustrate?
      options:
      - Workforce multiplier
      - Employee retention
      - Single point of failure
      - Enforced baselines
      answer: 2
      explanation: When one automated process carries a control, its failure removes the control everywhere.
    - prompt: Where should an automation script get its API token from?
      options:
      - Hard-coded in the script so it always works
      - A comment at the top of the file
      - A secrets manager or environment variable at run time, with least-privilege scope
      - The analyst's personal account
      answer: 2
      explanation: Secrets stay out of code, and the script runs with a scoped service identity.
