slug: lab-linux-ssh-bruteforce
lesson: linux-auth-logs
title: Prove whether an SSH brute force succeeded
pass_mark: 80
scenario: |
  Overnight the internet-facing server **web02** showed a spike of SSH traffic. You have its
  `/var/log/auth.log` for the window. Two outside addresses were guessing passwords; your job is
  to find the serious one, prove whether it got in, and say what it did.

  Download `auth.log` and use the pipelines from the lesson, for example
  `grep "Failed password" auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr`.
