tasks:
- prompt: Which source IP made the most failed password attempts?
  type: text
  accepted:
  - 185.220.101.33
  hint: Count 'Failed password' lines per 'from <ip>' value.
  explanation: 185.220.101.33 made 34 failed attempts, far more than the other source.
  verify:
    artifact: auth.log
    op: top
    pattern: Failed password for (?:invalid user )?\S+ from (\S+)
- prompt: How many failed password attempts did that IP make?
  type: number
  accepted:
  - '34'
  hint: grep for 'Failed password' and the IP, then count lines with wc -l. Count each Failed line once; 'Invalid
    user' lines are separate notices.
  explanation: There are 34 'Failed password' lines from the attacker. The 'Invalid user' lines are extra notices
    for accounts that do not exist, not extra attempts.
  verify:
    artifact: auth.log
    op: count
    pattern: 'Failed password for .* from 185\.220\.101\.33 '
- prompt: How many different usernames did that IP try?
  type: number
  accepted:
  - '6'
  hint: Pull out the username from each failed line (watch for the extra words 'invalid user') and count the unique
    values.
  explanation: It tried root, admin, test, oracle, ubuntu and backup. Mixing real and non-existent accounts is typical
    of a wordlist attack.
  verify:
    artifact: auth.log
    op: distinct_count
    pattern: Failed password for (?:invalid user )?(\S+) from 185\.220\.101\.33
- prompt: Which account did the attacker successfully log in to?
  type: text
  accepted:
  - backup
  hint: Look for an 'Accepted' line from the attacker's IP.
  explanation: '''Accepted password for backup'' from the attacker''s IP means the brute force succeeded. The deploy
    logon used a key from an internal address and is legitimate.'
  verify:
    artifact: auth.log
    op: set
    pattern: Accepted password for (\S+) from 185\.220\.101\.33
- prompt: What full command did the attacker run through sudo to read sensitive data?
  type: text
  accepted:
  - /usr/bin/cat /etc/shadow
  - cat /etc/shadow
  hint: sudo logs every command it runs with COMMAND=.
  explanation: They read /etc/shadow, the password hash file, which means every local password should be treated
    as exposed. It also shows the backup account could use sudo, which it should not.
  verify:
    artifact: auth.log
    op: last
    pattern: 'sudo: +backup : .*COMMAND=(.+)$'
- prompt: What is the best immediate response?
  type: choice
  options:
  - Block 185.220.101.33 at the firewall and close the ticket
  - 'Treat web02 as compromised: isolate it, lock the backup account, rotate local passwords and disable SSH password
    logins'
  - Install fail2ban so it does not happen again
  - Reboot web02 to end the attacker's session
  answer: 1
  hint: The attacker logged in and gained root. What does that mean for the host?
  explanation: A successful logon followed by root access means the host is compromised. Isolate it (without rebooting,
    so evidence survives), lock the account, rotate credentials and move to key-only SSH. Blocking one IP or adding
    fail2ban alone leaves the intruder's access in place.
