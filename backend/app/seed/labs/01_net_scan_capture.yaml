slug: lab-net-scan-capture
lesson: net-traffic-analysis
title: Investigate a port scan in a packet capture
pass_mark: 80
scenario: |
  The IDS raised "TCP port sweep" against the public web server **10.0.5.20**. The network team
  exported the relevant packets as a text summary (the same columns Wireshark and `tshark` print).

  Work out who scanned the server, how thoroughly, what they found, and what they did next. Read
  the capture in the app or download `capture.txt` and work on it with `grep`, `awk` or
  Wireshark-style filtering in your head: `[SYN]` alone is a connection request, `[SYN, ACK]` is
  an open port answering, and `[RST, ACK]` is a closed port refusing.
