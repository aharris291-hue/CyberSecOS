tasks:
- prompt: Which IP address scanned the web server?
  type: text
  accepted:
  - 203.0.113.45
  hint: Count the bare [SYN] packets per source address. Normal clients send one per connection.
  explanation: 203.0.113.45 sent a burst of SYNs to many different ports in under a second, the signature of a scan;
    each internal client only opened one HTTPS connection.
  verify:
    artifact: capture.txt
    op: top
    pattern: ^\s*\d+\s+\S+\s+(\S+)\s+\S+\s+TCP\s+\d+\s+\d+ → \d+ \[SYN\]
- prompt: How many different destination ports did the scanner probe (including any it came back to later)?
  type: number
  accepted:
  - '16'
  hint: Filter to [SYN] packets from the scanner to 10.0.5.20 and count the unique destination ports after the arrow.
  explanation: The scanner probed 16 well-known ports, from FTP (21) to 8080. Port 80 appears twice because the
    attacker came back to it after the scan, but it is one port.
  verify:
    artifact: capture.txt
    op: distinct_count
    pattern: 203\.0\.113\.45\s+10\.0\.5\.20\s+TCP\s+\d+\s+\d+ → (\d+) \[SYN\]
- prompt: Which ports on the web server are open? List them separated by commas.
  type: set
  accepted:
  - 22, 80, 443
  hint: An open port answers a SYN with [SYN, ACK]; a closed port answers with [RST, ACK]. Look at replies from
    10.0.5.20 to the scanner.
  explanation: Only 22 (SSH), 80 (HTTP) and 443 (HTTPS) answered with SYN-ACK. Every other probe got RST-ACK, so
    those ports are closed. SSH being reachable from the internet is worth raising with the server owner.
  verify:
    artifact: capture.txt
    op: set
    pattern: 10\.0\.5\.20\s+203\.0\.113\.45\s+TCP\s+\d+\s+(\d+) → \d+ \[SYN, ACK\]
- prompt: After the scan, which URL path did the attacker request on the web server?
  type: text
  accepted:
  - /admin/login.php
  hint: Look for HTTP packets from the scanner after the last probe.
  explanation: The attacker went straight to /admin/login.php and then POSTed to it, a login attempt that the server
    refused with 401. The scan was reconnaissance for this.
  verify:
    artifact: capture.txt
    op: first
    pattern: 203\.0\.113\.45\s+10\.0\.5\.20\s+HTTP\s+\d+\s+GET (\S+)
- prompt: What kind of scan is this?
  type: choice
  options:
  - A full TCP connect scan, because every open port completed the three-way handshake
  - A SYN (half-open) scan, because the scanner reset each open port instead of completing the handshake
  - A UDP scan, because no data was sent to the closed ports
  - A ping sweep, because it only checked whether the host was alive
  answer: 1
  hint: Look at what the scanner sent after an open port replied with SYN-ACK.
  explanation: After each SYN-ACK the scanner sent RST rather than ACK, so the handshake never completed. That is
    a SYN (half-open) scan, the default for `nmap -sS`, and the tiny window size of 1024 is another Nmap tell.
