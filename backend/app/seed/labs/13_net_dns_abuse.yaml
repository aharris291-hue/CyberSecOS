tasks:
- prompt: Which host is tunnelling data out over DNS?
  type: text
  accepted:
  - 10.2.3.44
  hint: Look for one client sending many long, random-looking subdomains under the same parent domain.
  explanation: 10.2.3.44 sent a steady stream of 52-character encoded labels, numbered in sequence, under one zone.
    That is data being chunked into queries.
  verify:
    artifact: dns.log
    op: set
    pattern: ^\d+\t(\S+)\t\S+\.t\.exfil-cdn\.example\t
- prompt: Which parent domain receives the tunnelled data?
  type: text
  accepted:
  - exfil-cdn.example
  - t.exfil-cdn.example
  hint: Strip the random label and sequence number from the front of those queries.
  explanation: Every tunnel query ends in t.exfil-cdn.example. The attacker runs the authoritative server for that
    zone, so each query delivers a chunk to them. Block and sinkhole the domain.
  verify:
    artifact: dns.log
    op: set
    pattern: \.\d{3}\.(t\.exfil-cdn\.example)\t
- prompt: Which DNS record type does the tunnel use?
  type: text
  accepted:
  - TXT
  hint: Check the qtype_name column for the tunnel queries.
  explanation: TXT records can carry arbitrary text back in the answer, which makes them the favourite for two-way
    DNS tunnels. A workstation making dozens of TXT lookups is unusual on its own.
  verify:
    artifact: dns.log
    op: set
    pattern: \.t\.exfil-cdn\.example\t(\S+)\t
- prompt: Which host shows domain generation algorithm (DGA) behaviour?
  type: text
  accepted:
  - 10.2.3.71
  hint: Count NXDOMAIN responses per client.
  explanation: 10.2.3.71 tried dozens of random consonant-heavy names that do not exist and then got an answer for
    one. That is a DGA finding its live C2 domain.
  verify:
    artifact: dns.log
    op: top
    pattern: ^\d+\t(\S+)\t\S+\t\S+\tNXDOMAIN$
- prompt: How many NXDOMAIN responses did that host receive?
  type: number
  accepted:
  - '31'
  hint: Filter to that client and rcode NXDOMAIN, then count.
  explanation: 31 failed lookups in about fifteen minutes. A normal workstation sees a handful a day; dozens of
    random names in a burst is the DGA signature.
  verify:
    artifact: dns.log
    op: count
    pattern: ^\d+\t10\.2\.3\.71\t\S+\t\S+\tNXDOMAIN$
- prompt: Which generated domain finally resolved, and so is the likely C2 server?
  type: text
  accepted:
  - qmvtrsxlpakwe.net
  hint: Look for the one random-looking name from that host that returned NOERROR.
  explanation: qmvtrsxlpakwe.net resolved. Block it, then search proxy and firewall logs for anything connecting
    to the address it returned.
  verify:
    artifact: dns.log
    op: set
    pattern: ^\d+\t10\.2\.3\.71\t(\S+)\t\S+\tNOERROR$
