slug: lab-net-dns-abuse
lesson: net-dns-abuse
title: Spot DNS tunnelling and a DGA in resolver logs
pass_mark: 80
scenario: |
  The internal resolver's query log for half an hour on the user subnet has been exported
  (Zeek dns.log fields, tab-separated). Two different problems are hiding in it: one host is
  moving data out through DNS queries, and another is cycling through machine-generated domain
  names looking for its command-and-control server.

  Use the lesson's signals: query length and shape, record type, one parent domain receiving
  many unique subdomains, and the NXDOMAIN rate per host. One host also has a few NXDOMAINs for
  a decommissioned intranet name; that is housekeeping, not malware.
