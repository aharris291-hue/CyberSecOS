tasks:
- prompt: Which user uploaded the most data to an uncategorised destination?
  type: text
  accepted:
  - c.ruiz
  hint: Filter category to uncategorized and sum bytes_out by user.
  explanation: c.ruiz is the only user posting to an uncategorised site, and in large chunks. That matches the HR
    report, but it is still a lead to confirm, not a conclusion.
  verify:
    artifact: proxy.csv
    op: set
    pattern: ^[^,]+,([^,]+),[^,]+,[^,]+,[^,]+,[^,]+,[^,]+,uncategorized$
- prompt: To which destination did the data go?
  type: text
  accepted:
  - drop.files-share.example
  hint: The destination column of those uploads.
  explanation: drop.files-share.example, a personal file-drop service outside the company's sanctioned SharePoint.
    Data-loss controls usually block uncategorised upload sites for this reason.
  verify:
    artifact: proxy.csv
    op: set
    pattern: ',c\.ruiz,[^,]+,([^,]+),POST,\d+,\d+,uncategorized$'
- prompt: About how many megabytes were uploaded there in total?
  type: number
  accepted:
  - '396'
  tolerance: 2
  hint: Add up bytes_out for those requests and divide by 1,000,000.
  explanation: About 396 MB in eight uploads of roughly 50 MB each, all within fifteen minutes. Splitting data into
    similar-sized chunks is common to get under upload size limits.
- prompt: How many upload requests went to that destination?
  type: number
  accepted:
  - '8'
  hint: Count rows for that destination.
  explanation: 8 POST requests, one after another, from WS-31.
  verify:
    artifact: proxy.csv
    op: count
    pattern: ',drop\.files-share\.example,'
- prompt: BKP-01 uploaded far more data. Why is it not the finding?
  type: choice
  options:
  - Because PUT requests cannot carry data
  - Because it is a service account to the contracted, sanctioned backup vendor on its normal schedule, which matches
    its baseline
  - Because servers cannot exfiltrate data
  - Because the bytes_in value is small
  answer: 1
  hint: Exfiltration hunting compares against what is normal for that source and destination.
  explanation: Volume alone is not the signal; deviation from baseline is. The backup server sends a similar volume
    to the same sanctioned vendor every night. Still, confirm the vendor and account periodically, because attackers
    do use backup channels.
