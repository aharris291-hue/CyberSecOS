slug: lab-hunt-data-exfiltration
lesson: hunt-data-exfiltration
title: Hunt for data exfiltration in proxy logs
pass_mark: 80
scenario: |
  HR has told security that an engineer who resigned yesterday was seen copying files. Your
  hypothesis: if data left, it left over the web. You have a day of web proxy logs for the
  engineering floor and the backup server.

  Look at what goes **out** (`bytes_out`), not what comes in, and at where it goes: sanctioned
  services, or somewhere uncategorised. Large nightly uploads from the backup server to its
  contracted vendor are expected. Sizes are in bytes; 1 MB = 1,000,000 bytes here.
