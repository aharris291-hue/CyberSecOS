slug: lab-sec-phishing-headers
lesson: sec-phishing-social-engineering
title: Analyse a reported phishing email
pass_mark: 80
scenario: |
  Dana in Finance pressed "Report phishing" on an email that claims to be from their bank. The
  mail gateway saved the raw message with full headers as `message.eml`.

  Read the headers from the bottom up (the lowest `Received:` line is the first hop), check the
  authentication results, and compare what the link *shows* with where it *goes*. All domains in
  this lab are reserved `.example` names, so nothing in it is live.
artifacts:
- name: message.eml
  kind: email
  description: The reported message, raw headers and HTML body.
  content: |
    Return-Path: <billing@northwlnd-secure.example>
    Received: from mx1.contoso.example (mx1.contoso.example [10.10.0.25])
            by mbx03.contoso.example with ESMTPS id 4Rk9Tq2vJz
            for <dana.lee@contoso.example>; Tue, 10 Mar 2026 08:41:19 +0000
    Received: from relay.bulkmail-host.example (relay.bulkmail-host.example [192.0.2.140])
            by mx1.contoso.example with ESMTP id 8f2c1a
            for <dana.lee@contoso.example>; Tue, 10 Mar 2026 08:41:17 +0000
    Received: from desktop-7h2k (unknown [198.51.100.77])
            by relay.bulkmail-host.example with ESMTPSA id 77b0e1
            for <dana.lee@contoso.example>; Tue, 10 Mar 2026 08:41:15 +0000
    Authentication-Results: mx1.contoso.example;
            spf=fail (sender IP is 192.0.2.140) smtp.mailfrom=northwlnd-secure.example;
            dkim=none (message not signed) header.d=none;
            dmarc=fail action=none header.from=northwind-bank.example
    Received-SPF: Fail (mx1.contoso.example: domain of northwlnd-secure.example does not
            designate 192.0.2.140 as permitted sender)
    From: "Northwind Bank Security" <security@northwind-bank.example>
    Reply-To: <account-review@northwind-helpdesk.example>
    To: <dana.lee@contoso.example>
    Subject: [Action Required] Unusual sign-in blocked - verify within 24 hours
    Date: Tue, 10 Mar 2026 08:41:12 +0000
    Message-ID: <20260310084112.5521@desktop-7h2k>
    MIME-Version: 1.0
    Content-Type: text/html; charset="UTF-8"
    X-Mailer: PHPMailer 6.8.1

    <html><body>
    <p>Dear Customer,</p>
    <p>We blocked an unusual sign-in to your Northwind Bank account from a new device.
    If this was not you, your account will be <b>suspended in 24 hours</b>.</p>
    <p><a href="http://northwind-bank.account-verify.example/session/login?id=dana.lee">https://www.northwind-bank.example/secure/verify</a></p>
    <p>Northwind Bank Security Team</p>
    </body></html>
tasks:
- prompt: What was the SPF result for this message (one word)?
  type: text
  accepted:
  - fail
  hint: Find the Authentication-Results header added by the receiving gateway.
  explanation: 'spf=fail: the server that delivered the message (192.0.2.140) is not allowed to send for the envelope
    domain northwlnd-secure.example. DKIM is absent and DMARC fails as well.'
  verify:
    artifact: message.eml
    op: set
    pattern: spf=(\w+)
- prompt: What is the IP address of the machine that originally sent the message (the first hop)?
  type: text
  accepted:
  - 198.51.100.77
  hint: Received headers are added top-down by each server, so the oldest hop is the lowest Received line.
  explanation: The bottom Received header shows the message being submitted from desktop-7h2k at 198.51.100.77 to
    a bulk-mail relay. Upper hops are the relay and your own gateway.
  verify:
    artifact: message.eml
    op: last
    pattern: '^Received: from \S+ \(\S+ \[(\d+\.\d+\.\d+\.\d+)\]\)'
- prompt: Replies to this email would go to which domain?
  type: text
  accepted:
  - northwind-helpdesk.example
  hint: The From header is what the user sees; the Reply-To header decides where a reply goes.
  explanation: Reply-To points at northwind-helpdesk.example, a different domain from the bank's own, so anyone
    who replies talks to the attacker.
  verify:
    artifact: message.eml
    op: set
    pattern: '^Reply-To: <[^@]+@([^>]+)>'
- prompt: The link text shows www.northwind-bank.example. Which hostname does the link really open?
  type: text
  accepted:
  - northwind-bank.account-verify.example
  hint: Compare the href attribute of the anchor tag with the visible text between the tags.
  explanation: 'The href goes to northwind-bank.account-verify.example: the registered domain is account-verify.example
    and ''northwind-bank'' is just a subdomain chosen to look familiar. It also uses plain http.'
  verify:
    artifact: message.eml
    op: set
    pattern: href="https?://([^/"]+)
- prompt: What is the right verdict and response?
  type: choice
  options:
  - 'Legitimate: the From address is the bank''s real domain, so close the report'
  - 'Spam: it is unwanted marketing, so just let the user delete it'
  - 'Phishing: block the sending and link domains, purge the message from every mailbox and check who clicked'
  - 'Phishing: reply to the sender asking them to stop'
  answer: 2
  hint: Weigh the failed authentication, the mismatched Reply-To and the disguised link together.
  explanation: 'SPF and DMARC fail, the Reply-To and link go to unrelated domains and the message uses urgency.
    It is credential phishing: block the indicators, purge copies from other mailboxes and check proxy logs for
    anyone who visited the link.'
