tasks:
- prompt: Which source IP performed the horizontal scan?
  type: text
  accepted:
  - 10.30.5.23
  hint: Count distinct destination hosts per source on one port, looking at one-packet flows.
  explanation: '10.30.5.23 sent single-packet flows to forty consecutive workstation addresses on 445 in a few seconds:
    a sweep for SMB.'
  verify:
    artifact: netflow.csv
    op: top
    pattern: ^[^,]+,(10\.30\.5\.\d+),\d+,10\.30\.5\.\d+,445,TCP,1,
- prompt: Which destination port was scanned?
  type: number
  accepted:
  - '445'
  hint: All the one-packet flows share one destination port.
  explanation: TCP 445, SMB. Attackers sweep for it because SMB carries file shares, remote service creation and
    many lateral-movement tools.
  verify:
    artifact: netflow.csv
    op: set
    pattern: ',10\.30\.5\.23,\d+,10\.30\.5\.\d+,(\d+),TCP,1,'
- prompt: How many hosts did the scan probe?
  type: number
  accepted:
  - '40'
  hint: Count distinct destinations in the one-packet flows from the scanner.
  explanation: Forty addresses, 10.30.5.101 to 10.30.5.140.
  verify:
    artifact: netflow.csv
    op: distinct_count
    pattern: ',10\.30\.5\.23,\d+,(10\.30\.5\.\d+),445,TCP,1,'
- prompt: After the scan, which hosts did the scanner open real sessions to? List them separated by commas.
  type: set
  accepted:
  - 10.30.5.104, 10.30.5.117, 10.30.5.133
  hint: Look for flows from the scanner with many packets and kilobytes of data.
  explanation: Three workstations got full SMB sessions plus RPC (135) traffic shortly after the sweep, the shape
    of remote execution with tools like PsExec or WMI. Check those hosts for new services and logons.
  verify:
    artifact: netflow.csv
    op: set
    pattern: ',10\.30\.5\.23,\d+,(10\.30\.5\.\d+),135,'
- prompt: Why is NetFlow enough to see this, even without packet capture?
  type: choice
  options:
  - NetFlow records the full content of each SMB session
  - Who talked to whom, on which port, how many packets and bytes is enough to see fan-out and session size, without
    the payload
  - NetFlow decrypts SMB traffic
  - It is not enough; only full packet capture shows scanning
  answer: 1
  hint: What fields does each row have, and what pattern did you use?
  explanation: Flow metadata shows the fan-out (one to many on one port) and the jump from tiny probes to real sessions.
    That is why flow logs are kept far longer than full captures and are the first stop for east-west hunting.
