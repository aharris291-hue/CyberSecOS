slug: lab-net-flow-scanning
lesson: net-flow-lateral-movement
title: Find an internal scan and lateral movement in NetFlow
pass_mark: 80
scenario: |
  A workstation subnet (10.30.5.0/24) should talk to the server VLAN (10.30.0.0/24) and the
  internet, almost never to other workstations. You have an hour of NetFlow records from the
  core switch, one flow per row.

  Look for a **horizontal scan** (one source touching many hosts on the same port, each flow a
  single tiny packet), then for what the scanner did next: real sessions to a few of the hosts
  it found, on the ports Windows uses for remote administration.
artifacts:
- name: netflow.csv
  kind: csv
  description: NetFlow v9 records from the core switch (UTC).
