slug: lab-linux-privesc-review
lesson: linux-privilege-escalation
title: Find the privilege-escalation path on a web server
pass_mark: 80
scenario: |
  After a key for the `webdev` account leaked in a public repository, someone logged in to
  **app03** at 2 a.m. from an unfamiliar address. You have three pieces of evidence: the
  SUID binaries on the host, what `webdev` may run through sudo, and the auth log.

  Work out how an unprivileged web developer account became root, what the intruder did with
  it, and what else on the host could be abused the same way. GTFOBins-style thinking helps:
  which allowed programs can run other programs?
artifacts:
- name: suid_binaries.txt
  kind: text
  description: SUID files found on app03.
  content: |
    $ find / -perm -4000 -type f 2>/dev/null
    /usr/bin/passwd
    /usr/bin/sudo
    /usr/bin/su
    /usr/bin/mount
    /usr/bin/umount
    /usr/bin/chsh
    /usr/bin/chfn
    /usr/bin/newgrp
    /usr/bin/gpasswd
    /usr/bin/pkexec
    /usr/bin/python3.10
    /usr/lib/openssh/ssh-keysign
    /usr/lib/dbus-1.0/dbus-daemon-launch-helper
    /opt/backup/backup_tool
- name: sudo_rules.txt
  kind: text
  description: sudo -l output for webdev.
  content: |
    $ sudo -l -U webdev
    Matching Defaults entries for webdev on app03:
        env_reset, mail_badpass, secure_path=/usr/local/sbin\:/usr/local/bin\:/usr/sbin\:/usr/bin\:/sbin\:/bin

    User webdev may run the following commands on app03:
        (root) NOPASSWD: /usr/bin/systemctl restart nginx
        (root) NOPASSWD: /usr/bin/find /var/www -name *.log
        (root) NOPASSWD: /usr/bin/tail -f /var/log/nginx/error.log
- name: auth.log
  kind: log
  description: auth.log entries for the window.
  content: |
    Sep 12 22:14:03 app03 sshd[4410]: Accepted publickey for webdev from 10.4.0.12 port 50110 ssh2
    Sep 12 22:14:40 app03 sudo:   webdev : TTY=pts/0 ; PWD=/home/webdev ; USER=root ; COMMAND=/usr/bin/systemctl restart nginx
    Sep 12 22:31:17 app03 sudo:   webdev : TTY=pts/0 ; PWD=/home/webdev ; USER=root ; COMMAND=/usr/bin/tail -f /var/log/nginx/error.log
    Sep 13 02:06:55 app03 sshd[5121]: Accepted publickey for webdev from 198.51.100.61 port 41022 ssh2
    Sep 13 02:07:31 app03 sudo:   webdev : TTY=pts/1 ; PWD=/tmp ; USER=root ; COMMAND=/usr/bin/find /var/www -name *.log -exec /bin/bash -p ;
    Sep 13 02:07:31 app03 sudo: pam_unix(sudo:session): session opened for user root(uid=0) by webdev(uid=1002)
    Sep 13 02:08:12 app03 useradd[5188]: new user: name=sysupdate, UID=0, GID=0, home=/root, shell=/bin/bash
    Sep 13 02:08:40 app03 sshd[5121]: Received disconnect from 198.51.100.61 port 41022:11: disconnected by user
tasks:
- prompt: Which allowed sudo program did the intruder abuse to get a root shell? Give its full path.
  type: text
  accepted:
  - /usr/bin/find
  hint: Compare the sudo rules with what was actually run at 02:07.
  explanation: /usr/bin/find. The rule allows `find /var/www -name *.log` but sudo's wildcard lets extra arguments
    through, and find's -exec runs any command, here a root bash shell.
  verify:
    artifact: auth.log
    op: set
    pattern: '02:07:\d+ app03 sudo: +webdev : .*COMMAND=(\S+)'
- prompt: What source IP did the intruder log in from?
  type: text
  accepted:
  - 198.51.100.61
  hint: webdev's earlier logon came from the internal admin network.
  explanation: 198.51.100.61, outside the company. The key was valid, so sshd accepted it; only the source and the
    hour gave it away.
  verify:
    artifact: auth.log
    op: set
    pattern: 02:06:\d+ .*Accepted publickey for webdev from (\S+)
- prompt: What account did the intruder create for persistence?
  type: text
  accepted:
  - sysupdate
  hint: Look for useradd.
  explanation: sysupdate, created with UID 0, making it a second root account. Any account with UID 0 other than
    root is a red flag in /etc/passwd.
  verify:
    artifact: auth.log
    op: set
    pattern: 'new user: name=([^,]+), UID=0'
- prompt: Two SUID binaries do not belong on a standard Ubuntu server. List them separated by commas.
  type: set
  accepted:
  - /usr/bin/python3.10, /opt/backup/backup_tool
  hint: The rest are the normal SUID set (passwd, sudo, su, mount and friends). Look for an interpreter and something
    under /opt.
  explanation: A SUID Python interpreter is an instant root shell for anyone (`python3 -c 'import os; os.setuid(0);
    os.system("/bin/sh")'`). /opt/backup/backup_tool is a custom SUID binary that needs review. Both are escalation
    paths the intruder did not even need.
- prompt: Which fix closes the path the intruder used?
  type: choice
  options:
  - Remove the find rule from sudoers (or replace it with a fixed wrapper script owned by root) and keep sudo rules
    to programs that cannot spawn commands
  - Change webdev's password
  - Move find to a different directory
  - Add webdev to the sudo group so the rules are simpler
  answer: 0
  hint: The weakness is what the sudo rule allows, not the account's password.
  explanation: Sudo rules for programs that can run other programs (find, vim, less, tar, awk...) are equivalent
    to full root. Remove them or wrap the one allowed action in a root-owned script. The leaked key must also be
    revoked and the sysupdate account removed.
