slug: lab-vm-web-attack-log
lesson: vm-web-application-scanning
title: Confirm a SQL injection from web server logs
pass_mark: 80
scenario: |
  A vulnerability scan flagged the shop's `id` parameter as "possibly injectable". Before the
  developers are paged at night, the security lead wants evidence: has anyone actually
  exploited it? You have the web server's access log (combined log format) for the hour.

  Read the requests (URL-decode them: `%20` is a space, `%27` or `'` a quote, `%2f` a slash),
  the status codes and the response sizes. A response far larger than normal for that page is
  a strong hint that data came back.
