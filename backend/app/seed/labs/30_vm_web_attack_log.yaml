tasks:
- prompt: Which IP address was attacking the site?
  type: text
  accepted:
  - 203.0.113.57
  hint: Look for requests with SQL keywords, ../ sequences or script tags.
  explanation: 203.0.113.57, using sqlmap (its user agent says so). Attackers can change the user agent, but here
    it confirms automated testing.
  verify:
    artifact: access.log
    op: set
    pattern: ^(\S+) .*"sqlmap
- prompt: Which query parameter was injected with SQL?
  type: text
  accepted:
  - id
  hint: Which parameter carries OR 1=1 and UNION SELECT?
  explanation: id on /products, the parameter the scanner flagged.
  verify:
    artifact: access.log
    op: set
    pattern: \?(\w+)=12%20UNION
- prompt: Did the injection succeed? Give the HTTP status code of the UNION request that pulled user data.
  type: number
  accepted:
  - '200'
  hint: Find the request selecting username and password_hash and read its status and size.
  explanation: 200 with a 15,880-byte response, several times a normal product page. The query returned rows from
    the users table, so treat the password hashes as stolen.
  verify:
    artifact: access.log
    op: set
    pattern: 'password_hash%20FROM%20users-- HTTP/1\.1" (\d+) '
- prompt: How many path-traversal attempts were blocked?
  type: number
  accepted:
  - '2'
  hint: Count requests containing ../ or ..%2f that got 403.
  explanation: Two, both refused with 403, so the download endpoint's input filtering (or the WAF) held. Still log
    it as attempted.
  verify:
    artifact: access.log
    op: count
    pattern: '(?:\.\./|\.\.%2f).*" 403 '
- prompt: What is the correct fix for the injection?
  type: choice
  options:
  - Block the attacker's IP
  - Rewrite the query with parameterised statements (prepared statements), then rescan and review what the users
    table exposed
  - Filter the word UNION from the id parameter
  - Hide database errors so the attacker cannot see them
  answer: 1
  hint: Fix the cause, not the symptom.
  explanation: Parameterised queries make the input data, never SQL, which fixes the whole class of bug. Blocklists
    and hidden errors are easily bypassed, and blocking one IP does nothing about the next attacker. Then reset
    the exposed passwords.
