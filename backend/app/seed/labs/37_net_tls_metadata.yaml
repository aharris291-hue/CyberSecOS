tasks:
- prompt: Which internal host made the suspicious TLS connections?
  type: text
  accepted:
  - 10.40.1.66
  hint: Look for connections with no server name in the SNI column.
  explanation: 10.40.1.66 is the only client that connects without SNI, to a self-signed certificate, with a fingerprint
    no other host uses.
  verify:
    artifact: tls_handshakes.txt
    op: set
    pattern: ^[^|]+\|([^|]+)\|[^|]+\|-\|
- prompt: Which external server IP did it connect to?
  type: text
  accepted:
  - 203.0.113.45
  hint: Read the server_ip of the same rows.
  explanation: 203.0.113.45. Check other hosts' flow and DNS logs for it, and block it at the egress firewall.
  verify:
    artifact: tls_handshakes.txt
    op: set
    pattern: ^[^|]+\|10\.40\.1\.66\|([^|]+)\|
- prompt: How many TLS connections had no SNI?
  type: number
  accepted:
  - '12'
  hint: Count rows where the sni column is a dash.
  explanation: 'Twelve, about five minutes apart: regular, automated check-ins rather than a person browsing.'
  verify:
    artifact: tls_handshakes.txt
    op: count
    pattern: ^[^|]+\|[^|]+\|[^|]+\|-\|
- prompt: What is the JA3 fingerprint of the suspicious client?
  type: text
  accepted:
  - 72a589da586844d7f0818ce684948eea
  hint: It is the JA3 value on those rows, and it appears nowhere else in the log.
  explanation: A JA3 hash describes how the client builds its TLS hello. One that no browser on the estate produces
    points to a custom tool or malware implant, and it can be searched for across every sensor.
  verify:
    artifact: tls_handshakes.txt
    op: set
    pattern: \|10\.40\.1\.66\|[^|]+\|[^|]+\|([0-9a-f]{32})\|
- prompt: What makes the server's certificate suspicious?
  type: choice
  options:
  - It uses RSA
  - The issuer and subject are the same (it is self-signed, CN=localhost) and it is valid for ten years, unlike
    the public sites
  - It was issued by Let's Encrypt
  - Its validity period is 90 days
  answer: 1
  hint: Compare the issuer and subject columns, and the validity, with the other servers.
  explanation: Public sites present certificates from a public CA with validity of about a year or less. A self-signed
    localhost certificate with a ten-year life is the default of many attacker frameworks.
- prompt: Why is handshake metadata enough to raise this as an incident?
  type: choice
  options:
  - It is not; only decrypted content proves anything
  - Several independent signals agree (no SNI, rare JA3, self-signed long-lived cert, regular timing), which together
    make benign browsing very unlikely
  - Because any traffic to port 443 is suspicious
  - Because the server IP is in the documentation range
  answer: 1
  hint: How many separate anomalies did you find?
  explanation: Encrypted-traffic analysis relies on stacking weak signals. Each on its own has benign explanations,
    but together they justify isolating 10.40.1.66 and collecting its process telemetry.
