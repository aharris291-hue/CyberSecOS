slug: lab-net-tls-metadata
lesson: net-encrypted-traffic
title: Find a malicious TLS session without decrypting it
pass_mark: 80
scenario: |
  Almost all outbound traffic is encrypted, so the SOC cannot read the payloads. The network
  sensor still records the TLS handshake metadata: the server name the client asked for (SNI),
  the client's JA3 fingerprint, and the certificate the server presented.

  You have an hour of handshake records from the office subnet. Find the session that does not
  look like normal browsing. Things to weigh: a missing SNI, a client fingerprint no browser
  uses, a certificate that the server signed itself, and an unusually long validity period.
