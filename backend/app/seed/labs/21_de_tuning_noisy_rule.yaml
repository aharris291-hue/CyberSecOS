slug: lab-de-tuning-noisy-rule
lesson: de-tuning-false-positives
title: Tune a noisy scheduled-task detection
pass_mark: 80
scenario: |
  The rule "Scheduled task created" fired 40 times last week and the SOC has started ignoring
  it, which is exactly how a real attack slips through. You have the week's alerts (pipe
  separated). Your job: find what makes the rule noisy, design an exclusion that removes the
  noise without blinding the rule, and make sure the one real attack in the week would still
  alert.

  A good exclusion is as **narrow** as possible: a specific parent process *and* a specific
  task, not a whole host, user or the rule itself.
