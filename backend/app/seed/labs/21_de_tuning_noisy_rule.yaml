tasks:
- prompt: Which parent process causes the most alerts? Give the file name.
  type: text
  accepted:
  - CcmExec.exe
  - C:\Windows\CCM\CcmExec.exe
  hint: Count alerts by parent_image.
  explanation: CcmExec.exe, the Configuration Manager (SCCM) client, re-creating its health-evaluation task across
    the fleet.
  verify:
    artifact: alerts.txt
    op: top
    pattern: ^[^|]+\|[^|]+\|[^|]+\|[^|]*\\([^\\|]+)\|
- prompt: What percentage of all alerts does that process account for?
  type: number
  accepted:
  - '85'
  tolerance: 1
  hint: Its alert count divided by the total, times 100.
  explanation: 34 of 40 alerts, 85%. One benign source producing most of a rule's volume is the classic tuning opportunity.
- prompt: Which host had the genuinely malicious task?
  type: text
  accepted:
  - WS-217
  hint: Look for a task launched by PowerShell that runs hidden code from a user profile.
  explanation: 'WS-217: a task named \Updater running hidden PowerShell that executes a script read from %APPDATA%.
    That is the alert the rule exists for.'
  verify:
    artifact: alerts.txt
    op: set
    pattern: ^[^|]+\|([^|]+)\|.*-w hidden
- prompt: Which exclusion should you add?
  type: choice
  options:
  - Exclude user SYSTEM
  - Exclude parent_image ending in \CCM\CcmExec.exe AND task_name equal to the Configuration Manager Health Evaluation
    task
  - Exclude every host whose name starts with WS-
  - Disable the rule
  answer: 1
  hint: Which option removes the SCCM noise and nothing else?
  explanation: Pairing the parent process with the exact task name removes the known-good behaviour only. Excluding
    SYSTEM would also hide attacker tasks created as SYSTEM, and excluding hosts or disabling the rule blinds you
    completely.
- prompt: With that exclusion in place, how many of last week's alerts would still fire?
  type: number
  accepted:
  - '6'
  hint: Count the alerts not raised by that parent process.
  explanation: 'Six: the three admin log-rotation tasks, the two patch-agent tasks (candidates for their own narrow
    exclusion after review) and the real attack. The rule drops from 40 to 6 alerts a week and still catches WS-217.'
  verify:
    artifact: alerts.txt
    op: count
    pattern: ^\d{4}-[^|]+\|[^|]+\|[^|]+\|(?![^|]*CcmExec\.exe)[^|]*\|
