tasks:
- prompt: Which customer account was enumerating invoices?
  type: text
  accepted:
  - cust-1043
  hint: Look for one caller requesting invoice IDs one after another, a second apart.
  explanation: 'cust-1043 requested every invoice from 7001 to 7040 in forty seconds: a script walking the ID space.'
  verify:
    artifact: api_gateway.log
    op: top
    pattern: '"token_sub": "([^"]+)"'
- prompt: How many distinct invoices did that account request?
  type: number
  accepted:
  - '40'
  hint: Distinct invoice IDs in its requests.
  explanation: Forty, every invoice in the system.
  verify:
    artifact: api_gateway.log
    op: distinct_count
    pattern: '"token_sub": "cust-1043", "method": "GET", "path": "/api/v1/invoices/(\d+)"'
- prompt: How many of those invoices belonged to other customers?
  type: number
  accepted:
  - '38'
  hint: Use invoice_owners.csv to remove the account's own invoices.
  explanation: '38 of 40 belong to someone else and every request returned 200: a data breach of other customers''
    invoices.'
- prompt: What is this vulnerability called?
  type: choice
  options:
  - SQL injection
  - Broken object-level authorization (BOLA, also called IDOR), the top risk in the OWASP API Security Top 10
  - Cross-site scripting
  - Broken TLS
  answer: 1
  hint: The caller is authenticated but can reach objects that are not theirs.
  explanation: Authentication works; per-object authorization is missing. The API trusts the ID in the URL.
- prompt: What is the correct architectural fix?
  type: choice
  options:
  - Make invoice IDs random so they are hard to guess
  - Check on every request, in the service, that the invoice's owner matches the token's subject, and return 404
    otherwise; add rate limits and alerting on enumeration as extra layers
  - Add a WAF rule blocking sequential IDs
  - Require customers to sign in again more often
  answer: 1
  hint: Fix the missing check where the data is fetched.
  explanation: Only an ownership check fixes BOLA. Random IDs, WAF rules and rate limits slow attackers down but
    leave every invoice readable by anyone who obtains an ID.
