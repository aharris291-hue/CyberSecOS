slug: lab-arch-api-authorization
lesson: arch-secure-applications-apis
title: Find broken object-level authorization in an API
pass_mark: 80
scenario: |
  The customer portal's API returns an invoice at `GET /api/v1/invoices/{id}`. The gateway
  checks that the caller has a valid token, but the architecture review asks whether anything
  checks that the invoice **belongs** to the caller.

  You have the API gateway log (one JSON object per line, `token_sub` is the authenticated
  customer) and the database's invoice ownership table.
