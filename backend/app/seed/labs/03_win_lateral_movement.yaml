tasks:
- prompt: Which account did the intruder use to log on to the servers?
  type: text
  accepted:
  - svc_backup
  hint: Look at the network (type 3) logons that land on each server seconds before a suspicious 7045.
  explanation: svc_backup, a service account, made network logons to three servers from a workstation, which a backup
    service account should never do. Its password needs resetting and its use reviewing.
  verify:
    artifact: security_events.csv
    op: set
    pattern: ',4624,([^,]+),3,10\.20\.1\.42,'
- prompt: From which IP address did the lateral movement come?
  type: text
  accepted:
  - 10.20.1.42
  hint: The SourceIp column of those svc_backup network logons.
  explanation: Every svc_backup logon came from 10.20.1.42, which belongs to none of the regular users' workstations.
    That machine is the likely first foothold and should be isolated.
  verify:
    artifact: security_events.csv
    op: set
    pattern: ',4624,svc_backup,3,([^,]+),'
- prompt: Which computers had the attacker's remote service installed? List them separated by commas.
  type: set
  accepted:
  - FS-01, SQL-02, DC-01
  hint: Filter EventID 7045 and leave out the install that belongs to the patching tool.
  explanation: PSEXESVC was installed on FS-01, SQL-02 and DC-01, each right after a svc_backup network logon. Reaching
    the domain controller makes this a high-severity incident.
  verify:
    artifact: security_events.csv
    op: set
    pattern: ^[^,]+,([^,]+),7045,[^,]*,[^,]*,[^,]*,PSEXESVC,
- prompt: What is the name of the service the attacker installed?
  type: text
  accepted:
  - PSEXESVC
  hint: The ServiceName column of the suspicious 7045 events.
  explanation: PSEXESVC is the service that Sysinternals PsExec (and tools copying it) drops on the target to run
    commands remotely. Admins use it too, so the account and source make the difference.
  verify:
    artifact: security_events.csv
    op: top
    pattern: ',7045,[^,]*,[^,]*,[^,]*,([^,]+),'
- prompt: How many failed logons (4625) came from the attacker's IP address?
  type: number
  accepted:
  - '4'
  hint: Count the 4625 rows whose SourceIp is the attacker's address.
  explanation: The attacker failed three times against DC-01 before moving on and once on SQL-02. A handful of failures
    from one source across several servers, then success, is typical of an intruder trying a stolen password.
  verify:
    artifact: security_events.csv
    op: count
    pattern: ',4625,[^,]*,3,10\.20\.1\.42,'
- prompt: What does logon type 3 tell you about these logons?
  type: choice
  options:
  - Someone sat at the server's keyboard
  - The logon came over the network, for example to a file share or a remote service
  - The logon used Remote Desktop
  - A scheduled task ran as the account
  answer: 1
  hint: Type 2 is interactive, type 10 is Remote Desktop.
  explanation: 'Type 3 is a network logon: SMB, a remote service such as PsExec, or other network authentication.
    It is why this pattern is the classic lateral-movement footprint.'
