slug: lab-win-lateral-movement
lesson: win-lateral-movement
title: Trace lateral movement through Windows Security logs
pass_mark: 80
scenario: |
  On a quiet morning the EDR flagged a remote service install on the database server **SQL-02**.
  You have a CSV export of the relevant Security and System events from the servers and
  workstations involved: 4624 (successful logon), 4625 (failed logon), 4634 (logoff) and 7045
  (a service was installed).

  Find the account and machine the intruder worked from, every server they reached, and the
  tool they used. One service install in the export is routine patching; rule it out rather
  than report it.
artifacts:
- name: security_events.csv
  kind: csv
  description: Windows Security (4624/4625/4634) and System (7045) events, UTC.
  content: |
