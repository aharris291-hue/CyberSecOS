tasks:
- prompt: Which IP address is spraying passwords?
  type: text
  accepted:
  - 203.0.113.99
  hint: where ResultType == 50126 | summarize count() by IPAddress
  explanation: 203.0.113.99 produced almost all the failures. The scattered failures from 192.0.2.x are ordinary
    typos from the office.
  verify:
    artifact: signin_logs.csv
    op: top
    pattern: ^[^,]+,[^,]+,([^,]+),[^,]+,50126,
- prompt: How many different accounts did that IP try?
  type: number
  accepted:
  - '14'
  hint: where IPAddress == "…" | summarize dcount(UserPrincipalName)
  explanation: 14 accounts, each tried once or twice. Many users with few attempts each is what separates a spray
    from a brute force, and why per-account lockout does not stop it.
  verify:
    artifact: signin_logs.csv
    op: distinct_count
    pattern: ^[^,]+,([^,]+),203\.0\.113\.99,
- prompt: Which account did the sprayer successfully sign in to?
  type: text
  accepted:
  - e.fox@contoso.example
  hint: Filter that IP to ResultType 0.
  explanation: 'e.fox@contoso.example signed in successfully from the spraying IP. Treat the account as compromised:
    revoke sessions, reset the password and check what it did after sign-in.'
  verify:
    artifact: signin_logs.csv
    op: set
    pattern: ^[^,]+,([^,]+),203\.0\.113\.99,[^,]+,0,
- prompt: Which application did the sprayer use to sign in?
  type: text
  accepted:
  - Azure Active Directory PowerShell
  hint: Look at AppDisplayName on the sprayer's rows.
  explanation: 'Azure Active Directory PowerShell: a scripted client that ordinary staff never use. Blocking legacy
    and scripting clients through Conditional Access removes much of this attack surface.'
  verify:
    artifact: signin_logs.csv
    op: set
    pattern: ',203\.0\.113\.99,[^,]+,[^,]+,(.+)$'
- prompt: Which KQL query best detects this pattern going forward?
  type: choice
  options:
  - SigninLogs | where ResultType == 50126 | summarize count() by UserPrincipalName | where count_ > 10
  - SigninLogs | where ResultType == 50126 | summarize Users = dcount(UserPrincipalName) by IPAddress, bin(TimeGenerated,
    1h) | where Users >= 10
  - SigninLogs | where ResultType == 0 | summarize count() by Location
  - SigninLogs | take 100
  answer: 1
  hint: A spray is one source hitting many accounts.
  explanation: Counting distinct failed users per IP per hour catches a spray. Counting failures per user (option
    1) catches a brute force but misses a spray, because each account only sees one or two failures.
