slug: lab-siem-password-spray
lesson: siem-kql-basics
title: Detect a password spray in sign-in logs
pass_mark: 80
scenario: |
  You have three hours of Entra ID (Azure AD) sign-in logs as exported from the SigninLogs
  table. `ResultType` 0 is a successful sign-in and 50126 is a wrong username or password.

  Answer the questions the way you would in KQL: filter with `where`, then group with
  `summarize count()` or `dcount()` `by` a column. A brute force tries many passwords against
  one account; a **password spray** tries one or two common passwords against many accounts
  from the same source, to stay under per-account lockout. A spreadsheet pivot table works
  just as well as KQL here.
