slug: lab-cloud-trail-investigation
lesson: cloud-incident-investigation
title: Investigate a leaked access key in CloudTrail
pass_mark: 80
scenario: |
  A cloud posture tool alerted that the S3 bucket holding finance reports became publicly
  readable. You exported the account's CloudTrail management events for the day (one JSON event
  per line, AWS's own documentation account ID).

  The CI/CD pipeline normally deploys from the build server at 192.0.2.50 using the `ci-deploy`
  access key. Work out what happened, what the intruder changed, and what has to be undone.
  `jq` is ideal, for example `jq -r '[.eventTime,.eventName,.sourceIPAddress] | @tsv'`.
artifacts:
- name: cloudtrail.jsonl
  kind: json
  description: CloudTrail management events, one per line.
  content: |
    {"eventTime": "2026-08-04T08:12:03Z", "eventSource": "signin.amazonaws.com", "eventName": "ConsoleLogin", "userIdentity": {"type": "IAMUser", "userName": "alice", "accountId": "111122223333"}, "sourceIPAddress": "192.0.2.20", "userAgent": "Mozilla/5.0", "requestParameters": {}}
    {"eventTime": "2026-08-04T08:15:44Z", "eventSource": "ec2.amazonaws.com", "eventName": "DescribeInstances", "userIdentity": {"type": "IAMUser", "userName": "alice", "accountId": "111122223333"}, "sourceIPAddress": "192.0.2.20", "userAgent": "console.amazonaws.com", "requestParameters": {}}
    {"eventTime": "2026-08-04T09:02:10Z", "eventSource": "s3.amazonaws.com", "eventName": "PutObject", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "192.0.2.50", "userAgent": "aws-sdk-go/1.50.0", "requestParameters": {"bucketName": "web-assets-prod", "key": "app.js"}}
    {"eventTime": "2026-08-04T11:47:31Z", "eventSource": "sts.amazonaws.com", "eventName": "GetCallerIdentity", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {}}
    {"eventTime": "2026-08-04T11:47:58Z", "eventSource": "s3.amazonaws.com", "eventName": "ListBuckets", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {}}
    {"eventTime": "2026-08-04T11:48:40Z", "eventSource": "cloudtrail.amazonaws.com", "eventName": "StopLogging", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {"name": "org-trail"}}
    {"eventTime": "2026-08-04T11:49:12Z", "eventSource": "iam.amazonaws.com", "eventName": "CreateUser", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {"userName": "support-admin"}}
    {"eventTime": "2026-08-04T11:49:20Z", "eventSource": "iam.amazonaws.com", "eventName": "AttachUserPolicy", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {"userName": "support-admin", "policyArn": "arn:aws:iam::aws:policy/AdministratorAccess"}}
    {"eventTime": "2026-08-04T11:49:31Z", "eventSource": "iam.amazonaws.com", "eventName": "CreateAccessKey", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {"userName": "support-admin"}}
    {"eventTime": "2026-08-04T11:52:05Z", "eventSource": "s3.amazonaws.com", "eventName": "PutBucketPolicy", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "198.51.100.23", "userAgent": "aws-cli/2.15.30 Python/3.11.8", "requestParameters": {"bucketName": "fin-reports-prod", "policy": "{\"Statement\": [{\"Effect\": \"Allow\", \"Principal\": \"*\", \"Action\": \"s3:GetObject\"}]}"}}
    {"eventTime": "2026-08-04T12:05:13Z", "eventSource": "s3.amazonaws.com", "eventName": "GetBucketPolicy", "userIdentity": {"type": "IAMUser", "userName": "alice", "accountId": "111122223333"}, "sourceIPAddress": "192.0.2.20", "userAgent": "console.amazonaws.com", "requestParameters": {"bucketName": "web-assets-prod"}}
    {"eventTime": "2026-08-04T12:31:40Z", "eventSource": "s3.amazonaws.com", "eventName": "PutObject", "userIdentity": {"type": "IAMUser", "userName": "ci-deploy", "accountId": "111122223333"}, "sourceIPAddress": "192.0.2.50", "userAgent": "aws-sdk-go/1.50.0", "requestParameters": {"bucketName": "web-assets-prod", "key": "app.css"}}
tasks:
- prompt: Which IAM user's credentials were misused?
  type: text
  accepted:
  - ci-deploy
  hint: Look at userIdentity for the event that changed the finance bucket.
  explanation: ci-deploy's access key was used from an address that is not the build server, so the key has leaked
    (often from a repository or build log).
  verify:
    artifact: cloudtrail.jsonl
    op: set
    pattern: '"eventName": "PutBucketPolicy", "userIdentity": \{[^}]*"userName": "([^"]+)"'
- prompt: What source IP address did the intruder use?
  type: text
  accepted:
  - 198.51.100.23
  hint: Compare sourceIPAddress for ci-deploy events with the build server's 192.0.2.50.
  explanation: 198.51.100.23 made every suspicious call. It is the indicator to search for in other accounts and
    logs.
  verify:
    artifact: cloudtrail.jsonl
    op: set
    pattern: '"eventName": "StopLogging".*"sourceIPAddress": "([^"]+)"'
- prompt: How many API calls did the intruder make from that IP?
  type: number
  accepted:
  - '7'
  hint: Count the events with that sourceIPAddress.
  explanation: 'Seven: they checked whose key it was, listed buckets, stopped logging, built a backdoor admin and
    exposed the bucket.'
  verify:
    artifact: cloudtrail.jsonl
    op: count
    pattern: '"sourceIPAddress": "198\.51\.100\.23"'
- prompt: Which API call did the intruder use to blind defenders?
  type: text
  accepted:
  - StopLogging
  - cloudtrail:StopLogging
  hint: Look for a CloudTrail API call, not an S3 or IAM one.
  explanation: StopLogging switched off the organisation trail. It is defense evasion and should be its own high-severity
    alert; anything after it may be missing from the trail, so check other sources too.
- prompt: What is the name of the backdoor user the intruder created?
  type: text
  accepted:
  - support-admin
  hint: Find CreateUser and read its requestParameters.
  explanation: support-admin was created, given AdministratorAccess and an access key, so the intruder keeps access
    even after ci-deploy's key is rotated. It must be removed along with its keys.
  verify:
    artifact: cloudtrail.jsonl
    op: set
    pattern: '"eventName": "CreateUser".*"requestParameters": \{"userName": "([^"]+)"'
- prompt: Which bucket was made public?
  type: text
  accepted:
  - fin-reports-prod
  hint: Read the bucketName of the PutBucketPolicy event with Principal *.
  explanation: fin-reports-prod received a policy allowing anyone to GetObject. Restore Block Public Access, review
    S3 access logs for downloads since 11:52, and assess whether this is a reportable data breach.
  verify:
    artifact: cloudtrail.jsonl
    op: set
    pattern: '"eventName": "PutBucketPolicy".*"bucketName": "([^"]+)"'
