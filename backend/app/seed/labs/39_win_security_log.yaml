tasks:
- prompt: Which account did the attacker log on with?
  type: text
  accepted:
  - j.parker
  hint: Find failed remote logons followed by a success from the same external address.
  explanation: 'j.parker: six bad passwords over Remote Desktop (logon type 10) from 203.0.113.140, then a success.
    A guessed or sprayed password on an internet-exposed RDP service.'
  verify:
    artifact: security_events.txt
    op: set
    pattern: \|4625\|([^|]+)\|
- prompt: How many failed logons came before the successful one?
  type: number
  accepted:
  - '6'
  hint: Count event 4625.
  explanation: Six. A lockout threshold of five would have stopped this attempt.
  verify:
    artifact: security_events.txt
    op: count
    pattern: \|4625\|
- prompt: What account did the attacker create?
  type: text
  accepted:
  - svc_update2
  hint: Event 4720's target account.
  explanation: svc_update2, named to look like a service account so that nobody questions it. It is the attacker's
    way back in.
  verify:
    artifact: security_events.txt
    op: set
    pattern: \|4720\|[^|]+\|([^|]+)\|
- prompt: Which local group was the new account added to?
  type: text
  accepted:
  - Administrators
  hint: Read the 4732 event.
  explanation: Administrators, giving the backdoor account full control of the server.
  verify:
    artifact: security_events.txt
    op: set
    pattern: \|4732\|.*local group (\w+)$
- prompt: Which event ID shows the attacker covering their tracks?
  type: number
  accepted:
  - '1102'
  hint: Look for the event about the log itself.
  explanation: 1102, the audit log was cleared. It almost never happens legitimately on a server and should alert
    on its own; it is also why forwarding logs off the host matters.
  verify:
    artifact: security_events.txt
    op: set
    pattern: \|(\d+)\|[^|]+\|[^|]+\|The audit log was cleared
- prompt: What should happen first?
  type: choice
  options:
  - Re-enable log forwarding and wait for more events
  - Disable svc_update2, reset j.parker's password and revoke its sessions, block 203.0.113.140 and close RDP to
    the internet, then scope what else was touched
  - Delete the Security log copy to save space
  - Rename svc_update2
  answer: 1
  hint: Remove the attacker's access, then the entry point.
  explanation: Cut off both accounts the attacker controls, remove the exposed RDP entry point, and only then investigate
    the rest. Clearing the log suggests other actions you cannot see.
