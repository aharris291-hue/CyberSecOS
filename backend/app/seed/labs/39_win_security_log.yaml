slug: lab-win-security-log
lesson: win-event-logs
title: Reconstruct a break-in from the Windows Security log
pass_mark: 80
scenario: |
  Server **SRV-APP-01** stopped forwarding events to the SIEM at 22:00 on 22 September. A copy
  of its Security log, collected earlier by a scheduled task, survived. You have the relevant
  events in a simplified form: event ID, the account that did it (subject), the account it was
  done to (target) and a description.

  Event IDs to know: 4624 logon, 4625 failed logon, 4672 admin-level logon, 4720 user created,
  4732 member added to a local group, 1102 audit log cleared.
artifacts:
- name: security_events.txt
  kind: csv
  description: Security log events from SRV-APP-01 (pipe-separated, UTC).
  content: |
