    185.243.115.84,ipv4,high,2026-09-20,2026-11-20,Cobalt Strike team server
    update-cdn.example,domain,high,2026-09-28,2026-12-28,Macro dropper second stage
    45.9.20.13,ipv4,medium,2026-03-01,2026-06-01,Old scanning infrastructure (expired)
    paste-share.example,domain,low,2026-10-01,2026-11-01,Paste site used for staging; also used legitimately
    8.8.8.8,ipv4,low,2026-10-05,2026-11-05,Feed error: public DNS resolver listed by mistake
