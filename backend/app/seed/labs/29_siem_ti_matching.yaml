slug: lab-siem-ti-matching
lesson: siem-threat-intel-matching
title: Match a threat-intel feed against network logs
pass_mark: 80
scenario: |
  A new threat-intelligence feed has been loaded into the SIEM watchlist and the analysis date
  is **2026-10-14**. Before trusting the matches, check the feed: indicators have a confidence
  level and an expiry date, and feeds contain mistakes.

  Then match the feed against the day's outbound connections. A match is a lead, weighted by
  the indicator's confidence and context, not an automatic incident. Expired indicators and
  obvious feed errors should not raise alerts at all.
