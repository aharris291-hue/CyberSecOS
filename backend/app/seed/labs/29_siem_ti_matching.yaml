tasks:
- prompt: Which feed indicator is a feed error that should be removed before matching?
  type: text
  accepted:
  - 8.8.8.8
  hint: Which indicator is a well-known public service that every host uses?
  explanation: 8.8.8.8 is Google's public DNS resolver; matching it would alert on almost every host. Allow-listing
    well-known services before matching is a standard feed hygiene step.
- prompt: Which indicator has expired by the analysis date?
  type: text
  accepted:
  - 45.9.20.13
  hint: Compare each expires date with 2026-10-14.
  explanation: 45.9.20.13 expired in June. Infrastructure is reassigned quickly, so an old IP indicator is more
    likely to hit an innocent new owner than the attacker.
  verify:
    artifact: ti_feed.csv
    op: set
    pattern: ^([^,]+),[^,]+,[^,]+,[^,]+,2026-0[1-9]-\d\d,
- prompt: Which hosts matched a high-confidence, unexpired indicator? List them separated by commas.
  type: set
  accepted:
  - WS-117, WS-130
  hint: Match the two high-confidence indicators against dest_ip and dest_domain.
  explanation: WS-117 talked to a Cobalt Strike team server twice and WS-130 contacted the macro-dropper domain.
    Both deserve an incident ticket.
  verify:
    artifact: connections.csv
    op: set
    pattern: ^[^,]+,([^,]+),(?:185\.243\.115\.84,|[^,]+,update-cdn\.example$)
- prompt: How many connections went to the Cobalt Strike team server?
  type: number
  accepted:
  - '2'
  hint: Count rows with that dest_ip.
  explanation: Two connections five minutes apart, consistent with a beacon. Check the host's process telemetry
    for which process made them.
  verify:
    artifact: connections.csv
    op: count
    pattern: ',185\.243\.115\.84,'
- prompt: WS-102 matched paste-share.example (low confidence). What is the right handling?
  type: choice
  options:
  - Isolate WS-102 immediately
  - 'Treat it as a low-priority lead: check which process and user made the connection and whether anything was
    posted, then decide'
  - Ignore it because low-confidence indicators are never useful
  - Block every paste site and close the alert
  answer: 1
  hint: The feed itself says the site has legitimate uses.
  explanation: Low confidence plus a dual-use site means investigate quickly, not escalate blindly. The context
    (which process, what was uploaded) decides whether it is staging or a developer sharing a snippet.
