tasks:
- prompt: Which destination server name is being beaconed to?
  type: text
  accepted:
  - cdn-metrics.example
  hint: Group by server_name and look for one contacted at a steady rate by a single host with near-identical byte
    counts.
  explanation: cdn-metrics.example is contacted every five minutes by one host with ~312 bytes out and ~228 back
    each time, while every other site is visited irregularly by several hosts.
  verify:
    artifact: conn.log
    op: top
    pattern: ^\d+\t\S+\t(\S+)\t
- prompt: Which internal host is beaconing?
  type: text
  accepted:
  - 10.1.4.23
  hint: Which id.orig_h talks to that server name?
  explanation: 'Only 10.1.4.23 talks to cdn-metrics.example. It also browses normally, which is typical: the implant
    runs alongside the user.'
  verify:
    artifact: conn.log
    op: set
    pattern: ^\d+\t(\S+)\tcdn-metrics\.example\t
- prompt: What is the beacon interval, in seconds?
  type: number
  accepted:
  - '300'
  tolerance: 5
  hint: Subtract consecutive ts values for that host and destination and take the typical gap.
  explanation: The gaps cluster tightly around 300 seconds with a few seconds of jitter. Jitter is added by C2 frameworks
    to dodge naive fixed-interval detections, but the spread is still tiny compared with human browsing.
  verify:
    artifact: conn.log
    op: median_interval
    pattern: ^(\d+)\t\S+\tcdn-metrics\.example\t
- prompt: How many beacon connections are in the log?
  type: number
  accepted:
  - '19'
  hint: Count rows to that server name.
  explanation: 19 connections across the window, one every five minutes, without a pause, even when the user was
    idle.
  verify:
    artifact: conn.log
    op: count
    pattern: \tcdn-metrics\.example\t
- prompt: Which pair of traits most strongly marks this traffic as a beacon rather than browsing?
  type: choice
  options:
  - It uses port 443 and TLS
  - Regular timing and near-constant request and response sizes
  - The destination is a CDN-style name
  - The host also visits Microsoft services
  answer: 1
  hint: Most normal traffic is also TLS on 443.
  explanation: Machine-like regularity in both time and size is the beacon signature. Port 443 and plausible names
    are what the attacker uses to blend in, so on their own they prove nothing.
