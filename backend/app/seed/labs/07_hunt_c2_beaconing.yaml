slug: lab-hunt-c2-beaconing
lesson: hunt-c2-beaconing
title: Hunt for command-and-control beaconing
pass_mark: 80
scenario: |
  Hypothesis: an implant on the user subnet is calling home on a timer. You have 95 minutes of
  Zeek-style connection metadata for five workstations (tab-separated; `ts` is Unix epoch
  seconds). Browsing is bursty and irregular; malware check-ins are regular and the same size
  each time.

  Find the beacon, measure it, and describe why it stands out. Tools such as
  `awk -F'\t'`, `sort` and `uniq -c` or a spreadsheet are all you need.
