name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build CyberSecOS.sln --configuration Release
      - run: dotnet test CyberSecOS.sln --configuration Release --no-build
      - name: Package Windows build
        shell: pwsh
        run: |
          $out = "../dist/CyberSecOS"
          dotnet publish src/CyberSecOS.Desktop/CyberSecOS.Desktop.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o "$out/app"
          New-Item -ItemType Directory "$out/backend" | Out-Null
          Copy-Item -Recurse ../backend/app "$out/backend/app"
          Copy-Item ../backend/requirements.txt "$out/backend/"
          Copy-Item "../scripts/Start CyberSecOS.bat" "$out/"
          Copy-Item ../docs/15_WINDOWS_QUICKSTART.md "$out/README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: CyberSecOS-windows
          path: dist/
          retention-days: 30
